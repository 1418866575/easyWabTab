# =============================================================================
# easy-web-tab —— 静态 + 同源后端代理 部署配置（推荐：含「添加网站自动抓元数据」）
# -----------------------------------------------------------------------------
# 适用场景：
#   - 需要「添加网站时自动抓取标题/图标」（POST /api/fetch-meta）
#   - 需要「云同步 WebDAV 代理」（POST /api/webdav-proxy）
#   这两个接口由 Node 服务 scripts/serve-with-rewrites.cjs（监听 16718）提供，
#   纯静态部署下不存在 → 访问会 405。本配置用 nginx 反代 /api/ 到该服务。
#
# 用法：
#   1. 把本文件上传到服务器 /etc/nginx/conf.d/easy-web-tab.conf
#   2. 上传 dist/ 到 root 路径；同时上传 server.cjs 和 scripts/serve-with-rewrites.cjs
#      到项目根目录（server.cjs 会 require scripts/serve-with-rewrites.cjs，二者需同级）
#   3. 起 Node 服务（见文件末尾说明），监听 127.0.0.1:16718
#   4. 改 server_name 为实际域名（IP 直访写 _）
#   5. 校验并重载： sudo nginx -t && sudo nginx -s reload
#
# 若服务器没有 Node / 不想跑 Node 服务：把下面 location /api/ 整段注释掉即可，
#   前端会自动回退到 jina.ai / allorigins.win（海外服务，国内可能慢或不通）。
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 改成你的域名，例如 www.codehelp.com.cn；IP 直访写 _

    # 前端构建产物目录（dist/ 上传到此处，静态文件由 nginx 直接 serve，性能最好）
    root /var/www/easy-web-tab/dist;
    index index.html;

    # ===== 文本资源压缩（关键性能项）=====
    # 实测：入口 index.js 约 2.25MB、index.css 约 863KB 均以「未压缩」方式传输，
    # 开启 gzip 后约可压到 1/4~1/5，首屏加载显著加快（尤其弱网/跨地域）。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ===== SPA History 路由 fallback（关键！）=====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 contenthash 的静态资源：可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===== 同源后端代理：反代 /api/* 到 Node 服务（16718）=====
    # fetch-meta / webdav-proxy 等接口由 Node 处理，浏览器无 CORS、国内服务器出网可达
    location /api/ {
        # 云同步信封（webdav-proxy）上传体可达数 MB，默认 1m 会触发 413，放开到 10m
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:16718;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 抓取元数据可能较慢，放宽超时
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ===== 微信公众号代理：反代 /api/wechat 到独立 Node 服务（16720）=====
    # scripts/wechat-proxy.cjs 持有 AppSecret、调用草稿箱/素材接口；仅本机 127.0.0.1 可达
    location /api/wechat {
        client_max_body_size 12m;   # 封面/正文图可能数 MB
        proxy_pass http://127.0.0.1:16720;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;      # 微信接口 + 图片上传可能较慢
        proxy_connect_timeout 10s;
    }

    server_tokens off;
}

# -----------------------------------------------------------------------------
# 启动 Node 服务（在服务器上执行，监听 127.0.0.1:16718）
# -----------------------------------------------------------------------------
#   前置：服务器装 Node 18+（构建时已用）
#
#   方式一（简单，前台调试）：
#     cd /var/www/easy-web-tab
#     node server.cjs
#
#   方式二（推荐，pm2 守护进程，崩溃自启）：
#     npm install -g pm2          # 若未装
#     cd /var/www/easy-web-tab
#     pm2 start server.cjs --name easy-web-tab
#     pm2 save                    # 开机自启：pm2 startup
#
#   说明：
#     - server.cjs 会自动 require scripts/serve-with-rewrites.cjs，
#       该文件用 Node 标准库实现 /api/fetch-meta 与 /api/webdav-proxy，
#       基础版【零额外依赖】即可运行（metascraper / playwright 为可选增强，
#       未安装时自动回退到正则解析，不影响功能）。
#     - 进阶增强（可选）：npm install metascraper metascraper-title metascraper-description
#       （更准的标题/描述提取）；playwright 提供 JS 渲染兜底（需下载浏览器，较重）。
#     - 微信公众号代理（可选，启用"发布到公众号草稿箱"时才需要）：
#         node scripts/wechat-proxy.cjs        # 默认监听 127.0.0.1:16720
#         # 或 pm2 常驻：
#         pm2 start scripts/wechat-proxy.cjs --name easy-wechat-proxy
#       凭证由设置页写入，落盘 config/wechat.env（gitignore，仅后端可读）；
#       公众号后台需把本机出口 IP 加入 IP 白名单，否则获取 token 报 40164/61004。
# -----------------------------------------------------------------------------

