<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron 表达式生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>⏰ Cron 表达式生成器</h1>
            <p class="subtitle">生成、验证、描述Cron表达式，计算未来执行时间</p>
        </header>

        <div class="main-content">
            <!-- 字段选择区 -->
            <div class="generator-panel">
                <div class="panel-header">
                    <h2>Cron 表达式构建</h2>
                </div>
                <div class="panel-body">
                    <div class="fields-grid">
                        <div class="field-group">
                            <label>分钟 (0-59)</label>
                            <select id="cron-minute" onchange="onFieldChange('minute')">
                                <option value="*" selected>每分钟 (*)</option>
                                <option value="0">0</option>
                                <option value="15">15</option>
                                <option value="30">30</option>
                                <option value="45">45</option>
                                <option value="0,30">0,30 (每半小时)</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="cron-minute-custom" class="custom-input" placeholder="如 */5, 1-30, 1,15,30" style="display: none;">
                        </div>
                        <div class="field-group">
                            <label>小时 (0-23)</label>
                            <select id="cron-hour" onchange="onFieldChange('hour')">
                                <option value="*" selected>每小时 (*)</option>
                                <option value="0">0 (午夜)</option>
                                <option value="6">6 (清晨)</option>
                                <option value="9">9 (上午)</option>
                                <option value="12">12 (中午)</option>
                                <option value="18">18 (傍晚)</option>
                                <option value="9-17">9-17 (工作时间)</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="cron-hour-custom" class="custom-input" placeholder="如 */2, 9-17, 1,12,18" style="display: none;">
                        </div>
                        <div class="field-group">
                            <label>日期 (1-31)</label>
                            <select id="cron-day" onchange="onFieldChange('day')">
                                <option value="*" selected>每天 (*)</option>
                                <option value="1">1日</option>
                                <option value="15">15日</option>
                                <option value="1,15">1日和15日</option>
                                <option value="1,10,20">1日、10日、20日</option>
                                <option value="L">最后一日 (L)</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="cron-day-custom" class="custom-input" placeholder="如 */2, 1-15, 1,15,30" style="display: none;">
                        </div>
                        <div class="field-group">
                            <label>月份 (1-12)</label>
                            <select id="cron-month" onchange="onFieldChange('month')">
                                <option value="*" selected>每月 (*)</option>
                                <option value="1">1月</option>
                                <option value="3,6,9,12">每季度 (3,6,9,12)</option>
                                <option value="6-8">6-8月 (夏季)</option>
                                <option value="1,12">1月和12月</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="cron-month-custom" class="custom-input" placeholder="如 */3, 1-6, 1,6,12" style="display: none;">
                        </div>
                        <div class="field-group">
                            <label>星期 (0-6)</label>
                            <select id="cron-weekday" onchange="onFieldChange('weekday')">
                                <option value="*" selected>每天 (*)</option>
                                <option value="0">周日</option>
                                <option value="1">周一</option>
                                <option value="2">周二</option>
                                <option value="3">周三</option>
                                <option value="4">周四</option>
                                <option value="5">周五</option>
                                <option value="6">周六</option>
                                <option value="1-5">工作日 (1-5)</option>
                                <option value="0,6">周末 (0,6)</option>
                                <option value="custom">自定义...</option>
                            </select>
                            <input type="text" id="cron-weekday-custom" class="custom-input" placeholder="如 */2, 1-5, 0,6" style="display: none;">
                        </div>
                    </div>

                    <!-- 生成的表达式显示 -->
                    <div class="expression-preview">
                        <div class="preview-label">生成的表达式：</div>
                        <div class="preview-value" id="expression-preview">* * * * *</div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="generateAndDisplay()">生成并显示详情</button>
                        <button class="btn btn-secondary" onclick="copyExpression()">复制表达式</button>
                    </div>
                </div>
            </div>

            <!-- 结果显示区 -->
            <div class="result-panel" id="result-panel" style="display: none;">
                <div class="panel-header">
                    <h2>执行结果</h2>
                </div>
                <div class="panel-body">
                    <div class="result-content" id="result-content">
                        <!-- 结果将通过JS动态填充 -->
                    </div>
                </div>
            </div>

            <!-- 验证区 -->
            <div class="validate-panel">
                <div class="panel-header">
                    <h2>Cron 表达式验证</h2>
                </div>
                <div class="panel-body">
                    <div class="validate-input-group">
                        <input type="text" id="validate-input" placeholder="输入Cron表达式验证 (如: 0 9 * * 1-5)">
                        <button class="btn btn-primary" onclick="validateExpression()">验证</button>
                    </div>
                    <div class="validation-result" id="validation-result" style="display: none;"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Cron 表达式格式: 分钟 小时 日期 月份 星期</p>
            <p class="help-text">例如: 0 9 * * 1-5 表示每个工作日的早上9点</p>
        </footer>
    </div>

    <div class="toast" id="toast" style="display: none;"></div>

    <script src="app.js"></script>
</body>
</html>
