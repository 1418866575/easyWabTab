<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗集 一键珍藏版</title>
<style>
/* ============================================
   古诗集 - 古籍书本翻页样式
   ============================================ */

/* CSS 变量 */
:root {
  --bg-color: #f5f0e8;
  --text-color: #3a3226;
  --text-secondary: #6b5d4e;
  --accent-color: #8b4513;
  --accent-light: #d4a574;
  --card-bg: #faf6ef;
  --card-border: #e8ddd0;
  --toolbar-bg: #f0e9dd;
  --shadow-color: rgba(0,0,0,0.1);
  --font-size: 16px;
  --font-family: 'Noto Serif SC', 'STSong', 'SimSun', 'KaiTi', serif;
  --line-height: 1.8;
  --page-width: 1100px;
  --page-gap: 4px;
}

[data-theme="dark"] {
  --bg-color: #1a1a2e;
  --text-color: #e8e0d0;
  --text-secondary: #b0a898;
  --accent-color: #c49a6c;
  --accent-light: #8b7355;
  --card-bg: #22223a;
  --card-border: #3a3a5a;
  --toolbar-bg: #1e1e36;
  --shadow-color: rgba(0,0,0,0.3);
}

[data-font-size="small"] { --font-size: 14px; }
[data-font-size="medium"] { --font-size: 16px; }
[data-font-size="large"] { --font-size: 20px; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  font-size: var(--font-size);
  line-height: var(--line-height);
  color: var(--text-color);
  background: var(--bg-color);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ========= 古籍装饰元素 ========= */
.corner-decor {
  position: absolute;
  width: 30px;
  height: 30px;
  border-color: var(--accent-light);
  border-style: solid;
}
.corner-decor.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
.corner-decor.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
.corner-decor.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
.corner-decor.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

/* ========= 封面 ========= */
.book-wrapper {
  max-width: var(--page-width);
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

.book-cover {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, #f5f0e8 0%, #e8ddd0 100%);
  position: relative;
  border: 12px double var(--accent-light);
  box-shadow: inset 0 0 60px rgba(139,69,19,0.08);
}

[data-theme="dark"] .book-cover {
  background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
  border-color: #5a4a3a;
}

.cover-content { max-width: 500px; position: relative; z-index: 1; }

.cover-frame {
  border: 1px solid var(--accent-light);
  padding: 40px 50px;
  position: relative;
}
.cover-frame::before {
  content: '';
  position: absolute;
  top: 10px; left: 10px; right: 10px; bottom: 10px;
  border: 1px solid var(--accent-light);
  pointer-events: none;
}

.cover-corner {
  position: absolute;
  width: 20px; height: 20px;
}
.cover-corner.tl { top: 5px; left: 5px; border-top: 2px solid var(--accent-color); border-left: 2px solid var(--accent-color); }
.cover-corner.tr { top: 5px; right: 5px; border-top: 2px solid var(--accent-color); border-right: 2px solid var(--accent-color); }
.cover-corner.bl { bottom: 5px; left: 5px; border-bottom: 2px solid var(--accent-color); border-left: 2px solid var(--accent-color); }
.cover-corner.br { bottom: 5px; right: 5px; border-bottom: 2px solid var(--accent-color); border-right: 2px solid var(--accent-color); }

.cover-decoration {
  width: 80px; height: 3px;
  background: var(--accent-color);
  margin: 0 auto 30px;
  position: relative;
}
.cover-decoration::before,
.cover-decoration::after {
  content: '◈';
  position: absolute;
  font-size: 0.7em;
  color: var(--accent-light);
  top: 50%; transform: translateY(-50%);
}
.cover-decoration::before { left: -20px; }
.cover-decoration::after { right: -20px; }

.cover-title {
  font-size: 3.5em; font-weight: 900;
  color: var(--accent-color);
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  margin-bottom: 15px;
  text-shadow: 2px 2px 4px rgba(139,69,19,0.15);
}

.cover-subtitle {
  font-size: 1.2em; color: var(--text-secondary);
  letter-spacing: 0.3em; margin-bottom: 10px;
}
.cover-annotation {
  font-size: 0.95em; color: var(--text-secondary);
  margin-bottom: 25px; letter-spacing: 0.1em;
}
.cover-divider { font-size: 1.5em; color: var(--accent-light); margin-bottom: 20px; }
.cover-motto {
  font-size: 1.3em; color: var(--accent-color);
  font-style: italic; letter-spacing: 0.15em;
}

.cover-decoration-bottom {
  width: 50px; height: 2px;
  background: var(--accent-light);
  margin: 25px auto 0;
  position: relative;
}
.cover-decoration-bottom::before,
.cover-decoration-bottom::after {
  content: '❦';
  position: absolute;
  font-size: 0.8em;
  color: var(--accent-light);
  top: 50%; transform: translateY(-50%);
}
.cover-decoration-bottom::before { left: -18px; }
.cover-decoration-bottom::after { right: -18px; }

.book-spine {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 20px;
  background: linear-gradient(to right, transparent, rgba(139,69,19,0.05));
  border-right: 1px solid rgba(139,69,19,0.1);
}

.enter-btn {
  margin-top: 40px;
  padding: 14px 48px;
  font-size: 1.1em;
  font-family: var(--font-family);
  background: var(--accent-color);
  color: #fff;
  border: 2px solid var(--accent-color);
  border-radius: 0;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.2em;
  position: relative;
  overflow: hidden;
}
.enter-btn::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px; right: 3px; bottom: 3px;
  border: 1px solid rgba(255,255,255,0.2);
  pointer-events: none;
}
.enter-btn:hover {
  background: #a0522d;
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(139,69,19,0.3);
}

/* ========= 学段选择页（古籍书风） ========= */
.book-select {
  min-height: 100vh;
  background: var(--card-bg);
  display: flex;
  flex-direction: column;
  padding: 0 0 30px;
  border-left: 1px solid var(--card-border);
  border-right: 1px solid var(--card-border);
  position: relative;
}

/* 选择页顶部书眉 */
.select-header {
  display: flex;
  align-items: center;
  padding: 14px 24px;
  border-bottom: 1px solid var(--card-border);
  background: var(--toolbar-bg);
  gap: 10px;
}
.select-header span {
  font-size: 1.1em;
  color: var(--accent-color);
  font-weight: 600;
  letter-spacing: 0.15em;
}

/* 选择页标题区 */
.select-title-area {
  text-align: center;
  padding: 30px 20px 10px;
  position: relative;
}
.select-title-area .select-main-title {
  font-size: 1.8em;
  font-weight: 900;
  color: var(--accent-color);
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  margin-bottom: 6px;
}
.select-title-area .select-sub-title {
  font-size: 0.9em;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
}
.select-title-area::after {
  content: '❦';
  display: block;
  font-size: 1em;
  color: var(--accent-light);
  margin-top: 12px;
}

/* 双页展开 */
.select-spread {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  max-width: 760px;
  margin: 8px auto;
  flex: 1;
  width: 100%;
  padding: 0 16px;
}

/* 左右页 */
.select-page {
  flex: 1;
  max-width: 370px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px;
}

.select-left {
  border-right: 1px solid var(--card-border);
  padding-right: 20px;
}
.select-right {
  padding-left: 20px;
}

/* 书脊 */
.select-fold {
  width: 4px;
  background: linear-gradient(to right,
    rgba(0,0,0,0.03), rgba(0,0,0,0.08), rgba(0,0,0,0.03));
  flex-shrink: 0;
}
[data-theme="dark"] .select-fold {
  background: linear-gradient(to right,
    rgba(0,0,0,0.10), rgba(0,0,0,0.22), rgba(0,0,0,0.10));
}

/* 选择卡片（线装书风格） */
.select-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 16px;
  cursor: pointer;
  transition: all 0.35s;
  text-align: center;
  position: relative;
  background: var(--bg-color);
  border: 1px solid var(--card-border);
  box-shadow: 0 2px 8px var(--shadow-color);
  overflow: hidden;
  min-height: 148px;
}

/* 卡片顶部装饰线 */
.select-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 3px;
  background: linear-gradient(to right, transparent, var(--accent-light), transparent);
  transition: all 0.35s;
}

/* 卡片四角装饰点 */
.select-card::after {
  content: '◆';
  position: absolute;
  bottom: 6px;
  right: 10px;
  font-size: 0.4em;
  color: var(--accent-light);
  opacity: 0.3;
  transition: opacity 0.35s;
}

.select-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 28px var(--shadow-color);
  background: var(--card-bg);
}
.select-card:hover::before {
  left: 10%;
  right: 10%;
  background: linear-gradient(to right, transparent, var(--accent-color), transparent);
}
.select-card:hover::after {
  opacity: 0.8;
}

/* 卡片图标 */
.select-icon {
  font-size: 2.2em;
  margin-bottom: 6px;
  transition: transform 0.35s;
}
.select-card:hover .select-icon {
  transform: scale(1.12);
}

/* 卡片标题 */
.select-title {
  font-size: 1.4em;
  font-weight: 700;
  color: var(--accent-color);
  letter-spacing: 0.25em;
  text-indent: 0.25em;
  margin-bottom: 3px;
}

/* 卡片数量标签 */
.select-count {
  display: inline-block;
  font-size: 0.75em;
  color: #fff;
  background: var(--accent-light);
  padding: 2px 12px;
  margin-bottom: 6px;
  letter-spacing: 0.1em;
}

/* 卡片描述 */
.select-desc {
  font-size: 0.82em;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* 响应式 */
@media (max-width: 768px) {
  .select-title-area .select-main-title {
    font-size: 1.4em;
  }
  .select-spread {
    flex-direction: column;
    align-items: center;
  }
  .select-fold { display: none; }
  .select-left, .select-right {
    border: none;
    padding: 8px 0;
    max-width: 100%;
    width: 100%;
  }
  .select-card {
    min-height: 120px;
    padding: 20px 16px;
  }
}

/* ========= 头部区域（可隐藏） ========= */
.book-header {
  transition: max-height 0.35s ease, opacity 0.3s ease;
  max-height: 300px;
  opacity: 1;
  overflow: hidden;
}

.header-hidden .book-header {
  max-height: 0;
  opacity: 0;
  padding: 0;
  margin: 0;
  border: none;
}

/* 头部隐藏后，内容区上移 */
.header-hidden .book-area {
  padding-top: 8px;
}

/* 工具栏头部隐藏切换按钮 */
.header-toggle {
  font-size: 0.7em !important;
  padding: 4px 6px !important;
  margin-left: 4px;
}
.header-toggle:hover {
  background: var(--accent-color) !important;
  color: #fff !important;
}

/* 头部隐藏后的浮动恢复按钮 */
.show-header-float {
  display: none;
  width: 100%;
  padding: 8px;
  font-family: var(--font-family);
  font-size: 0.85em;
  color: var(--accent-color);
  background: var(--toolbar-bg);
  border: none;
  border-bottom: 1px solid var(--card-border);
  cursor: pointer;
  text-align: center;
  transition: background 0.2s;
}
.show-header-float:hover {
  background: var(--accent-light);
  color: #fff;
}

/* ========= 工具栏 + Tabs + 筛选（保留） ========= */
.toolbar {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 12px;
  flex-wrap: wrap;
}
.toolbar-left { display: flex; align-items: center; gap: 8px; }
.toolbar-title { font-size: 1.1em; font-weight: 700; color: var(--accent-color); }
.toolbar-center { flex: 1; min-width: 200px; }
.search-box { position: relative; max-width: 400px; }
.search-box input {
  width: 100%; padding: 8px 36px 8px 14px;
  border: 1px solid var(--card-border);
  border-radius: 20px;
  font-family: var(--font-family);
  font-size: 0.9em;
  background: var(--card-bg);
  color: var(--text-color);
  transition: border-color 0.3s;
}
.search-box input:focus { outline: none; border-color: var(--accent-color); }
.search-icon {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%); font-size: 0.9em;
}
.toolbar-right { display: flex; gap: 6px; }
.tool-btn {
  padding: 6px 12px;
  border: 1px solid var(--card-border);
  border-radius: 0;
  background: var(--card-bg);
  color: var(--text-color);
  cursor: pointer;
  font-family: var(--font-family);
  font-size: 0.85em;
  transition: background 0.2s;
}
.tool-btn:hover { background: var(--accent-light); color: #fff; }



.filter-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: var(--bg-color);
  border-bottom: 1px solid var(--card-border);
  flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-group label { font-size: 0.85em; color: var(--text-secondary); white-space: nowrap; }
.filter-group select {
  padding: 4px 8px;
  border: 1px solid var(--card-border);
  border-radius: 0;
  font-family: var(--font-family); font-size: 0.85em;
  background: var(--card-bg); color: var(--text-color);
}
.result-count { margin-left: auto; font-size: 0.85em; color: var(--text-secondary); }

/* ==================== 书本核心 ==================== */
.book-area {
  position: relative;
  padding: 20px;
  min-height: 500px;
}

/* 书本展开（双页并排） */
.book-spread {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  max-width: 960px;
  margin: 0 auto;
  position: relative;
}

/* 单页 */
.page {
  flex: 1;
  min-height: 520px;
  max-width: 480px;
  background: var(--card-bg);
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 40px 36px 50px;
  box-shadow: 0 2px 20px var(--shadow-color);
}

/* 左右页不同阴影 */
.page-left {
  border-right: 1px solid var(--card-border);
  box-shadow: -2px 2px 15px var(--shadow-color);
  border-radius: 2px 0 0 2px;
}

.page-right {
  border-left: 1px solid var(--card-border);
  box-shadow: 2px 2px 15px var(--shadow-color);
  border-radius: 0 2px 2px 0;
}

/* 书脊折叠效果 */
.book-fold {
  width: var(--page-gap);
  min-height: 520px;
  background: linear-gradient(to right,
    rgba(0,0,0,0.04) 0%,
    rgba(0,0,0,0.08) 30%,
    rgba(0,0,0,0.12) 50%,
    rgba(0,0,0,0.08) 70%,
    rgba(0,0,0,0.04) 100%
  );
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

[data-theme="dark"] .book-fold {
  background: linear-gradient(to right,
    rgba(0,0,0,0.15) 0%,
    rgba(0,0,0,0.25) 30%,
    rgba(0,0,0,0.35) 50%,
    rgba(0,0,0,0.25) 70%,
    rgba(0,0,0,0.15) 100%
  );
}

/* 页面内容区 */
.page-content {
  flex: 1;
  overflow-y: auto;
  line-height: var(--line-height);
}

/* 页码 */
.page-number {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.8em;
  color: var(--text-secondary);
  font-feature-settings: "tnum";
  pointer-events: none;
}

/* ========= 页面内容排版 ========= */
/* 诗标题 */
.page-title {
  font-size: 1.5em;
  font-weight: 700;
  color: var(--accent-color);
  text-align: center;
  margin-bottom: 4px;
}

.page-meta {
  text-align: center;
  font-size: 0.85em;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

/* 诗正文行 */
.poem-line {
  display: block;
  margin-bottom: 0.5em;
  line-height: 2.2;
  text-align: center;
}

/* 收藏按钮在页面上方 */
.page-bookmark {
  position: absolute;
  top: 8px;
  right: 12px;
  background: none;
  border: none;
  font-size: 1.3em;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity 0.2s;
  z-index: 5;
}
.page-bookmark:hover,
.page-bookmark.active { opacity: 1; }
.page-bookmark.active { color: #f0c040; }

/* 注释/译文段落 */
.page-section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--card-border);
  font-size: 0.85em;
  color: var(--text-secondary);
}
.page-section h3 {
  font-size: 0.9em;
  color: var(--accent-color);
  margin-bottom: 6px;
  font-weight: 600;
}

/* 分页继续标记（跨页诗） */
.page-continued {
  font-size: 0.75em;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 12px;
  font-style: italic;
}

/* ========= 页角翻页按钮 ========= */
.page-turn-btn {
  position: absolute;
  bottom: 12px;
  width: 40px;
  height: 40px;
  border: 1px solid var(--accent-light);
  background: var(--card-bg);
  color: var(--accent-color);
  font-size: 1em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
  opacity: 0.5;
  z-index: 10;
  font-family: var(--font-family);
}
.page-turn-btn:hover {
  opacity: 1;
  background: var(--accent-color);
  color: #fff;
  border-color: var(--accent-color);
  transform: scale(1.1);
}
.page-turn-btn:disabled {
  opacity: 0.15;
  cursor: default;
  transform: none;
}
.page-turn-btn:disabled:hover {
  background: var(--card-bg);
  color: var(--accent-color);
  border-color: var(--accent-light);
}

.prev-turn {
  left: 12px;
  border-radius: 0 50% 50% 0;
  border-left: none;
}

.next-turn {
  right: 12px;
  border-radius: 50% 0 0 50%;
  border-right: none;
}

/* ========= 目录 ========= */
.toc-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
}

.toc-panel {
  background: var(--card-bg);
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 30px;
  border: 1px solid var(--card-border);
  box-shadow: 0 10px 40px var(--shadow-color);
}

.toc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent-light);
}
.toc-header h2 {
  font-size: 1.3em;
  color: var(--accent-color);
}
.toc-close {
  background: none;
  border: none;
  font-size: 1.3em;
  cursor: pointer;
  color: var(--text-secondary);
}

.toc-list {
  list-style: none;
}

.toc-item {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.2s;
  border-bottom: 1px dotted var(--card-border);
}
.toc-item:hover {
  background: rgba(139,69,19,0.05);
}

.toc-item-title {
  font-size: 0.95em;
  color: var(--text-color);
  flex: 1;
}

.toc-item-meta {
  font-size: 0.8em;
  color: var(--text-secondary);
  margin: 0 10px;
  white-space: nowrap;
}

.toc-item-page {
  font-size: 0.85em;
  color: var(--accent-color);
  font-weight: 600;
  min-width: 40px;
  text-align: right;
}

.toc-level-label {
  padding: 6px 12px;
  font-size: 0.8em;
  font-weight: 700;
  color: var(--accent-color);
  background: rgba(139,69,19,0.06);
  border-bottom: 1px solid var(--accent-light);
  margin-top: 8px;
}

/* ========= 空状态 ========= */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 3em; margin-bottom: 15px; }

/* ========= Ruby 拼音标注 ========= */
ruby { ruby-align: center; ruby-position: over; }
rt {
  font-size: 0.5em;
  color: var(--text-secondary);
  font-weight: 400;
  user-select: none;
}
#pinyinToggle.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

/* ========= 搜索结果显示 ========= */
#searchPoemsContainer {
  max-width: 600px;
  margin: 0 auto;
}
.search-result-card {
  padding: 16px;
  border: 1px solid var(--card-border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
.search-result-card:hover { background: rgba(139,69,19,0.04); }
.search-result-card .sr-title { font-size: 1.1em; font-weight: 700; color: var(--accent-color); }
.search-result-card .sr-meta { font-size: 0.85em; color: var(--text-secondary); }
.search-result-card .sr-content {
  font-size: 0.9em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 4px;
}

/* ========= 加载动画 ========= */
.book-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
}
.loading-spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--card-border);
  border-top-color: var(--accent-color);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========= 响应式 ========= */
/* 桌面大屏 */
@media (min-width: 1024px) {
  .book-spread { max-width: 960px; }
  .page { min-height: 540px; padding: 44px 40px 54px; }
}

/* 小桌面/平板横屏 */
@media (max-width: 900px) {
  .page { padding: 28px 24px 44px; min-height: 420px; }
  .page-title { font-size: 1.2em; }
}

/* 平板竖屏（单页模式）*/
@media (max-width: 768px) {
  .book-spread { flex-direction: column; align-items: center; }
  .book-fold { display: none; }
  .page {
    max-width: 100%;
    min-height: 380px;
    margin-bottom: 8px;
    border-radius: 2px;
    box-shadow: 0 2px 10px var(--shadow-color);
  }
  .page-left, .page-right { border: 1px solid var(--card-border); }
  .page-number { position: static; margin-top: 8px; }
  .cover-title { font-size: 2.5em; letter-spacing: 0.3em; text-indent: 0.3em; }
  .cover-frame { padding: 25px 20px; }
  .toolbar { padding: 8px 10px; }
  .toolbar-center { order: 3; flex-basis: 100%; }
  .search-box { max-width: 100%; }
  .filter-bar { padding: 8px 10px; }
  .filter-group select { font-size: 0.8em; }
  .book-area { padding: 12px; }
}

/* 手机 */
@media (max-width: 480px) {
  .cover-title { font-size: 2em; }
  .cover-frame { padding: 18px 12px; }
  .page { padding: 20px 16px 36px; min-height: 320px; }
  .page-title { font-size: 1.1em; }
  .toolbar-title { display: none; }
  .tool-btn { padding: 6px 8px; font-size: 0.8em; }
  .filter-bar { flex-direction: column; align-items: stretch; gap: 6px; }
  .filter-group label { min-width: 36px; font-size: 0.8em; }
  .nav-btn { padding: 8px 16px; font-size: 0.8em; }
  .book-area { padding: 8px; }
}

const primarySchoolPoems = [
  // ===== 一年级 =====
  { id: 1, title: '江南', author: '汉乐府', dynasty: '汉', level: 'primary', grade: '一年级',
    content: '江南可采莲，莲叶何田田。鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。',
    notes: '田田：荷叶茂盛的样子。', translation: '【逐句品读】"江南可采莲"——到了江南采莲的季节，满池莲蓬待人采摘。"莲叶何田田"——荷叶多么茂盛碧绿，一片挨着一片。"鱼戏莲叶间"——鱼儿在荷叶间自由穿梭。后四句反复咏唱鱼儿在东西南北四方嬉戏，用回环往复的手法，让人仿佛看到鱼儿欢快游动、处处可观的灵动画面。全诗洋溢着江南水乡丰收的喜悦和生命的活力。',
    tags: ['江南', '采莲', '自然'] },
  { id: 2, title: '长歌行', author: '汉乐府', dynasty: '汉', level: 'primary', grade: '一年级',
    content: '青青园中葵，朝露待日晞。阳春布德泽，万物生光辉。常恐秋节至，焜黄华叶衰。百川东到海，何时复西归？少壮不努力，老大徒伤悲！',
    notes: '晞：晒干。焜黄：枯黄。', translation: '【逐句品读】园中的葵菜青青翠翠，叶片上的朝露等待阳光来晒干。和煦的春天把恩泽洒满大地，世间万物都焕发出生命的光彩。但诗人笔锋一转——常常担心秋天到来，那时叶片枯黄凋落。千万条河流向东奔流入海，何时能再向西流回？人生也是如此啊！最后两句是千古名句：年少时若不努力奋发，等到老迈只能空自悲伤！这首诗用"葵露易晞""秋至叶衰""百川东流"三个比喻层层推进，把珍惜时光的道理讲得透彻有力。',
    tags: ['劝学', '惜时'] },
  { id: 3, title: '敕勒歌', author: '北朝民歌', dynasty: '南北朝', level: 'primary', grade: '一年级',
    content: '敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。',
    notes: '穹庐：蒙古包。见：同"现"。', translation: '【逐句品读】敕勒族人的大草原，就在连绵的阴山脚下。天空像一个巨大的蒙古包，笼罩着四面无边无际的原野。天色苍苍，原野茫茫，一阵风吹过，茂密的牧草低伏下去，露出了成群的牛羊！最后一句"风吹草低见牛羊"是全诗最精彩的一笔——动态的画面让整片草原瞬间有了生命。全诗用质朴的语言勾勒出北方草原辽阔壮美的画卷，让人心旷神怡。',
    tags: ['草原', '民歌'] },
  { id: 4, title: '咏鹅', author: '骆宾王', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。',
    notes: '项：脖子。', translation: '【逐句品读】据说这首诗是骆宾王七岁时所作！开篇三个"鹅"字连呼，如同儿童见到鹅时惊喜的叫声。"曲项向天歌"——鹅弯着长长的脖子朝天鸣叫，姿态优雅又骄傲。"白毛浮绿水"——洁白的羽毛漂浮在碧绿的水面上，色彩对比鲜明。"红掌拨清波"——红色的脚掌在清澈的水波中划动，动静相宜。短短十八个字，从叫声到形态到色彩，一只栩栩如生的白鹅跃然纸上。',
    tags: ['咏物', '动物'] },
  { id: 5, title: '风', author: '李峤', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。',
    notes: '解落：吹落。三秋：晚秋。', translation: '【逐句品读】这是一首精巧的"谜语诗"，通篇不出现"风"字却句句写风。风能吹落晚秋的落叶，又能催开早春二月的鲜花——这是风的温柔与冷酷的两面。风掠过江面能掀起千尺巨浪——这是风的威猛。风穿入竹林能让万竿翠竹倾斜——这是风的无处不在。四句诗从不同角度写出了风的四种形态和力量，观察入微，构思巧妙。',
    tags: ['咏物', '自然'] },
  { id: 6, title: '咏柳', author: '贺知章', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。',
    notes: '妆：装扮。丝绦：丝带。', translation: '【逐句品读】高高的柳树像用碧玉装扮而成的美人。万千柳条垂下来，如同绿色的丝带在风中轻摆。最后两句是千古巧思——"不知细叶谁裁出？二月春风似剪刀。"诗人把春风比作能工巧匠手中的剪刀，这把无形的"剪刀"裁出了满树细嫩的柳叶。整首诗从树身写到枝条再写到叶片，由整体到局部，最后用一个绝妙的比喻点亮全篇。',
    tags: ['咏物', '春天', '贺知章'] },
  { id: 7, title: '回乡偶书', author: '贺知章', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。',
    notes: '偶书：偶然写下的。鬓毛衰：头发斑白稀疏。', translation: '【逐句品读】贺知章三十多岁离乡做官，八十多岁才告老还乡，离开家乡五十多年。前两句对比强烈——年少离家老大才回，口音还是家乡的口音，但鬓发已经斑白稀疏。后两句是全诗最动人的画面：家乡的孩子们看见他，笑着问"客人从哪里来？"——这天真的一问，道尽了游子归乡的复杂心境。自己是主人却被当成了客人，亲切中透着心酸，幽默中含着苍凉。',
    tags: ['思乡', '贺知章'] },
  { id: 8, title: '凉州词', author: '王之涣', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。',
    notes: '仞：古代长度单位。羌笛：乐器。', translation: '【逐句品读】首句写仰望之景——黄河仿佛从远处直上云霄，与白云相连，气势恢宏。第二句写俯瞰之境——一座孤城坐落在万丈高山之中，苍凉孤寂。后两句借笛声抒情：羌笛何必吹奏那哀怨的《折杨柳》曲调呢？春风本来就吹不到玉门关外啊！表面是说春风不到边塞，实质是暗喻朝廷的关怀到不了边关将士身上。表面豁达，内含深沉的悲凉。',
    tags: ['边塞', '王之涣'] },
  { id: 9, title: '登鹳雀楼', author: '王之涣', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '白日依山尽，黄河入海流。欲穷千里目，更上一层楼。',
    notes: '鹳雀楼：山西永济的名楼。', translation: '【逐句品读】前两句写登楼所见——夕阳沿着连绵的群山缓缓落下，黄河向着远方的大海奔流而去。画面壮阔，气象万千。后两句从写景转向哲理——想要看到更远更广阔的风景，就要再登上一层楼。这既是登楼的实情，更是人生的至理：站得越高，看得越远。短短二十个字，写景壮阔，说理深刻，被誉为唐代五言诗的"压卷之作"。',
    tags: ['写景', '哲理', '王之涣'] },
  { id: 10, title: '春晓', author: '孟浩然', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。',
    notes: '晓：天亮。', translation: '【逐句品读】春天的夜晚睡得格外香甜，天亮了都浑然不觉。醒来听到窗外到处是鸟儿的鸣叫声，一片生机盎然。忽然想起昨夜隐隐约约听到的风雨声，不知道那些美丽的花儿被吹落了多少？诗人在最欢快的时刻突然生出一丝惜春的惆怅。这种由喜入惜的情感转折，正是这首诗最动人之处。全诗语言自然天成，如行云流水，却包含了对春光易逝的细腻感悟。',
    tags: ['春天', '孟浩然'] },
  { id: 11, title: '凉州词', author: '王翰', dynasty: '唐', level: 'primary', grade: '一年级',
    content: '葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回？',
    notes: '夜光杯：精美的酒杯。沙场：战场。', translation: '【逐句品读】精美的夜光杯中斟满了西域的葡萄美酒，正要举杯畅饮时，马上的琵琶声却急促地催人出征了。"醉卧沙场君莫笑"——如果我醉倒在战场上，请你不要笑话。最后一句是全诗最深沉之处："古来征战几人回？"自古以来上了战场的人，有几个能活着回来呢？这不是消极悲观，而是一种看透生死后的洒脱与豪迈。明知九死一生，依然举杯痛饮，慷慨赴战——这就是盛唐边塞将士的豪情！',
    tags: ['边塞', '豪放'] },
  { id: 12, title: '出塞', author: '王昌龄', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。',
    notes: '龙城飞将：指汉朝李广将军。', translation: '【逐句品读】"秦时明月汉时关"采用了互文手法——依然是秦汉时期的那轮明月和那道边关，千百年来从未改变。可叹的是那万里远征的将士们，却从未能回家。后两句发出深沉的祈愿：只要还有像李广那样英勇善战的将军坐镇边疆，就绝不会让敌人的铁骑跨越阴山！这首诗被誉为"唐代七绝的压卷之作"，既有历史的厚重感，又有现实的忧患意识。',
    tags: ['边塞', '爱国', '王昌龄'] },
  { id: 13, title: '芙蓉楼送辛渐', author: '王昌龄', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。',
    notes: '冰心：比喻心地纯洁。', translation: '【逐句品读】寒冷的秋雨笼罩着整条江面，在夜色中弥漫到吴地。清晨送别友人，望着远处的楚山，觉得它格外孤寂——其实是诗人自己的孤独。后两句是千古名句：你回到洛阳后，如果亲友问起我，请告诉他们——我的心依然像放在玉壶里的冰块一样，晶莹纯洁，一尘不染。诗人借"冰心玉壶"的比喻，表明自己虽遭贬谪，但品行高洁、初心不改。',
    tags: ['送别', '王昌龄'] },
  { id: 14, title: '鹿柴', author: '王维', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '空山不见人，但闻人语响。返景入深林，复照青苔上。',
    notes: '鹿柴：王维辋川别墅的一景。返景：夕阳返照。', translation: '【逐句品读】空旷的山中看不见一个人影，只隐约听到有人说话的声音从远处传来——以有声反衬无声，更显出深山的幽静。夕阳的余晖穿过密林，斑驳地照在青苔之上。阳光与青苔，一明一暗；短暂的温暖与长久的幽静，形成微妙对比。王维精通绘画与音乐，这首诗正是"诗中有画"的典范——寥寥二十字，便是一幅绝美的山林夕照图。',
    tags: ['山水', '王维'] },
  { id: 15, title: '送元二使安西', author: '王维', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。',
    notes: '浥：湿润。阳关：出塞的关隘。', translation: '【逐句品读】渭城清晨的细雨打湿了路面上的尘土，客舍旁的柳树被雨水洗过，格外青翠新鲜。在这清新明丽的景色中，诗人举起酒杯："劝君更尽一杯酒，西出阳关无故人。"再喝一杯送别的酒吧，一旦出了阳关向西远行，就再也没有老朋友了。这两句之所以千古流传，是因为它道出了所有离别之情——千言万语都化在这一杯酒中。此诗被谱成《阳关三叠》，成为唐代最著名的送别曲。',
    tags: ['送别', '王维'] },
  { id: 16, title: '九月九日忆山东兄弟', author: '王维', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。',
    notes: '茱萸：一种香草，重阳节佩戴。', translation: '【逐句品读】诗人独自漂泊在他乡，每逢佳节就加倍思念亲人。"每逢佳节倍思亲"之所以成为千古名句，是因为它道出了所有游子的共同心声。后两句从对面落笔——诗人不直接写自己思念兄弟，而是想象兄弟们今天登高过节，身上插着茱萸，却发现少了我一个人。这种"对面写来"的手法，使得思念之情更加深沉曲折。全诗朴素自然，却感人至深。',
    tags: ['思乡', '重阳', '王维'] },
  { id: 17, title: '静夜思', author: '李白', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '床前明月光，疑是地上霜。举头望明月，低头思故乡。',
    notes: '', translation: '【逐句品读】这是中国最家喻户晓的一首诗。月光洒在床前，明亮得让人恍惚觉得是地上铺了一层白霜——"疑"字用得极妙，写出了半梦半醒之间的错觉。抬头仰望天上的明月，清冷的月光牵动了内心深处最柔软的那根弦，不由得低下头，深深地思念起远方的故乡。全诗仅二十个字，没有一个生僻字，却道尽了天下游子的思乡之情。语言洗练到极致，情感真挚到极致，这就是李白"天然去雕饰"的魅力。',
    tags: ['思乡', '月亮', '李白'] },
  { id: 18, title: '古朗月行', author: '李白', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。',
    notes: '朗月行：乐府古题。瑶台：传说中神仙居住的地方。', translation: '【逐句品读】这首诗以孩童的天真视角写月亮。小时候不认识月亮，把它叫作"白玉盘"——多形象的比喻！圆圆的、白白的月亮，不就像一只玉盘吗？又怀疑它是瑶台仙人的镜子，飞在青云之上。诗人用儿童纯真的眼光和丰富的想象力，把月亮写得既亲切又神奇，充满了童话般的色彩。这也反映出李白一生都保持着对世界的好奇心和瑰丽的想象力。',
    tags: ['月亮', '李白'] },
  { id: 19, title: '望庐山瀑布', author: '李白', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。',
    notes: '香炉：香炉峰。九天：古代传说天有九层。', translation: '【逐句品读】阳光照射在香炉峰上，升腾起紫色的云雾，为瀑布铺陈了一个仙境般的背景。远远望去，瀑布像一条巨大的白练挂在山前的河流之上——一个"挂"字化动为静，写出了远望时瀑布的壮美。"飞流直下三千尺"写瀑布的动态和高度，气势惊人。最后"疑是银河落九天"把瀑布比作从九天之上倾泻而下的银河，想象奇特，气魄宏大。李白写瀑布，真的写出了天地间的豪气！',
    tags: ['山水', '李白'] },
  { id: 20, title: '赠汪伦', author: '李白', dynasty: '唐', level: 'primary', grade: '二年级',
    content: '李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。',
    notes: '踏歌：边唱歌边跺脚打拍子。', translation: '【逐句品读】李白乘船正要出发时，忽然听到岸上传来踏歌的声音——原来是汪伦赶来送行了。这个"忽"字写出了惊喜之情。后两句是巧妙的比较：桃花潭水纵然有千尺之深，也比不上汪伦送我的情谊深呀！用潭水的深来比友谊的深，化抽象为具体，生动可感。李白就是这样一个人——你对他好一分，他就用最灿烂的诗句来回报十分。',
    tags: ['友情', '李白'] },
  { id: 21, title: '黄鹤楼送孟浩然之广陵', author: '李白', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。',
    notes: '之：往。烟花：形容繁花似锦。', translation: '【逐句品读】老朋友在黄鹤楼告别，在繁花似锦的三月顺流东下去扬州。"烟花三月"四字极美——江南三月，繁花如烟如雾，色彩缤纷，正是最美的时节。后两句是千古绝唱：孤帆的影子渐渐消失在碧空尽头，只看见长江向天边奔流不息。诗人久久伫立，目送友人远去，直到什么都看不见了还不愿离开。这种"不写离情而离情自见"的写法，比直接说"我舍不得你"要高妙何止百倍！',
    tags: ['送别', '李白'] },
  { id: 22, title: '早发白帝城', author: '李白', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。',
    notes: '白帝城：重庆奉节。江陵：湖北荆州。', translation: '【逐句品读】清晨告别高耸入云的白帝城，千里之外的江陵一天就能到达——写出了三峡水流之湍急、行船之迅速。后两句更是神来之笔：两岸猿猴的啼叫声还在耳边回响，轻快的小船却已经驶过了万重高山。"啼不住"与"已过"形成强烈对比——声音还在持续，船已飞驰而出，如离弦之箭。李白写这首诗时刚被赦免，心情无比畅快，全诗也如江水般一泻千里，充满了欢快和自由的节奏感。',
    tags: ['写景', '李白'] },
  { id: 23, title: '望天门山', author: '李白', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。',
    notes: '天门山：安徽当涂的东西梁山。', translation: '【逐句品读】天门山被长江从中间劈开，形成了天然的峡口——一个"断"字和一个"开"字，写出了江水的冲决之力。碧绿的江水浩浩荡荡东流，到这里回旋转了一个弯。两岸的青山相对而出，仿佛在迎接什么——"相对出"把静止的山写活了，化静为动。一片孤帆从太阳那边缓缓驶来。全诗写山、写水、写帆、写日，构图壮阔，充满动感。',
    tags: ['山水', '李白'] },
  { id: 24, title: '别董大', author: '高适', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '千里黄云白日曛，北风吹雁雪纷纷。莫愁前路无知己，天下谁人不识君。',
    notes: '曛：昏暗。', translation: '【逐句品读】千里黄云蔽日，天色昏暗，北风中大雁南飞，大雪纷纷扬扬——这是一幅苍凉壮阔的边塞冬景图。在这样的背景中送别，本该是悲伤忧愁的。但诗人却反其道而行，用最豪迈的语气安慰朋友："莫愁前路无知己，天下谁人不识君。"不要担心前路没有知心朋友，普天之下谁不认识你呢！这两句慷慨激昂，充满自信和力量，一扫送别诗的哀愁，体现了盛唐诗人开阔的胸襟。',
    tags: ['送别', '豪放'] },
  { id: 25, title: '绝句', author: '杜甫', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。',
    notes: '西岭：岷山。千秋雪：终年不化的积雪。', translation: '【逐句品读】这首绝句四句皆对，如同一幅精工细作的山水画。第一句是近景——黄鹂在翠柳间鸣叫，黄绿相映，声色并茂。第二句是远景——白鹭排成一行飞上青天，白蓝相衬，意境高远。第三句是远望——窗口含映着西岭上千年不化的积雪，"含"字拟人化，仿佛窗户有意将雪山"含"在口中。第四句是近看——门前停泊着来自东吴的万里行船。四句诗从近到远再到近，空间层次极为丰富。',
    tags: ['写景', '杜甫'] },
  { id: 26, title: '春夜喜雨', author: '杜甫', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '好雨知时节，当春乃发生。随风潜入夜，润物细无声。野径云俱黑，江船火独明。晓看红湿处，花重锦官城。',
    notes: '乃：就。发生：萌发生长。', translation: '【逐句品读】首句就令人叫绝——"好雨知时节"，春雨似乎懂得季节的需要，该下时就下了。它随着春风在夜里悄悄降临，无声地滋润着万物——"潜"字、"细"字写出了春雨的温柔和谦逊。五六句写雨夜之景：田野小路与乌云融为一色，只有江船上的灯火独自明亮，以明衬暗，更显雨夜深沉。最后诗人以想象收尾：明天早晨，锦官城里被雨水打湿的繁花一定沉甸甸的，红艳欲滴。全诗无一"喜"字而喜意洋溢，因为杜甫是真正为百姓的好雨而欢喜。',
    tags: ['春天', '杜甫'] },
  { id: 27, title: '绝句', author: '杜甫', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。',
    notes: '迟日：春日天长。', translation: '【逐句品读】春日渐长，江山格外秀丽。春风拂过，送来花草的芬芳。第三句写动态——冰雪融化，泥土松软，燕子飞来飞去忙着衔泥筑巢。第四句写静态——沙滩被阳光晒得暖融融的，鸳鸯成双成对地安睡在上面。一飞一睡，一动一静，构成了一幅和谐而富有生机的春日图。杜甫用最精炼的语言捕捉了春天最典型的景象，每一句都是一幅画。',
    tags: ['春天', '杜甫'] },
  { id: 28, title: '江畔独步寻花', author: '杜甫', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '黄四娘家花满蹊，千朵万朵压枝低。留连戏蝶时时舞，自在娇莺恰恰啼。',
    notes: '蹊：小路。恰恰：形容鸟叫声。', translation: '【逐句品读】黄四娘家门前的小路开满了花，"千朵万朵压枝低"写出了繁花似锦、压弯枝条的景象，画面感极强。第三句写蝴蝶在花丛中留连飞舞，恋恋不舍。第四句写黄莺在枝头自由自在地啼唱，"恰恰"既是鸟鸣声，又暗含"恰好"之意，仿佛莺啼与蝶舞配合得恰到好处。全诗色彩明丽，节奏轻快，读来如沐春风，能感受到杜甫在饱经战乱后难得的闲适心情。',
    tags: ['春天', '杜甫'] },
  { id: 29, title: '枫桥夜泊', author: '张继', dynasty: '唐', level: 'primary', grade: '三年级',
    content: '月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。',
    notes: '枫桥：苏州西郊的一座桥。姑苏：苏州。', translation: '【逐句品读】月亮落下去了，乌鸦在啼叫，寒气仿佛弥漫天地间都是秋霜。江边的枫树和渔船上的灯火，伴随着愁绪难以入眠。后两句是画龙点睛之笔——苏州城外的寒山寺，在半夜敲响了钟声，一声一声传到了客船上。钟声打破了夜的寂静，却让旅人的愁思更加深重。全诗意象密集：月落、乌啼、霜、江枫、渔火、愁眠、钟声、客船，共同营造了一个清冷孤寂的意境，成为中国文学史上最著名的"愁眠"意象。',
    tags: ['思乡', '张继'] },
  { id: 30, title: '滁州西涧', author: '韦应物', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。',
    notes: '滁州：安徽滁州。西涧：滁州城西的一道山涧。', translation: '【逐句品读】诗人独独喜爱那涧边幽静的野草——这不引人注目的生命，恰恰是被诗人珍视的。上方的深林中有黄鹂在鸣叫，以声衬静。傍晚时分，春潮带着雨水涨起来了，水流变得湍急。在这荒郊野外的渡口，没有一个人影，只有一条小船独自横在水面上。"舟自横"三字写尽了闲适与孤独。全诗流露出诗人对自然山水的喜爱和淡泊名利的人生态度。',
    tags: ['山水', '韦应物'] },
  { id: 31, title: '游子吟', author: '孟郊', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。',
    notes: '寸草：小草，比喻子女。三春晖：春天的阳光，比喻母爱。', translation: '【逐句品读】这是中国最感人至深的母爱颂歌。慈母手中拿着针线，为即将远行的孩子缝制衣服——最简单的画面，最深沉的情感。临行前她把针脚缝得密密的，是怕孩子在外太久衣服破了没人补。这个"密密缝"的细节，包含了多少无声的牵挂！最后两句用比喻升华：谁说像小草一样微薄的儿女之心，能报答得了像春天阳光一样伟大的母爱呢？寸草与春晖，差距何其大，母爱何其深！',
    tags: ['母爱', '孝亲'] },
  { id: 32, title: '早春呈水部张十八员外', author: '韩愈', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '天街小雨润如酥，草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。',
    notes: '天街：京城的街道。酥：酥油。', translation: '【逐句品读】京城的街道上细雨蒙蒙，滋润得像酥油一样——"润如酥"三个字写出了春雨的细腻和珍贵。最精妙的是第二句：远远望去，地上有一层青青的草色，走近了却什么也看不到了。这种"草色遥看近却无"的视觉体验，只有细心观察才能真正捕捉到，写出了早春草芽刚刚萌发时的微妙状态。诗人感叹：这就是一年中最美的早春时节，远远胜过满城烟柳的暮春！懂得欣赏早春的含蓄之美，需要一双发现的眼睛。',
    tags: ['春天', '韩愈'] },
  { id: 33, title: '渔歌子', author: '张志和', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。',
    notes: '箬笠：竹叶编的斗笠。蓑衣：草或棕编的雨衣。', translation: '【逐句品读】西塞山前白鹭在自由飞翔，桃花盛开映红了江水，水中鳜鱼正肥美——这是一幅色彩明丽的水乡春景图。后三句写渔父的装束和心情：头戴青色的斗笠，身披绿色的蓑衣，在斜风细雨中悠然垂钓，根本不想回家。"不须归"三个字道出了渔父对自然和自由的沉醉。这首词其实寄托了诗人向往隐逸生活的情怀——什么功名利禄，都不如在这烟雨蒙蒙中做一竿钓翁来得自在。',
    tags: ['山水', '田园'] },
  { id: 34, title: '塞下曲', author: '卢纶', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。',
    notes: '单于：古代匈奴的首领。', translation: '【逐句品读】没有月亮的黑夜，大雁惊飞高飞——暗示敌军正在悄悄行动。果然，单于趁着夜色逃跑了。将军正要率领轻骑兵去追击，却见大雪纷飞，瞬间落满了将士们的战弓和宝刀。全诗写得极为凝练，"月黑""雁飞""夜遁""轻骑""大雪""弓刀"六个意象快速切换，如同电影镜头般急促紧凑。最精妙的是在最紧张的时刻戛然而止——追还是不追？留给读者无限想象。',
    tags: ['边塞', '卢纶'] },
  { id: 35, title: '望洞庭', author: '刘禹锡', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。',
    notes: '洞庭：洞庭湖。青螺：青色的田螺，比喻君山。', translation: '【逐句品读】洞庭湖的水光与秋月相互交融辉映——"和"字写出了一种和谐静谧的美。湖面没有一丝风，像一面未经打磨的铜镜，朦胧中透着光泽。后两句是最精彩的比喻：远望洞庭湖的山水青翠，湖中的君山就像白银盘里的一颗青螺。"白银盘"比喻月光下的洞庭湖，"青螺"比喻湖中的君山，比喻新颖贴切，色彩清丽。刘禹锡用女儿般的细腻笔触，把壮阔的洞庭湖写得玲珑剔透，别具一格。',
    tags: ['山水', '刘禹锡'] },
  { id: 36, title: '浪淘沙', author: '刘禹锡', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。',
    notes: '簸：颠簸。牵牛织女：神话人物。', translation: '【逐句品读】弯弯曲曲的黄河携带着万里黄沙从天边奔腾而来，一路上被巨浪冲刷、被大风颠簸——写出了黄河的雄浑气势和艰辛历程。后两句奇峰突起：如今我要逆流而上，直上银河，一起去拜访牛郎织女的家！从黄河到银河，从现实到神话，诗人的想象力纵横驰骋。这不仅仅是在写黄河，更是表达了诗人不畏艰险、追求理想的豪迈情怀。',
    tags: ['黄河', '刘禹锡'] },
  { id: 37, title: '赋得古原草送别', author: '白居易', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。远芳侵古道，晴翠接荒城。又送王孙去，萋萋满别情。',
    notes: '离离：茂盛的样子。王孙：指友人。', translation: '【逐句品读】传说白居易十六岁时写这首诗，去长安拜访名士顾况。顾况起初打趣说"长安百物贵，居大不易"，读到"野火烧不尽，春风吹又生"时惊叹道"有才如此，居亦何难！"这首诗前六句写草——原野上的草多么茂盛，每年枯萎一次又繁荣一次。野火不能把它烧尽，春风吹来它又重生。这两句写出了生命顽强的韧性。后两句由草及人——又一次送别友人，连茂盛的野草也充满了离别的愁情。草的生命力和人的离别情交织在一起，构思独特。',
    tags: ['咏物', '送别', '白居易'] },
  { id: 38, title: '池上', author: '白居易', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '小娒撑小艇，偷采白莲回。不解藏踪迹，浮萍一道开。',
    notes: '艇：小船。', translation: '【逐句品读】这首诗写了一个天真可爱的小娃。他撑着小船偷偷去采白莲花，自以为神不知鬼不觉。可他哪里懂得隐藏踪迹——小船划过水面，浮萍被划开一道长长的痕迹，这不就暴露了吗？诗人用"偷"字写出了孩子的顽皮可爱，用"不解"写出了孩子的天真稚拙。白居易善于从平凡小事中发现童趣，这首诗读来让人忍俊不禁，仿佛看到了那个做"坏事"却不懂得掩饰的小家伙。',
    tags: ['童趣', '白居易'] },
  { id: 39, title: '忆江南', author: '白居易', dynasty: '唐', level: 'primary', grade: '四年级',
    content: '江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？',
    notes: '谙：熟悉。蓝：蓝草，可提炼蓝色染料。', translation: '【逐句品读】白居易年轻时曾在江南任职，晚年回到洛阳后写下这首回忆江南的名篇。开篇直抒胸臆："江南好，风景旧曾谙"——江南的风景我太熟悉了，多么美好啊！中间两句用最鲜明的色彩写江南：日出时江边的花朵比火焰还要红艳，春天来时江水绿得像蓝草一样。红与绿的强烈对比，给人视觉上的震撼。最后"能不忆江南？"以反问收尾，情真意切，令人回味。',
    tags: ['江南', '白居易'] },
  { id: 40, title: '小儿垂钓', author: '胡令能', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '蓬头稚子学垂纶，侧坐莓苔草映身。路人借问遥招手，怕得鱼惊不应人。',
    notes: '垂纶：钓鱼。', translation: '【逐句品读】一个头发蓬乱的小孩子正在学钓鱼——"蓬头"写出了孩子的天真稚气，不拘小节。他侧着身子坐在草丛中，野草映衬着他的身影。这时有路人远远地问路，小孩子却连忙摆手——不是不懂礼貌，而是怕惊走了鱼儿不敢出声回应。这个"遥招手"的细节太传神了！既写出了孩子的专注，又写出了他的聪明和可爱。诗人捕捉到了生活中最生动的一瞬，让一个垂钓小儿的形象跃然纸上。',
    tags: ['童趣', '胡令能'] },
  { id: 41, title: '悯农（其一）', author: '李绅', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。',
    notes: '悯：怜悯，同情。', translation: '【逐句品读】烈日当空的正午，农民还在田里给禾苗锄草，汗水一滴一滴落在禾苗下的泥土里。后两句以反问直击人心：有谁知道碗盘中的每一粒米饭，都饱含着农民的艰辛呢？"谁知"二字饱含着诗人的悲悯和愤慨。这首诗语言质朴，没有华丽的辞藻，却有最震撼的力量。每一个读过这首诗的人，端起饭碗时都会想起"粒粒皆辛苦"——这就是经典的力量。',
    tags: ['悯农', '李绅'] },
  { id: 42, title: '悯农（其二）', author: '李绅', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。',
    notes: '粟：谷子。闲田：荒废的田地。', translation: '【逐句品读】春天种下一粒种子，秋天收获万颗粮食——这原本是丰收的喜悦。然而第三句"四海无闲田"——普天之下没有一块荒废的田地，到处都在辛勤耕作，按理说应该五谷丰登才对。可最后一句话锋陡转："农夫犹饿死。"农民竟然还是饿死了！这个残酷的对比震撼人心。粮食丰收却饿死了种粮的人，这是一个血泪控诉。李绅用二十个字揭示了封建社会最深刻的矛盾。',
    tags: ['悯农', '李绅'] },
  { id: 43, title: '江雪', author: '柳宗元', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。',
    notes: '蓑笠翁：披蓑衣戴斗笠的老翁。', translation: '【逐句品读】这是一首千古绝唱，也是一幅绝美的中国画。"千山鸟飞绝"——所有的山上都看不到一只飞鸟。"万径人踪灭"——所有的路-上都没有行人的足迹。前两句以大面积的空白来渲染极度的寂静和寒冷。后两句聚焦在一个点上："孤舟蓑笠翁，独钓寒江雪。"一个披蓑戴笠的老翁，在漫天大雪的江面上独自垂钓。这个"独"字是诗眼——老翁的孤独，何尝不是柳宗元自己被贬后的孤傲与不屈呢？天地苍茫，一人独钓，这是何等的境界！',
    tags: ['山水', '柳宗元'] },
  { id: 44, title: '寻隐者不遇', author: '贾岛', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '松下问童子，言师采药去。只在此山中，云深不知处。',
    notes: '隐者：隐士。', translation: '【逐句品读】这首诗以最简洁的对话，写出了一个最深远的情境。诗人到深山中拜访一位隐士，在松树下遇到他的童子。第一问："你师父呢？"答："采药去了。"第二问："去哪里采药？"答："就在这座山中。"第三问："具体在什么地方？"答："云雾太深了，不知道在何处。"诗人把三次问答浓缩在二十个字中，留给人无限的想象空间。"云深不知处"五字，既写出了山高云深的意境，也写出了隐者飘然出尘的风采——可遇而不可求，这正是隐士的魅力所在。',
    tags: ['访友', '贾岛'] },
  { id: 45, title: '山行', author: '杜牧', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。',
    notes: '坐：因为。', translation: '【逐句品读】一条弯弯曲曲的石径通向深秋的山上，在白云飘浮的地方有几户人家——前两句写山行所见之景，有"远"有"高"，层次分明。后两句抒发诗人的感受：停下车来不走，是因为太喜爱这傍晚的枫林了——被霜打过的枫叶，竟然比春天二月的花朵还要火红！"霜叶红于二月花"是全诗的灵魂。它不仅写出了秋叶的艳丽，更蕴含了一种哲理：经历风霜后的生命，反而更加灿烂。杜牧一反文人悲秋的传统，唱出了一曲秋的赞歌。',
    tags: ['秋天', '杜牧'] },
  { id: 46, title: '清明', author: '杜牧', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。',
    notes: '清明：二十四节气之一。', translation: '【逐句品读】清明时节细雨如丝如缕，路上的行人愁思重重，仿佛魂都要断了——"欲断魂"三字极写凄迷哀伤的心境。这时诗人想找个酒家避雨歇脚、借酒消愁，便向人打听。一个牧童远远地指向那片杏花深处的村庄——"遥指"二字画面感十足，牧童的纯真给全诗增添了一抹亮色。全诗前两句写愁、后两句写希望，情感起伏，节奏舒缓，如同一首清新的田园小调。这首诗也让"杏花村"成了中国酒文化的经典意象。',
    tags: ['节日', '杜牧'] },
  { id: 47, title: '江南春', author: '杜牧', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。',
    notes: '山郭：山城。酒旗：酒家的幌子。', translation: '【逐句品读】短短二十八个字，杜牧就勾勒出了千里江南的春日画卷。"千里莺啼绿映红"——鸟鸣声声，绿树红花，声色并茂。"水村山郭酒旗风"——水边的村落、山脚的城郭，酒旗在风中轻轻招展。后两句笔锋一转，引入历史的纵深："南朝四百八十寺，多少楼台烟雨中。"南朝修建的那些宏伟寺庙，还有多少楼台矗立在迷蒙的烟雨之中？后两句既是在写景，又暗含着对朝代兴衰的感慨——当年的繁华如今只剩烟雨中的残迹。',
    tags: ['江南', '杜牧'] },
  { id: 48, title: '蜂', author: '罗隐', dynasty: '唐', level: 'primary', grade: '五年级',
    content: '不论平地与山尖，无限风光尽被占。采得百花成蜜后，为谁辛苦为谁甜？',
    notes: '', translation: '【逐句品读】这首咏物诗借蜜蜂讽刺了社会的不公。不管是在平地还是山巅，只要有花的地方蜜蜂就去采——"无限风光尽被占"写出了蜜蜂的勤劳和无处不在。后两句笔锋一转："采得百花成蜜后，为谁辛苦为谁甜？"蜜蜂采尽百花酿成甜蜜的蜂蜜，自己却享用不到，到底便宜了谁呢？诗人表面写蜜蜂，实质是写那些辛勤劳作却成果被人攫取的劳动者。问而不答，留给读者深长的思考。',
    tags: ['咏物', '哲理'] },
  { id: 49, title: '江上渔者', author: '范仲淹', dynasty: '宋', level: 'primary', grade: '五年级',
    content: '江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。',
    notes: '渔者：打鱼的人。', translation: '【逐句品读】江上来来往往的人啊，只知道鲈鱼的味道鲜美——"但爱鲈鱼美"道出了世人只知享受成果而不问来路的常情。后两句将镜头转向江面："君看一叶舟，出没风波里。"你看那像一片树叶般的小小渔船，在狂风巨浪中时隐时现，那是多么惊险的场景啊！范仲淹是北宋名臣，他有着"先天下之忧而忧"的襟怀，这首诗正是他关心民生疾苦的体现——吃着鲜美的鲈鱼时，可曾想到渔夫用生命在风浪中搏斗？',
    tags: ['悯农', '范仲淹'] },
  { id: 50, title: '元日', author: '王安石', dynasty: '宋', level: 'primary', grade: '五年级',
    content: '爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。',
    notes: '元日：正月初一。屠苏：屠苏酒。桃符：春联的前身。', translation: '【逐句品读】这首诗描绘了春节喜庆祥和的景象。爆竹声中旧的一年过去了，春风送暖人们喝着屠苏酒——声音、温度、味道都写到了。千门万户在朝阳的照耀下暖意融融——"曈曈日"写出了初升太阳的光明灿烂。最后"总把新桃换旧符"既是写春节换春联的习俗，更寓意着革故鼎新。王安石当时正在推行变法，这首诗寄托了他推行新政、除旧布新的政治理想。喜庆中蕴含着昂扬向上的力量。',
    tags: ['节日', '王安石'] },
  { id: 51, title: '泊船瓜洲', author: '王安石', dynasty: '宋', level: 'primary', grade: '五年级',
    content: '京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。',
    notes: '瓜洲：扬州南长江边。钟山：南京紫金山。', translation: '【逐句品读】京口与瓜洲只隔着一条江水，诗人的家乡钟山也只隔着几座山——虽近在咫尺，却有家难回，更添思乡之情。第三句"春风又绿江南岸"是千古名句，据说王安石先后用了"到""过""入""满"等十多个字，最后才定为"绿"字。一个"绿"字，化静为动，把春风吹绿江南岸的过程写活了。最后"明月何时照我还"借明月寄情，表达了归心似箭的思乡之情。这首诗既有炼字的精妙，又有情感的深沉。',
    tags: ['思乡', '王安石'] },
  { id: 52, title: '书湖阴先生壁', author: '王安石', dynasty: '宋', level: 'primary', grade: '五年级',
    content: '茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。',
    notes: '书：题诗。排闼：推开门。', translation: '【逐句品读】这是一首题写在朋友家墙壁上的诗。前两句写主人杨德逢的勤劳与雅致——茅檐下经常打扫得干干净净，没有一丝青苔；花木成行成畦，都是主人亲手栽种的。后两句写景极为精彩：一条小河环绕着农田，仿佛在守护着那一圈绿色。两座大山好像推开门一样，把满山的青翠送到眼前来。"排闼送青"四字用拟人手法，把山写活了，像热情的主人不请自来。全诗写出了人与自然和谐相处的美好画面。',
    tags: ['田园', '王安石'] },
  { id: 53, title: '六月二十七日望湖楼醉书', author: '苏轼', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。',
    notes: '望湖楼：杭州西湖边。', translation: '【逐句品读】这是一首描绘西湖夏日暴雨奇景的诗，四句写了四种变化：第一句写云——乌云像翻倒的墨汁一样滚滚而来，还没来得及遮住山峦。第二句写雨——白花花的雨点像珍珠一样跳入船中，"跳"和"乱"写出雨点的大而急。第三句写风——一阵卷地大风猛地吹来，云开雨散。第四句写晴——望湖楼下的湖水又恢复了平静，水天一色。苏轼用二十八个字就完成了一场暴雨从来到去的完整记录，笔力惊人，气象万千。',
    tags: ['西湖', '苏轼'] },
  { id: 54, title: '饮湖上初晴后雨', author: '苏轼', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。',
    notes: '潋滟：波光闪动。西子：西施。', translation: '【逐句品读】这是写西湖最著名的一首诗。前两句写两种天气下的西湖：晴天波光潋滟很美——"方好"写晴日的明媚；雨天山色迷蒙也很奇妙——"亦奇"写雨天的空灵。后两句用一个千古比喻将西湖之美推向极致：要把西湖比作古代美女西施，无论是淡雅的素妆还是浓艳的盛装，都那么恰到好处。这个比喻妙在"神似"而非"形似"——西湖和西施都是天生丽质，怎么打扮都美。从此西湖有了"西子湖"这个别称。',
    tags: ['西湖', '苏轼'] },
  { id: 55, title: '惠崇春江晚景', author: '苏轼', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。',
    notes: '惠崇：宋朝画家。河豚：一种美味的鱼。', translation: '【逐句品读】这是苏轼为好友惠崇的画作《春江晚景》题写的诗。第一句写岸上之景：竹林外点缀着三两枝桃花，虽是"三两枝"却已透出春的消息。第二句是千古名句："春江水暖鸭先知。"水温回暖，最先感觉到的是在水里游的鸭子。这句包含着一个朴素的哲理——身在其境者最先感知变化。后两句写江岸植物和水中生物：蒌蒿满地，芦芽刚刚冒出尖尖，这正是河豚逆流而上的时节。苏轼不是题画，而是从画中看到了画外之景，让静态的画有了动态的生命。',
    tags: ['春天', '苏轼'] },
  { id: 56, title: '题西林壁', author: '苏轼', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。',
    notes: '西林：庐山西林寺。缘：因为。', translation: '【逐句品读】这是一首蕴含深刻哲理的诗。前两句写从不同角度看庐山：横着看是连绵的山岭，侧着看是陡峭的山峰，从远近高低不同距离和角度看，山的形态各不相同。由此引出后两句富含哲理的名句："不识庐山真面目，只缘身在此山中。"为什么看不清庐山的真正面目？就因为自己置身于这座山中。这已经远远超越了写景，而成为认识论的名言——观察事物需要跳出局部、拉开距离，才能看清全局。看山如此，看人生、看世事又何尝不是？',
    tags: ['哲理', '苏轼'] },
  { id: 57, title: '夏日绝句', author: '李清照', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。',
    notes: '人杰：人中豪杰。项羽：西楚霸王。', translation: '【逐句品读】这是一首气势磅礴的诗，出自婉约派女词人李清照之手，令人震撼。前两句直抒胸怀：活着就要做人中的豪杰，死了也要做鬼中的英雄——这是一种宁折不弯的人生信念。后两句借古讽今：至今人们还怀念项羽，他兵败后宁死也不肯逃回江东。当时北宋灭亡，南宋朝廷南逃避敌，李清照借项羽的壮烈讽刺南宋统治者的苟且偷安。一个柔弱的女子，却写出了如此刚烈的诗句，这就是中国文化中可贵的风骨和气节。',
    tags: ['咏史', '李清照'] },
  { id: 58, title: '三衢道中', author: '曾几', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。',
    notes: '三衢：浙江衢州。', translation: '【逐句品读】梅子成熟泛黄的时节，难得天天都是大晴天——"梅子黄时"本是江南的梅雨季节，这里却"日日晴"，诗人心情大好。乘船沿着小溪走到尽头，又换走山路继续前行。山路上的绿树浓荫和来时一样茂密，还多了几声黄鹂清脆的鸣叫。全诗写得轻快自然，传达出诗人初夏出游时轻松愉悦的心情。"添得黄鹂四五声"以声写静，在山林中听到几声鸟鸣，更显得幽静宜人。',
    tags: ['山水', '曾几'] },
  { id: 59, title: '示儿', author: '陆游', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。',
    notes: '示儿：写给儿子看。九州同：全国统一。', translation: '【逐句品读】这是陆游的绝笔诗，也是他一生爱国情怀的最终告白。第一句"死去元知万事空"——人死之后万事皆空，一切都看淡了。但第二句"但悲不见九州同"——唯一让我悲痛的是没有看到国家统一。一个"但"字转折有力，凸显了国家统一在他心中的分量。后两句是临终嘱咐：等到朝廷军队收复中原的那一天，家祭时千万不要忘了告诉你们的父亲。陆游至死不忘收复失地，这种至死不渝的爱国情怀，激励了一代又一代中国人。',
    tags: ['爱国', '陆游'] },
  { id: 60, title: '秋夜将晓出篱门迎凉有感', author: '陆游', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。',
    notes: '河：黄河。岳：华山。遗民：沦陷区的人民。', translation: '【逐句品读】前两句以极壮阔的笔墨写祖国的山河：三万里黄河向东奔流入海，五千仞华山高耸入云。这壮丽的山河却已经沦陷在金人的铁蹄之下。后两句笔锋一沉，写沦陷区百姓的痛苦：他们在胡人的统治下眼泪已经流尽，一年又一年地盼望着朝廷的军队来解救他们。"泪尽"和"又一年"写得字字泣血——这不是一年的等待，而是年复一年、望眼欲穿的绝望。陆游写这首诗时已经六十八岁，退居山阴，但心系中原，忧国忧民。',
    tags: ['爱国', '陆游'] },
  { id: 61, title: '四时田园杂兴（其三十一）', author: '范成大', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。',
    notes: '耘田：除草。绩麻：搓麻线。', translation: '【逐句品读】这是一幅生动的农家劳动画卷。白天男人下田除草，晚上女人在家搓麻线——"各当家"写村庄里男女老少各司其职，忙碌而有序。最可爱的是后两句：小孙子还不懂得耕田织布，却也学着大人的样子，在桑树荫下挖土种瓜。这个"学"字写出了儿童的天真好奇和模仿天性。范成大没有居高临下地写"农家乐"，而是以平等欣赏的眼光，真实记录了一家人辛勤又温馨的劳动生活。',
    tags: ['田园', '范成大'] },
  { id: 62, title: '四时田园杂兴（其二十五）', author: '范成大', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，唯有蜻蜓蛱蝶飞。',
    notes: '蛱蝶：蝴蝶。', translation: '【逐句品读】前两句色彩斑斓：梅子金灿灿、杏子圆鼓鼓，麦花开得像雪一样白，而金黄的油菜花已经开始凋谢稀疏——写出了初夏时节农作物生长的丰富层次。后两句写夏日的静谧：白天变长了，篱笆边却没有人走过——因为大家都在田里忙着农活。只有蜻蜓和蝴蝶在篱笆间自在地飞来飞去。以"无人"反衬农忙，以蜻蜓蛱蝶的自由反衬人的辛苦，不动声色中含着对劳动人民的深情关注。',
    tags: ['田园', '范成大'] },
  { id: 63, title: '小池', author: '杨万里', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。',
    notes: '惜：爱惜。晴柔：晴天的柔和风光。', translation: '【逐句品读】杨万里是写"小景"的圣手。泉眼无声无息，像舍不得泉水流出似的——一个"惜"字写出了泉眼对涓涓细流的爱惜之情。树阴倒映水中，仿佛在享受晴日的柔和——"爱"字同样用了拟人。后两句是最美的画面：小荷叶刚刚从水面露出尖尖的角，就已经有一只蜻蜓停在上面了。"才露"和"早有"呼应，写出了大自然的生物之间那种微妙的、完美的时机与契合。全诗清新自然，充满了发现的喜悦。',
    tags: ['夏天', '杨万里'] },
  { id: 64, title: '晓出净慈寺送林子方', author: '杨万里', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。',
    notes: '净慈寺：杭州西湖边。', translation: '【逐句品读】首句"毕竟"二字破空而来，以强烈的感叹语气宣告：到底是六月里的西湖啊，风光与别的季节完全不同！这种先声夺人的写法，一下子就抓住了读者的注意力。后两句以如椽巨笔描绘：碧绿的莲叶一望无际，仿佛与天相接；映照在阳光下的荷花，红得格外明艳动人。"无穷碧"写荷叶之广，"别样红"写荷花之艳，红绿对比，浓墨重彩。这首诗大气磅礴，把西湖六月的美写到了极致。',
    tags: ['西湖', '杨万里'] },
  { id: 65, title: '春日', author: '朱熹', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。',
    notes: '胜日：好日子。泗水：山东的河流。', translation: '【逐句品读】春光明媚的日子，诗人到泗水边寻找春天的足迹。泗水在山东曲阜，是孔子当年讲学的地方，所以这首诗也暗含着对儒家之道的追寻。第二句"无边光景一时新"——天地之间所有的景色都焕然一新，有一种豁然开朗的喜悦。后两句"等闲识得东风面，万紫千红总是春"——随处都可以感受到春天的面容，万紫千红都是春天的呈现。表面写春天，深层是在说：只要你有一颗向学求道的心，处处都能领悟真理。',
    tags: ['春天', '朱熹'] },
  { id: 66, title: '观书有感', author: '朱熹', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。',
    notes: '鉴：镜子。渠：它（指方塘）。', translation: '【逐句品读】这也是一首"借景说理"的绝妙好诗。半亩大的方形池塘像一面镜子打开，清澈见底，天光云影在水中来回晃动——景色优美宁静。后两句突然发问：问这池塘为什么如此清澈？因为上游有源源不断的活水流进来啊！这就是全诗的哲理所在——池塘因为有活水才清澈，心灵因为有不断学习才清明。朱熹用这个生动的比喻告诉人们：只有不断吸收新知识，才能保持思想的清澈和活力。「水之清」和「心之明」的类比，精妙无比。',
    tags: ['哲理', '朱熹'] },
  { id: 67, title: '题临安邸', author: '林升', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。',
    notes: '临安：南宋都城（杭州）。汴州：北宋都城（开封）。', translation: '【逐句品读】这是一首讽刺南宋朝廷苟安享乐的名篇。首句"山外青山楼外楼"写杭州的繁华富丽——青山之外还有青山，楼阁之外还有楼阁。第二句笔锋骤转："西湖歌舞几时休？"西湖边的歌舞什么时候才能停止？"休"字饱含诗人的愤慨。第三句"暖风熏得游人醉"——暖洋洋的風把达官贵人吹得沉醉其中。"熏"字极具讽刺意味。最后"直把杭州作汴州"是全诗最犀利的一击——竟然把临时避难的杭州当成了故都汴州！忘掉了国耻家仇。',
    tags: ['爱国', '讽刺'] },
  { id: 68, title: '游园不值', author: '叶绍翁', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '应怜屐齿印苍苔，小扣柴扉久不开。春色满园关不住，一枝红杏出墙来。',
    notes: '不值：没遇到人。柴扉：柴门。', translation: '【逐句品读】久闻某家花园很美，诗人前来拜访，主人却不在家。他轻轻敲了很久的柴门，没人来开。大概是主人爱惜园中的青苔，怕被我的木屐踩坏吧——这个猜测带着幽默和善意。虽然没有进到园中，但诗人却看到了更美的景象："春色满园关不住，一枝红杏出墙来。"满园的春色是关不住的啊，一枝红杏已经伸出了墙外！后两句蕴含深刻哲理——充满生命的活力是无法被禁锢的，再高的墙也挡不住春天的脚步。',
    tags: ['春天', '叶绍翁'] },
  { id: 69, title: '乡村四月', author: '翁卷', dynasty: '宋', level: 'primary', grade: '六年级',
    content: '绿遍山原白满川，子规声里雨如烟。乡村四月闲人少，才了蚕桑又插田。',
    notes: '子规：杜鹃鸟。', translation: '【逐句品读】首句以绿和白两种颜色写出四月的山野：漫山遍野一片翠绿，河水涨满白茫茫一片。第二句以声音和气象补充：杜鹃鸟的叫声中，细雨如烟雾般蒙蒙飘飘。前两句写景如画，后两句转写农事：四月的乡村没有闲人——"才了蚕桑又插田"写出农事的繁忙节奏。刚忙完养蚕采桑，又要下田插秧了，一刻不得闲。这首诗把江南四月优美的自然风光和忙碌的农耕生活融为一体，劳动虽然辛苦却充满了生机。',
    tags: ['田园', '翁卷'] },
  { id: 70, title: '墨梅', author: '王冕', dynasty: '元', level: 'primary', grade: '六年级',
    content: '吾家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤。',
    notes: '墨梅：水墨画的梅花。', translation: '【逐句品读】这是一首题画诗。王冕以画墨梅闻名，他在诗中写道：我家庭院洗砚池边的梅树，开出的花朵带着淡淡的墨痕。为什么是墨色而不是红色？因为这是用画家的墨笔画出的梅花。后两句是全诗的灵魂："不要人夸好颜色，只留清气满乾坤。"不需要别人夸赞颜色多么好看，只想让清雅的香气充满整个世界。这哪里是在写梅花？分明是在写一种人生态度——不追求外在的华丽，只在乎内在的高洁。王冕一生清贫，却志节高尚，这首诗正是他人格的写照。',
    tags: ['咏物', '王冕'] },
  { id: 71, title: '石灰吟', author: '于谦', dynasty: '明', level: 'primary', grade: '六年级',
    content: '千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。',
    notes: '吟：古代诗歌的一种形式。', translation: '【逐句品读】这是一首以石灰自喻的明志诗。石灰石要经过千锤万凿才能从深山中被开采出来，再用烈火焚烧才能变成石灰——"若等闲"三字写出了面对考验的从容。第三句"粉骨碎身浑不怕"——即使被碾成粉末也毫不畏惧。最后"要留清白在人间"点明主旨：只要清白高尚的品格留在世上，粉身碎骨又如何？于谦后来在"土木堡之变"中力挽狂澜，保卫了北京城，最终却被冤杀。他用生命践行了这首诗的誓言，真正做到了"要留清白在人间"。',
    tags: ['咏物', '于谦'] },
  { id: 72, title: '竹石', author: '郑燮', dynasty: '清', level: 'primary', grade: '六年级',
    content: '咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。',
    notes: '燮：郑板桥的字。', translation: '【逐句品读】郑板桥一生画竹、咏竹。这首诗开篇"咬定"二字极为有力——竹子像用牙咬住青山一样，紧紧不放，扎根在破裂的岩石之中。在那么恶劣的环境中，它经历千磨万击却依然坚韧——"还坚劲"三个字铿锵有力。最后"任尔东西南北风"——任凭你四面八方的狂风怎么吹，竹子自岿然不动。郑板桥在山东做知县时，因开仓赈灾得罪上司而被罢官，但他从不低头。这首诗中的竹子，就是他本人刚正不阿、宁折不弯的人格写照。',
    tags: ['咏物', '郑燮'] },
  { id: 73, title: '所见', author: '袁枚', dynasty: '清', level: 'primary', grade: '六年级',
    content: '牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。',
    notes: '林樾：树林。', translation: '【逐句品读】一个牧童骑在黄牛背上，悠然自得地唱着歌，歌声在树林中回荡。突然，他想要捕捉树上鸣叫的知了，于是立刻闭上嘴巴，静静地站立在那里。这一"闭口立"的瞬间变化太精彩了！前两句还是自由自在的歌唱，后两句突然转为屏息凝神的专注。诗人捕捉到了牧童从"放歌"到"捕蝉"这一行为的突然转变，写出了儿童天真机灵的神态。全诗如同一幅速写，寥寥几笔就勾勒出一个栩栩如生的牧童形象。',
    tags: ['童趣', '袁枚'] },
  { id: 74, title: '村居', author: '高鼎', dynasty: '清', level: 'primary', grade: '六年级',
    content: '草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。',
    notes: '纸鸢：风筝。', translation: '【逐句品读】早春二月，青草生长，黄莺飞翔。杨柳长长的枝条轻拂着堤岸，仿佛陶醉在春天的烟雾中——"醉"字用拟人手法，写出了杨柳的娇媚。后两句是最欢乐的画面：孩子们放学回来得比平时早，赶紧趁着东风放起了风筝。"忙趁"二字传神地写出了孩子们迫不及待的心情。全诗洋溢着春天的生机和童趣的快乐。前两句写春景之美，后两句写童年之乐，景美人乐，相得益彰。',
    tags: ['春天', '童趣'] },
  { id: 75, title: '己亥杂诗', author: '龚自珍', dynasty: '清', level: 'primary', grade: '六年级',
    content: '九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。',
    notes: '恃：依靠。喑：沉默。', translation: '【逐句品读】龚自珍身处清朝衰落时期，对国家前途深感忧虑。前两句"九州生气恃风雷，万马齐喑究可哀"——整个国家需要风雷般的变革才能重获生机，而现在万马齐喑、一片沉寂的局面实在令人悲哀。后两句振臂高呼："我劝天公重抖擞，不拘一格降人才。"我劝上天重新振作起来，不要拘泥于一种规格，降下各种各样的人才吧！诗人把变革的希望寄托在人才身上，呼唤打破旧制度的束缚。这首诗充满了改革精神，是近代中国思想解放的先声。',
    tags: ['爱国', '龚自珍'] }
];

const middleSchoolPoems = [
  // ===== 七年级 =====
  { id: 101, title: '观沧海', author: '曹操', dynasty: '东汉', level: 'middle', grade: '七年级',
    content: '东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。',
    notes: '碣石：山名。澹澹：水波摇荡。星汉：银河。', translation: '【逐句品读】东行登上碣石山来观赏沧海——起笔气势不凡。海水多么宽阔浩荡，山岛高高耸立，一片壮阔景象。树木葱茏百草丰茂，生机勃勃。秋风萧瑟时巨浪涌起，充满力量感。最精彩的是后四句：太阳和月亮的运行仿佛出自大海之中，灿烂的银河也像从大海里升起。这是何等的胸襟和气魄！曹操写这首诗时刚大胜乌桓，统一北方，正是踌躇满志的时候，大海的壮阔正是他心中豪情的写照。最后两句是合乐时的套语。',
    tags: ['写景', '壮志', '曹操'] },
  { id: 102, title: '闻王昌龄左迁龙标遥有此寄', author: '李白', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '杨花落尽子规啼，闻道龙标过五溪。我寄愁心与明月，随君直到夜郎西。',
    notes: '左迁：贬官。龙标：地名。子规：杜鹃鸟。', translation: '【逐句品读】"杨花落尽子规啼"——杨花飘落殆尽，杜鹃鸟在悲啼。首句以暮春的凄凉景象烘托离别的伤感。朋友王昌龄被贬到偏远的龙标，要经过五条溪流才能到达。后两句是李白式的深情与浪漫："我寄愁心与明月，随君直到夜郎西。"我把自己的一片愁心寄托给天上的明月，让它一路陪伴你直到夜郎以西。明月成为情感的载体和使者，跨越千山万水，把诗人的关怀送达朋友身边。这种奇特的想象，正是李白独有的魅力。',
    tags: ['送别', '李白'] },
  { id: 103, title: '次北固山下', author: '王湾', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。',
    notes: '北固山：江苏镇江。残夜：夜将尽之时。', translation: '【逐句品读】"客路青山外，行舟绿水前"——诗人此时在北固山下停泊，前路尚远。潮水涨平了江面，两岸显得格外开阔；顺风而行，一片白帆高高悬挂。"海日生残夜，江春入旧年"是全诗最著名的两句：残夜还未消退，一轮红日已从海上升起；旧年尚未过完，江面上已经透出春天的气息。这两句不仅写景如画，更蕴含哲理——新事物总是在旧事物中孕育生长。最后"乡书何处达？归雁洛阳边"——家书送到哪里呢？请北归的大雁帮我捎到洛阳吧。思乡之情含蓄而真挚。',
    tags: ['思乡', '王湾'] },
  { id: 104, title: '天净沙·秋思', author: '马致远', dynasty: '元', level: 'middle', grade: '七年级',
    content: '枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。',
    notes: '天净沙：曲牌名。', translation: '【逐句品读】这首元曲小令被誉为"秋思之祖"，全篇以名词意象排列而成，没有一个动词，却像一组电影镜头般推拉摇移。枯藤、老树、昏鸦——三个意象叠加出萧瑟灰暗的底色。小桥、流水、人家——三个意象温馨明亮，却更反衬出游子的孤独。古道、西风、瘦马——苍凉中透着艰辛。最后"夕阳西下，断肠人在天涯"——夕阳余晖中，一个悲伤的游子漂泊在天涯海角。前三句九个意象如同九幅画，最后一句点出画中之人，意境浑然天成。',
    tags: ['秋思', '马致远'] },
  { id: 105, title: '峨眉山月歌', author: '李白', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '峨眉山月半轮秋，影入平羌江水流。夜发清溪向三峡，思君不见下渝州。',
    notes: '平羌：青衣江。清溪：地名。', translation: '【逐句品读】峨眉山上升起半轮秋月，月影倒映在平羌江中随水流荡——一幅静谧而灵动的月夜山景图。后两句写诗人连夜从清溪出发向三峡行进，思念着某人却见不到，只能顺着江水向渝州而去。全诗连用了峨眉山、平羌江、清溪、三峡、渝州五个地名，但不觉堆砌，反而有一种一路行来、不断前行的动态感。李白将离情别绪融入山水月色之中，清新自然。',
    tags: ['思乡', '李白'] },
  { id: 106, title: '江南逢李龟年', author: '杜甫', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。',
    notes: '李龟年：唐代音乐家。', translation: '【逐句品读】这是一次跨越四十年的重逢。前两句写追忆：当年在岐王宅里和崔九堂前，经常听到李龟年歌唱——那是盛唐最繁华的岁月，明皇盛世，歌舞升平。后两句回到现实："正是江南好风景，落花时节又逢君。"如今在江南风景最好的时候遇到了你，可是时节已是"落花时节"。这四个字暗喻了国家的衰落和个人的迟暮。故人在落花时节重逢，满心的感慨尽在不言中。全诗无一字直写悲痛，但那种"国破山河在"的苍凉感弥漫字里行间。',
    tags: ['感怀', '杜甫'] },
  { id: 107, title: '行军九日思长安故园', author: '岑参', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。',
    notes: '九日：重阳节。', translation: '【逐句品读】重阳节有登高饮酒的习俗。可诗人在行军途中，勉强想登高过节，却没有人送酒来——一个"强"字写出了身不由己的勉强，一个"无"字写出了身处战场的寂寥。后两句由自己想到故园：遥想故乡的菊花，应该还在战场的旁边寂寞开放吧。菊花依旧，故园却已沦为战场。"遥怜"二字饱含对故园的深切思念和对战乱的忧愤。短短的二十个字，家国情怀尽在其中。',
    tags: ['思乡', '岑参'] },
  { id: 108, title: '夜上受降城闻笛', author: '李益', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '回乐烽前沙似雪，受降城外月如霜。不知何处吹芦管，一夜征人尽望乡。',
    notes: '受降城：唐代边塞城池。', translation: '【逐句品读】前两句写边塞夜景：回乐烽前的沙地白得像雪一样，受降城外的月色冷得像寒霜。"沙似雪"和"月如霜"两个比喻，营造出边关清冷苍凉的氛围。后两句写声音和情感：不知从何处吹起了芦笛，那哀怨的曲调触动了所有将士的心弦，一整夜，远征的人都眺望着故乡的方向。"尽望乡"三字写得极有力量——不是一个人在思乡，而是千千万万个将士都在想家。笛声牵动了所有人的思乡情，无声的画面有了动人的旋律。',
    tags: ['边塞', '思乡'] },
  { id: 109, title: '秋词（其一）', author: '刘禹锡', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '自古逢秋悲寂寥，我言秋日胜春朝。晴空一鹤排云上，便引诗情到碧霄。',
    notes: '寂寥：寂静空旷。', translation: '【逐句品读】自古以来文人一到秋天就悲叹寂寥——宋玉开了悲秋的先河，此后"悲秋"成了中国文学的传统主题。但刘禹锡偏偏要翻案："我言秋日胜春朝。"我说秋天比春天还要好！这体现了他倔强乐观的性格。后两句以具体的画面来证明他的观点：晴空万里，一只白鹤排云而上，直冲云霄，诗人的豪情也随着白鹤飞到了碧蓝的天空。"诗情到碧霄"——诗人的创作激情与白鹤一起飞翔，那是何等的洒脱和昂扬！刘禹锡被贬多年却从不消沉，这首诗就是他精神的写照。',
    tags: ['秋', '刘禹锡'] },
  { id: 110, title: '夜雨寄北', author: '李商隐', dynasty: '唐', level: 'middle', grade: '七年级',
    content: '君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。',
    notes: '寄北：寄给北方的人。', translation: '【逐句品读】你问我回家的日期——"未有期"三字道尽了诗人的无奈。此时诗人身处巴山，秋雨连绵，池塘水涨，独对孤灯，情何以堪！后两句忽然宕开一笔，从眼前的愁苦跳跃到未来的想象："何当共剪西窗烛，却话巴山夜雨时。"什么时候才能回到家中，和你一起剪去烛花，再回头跟你述说今晚巴山夜雨的情景呢？以未来相聚的温暖来反衬今日独处的凄凉，又以今日的凄凉来增添未来回忆的珍贵。时空交错，虚实相生，情深意切。',
    tags: ['思念', '李商隐'] },
  { id: 111, title: '十一月四日风雨大作（其二）', author: '陆游', dynasty: '宋', level: 'middle', grade: '七年级',
    content: '僵卧孤村不自哀，尚思为国戍轮台。夜阑卧听风吹雨，铁马冰河入梦来。',
    notes: '戍：守卫。轮台：泛指边疆。', translation: '【逐句品读】陆游写这首诗时已六十八岁，罢官隐居在山阴老家。"僵卧孤村不自哀"——僵直地躺在孤寂的乡村里，但诗人并不为自己感到悲哀。"不自哀"三字笔力千钧，说明他心中牵挂的不是个人得失。第二句点明所思："尚思为国戍轮台。"还想着为国家去守卫边疆！后两句最为动人：深夜躺着听到窗外狂风暴雨的声音，在梦中仿佛骑着战马跨过冰河奋勇杀敌。风雨声激发了诗人的爱国激情，现实中的风雨声变成了梦境中的铁蹄声。这"铁马冰河"的梦境，是诗人爱国情怀最极致的表达。',
    tags: ['爱国', '陆游'] },
  { id: 112, title: '潼关', author: '谭嗣同', dynasty: '清', level: 'middle', grade: '七年级',
    content: '终古高云簇此城，秋风吹散马蹄声。河流大野犹嫌束，山入潼关不解平。',
    notes: '潼关：陕西的关隘。', translation: '【逐句品读】谭嗣同写这首诗时才十六岁，却已显示出不凡的胸襟。终古以来，高云簇拥着这座雄关，秋风吹散了清脆的马蹄声。后两句是绝佳的风景描写：黄河奔流在辽阔的原野上，却还嫌受到束缚；进入潼关后，山势险峻，再也不懂得什么叫做平坦。"犹嫌束""不解平"赋予了山河人的性格和情感，写出了黄河的桀骜不驯和秦岭的雄奇峻拔。这种不甘束缚的个性，正契合了少年谭嗣同追求变革、冲破束缚的精神。',
    tags: ['写景', '豪放'] },

  // ===== 八年级 =====
  { id: 113, title: '关雎', author: '《诗经》', dynasty: '周', level: 'middle', grade: '八年级',
    content: '关关雎鸠，在河之洲。窈窕淑女，君子好逑。参差荇菜，左右流之。窈窕淑女，寤寐求之。求之不得，寤寐思服。悠哉悠哉，辗转反侧。参差荇菜，左右采之。窈窕淑女，琴瑟友之。参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。',
    notes: '雎鸠：水鸟。窈窕：体态美好。逑：配偶。', translation: '【逐句品读】《关雎》是《诗经》的第一篇，也是中国爱情诗的源头。全诗以雎鸠鸟的和鸣起兴——"关关雎鸠，在河之洲"，由水鸟求偶联想到君子淑女的婚配。"窈窕淑女，君子好逑"——这是一种对美好的欣赏，不是轻浮的追求。诗中描写了从"寤寐求之"到"辗转反侧"的思念之苦，再到"琴瑟友之""钟鼓乐之"的追求方式——用弹琴鼓瑟去亲近她，用敲钟击鼓去取悦她。这是一种高雅文明的爱情表达。孔子评价这首诗"乐而不淫，哀而不伤"——快乐却不放纵，忧愁却不伤害身心，情感恰到好处。',
    tags: ['诗经', '爱情'] },
  { id: 114, title: '蒹葭', author: '《诗经》', dynasty: '周', level: 'middle', grade: '八年级',
    content: '蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。',
    notes: '蒹葭：芦苇。伊人：那个人。溯洄：逆流而上。', translation: '【逐句品读】这是一首意境朦胧、凄婉优美的求爱诗。深秋清晨，芦苇苍翠茂密，露水凝结成白霜。"所谓伊人，在水一方"——那个我思念的人啊，就在河水的那一边。逆流而上去寻她，道路险阻漫长；顺流而下去寻她，她仿佛就在水中央，可望而不可即。这种"在水一方"的意象，成为中国文学中最经典的思念意象之一。"道阻且长"却依然"溯洄从之"，那份执着和深情令人动容。全诗三章反复咏唱，只变换了几个字，却把思念之情层层推进，余韵悠长。',
    tags: ['诗经', '思念'] },
  { id: 115, title: '式微', author: '《诗经》', dynasty: '周', level: 'middle', grade: '八年级',
    content: '式微，式微，胡不归？微君之故，胡为乎中露！式微，式微，胡不归？微君之躬，胡为乎泥中！',
    notes: '式微：天黑了。', translation: '【逐句品读】这是一首反映劳役苦痛的短诗。天黑了，天黑了，为什么还不回家？两句重复呼喊，极写归心似箭。"微君之故，胡为乎中露"——如果不是为了君王的事情，我怎么会还站在露水中！下章换了一个韵脚，意思相近：如果不是为了君王的役使，我怎么会还在泥水里！两章一唱三叹，以反问的语气，表达了服役之人对繁重劳役的怨恨和对回家的渴望。这首诗后来形成了"式微"这个成语，指事物由兴盛走向衰落。',
    tags: ['诗经', '劳役'] },
  { id: 116, title: '子衿', author: '《诗经》', dynasty: '周', level: 'middle', grade: '八年级',
    content: '青青子衿，悠悠我心。纵我不往，子宁不嗣音？青青子佩，悠悠我思。纵我不往，子宁不来？挑兮达兮，在城阙兮。一日不见，如三月兮。',
    notes: '子衿：你的衣领。嗣音：传音讯。', translation: '【逐句品读】这是一首女子思念情人的诗。"青青子衿"——青青的是你的衣领，"悠悠我心"——悠悠荡漾的是我的心。即使我没有去找你，你难道就不能捎个信来吗？下章换了一个角度：即使我没有去找你，你难道就不能主动来吗？最后"一日不见，如三月兮"——一天不见面，就好像过了三个月！这种对时间的心理感受，写出了相思之苦的煎熬。后来曹操在《短歌行》中引用"青青子衿，悠悠我心"来表达对贤才的渴望，赋予了这句诗全新的含义。',
    tags: ['诗经', '爱情'] },
  { id: 117, title: '送杜少府之任蜀州', author: '王勃', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。',
    notes: '城阙：长安。三秦：长安周边。五津：四川岷江的五个渡口。', translation: '【逐句品读】王勃写这首诗时只有二十岁左右，却已展现出非凡的胸襟。首联气势宏阔：三秦大地拱卫着长安城，遥望你将去的蜀州，风烟茫茫。中间一联最为动人："与君离别意，同是宦游人"——我们都是在外做官的人，离别的心情是相通的。颈联是千古名句："海内存知己，天涯若比邻。"只要四海之内有知心的朋友，即使远在天涯也像邻居一样近。这句话一扫送别诗的悲切之风，意境开阔，豪情万丈。尾联劝勉：不要在分手的路口像小儿女一样哭哭啼啼。全诗格调高昂，读来令人心胸开阔。',
    tags: ['送别', '王勃'] },
  { id: 118, title: '登幽州台歌', author: '陈子昂', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。',
    notes: '幽州台：又称蓟北楼。', translation: '【逐句品读】这首诗是陈子昂登上幽州台时的慷慨悲歌。"前不见古人"——古代的贤明君主和仁人志士已经见不到了。"后不见来者"——未来的英雄豪杰也来不及看到。自己生在这么一个时代，既不能与古人同行，也无法与来者相知。第三句"念天地之悠悠"——想到天地是如此广阔无垠、时间如此绵长无尽。最后"独怆然而涕下"——独自悲伤地流下了眼泪。短短二十二个字，横跨古今，纵贯天地，写出了一个人在浩渺宇宙面前的孤独感和悲壮感。这种孤独不是小我的哀怨，而是对生命有限、时空无限的深沉感慨。',
    tags: ['感怀', '陈子昂'] },
  { id: 119, title: '望岳', author: '杜甫', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。',
    notes: '岱宗：泰山。造化：大自然。曾：同"层"。', translation: '【逐句品读】杜甫写这首诗时年仅二十四岁，正值青春勃发之时。首句"岱宗夫如何"以问句起笔，语势不凡。泰山怎么样？"齐鲁青未了"——从齐到鲁都能看到它绵延不绝的青翠，以空间之广写泰山之高。"造化钟神秀"——大自然把神奇和秀美都聚集在这里。"阴阳割昏晓"——山南山北因阳光照射不同而分割出黄昏和拂晓，一个"割"字写出了泰山之高峻。望见层云叠起，诗人胸中荡起豪情；极目追随归鸟，眼角几乎要裂开。最后两句是千古名句："会当凌绝顶，一览众山小。"一定要登上最高峰，俯瞰群山都变得渺小。这既是写登山，也是写人生志向——年轻杜甫的自信和抱负喷薄而出。',
    tags: ['写景', '壮志', '杜甫'] },
  { id: 120, title: '春望', author: '杜甫', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。',
    notes: '国破：都城被攻破。', translation: '【逐句品读】安史之乱中，长安沦陷，杜甫被叛军抓住困在城中。首联"国破山河在，城春草木深"——国家沦陷了，山河依旧；春天又来了，城中却草木深深、人烟稀少。一个"破"字触目惊心，一个"深"字满目荒凉。颔联"感时花溅泪，恨别鸟惊心"——感伤时局，看到鲜花都忍不住落泪；痛恨离别，听到鸟鸣都心惊肉跳。花鸟本是让人愉悦的，在诗人眼中却成了伤感的源头，这就是"移情"的妙用。颈联"烽火连三月，家书抵万金"——战火不断，一封家书比万两黄金还珍贵。尾联写自己的衰老：白发越搔越少，简直连发簪都插不住了。全诗沉郁顿挫，字字含悲。',
    tags: ['爱国', '杜甫'] },
  { id: 121, title: '茅屋为秋风所破歌', author: '杜甫', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！',
    notes: '三重茅：几层茅草。丧乱：安史之乱。', translation: '【逐句品读】这是杜甫最感人至深的叙事诗之一。全诗分四层：第一层写狂风卷走屋顶茅草的狼狈场景——"卷我屋上三重茅"，写得鲜活生动。第二层写南村群童抱走茅草，诗人喊不住只能叹息——写出了诗人的无奈和困窘。第三层写屋漏偏逢连夜雨的苦况——布被冷得像铁、床头漏得没有干处。第四层是全诗最伟大的升华：由自己的困境想到了天下所有像自己一样的寒士。"安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山。"这是一种何等博大的胸怀！自己已经如此困苦，却还在为天下人着想。最后"吾庐独破受冻死亦足"——只要天下人都有了庇护，我一个人冻死也值得！这就是杜甫被称为"诗圣"的原因——他的仁爱之心超越了个人的苦难，达到了"民胞物与"的境界。',
    tags: ['感怀', '杜甫'] },
  { id: 122, title: '卖炭翁', author: '白居易', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。',
    notes: '敕：皇帝的命令。宫使：宫廷的使者。', translation: '【逐句品读】白居易的《卖炭翁》是新乐府运动的代表作，揭露了"宫市"的罪恶。前六句写老人的艰辛——满脸灰尘、十指乌黑，在南山中辛苦烧炭。"可怜身上衣正单，心忧炭贱愿天寒"是全诗最震撼的细节：身上衣服单薄却希望天更冷一些——因为天冷炭才能卖个好价钱。这种"不以己寒为苦，反以炭贱为忧"的心理，写出了底层百姓生存的辛酸。后六句写悲剧的发生：两个宫使拿着文书假传圣旨，把一千多斤的炭强行夺走，只给了半匹红纱和一丈绫子挂在牛头上作为"报酬"。老人一年的辛苦就这样被掠夺了。白居易以冷静的笔调叙述，不做评论却胜似千言万语。',
    tags: ['讽喻', '白居易'] },
  { id: 123, title: '饮酒（其五）', author: '陶渊明', dynasty: '东晋', level: 'middle', grade: '八年级',
    content: '结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。',
    notes: '结庐：建造房屋。', translation: '【逐句品读】这是陶渊明最著名的田园诗。"结庐在人境，而无车马喧"——我住在人世间却没有世俗车马的喧嚣。这是什么原因呢？"问君何能尔？心远地自偏。"只要内心远离了世俗纷扰，自然就感到住的地方偏僻安静了。这是全诗的纲领——真正的宁静不在于环境，而在于心境。"采菊东篱下，悠然见南山"是最美的两句：在东篱下采菊花，不经意间抬起头，南山悠然出现在眼前。"见"字妙绝——不是刻意去看，而是自然相遇，物我两忘。山间的气象在傍晚最美，飞鸟结伴归巢，一切都是那么自然和谐。最后"此中有真意，欲辨已忘言"——这里面有人生的真谛，想要说出来却已经忘了怎么表达。真正的妙处是无法言说的。',
    tags: ['田园', '陶渊明'] },
  { id: 124, title: '行路难（其一）', author: '李白', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，直挂云帆济沧海。',
    notes: '羞：同"馐"，菜肴。直：同"值"。', translation: '【逐句品读】李白写这首诗时被排挤出长安，内心极度苦闷。前四句写摆在面前的是美酒佳肴，但他"停杯投箸不能食，拔剑四顾心茫然"——放下杯子筷子吃不下去，拔出宝剑四顾茫然。这种食不知味的描写，强烈地传达出内心的苦闷。"欲渡黄河冰塞川，将登太行雪满山"——想去渡黄河河水结冰，想去登太行大雪封山，喻示人生的道路处处受阻。但李白毕竟是李白，在极度苦闷之后笔锋突转："长风破浪会有时，直挂云帆济沧海。"总有一天我能乘长风破万里浪，高挂云帆直渡大海！这种在困境中绝不放弃希望的精神，正是李白最可贵的地方。全诗情感跌宕起伏，从苦闷到迷茫再到豪迈，如同一曲激昂的命运交响曲。',
    tags: ['壮志', '李白'] },
  { id: 125, title: '雁门太守行', author: '李贺', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。半卷红旗临易水，霜重鼓寒声不起。报君黄金台上意，提携玉龙为君死。',
    notes: '燕脂：胭脂。玉龙：宝剑的代称。', translation: '【逐句品读】李贺的诗歌以奇诡瑰丽著称，这首边塞诗就是典型。"黑云压城城欲摧"——乌云压城，城墙像要倒塌一样，写出了敌军压境的紧张气氛。"甲光向日金鳞开"——阳光透过云隙照射在铠甲上，金光闪闪，如同金色的鱼鳞。这一黑一金的对比，画面感极强。"角声满天秋色里"——军中的号角声在秋空中回荡。"塞上燕脂凝夜紫"——暮色中将士的鲜血像胭脂一样凝结成紫色，色彩浓烈。后两句写夜袭易水的情景：红旗半卷，霜重鼓寒，战鼓声音低沉。最后以将士的誓言收尾：为了报答君主的厚恩，手提宝剑誓死报国。全诗设色浓烈，意象奇诡，充满悲壮的美感。',
    tags: ['边塞', '李贺'] },
  { id: 126, title: '赤壁', author: '杜牧', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '折戟沉沙铁未销，自将磨洗认前朝。东风不与周郎便，铜雀春深锁二乔。',
    notes: '戟：古代兵器。周郎：周瑜。', translation: '【逐句品读】这是一首借赤壁古物来抒发历史感慨的咏史诗。诗人捡到一支沉埋在沙中的断戟，磨洗后认出是赤壁之战时的遗物。由此引发了对那段历史的遐想："东风不与周郎便，铜雀春深锁二乔。"如果当年周瑜没有借到东风之助，战败的话，大乔和小乔这两位东吴的贵妇人就会被曹操关进铜雀台了。诗人以小见大，用"二乔"的命运来暗示赤壁之战的历史意义。但这句话也暗含着对历史偶然性的思考——英雄的成功有时也需要一点运气的成分。杜牧不以议论为诗，却在一个假设中表达了对历史兴亡的深沉感慨。',
    tags: ['咏史', '杜牧'] },
  { id: 127, title: '渔家傲·天接云涛连晓雾', author: '李清照', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '天接云涛连晓雾，星河欲转千帆舞。仿佛梦魂归帝所。闻天语，殷勤问我归何处。我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！',
    notes: '帝所：天帝的住所。谩：空、徒然。', translation: '【逐句品读】这是李清照词中极其罕见的一首豪放之作。天穹与翻涌的云涛相连，晨雾弥漫，银河好像要转动，千帆在太空飞舞——开篇就展现了一个奇幻壮阔的梦境。梦魂升入天帝的住所，天帝殷切地问我要去哪里。我回答：前路漫长又已经到了日暮，学诗空有惊人句却无处施展。最后以大鹏展翅的意象收尾：九万里的大鹏正展翅高飞，风不要停下来，把我的小舟吹到蓬莱三山去！这首词气势磅礴、想象奇丽，完全不像出自婉约派李清照之手。写这首词时她正处于南渡之后的困境中，词中"路长嗟日暮"是她对人生困境的感叹，而"九万里风鹏正举"则是她不甘屈服的精神写照。',
    tags: ['豪放', '李清照'] },
  { id: 128, title: '浣溪沙·一曲新词酒一杯', author: '晏殊', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。',
    notes: '浣溪沙：词牌名。', translation: '【逐句品读】晏殊是北宋"太平宰相"，生活优裕，但他的词却总有一种淡淡的忧伤。上片写听新词、饮美酒，似乎是很快意的事。但第二句"去年天气旧亭台"——天气还是去年的天气，亭台还是往日的亭台——暗示光景如常而人事已非。"夕阳西下几时回？"夕阳下山明天还会再升起来，可逝去的时光还会回来吗？下片"无可奈何花落去，似曾相识燕归来"是千古名句：花儿凋落让人无可奈何，而燕子归来又似曾相识。花落是消逝，燕归是重逢，一去一来之间，蕴含着深刻的人生感悟。"小园香径独徘徊"——诗人独自在落满花瓣的小路上徘徊，回味着这一切，余韵悠长。',
    tags: ['感怀', '晏殊'] },
  { id: 129, title: '采桑子·轻舟短棹西湖好', author: '欧阳修', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '轻舟短棹西湖好，绿水逶迤。芳草长堤，隐隐笙歌处处随。无风水面琉璃滑，不觉船移。微动涟漪，惊起沙禽掠岸飞。',
    notes: '棹：船桨。逶迤：蜿蜒曲折。', translation: '【逐句品读】欧阳修晚年退居颍州西湖，写下了十首《采桑子》赞美西湖风光。轻舟短桨，湖水碧绿蜿蜒；芳草长堤，隐约有笙歌处处相伴。下片写静中之美：无风时水面像琉璃一样平滑，感觉不到船在移动——这是一种极致的静谧。但忽然"微动涟漪，惊起沙禽掠岸飞"——船桨不经意间荡起涟漪，惊动了沙滩上的水鸟，它们掠过湖岸飞走了。以动写静，更显出湖面的宁静。欧阳修用细腻的笔触，捕捉了西湖静谧中蕴含的生命气息。',
    tags: ['写景', '欧阳修'] },
  { id: 130, title: '相见欢·无言独上西楼', author: '李煜', dynasty: '五代', level: 'middle', grade: '八年级',
    content: '无言独上西楼，月如钩。寂寞梧桐深院锁清秋。剪不断，理还乱，是离愁。别是一般滋味在心头。',
    notes: '相见欢：词牌名。', translation: '【逐句品读】李煜被宋太宗囚禁汴京后，写下了许多亡国之痛的词作。上片写景：默默无言独自登上西楼，残月如钩，寂寞的梧桐树和深深的庭院被清冷的秋色笼罩——一个"锁"字写出了被囚禁的无奈。下片写情："剪不断，理还乱，是离愁。"离愁就像一团乱麻，想剪剪不断，想理越理越乱。这个比喻太精妙了——抽象的离愁被写得如此具体可感。最后"别是一般滋味在心头"——有一种说不清道不明的滋味在心中翻滚。不说痛苦而痛苦自见，不说悲伤而悲伤满纸。李煜用最朴素的语言写出了最深沉的情感，这正是他词作千古流传的原因。',
    tags: ['李煜', '离愁'] },
  { id: 131, title: '如梦令·常记溪亭日暮', author: '李清照', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡，争渡，惊起一滩鸥鹭。',
    notes: '如梦令：词牌名。', translation: '【逐句品读】这是李清照少女时期的作品，洋溢着青春的活力。常常记起在溪亭游玩到日暮，喝醉了找不到回家的路——"常记"说明这是她记忆中最快乐的时光。游兴尽了晚上才划船回去，一不小心进入了荷花深处。"争渡，争渡，惊起一滩鸥鹭"——快快划呀快快划，桨声和笑声惊起了满滩的水鸟。一个"争"字写出了少女们慌乱又欢快的模样。全词以极简的笔触，勾画出一幅生机盎然的少女游乐图。那时的李清照还没有经历国破家亡的苦难，她的笔下是那么明快、灵动、自由。',
    tags: ['李清照', '记游'] },

  // ===== 九年级 =====
  { id: 132, title: '行路难（其一）', author: '李白', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，直挂云帆济沧海。',
    notes: '', translation: '【逐句品读】李白怀着济世之志入长安，却被权贵排挤，只做了个闲职，最终愤而离开。这首诗就是他离开长安时的内心独白。美酒佳肴在前却食不下咽——"停杯投箸""拔剑四顾"两个动作写出了内心的挣扎和茫然。用"冰塞黄河""雪满太行"来比喻仕途的艰难，极具形象感。但李白不是沉沦的人，他在困顿中想到了姜子牙垂钓碧溪、伊尹梦舟日边的故事——先贤也曾困顿却终成大业。于是他从低沉中挣脱出来，高唱"长风破浪会有时，直挂云帆济沧海"。这首诗之所以千百年来激励了无数人，就在于它展示了如何在逆境中重拾信心——绝望后的希望，才是真正的希望。',
    tags: ['李白', '壮志'] },
  { id: 133, title: '酬乐天扬州初逢席上见赠', author: '刘禹锡', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。',
    notes: '闻笛赋：向秀的《思旧赋》。烂柯人：王质观棋烂斧柄的故事。', translation: '【逐句品读】刘禹锡在巴山楚水这些荒凉的地方被贬了二十三年——人生能有几个二十三年？回来后老朋友大多已去世，只能像向秀写《闻笛赋》那样怀念他们。回到家乡感觉像"烂柯人"一样——自己才过了二十三年，家乡却已物是人非。但刘禹锡最让人敬佩的就是他从不向命运低头。"沉舟侧畔千帆过，病树前头万木春"——沉船的旁边千帆竞发，病树的前头万木逢春。这两句充满哲理：个人的困顿不算什么，世间万物总是在向前发展。他以"沉舟""病树"自比，虽有自嘲之意，但更多的是对后辈人才辈出的欣慰和对自己终将重获新生的信心。白居易写诗赠他，他回赠了这首诗，所以诗人说"暂凭杯酒长精神"——喝下这杯酒，重振精神！',
    tags: ['感怀', '刘禹锡'] },
  { id: 134, title: '水调歌头·明月几时有', author: '苏轼', dynasty: '宋', level: 'middle', grade: '九年级',
    content: '明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。',
    notes: '宫阙：宫殿。婵娟：月亮。', translation: '【逐句品读】这是中国最著名的中秋词，作于苏轼因与变法派政见不合而外放密州时。开篇"明月几时有？把酒问青天"——问得奇崛，仿佛与宇宙对话。他想乘风归去月宫，又怕高处太冷——这其实暗喻了身在官场的矛盾心态：想退隐又放不下责任。"起舞弄清影，何似在人间"——月宫虽好，不如人间真实。下片由月及人：月亮照着朱楼、低挂绮窗、照着失眠的人。接着是千古名句："人有悲欢离合，月有阴晴圆缺，此事古难全。"人生有悲欢离合就像月亮有阴晴圆缺一样，自古以来就是如此，何必强求完美？最后以温暖的祝福收尾："但愿人长久，千里共婵娟。"只要亲人健康平安，即使相隔千里也能共享这美好的月光。全词洒脱旷达又情深意切，是苏轼超然人生态度的最好体现。',
    tags: ['中秋', '苏轼'] },
  { id: 135, title: '月夜忆舍弟', author: '杜甫', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。',
    notes: '舍弟：对人称自己的弟弟。', translation: '【逐句品读】安史之乱中，杜甫与几个弟弟离散，不知生死，写下了这首诗。首句写战乱的氛围：戍楼上的禁鼓响起，行人断绝——边塞的秋天，一只孤雁飞过、鸣声凄厉。这孤雁何尝不是诗人自己的写照？"露从今夜白，月是故乡明"——从今夜起白露已降天气转凉，但无论走到哪里，总觉得故乡的月亮最明亮。这句诗已成为思念故乡的代名词。后四句直写思念之情：几个弟弟都分散了，没有家可以探问他们的生死；寄信常常收不到，因为战事还没有停止。全诗语言朴素，没有华丽的修饰，却有着最打动人心的力量——因为字字都是真情实感。',
    tags: ['思乡', '杜甫'] },
  { id: 136, title: '长沙过贾谊宅', author: '刘长卿', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '三年谪宦此栖迟，万古惟留楚客悲。秋草独寻人去后，寒林空见日斜时。汉文有道恩犹薄，湘水无情吊岂知。寂寂江山摇落处，怜君何事到天涯！',
    notes: '谪宦：贬官。栖迟：居住。', translation: '【逐句品读】贾谊是西汉的才子，被贬为长沙王太傅，三年后抑郁而终。刘长卿自己也被贬经过长沙，凭吊贾谊故居，实际上是在为自己鸣不平。首联写贾谊被贬三年，万古留下楚客的悲哀。颔联"秋草独寻人去后，寒林空见日斜时"——在秋草中独自寻找贾谊的遗迹，却只看到夕阳斜照着寒冷的树林，意境苍凉。颈联说汉文帝是有道明君却对贾谊还是那么刻薄——暗示当今皇帝对自己的不公。尾联"寂寂江山摇落处，怜君何事到天涯"——在这草木摇落的寂寥时节，可怜你为什么被贬到这天涯来了？表面上问贾谊，实际上是在问自己。借古人之酒杯浇自己之块垒，是咏史诗最常用的手法。',
    tags: ['感怀', '刘长卿'] },
  { id: 137, title: '左迁至蓝关示侄孙湘', author: '韩愈', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '一封朝奏九重天，夕贬潮州路八千。欲为圣明除弊事，肯将衰朽惜残年！云横秦岭家何在？雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。',
    notes: '左迁：贬官。蓝关：陕西蓝田。', translation: '【逐句品读】韩愈因上表劝阻唐宪宗迎佛骨入宫，被贬到八千里外的潮州。早晨还在朝廷上奏，傍晚就被贬黜——速度之快，可见触怒之甚。"欲为圣明除弊事，肯将衰朽惜残年"——我上书是为了替皇上除去弊端，怎会因为自己衰老就吝惜余生呢？这两句充满了正义感和悲壮感。第三联写行路之艰辛：云横秦岭，回望长安，家在何处？大雪拥塞蓝关，连马都不肯前行。最后对前来送行的侄孙韩湘说：你远道而来应该是知道此去凶多吉少，好在瘴江边收拾我的尸骨吧。语气悲凉却不后悔，体现了韩愈"道之所在，虽千万人吾往矣"的精神。',
    tags: ['韩愈', '感怀'] },
  { id: 138, title: '商山早行', author: '温庭筠', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。',
    notes: '征铎：远行马车的铃声。', translation: '【逐句品读】"鸡声茅店月，人迹板桥霜"是千古名句——旅店晨起，鸡鸣声中残月还挂在天上，板桥的白霜上已经印下了早行人的足迹。这两句把"鸡声""茅店""月""人迹""板桥""霜"六个名词并置，没有用一个动词，却构成了一幅完整的早行图。"槲叶落山路，枳花明驿墙"——春天来了，槲叶落在山路上，白色的枳花照亮了驿站的墙壁。最后说因昨夜梦回了杜陵的故居，池塘里落满了野鸭和大雁——梦境越温暖，现实就越凄凉。全诗以早行之苦为底色，以故乡之梦为寄托，是写"早行"最经典的作品。',
    tags: ['思乡', '温庭筠'] },
  { id: 139, title: '咸阳城东楼', author: '许浑', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '一上高城万里愁，蒹葭杨柳似汀洲。溪云初起日沉阁，山雨欲来风满楼。鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。行人莫问当年事，故国东来渭水流。',
    notes: '汀洲：水中小洲。', translation: '【逐句品读】"山雨欲来风满楼"是千古名句——山雨就要来了，大风已经灌满了整座楼阁。这句诗已成为形容重大事件发生前紧张气氛的经典表达。全诗写诗人登上咸阳城楼，远眺昔日秦汉宫殿的废墟，感叹历史兴亡。芦苇杨柳笼罩在烟霭中，似曾相识；溪上云起、夕阳沉阁，风雨欲来。秦苑的绿芜中飞鸟落下，汉宫的黄叶间秋蝉哀鸣——曾经辉煌的宫殿如今只剩荒草枯叶。最后一句"行人莫问当年事，故国东来渭水流"——不要问当年那些往事了，往事已经像渭水一样东流而去。物是人非，唯有渭水依旧流淌。',
    tags: ['感怀', '许浑'] },
  { id: 140, title: '无题·相见时难别亦难', author: '李商隐', dynasty: '唐', level: 'middle', grade: '九年级',
    content: '相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。',
    notes: '丝：双关"思"。蓬山：蓬莱仙山。青鸟：信使。', translation: '【逐句品读】这是李商隐最著名的爱情诗。"相见时难别亦难"——相见已经很难了，分别时更难割舍。"东风无力百花残"——暮春时节东风无力百花凋残，以景衬情。"春蚕到死丝方尽，蜡炬成灰泪始干"是千古名句：春蚕直到死吐出的丝才吐尽，蜡烛烧成灰烬泪才流干。这里的"丝"谐音"思"，以春蚕的丝比喻相思的绵绵不绝，以蜡烛的泪比喻无尽的相思之泪。这是对爱情至死不渝的最高承诺。"晓镜但愁云鬓改"——早晨照镜子担心青春容颜消逝。"夜吟应觉月光寒"——夜里吟诗感到月光清冷。最后说蓬莱仙山离此不远，希望有青鸟信使为我殷勤探看。全诗深婉缠绵，把爱情写得刻骨铭心。',
    tags: ['爱情', '李商隐'] },
  { id: 141, title: '行香子·树绕村庄', author: '秦观', dynasty: '宋', level: 'middle', grade: '九年级',
    content: '树绕村庄，水满陂塘。倚东风、豪兴徜徉。小园几许，收尽春光。有桃花红，李花白，菜花黄。远远围墙，隐隐茅堂。飏青旗、流水桥旁。偶然乘兴、步过东冈。正莺儿啼，燕儿舞，蝶儿忙。',
    notes: '陂塘：池塘。', translation: '【逐句品读】秦观是婉约派大家，但这首词写得清新明快，别具一格。绿树绕着村庄，春水涨满了池塘，迎着东风尽情游赏。一个小园子虽然不大，却收尽了春光——"有桃花红，李花白，菜花黄"，三色花交相辉映，色彩明丽。远处有围墙和隐约的茅堂，酒旗在流水桥旁飘扬。偶然乘兴走过东冈，正是"莺儿啼，燕儿舞，蝶儿忙"——三个排比句写出了一派生机盎然的景象。全词用白描手法，以欢快的笔调写出了田园春日的无限生机。',
    tags: ['田园', '秦观'] },
  { id: 142, title: '丑奴儿·书博山道中壁', author: '辛弃疾', dynasty: '宋', level: 'middle', grade: '九年级',
    content: '少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。',
    notes: '丑奴儿：词牌名。', translation: '【逐句品读】这首词写了两种"愁"的对比。少年时代不知道什么是真正的愁，却喜欢登上高楼——"爱上层楼"——为了写新词勉强说愁。"强说愁"三个字生动写出了少年人无病呻吟的状态。如今经历了人生的坎坷之后，"识尽愁滋味"——尝尽了真正的愁是什么滋味。但最深的愁反而说不出来了，"欲说还休"——想说却又停住了。最后"却道天凉好个秋"——只说了一句"好凉爽的秋天啊"。用一句无关痛痒的话来掩饰内心难以言说的苦痛，这才是真正经历过沧桑的人才会有的反应。全词明白如话却含义深刻，是辛弃疾一生坎坷经历的浓缩。',
    tags: ['感怀', '辛弃疾'] },
  { id: 143, title: '岳阳楼记（节选）', author: '范仲淹', dynasty: '宋', level: 'middle', grade: '九年级',
    content: '予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也。不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。先天下之忧而忧，后天下之乐而乐。',
    notes: '胜状：美景。庙堂：朝廷。', translation: '【逐句品读】范仲淹的《岳阳楼记》是中国古代散文的巅峰之作。他认为洞庭湖的美景可用"衔远山，吞长江"来形容——"衔"和"吞"两个动词把洞庭湖写活了，写出了它包容万物的气势。后文的核心是"不以物喜，不以己悲"——不因外物的好坏或自己的得失而或喜或悲。这是一种超越个人得失的境界。"居庙堂之高则忧其民，处江湖之远则忧其君"——无论身在朝堂还是身处乡野，心中都装着国家和百姓。最后"先天下之忧而忧，后天下之乐而乐"是范仲淹一生的人格写照——在天下人担忧之前先担忧，在天下人享乐之后才享乐。这种以天下为己任的精神，成为中国士大夫的最高理想。',
    tags: ['范仲淹', '散文'] },
  { id: 144, title: '醉翁亭记（节选）', author: '欧阳修', dynasty: '宋', level: 'middle', grade: '九年级',
    content: '环滁皆山也。其西南诸峰，林壑尤美。望之蔚然而深秀者，琅琊也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。',
    notes: '滁：滁州。醉翁：欧阳修自称。', translation: '【逐句品读】"醉翁之意不在酒"已经成为中国家喻户晓的成语。欧阳修被贬到滁州后，修建了醉翁亭。他自称"醉翁"，但醉翁的意趣并不在酒上，而在山水之间。山水的乐趣，领会在心里，寄托在酒上。这句话实际上表达了欧阳修的一种人生哲学——寄情山水以排遣政治上的失意，看似颓废，实则通达。文章开篇"环滁皆山也"据说欧阳修改了很多稿，最初写了几十字来描写滁州四周的山，最后浓缩为五个字，可见其炼字功夫之深。',
    tags: ['欧阳修', '散文'] },
  { id: 145, title: '湖心亭看雪', author: '张岱', dynasty: '明', level: 'middle', grade: '九年级',
    content: '崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。',
    notes: '更定：初更以后。毳衣：毛皮衣。', translation: '【逐句品读】张岱在大雪三日之后，独自一人划船去湖心亭看雪。此时天、云、山、水融为一体，上下一片纯白。湖上的影子只有长堤一道痕迹、湖心亭一个黑点、自己的小船像一颗芥子、船上的两三个人像几粒米罢了——这种"一痕、一点、一芥、两三粒"的描写极有层次感，写出了人在广阔天地间的渺小。更妙的是，到了湖心亭竟然发现有两个人早已铺毡对坐饮酒——原来天底下并不只有他一个"痴人"。到亭上与那两人共饮，被拉来同饮，最后"莫说相公痴，更有痴似相公者"收尾，境界全出。这篇小品文意境空灵，是中国古典散文中的神品。',
    tags: ['张岱', '散文'] },

  // ===== 文言文补充（通用） =====
  { id: 146, title: '《论语》十二章（节选）', author: '孔子及弟子', dynasty: '春秋', level: 'middle', grade: '七年级',
    content: '学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？学而不思则罔，思而不学则殆。三人行，必有我师焉。择其善者而从之，其不善者而改之。知之者不如好之者，好之者不如乐之者。',
    notes: '说：同"悦"。愠：恼怒。罔：迷惑。殆：疑惑。', translation: '【逐句品读】《论语》是孔子及其弟子的语录集。这里选了其中最有名的几章。"学而时习之，不亦说乎"——学习并经常温习实践，不是很快乐吗？孔子把学习看作一种快乐。"有朋自远方来，不亦乐乎"——有志同道合的朋友远道而来，不是很快乐吗？"人不知而不愠，不亦君子乎"——别人不理解我，我也不恼怒，这不是君子的修养吗？这三句分别从学习、交友、修养三个角度阐述了君子的品质。"学而不思则罔，思而不学则殆"——只学习不思考就会迷惘，只思考不学习就会陷入困境。强调了学和思的辩证关系。"三人行，必有我师焉"——三个人同行一定有我的老师，善于向任何人学习。"知之者不如好之者，好之者不如乐之者"——知道不如喜欢，喜欢不如以此为乐。',
    tags: ['论语', '哲理'] },
  { id: 147, title: '曹刿论战（节选）', author: '左丘明', dynasty: '春秋', level: 'middle', grade: '九年级',
    content: '夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。',
    notes: '鼓：击鼓进军。', translation: '【逐句品读】"一鼓作气"已经成了中国人常用的成语。曹刿论战的核心观点是：打仗靠的是勇气。第一次击鼓时士气最旺盛，第二次击鼓就开始衰落了，第三次击鼓士气就耗尽了。等对方的士气耗尽了而我方的士气饱满时，就一定能战胜对方。这个道理不仅适用于战争，也适用于人生的许多方面——做事要趁着一股劲头一鼓作气完成，拖延久了就会泄气。曹刿的军事智慧不在于精巧的战术，而在于对"气"的深刻把握。',
    tags: ['左传', '哲理'] },
  { id: 148, title: '鱼我所欲也（节选）', author: '孟子', dynasty: '战国', level: 'middle', grade: '九年级',
    content: '鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。',
    notes: '得兼：同时得到。', translation: '【逐句品读】孟子以鱼和熊掌为比喻来论证一个深刻的人生命题。鱼是我想要的，熊掌也是我想要的，如果两者不能兼得，就舍弃鱼而取熊掌——这是人之常情。由此引出核心论点：生命是我想要的，大义也是我想要的，如果两者不能兼得，就舍弃生命而取大义。这就是"舍生取义"的出处。孟子认为，对每个人来说，都有比生命更宝贵的东西（义），也有比死亡更可耻的事情（不义）。所以真正的君子在生死抉择面前，宁可牺牲生命也要保全大义。这种价值观对中国人的精神世界产生了深远影响。',
    tags: ['孟子', '哲理'] },
  { id: 149, title: '富贵不能淫（节选）', author: '孟子', dynasty: '战国', level: 'middle', grade: '九年级',
    content: '富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。',
    notes: '淫：使迷惑。移：使改变。屈：使屈服。', translation: '【逐句品读】这是孟子关于"大丈夫"的经典定义。什么样的人才能称得上大丈夫？第一，富贵不能使他迷惑——有钱有势了也不放纵堕落；第二，贫贱不能使他动摇——穷困潦倒也不改其志；第三，威武不能使他屈服——面对强权暴力也不低头。做到这三点，才叫真正的大丈夫。这三种考验涵盖了人生的三种极端境遇：富贵、贫贱、威武。无论处于何种境地都能坚守操守、不改变自己的原则，这就是孟子心目中理想的人格。这掷地有声的三句话，成为了后世无数仁人志士的人生信条。',
    tags: ['孟子', '品格'] },
  { id: 150, title: '北冥有鱼（节选）', author: '庄子', dynasty: '战国', level: 'middle', grade: '八年级',
    content: '北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。',
    notes: '北冥：北海。鲲：大鱼。鹏：大鸟。', translation: '【逐句品读】庄子的想象令人叹为观止。北海有一种鱼叫鲲，鲲大到不知道有几千里。它还能变化为鸟，名字叫鹏，鹏的背也有几千里之大。当它振翅高飞时，翅膀就像挂在天边的云朵。庄子的笔下，"化"是一个核心概念——鱼可以化为鸟，万物之间可以互相转化。这种超验的想象力把读者带入了一个极度自由的境界。大鹏的形象象征着超越世俗限制、追求绝对自由的精神。后来"鹏程万里""鲲鹏展翅"都成了形容远大志向的成语。',
    tags: ['庄子', '寓言'] },
  { id: 151, title: '虽有嘉肴（节选）', author: '《礼记》', dynasty: '西汉', level: 'middle', grade: '八年级',
    content: '虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。',
    notes: '嘉肴：好菜。旨：美味。', translation: '【逐句品读】"教学相长"这个成语就出自这里。文章用比喻开篇：即使有美味的菜肴，不吃就不知道它的美味；即使有最好的道理，不学习就不知道它的好处。由此引出核心观点：学习之后才知道自己知识的不足，教别人之后才知道自己理解的困惑。知道自己不足就能反省自己，知道自己的困惑就能激励自己不断进步。所以说"教学相长"——教和学是相互促进的。这个道理告诉我们：教别人是最好的学习方法之一，因为教的过程会暴露自己的盲点，促使自己学得更深入。',
    tags: ['礼记', '哲理'] },
  { id: 152, title: '愚公移山（节选）', author: '《列子》', dynasty: '战国', level: 'middle', grade: '八年级',
    content: '虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？',
    notes: '穷匮：穷尽。', translation: '【逐句品读】愚公移山的故事家喻户晓。面对智叟的嘲笑，愚公说出了这段掷地有声的话：即使我死了，还有儿子在；儿子又生孙子，孙子又生儿子……子子孙孙没有穷尽，但山不会增高，还怕挖不平吗？这段话的逻辑极为有力——以无限的人力对抗有限的山高，总有一天会成功。愚公的"愚"其实是"大智若愚"——他看到了时间的力量和坚持的力量。后来"愚公移山"成为中华民族精神的象征：不怕困难、坚持不懈、代代相传。',
    tags: ['列子', '寓言'] },
  { id: 153, title: '邹忌讽齐王纳谏（节选）', author: '《战国策》', dynasty: '西汉', level: 'middle', grade: '九年级',
    content: '臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王。由此观之，王之蔽甚矣。',
    notes: '私：偏爱。蔽：蒙蔽。', translation: '【逐句品读】邹忌的劝谏方法极其巧妙——他不直接说"大王你被蒙蔽了"，而是用自己的亲身经历来类比。他说自己明明不如徐公美，但妻子偏爱我、妾害怕我、客人有求于我，所以都说我比徐公美。由此推及齐王：齐国的后宫嫔妃没有不偏爱大王的、朝廷大臣没有不害怕大王的、全国百姓没有不有求于大王的——所以大王所受的蒙蔽一定非常严重。以小见大，由私及公，层层推进，令人信服。邹忌的高明之处在于：他不是在批评齐王，而是让齐王自己得出"我被蒙蔽了"的结论。这种"讽谏"艺术，比直言劝谏要有效得多。',
    tags: ['战国策', '劝谏'] },
  { id: 154, title: '出师表（节选）', author: '诸葛亮', dynasty: '三国', level: 'middle', grade: '九年级',
    content: '先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气。',
    notes: '崩殂：帝王去世。疲弊：困乏。', translation: '【逐句品读】《出师表》是诸葛亮北伐前写给后主刘禅的奏表，字字句句都浸透了对蜀汉的赤胆忠心。开头"先帝创业未半而中道崩殂"——刘备创建蜀汉的事业还没完成一半就去世了，一种紧迫感扑面而来。"今天下三分，益州疲弊，此诚危急存亡之秋也"——天下三分，蜀汉最弱最累，真是到了生死存亡的关键时刻。但诸葛亮没有抱怨，而是说大家都不懈努力，是为了报答先帝的恩遇。他劝刘禅"开张圣听"——广开言路，发扬先帝的遗德。全文晓之以理、动之以情，既有严师的教诲，又有慈父的关爱。诸葛亮写这篇表文时，应该已经预感到北伐的艰险，但他义无反顾——因为"鞠躬尽瘁，死而后已"是他的信念。',
    tags: ['诸葛亮', '散文'] },
  { id: 155, title: '桃花源记（节选）', author: '陶渊明', dynasty: '东晋', level: 'middle', grade: '八年级',
    content: '土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。',
    notes: '俨然：整齐的样子。阡陌：田间小路。', translation: '【逐句品读】《桃花源记》是陶渊明虚构的一个世外桃源。这里是桃花源内部的景象：土地平坦开阔，房屋整整齐齐，有良田、池塘、桑树、竹林。田间小路交错相通，鸡鸣狗叫的声音互相都能听到。里面的人在田间耕种劳作，男女的衣着和外面的人完全一样。老人和小孩都安闲快乐。这个画面是陶渊明对理想社会的全部想象——没有战乱、没有压迫、没有剥削，人人安居乐业、与世无争。之所以叫"桃花源"，因为它如同桃花般美好却像源头一样难以追寻。从此"世外桃源"成了中国人心中理想家园的代名词。',
    tags: ['陶渊明', '散文'] },
  { id: 156, title: '小石潭记（节选）', author: '柳宗元', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽。似与游者相乐。',
    notes: '佁然：呆呆的样子。俶尔：忽然。', translation: '【逐句品读】柳宗元被贬永州后写下了著名的"永州八记"，《小石潭记》是其中最精彩的一篇。写潭中的鱼约有百来条，都像在空中游动无所依靠——水清澈到了极致，以至于鱼看起来像悬浮在空中。阳光直照到水底，鱼的影子映在潭底的石头上。它们时而呆呆地一动不动，时而忽然向远处游去，来去轻快。"似与游者相乐"——好像和游玩的人在互相取乐。表面写鱼之乐，实际上是在写自己观鱼之乐。但这种快乐是短暂的，后来柳宗元写到潭上"凄神寒骨，悄怆幽邃"，快乐很快被深沉的孤独感所取代。',
    tags: ['柳宗元', '散文'] },
  { id: 157, title: '陋室铭', author: '刘禹锡', dynasty: '唐', level: 'middle', grade: '八年级',
    content: '山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？',
    notes: '馨：散布很远的香气。鸿儒：大学者。', translation: '【逐句品读】刘禹锡被贬时住在一间简陋的屋子里，却写下了这篇充满自信的短文。开头以山水起兴——山不在高有仙则名，水不在深有龙则灵——暗示房子不在于是否华丽，而在于住在里面的人。我的屋子虽然简陋，但"惟吾德馨"——因为我的品德美好而芬芳。后面具体描写陋室中的生活：苔藓爬上台阶一片碧绿，草色映入帘中满眼青翠——环境清幽。"谈笑有鸿儒，往来无白丁"——来往的都是博学之士。可以弹琴读书，没有世俗的音乐扰乱耳朵，没有官府的公文劳累身体。最后举出诸葛亮和扬雄的故居——他们的房子也很简陋，但都因主人而名垂千古。孔子说过："君子居之，何陋之有？"刘禹锡没有明引，但结论不言自明。整篇文章不到百字，却展现了一个高洁雅士的精神世界。',
    tags: ['刘禹锡', '散文'] },
  { id: 158, title: '爱莲说（节选）', author: '周敦颐', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。',
    notes: '濯：洗涤。亵玩：亲近玩弄。', translation: '【逐句品读】周敦颐是理学家，但他用文学的方式来表达自己的品格追求。百花之中，他独独喜爱莲花。"出淤泥而不染"——从淤泥里长出来却不被污染，比喻身处污浊环境却能保持纯洁。"濯清涟而不妖"——经过清水的洗涤却不显得妖艳，比喻内在修养而不追求外在浮华。"中通外直，不蔓不枝"——内心通达外表正直，不攀附不拉扯。"香远益清"——香气越远越清香。最后"可远观而不可亵玩"——只可远远地欣赏，不可轻慢地玩弄。这哪里是在写莲花？分明是在写一种理想人格：正直清廉、自尊自爱、凛然不可侵犯。周敦颐以莲花自喻，告诉世人什么才是真正的君子之风。',
    tags: ['周敦颐', '散文'] },
  { id: 159, title: '记承天寺夜游', author: '苏轼', dynasty: '宋', level: 'middle', grade: '八年级',
    content: '元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。',
    notes: '元丰：宋神宗年号。', translation: '【逐句品读】这是苏轼被贬黄州期间写的一篇短文，全文只有八十多字，却是中国古代小品文中的极品。元丰六年十月十二日夜里，苏轼正准备脱衣睡觉，月光照进门来，他便欣然起身出门。想没有一起游乐的人，就去承天寺找张怀民——怀民也还没睡，两个"闲人"便在院子里散步。最精彩的是对月光的描写："庭下如积水空明，水中藻荇交横，盖竹柏影也。"月光洒在庭院里像积了一池清澈的水，水中的藻荇交错纵横——原来是竹柏的影子。用水的比喻写月光，用藻荇的比喻写竹影，精妙绝伦。最后"何夜无月？何处无竹柏？但少闲人如吾两人者耳"——哪个夜晚没有月？哪里没有竹柏？只是缺少像我们两个这样有闲情逸致的人罢了。被贬黄州的艰难处境，却在苏轼笔下成了赏月观竹的雅致时光。这种化苦为乐的洒脱，正是苏轼最令人敬佩的地方。',
    tags: ['苏轼', '散文'] },
  { id: 160, title: '送东阳马生序（节选）', author: '宋濂', dynasty: '明', level: 'middle', grade: '九年级',
    content: '余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。',
    notes: '假借：借。弗之怠：不因此懈怠。', translation: '【逐句品读】宋濂给同乡后辈马生写的这篇赠序，现身说法，劝勉年轻人珍惜学习机会。他从小就好学，但家里穷买不起书，就向藏书的人家去借，亲手抄写，按时归还。冬天特别冷，砚台里的墨都冻成了冰，手指冻僵了伸不直，但他从不懈怠——"弗之怠"三个字写出了勤学的精神。抄完赶紧跑着送还，不敢超过约定的期限。因此大家都愿意把书借给他，他才能遍览群书。今天的年轻人可能很难理解这种求学的艰辛——没有课本、没有暖气、手抄全部。宋濂的求学经历和他最终成为大学者的成就，有力地证明了：决定一个人成就的，不是物质条件，而是勤奋和坚持。',
    tags: ['宋濂', '散文'] }
];

const highSchoolPoems = [
  // ===== 必修上册 =====
  { id: 201, title: '沁园春·长沙', author: '毛泽东', dynasty: '现代', level: 'high', grade: '必修上册',
    content: '独立寒秋，湘江北去，橘子洲头。看万山红遍，层林尽染；漫江碧透，百舸争流。鹰击长空，鱼翔浅底，万类霜天竞自由。怅寥廓，问苍茫大地，谁主沉浮？携来百侣曾游。忆往昔峥嵘岁月稠。恰同学少年，风华正茂；书生意气，挥斥方遒。指点江山，激扬文字，粪土当年万户侯。曾记否，到中流击水，浪遏飞舟？',
    notes: '橘子洲：长沙湘江中的小岛。百舸：很多船。', translation: '【逐句品读】"独立寒秋，湘江北去，橘子洲头"——深秋时节，诗人独自站在橘子洲头，望着湘江向北流去。"看万山红遍，层林尽染；漫江碧透，百舸争流"——远山红叶层层叠叠、江水碧绿澄澈、百船争流，视野极其开阔。"鹰击长空，鱼翔浅底，万类霜天竞自由"——天高任鸟飞，水阔凭鱼跃，万物都在秋天里竞相展示着生命的自由。下片回忆往昔峥嵘岁月，"恰同学少年，风华正茂；书生意气，挥斥方遒"——正是青春最好的年纪，意气风发、才华横溢，写出了那个时代年轻人的朝气与担当。最后"到中流击水，浪遏飞舟"——到江心游泳激起的浪花甚至阻挡了飞驰的船只，这是何等的豪情壮志！',
    tags: ['毛泽东', '豪放'] },
  { id: 202, title: '芣苢', author: '《诗经》', dynasty: '周', level: 'high', grade: '必修上册',
    content: '采采芣苢，薄言采之。采采芣苢，薄言有之。采采芣苢，薄言掇之。采采芣苢，薄言捋之。采采芣苢，薄言袺之。采采芣苢，薄言襭之。',
    notes: '芣苢：车前草。薄言：发语词。', translation: '【逐句品读】这是一首描写妇女采集车前草的劳动歌谣。全诗三章十二句，只换了六个动词——采、有、掇、捋、袺、襭——却把从开始采到收好的整个过程写得层次分明。采之是采摘、有之是收藏、掇之是拾取、捋之是捋下、袺之是用衣襟兜着、襭之是把衣襟掖在腰间装满。这些动词由浅入深，劳动的节奏感和喜悦感逐层递进。全诗没有一句直接说"快乐"，但那明快的节奏和反复的咏唱，让人真切地感受到劳动的欢愉。',
    tags: ['诗经', '劳动'] },
  { id: 203, title: '文氏外孙入村收麦', author: '苏辙', dynasty: '宋', level: 'high', grade: '必修上册',
