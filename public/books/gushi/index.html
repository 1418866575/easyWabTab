    content: '欲收新麦继陈谷，赖有诸孙替老人。三夜阴霪败场圃，一竿晴日舞比邻。急炊大饼偿饥乏，多博村酤劳苦辛。闭廪归来真了事，赋诗怜汝足精神。',
    notes: '阴霪：连绵的阴雨。村酤：村酒。', translation: '【逐句品读】苏辙晚年闲居，外孙来帮收麦让他倍感欣慰。三天阴雨毁坏了打谷场，忽然天晴了。外孙们急炊大饼充饥、买村酒解乏，把粮食收纳入仓。最后写诗夸他们精神可嘉。全诗洋溢着长辈看到儿孙成长、能够分担农务的欣慰之情。',
    tags: ['劳动', '苏辙'] },

  // ===== 必修上册 - 诗词 =====
  { id: 204, title: '短歌行', author: '曹操', dynasty: '东汉', level: 'high', grade: '必修上册',
    content: '对酒当歌，人生几何！譬如朝露，去日苦多。慨当以慷，忧思难忘。何以解忧？唯有杜康。青青子衿，悠悠我心。但为君故，沉吟至今。呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。明明如月，何时可掇？忧从中来，不可断绝。越陌度阡，枉用相存。契阔谈讌，心念旧恩。月明星稀，乌鹊南飞。绕树三匝，何枝可依？山不厌高，海不厌深。周公吐哺，天下归心。',
    notes: '杜康：酒的代称。吐哺：吐出口中的食物。', translation: '【逐句品读】曹操求贤若渴的政治抒情诗。对酒当歌感慨人生短暂。青青子衿化用诗经表达对贤才的思念。月明星稀乌鹊南飞以乌鹊喻人才择主。山不厌高海不厌深周公吐哺天下归心以周公自比广纳天下人才。',
    tags: ['曹操', '求贤', '壮志'] },
  { id: 205, title: '归园田居（其一）', author: '陶渊明', dynasty: '东晋', level: 'high', grade: '必修上册',
    content: '少无适俗韵，性本爱丘山。误落尘网中，一去三十年。羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。',
    notes: '尘网：官场。羁鸟：笼中鸟。守拙：坚守质朴。', translation: '【逐句品读】陶渊明辞官归隐的宣言。少无适俗韵天性不爱世俗。误落尘网中把官场比作尘网。羁鸟恋旧林池鱼思故渊以笼中鸟池中鱼喻被束缚的痛苦。久在樊笼里复得返自然如释重负的喜悦跃然纸上。',
    tags: ['田园', '陶渊明'] },
  { id: 206, title: '梦游天姥吟留别', author: '李白', dynasty: '唐', level: 'high', grade: '必修上册',
    content: '海客谈瀛洲，烟涛微茫信难求。越人语天姥，云霞明灭或可睹。天姥连天向天横，势拔五岳掩赤城。天台四万八千丈，对此欲倒东南倾。我欲因之梦吴越，一夜飞度镜湖月。湖月照我影，送我至剡溪。谢公宿处今尚在，渌水荡漾清猿啼。脚著谢公屐，身登青云梯。半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已暝。熊咆龙吟殷岩泉，栗深林兮惊层巅。云青青兮欲雨，水澹澹兮生烟。列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。虎鼓瑟兮鸾回车，仙之人兮列如麻。忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。安能摧眉折腰事权贵，使我不得开心颜！',
    notes: '天姥：浙江山名。瀛洲：传说中的仙山。', translation: '【逐句品读】李白最富想象力的梦游诗。从海客谈瀛洲引入天姥山的神奇。梦境中一夜飞度镜湖穿着谢公木屐登上青云梯。最精彩的是仙境场面：列缺霹雳丘峦崩摧洞天石扉訇然中开。忽然梦醒最后愤然高呼安能摧眉折腰事权贵使我不得开心颜！',
    tags: ['李白', '豪放', '梦'] },
  { id: 207, title: '登高', author: '杜甫', dynasty: '唐', level: 'high', grade: '必修上册',
    content: '风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。',
    notes: '渚：水中小洲。落木：落叶。', translation: '【逐句品读】被誉为古今七言律诗第一。无边落木萧萧下不尽长江滚滚来以无边对不尽萧萧对滚滚写尽秋天的苍茫与壮阔。万里悲秋常作客百年多病独登台一句含八重悲意。全诗格律精严情感沉郁。',
    tags: ['杜甫', '秋思'] },
  { id: 208, title: '琵琶行（节选）', author: '白居易', dynasty: '唐', level: 'high', grade: '必修上册',
    content: '浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁，琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。同是天涯沦落人，相逢何必曾相识！',
    notes: '浔阳江：长江九江段。霓裳/六幺：曲名。', translation: '【逐句品读】白居易写琵琶女引出了同是天涯沦落人相逢何必曾相识的千古绝唱。描写音乐极富创造性：大弦嘈嘈如急雨小弦切切如私语大珠小珠落玉盘。诗人从琵琶女的命运看到自己的不幸。',
    tags: ['白居易', '感怀'] },
  { id: 209, title: '念奴娇·赤壁怀古', author: '苏轼', dynasty: '宋', level: 'high', grade: '必修上册',
    content: '大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。',
    notes: '周郎：周瑜。纶巾：头巾。樯橹：指战船。', translation: '【逐句品读】苏轼最著名的豪放词。大江东去浪淘尽千古风流人物开篇气势不凡。乱石穿空惊涛拍岸卷起千堆雪三句排比写尽赤壁壮阔。羽扇纶巾谈笑间樯橹灰飞烟灭写周瑜的从容。人生如梦一尊还酹江月是苏轼特有的旷达。',
    tags: ['苏轼', '怀古'] },
  { id: 210, title: '永遇乐·京口北固亭怀古', author: '辛弃疾', dynasty: '宋', level: 'high', grade: '必修上册',
    content: '千古江山，英雄无觅孙仲谋处。舞榭歌台，风流总被雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？',
    notes: '孙仲谋：孙权。寄奴：刘裕。佛狸：北魏太武帝。', translation: '【逐句品读】辛弃疾登北固亭怀古伤今。千古江山英雄无觅孙仲谋处孙权那样的英雄已找不到。凭谁问廉颇老矣尚能饭否以廉颇自喻壮志未酬的悲愤溢于言表。全词用典极多浑然天成。',
    tags: ['辛弃疾', '怀古'] },
  { id: 211, title: '声声慢·寻寻觅觅', author: '李清照', dynasty: '宋', level: 'high', grade: '必修上册',
    content: '寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？雁过也，正伤心，却是旧时相识。满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！',
    notes: '将息：调养休息。', translation: '【逐句品读】李清照南渡后最著名的代表作。开篇七组叠字寻寻觅觅冷冷清清凄凄惨惨戚戚十四个字三层递进笔力惊人。梧桐更兼细雨到黄昏点点滴滴以雨打梧桐写内心煎熬。怎一个愁字了得此情此景一个愁字哪里说得尽！',
    tags: ['李清照', '秋愁'] },

  // ===== 必修下册 =====
  { id: 212, title: '子路、曾皙、冉有、公西华侍坐（节选）', author: '《论语》', dynasty: '春秋', level: 'high', grade: '必修下册',
    content: '莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。',
    notes: '莫：同"暮"。沂：沂水。舞雩：求雨台。', translation: '暮春时节穿上春装，五六个成年人六七个小孩，在沂水中沐浴在舞雩台上吹风，唱着歌回家。',
    tags: ['论语', '理想'] },
  { id: 213, title: '烛之武退秦师（节选）', author: '左丘明', dynasty: '春秋', level: 'high', grade: '必修下册',
    content: '若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也。焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。',
    notes: '执事：指秦伯。鄙：边邑。行李：使者。共：同"供"。', translation: '如果灭郑对您有好处，我怎敢来麻烦您。越过邻国把远地作为边邑，您知道有多难。灭郑只会增加邻国的实力。邻国增强就是您的削弱。如果留下郑国作为东道主，使者往来供应物资，对您也没坏处。',
    tags: ['左传', '外交'] },
  { id: 214, title: '谏逐客书（节选）', author: '李斯', dynasty: '秦', level: 'high', grade: '必修下册',
    content: '臣闻地广者粟多，国大者人众，兵强则士勇。是以泰山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。',
    notes: '让：推辞。却：拒绝。', translation: '我听说土地广的粮食多，国家大的人口多，军队强的士兵勇敢。所以泰山不推辞土壤所以能成就高大；河海不拒绝细流所以能成就深广；君王不拒绝民众所以能显明功德。',
    tags: ['李斯', '政治'] },
  { id: 215, title: '庖丁解牛（节选）', author: '庄子', dynasty: '战国', level: 'high', grade: '必修下册',
    content: '臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。',
    notes: '道：规律。进乎技：超过技术层面。', translation: '我所喜好的是道已经超越了技术。我开始解牛时看到的无非是整头牛。三年后就不再看到整头牛了。现在我用精神去感知而不用眼睛去看，感官停止而精神运行。',
    tags: ['庄子', '哲理'] },
  { id: 216, title: '鸿门宴（节选）', author: '司马迁', dynasty: '西汉', level: 'high', grade: '必修下册',
    content: '项庄拔剑起舞，项伯亦拔剑起舞，常以身翼蔽沛公，庄不得击。沛公曰："今者出，未辞也，为之奈何？"樊哙曰："大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？"',
    notes: '翼蔽：像翅膀一样遮蔽。俎：砧板。', translation: '项庄拔剑起舞项伯也拔剑起舞用身体掩护沛公。沛公说还没告辞怎么办？樊哙说大行不顾细谨大礼不辞小让。如今人家是刀俎我们是鱼肉还告辞干什么？',
    tags: ['司马迁', '历史'] },
  { id: 217, title: '窦娥冤（节选）', author: '关汉卿', dynasty: '元', level: 'high', grade: '必修下册',
    content: '有日月朝暮悬，有鬼神掌着生死权。天地也！只合把清浊分辨，可怎生糊突了盗跖、颜渊？为善的受贫穷更命短，造恶的享富贵又寿延。天地也！做得个怕硬欺软，却原来也这般顺水推船！地也，你不分好歹何为地！天也，你错勘贤愚枉做天！',
    notes: '糊突：混淆。跖：盗贼。颜渊：孔子的贤弟子。', translation: '天地本该分清善恶为何混淆是非？行善的受贫穷命短作恶的享富贵长寿。天地怕硬欺软顺水推船。地不分好歹枉做地！天错勘贤愚枉做天！',
    tags: ['关汉卿', '戏曲'] },
  { id: 218, title: '谏太宗十思疏', author: '魏征', dynasty: '唐', level: 'high', grade: '必修下册',
    content: '臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可。',
    notes: '浚：疏通。', translation: '我听说想要树木生长必须稳固根本；想要水流远必须疏通源头；想要国家安定必须积累德义。源头不深却希望水流远，根基不固却要求树木长，德行不厚却想国家安定，我知道是不可能的。',
    tags: ['魏征', '政治'] },
  { id: 219, title: '答司马谏议书（节选）', author: '王安石', dynasty: '宋', level: 'high', grade: '必修下册',
    content: '盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官。',
    notes: '君实：司马光的字。', translation: '儒者所争在于名实。名实清楚了天下之理就明白了。您指责我侵官、生事、征利、拒谏而导致天下怨谤。但我是受命于皇上议定法度在朝廷上修订交给有关部门，不算侵官。',
    tags: ['王安石', '政治'] },
  { id: 220, title: '阿房宫赋（节选）', author: '杜牧', dynasty: '唐', level: 'high', grade: '必修下册',
    content: '六王毕，四海一。蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。',
    notes: '六王：六国。兀：光秃。钩心斗角指建筑交错。', translation: '六国灭亡天下统一。蜀山光秃阿房宫建成。覆盖三百多里遮蔽天日。五步一楼十步一阁廊腰缦回檐牙高啄。长桥卧波复道行空。高低冥迷不知西东。',
    tags: ['杜牧', '赋'] },
  { id: 221, title: '六国论（节选）', author: '苏洵', dynasty: '宋', level: 'high', grade: '必修下册',
    content: '六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰弊在赂秦也。',
    notes: '赂：贿赂，指割地求和。', translation: '六国灭亡不是兵器不锋利仗打得不好，弊病在于贿赂秦国。贿赂秦国使国力亏损这是灭亡的原因。不贿赂的国家因贿赂的国家而灭亡。所以说弊病在于贿赂秦国。',
    tags: ['苏洵', '政论'] },

  // ===== 选择性必修 =====
  { id: 222, title: '离骚（节选）', author: '屈原', dynasty: '战国', level: 'high', grade: '选择性必修',
    content: '长太息以掩涕兮，哀民生之多艰。余虽好修姱以鞿羁兮，謇朝谇而夕替。既替余以蕙纕兮，又申之以揽茝。亦余心之所善兮，虽九死其犹未悔。',
    notes: '太息：叹息。鞿羁：约束。', translation: '【逐句品读】屈原的爱国宣言。长太息以掩涕兮哀民生之多艰叹息流泪为的是一般人民生活艰难。亦余心之所善兮虽九死其犹未悔坚持理想虽死不悔已成为中国人追求真理的精神象征。',
    tags: ['屈原', '爱国'] },
  { id: 223, title: '蜀道难', author: '李白', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！',
    notes: '噫吁嚱：惊叹词。蚕丛鱼凫：传说中蜀国的开国君王。', translation: '【逐句品读】噫吁嚱危乎高哉蜀道之难难于上青天开篇破空而来。黄鹤之飞尚不得过猿猱欲度愁攀援极写蜀道之险。全诗一唱三叹令人荡气回肠。',
    tags: ['李白', '豪放'] },
  { id: 224, title: '蜀相', author: '杜甫', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '丞相祠堂何处寻？锦官城外柏森森。映阶碧草自春色，隔叶黄鹂空好音。三顾频频天下计，两朝开济老臣心。出师未捷身先死，长使英雄泪满襟。',
    notes: '丞相：诸葛亮。锦官城：成都。', translation: '【逐句品读】杜甫探访武侯祠。三顾频频天下计两朝开济老臣心概括诸葛亮一生。出师未捷身先死长使英雄泪满襟千古英雄至此泪落。',
    tags: ['杜甫', '怀古'] },
  { id: 225, title: '望海潮·东南形胜', author: '柳永', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。云树绕堤沙，怒涛卷霜雪，天堑无涯。市列珠玑，户盈罗绮，竞豪奢。重湖叠巘清嘉，有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙，乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。',
    notes: '三吴：指吴兴、吴郡、会稽。天堑：钱塘江。', translation: '【逐句品读】柳永写杭州繁华。三秋桂子十里荷花以极简语言写出杭州四季之美。烟柳画桥风帘翠幕参差十万人家写尽城市繁华。',
    tags: ['柳永', '城市'] },
  { id: 226, title: '扬州慢·淮左名都', author: '姜夔', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '淮左名都，竹西佳处，解鞍少驻初程。过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒，都在空城。杜郎俊赏，算而今、重到须惊。纵豆蔻词工，青楼梦好，难赋深情。二十四桥仍在，波心荡，冷月无声。念桥边红药，年年知为谁生？',
    notes: '淮左：扬州。杜郎：杜牧。', translation: '【逐句品读】姜夔路过劫后扬州。过春风十里尽荠麦青青昔日繁华长满了野麦。二十四桥仍在波心荡冷月无声杜牧笔下美景不再。桥边红药年年为谁而生物是人非的沧桑感弥漫全词。',
    tags: ['姜夔', '感怀'] },
  { id: 227, title: '锦瑟', author: '李商隐', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。沧海月明珠有泪，蓝田日暖玉生烟。此情可待成追忆？只是当时已惘然。',
    notes: '锦瑟：装饰华美的瑟。庄生：庄子。望帝：古蜀王。', translation: '【逐句品读】李商隐最朦胧也最优美的诗。庄生晓梦迷蝴蝶望帝春心托杜鹃沧海月明珠有泪蓝田日暖玉生烟四个典故构筑四个凄美意象。此情可待成追忆只是当时已惘然这份情感已成追忆而当时就已让人迷惘了。',
    tags: ['李商隐', '感怀'] },
  { id: 228, title: '虞美人·春花秋月何时了', author: '李煜', dynasty: '五代', level: 'high', grade: '选择性必修',
    content: '春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。',
    notes: '了：了结。雕栏玉砌：指南唐宫殿。', translation: '【逐句品读】李煜被囚后的绝命词。春花秋月本是美好事物他却希望它了结因为会勾起亡国之痛。问君能有几多愁恰似一江春水向东流用春水喻愁之深广绵长。宋太宗因此词毒死了他。',
    tags: ['李煜', '亡国'] },
  { id: 229, title: '望海潮（二）', author: '柳永', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。云树绕堤沙，怒涛卷霜雪，天堑无涯。市列珠玑，户盈罗绮，竞豪奢。重湖叠巘清嘉，有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙，乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。',
    notes: '', translation: '',
    tags: ['柳永', '城市'] },

  // ===== 选择性必修中册 =====
  { id: 230, title: '燕歌行', author: '高适', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '汉家烟尘在东北，汉将辞家破残贼。男儿本自重横行，天子非常赐颜色。摐金伐鼓下榆关，旌旆逶迤碣石间。校尉羽书飞瀚海，单于猎火照狼山。山川萧条极边土，胡骑凭陵杂风雨。战士军前半死生，美人帐下犹歌舞！大漠穷秋塞草腓，孤城落日斗兵稀。身当恩遇恒轻敌，力尽关山未解围。铁衣远戍辛勤久，玉箸应啼别离后。少妇城南欲断肠，征人蓟北空回首。边庭飘飖那可度，绝域苍茫更何有！杀气三时作阵云，寒声一夜传刁斗。相看白刃血纷纷，死节从来岂顾勋？君不见沙场征战苦，至今犹忆李将军！',
    notes: '摐金伐鼓：敲锣打鼓。旌旆：旗帜。', translation: '【逐句品读】高适边塞诗。战士军前半死生美人帐下犹歌舞最震撼的对比战士出生入死将帅却欣赏歌舞。君不见沙场征战苦至今犹忆李将军以李广爱护士卒反衬当今将领的无能。',
    tags: ['高适', '边塞'] },
  { id: 231, title: '李凭箜篌引', author: '李贺', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '吴丝蜀桐张高秋，空山凝云颓不流。江娥啼竹素女愁，李凭中国弹箜篌。昆山玉碎凤凰叫，芙蓉泣露香兰笑。十二门前融冷光，二十三丝动紫皇。女娲炼石补天处，石破天惊逗秋雨。梦入神山教神妪，老鱼跳波瘦蛟舞。吴质不眠倚桂树，露脚斜飞湿寒兔。',
    notes: '箜篌：古代乐器。紫皇：天帝。', translation: '【逐句品读】李贺写音乐的诗想象惊人。昆山玉碎凤凰叫芙蓉泣露香兰笑以玉碎凤鸣写乐声高亢以芙蓉泣露写幽咽。女娲炼石补天处石破天惊逗秋雨乐声把补天石都震破了。',
    tags: ['李贺', '音乐'] },
  { id: 232, title: '过秦论（上）', author: '贾谊', dynasty: '西汉', level: 'high', grade: '选择性必修',
    content: '秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室。有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。于是秦人拱手而取西河之外。',
    notes: '崤函：崤山和函谷关。连衡：连横之策。', translation: '秦孝公据守崤函之固拥雍州之地。有席卷天下包举宇内之意。商鞅辅佐他内立法度外连衡。于是秦人轻易夺取了西河之外的土地。',
    tags: ['贾谊', '史论'] },
  { id: 233, title: '五代史伶官传序（节选）', author: '欧阳修', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。忧劳可以兴国，逸豫可以亡身，自然之理也。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？',
    notes: '伶官：乐官。庄宗：后唐庄宗。', translation: '盛衰之理虽说是天命难道不是人事吗！忧虑勤劳可以兴国安逸享乐可以亡身。祸患常积于细微之处智勇多困于所溺爱。',
    tags: ['欧阳修', '史论'] },
  { id: 234, title: '玩偶之家（节选）', author: '易卜生', dynasty: '近代', level: 'high', grade: '选择性必修',
    content: '娜拉：我现在不相信世界上有奇迹了。我只知道，我必须弄清楚，究竟是社会正确，还是我正确。',
    notes: '选自易卜生戏剧《玩偶之家》的结尾部分。', translation: '',
    tags: ['易卜生', '戏剧'] },

  // ===== 选择性必修下册 =====
  { id: 235, title: '氓', author: '《诗经》', dynasty: '周', level: 'high', grade: '选择性必修',
    content: '氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其反。反是不思，亦已焉哉！',
    notes: '氓：男子。蚩蚩：敦厚的样子。', translation: '【逐句品读】诗经最著名的弃妇诗。从氓之蚩蚩的忠厚到信誓旦旦的热恋到至于暴矣的冷酷。静言思之躬自悼矣独自悲伤。反是不思亦已焉哉既然你翻脸不认了那就这样吧！',
    tags: ['诗经', '爱情'] },
  { id: 236, title: '离骚（节选二）', author: '屈原', dynasty: '战国', level: 'high', grade: '选择性必修',
    content: '余既滋兰之九畹兮，又树蕙之百亩。畦留夷与揭车兮，杂杜衡与芳芷。冀枝叶之峻茂兮，愿俟时乎吾将刈。虽萎绝其亦何伤兮，哀众芳之芜秽。',
    notes: '滋兰：种植兰草。畹：古代面积单位。', translation: '我种了九畹兰花又种了百亩蕙草。还种了留夷揭车杜衡芳芷。希望枝叶茂盛到时间收割。就是枯萎了也没什么可哀伤，可悲的是众芳荒芜变质。',
    tags: ['屈原', '爱国'] },
  { id: 237, title: '蜀道难（完整版）', author: '李白', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟！',
    notes: '', translation: '蜀道之难难于上青天！',
    tags: ['李白', '豪放'] },
  { id: 238, title: '陈情表（节选）', author: '李密', dynasty: '西晋', level: 'high', grade: '选择性必修',
    content: '臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无叔伯，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。',
    notes: '险衅：命运坎坷。闵凶：忧患凶丧。', translation: '【逐句品读】臣无祖母无以至今日祖母无臣无以终余年情真意切催人泪下。李密以祖母年迈为由辞官孝心感人。与诸葛亮的出师表并称古代散文双璧。',
    tags: ['李密', '孝亲'] },
  { id: 239, title: '归去来兮辞（并序节选）', author: '陶渊明', dynasty: '东晋', level: 'high', grade: '选择性必修',
    content: '归去来兮，田园将芜胡不归！既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。',
    notes: '来兮：语助词。谏：挽回。', translation: '【逐句品读】归去来兮田园将芜胡不归一声穿越千年的呼唤。悟已往之不谏知来者之可追实迷途其未远觉今是而昨非。舟遥遥以轻飏风飘飘而吹衣回归自然的自由与欢快。',
    tags: ['陶渊明', '归隐'] },
  { id: 240, title: '种树郭橐驼传（节选）', author: '柳宗元', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。',
    notes: '孳：繁殖。莳：种植。', translation: '【逐句品读】郭橐驼种树的秘密是能顺木之天以致其性焉尔顺应树木天性。柳宗元借种树讲治民不要朝令夕改扰民太甚。',
    tags: ['柳宗元', '哲理'] },
  { id: 241, title: '石钟山记（节选）', author: '苏轼', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详。士大夫终不肯以小舟夜泊绝壁之下，故莫能知。而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。',
    notes: '臆断：凭主观猜测判断。郦元：郦道元。', translation: '事情不是亲眼所见亲耳所闻就主观判断对不对可以吗？士大夫不肯乘小船在夜里泊在绝壁下所以不能知道。渔工水师知道却说不出来。浅陋的人用斧头敲打石头来探究。所以我记下这件事。',
    tags: ['苏轼', '哲理'] },
  { id: 242, title: '登泰山记（节选）', author: '姚鼐', dynasty: '清', level: 'high', grade: '选择性必修',
    content: '泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。',
    notes: '阳：山的南面。阴：山的北面。', translation: '泰山的南面汶水西流北面济水东流。最高峰是日观峰。我在乾隆三十九年十二月从京师冒着风雪经过泰安。',
    tags: ['姚鼐', '游记'] },
  { id: 243, title: '拟行路难（其四）', author: '鲍照', dynasty: '南朝', level: 'high', grade: '选择性必修',
    content: '泻水置平地，各自东西南北流。人生亦有命，安能行叹复坐愁？酌酒以自宽，举杯断绝歌路难。心非木石岂无感？吞声踯躅不敢言。',
    notes: '泻水：倒水。吞声：不敢出声。', translation: '【逐句品读】泻水置平地各自东西南北流以水洒平地喻人生境遇不同。心非木石岂无感吞声踯躅不敢言满腔不平却不敢言说。鲍照出身寒门写尽了寒门士人的痛苦。',
    tags: ['鲍照', '感怀'] },
  { id: 244, title: '客至', author: '杜甫', dynasty: '唐', level: 'high', grade: '选择性必修',
    content: '舍南舍北皆春水，但见群鸥日日来。花径不曾缘客扫，蓬门今始为君开。盘飧市远无兼味，樽酒家贫只旧醅。肯与邻翁相对饮，隔篱呼取尽余杯。',
    notes: '盘飧：菜肴。旧醅：陈酒。', translation: '【逐句品读】杜甫在成都草堂。花径不曾缘客扫蓬门今始为君开从未为客扫过花径初次为你开门足见情谊之深。肯与邻翁相对饮隔篱呼取尽余杯叫上邻翁一起喝亲切自然。',
    tags: ['杜甫', '生活'] },
  { id: 245, title: '登快阁', author: '黄庭坚', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '痴儿了却公家事，快阁东西倚晚晴。落木千山天远大，澄江一道月分明。朱弦已为佳人绝，青眼聊因美酒横。万里归船弄长笛，此心吾与白鸥盟。',
    notes: '痴儿：作者自称。青眼：晋朝阮籍看人用青眼表示喜爱。', translation: '【逐句品读】落木千山天远大澄江一道月分明黄庭坚登快阁所见。朱弦已为佳人绝知音难觅。万里归船弄长笛此心吾与白鸥盟归隐之志。',
    tags: ['黄庭坚', '感怀'] },
  { id: 246, title: '临安春雨初霁', author: '陆游', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '世味年来薄似纱，谁令骑马客京华？小楼一夜听春雨，深巷明朝卖杏花。矮纸斜行闲作草，晴窗细乳戏分茶。素衣莫起风尘叹，犹及清明可到家。',
    notes: '霁：雨后放晴。细乳：沏茶时浮起的细沫。', translation: '【逐句品读】小楼一夜听春雨深巷明朝卖杏花陆游在临安客栈的传世名句。清新隽永暗含着世态炎凉的感慨和归隐之念。',
    tags: ['陆游', '感怀'] },
  { id: 247, title: '书愤', author: '陆游', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间！',
    notes: '楼船：高大的战船。塞上长城：作者自比。', translation: '【逐句品读】楼船夜雪瓜洲渡铁马秋风大散关纯以名词意象写军旅充满动感。塞上长城空自许镜中衰鬓已先斑壮志未酬。',
    tags: ['陆游', '爱国'] },
  { id: 248, title: '临安春雨初霁（完整）', author: '陆游', dynasty: '宋', level: 'high', grade: '选择性必修',
    content: '世味年来薄似纱，谁令骑马客京华？小楼一夜听春雨，深巷明朝卖杏花。矮纸斜行闲作草，晴窗细乳戏分茶。素衣莫起风尘叹，犹及清明可到家。',
    notes: '', translation: '',
    tags: ['陆游', '感怀'] },

  // ===== 选修 =====
  { id: 249, title: '无衣', author: '《诗经》', dynasty: '周', level: 'high', grade: '选修',
    content: '岂曰无衣？与子同袍。王于兴师，修我戈矛，与子同仇！岂曰无衣？与子同泽。王于兴师，修我矛戟，与子偕作！岂曰无衣？与子同裳。王于兴师，修我甲兵，与子偕行！',
    notes: '袍：长袍。泽：内衣。裳：下衣。', translation: '怎能说没有衣服？和你同穿一件袍子。国王发兵打仗，修好我的戈矛，和你共同对敌！怎能说没有衣服？和你同穿一件内衣。国王发兵打仗，修好我的矛戟，和你一起行动！怎能说没有衣服？和你同穿一条战裙。国王发兵打仗，修好我的铠甲兵器，和你一起出征！',
    tags: ['诗经', '爱国'] },
  { id: 250, title: '春江花月夜', author: '张若虚', dynasty: '唐', level: 'high', grade: '选修',
    content: '春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明！江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？可怜楼上月裴回，应照离人妆镜台。玉户帘中卷不去，捣衣砧上拂还来。此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。昨夜闲潭梦落花，可怜春半未还家。江水流春去欲尽，江潭落月复西斜。斜月沉沉藏海雾，碣石潇湘无限路。不知乘月几人归，落月摇情满江树。',
    notes: '芳甸：花草丛生的原野。霰：雪珠。', translation: '【逐句品读】被誉为孤篇压全唐。江畔何人初见月江月何年初照人对宇宙和人类的终极追问。人生代代无穷已江月年年望相似个体生命短暂而人类生生不息。',
    tags: ['张若虚', '哲理'] },
  { id: 251, title: '将进酒', author: '李白', dynasty: '唐', level: 'high', grade: '选修',
    content: '君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。烹羊宰牛且为乐，会须一饮三百杯。岑夫子，丹丘生，将进酒，杯莫停。与君歌一曲，请君为我倾耳听。钟鼓馔玉不足贵，但愿长醉不愿醒。古来圣贤皆寂寞，惟有饮者留其名。陈王昔时宴平乐，斗酒十千恣欢谑。主人何为言少钱，径须沽取对君酌。五花马，千金裘，呼儿将出换美酒，与尔同销万古愁！',
    notes: '', translation: '【逐句品读】李白最奔放的饮酒诗。君不见黄河之水天上来奔流到海不复回以黄河起兴极有气势。天生我材必有用千金散尽还复来极度自信。五花马千金裘呼儿将出换美酒与尔同销万古愁用宝马裘衣换酒消解万古之愁！',
    tags: ['李白', '豪放'] },
  { id: 252, title: '山居秋暝', author: '王维', dynasty: '唐', level: 'high', grade: '选修',
    content: '空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。',
    notes: '暝：傍晚。浣女：洗衣的女子。', translation: '【逐句品读】明月松间照清泉石上流王维山水诗的最高境界两句写尽大自然的澄澈宁静。竹喧归浣女莲动下渔舟由静入动由景入人。诗中有画的典范。',
    tags: ['王维', '山水'] },
  { id: 253, title: '菩萨蛮·小山重叠金明灭', author: '温庭筠', dynasty: '唐', level: 'high', grade: '选修',
    content: '小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。照花前后镜，花面交相映。新帖绣罗襦，双双金鹧鸪。',
    notes: '小山：屏风上的画山。金明灭：阳光照在屏风上闪烁。', translation: '屏风上小山重叠金光闪烁，乌黑的鬓发要滑过雪白的香腮。懒懒地起来画眉梳洗。照花时前后镜中花面交相辉映。新帖的绣罗襦上有成双的金鹧鸪。',
    tags: ['温庭筠', '闺怨'] },
  { id: 254, title: '鹊桥仙·纤云弄巧', author: '秦观', dynasty: '宋', level: 'high', grade: '选修',
    content: '纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。柔情似水，佳期如梦，忍顾鹊桥归路！两情若是久长时，又岂在朝朝暮暮。',
    notes: '鹊桥：传说喜鹊搭成的桥。银汉：银河。', translation: '【逐句品读】金风玉露一相逢便胜却人间无数把爱情质量看得比数量更重要。两情若是久长时又岂在朝朝暮暮成为中国人爱情观中最经典的名句。',
    tags: ['秦观', '爱情'] },
  { id: 255, title: '苏幕遮·燎沉香', author: '周邦彦', dynasty: '宋', level: 'high', grade: '选修',
    content: '燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。叶上初阳干宿雨，水面清圆，一一风荷举。故乡遥，何日去？家住吴门，久作长安旅。五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。',
    notes: '燎：点燃。溽暑：潮湿的暑热。', translation: '点燃沉香消除潮湿的暑热。鸟雀欢呼天晴拂晓时在檐边说话。初阳晒干了荷叶上昨夜的雨，水面清圆一一风中的荷花高高举起。故乡遥远何日能去？家在吴门久在长安作客。五月渔郎还记得我吗？梦见划着小船进入了芙蓉浦。',
    tags: ['周邦彦', '思乡'] },
  { id: 256, title: '念奴娇·过洞庭', author: '张孝祥', dynasty: '宋', level: 'high', grade: '选修',
    content: '洞庭青草，近中秋、更无一点风色。玉鉴琼田三万顷，着我扁舟一叶。素月分辉，明河共影，表里俱澄澈。悠然心会，妙处难与君说。应念岭海经年，孤光自照，肝肺皆冰雪。短发萧骚襟袖冷，稳泛沧浪空阔。尽挹西江，细斟北斗，万象为宾客。扣舷独啸，不知今夕何夕！',
    notes: '玉鉴琼田：形容月光下的湖面。', translation: '洞庭湖青草湖临近中秋没有一点风色。三万顷如玉的湖面载着我的一叶扁舟。明月分辉银河共影内外澄澈。悠然心会妙处难说。肝肺皆冰雪短发萧疏稳泛沧浪。邀请西江北斗和万象作宾客。扣舷独啸不知今晚是什么夜晚！',
    tags: ['张孝祥', '豪放'] },
  { id: 257, title: '菩萨蛮·书江西造口壁', author: '辛弃疾', dynasty: '宋', level: 'high', grade: '选修',
    content: '郁孤台下清江水，中间多少行人泪。西北望长安，可怜无数山。青山遮不住，毕竟东流去。江晚正愁予，山深闻鹧鸪。',
    notes: '造口：江西的地名。郁孤台：江西赣州。', translation: '郁孤台下的清江水中有多少行人的眼泪。西北遥望长安可怜无数青山。青山遮不住毕竟东流去。江晚正愁闷深山听到鹧鸪叫声。',
    tags: ['辛弃疾', '感怀'] },
  { id: 258, title: '青玉案·元夕', author: '辛弃疾', dynasty: '宋', level: 'high', grade: '选修',
    content: '东风夜放花千树，更吹落、星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。蛾儿雪柳黄金缕，笑语盈盈暗香去。众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。',
    notes: '花千树：形容灯火。玉壶：月亮。', translation: '【逐句品读】众里寻他千百度蓦然回首那人却在灯火阑珊处王国维以此形容学问第三重境界历经千辛万苦后豁然开朗。全词写元宵热闹结尾却以灯火阑珊处作结跌宕起伏。',
    tags: ['辛弃疾', '爱情'] },
  { id: 259, title: '贺新郎·国脉微如缕', author: '刘克庄', dynasty: '宋', level: 'high', grade: '选修',
    content: '国脉微如缕。问长缨、何时入手，缚将戎主？未必人间无好汉，谁与宽些尺度？试看取、当年韩五。岂有谷城公付授，也不干、曾遇骊山母。谈笑起，两河路。少时棋柝曾联句。叹而今、登楼揽镜，事机频误。闻说北风吹面急，边上冲梯屡舞。君莫道、投鞭虚语。自古一贤能制难，有金汤、便可无张许？快投笔，莫题柱。',
    notes: '长缨：长绳子，借指武装。', translation: '国脉微弱如同细线。何时才能拿起武器擒住敌人？未必世间没有好汉谁给放宽尺度？谈笑之间就能在南北战场取胜。听说北风紧急边关战事频繁。自古一贤能制难。快投笔从戎莫题柱！',
    tags: ['刘克庄', '爱国'] },
  { id: 260, title: '朝天子·咏喇叭', author: '王磐', dynasty: '明', level: 'high', grade: '选修',
    content: '喇叭，唢呐，曲儿小腔儿大。官船来往乱如麻，全仗你抬声价。军听了军愁，民听了民怕。哪里去辨甚么真共假？眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！',
    notes: '朝天子：曲牌名。', translation: '喇叭唢呐曲儿小腔儿大。官船来往全靠你抬身价。军听了愁民听了怕。眼见得吹翻了这家吹伤了那家直吹得水尽鹅飞！',
    tags: ['王磐', '讽刺'] },
  { id: 261, title: '长亭送别（节选）', author: '王实甫', dynasty: '元', level: 'high', grade: '选修',
    content: '碧云天，黄花地，西风紧，北雁南飞。晓来谁染霜林醉？总是离人泪。',
    notes: '长亭送别选自《西厢记》。', translation: '碧云漫天黄菊满地西风紧北雁南飞。早晨是谁把霜叶染得醉红？总是离别人的眼泪。',
    tags: ['王实甫', '戏曲'] },
  { id: 262, title: '静女', author: '《诗经》', dynasty: '周', level: 'high', grade: '选修',
    content: '静女其姝，俟我于城隅。爱而不见，搔首踟蹰。静女其娈，贻我彤管。彤管有炜，说怿女美。自牧归荑，洵美且异。匪女之为美，美人之贻。',
    notes: '静女：娴静的女子。姝：美丽。俟：等待。', translation: '【逐句品读】静女其姝俟我于城隅爱而不见搔首踟蹰姑娘约小伙见面却故意躲起来两千多年前的初恋场景如在眼前。匪女之为美美人之贻不是草美是送草的人美。',
    tags: ['诗经', '爱情'] },
  { id: 263, title: '涉江采芙蓉', author: '《古诗十九首》', dynasty: '东汉', level: 'high', grade: '选修',
    content: '涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。还顾望旧乡，长路漫浩浩。同心而离居，忧伤以终老。',
    notes: '芙蓉：荷花。遗：赠送。', translation: '渡过江去采荷花沼泽中有很多兰草。采了要送给谁？思念的人在远方。回头望故乡长路漫漫。同心却分离忧伤以终老。',
    tags: ['古诗十九首', '思念'] },
  { id: 264, title: '桂枝香·金陵怀古', author: '王安石', dynasty: '宋', level: 'high', grade: '选修',
    content: '登临送目，正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。归帆去棹残阳里，背西风，酒旗斜矗。彩舟云淡，星河鹭起，画图难足。念往昔，繁华竞逐，叹门外楼头，悲恨相续。千古凭高对此，谩嗟荣辱。六朝旧事随流水，但寒烟衰草凝绿。至今商女，时时犹唱，后庭遗曲。',
    notes: '金陵：南京。后庭遗曲：陈后主的《玉树后庭花》。', translation: '登高远望正是故国晚秋天气初肃。千里澄江如练翠峰如簇。六朝旧事随流水但寒烟衰草凝绿。至今商女时时犹唱后庭遗曲。',
    tags: ['王安石', '怀古'] },
  { id: 265, title: '江城子·乙卯正月二十日夜记梦', author: '苏轼', dynasty: '宋', level: 'high', grade: '选修',
    content: '十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡，小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。',
    notes: '乙卯：宋神宗熙宁八年。十年：苏轼妻子王弗去世十年。', translation: '【逐句品读】苏轼悼念亡妻。十年生死两茫茫不思量自难忘生死相隔十年不用想也忘不掉。小轩窗正梳妆相顾无言惟有泪千行梦境越美现实越痛。',
    tags: ['苏轼', '悼亡'] },
  { id: 266, title: '登岳阳楼', author: '杜甫', dynasty: '唐', level: 'high', grade: '选修',
    content: '昔闻洞庭水，今上岳阳楼。吴楚东南坼，乾坤日夜浮。亲朋无一字，老病有孤舟。戎马关山北，凭轩涕泗流。',
    notes: '坼：分裂。乾坤：天地日月。', translation: '【逐句品读】昔闻洞庭水今上岳阳楼多年夙愿终于实现。吴楚东南坼乾坤日夜浮气势之壮阔为写洞庭之最。亲朋无一字老病有孤舟个人凄凉与天地壮阔形成强烈对比。',
    tags: ['杜甫', '感怀'] },
  { id: 267, title: '礼运（节选）', author: '《礼记》', dynasty: '西汉', level: 'high', grade: '选修',
    content: '大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者，皆有所养。男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。',
    notes: '矜：同"鳏"，老而无妻。大同：理想社会。', translation: '大道施行的时候天下是公共的。选拔贤能的人讲求诚信和睦。所以人不只奉养自己的父母不只养育自己的孩子。老有所终壮有所用幼有所长。鳏寡孤独残疾者都有供养。这就是大同社会。',
    tags: ['礼记', '理想'] },
  { id: 268, title: '报任安书（节选）', author: '司马迁', dynasty: '西汉', level: 'high', grade: '选修',
    content: '人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世而文采不表于后世也。',
    notes: '任安：司马迁的朋友。', translation: '【逐句品读】人固有一死或重于泰山或轻于鸿毛司马迁遭受宫刑后的千古名言。隐忍苟活只为完成史记文采不表于后世也。重于泰山和轻于鸿毛从此成为中国人衡量生命价值的标准。',
    tags: ['司马迁', '励志'] },
  { id: 269, title: '过秦论（中）', author: '贾谊', dynasty: '西汉', level: 'high', grade: '选修',
    content: '夫秦之盛也，非有他也，以关中之地，据崤函之险，拥雍州之固，虽有诸侯之众，而不敢图也。及其衰也，陈涉以戍卒散乱之众数百，奋臂大呼，而天下响应者，何也？攻守之势异也。',
    notes: '', translation: '秦的强盛是因为据有关中的险要。当它衰落时陈涉以数百戍卒奋臂大呼而天下响应。为什么呢？攻守的形势变了。',
    tags: ['贾谊', '史论'] },
  { id: 270, title: '夜归鹿门歌', author: '孟浩然', dynasty: '唐', level: 'high', grade: '选修',
    content: '山寺钟鸣昼已昏，渔梁渡头争渡喧。人随沙岸向江村，余亦乘舟归鹿门。鹿门月照开烟树，忽到庞公栖隐处。岩扉松径长寂寥，惟有幽人独来去。',
    notes: '鹿门：襄阳鹿门山，孟浩然隐居处。庞公：庞德公，东汉隐士。', translation: '山寺钟鸣天已黄昏渔梁渡头争渡喧闹。人们走向江村我也乘舟归鹿门。鹿门月照烟树忽然到了庞公隐居处。岩扉松径长寂寥只有幽人独来去。',
    tags: ['孟浩然', '隐逸'] },
  { id: 271, title: '阁夜', author: '杜甫', dynasty: '唐', level: 'high', grade: '选修',
    content: '岁暮阴阳催短景，天涯霜雪霁寒宵。五更鼓角声悲壮，三峡星河影动摇。野哭千家闻战伐，夷歌数处起渔樵。卧龙跃马终黄土，人事音书漫寂寥。',
    notes: '阁夜：在夔州西阁夜中所作。', translation: '岁暮阴阳催短景天涯霜雪霁寒宵。五更鼓角声悲壮三峡星河影动摇。野哭千家闻战伐夷歌数处起渔樵。卧龙跃马终黄土人事音书漫寂寥。',
    tags: ['杜甫', '感怀'] },
  { id: 272, title: '马嵬（其二）', author: '李商隐', dynasty: '唐', level: 'high', grade: '选修',
    content: '海外徒闻更九州，他生未卜此生休。空闻虎旅传宵柝，无复鸡人报晓筹。此日六军同驻马，当时七夕笑牵牛。如何四纪为天子，不及卢家有莫愁。',
    notes: '马嵬：马嵬坡，杨贵妃被缢杀处。虎旅：禁军。', translation: '海外徒闻更有九州他生未卜此生已休。空闻禁军夜里传柝再没有鸡人报晓。此日六军驻马不前当年七夕笑牵牛。为什么做了四十多年天子却不如卢家有莫愁。',
    tags: ['李商隐', '咏史'] }
];

const universityPoems = [
  // 大学语文及课外扩展经典篇目
  { id: 301, title: '诗经·采薇（节选）', author: '《诗经》', dynasty: '周', level: 'university', grade: '大学/课外',
    content: '昔我往矣，杨柳依依。今我来思，雨雪霏霏。行道迟迟，载渴载饥。我心伤悲，莫知我哀！', notes: '依依：柳枝飘拂的样子。', translation: '【逐句品读】昔我往矣杨柳依依今我来思雨雪霏霏诗经最动人的句子。以春日杨柳之温馨对比冬日大雪之严寒写尽战争对个人命运的摧残。', tags: ['诗经', '战争'] },
  { id: 302, title: '生民（节选）', author: '《诗经》', dynasty: '周', level: 'university', grade: '大学/课外',
    content: '厥初生民，时维姜嫄。生民如何？克禋克祀，以弗无子。履帝武敏歆，攸介攸止，载震载夙。载生载育，时维后稷。', notes: '厥初：当初。姜嫄：周始祖后稷之母。', translation: '当初周人始祖由姜嫄所生。她祭祀祈求生子。踩着天帝的脚印而怀孕，生下了后稷。', tags: ['诗经', '史诗'] },
  { id: 303, title: '湘夫人（节选）', author: '屈原', dynasty: '战国', level: 'university', grade: '大学/课外',
    content: '帝子降兮北渚，目眇眇兮愁予。袅袅兮秋风，洞庭波兮木叶下。登白薠兮骋望，与佳期兮夕张。鸟何萃兮蘋中，罾何为兮木上？沅有芷兮澧有兰，思公子兮未敢言。', notes: '帝子：指湘夫人。眇眇：遥远的样子。', translation: '【逐句品读】袅袅兮秋风洞庭波兮木叶下屈原写秋景的千古名句。秋风木叶意境优美深远。沅有芷兮澧有兰思公子兮未敢言含蓄蕴藉。', tags: ['屈原', '楚辞'] },
  { id: 304, title: '古诗十九首·行行重行行', author: '《古诗十九首》', dynasty: '东汉', level: 'university', grade: '大学/课外',
    content: '行行重行行，与君生别离。相去万余里，各在天一涯。道路阻且长，会面安可知？胡马依北风，越鸟巢南枝。相去日已远，衣带日已缓。浮云蔽白日，游子不顾返。思君令人老，岁月忽已晚。弃捐勿复道，努力加餐饭。', notes: '重：又。缓：宽松。', translation: '【逐句品读】行行重行行与君生别离古诗十九首思妇名篇。胡马依北风越鸟巢南枝以飞禽恋乡反衬游子离别之苦。弃捐勿复道努力加餐饭以朴素的话表达最深的关爱。', tags: ['古诗十九首', '相思'] },
  { id: 305, title: '古诗十九首·迢迢牵牛星', author: '《古诗十九首》', dynasty: '东汉', level: 'university', grade: '大学/课外',
    content: '迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。', notes: '河汉：银河。擢：伸出。', translation: '遥远的牵牛星明亮的织女星。她伸出纤纤素手札札地织布。整天织不成布匹眼泪如雨。银河清浅相隔能有多远？只隔着盈盈一水却含情脉脉不得语。', tags: ['古诗十九首', '七夕'] },
  { id: 306, title: '白马篇', author: '曹植', dynasty: '三国', level: 'university', grade: '大学/课外',
    content: '白马饰金羁，连翩西北驰。借问谁家子？幽并游侠儿。少小去乡邑，扬声沙漠垂。宿昔秉良弓，楛矢何参差。控弦破左的，右发摧月支。仰手接飞猱，俯身散马蹄。狡捷过猴猿，勇剽若豹螭。边城多警急，虏骑数迁移。羽檄从北来，厉马登高堤。长驱蹈匈奴，左顾凌鲜卑。弃身锋刃端，性命安可怀？父母且不顾，何言子与妻！名编壮士籍，不得中顾私。捐躯赴国难，视死忽如归！', notes: '羁：马笼头。幽并：幽州并州。', translation: '白马戴着金笼头向西北飞驰。那是幽并的游侠少年。从小离开家乡扬名沙漠。左右开弓箭无虚发。边城告急飞骑北上。长驱直入匈奴左攻鲜卑。投身锋刃性命不顾。捐躯赴国难视死如归！', tags: ['曹植', '豪放'] },
  { id: 307, title: '七步诗', author: '曹植', dynasty: '三国', level: 'university', grade: '大学/课外',
    content: '煮豆燃豆萁，豆在釜中泣。本是同根生，相煎何太急？', notes: '萁：豆茎。', translation: '煮豆子燃烧豆茎豆子在锅中哭泣。我们本是同根生何必逼迫得太急！', tags: ['曹植', '咏物'] },
  { id: 308, title: '咏荆轲', author: '陶渊明', dynasty: '东晋', level: 'university', grade: '大学/课外',
    content: '燕丹善养士，志在报强嬴。招集百夫良，岁暮得荆卿。君子死知己，提剑出燕京。素骥鸣广陌，慷慨送我行。雄发指危冠，猛气冲长缨。饮饯易水上，四座列群英。渐离击悲筑，宋意唱高声。萧萧哀风逝，淡淡寒波生。商音更流涕，羽奏壮士惊。心知去不归，且有后世名。登车何时顾，飞盖入秦庭。凌厉越万里，逶迤过千城。图穷事自至，豪主正怔营。惜哉剑术疏，奇功遂不成。其人虽已没，千载有馀情。', notes: '荆轲：刺秦王的勇士。渐离：高渐离。', translation: '燕太子丹供养侠客想报复秦国。荆轲为知己提剑出燕京。易水送别高渐离击筑宋意高歌。心知一去不归登车直入秦庭。可惜剑术不精奇功未成。其人虽已逝千年有余情。', tags: ['陶渊明', '咏史'] },
  { id: 309, title: '西洲曲', author: '南朝乐府', dynasty: '南北朝', level: 'university', grade: '大学/课外',
    content: '忆梅下西洲，折梅寄江北。单衫杏子红，双鬓鸦雏色。西洲在何处？两桨桥头渡。日暮伯劳飞，风吹乌臼树。树下即门前，门中露翠钿。开门郎不至，出门采红莲。采莲南塘秋，莲花过人头。低头弄莲子，莲子清如水。置莲怀袖中，莲心彻底红。忆郎郎不至，仰首望飞鸿。鸿飞满西洲，望郎上青楼。楼高望不见，尽日栏杆头。栏杆十二曲，垂手明如玉。卷帘天自高，海水摇空绿。海水梦悠悠，君愁我亦愁。南风知我意，吹梦到西洲。', notes: '西洲：地名。伯劳：鸟名。', translation: '想起梅花去西洲折梅寄到江北。穿着杏红单衫双鬓乌黑。西洲在哪里？两桨就到。采莲南塘秋莲花高过人头。低头弄莲子莲子清如水。忆郎郎不至仰首望飞鸿。南风知我意吹梦到西洲。', tags: ['乐府', '爱情'] },
  { id: 310, title: '木兰诗（完整版）', author: '北朝民歌', dynasty: '南北朝', level: 'university', grade: '大学/课外',
    content: '唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？', notes: '可汗：古代北方民族首领。鞍鞯：马鞍和马垫。', translation: '【逐句品读】雄兔脚扑朔雌兔眼迷离双兔傍地走安能辨我是雄雌木兰女扮男装代父从军十二年战友不知她是女子。全诗塑造了一个勇敢聪慧不慕名利的女性英雄形象。', tags: ['北朝民歌', '木兰'] },
  { id: 311, title: '滕王阁诗', author: '王勃', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '滕王高阁临江渚，佩玉鸣鸾罢歌舞。画栋朝飞南浦云，珠帘暮卷西山雨。闲云潭影日悠悠，物换星移几度秋。阁中帝子今何在？槛外长江空自流。', notes: '滕王阁：江南三大名楼之一。', translation: '【逐句品读】阁中帝子今何在槛外长江空自流当年修建滕王阁的帝王如今在哪只有栏杆外的长江依然在流。以永恒自然对照短暂人事表达了历史兴亡的深沉感慨。', tags: ['王勃', '感怀'] },
  { id: 312, title: '从军行（其四）', author: '王昌龄', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '青海长云暗雪山，孤城遥望玉门关。黄沙百战穿金甲，不破楼兰终不还。', notes: '青海：青海湖。楼兰：西域国名。', translation: '青海长云笼罩暗淡的雪山，孤城遥望玉门关。黄沙百战穿金甲不破楼兰终不还。', tags: ['王昌龄', '边塞'] },
  { id: 313, title: '闺怨', author: '王昌龄', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '闺中少妇不知愁，春日凝妆上翠楼。忽见陌头杨柳色，悔教夫婿觅封侯。', notes: '凝妆：盛妆。陌头：路边。', translation: '闺中少妇不知道忧愁春日盛妆登上翠楼。忽然看到路边杨柳青青后悔让丈夫去求取功名。', tags: ['王昌龄', '闺怨'] },
  { id: 314, title: '终南山', author: '王维', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '太乙近天都，连山接海隅。白云回望合，青霭入看无。分野中峰变，阴晴众壑殊。欲投人处宿，隔水问樵夫。', notes: '太乙：终南山主峰。', translation: '终南山靠近天都连绵不断直到海边。回头望去白云合拢走近青霭却看不见。中峰两侧分野不同各山谷阴晴各异。想要投宿隔水问樵夫。', tags: ['王维', '山水'] },
  { id: 315, title: '使至塞上', author: '王维', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '单车欲问边，属国过居延。征蓬出汉塞，归雁入胡天。大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。', notes: '属国：典属国简称。居延：地名。', translation: '轻车简从出使边塞经过居延。像蓬草飘出汉塞归雁飞入胡天。大漠中一缕孤烟笔直长河上落日浑圆。在萧关遇到了斥候说主帅正在燕然前线。', tags: ['王维', '边塞'] },
  { id: 316, title: '渡荆门送别', author: '李白', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '渡远荆门外，来从楚国游。山随平野尽，江入大荒流。月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。', notes: '荆门：山名。', translation: '远渡荆门来到楚国故地。山随着平野消失江水流入大荒。月亮如飞天的明镜云彩结成海市蜃楼。还是故乡的水好万里送着我的行舟。', tags: ['李白', '山水'] },
  { id: 317, title: '宣州谢朓楼饯别校书叔云', author: '李白', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '弃我去者，昨日之日不可留；乱我心者，今日之日多烦忧。长风万里送秋雁，对此可以酣高楼。蓬莱文章建安骨，中间小谢又清发。俱怀逸兴壮思飞，欲上青天览明月。抽刀断水水更流，举杯消愁愁更愁。人生在世不称意，明朝散发弄扁舟。', notes: '谢朓楼：南齐诗人谢朓所建。', translation: '弃我而去的昨日不可留扰乱我心今日多烦忧。长风万里送秋雁对此可以酣饮高楼。抽刀断水水更流举杯消愁愁更愁。人生在世不称意不如明朝散发弄扁舟。', tags: ['李白', '豪放'] },
  { id: 318, title: '月下独酌（其一）', author: '李白', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '花间一壶酒，独酌无相亲。举杯邀明月，对影成三人。月既不解饮，影徒随我身。暂伴月将影，行乐须及春。我歌月徘徊，我舞影零乱。醒时同交欢，醉后各分散。永结无情游，相期邈云汉。', notes: '独酌：独自饮酒。', translation: '【逐句品读】举杯邀明月对影成三人李白月下独酌的奇思妙想无人共饮便邀明月和自己的影子瞬间从孤独变成三人共饮。', tags: ['李白', '月'] },
  { id: 319, title: '登金陵凤凰台', author: '李白', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '凤凰台上凤凰游，凤去台空江自流。吴宫花草埋幽径，晋代衣冠成古丘。三山半落青天外，二水中分白鹭洲。总为浮云能蔽日，长安不见使人愁。', notes: '凤凰台：南京台名。', translation: '凤凰台上凤凰游凤去台空江自流。吴宫花草埋幽径晋代衣冠成古丘。三山半落青天外二水中分白鹭洲。总为浮云能蔽日长安不见使人愁。', tags: ['李白', '怀古'] },
  { id: 320, title: '兵车行', author: '杜甫', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '车辚辚，马萧萧，行人弓箭各在腰。爷娘妻子走相送，尘埃不见咸阳桥。牵衣顿足拦道哭，哭声直上干云霄。道旁过者问行人，行人但云点行频。或从十五北防河，便至四十西营田。去时里正与裹头，归来头白还戍边。边庭流血成海水，武皇开边意未已。君不闻汉家山东二百州，千村万落生荆杞。纵有健妇把锄犁，禾生陇亩无东西。况复秦兵耐苦战，被驱不异犬与鸡。长者虽有问，役夫敢申恨？且如今年冬，未休关西卒。县官急索租，租税从何出？信知生男恶，反是生女好。生女犹得嫁比邻，生男埋没随百草。君不见青海头，古来白骨无人收。新鬼烦冤旧鬼哭，天阴雨湿声啾啾。', notes: '辚辚：车行声。萧萧：马鸣声。', translation: '战车隆隆战马萧萧出征士兵弓箭在腰。爹娘妻子奔走相送哭声震天。道旁过者问行人只说征兵太频繁。从十五岁到四十岁还在戍边。边庭流血成海水君王扩边心未已。君不见青海头古来白骨无人收。', tags: ['杜甫', '战争'] },
  { id: 321, title: '旅夜书怀', author: '杜甫', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '细草微风岸，危樯独夜舟。星垂平野阔，月涌大江流。名岂文章著，官应老病休。飘飘何所似，天地一沙鸥。', notes: '危樯：高高的桅杆。', translation: '【逐句品读】星垂平野阔月涌大江流杜甫旅途中所见。星星低垂在广阔平野上月随波涛涌动。飘飘何所似天地一沙鸥自己像天地间一只孤独的沙鸥。', tags: ['杜甫', '感怀'] },
  { id: 322, title: '咏怀古迹（其三）', author: '杜甫', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '群山万壑赴荆门，生长明妃尚有村。一去紫台连朔漠，独留青冢向黄昏。画图省识春风面，环珮空归夜月魂。千载琵琶作胡语，分明怨恨曲中论。', notes: '明妃：王昭君。青冢：昭君墓。', translation: '群山万壑赴荆门生长王昭君的村子还在。离开汉宫到朔漠只留青冢向黄昏。千载琵琶弹着胡语曲中分明是怨恨。', tags: ['杜甫', '咏史'] },
  { id: 323, title: '白雪歌送武判官归京', author: '岑参', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '北风卷地白草折，胡天八月即飞雪。忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。将军角弓不得控，都护铁衣冷难着。瀚海阑干百丈冰，愁云惨淡万里凝。中军置酒饮归客，胡琴琵琶与羌笛。纷纷暮雪下辕门，风掣红旗冻不翻。轮台东门送君去，去时雪满天山路。山回路转不见君，雪上空留马行处。', notes: '判官：官职名。瀚海：沙漠。', translation: '【逐句品读】忽如一夜春风来千树万树梨花开岑参以春景写冬景化寒冷为温暖化萧瑟为壮美这是写雪景最著名的比喻。', tags: ['岑参', '边塞'] },
  { id: 324, title: '逢入京使', author: '岑参', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安。', notes: '龙钟：沾湿的样子。', translation: '向东望故乡路漫漫双袖都湿了泪不干。马上相逢没有纸笔请你带话报个平安。', tags: ['岑参', '思乡'] },
  { id: 325, title: '钱塘湖春行', author: '白居易', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '孤山寺北贾亭西，水面初平云脚低。几处早莺争暖树，谁家新燕啄春泥。乱花渐欲迷人眼，浅草才能没马蹄。最爱湖东行不足，绿杨阴里白沙堤。', notes: '钱塘湖：杭州西湖。', translation: '孤山寺北贾亭西水面初平云脚低。几处早莺争暖树谁家新燕啄春泥。乱花渐欲迷人眼浅草才能没马蹄。最爱湖东行不足绿杨阴里白沙堤。', tags: ['白居易', '西湖'] },
  { id: 326, title: '长恨歌（节选）', author: '白居易', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。春寒赐浴华清池，温泉水滑洗凝脂。侍儿扶起娇无力，始是新承恩泽时。云鬓花颜金步摇，芙蓉帐暖度春宵。春宵苦短日高起，从此君王不早朝。承欢侍宴无闲暇，春从春游夜专夜。后宫佳丽三千人，三千宠爱在一身。金屋妆成娇侍夜，玉楼宴罢醉和春。姊妹弟兄皆列土，可怜光彩生门户。遂令天下父母心，不重生男重生女。骊宫高处入青云，仙乐风飘处处闻。缓歌慢舞凝丝竹，尽日君王看不足。渔阳鼙鼓动地来，惊破霓裳羽衣曲。九重城阙烟尘生，千乘万骑西南行。翠华摇摇行复止，西出都门百余里。六军不发无奈何，宛转蛾眉马前死。花钿委地无人收，翠翘金雀玉搔头。君王掩面救不得，回看血泪相和流。', notes: '汉皇：指唐玄宗。倾国：美女。', translation: '【逐句品读】回眸一笑百媚生六宫粉黛无颜色杨贵妃之美让所有嫔妃黯然失色。渔阳鼙鼓动地来惊破霓裳羽衣曲安史之乱的战鼓惊破了宫廷歌舞。', tags: ['白居易', '爱情'] },
  { id: 327, title: '竹枝词', author: '刘禹锡', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '杨柳青青江水平，闻郎江上踏歌声。东边日出西边雨，道是无晴却有晴。', notes: '晴：谐音"情"。', translation: '杨柳青青江水平听到郎在江上踏歌声。东边日出西边雨说是无晴却又有晴。', tags: ['刘禹锡', '爱情'] },
  { id: 328, title: '乌衣巷', author: '刘禹锡', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '朱雀桥边野草花，乌衣巷口夕阳斜。旧时王谢堂前燕，飞入寻常百姓家。', notes: '乌衣巷：南京的巷子。王谢：王导、谢安家族。', translation: '朱雀桥边野草花乌衣巷口夕阳斜。旧时王谢堂前的燕子飞入了寻常百姓家。', tags: ['刘禹锡', '怀古'] },
  { id: 329, title: '石头城', author: '刘禹锡', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '山围故国周遭在，潮打空城寂寞回。淮水东边旧时月，夜深还过女墙来。', notes: '石头城：南京。淮水：秦淮河。', translation: '山围故国还在潮打空城寂寞回。淮水东边旧时的月夜深还过女墙来。', tags: ['刘禹锡', '怀古'] },
  { id: 330, title: '泊秦淮', author: '杜牧', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。', notes: '秦淮：秦淮河。后庭花：陈后主的歌曲。', translation: '烟笼寒水月笼沙夜泊秦淮近酒家。卖唱女不知亡国之恨隔江还在唱后庭花。', tags: ['杜牧', '怀古'] },
  { id: 331, title: '过华清宫绝句（其一）', author: '杜牧', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '长安回望绣成堆，山顶千门次第开。一骑红尘妃子笑，无人知是荔枝来。', notes: '华清宫：骊山的行宫。', translation: '从长安回望骊山锦绣成堆山顶千门依次打开。一骑红尘妃子笑没有人知道是送荔枝来了。', tags: ['杜牧', '咏史'] },
  { id: 332, title: '夜雨寄北', author: '李商隐', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。', notes: '', translation: '你问我归期我未定巴山夜雨涨秋池。何时能共剪西窗烛再谈巴山夜雨时。', tags: ['李商隐', '思念'] },
  { id: 333, title: '嫦娥', author: '李商隐', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '云母屏风烛影深，长河渐落晓星沉。嫦娥应悔偷灵药，碧海青天夜夜心。', notes: '长河：银河。', translation: '云母屏风烛影深银河渐落晓星沉。嫦娥应悔偷灵药碧海青天夜夜心。', tags: ['李商隐', '神话'] },
  { id: 334, title: '霜月', author: '李商隐', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '初闻征雁已无蝉，百尺楼高水接天。青女素娥俱耐冷，月中霜里斗婵娟。', notes: '青女：霜神。素娥：嫦娥。', translation: '刚听到大雁南飞已无蝉鸣百尺楼高水接天。青女和嫦娥都耐冷月中霜里比美丽。', tags: ['李商隐', '秋'] },
  { id: 335, title: '浪淘沙·帘外雨潺潺', author: '李煜', dynasty: '五代', level: 'university', grade: '大学/课外',
    content: '帘外雨潺潺，春意阑珊。罗衾不耐五更寒。梦里不知身是客，一晌贪欢。独自莫凭栏，无限江山，别时容易见时难。流水落花春去也，天上人间。', notes: '阑珊：将尽。', translation: '【逐句品读】流水落花春去也天上人间李煜被囚后的悲叹。从一国之君沦为阶下囚从天上跌落人间。以极简语言道尽人生的剧变。', tags: ['李煜', '亡国'] },
  { id: 336, title: '雨霖铃·寒蝉凄切', author: '柳永', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '寒蝉凄切，对长亭晚，骤雨初歇。都门帐饮无绪，留恋处，兰舟催发。执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。多情自古伤离别，更那堪，冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。此去经年，应是良辰好景虚设。便纵有千种风情，更与何人说？', notes: '雨霖铃：词牌名。', translation: '【逐句品读】多情自古伤离别更那堪冷落清秋节柳永写离别的名篇。今宵酒醒何处杨柳岸晓风残月以景写情含不尽之意于言外。', tags: ['柳永', '离别'] },
  { id: 337, title: '蝶恋花·槛菊愁烟兰泣露', author: '晏殊', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '槛菊愁烟兰泣露，罗幕轻寒，燕子双飞去。明月不谙离恨苦，斜光到晓穿朱户。昨夜西风凋碧树，独上高楼，望尽天涯路。欲寄彩笺兼尺素，山长水阔知何处？', notes: '槛菊：栏杆边的菊花。', translation: '栏杆边菊花愁烟兰花泣露燕子双飞去。明月不懂离恨苦斜光到晓穿朱户。昨夜西风凋碧树独上高楼望尽天涯路。欲寄彩笺兼尺素山长水阔知何处？', tags: ['晏殊', '离别'] },
  { id: 338, title: '蝶恋花·庭院深深深几许', author: '欧阳修', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '庭院深深深几许？杨柳堆烟，帘幕无重数。玉勒雕鞍游冶处，楼高不见章台路。雨横风狂三月暮，门掩黄昏，无计留春住。泪眼问花花不语，乱红飞过秋千去。', notes: '章台路：指歌妓聚居之地。', translation: '庭院深深深几许？杨柳堆烟帘幕无数。玉勒雕鞍的游冶之处楼高不见章台路。雨横风狂三月暮门掩黄昏无计留春住。泪眼问花花不语乱红飞过秋千去。', tags: ['欧阳修', '春怨'] },
  { id: 339, title: '天仙子·水调数声持酒听', author: '张先', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '水调数声持酒听，午醉醒来愁未醒。送春春去几时回？临晚镜，伤流景，往事后期空记省。沙上并禽池上暝，云破月来花弄影。重重帘幕密遮灯，风不定，人初静，明日落红应满径。', notes: '天仙子：词牌名。', translation: '水调歌持酒听午醉醒来愁未醒。送春春去几时回？临晚镜伤流景。云破月来花弄影。重重帘幕密遮灯风不定人初静明日落红应满径。', tags: ['张先', '春愁'] },
  { id: 340, title: '浣溪沙·漠漠轻寒上小楼', author: '秦观', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '漠漠轻寒上小楼，晓阴无赖似穷秋。淡烟流水画屏幽。自在飞花轻似梦，无边丝雨细如愁。宝帘闲挂小银钩。', notes: '漠漠：弥漫的样子。', translation: '漠漠轻寒上小楼晓阴无奈似穷秋。淡烟流水画屏幽。自在飞花轻似梦无边丝雨细如愁。宝帘闲挂小银钩。', tags: ['秦观', '春愁'] },
  { id: 341, title: '踏莎行·雾失楼台', author: '秦观', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '雾失楼台，月迷津渡，桃源望断无寻处。可堪孤馆闭春寒，杜鹃声里斜阳暮。驿寄梅花，鱼传尺素，砌成此恨无重数。郴江幸自绕郴山，为谁流下潇湘去？', notes: '津渡：渡口。郴江：湖南郴州。', translation: '雾失楼台月迷津渡桃源望断无处寻。可堪孤馆闭春寒杜鹃声里斜阳暮。驿寄梅花鱼传尺素砌成此恨无重数。郴江幸自绕郴山为谁流下潇湘去？', tags: ['秦观', '感怀'] },
  { id: 342, title: '满江红·怒发冲冠', author: '岳飞', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '怒发冲冠，凭栏处、潇潇雨歇。抬望眼、仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。靖康耻，犹未雪。臣子恨，何时灭。驾长车、踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。', notes: '靖康耻：靖康之变。', translation: '【逐句品读】三十功名尘与土八千里路云和月岳飞回顾戎马生涯。莫等闲白了少年头空悲切激励人珍惜时光。待从头收拾旧山河朝天阙誓要收复失地。', tags: ['岳飞', '爱国'] },
  { id: 343, title: '钗头凤·红酥手', author: '陆游', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '红酥手，黄縢酒，满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。春如旧，人空瘦，泪痕红浥鲛绡透。桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫。', notes: '红酥手：形容女子之手。黄縢酒：黄封酒。', translation: '红酥手黄縢酒满城春色宫墙柳。东风恶欢情薄一怀愁绪几年离索。错错错。春如旧人空瘦泪痕红浥鲛绡透。桃花落闲池阁山盟虽在锦书难托。莫莫莫。', tags: ['陆游', '爱情'] },
  { id: 344, title: '卜算子·咏梅', author: '陆游', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。', notes: '驿：驿站。', translation: '驿站外断桥边寂寞地开放无人过问。已是黄昏独自愁又遭受风和雨。无意苦争春任凭群芳嫉妒。零落成泥碾作尘只有芳香如故。', tags: ['陆游', '咏物'] },
  { id: 345, title: '诉衷情·当年万里觅封侯', author: '陆游', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '当年万里觅封侯，匹马戍梁州。关河梦断何处？尘暗旧貂裘。胡未灭，鬓先秋，泪空流。此生谁料，心在天山，身老沧洲。', notes: '觅封侯：寻找建功立业的机会。', translation: '当年万里觅封侯匹马戍梁州。关河梦断何处尘暗旧貂裘。胡未灭鬓先秋泪空流。此生谁料心在天山身老沧洲。', tags: ['陆游', '爱国'] },
  { id: 346, title: '破阵子·为陈同甫赋壮词以寄之', author: '辛弃疾', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！', notes: '麾下：部下。炙：烤肉。', translation: '【逐句品读】了却君王天下事赢得生前身后名可怜白发生辛弃疾梦中回到战场醒来却已白了头壮志难酬的悲愤在最后一个急转中彻底爆发。', tags: ['辛弃疾', '豪放'] },
  { id: 347, title: '摸鱼儿·更能消几番风雨', author: '辛弃疾', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '更能消、几番风雨，匆匆春又归去。惜春长怕花开早，何况落红无数。春且住，见说道、天涯芳草无归路。怨春不语。算只有殷勤，画檐蛛网，尽日惹飞絮。长门事，准拟佳期又误。蛾眉曾有人妒。千金纵买相如赋，脉脉此情谁诉？君莫舞，君不见、玉环飞燕皆尘土！闲愁最苦。休去倚危栏，斜阳正在，烟柳断肠处。', notes: '长门：汉武帝陈皇后冷宫。', translation: '更能消几番风雨匆匆春又归去。惜春长怕花开早何况落红无数。千金纵买相如赋脉脉此情谁诉？君莫舞君不见玉环飞燕皆尘土！', tags: ['辛弃疾', '感怀'] },
  { id: 348, title: '西江月·夜行黄沙道中', author: '辛弃疾', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。', notes: '黄沙：江西上饶的黄沙岭。', translation: '明月别枝惊鹊清风半夜鸣蝉。稻花香里说丰年听取蛙声一片。七八个星天外两三点雨山前。旧时茅店社林边路转溪桥忽见。', tags: ['辛弃疾', '田园'] },
  { id: 349, title: '一剪梅·红藕香残玉簟秋', author: '李清照', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。', notes: '玉簟：竹席。', translation: '【逐句品读】此情无计可消除才下眉头却上心头李清照写相思之苦无法排遣把抽象的相思写得如此具体可感。', tags: ['李清照', '相思'] },
  { id: 350, title: '武陵春·春晚', author: '李清照', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '风住尘香花已尽，日晚倦梳头。物是人非事事休，欲语泪先流。闻说双溪春尚好，也拟泛轻舟。只恐双溪舴艋舟，载不动许多愁。', notes: '双溪：浙江金华。舴艋舟：小船。', translation: '风住尘香花已尽日晚倦梳头。物是人非事事休欲语泪先流。闻说双溪春尚好也拟泛轻舟。只恐双溪舴艋舟载不动许多愁。', tags: ['李清照', '春愁'] },
  { id: 351, title: '醉花阴·薄雾浓云愁永昼', author: '李清照', dynasty: '宋', level: 'university', grade: '大学/课外',
    content: '薄雾浓云愁永昼，瑞脑消金兽。佳节又重阳，玉枕纱厨，半夜凉初透。东篱把酒黄昏后，有暗香盈袖。莫道不销魂，帘卷西风，人比黄花瘦。', notes: '瑞脑：香料。销魂：形容极度悲伤。', translation: '薄雾浓云愁永昼瑞脑消金兽。佳节又重阳玉枕纱厨半夜凉初透。东篱把酒黄昏后有暗香盈袖。莫道不销魂帘卷西风人比黄花瘦。', tags: ['李清照', '重阳'] },
  { id: 352, title: '关山月', author: '李白', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '明月出天山，苍茫云海间。长风几万里，吹度玉门关。汉下白登道，胡窥青海湾。由来征战地，不见有人还。戍客望边色，思归多苦颜。高楼当此夜，叹息未应闲。', notes: '天山：甘肃祁连山。', translation: '明月出天山苍茫云海间。长风几万里吹度玉门关。由来征战地不见有人还。戍客望边色思归多苦颜。高楼当此夜叹息未应闲。', tags: ['李白', '边塞'] },
  { id: 353, title: '赠卫八处士', author: '杜甫', dynasty: '唐', level: 'university', grade: '大学/课外',
    content: '人生不相见，动如参与商。今夕复何夕，共此灯烛光。少壮能几时，鬓发各已苍。访旧半为鬼，惊呼热中肠。焉知二十载，重上君子堂。昔别君未婚，儿女忽成行。怡然敬父执，问我来何方。问答未及已，儿女罗酒浆。夜雨剪春韭，新炊间黄粱。主称会面难，一举累十觞。十觞亦不醉，感子故意长。明日隔山岳，世事两茫茫。', notes: '参商：两个星宿，此出彼没。', translation: '人生不相见动如参与商。少壮能几时鬓发各已苍。访旧半为鬼惊呼热中肠。昔别君未婚儿女忽成行。明日隔山岳世事两茫茫。', tags: ['杜甫', '友情'] },
  { id: 354, title: '画堂春·一生一代一双人', author: '纳兰性德', dynasty: '清', level: 'university', grade: '大学/课外',
    content: '一生一代一双人，争教两处销魂。相思相望不相亲，天为谁春。浆向蓝桥易乞，药成碧海难奔。若容相访饮牛津，相对忘贫。', notes: '纳兰性德：清代词人。', translation: '一生一代一双人怎教两处销魂。相思相望不相亲天为谁春。若容相访饮牛津相对忘贫。', tags: ['纳兰性德', '爱情'] },
  { id: 355, title: '木兰词·拟古决绝词柬友', author: '纳兰性德', dynasty: '清', level: 'university', grade: '大学/课外',
    content: '人生若只如初见，何事秋风悲画扇。等闲变却故人心，却道故人心易变。骊山语罢清宵半，泪雨霖铃终不怨。何如薄幸锦衣郎，比翼连枝当日愿。', notes: '画扇：班婕妤团扇诗。', translation: '人生若只如初见何事秋风悲画扇。等闲变却故人心却道故人心易变。何如薄幸锦衣郎比翼连枝当日愿。', tags: ['纳兰性德', '爱情'] },
  { id: 356, title: '长相思·山一程', author: '纳兰性德', dynasty: '清', level: 'university', grade: '大学/课外',
    content: '山一程，水一程，身向榆关那畔行，夜深千帐灯。风一更，雪一更，聒碎乡心梦不成，故园无此声。', notes: '榆关：山海关。', translation: '山一程水一程身向榆关那畔行夜深千帐灯。风一更雪一更聒碎乡心梦不成故园无此声。', tags: ['纳兰性德', '思乡'] },
  { id: 357, title: '己亥杂诗（其五）', author: '龚自珍', dynasty: '清', level: 'university', grade: '大学/课外',
    content: '浩荡离愁白日斜，吟鞭东指即天涯。落红不是无情物，化作春泥更护花。', notes: '吟鞭：诗人的马鞭。', translation: '【逐句品读】落红不是无情物化作春泥更护花龚自珍以落花自喻即使离开枝头也要化作春泥滋养新花。这是为理想甘愿牺牲的奉献精神。', tags: ['龚自珍', '感怀'] },
  { id: 358, title: '再别康桥（节选）', author: '徐志摩', dynasty: '现代', level: 'university', grade: '大学/课外',
    content: '轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。那河畔的金柳，是夕阳中的新娘；波光里的艳影，在我的心头荡漾。软泥上的青荇，油油的在水底招摇；在康河的柔波里，我甘心做一条水草！那榆荫下的一潭，不是清泉，是天上虹；揉碎在浮藻间，沉淀着彩虹似的梦。寻梦？撑一支长篙，向青草更青处漫溯；满载一船星辉，在星辉斑斓里放歌。但我不能放歌，悄悄是别离的笙箫；夏虫也为我沉默，沉默是今晚的康桥！悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。',
    notes: '康桥：剑桥大学。', translation: '轻轻的我走了正如我轻轻的来。我挥一挥衣袖不带走一片云彩。', tags: ['徐志摩', '现代诗'] },
  { id: 359, title: '雨巷（节选）', author: '戴望舒', dynasty: '现代', level: 'university', grade: '大学/课外',
    content: '撑着油纸伞，独自彷徨在悠长，悠长又寂寥的雨巷，我希望逢着一个丁香一样的结着愁怨的姑娘。她是有丁香一样的颜色，丁香一样的芬芳，丁香一样的忧愁，在雨中哀怨，哀怨又彷徨。她彷徨在这寂寥的雨巷，撑着油纸伞像我一样，像我一样地默默彳亍着，冷漠，凄清，又惆怅。',
    notes: '彳亍：小步走。', translation: '撑着油纸伞独自彷徨在悠长又寂寥的雨巷。我希望逢着一个丁香一样的姑娘。', tags: ['戴望舒', '现代诗'] },
  { id: 360, title: '面朝大海，春暖花开', author: '海子', dynasty: '现代', level: 'university', grade: '大学/课外',
    content: '从明天起，做一个幸福的人喂马、劈柴，周游世界从明天起，关心粮食和蔬菜我有一所房子，面朝大海，春暖花开从明天起，和每一个亲人通信告诉他们我的幸福那幸福的闪电告诉我的我将告诉每一个人给每一条河每一座山取一个温暖的名字陌生人，我也为你祝福愿你有一个灿烂的前程愿你有情人终成眷属愿你在尘世获得幸福我只愿面朝大海，春暖花开',
    notes: '海子：中国当代诗人。', translation: '从明天起做一个幸福的人喂马劈柴周游世界。我有一所房子面朝大海春暖花开。', tags: ['海子', '现代诗'] }
];

// 示例数据供开发测试
const samplePoems = [
  ...primarySchoolPoems.slice(0, 2),
  ...middleSchoolPoems.slice(0, 1),
  ...highSchoolPoems.slice(0, 1),
  ...universityPoems.slice(0, 1)
];

// 确保全局可访问（浏览器和测试环境）
if (typeof window !== 'undefined') {
  window.primarySchoolPoems = primarySchoolPoems;
  window.middleSchoolPoems = middleSchoolPoems;
  window.highSchoolPoems = highSchoolPoems;
  window.universityPoems = universityPoems;
  window.samplePoems = samplePoems;
}
if (typeof globalThis !== 'undefined') {
  globalThis.primarySchoolPoems = primarySchoolPoems;
  globalThis.middleSchoolPoems = middleSchoolPoems;
  globalThis.highSchoolPoems = highSchoolPoems;
  globalThis.universityPoems = universityPoems;
  globalThis.samplePoems = samplePoems;
}

</script>
<script>
/**
 * 古诗集 - 书本翻页版应用逻辑
 */

// ============ 全局状态 ============
const state = {
  currentLevel: 'primary',
  searchQuery: '',
  dynastyFilter: '',
  authorFilter: '',
  tagFilter: '',
  fontSize: localStorage.getItem('poem-font-size') || 'medium',
  theme: localStorage.getItem('poem-theme') || 'light',
  bookmarks: JSON.parse(localStorage.getItem('poem-bookmarks') || '[]'),
  showPinyin: localStorage.getItem('poem-show-pinyin') === 'true',
  currentPage: 1,
  currentPoems: [],
  poemPages: [],      // [{poem, startPage, endPage}]
  isSearchView: false  // true = 搜索结果显示列表而非书页
};

// ============ 数据访问 ============
function getAllPoems() {
  return [
    ...primarySchoolPoems.map(p => ({ ...p, level: 'primary' })),
    ...middleSchoolPoems.map(p => ({ ...p, level: 'middle' })),
    ...highSchoolPoems.map(p => ({ ...p, level: 'high' })),
    ...universityPoems.map(p => ({ ...p, level: 'university' }))
  ];
}

function getPoemsByLevel(level) {
  const map = {
    primary: primarySchoolPoems,
    middle: middleSchoolPoems,
    high: highSchoolPoems,
    university: universityPoems
  };
  return map[level] || [];
}

// ============ 拼音工具函数 ============
function isChinese(char) {
  return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(char);
}

function getPinyin(char) {
  try {
    if (typeof pinyinPro !== 'undefined') {
      return pinyinPro.pinyin(char, { toneType: 'symbol' });
    }
  } catch(e) {}
  return char;
}

function wrapRuby(text) {
  if (!state.showPinyin) return text;
  let result = '';
  for (const char of text) {
    if (isChinese(char)) {
      const py = getPinyin(char);
      result += `<ruby>${escapeHtml(char)}<rt>${escapeHtml(py)}</rt></ruby>`;
    } else {
      result += char;
    }
  }
  return result;
}

function splitIntoLines(content) {
  const lines = [];
  let current = '';
  for (const char of content) {
    current += char;
    if (/[。！？；\n]/.test(char)) {
      lines.push(current);
      current = '';
    }
  }
  if (current.trim()) lines.push(current);
  return lines;
}

function renderPoemContent(content, forCard) {
  const lines = splitIntoLines(content);
  return lines.map(line => {
    const processed = forCard ? line : wrapRuby(line);
    return `<span class="poem-line">${processed}</span>`;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ 书本页面渲染 ============

/** 将诗列表映射为书页分配 */
function buildPageData(poems) {
  const pages = [];
  let pageNum = 1;
  poems.forEach((poem, idx) => {
    const startPage = pageNum;
    const endPage = pageNum + 1; // 每首诗占2页（一个展开）
    pages.push({ poem, startPage, endPage, index: idx });
    pageNum += 2;
  });
  state.poemPages = pages;
  return pages;
}

/** 获取诗在书中的起始页 */
function getPoemPage(id) {
  const found = state.poemPages.find(p => p.poem.id === id);
  return found ? found.startPage : 1;
}

/** 智能渲染双页展开（短诗一页展示，长诗再拆分） */
const MAX_LINES_PER_PAGE = 6;

function renderSpread() {
  const leftPageEl = document.getElementById('pageLeftContent');
  const rightPageEl = document.getElementById('pageRightContent');
  const leftNumEl = document.getElementById('pageLeftNum');
  const rightNumEl = document.getElementById('pageRightNum');

  const currentPoem = getCurrentPoemAtPage(state.currentPage);
  if (!currentPoem) {
    leftPageEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📖</div><p>无内容</p></div>';
    rightPageEl.innerHTML = '';
    leftNumEl.textContent = '';
    rightNumEl.textContent = '';
    return;
  }

  const { poem } = currentPoem;
  const page = state.currentPage;
  const lines = splitIntoLines(poem.content);
  const totalLines = lines.length;

  // 判断：短诗（≤ MAX_LINES_PER_PAGE）左页全展示，右页放注释/译文
  const fitsOnOnePage = totalLines <= MAX_LINES_PER_PAGE;

  // === 左页渲染 ===
  let leftHtml = '';
  leftHtml += `<div class="page-title">${wrapRuby(poem.title)}</div>`;
  leftHtml += `<div class="page-meta">${wrapRuby(poem.dynasty)} · ${wrapRuby(poem.author)}</div>`;

  if (fitsOnOnePage) {
    // 短诗：所有行都放在左页
    lines.forEach(line => {
      leftHtml += `<span class="poem-line">${wrapRuby(line)}</span>`;
    });
  } else {
    // 长诗：前半部分在左页
    const mid = Math.ceil(totalLines / 2);
    lines.slice(0, mid).forEach(line => {
      leftHtml += `<span class="poem-line">${wrapRuby(line)}</span>`;
    });
  }

  leftPageEl.innerHTML = leftHtml;

  // === 右页渲染 ===
  let rightHtml = '';

  if (fitsOnOnePage) {
    // 短诗右页：注释 + 译文（不重复诗文）
    if (poem.notes) {
      rightHtml += `<div class="page-section"><h3>📝 注释</h3><p>${escapeHtml(poem.notes)}</p></div>`;
    }
    if (poem.translation) {
      rightHtml += `<div class="page-section"><h3>🔍 译文</h3><p>${escapeHtml(poem.translation)}</p></div>`;
    }
    if (!rightHtml) {
      rightHtml = '<div class="empty-state" style="padding:40px 0"><div class="empty-icon">📖</div><p style="font-size:0.9em;color:var(--text-secondary)">翻至下一页继续阅读</p></div>';
    }
  } else {
    // 长诗右页：后半部分在 + 注释/译文
    const mid = Math.ceil(totalLines / 2);
    lines.slice(mid).forEach(line => {
      rightHtml += `<span class="poem-line">${wrapRuby(line)}</span>`;
    });
    if (poem.notes) {
      rightHtml += `<div class="page-section"><h3>📝 注释</h3><p>${escapeHtml(poem.notes)}</p></div>`;
    }
    if (poem.translation) {
      rightHtml += `<div class="page-section"><h3>🔍 译文</h3><p>${escapeHtml(poem.translation)}</p></div>`;
    }
  }

  rightPageEl.innerHTML = rightHtml;

  leftNumEl.textContent = `— ${page} —`;
  rightNumEl.textContent = `— ${page + 1} —`;

  // 收藏按钮
  addBookmarkBtn(poem, page);
}

/** 为当前页添加收藏按钮 */
function addBookmarkBtn(poem, page) {
  // 移除旧的收藏按钮
  document.querySelectorAll('.page-bookmark').forEach(el => el.remove());

  const leftPage = document.getElementById('pageLeft');
  const btn = document.createElement('button');
  btn.className = `page-bookmark ${state.bookmarks.includes(poem.id) ? 'active' : ''}`;
  btn.textContent = state.bookmarks.includes(poem.id) ? '⭐' : '☆';
  btn.onclick = (e) => {
    e.stopPropagation();
    toggleBookmark(poem.id);
  };
  btn.title = '收藏/取消收藏';
  leftPage.appendChild(btn);
}

/** 根据页码找到对应的诗 */
function getCurrentPoemAtPage(page) {
  const data = state.poemPages.find(p => page >= p.startPage && page <= p.endPage);
  if (!data && state.poemPages.length > 0) {
    // 超出范围则返回首尾
    if (page < state.poemPages[0].startPage) return state.poemPages[0];
    return state.poemPages[state.poemPages.length - 1];
  }
  return data;
}

/** 获取总页数 */
function getTotalPages() {
  if (state.poemPages.length === 0) return 0;
  const last = state.poemPages[state.poemPages.length - 1];
  return last.endPage;
}

// ============ 页面导航 ============

function goToPage(page) {
  const total = getTotalPages();
  if (page < 1) page = 1;
  if (page > total) page = total;
  // 确保是奇数页（总是从左页开始）
  if (page % 2 === 0) page = page - 1;
  if (page < 1) page = 1;

  state.currentPage = page;
  renderSpread();
  updateNavButtons();
}

function nextPage() {
  goToPage(state.currentPage + 2);
}

function prevPage() {
  goToPage(state.currentPage - 2);
}

function updateNavButtons() {
  document.getElementById('prevPageBtn').disabled = state.currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = state.currentPage >= getTotalPages() - 1;
}

// ============ 书本渲染入口 ============

function renderBookView(poems) {
  state.currentPoems = poems;
  state.isSearchView = false;

  if (!poems || poems.length === 0) {
    document.getElementById('bookSpread').style.display = 'none';
    const container = document.getElementById('searchPoemsContainer');
    container.style.display = 'block';
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <p>暂无匹配的古诗</p>
      </div>
    `;
    document.getElementById('resultCount').textContent = '0 首';
    return;
  }

  document.getElementById('bookSpread').style.display = 'flex';
  document.getElementById('searchPoemsContainer').style.display = 'none';
  document.getElementById('resultCount').textContent = `${poems.length} 首`;

  buildPageData(poems);
  goToPage(1);
}

// ============ 搜索结果显示 ============

function showSearchResults(poems) {
  state.isSearchView = true;
  document.getElementById('bookSpread').style.display = 'none';

  if (!poems || poems.length === 0) {
    const container = document.getElementById('searchPoemsContainer');
    container.style.display = 'block';
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>没有找到匹配的古诗</p>
      </div>
    `;
    document.getElementById('resultCount').textContent = '0 首';
    return;
  }

  document.getElementById('resultCount').textContent = `找到 ${poems.length} 首`;

  const container = document.getElementById('searchPoemsContainer');
  container.style.display = 'block';
  container.innerHTML = poems.map(p => `
    <div class="search-result-card" onclick="goToPoemPage(${p.id})">
      <div class="sr-title">${escapeHtml(p.title)}</div>
      <div class="sr-meta">${escapeHtml(p.dynasty)} · ${escapeHtml(p.author)}</div>
      <div class="sr-content">${escapeHtml(p.content)}</div>
    </div>
  `).join('');
}

function goToPoemPage(id) {
  const page = getPoemPage(id);
  if (page > 0) {
    // 如果搜索结果可见，先切回书页模式
    const spread = document.getElementById('bookSpread');
    spread.style.display = 'flex';
    document.getElementById('searchPoemsContainer').style.display = 'none';
    state.isSearchView = false;
    goToPage(page);
  }
}

// ============ 当前视图渲染 ============

function renderCurrentView() {
  if (state.currentLevel === 'bookmark') {
    const poems = getBookmarkedPoems();
    if (poems.length > 0) {
      renderBookView(poems);
    } else {
      document.getElementById('bookSpread').style.display = 'none';
      const container = document.getElementById('searchPoemsContainer');
      container.style.display = 'block';
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⭐</div>
          <p>还没有收藏的古诗</p>
        </div>
      `;
      document.getElementById('resultCount').textContent = '0 首';
    }
    return;
  }

  let poems = getPoemsByLevel(state.currentLevel);

  // 应用筛选
  if (state.dynastyFilter) {
    poems = poems.filter(p => p.dynasty === state.dynastyFilter);
  }
  if (state.authorFilter) {
    poems = poems.filter(p => p.author === state.authorFilter);
  }
  if (state.tagFilter) {
    poems = poems.filter(p => p.tags && p.tags.includes(state.tagFilter));
  }
  // 应用搜索
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    poems = poems.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.author.toLowerCase().includes(q) ||
      p.content.includes(state.searchQuery)
    );
  }

  // 有搜索词则显示结果列表，否则显示书页
  if (state.searchQuery) {
    showSearchResults(poems);
  } else {
    renderBookView(poems);
  }
}

// ============ 目录 ============

function renderTOC() {
  const list = document.getElementById('tocList');
  const poems = state.currentPoems;

  if (!poems || poems.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary)">暂无内容</div>';
    return;
  }

  list.innerHTML = '';
  let lastLevel = '';

  poems.forEach((poem, idx) => {
    const item = state.poemPages[idx];
    const pageNum = item ? item.startPage : (idx * 2 + 1);

    // 学段分隔
    // 直接用诗的 level

    const div = document.createElement('div');
    div.className = 'toc-item';
    div.innerHTML = `
      <span class="toc-item-title">${escapeHtml(poem.title)}</span>
      <span class="toc-item-meta">${escapeHtml(poem.dynasty)}·${escapeHtml(poem.author)}</span>
      <span class="toc-item-page">第${pageNum}页</span>
    `;
    div.onclick = () => {
      closeTOC();
      goToPoemPage(poem.id);
    };
    list.appendChild(div);
  });
}

function openTOC() {
  renderTOC();
  document.getElementById('tocOverlay').style.display = 'flex';
}

function closeTOC() {
  document.getElementById('tocOverlay').style.display = 'none';
}

// ============ 收藏 ============

function toggleBookmark(id) {
  const idx = state.bookmarks.indexOf(id);
  if (idx >= 0) {
    state.bookmarks.splice(idx, 1);
  } else {
    state.bookmarks.push(id);
  }
  localStorage.setItem('poem-bookmarks', JSON.stringify(state.bookmarks));
  // 刷新当前视图
  const btn = document.querySelector('.page-bookmark');
  if (btn) {
    btn.textContent = state.bookmarks.includes(id) ? '⭐' : '☆';
    btn.classList.toggle('active', state.bookmarks.includes(id));
  }
  renderCurrentView();
}

function getBookmarkedPoems() {
  const all = getAllPoems();
  return all.filter(p => state.bookmarks.includes(p.id));
}

// ============ 筛选选项更新 ============

function updateFilterOptions(level) {
  const poems = getPoemsByLevel(level);
  const dynasties = [...new Set(poems.map(p => p.dynasty))].filter(Boolean);
  const authors = [...new Set(poems.map(p => p.author))].filter(Boolean);
  const tags = [...new Set(poems.flatMap(p => p.tags || []))].filter(Boolean);
  populateSelect('dynastyFilter', dynasties);
  populateSelect('authorFilter', authors);
  populateSelect('tagFilter', tags);
}

function populateSelect(id, options) {
  const sel = document.getElementById(id);
  const current = sel.value;
  sel.innerHTML = `<option value="">全部</option>` + options.map(o =>
    `<option value="${escapeHtml(o)}" ${o === current ? 'selected' : ''}>${escapeHtml(o)}</option>`
  ).join('');
}

// ============ 主题 / 拼音 / 字体 ============

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('poem-theme', state.theme);
  document.getElementById('themeToggle').textContent = state.theme === 'light' ? '🌙' : '☀️';
}

function togglePinyin() {
  state.showPinyin = !state.showPinyin;
  localStorage.setItem('poem-show-pinyin', state.showPinyin);
  document.getElementById('pinyinToggle').classList.toggle('active', state.showPinyin);
  // 刷新当前书页
  if (state.isSearchView) {
    renderCurrentView();
  } else {
    renderSpread();
  }
}

function cycleFontSize() {
  const sizes = ['small', 'medium', 'large'];
  const idx = sizes.indexOf(state.fontSize);
  state.fontSize = sizes[(idx + 1) % sizes.length];
  document.documentElement.setAttribute('data-font-size', state.fontSize);
  localStorage.setItem('poem-font-size', state.fontSize);
}

// ============ 头部隐藏/显示 ============

function toggleHeader() {
  const wrapper = document.querySelector('.book-wrapper');
  const isHidden = wrapper.classList.toggle('header-hidden');
  const toggleBtn = document.getElementById('headerToggleBtn');
  const floatBtn = document.getElementById('showHeaderFloatBtn');

  toggleBtn.textContent = isHidden ? '▼' : '▲';
  toggleBtn.title = isHidden ? '显示头部' : '隐藏头部';
  floatBtn.style.display = isHidden ? 'block' : 'none';
}

// ============ 初始化 ============

function init() {
  if (!document.getElementById('themeToggle')) return;

  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-font-size', state.fontSize);
  document.getElementById('themeToggle').textContent = state.theme === 'light' ? '🌙' : '☀️';

  document.getElementById('enterBtn').addEventListener('click', () => {
    // 封面 → 选择页
    document.getElementById('cover').style.display = 'none';
    document.getElementById('bookSelect').style.display = 'flex';
  });

  document.getElementById('backToCoverBtn').addEventListener('click', () => {
    document.getElementById('cover').style.display = 'flex';
    document.getElementById('bookSelect').style.display = 'none';
    document.getElementById('bookContent').style.display = 'none';
    window._appInitialized = false; // 允许下次重新选择
  });

  document.getElementById('backToCoverFromSelect').addEventListener('click', () => {
    document.getElementById('cover').style.display = 'flex';
    document.getElementById('bookSelect').style.display = 'none';
  });

  // 选择页 → 对应学段内容
  const enterLevel = (level) => {
    state.currentLevel = level;
    document.getElementById('bookSelect').style.display = 'none';
    document.getElementById('bookContent').style.display = 'block';

    if (!window._appInitialized) {
      initApp();
      window._appInitialized = true;
    }

    // 切换 Tab 并渲染
  state.dynastyFilter = '';
    state.authorFilter = '';
    state.tagFilter = '';
    state.searchQuery = '';
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.filter-bar select').forEach(s => s.value = '');
    renderCurrentView();
    updateNavButtons();
  };

  document.querySelectorAll('.select-card').forEach(card => {
    card.addEventListener('click', () => enterLevel(card.dataset.level));
  });
}

function initApp() {

  // 搜索
  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.searchQuery = e.target.value;
      renderCurrentView();
    }, 300);
  });

  // 筛选
  document.getElementById('dynastyFilter').addEventListener('change', (e) => {
    state.dynastyFilter = e.target.value;
    renderCurrentView();
  });
  document.getElementById('authorFilter').addEventListener('change', (e) => {
    state.authorFilter = e.target.value;
    renderCurrentView();
  });
  document.getElementById('tagFilter').addEventListener('change', (e) => {
    state.tagFilter = e.target.value;
    renderCurrentView();
  });

  // 拼音切换
  document.getElementById('pinyinToggle').addEventListener('click', togglePinyin);
  document.getElementById('pinyinToggle').classList.toggle('active', state.showPinyin);

  // 主题
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  // 字体
  document.getElementById('fontSizeBtn').addEventListener('click', cycleFontSize);

  // 收藏视图
  document.getElementById('bookmarkViewBtn').addEventListener('click', () => {
    state.currentLevel = 'bookmark';
    state.searchQuery = '';
    document.getElementById('searchInput').value = '';
    renderCurrentView();
  });

  // 头部隐藏/显示
  document.getElementById('headerToggleBtn').addEventListener('click', toggleHeader);
  document.getElementById('showHeaderFloatBtn').addEventListener('click', toggleHeader);

  // 翻页
  document.getElementById('prevPageBtn').addEventListener('click', prevPage);
  document.getElementById('nextPageBtn').addEventListener('click', nextPage);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextPage();
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'Escape') closeTOC();
  });

  // 目录（已在工具栏中）
  document.getElementById('tocBtn').addEventListener('click', openTOC);
  document.getElementById('tocClose').addEventListener('click', closeTOC);
  document.getElementById('tocOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeTOC();
  });

  // 初始化筛选选项（渲染由选择页触发）
  updateFilterOptions(state.currentLevel || 'primary');
}

// ============ 导出 ============
if (typeof globalThis !== 'undefined') {
  globalThis.getAllPoems = getAllPoems;
  globalThis.getPoemsByLevel = getPoemsByLevel;
  globalThis.renderCurrentView = renderCurrentView;
  globalThis.updateFilterOptions = updateFilterOptions;
  globalThis.toggleTheme = toggleTheme;
  globalThis.cycleFontSize = cycleFontSize;
  globalThis.togglePinyin = togglePinyin;
  globalThis.isChinese = isChinese;
  globalThis.getPinyin = getPinyin;
  globalThis.wrapRuby = wrapRuby;
  globalThis.splitIntoLines = splitIntoLines;
  globalThis.renderPoemContent = renderPoemContent;
  globalThis.buildPageData = buildPageData;
  globalThis.goToPage = goToPage;
  globalThis.nextPage = nextPage;
  globalThis.prevPage = prevPage;
  globalThis.getCurrentPoemAtPage = getCurrentPoemAtPage;
  globalThis.getTotalPages = getTotalPages;
  globalThis.getPoemPage = getPoemPage;
  globalThis.toggleBookmark = toggleBookmark;
  globalThis.getBookmarkedPoems = getBookmarkedPoems;
  globalThis.openTOC = openTOC;
  globalThis.closeTOC = closeTOC;
  globalThis.toggleHeader = toggleHeader;
  globalThis.goToPoemPage = goToPoemPage;
  globalThis.state = state;
}

// 初始化
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 0);
  }
}

if (typeof globalThis !== 'undefined' && typeof document !== 'undefined') {
  globalThis.__testInit = init;
}

</script>
