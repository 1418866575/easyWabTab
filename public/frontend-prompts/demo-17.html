<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下拉菜单</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 30px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{position:relative;display:inline-block}
.trigger{font:inherit;font-size:13px;font-weight:600;padding:9px 15px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
.trigger[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.trigger:focus-visible,.item:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.menu{position:absolute;top:calc(100% + 6px);left:0;width:210px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;box-shadow:0 12px 30px rgba(27,35,48,.14);z-index:5}
.menu[hidden]{display:none}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;font-size:13px;padding:8px 10px;border:0;background:transparent;color:var(--ink);border-radius:6px;cursor:pointer;text-align:left}
.item:hover,.item.active{background:var(--soft);color:var(--brand)}
.item.danger{color:#C0392B}.item.danger:hover,.item.danger.active{background:#FDF1EF}
.kbd{font:11px ui-monospace,monospace;color:#9AA4B2}
.sep{height:1px;background:var(--line);margin:5px 2px}
.note{margin:14px 0 0;font:11.5px/1.6 ui-monospace,monospace;color:var(--muted)}
</style></head><body>
<div class="wrap"><button class="trigger" id="btn" type="button" aria-haspopup="menu" aria-expanded="false">更多操作 ▾</button>
<div class="menu" id="menu" role="menu" hidden>
<button class="item" role="menuitem" type="button">编辑<span class="kbd">⌘E</span></button>
<button class="item" role="menuitem" type="button">复制<span class="kbd">⌘D</span></button>
<button class="item" role="menuitem" type="button">归档<span class="kbd">⌘A</span></button>
<div class="sep"></div>
<button class="item danger" role="menuitem" type="button">删除<span class="kbd">⌫</span></button>
</div></div>
<p class="note" id="note">点按钮展开，也可以按上下键选择、Esc 收起</p>
<script>
var btn=document.getElementById('btn'),menu=document.getElementById('menu'),note=document.getElementById('note');
var items=[].slice.call(menu.querySelectorAll('.item')),idx=-1;
function open(){menu.hidden=false;btn.setAttribute('aria-expanded','true');}
function close(){menu.hidden=true;btn.setAttribute('aria-expanded','false');idx=-1;items.forEach(function(i){i.classList.remove('active');});}
function hi(n){idx=(n+items.length)%items.length;items.forEach(function(i,j){i.classList.toggle('active',j===idx);});}
btn.onclick=function(e){e.stopPropagation();if(menu.hidden)open();else close();};
items.forEach(function(it,i){
  it.onclick=function(e){e.stopPropagation();note.textContent='已执行：'+it.firstChild.textContent.trim();close();};
  it.onmouseenter=function(){hi(i);};
});
document.addEventListener('click',function(e){if(!menu.contains(e.target))close();});
document.addEventListener('keydown',function(e){
  if(menu.hidden)return;
  if(e.key==='Escape'){close();btn.focus();}
  else if(e.key==='ArrowDown'){e.preventDefault();hi(idx+1);}
  else if(e.key==='ArrowUp'){e.preventDefault();hi(idx-1);}
  else if(e.key==='Enter'&&idx>=0){e.preventDefault();items[idx].click();}
});
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
