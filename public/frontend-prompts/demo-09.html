<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随手记</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:20px 24px 24px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:480px}
h3{font-size:16px;margin:0 0 4px}
.tip{margin:0 0 12px;color:var(--muted);font-size:12px}
textarea{width:100%;min-height:112px;resize:vertical;font:inherit;font-size:13px;line-height:1.7;padding:12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--soft)}
textarea::placeholder{color:#A6AFBD}
textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
#status{font:11.5px/1.5 ui-monospace,monospace;color:var(--muted)}
button{font:inherit;font-size:12px;padding:7px 13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--brand);color:var(--brand)}
button:focus-visible{outline:3px solid rgba(47,91,234,.25);outline-offset:2px}
</style></head><body>
<div class="app"><h3>随手记</h3><p class="tip">输入即自动保存，刷新这个页面内容还在</p>
<textarea id="note" placeholder="记点什么：今天学到的一行 CSS、一个报错、一个想法……"></textarea>
<div class="row"><span id="status">已保存 · 打开页面时自动恢复</span><button id="clear" type="button">清空</button></div></div>
<script>
var KEY='draft-note',ta=document.getElementById('note'),st=document.getElementById('status'),ok=true;
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);ta.value=d.text||'';}}catch(e){ok=false;}
if(!ok){st.textContent='当前环境无法保存，内容仅在本次有效';}
ta.addEventListener('input',function(){
  try{localStorage.setItem(KEY,JSON.stringify({text:ta.value}));st.textContent='已保存 · 刚刚';}
  catch(e){st.textContent='当前环境无法保存，内容仅在本次有效';}
});
document.getElementById('clear').onclick=function(){ta.value='';try{localStorage.removeItem(KEY);}catch(e){}st.textContent='已清空';ta.focus();};
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
