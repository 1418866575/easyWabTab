<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单选下拉框</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 30px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.lab{display:block;font-size:12px;font-weight:600;margin:0 0 7px}
.field{width:280px;position:relative}
.trigger{display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.trigger[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.trigger:focus-visible,.opt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.arw{color:var(--muted);font-size:11px}
.list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:0 12px 30px rgba(27,35,48,.14);z-index:5}
.list[hidden]{display:none}
.opt{display:flex;align-items:flex-start;justify-content:space-between;width:100%;font:inherit;padding:9px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left}
.opt:hover,.opt.active{background:var(--soft)}
.opt b{display:block;font-size:13px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tick{color:var(--brand);font-weight:700;font-size:13px}
.note{margin:14px 0 0;font:11.5px/1.6 ui-monospace,monospace;color:var(--muted)}
</style></head><body>
<label class="lab" id="lab">项目状态</label>
<div class="field"><button class="trigger" id="btn" type="button" role="combobox" aria-labelledby="lab" aria-expanded="false" aria-haspopup="listbox"><span id="val">草稿</span><span class="arw">▾</span></button>
<div class="list" id="list" role="listbox" hidden></div></div>
<p class="note" id="note">当前状态：草稿</p>
<script>
var data=[{t:'草稿',d:'还没提交给团队'},{t:'进行中',d:'正在开发与联调'},{t:'待验收',d:'等测试确认'},{t:'已归档',d:'已完成，不再修改'}];
var cur=0,idx=0,btn=document.getElementById('btn'),list=document.getElementById('list'),val=document.getElementById('val'),note=document.getElementById('note');
function draw(){
  list.innerHTML=data.map(function(o,i){return '<button class="opt'+(i===idx?' active':'')+'" type="button" role="option" aria-selected="'+(i===cur)+'"><span><b>'+o.t+'</b><small>'+o.d+'</small></span><span class="tick">'+(i===cur?'✓':'')+'</span></button>';}).join('');
  [].slice.call(list.querySelectorAll('.opt')).forEach(function(el,i){
    el.onmouseenter=function(){idx=i;paint();};
    el.onclick=function(){cur=i;val.textContent=data[i].t;note.textContent='状态已改为：'+data[i].t;close();};
  });
}
function paint(){[].slice.call(list.children).forEach(function(el,i){el.classList.toggle('active',i===idx);});}
function open(){list.hidden=false;btn.setAttribute('aria-expanded','true');idx=cur;draw();}
function close(){list.hidden=true;btn.setAttribute('aria-expanded','false');}
btn.onclick=function(e){e.stopPropagation();if(list.hidden)open();else close();};
document.addEventListener('click',function(e){if(!list.contains(e.target)&&e.target!==btn)close();});
document.addEventListener('keydown',function(e){
  if(list.hidden)return;
  if(e.key==='Escape'){close();btn.focus();}
  else if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%data.length;paint();}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+data.length)%data.length;paint();}
  else if(e.key==='Enter'){e.preventDefault();list.children[idx].click();}
});
draw();
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
