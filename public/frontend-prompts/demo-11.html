<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浮动标签</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE}
*{box-sizing:border-box}
body{margin:0;padding:20px 24px 24px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.hint{margin:0 0 16px;font:11.5px/1.5 ui-monospace,monospace;color:var(--muted)}
form{max-width:360px;display:grid;gap:16px}
.field{position:relative}
input{width:100%;height:52px;font:inherit;font-size:14px;padding:18px 12px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input::placeholder{color:transparent}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
label{position:absolute;left:13px;top:16px;font-size:14px;color:var(--muted);pointer-events:none;transform-origin:left top;transition:transform .15s,color .15s}
input:focus+label,input:not(:placeholder-shown)+label{transform:translateY(-10px) scale(.78);color:var(--brand)}
.field.err input{border-color:#D8453B;box-shadow:0 0 0 3px rgba(216,69,59,.12)}
.field.err label{color:#D8453B}
.msg{color:#D8453B;font-size:11.5px;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){label{transition:none}}
</style></head><body>
<p class="hint">↕ 点进输入框，看标签怎么浮起来</p>
<form onsubmit="return false">
<div class="field"><input id="a" type="text" placeholder=" " value="林默"><label for="a">姓名</label></div>
<div class="field"><input id="b" type="email" placeholder=" "><label for="b">邮箱</label></div>
<div class="field"><input id="c" type="password" placeholder=" "><label for="c">密码</label></div>
<div class="field err"><input id="d" type="email" placeholder=" " value="linmo#mail.com"><label for="d">备用邮箱</label><p class="msg">邮箱格式不对，请检查 @ 符号</p></div>
</form>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
