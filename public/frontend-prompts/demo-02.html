<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人作品集</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:26px 30px;background:#fff;color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:17px;margin:0;letter-spacing:-.02em}
nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:13px}
nav a:first-child{color:var(--brand);font-weight:600}
main{max-width:62ch;padding:26px 0 30px}
h2{font-size:30px;line-height:1.25;letter-spacing:-.03em;margin:0 0 14px}
p{color:var(--muted);margin:0 0 22px}
.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:11px 20px;border-radius:7px;font-size:14px;font-weight:600;transition:transform .15s,background .15s}
.btn:hover{background:#1E46C8;transform:translateY(-1px)}
.palette{display:flex;gap:10px;margin:26px 0 0}
.sw{flex:1;text-align:center;font:11px/1.4 ui-monospace,monospace;color:var(--muted)}
.sw i{display:block;height:32px;border-radius:6px;margin-bottom:6px;border:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding-top:14px;color:#9AA4B2;font-size:12px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style></head><body>
<header><h1>林默 · 前端练习</h1><nav><a href="#">首页</a><a href="#">项目</a><a href="#">关于</a></nav></header>
<main><h2>你好，我是林默</h2><p>正在借助 AI 从零写一个前端项目，把颜色、间距和字体都收进变量里，改一处就能换掉整套外观。</p><a class="btn" href="#">查看我的项目 →</a>
<div class="palette"><div class="sw"><i style="background:#2F5BEA"></i>--brand</div><div class="sw"><i style="background:#1B2330"></i>--ink</div><div class="sw"><i style="background:#F5F7FB"></i>--soft</div></div></main>
<footer>© 2026 林默 · 用 AI 写着玩</footer>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
