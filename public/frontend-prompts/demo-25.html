<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生日选择</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 28px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.lab{display:block;font-size:12px;font-weight:600;margin:0 0 8px}
.row{display:flex;gap:10px;max-width:400px}
select{flex:1;min-width:0;font:inherit;font-size:13px;padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.card{margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.note{margin:0;font:12px/1.7 ui-monospace,monospace;color:var(--ink)}
.tip{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
</style></head><body>
<label class="lab">出生日期</label>
<div class="row"><select id="y" aria-label="出生年份"></select><select id="m" aria-label="出生月份"></select><select id="d" aria-label="出生日"></select></div>
<div class="card"><p class="note" id="note"></p><p class="tip">把月份改成 2 月、年份改成闰年，看看天数怎么变</p></div>
<script>
var y=document.getElementById('y'),m=document.getElementById('m'),d=document.getElementById('d'),note=document.getElementById('note');
for(var i=1960;i<=2010;i++)y.add(new Option(i+' 年',i));
for(var j=1;j<=12;j++)m.add(new Option(j+' 月',j));
y.value=1995;m.value=8;
function refresh(){
  var max=new Date(+y.value,+m.value,0).getDate(),cur=+d.value||12;
  d.innerHTML='';
  for(var k=1;k<=max;k++)d.add(new Option(k+' 日',k));
  d.value=Math.min(cur,max);
  var t=new Date(),age=t.getFullYear()-(+y.value);
  if(t.getMonth()+1<+m.value||(t.getMonth()+1===+m.value&&t.getDate()<+d.value))age--;
  note.textContent='已选生日：'+y.value+' 年 '+m.value+' 月 '+d.value+' 日 · '+age+' 岁';
}
y.onchange=refresh;m.onchange=refresh;d.onchange=refresh;
refresh();
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
