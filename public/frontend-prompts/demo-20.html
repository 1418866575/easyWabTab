<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标签输入</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 30px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.lab{display:block;font-size:12px;font-weight:600;margin:0 0 7px}
.box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:400px;padding:8px;border:1px solid var(--line);border-radius:8px}
.box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.chips{display:contents}
.chip{display:inline-flex;align-items:center;gap:6px;background:#E9EFFF;color:#2549B8;font-size:12px;padding:4px 8px;border-radius:5px}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0}
.chip button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#t{flex:1;min-width:120px;border:0;outline:0;font:inherit;font-size:13px;padding:4px;color:var(--ink)}
.sug{margin:10px 0 0;font-size:12px;color:var(--muted)}
.sug button{margin-left:6px;border:1px solid var(--line);background:#fff;color:var(--brand);font:inherit;font-size:11.5px;padding:3px 9px;border-radius:20px;cursor:pointer}
.sug button:hover{border-color:var(--brand)}
.sug button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.note{margin:12px 0 0;font:11.5px/1.6 ui-monospace,monospace;color:var(--muted)}
</style></head><body>
<label class="lab" for="t">掌握的技能</label>
<div class="box" id="box"><span class="chips" id="chips"></span><input id="t" type="text" placeholder="输入后按回车"></div>
<p class="sug" id="sug">建议：</p>
<p class="note" id="note"></p>
<script>
var tags=['HTML','CSS'],sugs=['Vue','JavaScript','CSS','Node.js'];
var chips=document.getElementById('chips'),t=document.getElementById('t'),note=document.getElementById('note'),sug=document.getElementById('sug');
function render(){
  chips.innerHTML=tags.map(function(x,i){return '<span class="chip">'+x+'<button type="button" data-i="'+i+'" aria-label="删除 '+x+'">×</button></span>';}).join('');
  [].slice.call(chips.querySelectorAll('button')).forEach(function(b){b.onclick=function(){tags.splice(+b.getAttribute('data-i'),1);note.textContent='';render();};});
  note.textContent=tags.length?'已添加 '+tags.length+' 个标签':'还没有标签，输入后按回车添加';
  sug.innerHTML='建议：'+sugs.map(function(s){return '<button type="button" data-s="'+s+'">'+s+'</button>';}).join('');
  [].slice.call(sug.querySelectorAll('button')).forEach(function(b){b.onclick=function(){add(b.getAttribute('data-s'));};});
}
function add(v){
  v=(v||'').trim();if(!v)return;
  if(tags.indexOf(v)>=0){note.textContent='这个标签已经加过了';return;}
  tags.push(v);t.value='';note.textContent='';render();t.focus();
}
t.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();add(t.value);}
  else if(e.key==='Backspace'&&!t.value&&tags.length){tags.pop();render();}
});
render();
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
