<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按钮与表单</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 26px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h3{font-size:16px;margin:0 0 14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.btn--primary{background:var(--brand);color:#fff}
.btn--primary:hover{background:#1E46C8}
.btn--ghost{background:#fff;border-color:var(--line);color:var(--brand)}
.btn--ghost:hover{border-color:var(--brand)}
.btn--text{background:transparent;color:var(--brand);padding-left:4px;padding-right:4px}
.btn:disabled{background:#EDF0F5;color:#A6AFBD;cursor:not-allowed;border-color:transparent}
.btn:focus-visible{outline:3px solid rgba(47,91,234,.3);outline-offset:2px}
form{max-width:320px}
label{display:block;font-size:12px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;margin-bottom:14px;color:var(--ink)}
input::placeholder{color:#A6AFBD}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.field.err input{border-color:#D8453B;box-shadow:0 0 0 3px rgba(216,69,59,.12)}
.msg{color:#D8453B;font-size:11.5px;margin:-8px 0 14px}
.submit{width:100%;background:var(--brand);color:#fff;border:0;border-radius:7px;padding:11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.submit:focus-visible{outline:3px solid rgba(47,91,234,.3);outline-offset:2px}
</style></head><body>
<h3>按钮与表单</h3>
<div class="btns"><button class="btn btn--primary" type="button">主要操作</button><button class="btn btn--ghost" type="button">次要操作</button><button class="btn btn--text" type="button">文字按钮</button><button class="btn" type="button" disabled>已禁用</button></div>
<form onsubmit="return false">
<div class="field err"><label for="e">邮箱</label><input id="e" type="email" value="linmo#example.com" placeholder="you@example.com"><p class="msg">邮箱格式不对，请检查 @ 符号</p></div>
<div class="field"><label for="p">密码</label><input id="p" type="password" placeholder="至少 8 位"></div>
<button class="submit" type="button">登录</button>
</form>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
