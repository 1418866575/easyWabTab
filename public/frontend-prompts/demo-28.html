<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期时间</title>
<style>
:root{--brand:#2F5BEA;--ink:#1B2330;--muted:#6B7686;--line:#E3E7EE;--soft:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;padding:22px 24px 30px;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.field{position:relative;width:280px}
.trigger{display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.trigger[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.trigger:focus-visible,.d:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.ico{color:var(--muted)}
.panel{position:absolute;top:calc(100% + 6px);left:0;width:430px;display:grid;grid-template-columns:1fr 100px;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 16px 40px rgba(27,35,48,.16);z-index:5}
.panel[hidden]{display:none}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .head b{font-size:13px}
.nav{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font:inherit}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.w{text-align:center;font-size:10px;color:var(--muted);padding:3px 0}
.d{height:28px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:50%;font:inherit;font-size:11.5px;cursor:pointer}
.d.out{color:#C3CAD6;cursor:default}
.d:hover:not(.out){background:var(--soft)}
.d.sel{background:var(--brand);color:#fff}
.side label{display:block;font-size:11px;color:var(--muted);margin:2px 0 4px}
.side select{width:100%;font:inherit;font-size:12px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:10px}
.foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:10px}
button.act{font:inherit;font-size:12px;padding:6px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (max-width:520px){.panel{width:330px;grid-template-columns:1fr}.foot{grid-column:1}}
</style></head><body>
<div class="field"><button class="trigger" id="btn" type="button" aria-expanded="false" aria-haspopup="dialog"><span id="val"></span><span class="ico">▦</span></button>
<div class="panel" id="panel" hidden>
<div class="cal"><div class="head"><button class="nav" id="prev" type="button" aria-label="上个月">‹</button><b id="title"></b><button class="nav" id="next" type="button" aria-label="下个月">›</button></div><div class="grid" id="grid"></div></div>
<div class="side"><label for="h">时</label><select id="h"></select><label for="mi">分</label><select id="mi"></select></div>
<div class="foot"><button class="act" id="now" type="button">现在</button><button class="act primary" id="ok" type="button">确定</button></div>
</div></div>
<script>
var now=new Date(),vy=now.getFullYear(),vm=now.getMonth(),sel=new Date(vy,vm,now.getDate()),H=14,M=30;
var W=['一','二','三','四','五','六','日'],grid=document.getElementById('grid'),title=document.getElementById('title'),btn=document.getElementById('btn'),panel=document.getElementById('panel'),val=document.getElementById('val'),h=document.getElementById('h'),mi=document.getElementById('mi');
function pad(n){return n<10?'0'+n:''+n;}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function text(){return key(sel)+' '+pad(H)+':'+pad(M);}
for(var i=0;i<24;i++)h.add(new Option(pad(i),i));
for(var j=0;j<60;j+=5)mi.add(new Option(pad(j),j));
h.value=H;mi.value=M;
function draw(){
  title.textContent=vy+' 年 '+(vm+1)+' 月';
  var start=(new Date(vy,vm,1).getDay()+6)%7,days=new Date(vy,vm+1,0).getDate(),pd=new Date(vy,vm,0).getDate();
  var s=W.map(function(w){return '<div class="w">'+w+'</div>';}).join('');
  for(var i=0;i<42;i++){
    var d,out=false;
    if(i<start){d=new Date(vy,vm-1,pd-start+1+i);out=true;}
    else if(i>=start+days){d=new Date(vy,vm+1,i-start-days+1);out=true;}
    else d=new Date(vy,vm,i-start+1);
    var k=key(d);
    s+='<button class="d'+(out?' out':'')+(k===key(sel)?' sel':'')+'" type="button" data-k="'+k+'"'+(out?' disabled':'')+'>'+d.getDate()+'</button>';
  }
  grid.innerHTML=s;
  [].slice.call(grid.querySelectorAll('.d:not(.out)')).forEach(function(b){
    b.onclick=function(){var p=b.getAttribute('data-k').split('-');sel=new Date(+p[0],+p[1]-1,+p[2]);vy=sel.getFullYear();vm=sel.getMonth();draw();};
  });
}
function open(){panel.hidden=false;btn.setAttribute('aria-expanded','true');draw();}
function close(){panel.hidden=true;btn.setAttribute('aria-expanded','false');}
btn.onclick=function(e){e.stopPropagation();if(panel.hidden)open();else close();};
panel.onclick=function(e){e.stopPropagation();};
document.addEventListener('click',function(e){if(!panel.contains(e.target)&&e.target!==btn)close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
document.getElementById('prev').onclick=function(){vm--;if(vm<0){vm=11;vy--;}draw();};
document.getElementById('next').onclick=function(){vm++;if(vm>11){vm=0;vy++;}draw();};
h.onchange=function(){H=+h.value;};mi.onchange=function(){M=+mi.value;};
document.getElementById('now').onclick=function(){var t=new Date();sel=new Date(t.getFullYear(),t.getMonth(),t.getDate());vy=t.getFullYear();vm=t.getMonth();H=t.getHours();M=Math.floor(t.getMinutes()/5)*5;h.value=H;mi.value=M;draw();};
document.getElementById('ok').onclick=function(){val.textContent=text();close();};
val.textContent=text();
draw();
</script>

<script>(function(){function report(){try{var b=document.body,c=getComputedStyle(b),h=b.scrollHeight+(parseFloat(c.marginTop)||0)+(parseFloat(c.marginBottom)||0),mx=0;b.querySelectorAll("*").forEach(function(el){var r=el.getBoundingClientRect();if(r.height<=0||r.bottom<=h)return;var st=getComputedStyle(el);if((st.position==="absolute"||st.position==="fixed")&&st.display!=="none"&&r.bottom>mx)mx=r.bottom;});if(mx>h)h=mx;parent.postMessage({__demoHeight:true,id:"fp",height:h},"*");}catch(e){}}var t=0;function later(){clearTimeout(t);t=setTimeout(report,280);}if(window.ResizeObserver){try{new ResizeObserver(report).observe(document.body);}catch(e){}}if(window.MutationObserver){try{new MutationObserver(function(){report();later();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class","hidden"]});}catch(e){}}window.addEventListener("load",report);window.addEventListener("resize",report);window.addEventListener("message",function(e){if(e.data&&e.data.__askHeight)report();});report();})();</script>
</body></html>
