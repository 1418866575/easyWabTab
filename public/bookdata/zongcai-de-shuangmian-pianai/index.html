  {title:'第101章 新年烟火，许愿同行', vol:3, html:'<p>转眼又到了年底。</p>\n<p>这是温叙白和陆峥寒在一起后的第二个新年。</p>\n<p>去年的跨年夜，两人还在暧昧阶段——在滨水工地上看烟火，心跳加速但不敢表白。今年不同了。今年他们可以光明正大地牵手，光明正大地拥抱，光明正大地在一起。</p>\n<p>跨年夜的安排是陆瑶张罗的——她说要搞一个"家庭跨年派对"，地点选在陆家老宅。</p>\n<p>来的人不多：陆老夫人、陆瑶、陆峥寒和温叙白、还有林舟——是的，林舟被陆瑶以"帮忙"的名义叫来了。</p>\n<p>"瑶瑶，你叫我来到底是帮什么忙？"林舟站在厨房里，手足无措。</p>\n<p>"帮我切水果。"陆瑶把一盘橙子塞给他。</p>\n<p>"我……好。"林舟拿起刀，开始笨拙地切橙子。</p>\n<p>陆峥寒靠在厨房门口，看了一眼林舟的脸红程度，转头对温叙白小声说："瑶瑶好像真的对林舟有意思。"</p>\n<p>"看出来了吗？"温叙白说，"陆瑶一直在偷偷看他。"</p>\n<p>"林舟也一直在偷偷看她。"</p>\n<p>"那他们什么时候——"</p>\n<p>"不知道。"陆峥寒笑了，"但跟我当年比，他们已经够快了。"</p>\n<p>温叙白看了他一眼："你蓄谋七年叫\'快\'？"</p>\n<p>"对别人来说是慢的。对你来说——"</p>\n<p>"对你来说是蓄谋。"温叙白替他说完，嘴角弯了弯。</p>\n<p>跨年派对在老宅的宴会厅举行。</p>\n<p>陆老夫人坐在主位上，精神很好。周伯准备了一桌子菜，大家围坐在一起，像一家人一样。</p>\n<p>"峥寒，叙白。"陆老夫人举起茶杯，"新的一年，祝你们好好的。"</p>\n<p>"谢谢奶奶。"温叙白说。</p>\n<p>"谢谢祖母。"</p>\n<p>晚饭后，众人在花园里等烟火。</p>\n<p>花园里挂满了暖色的小灯，树上缠着灯串，像一个童话世界。陆瑶和林舟在挂最后一批装饰，两人离得很近，陆瑶在笑，林舟的脸红得像灯笼。</p>\n<p>"他们真的很配。"陆峥寒评价道。</p>\n<p>"嗯。"温叙白靠在他肩上，"像年轻时的我们。"</p>\n<p>"我们年轻的时候——你是说我追你的时候？"</p>\n<p>"那时候我以为你只是个爱管闲事的霸总。"</p>\n<p>"现在呢？"</p>\n<p>"现在我知道了。"温叙白闭上眼，"你是蓄谋了七年、飞了十三个小时给我送小笼包、以我爷爷的名义建图书馆的——爱管闲事的霸总。"</p>\n<p>陆峥寒笑了，把他搂得更紧。</p>\n<p>十一点五十九分。</p>\n<p>所有人站在花园里，抬头看天。</p>\n<p>远处海城的烟火开始燃放——一朵接一朵的烟花在夜空中绽放，红的、金的、紫的、蓝的，照亮了整个城市的天际线。</p>\n<p>"十、九、八、七——"</p>\n<p>大家一起倒数。</p>\n<p>"三、二、一——"</p>\n<p>新年快乐！</p>\n<p>烟火在头顶炸开，漫天璀璨。</p>\n<p>陆峥寒低头看温叙白——烟火的光映在他的清冷面容上，像一幅画。</p>\n<p>"新年快乐。"他说。</p>\n<p>"新年快乐。"温叙白抬头看他。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"新的一年，我有一个愿望。"</p>\n<p>"什么？"</p>\n<p>"希望明年这个时候——"陆峥寒的声音在烟火声中格外温柔，"你已经是我的丈夫。"</p>\n<p>温叙白看着他，清冷的眼底映着漫天烟火。</p>\n<p>"好。"他说。</p>\n<p>只有一个字，但足够了。</p>\n<p>远处，陆瑶偷偷看了一眼旁边——林舟正鼓起勇气，轻轻握住了她的手。</p>\n<p>她没有挣开。</p>\n<p>花园的另一角，陆老夫人坐在红木椅上，看着花园里两对年轻人，笑了。</p>\n<p>"老宅好久没这么热闹了。"她对周伯说。</p>\n<p>"是啊。"周伯笑着，"热闹好。"</p>\n<p>烟火还在绽放，新年的钟声在远方响起。</p>\n<p>这一刻，所有人都被温柔包裹着。</p>\n<div class="hook">**【本章钩子：第二个新年，两对couple在烟火下心动。"希望明年你是我的丈夫"——一个字"好"就是全部的回答。新年新气象，开春后温叙白即将迈出独立创业的重要一步，而陆峥寒的求婚计划也在悄然推进……】**</div>\n'},
  {title:'第102章 开春新局，联手创业', vol:3, html:'<p>新年过后，温叙白做了一个重大决定——独立创业。</p>\n<p>"我想成立自己的建筑事务所。"那天早餐时，他对陆峥寒说。</p>\n<p>陆峥寒放下筷子："你想好了？"</p>\n<p>"想好了。"温叙白说，"以前我以个人工作室的形式接项目，规模有限。现在滨水拿奖了，国内外都有项目邀约，我需要一个完整的团队。"</p>\n<p>"你的计划是什么？"</p>\n<p>"以温怀瑾社区图书馆为第一个旗舰项目，建立\'叙白建筑事务所\'。团队我已经开始物色了——有几个在米兰双年展认识的年轻建筑师，很有才华。"</p>\n<p>陆峥寒看着他："资金方面呢？"</p>\n<p>"我自己有积蓄。加上滨水项目的版权收入，启动资金够了。"</p>\n<p>"如果你需要——"</p>\n<p>"我知道。"温叙白笑了笑，"但我先自己来。如果需要帮忙，我会开口。"</p>\n<p>陆峥寒点头："好。"</p>\n<p>他不会干涉温叙白的决定，但他会默默做好一切准备——随时待命。</p>\n<p>一个月后，"叙白建筑事务所"正式成立。</p>\n<p>事务所选址在海城滨江的一栋老建筑里——温叙白亲自设计的内部空间，保留了老建筑的结构，融入了现代设计语言。</p>\n<p>开业那天，来了很多人。建筑界的同行、媒体、还有城东图书馆的社区居民代表。</p>\n<p>陆峥寒站在人群后面，看着温叙白站在事务所门口，穿着白色衬衫，清冷而从容。</p>\n<p>"叙白建筑事务所。"温叙白看着门牌上的字，对在场的人说，"我们的理念是——建筑是温柔的容器，用空间承载生活的温度。"</p>\n<p>掌声响起。</p>\n<p>陆峥寒在人群中鼓掌，眼神温柔。</p>\n<p>开业后的第一个月，事务所就接到了三个项目邀约——一个社区文化中心、一个乡村小学重建、一个城市公共空间改造。</p>\n<p>"都是公共建筑。"陆峥寒看到项目清单时说。</p>\n<p>"嗯。"温叙白说，"公共建筑是我的方向。爷爷一辈子做的也是公共建筑。"</p>\n<p>"叙白，你有没有想过——你爷爷的设计理念，不只是一座图书馆，而是一种建筑哲学。"</p>\n<p>温叙白看着他："你的意思是？"</p>\n<p>"把这种理念做成一个体系。"陆峥寒说，"不止设计建筑，还要推广理念——出书、办展、做教育。让\'温暖的公共空间\'成为一种被广泛认知的设计哲学。"</p>\n<p>温叙白怔了一下。</p>\n<p>"你——"他看着陆峥寒，"你什么时候变得这么懂建筑了？"</p>\n<p>"跟你在一起久了。"陆峥寒笑了笑，"而且我是商人，我看到的不只是建筑，还有价值。你的设计理念有巨大的社会价值，值得被更多人知道。"</p>\n<p>温叙白看着他，沉默了几秒。</p>\n<p>"好。"他说，"我听你的。"</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你现在说\'我听你的\'了。以前你从来不听我的。"</p>\n<p>"以前你说的我不爱听。"</p>\n<p>"现在呢？"</p>\n<p>"现在你说得越来越有道理了。"</p>\n<p>陆峥寒笑了，伸手揽过他的肩膀。</p>\n<p>事务所的创业之路开始了。温叙白负责设计和创意，陆峥寒在背后默默提供商业支持——资源对接、品牌推广、法务保障。</p>\n<p>两个人，一个用空间表达温度，一个用实力守护梦想。</p>\n<p>这就是他们最好的搭档方式。</p>\n<div class="hook">**【本章钩子：叙白建筑事务所正式成立！温叙白以爷爷的理念为根基，开启独立创业之路。陆峥寒从幕后提供商业支持——"一个用空间表达温度，一个用实力守护梦想"。事业蒸蒸日上之际，最后的暗线也即将浮出水面……】**</div>\n'},
  {title:'第103章 暗线收网，最后反派', vol:3, html:'<p>就在一切向好的时候，最后一条暗线浮出了水面。</p>\n<p>始作俑者是陆承业。</p>\n<p>被逐出董事会后，陆承业并没有认输。他表面沉寂了几个月，暗地里一直在寻找翻盘的机会。</p>\n<p>——说"翻盘"其实不准确。陆承业心里清楚，他从来就没有"盘"可以翻。</p>\n<p>陆承业是陆老夫人的长子，按辈分是陆峥寒的大伯。在陆家，所有人都知道一个<span class="annot" data-tip="彼此心里明白，不用明说">心照不宣</span>的事实：陆老夫人的丈夫、陆家第一代掌门人陆鹤鸣，当年没有把陆氏交给长子陆承业，而是交给了次子陆怀瑾——也就是陆峥寒的父亲。</p>\n<p>原因很简单：陆承业做生意的天赋平庸。他守成勉强，开拓不足，胆子大但眼界窄。陆鹤鸣看得清楚，所以选了更优秀的次子。</p>\n<p>陆承业花了二十年接受这个事实。弟弟在位时，他安安分分当他的旁系股东，每年拿分红，日子过得不差。但弟弟和弟媳出车祸那年，陆承业心里那颗种子发了芽——弟弟不在了，陆氏的下一任掌门，按长幼该是他。</p>\n<p>结果陆老夫人选了十七岁的陆峥寒。</p>\n<p>一个十七岁的孩子，凭什么？——就凭他姓陆，凭他是陆怀瑾的儿子，凭陆鹤鸣生前留过一句话："陆氏的根在峥寒这一脉。"</p>\n<p>陆承业在那天晚上喝了大半瓶白酒。他没有闹，没有质问，只是一个人坐在客厅里，对着陆鹤鸣的遗像坐了一夜。</p>\n<p>从那以后，他表面上对陆峥寒恭恭敬敬，暗地里一直在等一个机会——等陆峥寒犯错，等陆峥寒撑不住，等一个能让他"名正言顺"接手陆氏的契机。</p>\n<p>但陆峥寒没有犯错。他三年内把陆氏的市值翻了一倍，五年内跻身海城前三。陆承业等了十年，什么都没等到。</p>\n<p>直到温叙白出现。</p>\n<p>陆承业不知道温叙白对陆峥寒意味着什么，但他知道——陆峥寒第一次有了一个"弱点"。一个会让他在意、让他分心、让他可能做出非理性决策的人。</p>\n<p>所以当恒盛找上他时，他几乎没怎么犹豫。</p>\n<p>他的突破口，选在了温怀瑾社区图书馆的施工项目上。</p>\n<p>那天，林舟急匆匆地走进陆峥寒的办公室。</p>\n<p>"陆总，出事了。"他脸色难看，"社区图书馆工地被人举报了。"</p>\n<p>"举报什么？"</p>\n<p>"说是\'违规施工\'、\'未取得施工许可证\'。"林舟把举报材料递过来，"举报人是一个叫\'社区权益保护联盟\'的组织，我查了一下，是空壳——背后是陆承业的人。"</p>\n<p>陆峥寒看着材料，目光冰冷。</p>\n<p>"施工许可证呢？"</p>\n<p>"手续都齐全。"林舟说，"我亲自跟进的。但举报材料里附了一些照片，是工地的施工细节——明显是有人潜入工地偷拍的。"</p>\n<p>"他想干什么？"</p>\n<p>"拖延工期。"林舟分析道，"如果举报受理，施工方会被要求停工配合调查。虽然最终会证明我们没有违规，但工期会延误——而温怀瑾社区图书馆计划在三月落成，时间卡得很紧。"</p>\n<p>陆峥寒站起来，走到窗前。</p>\n<p>"大伯这是冲着叙白来的。"他说，"他知道这个项目对叙白的意义，所以故意卡时间。"</p>\n<p>"陆总，要不要直接报警？"</p>\n<p>"报警是一定的。但在那之前——"陆峥寒转过身，"我要先把大伯的底摸清楚。他这几个月在暗处做了什么，我要一清二楚。"</p>\n<p>"明白。"</p>\n<p>三天后，林舟带回了调查结果。但不是全部——是分批回来的。</p>\n<p>第一批：举报的事查清楚了。那个"社区权益保护联盟"确实是空壳，注册地在一个人去楼空的写字楼，法人代表是陆承业的一个远亲。但举报材料本身写得很专业——不是陆承业自己能写出来的，他找了律师团队起草，每个条款都卡在"举报不等于诬告"的法律灰区里。</p>\n<p>"也就是说，即使我们证明他在背后操纵，举报本身在程序上不一定违法。"周律师分析道，"举报是公民权利。他可以说自己\'有合理怀疑\'。"</p>\n<p>"那施工停了呢？"陆峥寒问。</p>\n<p>"停了。"林舟脸色不好看，"住建部门受理了举报，要求施工方配合调查。虽然我们的手续齐全，但调查程序走完需要十个工作日——正好卡在三月落成仪式前。"</p>\n<p>"工期延误多久？"</p>\n<p>"乐观估计两周。如果调查过程中对方再搞小动作，可能更长。"</p>\n<p>温叙白的社区图书馆——温怀瑾社区图书馆——计划在三月落成。现在是二月初。两周的延误，加上后续的收尾工作，时间会非常紧。</p>\n<p>第二批：陆承业联系媒体的事。他确实准备在落成仪式前后发"负面报道"，但不是一家——是三家。内容从施工质量到资金来源到"建筑师利用关系获取项目"的暗示，覆盖面很广。</p>\n<p>"三家媒体里有两家是小自媒体，给钱就发。"林舟说，"但第三家是《南方楼市观察》——他们有自己的采编团队，不会完全听陆承业的，但他们的主编和陆承业有私交，至少愿意\'客观报道\'一下。"</p>\n<p>"也就是说，前两家好处理，《南方楼市观察》不好处理。"陆峥寒说。</p>\n<p>"对。给小自媒体发律师函就行，但《南方楼市观察》如果发了\'客观报道\'，我们很难用法律手段要求他们撤稿——因为他们确实有新闻自由。"</p>\n<p>第三批，是最棘手的。</p>\n<p>陆承业还试图拉拢温叙白事务所的一个员工——新招的设计师王磊。但王磊不是立刻拒绝的。</p>\n<p>王磊今年二十六岁，从二线城市来到海城，租住在城中村的一间合租房里，月薪一万二。陆承业的人找到他时，开价五十万——只需要他把事务所内部的"人员动态和项目进度"定期透露出去。不需要偷文件，不需要植入程序，只是"聊聊天"。</p>\n<p>王磊犹豫了三天。</p>\n<p>这三天里他失眠了两个晚上。五十万对他来说不是小数目——那是他四年的工资，够他在老家付一套房的首付。他不是坏人，但他穷。</p>\n<p>第三天晚上，他给陆承业的人回了一条消息：【我需要再想想。】</p>\n<p>第四天早上，他走进温叙白的办公室。</p>\n<p>"温先生，有件事我需要跟您说。"</p>\n<p>他把整件事原原本本说了一遍——包括他犹豫了三天，包括他差点答应。</p>\n<p>温叙白听完，没有立刻说话。</p>\n<p>"你为什么最终没答应？"他问。</p>\n<p>王磊低着头："因为我来这里上班的第一天，您跟我说的那句话。您说：\'建筑是老实人的活，设计图差一根线，楼就歪一分。做人也一样。\'我当时觉得您装腔作势……但这两天我一直在想这句话。"</p>\n<p>温叙白看了他一会儿。</p>\n<p>"王磊，你回去上班。"他说，"这件事不要跟其他同事提。"</p>\n<p>"温先生——"</p>\n<p>"你没有做错什么。"温叙白语气平静，"犹豫不是错。选对了就够了。"</p>\n<p>王磊走后，温叙白让林舟来找了陆峥寒。他没自己来——他说："这是陆家的事，让峥寒自己解决。但我在他身后。"</p>\n<p>陆峥寒听完林舟的转述，沉默了很久。</p>\n<p>"王磊犹豫了三天。"他说。</p>\n<p>"是。"</p>\n<p>"如果他是另一种人——如果那五十万对他来说不是四年的工资，而是四十年的——他可能就答应了。"</p>\n<p>"是。"</p>\n<p>陆峥寒揉了揉眉心。这比他预想的更复杂。大伯不是在搞阴谋——他是在利用系统性的弱点。一个刚入行的年轻设计师，工资不高，没有海城户口，住在城中村——这种人是最容易被收买的。今天拒绝了五十万，明天呢？后天呢？</p>\n<p>"通知法务部，准备三份文件：第一，对陆承业捏造事实、恶意举报的刑事控告；第二，对涉事媒体的不实报道预警函；第三，对陆承业试图收买事务所员工的证据保全。"</p>\n<p>他顿了顿。</p>\n<p>"然后——给祖母打电话。"</p>\n<p>"陆总，您要——"</p>\n<p>"大伯是祖母的儿子。处理他之前，我要先跟祖母说清楚。"</p>\n<p>电话接通后，陆峥寒把事情的来龙去脉原原本本地告诉了陆老夫人。</p>\n<p>电话那头沉默了很久。</p>\n<p>"峥寒。"陆老夫人终于开口，声音疲惫而心痛，"你处理吧。该怎么做就怎么做。"</p>\n<p>"祖母——"</p>\n<p>"承业是我的儿子，但他走错了路，我不能一直护着他。"陆老夫人说，"你做得对。陆氏是你的，叙白的图书馆也是正当合法的。谁也不能破坏。"</p>\n<p>挂了电话，陆峥寒深吸一口气。</p>\n<p>但他知道——"处理"不会像想象中那么干净。举报导致的停工还在走程序，工期在一天天压缩。《南方楼市观察》的报道还没发，不知道会写成什么样。王磊的事虽然证据保全了，但一个被收买未遂的员工留在事务所里，本身就是一道裂缝。</p>\n<p>最后的清算，来了。但不会是一锤定音的痛快——是一场需要耐心的、有来有回的收官。</p>\n<div class="hook">**【本章钩子：陆承业最后反扑——恶意举报导致停工十天、三家媒体准备负面报道、收买事务所员工（犹豫三天才拒绝）。温叙白一句"我在他身后"给了陆峥寒力量，但这场收官远比预想复杂：工期在压缩、媒体不确定、内部有了裂缝。终极对决，不是碾压——是耐心……】**</div>\n'},
  {title:'第104章 终极对决，收官之战', vol:3, html:'<p>陆峥寒的反击，不是雷霆万钧的一击——是一场分步骤的、有来有回的收官。</p>\n<p>第一步：公开透明。</p>\n<p>陆峥寒让施工方主动邀请第三方质检机构对社区图书馆工地进行全面检测。但这需要时间——检测机构排期、现场取样、实验室分析、报告撰写，前后花了五天。</p>\n<p>五天里，工地依然停着。每停一天，温叙白的眉头就皱紧一分。</p>\n<p>检测报告出来的那天，陆峥寒第一时间把它发给了住建部门。报告显示：施工质量全部达标，手续齐全，不存在任何违规问题。</p>\n<p>举报材料中的"问题照片"被证实是角度误导——拍摄者刻意选取了施工过程中的临时状态，配上误导性文字，制造"违规施工"的假象。</p>\n<p>住建部门在收到报告后的第三个工作日撤销了停工令。但此时已经停工八天了——加上重新组织施工队伍进场的时间，实际延误超过十天。</p>\n<p>温叙白站在工地前，看着重新运转的塔吊，没有说话。</p>\n<p>"叙白——"陆峥寒走到他身边。</p>\n<p>"没事。"温叙白说，"十天，挤得回来。我重新排了施工节点，把后期的并行工序压缩了。"</p>\n<p>"你加班了？"</p>\n<p>"排个进度表而已。"温叙白语气平淡，但眼底有淡淡的疲色——他昨晚排到凌晨三点。</p>\n<p>第二步：法律反击。</p>\n<p>陆氏法务部正式向公安机关提交了对陆承业的刑事控告——捏造事实、恶意举报、扰乱企业生产经营秩序。同时，对两家小自媒体发出了律师函。</p>\n<p>但《南方楼市观察》不好处理。他们确实在陆承业的授意下准备了一篇报道，但措辞极其老练——通篇没有直接指控，全是"有市民反映""有知情人士透露""记者将持续关注"这类安全表述。律师看过后摇头："这个很难告。他们没有说任何可以直接被证伪的话。"</p>\n<p>"那就不告。"陆峥寒说，"约他们主编吃饭。"</p>\n<p>林舟愣了："约吃饭？"</p>\n<p>"正面回应比律师函有效。我亲自接受他们的采访，把检测报告、施工许可证、资金来源全部公开。他想\'客观报道\'，那我就给他一个\'客观\'的事实基础——让他写出来的报道即使不偏向我们，也偏向不了大伯。"</p>\n<p>《南方楼市观察》的主编没想到陆峥寒会主动接受采访。采访那天，陆峥寒带了完整的文件原件，逐一展示，逐条解释。主编是个四十多岁的老媒体人，问的问题很尖锐："陆总，有人说您用家族权力打压大股东，您怎么回应？"</p>\n<p>"我没有打压任何人。"陆峥寒说，"陆承业的表决权被暂停，是因为他的行为涉嫌违法——商业间谍、窃取商业机密、恶意举报。这些都有司法机关的立案通知书为证。如果这叫\'打压\'，那法律本身就是打压。"</p>\n<p>报道发出来后，措辞确实没有偏向陆承业——但也没有完全偏向陆峥寒。通篇是"双方各执一词"的中立调性。不过，对陆峥寒来说，中立就够了——因为中立意味着陆承业的一方失去了舆论阵地。</p>\n<p>第三步：<span class="annot" data-tip="从锅底抽掉柴火，比喻从根本上解决问题">釜底抽薪</span>。</p>\n<p>这一步是最慢的，也是最致命的。</p>\n<p>陆峥寒查到，陆承业用来运作这些事的资金，来自他在表决权被暂停前紧急质押的陆氏股份所得——但根据董事会决议，陆承业的表决权虽被暂停，股份本身仍在冻结期内。质押冻结期内的股份，涉嫌违反公司章程和证券法相关规定。</p>\n<p>这一条，把陆承业从"商业纠纷"拉到了"涉嫌经济犯罪"的层面。</p>\n<p>但取证需要时间。周律师团队花了将近两周，才拿到质押交易的完整银行流水和证券登记记录。</p>\n<p>两周。这两周里，陆承业并没有闲着——他通过中间人试图把部分资金转移到境外账户，但被陆峥寒提前布置的资产保全措施拦住了。</p>\n<p>"他在挣扎。"林舟说，"像只困在笼子里的老鼠。"</p>\n<p>"不要小看困兽。"陆峥寒说，"困兽最危险。"</p>\n<p>果然——在资产转移被拦后，陆承业做了一件出乎所有人意料的事：他去找了媒体。</p>\n<p>不是之前那几家小媒体，也不是《南方楼市观察》——他直接联系了一家全国性财经频道的调查记者，声称自己"是家族权力斗争的受害者"，并提供了大量经过筛选和加工的"内部信息"。</p>\n<p>这招很狠。因为它不再是商业纠纷——它变成了一个"豪门恩怨"的故事，有流量、有看点、有情绪共鸣。一旦全国性媒体介入，舆论场就会从"海城商界"扩展到"全国观众"。</p>\n<p>陆峥寒在看到新闻预告的当晚，罕见地失眠了。</p>\n<p>温叙白察觉到了。他没问——只是把一杯热牛奶放在了陆峥寒的床头柜上。</p>\n<p>"叙白。"陆峥寒在黑暗中说。</p>\n<p>"嗯。"</p>\n<p>"如果大伯真的把这件事闹到全国——陆氏的声誉会受损。不是股价跌几个点的问题，是品牌形象的问题。而品牌形象一旦受损，影响的是所有和陆氏合作的人——包括你。"</p>\n<p>温叙白沉默了几秒。</p>\n<p>"那就在他闹之前，把事情结了。"</p>\n<p>"怎么结？证据链最后一环还没闭合。"</p>\n<p>"不需要等证据链闭合。"温叙白说，"你需要的是让大伯自己停下来——不是因为你打败了他，是因为他自己撑不住了。"</p>\n<p>"怎么做？"</p>\n<p>"找陆老夫人。"温叙白说，"她是唯一能让大伯停下来的人。不是因为她的权威——而是因为大伯心里最在意的，从来不是陆氏，是母亲的认可。他争了二十年，争的不是一个董事会的位子——是母亲一句\'你才是对的\'。"</p>\n<p>陆峥寒在黑暗中转头看向温叙白。</p>\n<p>"你怎么知道？"</p>\n<p>"因为我也有洁癖。"温叙白说，"洁癖的本质不是怕脏——是不能忍受\'不在掌控中\'的感觉。大伯的执念也是一种\'洁癖\'——他受不了母亲选了别人。这种人，法律打不疼他，舆论也打不疼他。只有母亲的话能让他停下来。"</p>\n<p>第二天，陆峥寒再次去找了陆老夫人。</p>\n<p>这一次，他没有谈证据、法律和商业——他谈的是人。</p>\n<p>"祖母，大伯要上全国财经频道。"</p>\n<p>陆老夫人的手抖了一下。</p>\n<p>"他说自己是家族权力斗争的受害者。"陆峥寒说，"如果节目播出，陆氏的声誉会受损。但更重要的——大伯会在全国观众面前把陆家的家事抖出来。您一辈子最看重的\'陆家的体面\'，就没了。"</p>\n<p>陆老夫人闭上眼，久久没有说话。</p>\n<p>"峥寒。"她终于开口，声音苍老而疲惫，"你让我跟他谈。"</p>\n<p>那天晚上，陆老夫人给陆承业打了最后一通电话。</p>\n<p>没有人知道她在电话里说了什么。只知道那通电话打了四十分钟，最后陆老夫人挂电话时，手抖得几乎拿不住手机。</p>\n<p>第二天，陆承业撤回了对财经频道的"爆料"。他没有道歉，没有声明——只是默默撤了。</p>\n<p>又过了三天，公安机关正式立案调查。那两家小自媒体在收到律师函后撤了稿。《南方楼市观察》的报道发了——如陆峥寒所料，措辞中立，没有偏向任何一方。</p>\n<p>陆承业在得知公安机关立案的消息后，瘫坐在家里。</p>\n<p>"完了。"他对着电话那头的人说，声音嘶哑。</p>\n<p>电话是陆老夫人打来的。</p>\n<p>"承业，公安机关立案了。"陆老夫人的声音带着深深的疲惫，"你这次做的事，我保不了你了。"</p>\n<p>"妈——"</p>\n<p>"你不该去碰那个孩子的图书馆。"陆老夫人说，"那是叙白爷爷的遗愿，是他的命。你碰了，就是碰了峥寒的底线。"</p>\n<p>陆承业沉默了。</p>\n<p>"你走吧。"陆老夫人说，"该承担的法律责任你自己承担。以后——陆家的事，你不用再管了。"</p>\n<p>电话挂断了。</p>\n<p>陆承业坐在空荡荡的客厅里，看着手机屏幕发呆。</p>\n<p>客厅墙上挂着陆鹤鸣的遗像。照片里的父亲目光如炬，和记忆中一模一样——那种目光，小时候让他害怕，长大后让他不服，到了中年让他怨恨，如今只剩下一片空茫。</p>\n<p>他输了。输得彻彻底底。</p>\n<p>不是输给陆峥寒的手段，而是输给自己的贪婪——他本可以安安稳稳地当一个旁系股东，拿着分红过好日子。但他偏要争、偏要抢，最终把自己推进了深渊。</p>\n<p>他想起二十年前父亲选弟弟接手陆氏那天，他蹲在老宅后院的桂花树下抽烟，母亲走过来问他怎么了。他说："没什么，爸把公司给了老二。"母亲叹了口气，拍拍他的肩说："你爸看人准，你就别争了。"</p>\n<p>他嘴上说"不争了"，心里那口气却从来没咽下去过。</p>\n<p>二十年。</p>\n<p>他争了二十年，到头来什么都没争到，反而把自己争进了看守所。</p>\n<p>如果他当初真的咽下那口气，安安心心做他的旁系股东——以陆氏这些年的增长，他的分红恐怕比他折腾二十年赚的所有钱加起来都多。</p>\n<p>但人生没有如果。</p>\n<p>一周后，陆承业被公安机关依法采取强制措施。</p>\n<p>消息传出后，海城商界的反应不是一片哗然——而是沉默。</p>\n<p>这种沉默比哗然更耐人寻味。</p>\n<p>有人觉得陆峥寒做得对——违法就是违法，家人也不例外。但也有人在私下嘀咕："到底是狠啊。大伯啊，说抓就抓了。"还有几个人摇摇头说："不过也怪陆承业自己，碰什么不好，碰人家的图书馆。"</p>\n<p>没有非黑即白的舆论审判。有的只是一个复杂的事实：一个商人因为贪婪越了线，最终被法律追责。至于"该不该"和"值不值"——每个人心里都有自己的尺子。</p>\n<p>陆峥寒坐在办公室里，看着新闻推送，表情平静。</p>\n<p>"陆总，结束了。"林舟走进来，"陆承业已经被正式批捕。恒盛那边也传来消息——赵恒主动联系了我们，表示愿意和解。"</p>\n<p>"和解条件呢？"</p>\n<p>"全部赔偿之前的损失，公开道歉，承诺不再从事任何针对陆氏和相关方的不正当竞争行为。"林舟顿了顿，"而且他说——他以后再也不碰和陆氏相关的任何事了。"</p>\n<p>赵恒确实想通了。但更准确地说，他是被逼到墙角后想通的。</p>\n<p>恒盛的状况在商业间谍案曝光后急转直下。银行收了两成授信额度，两个核心项目的合作方提出重新谈判条款，股价从年内高点跌了将近三成。海外公司反咬恒盛索赔的金额，几乎等于恒盛半年的利润。</p>\n<p>赵恒在那个阶段做了两个选择。</p>\n<p>第一个是理性的：止损。主动联系陆氏和解，赔偿损失，公开道歉——用最小的代价换取最大的脱身。</p>\n<p>第二个是感性的：他去了一趟父亲赵德厚在郊外的墓地。</p>\n<p>他蹲在墓碑前抽了半包烟，最后把烟头摁灭在石阶上，对着墓碑说了一句话：</p>\n<p>"爸，你说得对，陆家确实狠。但不是狠在手段上——是狠在他们永远比你清醒。你输给他们是因为不甘心，我输给他们也是因为不甘心。区别是——我想通了，你没有。"</p>\n<p>他站起来，拍了拍膝盖上的灰土。二十多年的执念，在这一刻终于放下了。</p>\n<p>不是原谅了陆家，是放过自己。恒盛不能再折腾了，再折腾下去连老本都要赔进去。</p>\n<p>"告诉赵恒，和解可以，条件不变：公开道歉，赔偿全部损失，承诺不再从事任何不正当竞争。"陆峥寒说，"但加一条——恒盛未来三年内不得参与滨水新区相关项目的任何投标。"</p>\n<p>"明白。"</p>\n<p>林舟走后，陆峥寒拿起手机，给温叙白发了一条消息：</p>\n<p>【结束了。全部结束了。】</p>\n<p>三秒后，温叙白回复：【我知道了。今晚回家做饭。】</p>\n<p>【你做？】</p>\n<p>【嗯。庆祝。】</p>\n<p>陆峥寒笑了——温叙白主动做饭，说明他心情很好。</p>\n<p>那天晚上，温叙白做了四菜一汤。卖相依然一般，味道依然普通，但陆峥寒吃得很开心。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"以后不会有这些乱七八糟的事了。"</p>\n<p>"嗯。"</p>\n<p>"大伯的事处理完了，恒盛也认输了。以后——"</p>\n<p>"以后就好好过日子。"温叙白打断他，"你做你的霸总，我做我的建筑。"</p>\n<p>"就这样？"</p>\n<p>"就这样。"</p>\n<p>陆峥寒看着他，忽然笑了。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你说的\'好好过日子\'——包括结婚吗？"</p>\n<p>温叙白夹菜的手顿了一下，耳尖微红。</p>\n<p>"吃饭。"他说。</p>\n<p>"你不回答——"</p>\n<p>"吃饭。"</p>\n<p>陆峥寒笑着不再追问。</p>\n<p>但他看到了——温叙白的嘴角，弯了。</p>\n<p>最后的反派已经倒下。但不是一锤定音的碾压——是一场耗时长久的收官，有停工延误、有舆论拉锯、有家族撕裂的阵痛。</p>\n<p>所有的障碍都已清除。前路再无阴霾——但路上留下的坑洼和裂痕，需要时间慢慢填平。</p>\n<p>接下来，只剩下他们两个人的故事——最甜蜜、最温暖的结局，正在前方等候。</p>\n<div class="hook">**【本章钩子：终极对决收官——不是三天的碾压，而是数周的拉锯。施工停了八天、媒体攻防有来有回、陆承业差点闹上全国财经频道。最终不是法律打败了他——是母亲的一通电话。赵恒在父亲墓前放下了二十年的执念。所有的障碍清除了，但路上留下的裂痕还在。第四卷即将开启——求婚、婚礼、余生……全书最甜的终章即将上演！】**</div>\n'},
  {title:'第105章 第三卷终章：风雨同舟，偏爱无疆', vol:3, html:'<p>三月。</p>\n<p>海城的春天来得安静而温柔。</p>\n<p>温怀瑾社区图书馆落成了。</p>\n<p>落成仪式定在三月十五日——温怀瑾的生日。</p>\n<p>那天早上，温叙白穿了一件白衬衫——不是特意挑的，但陆峥寒看到他时，说了一句："跟城东图书馆开幕那天一样。"</p>\n<p>"你记得那天我穿什么？"</p>\n<p>"我记得你所有样子。"</p>\n<p>落成仪式在图书馆门口举行。</p>\n<p>来的人不多——社区居民、建筑界的几位朋友、还有温叙白的父母。温崇远和苏敏华特地从国外赶回来参加。</p>\n<p>图书馆不大，但每一处都精心设计过。温叙白用他爷爷的设计理念作为基底，融入了现代建筑语言——自然光线、温暖材质、开放空间。</p>\n<p>温崇远站在图书馆门口，看着门楣上"温怀瑾社区图书馆"几个字，沉默了很久。</p>\n<p>"叙白。"他开口，声音有些哑。</p>\n<p>"爸。"</p>\n<p>"你爷爷——会很骄傲。"</p>\n<p>温叙白看着那几个字，鼻子微酸。</p>\n<p>"嗯。"</p>\n<p>陆峥寒站在他身后，没有说话。这是温叙白的时刻——属于他和爷爷的。</p>\n<p>仪式上，温叙白说了几句话。</p>\n<p>"这座图书馆是以我爷爷温怀瑾先生的名字命名的。他是一位建筑师，生前一直梦想设计一座完美的社区图书馆。他没能完成，但他的理念一直在我的心里。"</p>\n<p>"今天这座图书馆落成了。它不是他那张未完成的图纸的延续，而是用我自己的方式完成的他的梦想。"</p>\n<p>"我希望这个空间能像他希望的那样——温暖的、开放的、属于社区的。让每一个走进来的人，都能找到属于自己的角落。"</p>\n<p>他微微低头："爷爷，画完了。"</p>\n<p>台下响起了掌声。</p>\n<p>苏敏华在人群中擦了擦眼角。温崇远揽住她的肩。</p>\n<p>仪式结束后，温叙白带着父母参观了图书馆的内部。</p>\n<p>走到儿童区时，他停下了脚步。</p>\n<p>儿童区的墙壁上，画着一幅壁画——是一棵大树，树下有一老一少两个身影。老人弯着腰，在教孩子画图。</p>\n<p>"这是——"温崇远看着壁画。</p>\n<p>"我画的。"温叙白说，"爷爷教我画图的样子。"</p>\n<p>温崇远看着那幅壁画，眼眶终于红了。</p>\n<p>他拍了拍温叙白的肩膀，没有说话。</p>\n<p>有些情感，不需要语言。</p>\n<p>参观结束后，所有人离开了。图书馆安静下来。</p>\n<p>温叙白独自坐在中庭的长椅上，仰头看着天窗洒下来的光。</p>\n<p>陆峥寒走进来，在他身边坐下。</p>\n<p>"累吗？"</p>\n<p>"不累。"</p>\n<p>"开心吗？"</p>\n<p>温叙白转头看他，眼底有微光在闪烁。</p>\n<p>"开心。"他说，"峥寒，谢谢你。"</p>\n<p>"谢什么？"</p>\n<p>"谢谢你让这座图书馆成为现实。"</p>\n<p>"我只是出了点钱和找了个地。"陆峥寒说，"设计是你的，梦想是你的，完成它的也是你。"</p>\n<p>"但没有你，这座图书馆不会存在。"温叙白认真地说，"你让我明白了一件事——有些梦想，需要有人陪你一起完成。一个人画不完的图，两个人可以。"</p>\n<p>陆峥寒看着他，胸口像是被什么温热的东西填满了，堵在喉咙口，说不出话来。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你知道我什么时候决定要向你求婚的吗？"</p>\n<p>温叙白微怔。</p>\n<p>"就是你在东京颁奖典礼上说\'爷爷，画完了\'的那一刻。"陆峥寒看着他，"那个瞬间，我就知道——我要跟这个人过一辈子。"</p>\n<p>温叙白看着他，说不出话。</p>\n<p>"所以——"陆峥寒站起身，后退一步，然后单膝跪了下去。</p>\n<p>温叙白的呼吸停了。</p>\n<p>"温叙白。"陆峥寒打开盒子，里面是一对素圈戒指，简洁而温润，"你说过，不管什么时候、怎么求，你的答案不会变。"</p>\n<p>"所以我现在问你——你愿意和我过一辈子吗？"</p>\n<p>图书馆里很安静，阳光从天窗洒下来，在两人之间画出一道温暖的光带。</p>\n<p>温叙白看着那对戒指，看着陆峥寒的眼睛。</p>\n<p>然后他笑了。</p>\n<p>"陆峥寒。"他说，声音清冷但温柔。</p>\n<p>"你选的地方很好。"</p>\n<p>"你选的时间也很好。"</p>\n<p>"爷爷在这里。"</p>\n<p>"所以——"</p>\n<p>"我愿意。"</p>\n<p>阳光洒满中庭，两个人的影子在光中重叠在一起。</p>\n<p>陆峥寒笑得像个孩子，手微微颤抖着，把戒指戴在温叙白的手指上。</p>\n<p>温叙白也拿起另一枚，戴在陆峥寒的手上。</p>\n<p>两枚素圈，在阳光下闪着温润的光。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"爷爷一定很高兴。"</p>\n<p>"嗯。"陆峥寒握住他的手，"他一定很高兴。"</p>\n<p>第三卷的故事，到此圆满。</p>\n<p>风雨同舟，偏爱无疆。</p>\n<p>第四卷即将开启——婚礼、蜜月、日常、余生的甜蜜终章，正在前方等候。</p>\n<div class="hook">**【本章钩子（第三卷终章）：温怀瑾社区图书馆落成，爷爷的梦想终于完成。而在图书馆的阳光中，陆峥寒单膝跪地——"你愿意和我过一辈子吗？"一句"我愿意"，为第三卷画上了最完美的句号。第四卷即将开启：婚礼名场面、蜜月旅行、婚后日常、全书终章——最甜蜜的终章，正在前方等候！】**</div>\n'},
  {title:'第106章 求婚余韵，全网祝福', vol:4, html:'<p>温怀瑾社区图书馆的落成仪式视频，在网上疯传了。</p>\n<p>不是因为图书馆本身——虽然建筑界对此高度关注——而是因为视频最后那一段。</p>\n<p>有人在仪式结束后偷偷拍到了陆峥寒在图书馆中庭单膝跪地求婚的画面。画面不太清晰，但能清楚看到温叙白点头说"我愿意"的瞬间。</p>\n<p>视频被传到网上后，热搜直接爆炸了。</p>\n<p>#陆峥寒温叙白求婚# 阅读量半小时破五亿。</p>\n<p>#图书馆求婚# #温怀瑾社区图书馆# #他愿意# #蓄谋七年终于求婚# ——相关话题霸占了热搜榜前十。</p>\n<p>评论区彻底沦陷：</p>\n<p>"在爷爷的图书馆里求婚！！！陆峥寒你是魔鬼吗！！太会了！"</p>\n<p>"七年的蓄谋，在阳光洒满图书馆的中庭单膝跪地——这是小说里才有的场景吧？"</p>\n<p>"温叙白点头的那一下我看了二十遍，眼泪都出来了。"</p>\n<p>"\'我愿意\'三个字，等了七年。从暧昧到确认到求婚，这条路走得太值得了。"</p>\n<p>"有人注意到陆峥寒的手在抖吗？霸总求婚也会紧张啊哈哈哈哈。"</p>\n<p>"请尽快结婚！全网等着随份子！"</p>\n<p>陆峥寒是在办公室刷到视频的。</p>\n<p>"谁拍的？"他问林舟。</p>\n<p>"应该是社区居民。当时仪式结束了，只有您和温先生在里面。"</p>\n<p>"那应该没有拍到叙白的正脸吧？"</p>\n<p>"没有，只有侧影和背影。"林舟说，"但那个点头的瞬间拍到了。"</p>\n<p>陆峥寒看着视频里温叙白点头说"我愿意"的画面，嘴角忍不住弯起来。</p>\n<p>他拿起手机给温叙白发消息：</p>\n<p>【叙白，我们上热搜了。】</p>\n<p>【看到了。】</p>\n<p>【评论区都在催我们结婚。】</p>\n<p>【那就结。】</p>\n<p>陆峥寒看着这两个字，心跳加速。</p>\n<p>虽然已经求过婚了，但每次看到温叙白主动说"结"字，他还是会像第一次一样心动。</p>\n<p>【什么时候？】</p>\n<p>【你定。】</p>\n<p>【我是认真的，叙白。】</p>\n<p>【我也是。】</p>\n<p>陆峥寒放下手机，靠在椅背上，笑着叹了口气。</p>\n<p>他拿起电话："林舟，帮我联系婚礼策划公司。最好的那种。"</p>\n<p>"陆总，您终于——"</p>\n<p>"嗯。该办正事了。"</p>\n<p>当天晚上，两人坐在私宅的阳台上。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你想办什么样的婚礼？"</p>\n<p>"你想要什么样的？"陆峥寒反问。</p>\n<p>温叙白想了想："简单的。不要太张扬。"</p>\n<p>"在图书馆办？"陆峥寒提议。</p>\n<p>温叙白转头看他，眼底有微光闪动。</p>\n<p>"你认真的？"</p>\n<p>"在城东图书馆——我们故事开始的地方。"陆峥寒握住他的手，"你愿意吗？"</p>\n<p>温叙白看着他，很久之后，轻轻点了点头。</p>\n<p>"好。"</p>\n<div class="hook">**【本章钩子：求婚视频全网疯传，热搜炸裂！温叙白一句"那就结"让霸总心花怒放。婚礼地点选定城东图书馆——故事开始的地方。第四卷的甜蜜风暴，正式开启！】**</div>\n'},
  {title:'第107章 婚礼筹备，甜蜜兵荒', vol:4, html:'<p>婚礼的筹备工作，比陆峥寒预想的要复杂得多。</p>\n<p>首先是场地。城东图书馆是公共建筑，不能完全封闭使用。陆峥寒和社区沟通后，决定婚礼安排在图书馆闭馆日的下午——既不影响居民使用，又能在有特殊意义的地方举办仪式。</p>\n<p>其次是宾客名单。陆峥寒本来说"请五十个人就够了"，但陆瑶拿出了她自己整理的名单——三百多人。</p>\n<p>"瑶瑶，我们是结婚，不是开商会。"陆峥寒看着名单头大。</p>\n<p>"哥，你官宣的时候全网都祝福了，现在结婚总得让圈子里的人参加吧？而且奶奶的老朋友、叙白哥的导师同学、事务所的合作伙伴——"</p>\n<p>"太多了。"</p>\n<p>"那你说删谁？"</p>\n<p>陆峥寒删不掉——每个人都是温叙白生命中重要的人。</p>\n<p>最后折中：仪式在城东图书馆举行，只邀请至亲好友，约六十人。婚宴在陆家老宅举办，规模稍大，约一百五十人。</p>\n<p>"叙白，你那边有什么要加的吗？"陆峥寒问。</p>\n<p>"没有。"温叙白说，"你安排就行。"</p>\n<p>"你不管？"</p>\n<p>"我管设计。"温叙白说，"婚礼的场地布置，我来设计。"</p>\n<p>陆峥寒一愣——他没想到温叙白会主动参与。</p>\n<p>"你确定？你不是很烦这种事吗？"</p>\n<p>"这是我们的婚礼。"温叙白看了他一眼，"我希望它是最好的。"</p>\n<p>陆峥寒看着他，忽然觉得心口暖得发烫。</p>\n<p>接下来的一个月，两人分头忙碌。</p>\n<p>陆峥寒负责婚礼的后勤——策划公司、婚宴菜单、宾客住宿、交通安排。他甚至建了一个项目管理文档，用甘特图跟踪进度。林舟看了之后说："陆总，您管理陆氏都没这么仔细。"</p>\n<p>温叙白负责场地的设计——城东图书馆的内部空间他最熟悉，他花了一周时间画了一套完整的布置方案。方案包括灯光设计、花艺布置、动线规划、以及一个特别设计的小型装置艺术——用光线在图书馆中庭投射出两人的名字缩写。</p>\n<p>"你这是在用建筑师的方式办婚礼。"陆峥寒看到方案时说。</p>\n<p>"专业对口。"温叙白面无表情。</p>\n<p>陆瑶作为伴娘，全程参与筹备。她主要负责——制造混乱和提出离谱建议。</p>\n<p>"哥，要不要在婚礼上放无人机表演？"</p>\n<p>"不要。"</p>\n<p>"那放烟火？"</p>\n<p>"在图书馆放烟火？"</p>\n<p>"也是。那——"</p>\n<p>"瑶瑶，你帮我去确认花材就行了。"陆峥寒把她支走了。</p>\n<p>陆瑶撅着嘴走了，走之前还不忘叮嘱："伴郎的衣服我帮你选！"</p>\n<p>"伴郎是谁？"温叙白问。</p>\n<p>"林舟。"陆峥寒说。</p>\n<p>"陆瑶会同意？"</p>\n<p>"她巴不得。"</p>\n<p>温叙白看了他一眼，没有追问。</p>\n<p>筹备过程中最有趣的一件事——是温叙白的母亲苏敏华从国外寄来了一个包裹。</p>\n<p>包裹里是一套手工缝制的喜被——苏敏华亲手做的，用的是温叙白小时候最喜欢的蓝色布料。</p>\n<p>"你妈说，虽然你们是两个男生，但该有的规矩不能少。"陆峥寒转述苏敏华电话里的话，"喜被是她一针一线缝的。"</p>\n<p>温叙白摸着那床喜被，手指微微发颤。</p>\n<p>"她缝了多久？"</p>\n<p>"三个月。"</p>\n<p>温叙白沉默了很久，然后轻声说："给她打电话。"</p>\n<p>电话接通后，温叙白说了一句话："妈，谢谢。"</p>\n<p>苏敏华在电话那头笑了："你开心就好。"</p>\n<p>筹备工作在忙碌而甜蜜的氛围中推进。</p>\n<p>虽然兵荒马乱，但每一步都充满了期待。</p>\n<div class="hook">**【本章钩子：婚礼筹备启动！陆峥寒用甘特图管理婚礼进度，温叙白亲手设计场地布置。苏敏华的三月手缝喜被令人泪目。一切都在向着最完美的婚礼前进……】**</div>\n'},
  {title:'第108章 婚纱西装，试装心动', vol:4, html:'<p>婚礼前两周，两人去试结婚礼服。</p>\n<p>陆峥寒的西装是定制的——意大利手工裁缝飞到海城量体，深灰色三件套，面料是顶级的羊毛混丝，剪裁利落，气场十足。</p>\n<p>"很好看。"温叙白站在试衣间外，看陆峥寒从帘子后面走出来。</p>\n<p>"就\'很好看\'？"陆峥寒挑眉。</p>\n<p>"非常好看。"</p>\n<p>"你今天很大方。"</p>\n<p>"我一直很大方。"</p>\n<p>陆峥寒对着镜子整理袖口，嘴角弯着。</p>\n<p>然后轮到温叙白。</p>\n<p>温叙白的礼服也是定制的——白色西装，简洁干净，面料轻柔，衬得他清冷如月。</p>\n<p>他从试衣间走出来的时候，陆峥寒的呼吸停了一拍。</p>\n<p>白色西装贴合着温叙白清瘦的身材，领口微微敞开，露出修长的颈线。他站在灯光下，清冷的面容被柔光照亮，像是画里走出来的人。</p>\n<p>"叙白——"陆峥寒看着他，一时忘了说话。</p>\n<p>"不合适？"温叙白微微皱眉。</p>\n<p>"不。"陆峥寒走近一步，"太合适了。"</p>\n<p>他伸手帮温叙白整理了一下领口，手指在他颈侧停留了一秒。</p>\n<p>"你穿白色——"陆峥寒的声音低了下去，"很好看。"</p>\n<p>温叙白看着他，耳尖微微泛红。</p>\n<p>"你不用刻意夸。"</p>\n<p>"我没有刻意。"陆峥寒认真地说，"叙白，你是我见过最好看的人。穿什么都好看，但穿白色——"</p>\n<p>"什么？"</p>\n<p>"让我想立刻跟你结婚。"</p>\n<p>温叙白的耳尖彻底红了。</p>\n<p>"试衣服呢。"他别开脸。</p>\n<p>"嗯，试衣服。"陆峥寒笑了，但目光一直没有离开他。</p>\n<p>裁缝在旁边记录着需要调整的尺寸，忍不住微笑——这两位的甜蜜，整个店都能感受到。</p>\n<p>试完礼服后，两人去取了婚戒。</p>\n<p>婚戒是陆峥寒找人定制的——素圈白金戒指，内壁刻着两行小字。</p>\n<p>陆峥寒的那枚刻着：WXB，我的偏爱。</p>\n<p>温叙白的那枚刻着：LZH，我的归处。</p>\n<p>温叙白看着内壁的刻字，沉默了几秒。</p>\n<p>"什么时候想的？"</p>\n<p>"求婚那天。"</p>\n<p>"你准备得很充分。"</p>\n<p>"七年都等了，婚戒当然要认真。"</p>\n<p>温叙白看着他，忽然伸手，把戒指套在了陆峥寒的无名指上——试戴。</p>\n<p>"合适。"他说。</p>\n<p>陆峥寒低头看着手上的戒指，心口暖得发烫。</p>\n<p>"等婚礼那天再正式戴。"温叙白把戒指取下来，放回盒子里。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你今天主动给我戴戒指了。"</p>\n<p>"试戴而已。"</p>\n<p>"在我心里，这就是戴了。"</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>"你越来越不像霸总了。"</p>\n<p>"在你面前，我从来不是霸总。"陆峥寒握住他的手，"我是你的峥寒。"</p>\n<p>走出婚戒店的时候，海城正下着小雨。</p>\n<p>陆峥寒撑伞，温叙白走在伞下。两人并肩走在雨中的街道上，像所有普通的恋人一样。</p>\n<p>但他们的不普通在于——从蓄谋七年初遇到此刻并肩而行，这条路他们走了太久太久。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"我期待婚礼。"温叙白轻声说。</p>\n<p>陆峥寒偏头看他，在雨声中笑了。</p>\n<p>"我也是。"</p>\n<div class="hook">**【本章钩子：试装名场面！白色西装的温叙白让霸总心跳停了一拍，婚戒刻字"我的偏爱/我的归处"甜到齁。婚礼倒计时两周，最甜蜜的兵荒马乱即将到来……】**</div>\n'},
  {title:'第109章 请柬风波，圈层震动', vol:4, html:'<p>婚礼请柬是温叙白设计的。</p>\n<p>他画了一版极简风格的请柬——白卡纸上用烫银工艺印着城东图书馆的轮廓线稿，内页是两人的名字和婚礼日期，没有多余装饰。</p>\n<p>"太素了。"陆瑶评价。</p>\n<p>"我觉得很好。"陆峥寒说。</p>\n<p>"你当然觉得好，你看叙白哥什么都说好。"</p>\n<p>"这叫情人眼里出西施。"</p>\n<p>"恶心。"陆瑶翻了个白眼，但还是在请柬设计稿上签了字。</p>\n<p>请柬发出后，在海城圈子里引起了不小的震动。</p>\n<p>不是因为请柬本身——而是因为请柬上的地点。</p>\n<p>城东图书馆。</p>\n<p>所有人都在议论：陆峥寒和温叙白要在社区图书馆办婚礼？</p>\n<p>"不是在五星级酒店？"</p>\n<p>"不是在私人庄园？"</p>\n<p>"在图书馆？为什么？"</p>\n<p>答案很快在网上传开了——因为城东图书馆是温叙白设计的第一个作品，也是陆峥寒七年前走进的那个"安全港湾"。他们的故事，从那座建筑开始。</p>\n<p>这个浪漫到极致的理由，让全网再次沸腾。</p>\n<p>"天哪，在故事开始的地方办婚礼，这也太浪漫了吧？"</p>\n<p>"陆峥寒真的是言情小说男主本主。"</p>\n<p>"温叙白设计的请柬好好看，极简风太高级了。"</p>\n<p>但也有不和谐的声音。</p>\n<p>有人在社交平台上发帖："在社区图书馆办婚礼？这也太掉价了吧？陆氏总裁的排面呢？"</p>\n<p>帖子下面有人反驳："人家愿意，关你什么事？而且图书馆是温叙白设计的，意义比什么五星酒店都大。"</p>\n<p>陆峥寒看到这些议论后，在朋友圈发了一条：</p>\n<p>"婚礼的意义不在于地点有多奢华，而在于它对两个人的意义。城东图书馆是我们故事的起点。在那里开始下一段旅程，是最好的选择。"</p>\n<p>配图是城东图书馆的夜景——暖色灯光从集装箱缝隙中透出，安静而温暖。</p>\n<p>这条朋友圈被截图传到网上后，质疑的声音彻底消失了。</p>\n<p>连最挑剔的八卦博主都承认："陆峥寒和温叙白的爱情，是\'意义大于排面\'的最好诠释。"</p>\n<p>请柬发出的同时，温叙白也收到了一些意外的回复。</p>\n<p>他的导师——一位八十多岁的建筑学教授，在电话里说："叙白，我一定来。你是我教过最好的学生，你的婚礼我怎么能缺席？"</p>\n<p>城东社区的居民代表也来了——他们说，图书馆是他们的"第二个家"，温叙白在那里办婚礼，他们就像嫁儿子一样高兴。</p>\n<p>"叙白啊，我们几个老伙计商量了，婚礼那天我们在图书馆门口摆个茶摊，给来宾们倒茶。"社区的张大爷说。</p>\n<p>温叙白在电话这头笑了："好，谢谢张大爷。"</p>\n<p>所有的回复都到了，只剩一个人——沈知予。</p>\n<p>温叙白给他寄了请柬。</p>\n<p>沈知予收到请柬那天，是一个人坐在出租屋里拆开的。他回海城后没有住原来的公寓，而是在城北租了个小一居，房租便宜，离他新入职的建筑事务所通勤四十分钟。</p>\n<p>请柬是白卡纸烫银工艺，上面印着城东图书馆的轮廓线稿。他认出了那座建筑——集装箱改造，温叙白大学时期的设计，后来成了城东社区的标志。</p>\n<p>他把请柬在手里翻了翻，放在桌上，然后去阳台抽了一根烟。</p>\n<p>他不是不想去。他甚至想过穿什么衣服、带什么礼物、到了现场该站在哪个角落才不尴尬。</p>\n<p>但他最后决定不去。</p>\n<p>不是放不下。是已经放下了——放下了就不必再演"释然"的戏码。他发的那条道歉微博、那次在交流会上的当面道歉，都是真心的。但真心不代表要把自己摆在那个位置上：看着喜欢的人和别人交换戒指，然后在台下微笑鼓掌。</p>\n<p>他做不到那么洒脱。至少现在做不到。</p>\n<p>他掐灭烟，回到屋里，拿起手机，打了一行字：</p>\n<p>【恭喜。那天我有事，可能去不了。但祝你们幸福。】</p>\n<p>想了想，又加了一句：</p>\n<p>【叙白，你值得。】</p>\n<p>发完消息，他把请柬收进了抽屉里。</p>\n<p>温叙白看着这条消息，没有追问。</p>\n<p>他看到了最后那四个字——"叙白，你值得。"——盯着看了两秒，然后退出聊天界面。</p>\n<p>有些人，最好的祝福就是不再出现。</p>\n<p>"沈知予不来了？"陆峥寒问。</p>\n<p>"嗯。"</p>\n<p>"你遗憾吗？"</p>\n<p>"不遗憾。"温叙白说，"他有他的路，我们有我们的。各自安好就好。"</p>\n<p>陆峥寒点了点头，没有再说什么。</p>\n<p>请柬风波平息后，婚礼的脚步更近了。</p>\n<div class="hook">**【本章钩子：请柬发出，全网震动——在社区图书馆办婚礼？陆峥寒一句"意义大于排面"让质疑消声。社区居民的茶摊、导师的到来、沈知予的缺席——每一条线索都是爱的注脚。婚礼倒计时，最后的准备即将完成……】**</div>\n'},
  {title:'第110章 婚前焦虑，陆峥寒紧张', vol:4, html:'<p>婚礼前三天，陆峥寒失眠了。</p>\n<p>不是因为工作——他已经把所有会议推到了婚礼之后。不是因为筹备——所有细节都已到位。</p>\n<p>是因为紧张。</p>\n<p>他躺在黑暗中，看着天花板，脑子里翻来覆去地想：万一戒指戴反了怎么办？万一念誓词时忘词了怎么办？万一叙白临时反悔怎么办？</p>\n<p>"不可能。"他自言自语，"叙白说过，答案不会变。"</p>\n<p>但紧张这种事，不讲道理。</p>\n<p>第二天早上，温叙白发现陆峥寒的眼圈发青。</p>\n<p>"你没睡好？"</p>\n<p>"还好。"</p>\n<p>"你黑眼圈比大伯出事那次还重。"</p>\n<p>"……没那么夸张。"</p>\n<p>"峥寒。"温叙白放下筷子，看着他，"你在紧张？"</p>\n<p>陆峥寒沉默了两秒："有一点。"</p>\n<p>"紧张什么？"</p>\n<p>"怕出错。怕不够好。怕——"</p>\n<p>"怕什么？"</p>\n<p>"怕你到了现场会后悔。"</p>\n<p>温叙白看着他，微怔。</p>\n<p>然后他站起来，走到陆峥寒面前，弯下腰，和他平视。</p>\n<p>"陆峥寒。"他叫了他的全名，声音清冷但认真，"你听好了。"</p>\n<p>"我不会后悔。"</p>\n<p>"从你说\'你愿意嫁给我吗\'的那一刻起，到婚礼那天，到以后的每一天——我都不会后悔。"</p>\n<p>"你不需要完美。你紧张、出错、忘词——都没关系。"</p>\n<p>"因为我要嫁的不是一个完美的霸总。是陆峥寒。"</p>\n<p>"就是你。"</p>\n<p>陆峥寒看着近在咫尺的那双清冷眼睛，忽然觉得鼻子发酸。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你什么时候变得这么会安慰人了？"</p>\n<p>"被你传染的。"温叙白直起身，"吃饭。"</p>\n<p>陆峥寒低头吃饭，但嘴角怎么也压不下去。</p>\n<p>婚礼前两天，陆瑶来私宅帮忙做最后的检查。</p>\n<p>她看到陆峥寒在对着镜子练习念誓词，忍不住笑了："哥，你在背誓词？"</p>\n<p>"不是背。是在想怎么说才好。"</p>\n<p>"你就说心里话不就行了？"</p>\n<p>"心里话太多了，不知道从哪句开始。"</p>\n<p>陆瑶看着他认真的样子，忽然觉得鼻子有点酸。</p>\n<p>"哥。"</p>\n<p>"嗯？"</p>\n<p>"你真的很喜欢叙白哥。"</p>\n<p>"嗯。"</p>\n<p>"他也很喜欢你。"</p>\n<p>"我知道。"</p>\n<p>"那你还紧张什么？"</p>\n<p>陆峥寒看着镜子里的自己，笑了："因为太重要了。越重要的事，越怕出错。"</p>\n<p>陆瑶走过来，拍了拍他的肩："放心吧。叙白哥选了你，就不会后悔。"</p>\n<p>"嗯。"</p>\n<p>婚礼前一晚，陆峥寒又失眠了。</p>\n<p>凌晨两点，他拿起手机，给温叙白发了一条消息——虽然两人明天才会见面，但温叙白今晚住在工作室（按习俗婚前不见面）。</p>\n<p>【叙白，睡不着。】</p>\n<p>两秒后，温叙白回复了：【我也睡不着。】</p>\n<p>陆峥寒看着屏幕，笑了。</p>\n<p>【紧张？】</p>\n<p>【有一点。】</p>\n<p>【你也会紧张？我以为只有我紧张。】</p>\n<p>【我比你更紧张。】</p>\n<p>【为什么？】</p>\n<p>温叙白隔了一分钟才回复：【因为明天开始，我要跟你过一辈子了。】</p>\n<p>陆峥寒看着这条消息，眼眶发热。</p>\n<p>他打了一行字：【一辈子不够。下辈子也要。】</p>\n<p>【不信下辈子。这辈子过好就行。】</p>\n<p>【好。这辈子。】</p>\n<p>【晚安，峥寒。明天见。】</p>\n<p>【晚安，叙白。明天见。】</p>\n<p>陆峥寒放下手机，闭上眼。</p>\n<p>这一次，他终于睡着了。</p>\n<div class="hook">**【本章钩子：婚前焦虑，霸总也失眠！温叙白一句"我要嫁的是你，不是完美的霸总"治愈了一切。婚礼前夜的跨国对话——"一辈子不够""这辈子过好就行"。明天，就是他们最重要的日子……】**</div>\n'},
  {title:'第111章 温叙白安慰，双向奔赴', vol:4, html:'<p>婚礼前一天的最后准备。</p>\n<p>上午，温叙白去城东图书馆做了最后一次场地检查。</p>\n<p>图书馆内部已经被布置成了一个婚礼空间——花艺沿着集装箱的缝隙攀爬，灯光被调整成暖色调，中庭的天窗下放着两把椅子，正对着的是仪式台。</p>\n<p>温叙白站在中庭，仰头看着天窗。</p>\n<p>阳光从天窗洒下来，在地面上画出一个明亮的光圈。那个光圈的位置，正好是他们明天交换戒指的地方。</p>\n<p>"完美。"温叙白轻声说。</p>\n<p>他在图书馆走了一圈，检查了每一个细节——花材的品种和颜色、灯光的亮度和角度、座位的排列和间距、宾客的动线设计。</p>\n<p>全部到位。</p>\n<p>他拿出手机，给陆峥寒发了一张场地的照片。</p>\n<p>【准备好了。】</p>\n<p>三秒后，陆峥寒回：【我这边也准备好了。婚宴菜单确认了，花材到了，宾客的酒店都安排好了。】</p>\n<p>【辛苦了。】</p>\n<p>【不辛苦。为你做事，不叫辛苦。】</p>\n<p>温叙白看着这条消息，嘴角弯了弯。</p>\n<p>下午，温叙白去工作室取了明天的礼服。他试穿了一遍，确认没有问题后，小心翼翼地挂好。</p>\n<p>然后他坐在工作台前，打开了一个笔记本。</p>\n<p>他在写誓词。</p>\n<p>不是陆峥寒那种"想了很久但不知道从哪句开始"的纠结——温叙白写誓词的方式跟他画图一样：先列框架，再填内容。</p>\n<p>框架：</p>\n<p>1. 我们怎么认识的（他蓄谋七年，我一无所知）</p>\n<p>2. 他改变了什么（打破了我的所有底线）</p>\n<p>3. 我想说什么（余生交给他）</p>\n<p>内容：</p>\n<p>温叙白写了一个小时，写了删，删了写，最后只留了一段话。</p>\n<p>他看着那段话，点了点头。</p>\n<p>"够了。"他对自己说。</p>\n<p>傍晚，陆瑶来工作室找他。</p>\n<p>"叙白哥，明天我帮你打理造型！"她精神焕发。</p>\n<p>"不用太复杂。"</p>\n<p>"你放心，保证让陆峥寒看呆。"</p>\n<p>温叙白看了她一眼："他天天看，不会呆。"</p>\n<p>"你今天说话好直。"陆瑶笑了，"是不是因为明天要结婚了，放飞自我了？"</p>\n<p>"可能吧。"温叙白难得地笑了笑。</p>\n<p>陆瑶看着他笑的样子，忽然感慨：从前那个面无表情的清冷美人，现在会笑了、会开玩笑了、会主动表达感情了。这一切都是因为她哥。</p>\n<p>"叙白哥。"</p>\n<p>"嗯？"</p>\n<p>"我哥这辈子最幸运的事，就是遇见了你。"</p>\n<p>温叙白看着她，沉默了两秒。</p>\n<p>"我倒觉得——"他说，"我最幸运的事是遇见了他。"</p>\n<p>陆瑶鼻子一酸，连忙转过身："行了行了，别煽情了，我回去准备明天的东西了。"</p>\n<p>她走到门口，回头说了一句："叙白哥，明天见。"</p>\n<p>"明天见。"</p>\n<p>工作室安静下来。温叙白坐在工作台前，看着明天的礼服和那段誓词。</p>\n<p>明天过后，他就不只是温叙白了。</p>\n<p>他是陆峥寒的丈夫。</p>\n<p>想到这个，他低头笑了。</p>\n<div class="hook">**【本章钩子：婚礼前最后准备！温叙白亲手检查场地每一个细节，写好誓词。陆瑶一句"我哥最幸运的事是遇见了你"，换来温叙白"我最幸运的事是遇见了他"。明天，就是最重要的日子……】**</div>\n'},
  {title:'第112章 单身派对，各自狂欢', vol:4, html:'<p>婚礼前两天的晚上，两人各自举办了单身派对。</p>\n<p>陆峥寒这边——林舟和几个商界朋友在海城顶级的私人会所包了一个包间。</p>\n<p>气氛出乎意料的安静。没有脱衣舞娘，没有疯狂灌酒，只有几个男人坐在一起喝酒聊天。</p>\n<p>"陆总，你明天就结婚了，不紧张？"一个朋友问。</p>\n<p>"紧张。"陆峥寒坦诚地说，"失眠两天了。"</p>\n<p>"正常。我结婚前一晚也没睡着。"</p>\n<p>"你有什么建议吗？"</p>\n<p>"别想太多。到了现场，看到那个人，什么紧张都没了。"</p>\n<p>陆峥寒笑了笑。</p>\n<p>林舟坐在旁边，给他倒了一杯威士忌。</p>\n<p>"陆总。"</p>\n<p>"嗯？"</p>\n<p>"恭喜你。"</p>\n<p>"谢谢。"陆峥寒举杯，"你也该恭喜你自己。"</p>\n<p>"我？"林舟一愣。</p>\n<p>"瑶瑶。"陆峥寒看着他，"你们在一起了。"</p>\n<p>林舟的脸瞬间红了："陆总，您怎么——"</p>\n<p>"我又不瞎。"陆峥寒喝了口酒，"跨年夜在花园里牵手，以为我没看到？"</p>\n<p>林舟低下头："我们……刚在一起。还没公开。"</p>\n<p>"什么时候公开？"</p>\n<p>"等……等您婚礼之后吧。不想抢您风头。"</p>\n<p>"你们不抢风头。"陆峥寒笑了，"瑶瑶能找到幸福，我很高兴。"</p>\n<p>"谢谢陆总。"</p>\n<p>两人碰杯。</p>\n<p>温叙白这边——他的"派对"更安静。</p>\n<p>只有事务所的几个同事和建筑界的朋友，在工作室里吃了顿便饭。</p>\n<p>没有酒——温叙白不喝酒。大家喝的是茶和气泡水。</p>\n<p>"叙白，明天就结婚了，有什么感想？"一个同事问。</p>\n<p>"感想？"温叙白想了想，"感觉时间过得很快。"</p>\n<p>"从什么时候开始跟陆总在一起的？"</p>\n<p>"正式在一起一年多。但他蓄谋了七年。"</p>\n<p>"七年？"所有人都惊讶了。</p>\n<p>"嗯。七年。"温叙白的嘴角弯了弯，"我之前不知道。后来才知道——他七年前走进了我设计的图书馆，然后用了七年时间走到我身边。"</p>\n<p>"这也太浪漫了。"</p>\n<p>"浪漫吗？"温叙白想了想，"当时知道的时候，我觉得有点吓人。"</p>\n<p>"那后来呢？"</p>\n<p>"后来——"温叙白看着手里的茶杯，"后来我觉得，被一个人这样认真地爱着，是很幸运的事。"</p>\n<p>工作室里安静了一瞬，然后所有人都笑了。</p>\n<p>"叙白你变了。"有人说，"以前你从来不谈感情的事。"</p>\n<p>"人总是要变的。"温叙白说，"遇到对的人，就会变。"</p>\n<p>派对结束后，温叙白一个人留在工作室。</p>\n<p>他走到窗前，看着海城的夜景。万家灯火，城市在夜色中安静地呼吸。</p>\n<p>明天这个时候，他就是已婚人士了。</p>\n<p>"陆峥寒的丈夫。"他低声试了试这个称呼，觉得有点奇怪，但不讨厌。</p>\n<p>手机震动了。</p>\n<p>陆峥寒发来消息：【派对结束了？】</p>\n<p>【嗯。你呢？】</p>\n<p>【刚结束。叙白——】</p>\n<p>【嗯？】</p>\n<p>【明天见。】</p>\n<p>【嗯。明天见。】</p>\n<p>温叙白放下手机，最后看了一眼窗外的夜景。</p>\n<p>然后他关了灯，走向卧室。</p>\n<p>最后的独身之夜，安静而平和。</p>\n<p>明天开始，就是新的人生了。</p>\n<div class="hook">**【本章钩子：各自单身派对，各自安静而温暖。陆峥寒在酒杯间知道了林舟和陆瑶的秘密，温叙白在茶香中第一次跟朋友分享七年的故事。"被一个人这样认真地爱着，是很幸运的事"——明天，这份幸运将正式落地……】**</div>\n'},
  {title:'第113章 婚礼前夜，各自不眠', vol:4, html:'<p>婚礼前夜。</p>\n<p>按照习俗，两人分开过夜。陆峥寒住在私宅，温叙白住在工作室。</p>\n<p>陆峥寒在私宅的客厅坐了很久。</p>\n<p>他把明天的礼服挂好，把誓词打印出来又收起来——他决定不念稿，说心里话。</p>\n<p>他走进书房，看着书架上一张照片——那是两人在滨水文化中心前的合照，温叙白难得地笑了，陆峥寒搂着他的肩。</p>\n<p>"明天。"他对着照片轻声说，"明天你就是我的了。"</p>\n<p>他拿出手机，想给温叙白发消息，但又放下了——温叙白说过，"明天见"，今晚就不要再联系了，好好休息。</p>\n<p>但他睡不着。</p>\n<p>凌晨一点，他走出私宅，驱车去了城东图书馆。</p>\n<p>图书馆已经闭馆，但陆峥寒有钥匙。他打开门，走进黑暗的图书馆。</p>\n<p>月光从天窗洒下来，在地面上画出一个银色的光圈——那个明天他们交换戒指的位置。</p>\n<p>陆峥寒站在光圈中间，抬头看着天窗。</p>\n<p>七年前，他在最低谷的时候走进这里。那时候他二十一岁，被董事会掣肘，压力大到喘不过气。</p>\n<p>他在这里坐了一整夜，第一次觉得世界没那么糟。</p>\n<p>那时候他不知道，设计这座图书馆的人，会成为他一生的伴侣。</p>\n<p>"叙白。"他轻声说，声音在空旷的图书馆里回荡，"谢谢你设计了这座图书馆。"</p>\n<p>"谢谢你让我遇见了你。"</p>\n<p>"明天——"</p>\n<p>他深吸一口气："明天我会让你成为最幸福的人。"</p>\n<p>月光安静地照着这个在深夜独自来到图书馆的男人。</p>\n<p>与此同时，工作室。</p>\n<p>温叙白也没有睡。</p>\n<p>他坐在工作台前，面前摊着一张白纸。</p>\n<p>他在画图——不是建筑设计图，而是一幅画。</p>\n<p>画的是城东图书馆的夜景。月光从天窗洒下来，照着一个站在光中的身影。</p>\n<p>他不知道陆峥寒此刻正在图书馆里。但他画了同样的场景——月光下的图书馆。</p>\n<p>也许这就是默契。</p>\n<p>画完之后，温叙白看着画上的身影，轻声说了一句话。</p>\n<p>"峥寒，我在等你。"</p>\n<p>他放下笔，把画折好，放进了明天要穿的礼服口袋里。</p>\n<p>然后他关了灯，躺在床上。</p>\n<p>闭上眼之前，他看了一眼手机——没有新消息。</p>\n<p>"晚安。"他对着黑暗轻声说。</p>\n<p>虽然对方听不到。</p>\n<p>但明天——明天之后，每一个"晚安"都有人回应了。</p>\n<p>凌晨三点，两人几乎在同一时间睡着了。</p>\n<p>他们各自做着梦——梦里都有同一座图书馆，同一片月光，同一个人。</p>\n<p>明天，就是他们的婚礼。</p>\n<div class="hook">**【本章钩子：婚礼前夜，两人各自不眠。陆峥寒深夜独自来到图书馆——七年前他走进这座建筑改变了命运。温叙白画了同样的月光和图书馆。也许这就是命中注定。明天，最重要的一天即将到来……】**</div>\n'},
  {title:'第114章 婚礼当日，晨间准备', vol:4, html:'<p>婚礼当天。</p>\n<p>海城的天气格外好——三月末的阳光温暖明亮，天空是清澈的蓝色，没有一丝云。</p>\n<p>陆峥寒早上六点就醒了。</p>\n<p>他站在私宅的落地窗前，看着窗外的阳光，深呼吸了好几次。</p>\n<p>"陆总，该准备了。"林舟在门口叫。</p>\n<p>"好。"</p>\n<p>造型师是陆瑶请来的，一个在时尚圈很有名的造型师。他给陆峥寒做了发型，整理了礼服，确认了每一个细节。</p>\n<p>"陆总，您今天特别帅。"造型师说。</p>\n<p>"谢谢。"</p>\n<p>陆瑶跑进来："哥！好了没？叙白哥那边也开始了！"</p>\n<p>"别催。"陆峥寒对着镜子最后检查了一遍。</p>\n<p>深灰色三件套，白衬衫，银灰色领带。头发整齐，面容冷峻而英俊。</p>\n<p>"走吧。"他说。</p>\n<p>另一边，温叙白在工作室准备。</p>\n<p>他的造型相对简单——他不需要太多修饰，清冷本身就是最好的装饰。</p>\n<p>陆瑶之前安排的造型师看到温叙白的素颜时，愣了三秒。</p>\n<p>"温先生，您的皮肤比我还好。"造型师感叹。</p>\n<p>"谢谢。"</p>\n<p>白色西装穿上身后，工作室里安静了一瞬。</p>\n<p>温叙白站在镜子前，清冷的面容被白色西装衬得如霜如雪。他看着镜子里的自己，微微皱眉。</p>\n<p>"太白了。"</p>\n<p>"不白。"陆瑶从门外冲进来，看到他时停住了脚步，"叙白哥，你好帅。"</p>\n<p>"你今天也说这种话？"</p>\n<p>"我说实话。"陆瑶眼眶微红，"我哥看到你一定会哭。"</p>\n<p>"他不会。"</p>\n<p>"他一定会。"</p>\n<p>温叙白看了她一眼，没有再争论。</p>\n<p>他从口袋里取出昨晚画的那幅画——月光下的图书馆——折好放进了西装内袋。</p>\n<p>"走吧。"他说。</p>\n<p>上午十点，两支车队分别从私宅和工作室出发，驶向城东图书馆。</p>\n<p>陆峥寒的车走在前面。他坐在后座，手里攥着誓词——虽然他决定不念稿，但打印出来带在身上，安心。</p>\n<p>林舟坐在副驾，回头看了一眼陆峥寒。</p>\n<p>"陆总，您手在抖。"</p>\n<p>"没有。"</p>\n<p>"有。"</p>\n<p>"……有一点。"</p>\n<p>"正常。"林舟笑了，"我向瑶瑶表白那天也抖。"</p>\n<p>陆峥寒看了他一眼："你什么时候变得这么话多了。"</p>\n<p>"紧张的时候话就多。"林舟说，"陆总您也紧张。"</p>\n<p>"我不紧张。"</p>\n<p>"您手还在抖。"</p>\n<p>陆峥寒低头看了看自己的手，把手握成了拳。</p>\n<p>"叙白。"他在心里默念，"等我。"</p>\n<div class="hook">**【本章钩子：婚礼当天！陆峥寒深灰西装英俊冷峻，温叙白白色西装清冷如霜。霸总的手在抖，伴郎说"正常"。两支车队驶向城东图书馆——故事开始的地方，即将见证最重要的时刻……】**</div>\n'},
  {title:'第115章 迎亲环节，堵门大战', vol:4, html:'<p>按照温叙白的意思，婚礼不需要太多传统环节。但陆瑶坚持要"堵门"——她说这是"最后的仪式感"。</p>\n<p>所谓"堵门"，就是新郎来接新娘（新郎）时，伴娘团把门堵住，新郎必须通过考验才能进门。</p>\n<p>温叙白对此表示："幼稚。"</p>\n<p>陆瑶表示："你管不管？"</p>\n<p>温叙白表示："不管。"</p>\n<p>于是堵门环节就这样定了下来。</p>\n<p>上午十点半，陆峥寒的车队到达工作室楼下。</p>\n<p>他上了楼，发现工作室的门紧闭。门上贴着一张大字报："想娶叙白哥，先过我们这关！"</p>\n<p>陆峥寒看着字报，嘴角抽了一下。</p>\n<p>林舟站在他身后，低声说："陆总，瑶瑶布置的。"</p>\n<p>"我知道。"</p>\n<p>陆峥寒敲门。</p>\n<p>门内传来陆瑶的声音："来者何人？"</p>\n<p>"陆峥寒。来接叙白。"</p>\n<p>"叙白哥是我们工作室的镇馆之宝，凭什么让你接走？"</p>\n<p>"凭我蓄谋了七年。"陆峥寒认真地说。</p>\n<p>门内沉默了两秒，然后传来笑声。</p>\n<p>"第一关：说十个爱叙白哥的理由。"</p>\n<p>陆峥寒清了清嗓子："第一，他是我见过最有才华的建筑师。第二，他清冷但不冷漠。第三，他的洁癖让我学会了注意卫生。第四，他画图的时候最好看。第五——"</p>\n<p>"等一下，第三条是什么？"陆瑶在门内笑。</p>\n<p>"他的洁癖让我学会了注意卫生。"陆峥寒一本正经地重复。</p>\n<p>门内爆发出笑声。</p>\n<p>"第六，他做的饭虽然难吃但我都吃了。第七，他说\'我愿意\'的时候我差点哭了。第八，他让我知道了什么是安全感。第九，他是温叙白。第十——"</p>\n<p>他停了一下，声音低了下来："第十，他是我的归处。"</p>\n<p>门内安静了。</p>\n<p>三秒后，门开了。</p>\n<p>陆瑶站在门口，眼眶微红："通过。"</p>\n<p>陆峥寒走进工作室，看到温叙白站在窗前。</p>\n<p>白色西装，清冷面容，阳光打在他身上，整个人像是在发光。</p>\n<p>陆峥寒的脚步停了一瞬。</p>\n<p>然后他笑了。</p>\n<p>"叙白。"</p>\n<p>"嗯。"</p>\n<p>"我来接你了。"</p>\n<p>温叙白看着他，嘴角弯了弯。</p>\n<p>"走吧。"</p>\n<p>两人并肩走出工作室。楼下的人群爆发出掌声和欢呼声。</p>\n<p>陆瑶在后面偷偷擦眼泪，林舟递给她纸巾。</p>\n<p>"别哭了。"林舟说。</p>\n<p>"我高兴。"陆瑶抽了抽鼻子，"我哥终于嫁出去了。"</p>\n<p>"是娶。"</p>\n<p>"管他呢。"</p>\n<p>车队再次出发，驶向城东图书馆。</p>\n<p>车上，温叙白忽然说："峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你刚才说的十个理由——"</p>\n<p>"都是真的。"</p>\n<p>"第六条。"</p>\n<p>"你做的饭我都吃了——"</p>\n<p>"每次都吃完了。"温叙白补充。</p>\n<p>"因为是你做的。"陆峥寒说，"再难吃也是你做的。"</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>"你什么时候这么会说话了？"</p>\n<p>"蓄谋了七年。"</p>\n<div class="hook">**【本章钩子：堵门大战名场面！十个爱的理由让伴娘团集体泪目——"他是我的归处"。白色西装的温叙白在阳光中如霜如雪，霸总看呆了。车队驶向城东图书馆，最重要的仪式即将开始……】**</div>\n'},
  {title:'第116章 婚礼仪式，誓言永恒', vol:4, html:'<p>城东图书馆。</p>\n<p>下午两点，阳光正好。</p>\n<p>图书馆的内部被温叙白的设计改造成了一个婚礼空间。集装箱缝隙间的花艺如藤蔓攀爬，暖色灯光与自然光交织，中庭天窗下的光圈就是仪式台。</p>\n<p>六十位至亲好友坐在两侧。陆老夫人坐在第一排，满头银丝，精神矍铄。温崇远和苏敏华坐在另一侧，表情复杂但带着欣慰。</p>\n<p>社区的几位老人自发在门口摆了茶摊，给来宾倒茶。</p>\n<p>音乐响起——是温叙白挑选的一首钢琴曲，轻柔而温暖。</p>\n<p>陆峥寒先走进中庭，站在仪式台上。</p>\n<p>他看着面前的宾客，深吸一口气。</p>\n<p>然后——温叙白从图书馆入口走出来。</p>\n<p>阳光从集装箱缝隙间洒在他身上，白色西装在光中柔和而明亮。他走得不快不慢，步伐沉稳，面容清冷——但嘴角有一丝不易察觉的微笑。</p>\n<p>陆峥寒看着他，呼吸停了。</p>\n<p>温叙白走到他面前，两人对视。</p>\n<p>"叙白——"陆峥寒开口，声音有些哑。</p>\n<p>"嗯。"</p>\n<p>"你——"他停了一下，"太好看了。"</p>\n<p>温叙白的耳尖微微泛红，但没有别开目光。</p>\n<p>主持人是林舟——这个安排是陆瑶提议的，林舟紧张了三天，但站上台时意外地稳。</p>\n<p>"各位来宾——"林舟的声音在图书馆里回荡，"今天，我们在这里见证陆峥寒先生和温叙白先生的婚礼。"</p>\n<p>"城东图书馆，是温叙白先生设计的第一个作品，也是他们故事的起点。七年前，陆峥寒先生走进了这座图书馆，从此命运开始转折。"</p>\n<p>"今天，他们回到这里，在所有爱和祝福中，开启人生的新篇章。"</p>\n<p>"现在，请两位新人交换誓词。"</p>\n<p>陆峥寒先开口。</p>\n<p>他没有念稿。他看着温叙白的眼睛，一个字一个字地说。</p>\n<p>"叙白。我第一次走进这座图书馆的时候，是七年前。那时候我二十一岁，什么都不懂，被全世界压着打。"</p>\n<p>"我在这里坐了一整夜，第一次觉得——世界没那么糟。后来我查到了设计师的名字——温叙白。从那天起，我就知道，这个人会改变我的人生。"</p>\n<p>"我用了七年走到你身边。七年里，我见过你面无表情的样子，见过你画图时专注的样子，见过你第一次为我破例时耳尖发红的样子，见过你说\'我愿意\'时眼睛亮起来的样子。"</p>\n<p>"每一种样子，我都想看一辈子。"</p>\n<p>"我承诺——以后每一天，我都站在你身边。你画图的时候我安静陪着，你紧张的时候我握着你的手，你难过的时候我做你的安全港。"</p>\n<p>"温叙白——你是我蓄谋了七年的偏爱，也是我余生唯一的归处。"</p>\n<p>温叙白看着他，眼底有微光在颤动。</p>\n<p>然后他开口了。</p>\n<p>"峥寒。我不太会说话。所以我的誓词很短。"</p>\n<p>"你问我为什么选你——因为你是陆峥寒。"</p>\n<p>"你让我知道了什么是安全感。你打破了我所有的底线——洁癖、强迫症、对人的疏离。你一样一样地打破，又一样一样地用你的方式补上。"</p>\n<p>"我在你面前不完美。我清冷、迟钝、不会表达。但你从来没有嫌弃过我。你说\'每一种样子都想看一辈子\'——我想说，你的每一种样子，我也想看一辈子。"</p>\n<p>"陆峥寒——我画过很多建筑，但你是第一个让我想画\'家\'的人。"</p>\n<p>图书馆里安静极了。</p>\n<p>然后——掌声如潮水般涌来。</p>\n<p>陆老夫人在第一排擦了擦眼角。苏敏华靠在温崇远肩上，泪流满面。陆瑶哭得稀里哗啦，林舟在台上也红了眼眶。</p>\n<p>"现在——"林舟吸了吸鼻子，"请两位新人交换戒指。"</p>\n<p>陆峥寒从口袋里取出那枚刻着"WXB，我的偏爱"的戒指。</p>\n<p>他握住温叙白的左手，轻轻地将戒指套上他的无名指。</p>\n<p>温叙白也取出另一枚——"LZH，我的归处"——戴在陆峥寒的手上。</p>\n<p>两枚素圈在阳光下闪着温润的光。</p>\n<p>"你们现在——"林舟的声音有些哽咽，"是彼此的人了。"</p>\n<p>陆峥寒看着温叙白，温叙白看着他。</p>\n<p>阳光从天窗洒下来，照在两人身上。</p>\n<p>这一刻，所有的等待都有了答案。</p>\n<div class="hook">**【本章钩子：婚礼仪式！陆峥寒的誓词深情到全网泪目——"你是我蓄谋了七年的偏爱"。温叙白用最短的话说了最重的心——"你是第一个让我想画\'家\'的人"。戒指戴上，余生开启……】**</div>\n'},
  {title:'第117章 交换戒指，全场合唱', vol:4, html:'<p>戒指交换完毕后，仪式进入了最后一个环节。</p>\n<p>林舟宣布："现在，请新人完成最后的仪式——"</p>\n<p>但他的话还没说完，图书馆的灯光忽然暗了下来。</p>\n<p>所有人都愣了——这不是流程里的安排。</p>\n<p>然后，中庭的天窗下方，一束柔和的光柱缓缓亮起。光柱中，无数细小的光点飘浮着，像是把星空搬进了图书馆。</p>\n<p>这是温叙白的设计——他在天窗下方安装了一个隐形的光影装置，在特定时刻启动，营造出星光漫天的效果。</p>\n<p>"这是——"陆峥寒看着头顶的光点，微怔。</p>\n<p>"我设计的。"温叙白说，"给你的。"</p>\n<p>陆峥寒看着他，然后笑了。</p>\n<p>"叙白——"</p>\n<p>"嘘。"温叙白说，"听。"</p>\n<p>音乐响起了——不是之前的钢琴曲，而是一首歌。</p>\n<p>图书馆的音箱里传出一个温暖的男声，唱着一首关于"回家"的歌。歌词很简单：</p>\n<p>"走过千山万水，终于找到了你。</p>\n<p>从蓄谋到相遇，从暧昧到确定。</p>\n<p>你是我的偏爱，你是我的归处。</p>\n<p>余生很长，请多指教。"</p>\n<p>这首歌——是陆峥寒写的。</p>\n<p>他在追求温叙白的过程中，写过一首歌，但从来没有公开过，只是存在手机备忘录里。</p>\n<p>"你怎么——"陆峥寒看向温叙白。</p>\n<p>"你手机备忘录没锁密码。"温叙白面无表情。</p>\n<p>"你偷看我手机？"</p>\n<p>"不是偷看。是——"温叙白停了一下，"了解。"</p>\n<p>陆峥寒忍不住笑了出来。</p>\n<p>这时，台下的宾客们开始轻声跟着唱。陆瑶第一个开口，林舟跟着，然后是温叙白事务所的同事们，社区的老人家们——歌声越来越响，越来越温暖。</p>\n<p>六十个人的合唱在图书馆里回荡，和头顶的星光交相辉映。</p>\n<p>陆峥寒看着温叙白，眼眶终于红了。</p>\n<p>"叙白——"他声音有些哑，"你知道这首歌我写了多久吗？"</p>\n<p>"多久？"</p>\n<p>"七年。"</p>\n<p>温叙白看着他，眼底有什么东西在微微融化。</p>\n<p>"那——"他轻声说，"从今天起，不用再写了。"</p>\n<p>"为什么？"</p>\n<p>"因为你写的人，已经在你身边了。"</p>\n<p>陆峥寒看着他，终于没忍住——他上前一步，在所有人的注视下，在星光和歌声中，拥抱了温叙白。</p>\n<p>不是亲吻——温叙白在公共场合还是会不好意思。</p>\n<p>是拥抱。紧紧的，用力的，把人揉进怀里的拥抱。</p>\n<p>全场掌声雷动。</p>\n<p>陆瑶哭成了泪人，林舟一边鼓掌一边擦眼泪。陆老夫人坐在第一排，笑着笑着也湿了眼眶。温崇远揽着苏敏华的肩，两个人都红了眼。</p>\n<p>"好了。"温叙白被抱得有些喘不过气，在陆峥寒耳边轻声说，"够了。"</p>\n<p>"不够。"陆峥寒闷声说，"一辈子都不够。"</p>\n<p>"那留着回家抱。"</p>\n<p>"好。"</p>\n<p>陆峥寒松开手，但手指扣着温叙白的手指，手指交缠。</p>\n<p>两人转身，面对所有宾客。</p>\n<p>阳光、星光、掌声、祝福——一切都恰到好处。</p>\n<p>林舟在旁边擦干眼泪，举起话筒："让我们祝福新人——新婚快乐！"</p>\n<p>"新婚快乐！"全场齐声回应。</p>\n<div class="hook">**【本章钩子：全场合唱名场面！温叙白偷看了陆峥寒手机里写了七年的歌，在婚礼上播放。星光漫天下，六十人的合唱回荡在图书馆里。霸总终于红了眼眶——"一辈子都不够"。这是全书最动人的时刻之一……】**</div>\n'},
  {title:'第118章 婚宴名场面，霸总致辞', vol:4, html:'<p>婚礼仪式结束后，宾客们移步陆家老宅参加婚宴。</p>\n<p>老宅的花园被布置成了一个露天宴会厅——圆桌铺着白色桌布，花艺沿着回廊攀爬，暖色灯串缠绕在树梢上，像一片星海。</p>\n<p>一百五十位宾客入座，比仪式多了不少——主要是陆氏的合作伙伴、建筑界的朋友和社区的居民代表。</p>\n<p>婚宴开始前，陆峥寒站起来致辞。</p>\n<p>他站在花园中央的舞台上，手里没有稿子。</p>\n<p>"各位——"他开口，声音沉稳，"感谢大家来参加我们的婚礼。"</p>\n<p>"今天在城东图书馆举行仪式，是因为那个地方对我们有特殊的意义。七年前，我在最低谷的时候走进了那座图书馆，找到了安宁。后来我才知道，设计那座图书馆的人，就是我要找的人。"</p>\n<p>"所以——"他看向温叙白，"这座图书馆不只是叙白的作品，也是我们故事的起点。"</p>\n<p>"今天我想借这个机会，说几句感谢的话。"</p>\n<p>"首先，感谢我的祖母。"陆峥寒看向陆老夫人，"是您教会我什么是家族的责任，也是在您面前，我学会了怎么做选择。谢谢您接受叙白。"</p>\n<p>陆老夫人微微点头，目光温和。</p>\n<p>"感谢叙白的父母——温叔叔、苏阿姨。"他看向温崇远和苏敏华，"谢谢你们把他养大，也谢谢你们把他交给我。我会照顾好他。"</p>\n<p>温崇远点了点头，苏敏华擦了擦眼角。</p>\n<p>"感谢所有朋友和合作伙伴的祝福。特别要感谢城东社区的居民们——"他看向几位社区老人，"叙白设计的图书馆是你们的社区中心，你们今天来参加婚礼，对我们来说意义非凡。"</p>\n<p>张大爷代表社区站起来："陆总，叙白是我们社区的骄傲。你们结婚了，我们比什么都高兴！"</p>\n<p>全场笑了。</p>\n<p>"最后——"陆峥寒转向温叙白，"我想对你说几句。"</p>\n<p>温叙白坐在台下，面无表情，但耳尖微微泛红。</p>\n<p>"叙白，从七年前走进你设计的图书馆，到今天把你娶回家——这条路我走了很久。但每一步都值得。"</p>\n<p>"你说过，我是第一个让你想画\'家\'的人。我想说——你是我唯一想为之建\'家\'的人。"</p>\n<p>"以后，你负责设计，我负责守护。你画你的建筑，我做你的后盾。"</p>\n<p>"余生很长——请多指教。"</p>\n<p>全场掌声如雷。</p>\n<p>温叙白坐在台下，低头喝了一口水，掩饰发红的眼眶。</p>\n<p>但所有人都看到了——他嘴角弯着，弯得比任何时候都深。</p>\n<p>婚宴正式开始。</p>\n<p>菜品是周伯和苏敏华联手准备的——一半海城本帮菜，一半温叙白小时候爱吃的家常菜。</p>\n<p>"这红烧鱼是我教周伯做的。"苏敏华跟旁边的人说，"叙白从小最爱吃。"</p>\n<p>"这桂花糕是我做的。"周伯笑着说，"峥寒学了好几次都没学会。"</p>\n<p>"他做饭不行。"温叙白在旁边淡淡地说，"但态度可嘉。"</p>\n<p>全场又笑了。</p>\n<p>婚宴的气氛温暖而欢乐，没有商业场合的虚伪客套，全是真挚的祝福。</p>\n<p>这就是他们想要的婚礼——不在于排场，而在于真心。</p>\n<div class="hook">**【本章钩子：婚宴名场面！霸总致辞字字走心——"你负责设计，我负责守护"。社区大爷代表居民祝福，周伯和苏敏华联手做菜。温叙白低头喝水掩饰红眼眶，但嘴角弯得比任何时候都深……】**</div>\n'},
  {title:'第119章 敬酒环节，甜蜜互动', vol:4, html:'<p>婚宴的敬酒环节，是全场上最热闹的部分。</p>\n<p>陆峥寒和温叙白一起端着酒杯，逐桌敬酒。</p>\n<p>第一桌是陆老夫人和家族长辈。</p>\n<p>"祖母，我们敬您。"陆峥寒举杯。</p>\n<p>陆老夫人笑着端起茶杯："峥寒，叙白——以后好好过日子。"</p>\n<p>"谢谢祖母。"两人齐声说。</p>\n<p>第二桌是温崇远和苏敏华。</p>\n<p>温叙白端着酒杯，看着父母，沉默了两秒。</p>\n<p>"爸，妈。"他说，"谢谢你们。"</p>\n<p>苏敏华眼眶红了："叙白，妈只有一句话——你要幸福。"</p>\n<p>"我会的。"</p>\n<p>温崇远拍了拍陆峥寒的肩："交给你了。"</p>\n<p>"叔叔放心。"陆峥寒说。</p>\n<p>第三桌是陆瑶和林舟——他们坐在一起，手在桌下偷偷牵着。</p>\n<p>"恭喜哥！恭喜叙白哥！"陆瑶举杯，笑得眼睛弯弯。</p>\n<p>"瑶瑶。"陆峥寒看了她一眼，又看了林舟一眼，"你们什么时候请我喝喜酒？"</p>\n<p>陆瑶脸瞬间红了："哥！今天是你婚礼！"</p>\n<p>"我就是问一下。"</p>\n<p>"以后再说！"陆瑶连忙岔开话题。</p>\n<p>林舟在旁边红着脸，小声说："陆总，我一定会对瑶瑶好的。"</p>\n<p>"我知道。"陆峥寒端起酒杯，"不然你知道后果。"</p>\n<p>"知道知道。"林舟连忙点头。</p>\n<p>温叙白在旁边忍不住笑了——霸总威胁妹夫的场面，太经典了。</p>\n<p>敬到社区老人那桌时，张大爷站起来说："叙白啊，你从小就跟着你爷爷来社区，我们都是看着你长大的。今天你结婚了，我们几个老伙计商量了一下——送你一份礼物。"</p>\n<p>张大爷拿出一个旧信封，递给温叙白。</p>\n<p>温叙白打开一看——是一张手绘的建筑草图，画的是一座社区图书馆。笔迹苍老而有力，右下角写着"温怀瑾"。</p>\n<p>"这是——"</p>\n<p>"你爷爷二十年前画给我们社区的。"张大爷说，"他说想给社区建一座图书馆，画了这张图给我们看。后来一直没建成，这张图也就一直在我们社区办公室放着。"</p>\n<p>"今天你结婚了，又是你设计了新的社区图书馆——这张图，应该回到你们温家人手里。"</p>\n<p>温叙白看着爷爷的亲笔手稿，手微微发抖。</p>\n<p>"谢谢。"他说，声音有些哑。</p>\n<p>陆峥寒揽住他的肩，轻声说："爷爷一定很高兴。"</p>\n<p>温叙白点了点头，把信封小心翼翼地收好。</p>\n<p>敬酒环节结束后，婚宴进入了自由活动时间。</p>\n<p>有人在花园里聊天，有人在跳舞，几个小朋友在灯串下跑来跑去。</p>\n<p>温叙白站在花园的角落里，看着手中的爷爷手稿。</p>\n<p>陆峥寒走过来，站在他身边。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"今天——开心吗？"</p>\n<p>温叙白看着他，然后低头看了看手稿，又看了看头顶的灯串。</p>\n<p>"开心。"他说，"很开心的那种。"</p>\n<p>陆峥寒笑了，伸手握住他的手。</p>\n<p>"我也是。"</p>\n<p>花园里灯火温柔，人声鼎沸。</p>\n<p>两人站在角落，十指相扣，安静地看着这一切。</p>\n<p>这就是他们的婚礼——不完美，但足够温暖。</p>\n<p>不奢华，但足够幸福。</p>\n<div class="hook">**【本章钩子：敬酒环节温暖全场！陆峥寒威胁妹夫"你知道后果"，社区老人送出爷爷二十年前亲笔手稿——最珍贵的结婚礼物。温叙白说"很开心的那种开心"，这是他给出的最高评价……】**</div>\n'},
  {title:'第120章 洞房花烛，含蓄甜蜜', vol:4, html:'<p>婚宴结束后，宾客们陆续散去。</p>\n<p>陆老夫人被周伯送回了老宅，温崇远和苏敏华回了酒店，陆瑶被林舟送走了——两人走的时候手牵着手，陆峥寒意味深长地看了林舟一眼，林舟挺直了腰板。</p>\n<p>夜深了。</p>\n<p>陆峥寒和温叙白回到私宅。</p>\n<p>推开门，客厅里亮着一盏暖灯。苏敏华寄来的喜被铺在床上，蓝色的，针脚细密。</p>\n<p>陆峥寒关上门，转身看温叙白。</p>\n<p>温叙白正在解领带。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"今天——"陆峥寒靠在门框上，"累不累？"</p>\n<p>"有点。"</p>\n<p>"那先洗澡？"</p>\n<p>"嗯。"</p>\n<p>温叙白解了领带，脱了西装外套，走进浴室。</p>\n<p>陆峥寒站在原地，看着他走进浴室的背影，忽然觉得——</p>\n<p>这个人，从今天起，是他的丈夫了。</p>\n<p>他在沙发上坐下，低头看着手上的戒指。</p>\n<p>素圈白金，内壁刻着"WXB，我的偏爱"。</p>\n<p>他转了转戒指，嘴角弯着。</p>\n<p>温叙白洗完澡出来，穿着家居服，头发还微微湿润。他看到陆峥寒坐在沙发上发呆，走过去在他旁边坐下。</p>\n<p>"你在想什么？"</p>\n<p>"在想——"</p>\n<p>"嗯？"</p>\n<p>"在想你现在是温叙白，还是陆太太。"</p>\n<p>"……都不是。"温叙白说，"我还是温叙白。"</p>\n<p>"但在法律上——"</p>\n<p>"法律上我是陆峥寒的配偶。"温叙白纠正，"不是陆太太。"</p>\n<p>"好。陆峥寒的配偶。"陆峥寒笑了，"这个称呼我很满意。"</p>\n<p>温叙白看了他一眼，站起来去倒了两杯水。</p>\n<p>递给陆峥寒一杯，自己拿了一杯。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"谢谢你的誓词。"</p>\n<p>"你谢什么？"</p>\n<p>"你说的每一句话——我都记住了。"温叙白说，"特别是那句\'你负责设计，我负责守护\'。"</p>\n<p>"嗯。"</p>\n<p>"我想说的是——"温叙白看着他，清冷的眼底在暖灯下格外柔和，"你不需要只做守护者。你也可以是被守护的人。"</p>\n<p>陆峥寒看着他，微怔。</p>\n<p>"你一直在我前面挡着。"温叙白说，"但我不希望你永远一个人扛。以后——你累了，就靠在我肩上。"</p>\n<p>"你肩很窄。"</p>\n<p>"够你靠就行。"</p>\n<p>陆峥寒看着他，忽然笑了——笑着笑着，眼眶就红了。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你今天说了好多话。"</p>\n<p>"可能因为今天是结婚。"</p>\n<p>"以后也多说。"</p>\n<p>"看心情。"</p>\n<p>"你每次说\'看心情\'，最后都说了。"</p>\n<p>温叙白没有反驳。</p>\n<p>他放下水杯，靠在陆峥寒肩上。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"余生请多指教。"</p>\n<p>陆峥寒低头，在他发顶落下一吻。</p>\n<p>"余生——请多指教。"</p>\n<p>窗外的月光洒进来，和室内的暖灯交织。</p>\n<p>苏敏华缝的喜被铺在床上，蓝色的，像一片安静的海。</p>\n<p>两人相拥而眠，一夜好梦。</p>\n<div class="hook">**【本章钩子：洞房花烛，含蓄而甜蜜。温叙白说"你也可以是被守护的人"——这句话比任何誓词都动人。喜被如海，月光如水，两人相拥而眠。婚后生活即将开始……】**</div>\n'},
  {title:'第121章 蜜月旅行，海岛浪漫', vol:4, html:'<p>婚后第三天，两人出发蜜月旅行。</p>\n<p>目的地是马尔代夫——一个私人岛屿度假村。</p>\n<p>"为什么要去海岛？"温叙白在飞机上问。</p>\n<p>"因为你没去过海岛。"</p>\n<p>"你怎么知道？"</p>\n<p>"我查过你的旅行记录。你去过米兰、巴黎、东京——全是出差。从来没有去过纯粹休闲的地方。"</p>\n<p>温叙白看着他："你连这个都查？"</p>\n<p>"七年蓄谋，不查仔细怎么行。"</p>\n<p>温叙白无语了。</p>\n<p>到达马尔代夫后，度假村的工作人员用快艇把他们送到私人岛屿。</p>\n<p>岛屿不大，只有六栋别墅。他们的别墅建在水上，推开门就是碧蓝的大海。</p>\n<p>"这——"温叙白站在别墅的露台上，看着眼前的海景，罕见地愣住了。</p>\n<p>海面碧蓝如玉，阳光在水面上碎成金色的光点。远处是一望无际的印度洋，天空和海面在地平线处融为一体。</p>\n<p>"好看吗？"陆峥寒从背后环住他的腰。</p>\n<p>"好看。"温叙白说，"比任何建筑都好看。"</p>\n<p>"比滨水文化中心好看？"</p>\n<p>"……不一样的好看。"</p>\n<p>"那就好。"</p>\n<p>蜜月的日子，简单而奢侈。</p>\n<p>没有日程安排，没有工作打扰。两人每天的生活就是——起床、吃早餐、看海、游泳、午睡、看日落、吃晚餐、看星星。</p>\n<p>第三天傍晚，两人在海滩上看日落。</p>\n<p>太阳缓缓沉入海面，把天空染成橙红、紫金和深蓝的渐变。海浪轻轻拍打着沙滩，远处的海豚偶尔跃出水面。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"这大概是我这辈子最放松的几天。"</p>\n<p>"我也是。"</p>\n<p>"以前休假的时候，我脑子里还是在想设计。"</p>\n<p>"现在呢？"</p>\n<p>"现在——"温叙白靠在他肩上，"脑子里只有你。"</p>\n<p>陆峥寒低头看他，笑了。</p>\n<p>"叙白，你说这种话的时候，我总觉得不像你。"</p>\n<p>"被你带坏了。"</p>\n<p>"那继续带。"</p>\n<p>温叙白轻笑了一声。</p>\n<p>落日将两人的影子拉得很长，投在金色的沙滩上。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"谢谢你带我来这里。"</p>\n<p>"不用谢。"</p>\n<p>"不是客气。"温叙白说，"我是真的——很开心。"</p>\n<p>陆峥寒握住他的手，手指交缠。</p>\n<p>"以后每年来一次。"</p>\n<p>"好。"</p>\n<p>"不同的地方。"</p>\n<p>"好。"</p>\n<p>"但每次都要看日落。"</p>\n<p>"好。"</p>\n<p>落日沉入了海面，天空变成了深蓝色，星星开始一颗一颗地亮起来。</p>\n<p>两人躺在沙滩上，仰望星空。</p>\n<p>"这里的星星比海城多。"温叙白说。</p>\n<p>"因为没有城市灯光。"</p>\n<p>"爷爷以前说——每一颗星星都是一个人的梦想。"</p>\n<p>"那你的星星是哪颗？"</p>\n<p>温叙白想了想，指了指天空中最亮的一颗。</p>\n<p>"那颗。"</p>\n<p>"为什么？"</p>\n<p>"因为它最亮。"温叙白说，"像你。"</p>\n<p>陆峥寒看着他，在星光下笑了。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你越来越会说话了。"</p>\n<p>"被你传染的。"</p>\n<p>"那就继续传染。"</p>\n<p>两人在星空下并排躺着，听着海浪声，各自微笑。</p>\n<p>这大概就是幸福最具体的样子。</p>\n<div class="hook">**【本章钩子：蜜月海岛，碧海蓝天。温叙白罕见地彻底放松——"脑子里只有你"。日落下的十指相扣，星空下的"因为你最亮"。这是全书最纯粹、最浪漫的篇章之一……】**</div>\n'},
  {title:'第122章 蜜月日常，新婚甜蜜', vol:4, html:'<p>蜜月的第七天。</p>\n<p>两人已经完全进入了"度假模式"——陆峥寒不再看手机上的工作消息，温叙白也不再想设计图。</p>\n<p>这天上午，两人决定自己做饭。</p>\n<p>度假村的别墅有开放式厨房，食材是度假村提供的。但问题在于——两人的厨艺加起来约等于一个普通人的水平。</p>\n<p>"你会做什么？"陆峥寒问。</p>\n<p>"煮面。"温叙白说。</p>\n<p>"只会煮面？"</p>\n<p>"还会煮饺子。"</p>\n<p>"冷冻饺子？"</p>\n<p>"嗯。"</p>\n<p>陆峥寒叹了口气："那我来做。"</p>\n<p>他翻看了一下冰箱里的食材——有鱼、虾、蔬菜、意面和各种调料。</p>\n<p>"做海鲜意面？"</p>\n<p>"你会做？"</p>\n<p>"看过视频。"</p>\n<p>温叙白看着他："你确定？"</p>\n<p>"不确定。但可以试。"</p>\n<p>接下来的一个小时，厨房里经历了——烟雾报警器响了一次（煎虾温度太高）、意面煮过头了一次（温叙白看手机忘了计时）、调料放多了一次（陆峥寒手抖）。</p>\n<p>最终成品：一盘卖相尚可但味道一般的海鲜意面。</p>\n<p>两人坐在露台上，面对碧蓝大海，吃着不太成功的意面。</p>\n<p>"好吃吗？"陆峥寒问。</p>\n<p>"你做的，当然好吃。"</p>\n<p>"你说谎。"</p>\n<p>"那你说实话——一般。"温叙白说，"但比我做的好。"</p>\n<p>"这倒是。"</p>\n<p>两人对视一眼，同时笑了。</p>\n<p>下午，两人去浮潜。</p>\n<p>温叙白第一次浮潜，有些紧张。陆峥寒在旁边握着他的手，带他慢慢适应。</p>\n<p>"别怕。"陆峥寒在水下含着呼吸管说，声音含糊不清。</p>\n<p>温叙白在水下看到了五颜六色的珊瑚和热带鱼，忍不住多看了几眼。</p>\n<p>上来后，他摘下面罩，头发湿漉漉地贴在脸上。</p>\n<p>"好看吗？"陆峥寒问。</p>\n<p>"很好看。"温叙白说，"比任何建筑都——"他停了一下，"算了，不比了。"</p>\n<p>"你学会了不拿建筑做比喻。"</p>\n<p>"进步了。"</p>\n<p>晚上，两人在别墅的露台上吃烛光晚餐。</p>\n<p>度假村的服务生为他们准备了一桌精致的当地料理——烤龙虾、椰子蟹、热带水果拼盘。</p>\n<p>"比我们做的意面好吃多了。"温叙白评价。</p>\n<p>"我们的意面有爱的味道。"</p>\n<p>"爱的味道是糊味。"</p>\n<p>陆峥寒笑出了声。</p>\n<p>吃完饭，两人在露台上靠着看星星。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"回去以后——"</p>\n<p>"回去以后该忙了。"陆峥寒说，"你事务所有新项目，我陆氏也有新的季度目标。"</p>\n<p>"嗯。"</p>\n<p>"但——"陆峥寒握住他的手，"再忙也每天一起吃晚饭。"</p>\n<p>"好。"</p>\n<p>"每天说晚安。"</p>\n<p>"好。"</p>\n<p>"每个纪念日都一起过。"</p>\n<p>"好。"</p>\n<p>"每年都来一次旅行。"</p>\n<p>"好。"</p>\n<p>"还有——"</p>\n<p>"还有什么？"</p>\n<p>陆峥寒想了想，说："每天都说一句\'我爱你\'。"</p>\n<p>温叙白看着他，沉默了三秒。</p>\n<p>"你看心情。"他说。</p>\n<p>"又是\'看心情\'？"</p>\n<p>"嗯。看心情。"</p>\n<p>陆峥寒笑着把他搂进怀里。</p>\n<p>"那我每天都让你心情好。"</p>\n<p>"你试试。"</p>\n<p>"试一辈子。"</p>\n<p>海浪声轻轻拍打着别墅的桩柱，星空在头顶无限展开。</p>\n<p>蜜月的日子，每一天都像偷来的幸福。</p>\n<p>但偷来的也好，赚来的也好——只要在一起，就是最好的日子。</p>\n<div class="hook">**【本章钩子：蜜月日常——糊味意面、浮潜初体验、烛光晚餐。"爱的味道是糊味"让两人笑成一团。"试一辈子"是霸总给出的终极承诺。新婚甜蜜继续，回国的日常即将开始……】**</div>\n'},
  {title:'第123章 归国生活，婚后日常', vol:4, html:'<p>蜜月结束后，两人回到海城，开始了婚后生活。</p>\n<p>和恋爱时相比，婚后生活没有发生翻天覆地的变化——他们本来就住在一起，一起吃饭、一起加班、互相报备。</p>\n<p>但一些细微的变化，让两人都觉得不一样了。</p>\n<p>比如，每天早上醒来，看到对方在身边，手上的戒指闪着光。</p>\n<p>比如，出门前不再说"我走了"，而是说"老公，我走了"——当然，只有陆峥寒这么说，温叙白依然说"我走了"。</p>\n<p>比如，超市购物时，陆峥寒会自然地牵着他的手，挑选食材。</p>\n<p>"你以前在超市也牵手。"温叙白说。</p>\n<p>"但以前是恋人牵手，现在是夫妻牵手。"</p>\n<p>"有什么区别？"</p>\n<p>"感觉不一样。"陆峥寒笑着说，"更踏实了。"</p>\n<p>温叙白看了他一眼，没有反驳。</p>\n<p>婚后第一周，温叙白收到了一个好消息——叙白建筑事务所被国际建筑杂志评为"年度新锐事务所"。</p>\n<p>"恭喜。"陆峥寒在早餐时说。</p>\n<p>"嗯。"</p>\n<p>"你不高兴？"</p>\n<p>"高兴。"温叙白说，"但不想太张扬。"</p>\n<p>"那我帮你高兴。"</p>\n<p>"你怎么高兴？"</p>\n<p>"今晚做你爱吃的红烧排骨。"</p>\n<p>"那你高兴吧。"</p>\n<p>陆峥寒笑了。</p>\n<p>婚后生活最大的改变，是两人之间的默契更深了。</p>\n<p>以前温叙白需要陆峥寒问他"今天怎么样"，现在不需要——温叙白会在吃饭时主动说"今天设计图改了三版，有点烦"。</p>\n<p>以前陆峥寒需要刻意安排约会，现在不需要——每天下班后一起做饭、一起看电视，就是最好的约会。</p>\n<p>以前两人需要磨合彼此的节奏，现在不需要——他们的节奏已经完全同步了。</p>\n<p>"叙白。"有天晚上看电视时，陆峥寒说。</p>\n<p>"嗯？"</p>\n<p>"你有没有觉得——结婚以后，我们的关系反而比以前更平静了。"</p>\n<p>"嗯。"</p>\n<p>"为什么？"</p>\n<p>"因为确定了。"温叙白说，"以前虽然在一起，但总觉得不确定——不确定会不会分开、会不会变。现在结婚了，确定了。确定之后就不慌了。"</p>\n<p>陆峥寒看着他，觉得这番话比任何情话都动人。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"我以前追你的时候，你最吸引我的地方是什么，你知道吗？"</p>\n<p>"不知道。"</p>\n<p>"是你的不确定。"陆峥寒说，"你不确定自己喜不喜欢我，不确定要不要接受我——那种不确定让我又急又期待。"</p>\n<p>"现在呢？"</p>\n<p>"现在你确定了。确定之后，反而更吸引我了。"</p>\n<p>"为什么？"</p>\n<p>"因为确定之后，你变得温柔了。"陆峥寒看着他，"以前的温柔是偶尔的，现在的温柔是日常的。"</p>\n<p>温叙白看着他，沉默了两秒。</p>\n<p>"你越来越会说话了。"</p>\n<p>"被你传染的。"</p>\n<p>"这话我上次说过。"</p>\n<p>"那就互相传染。"</p>\n<p>温叙白忍不住笑了。</p>\n<p>窗外的城市灯火璀璨，室内温暖安宁。</p>\n<p>这就是他们的婚后日常——没有轰轰烈烈，只有平平安安。</p>\n<p>但每一刻，都是最好的时刻。</p>\n<div class="hook">**【本章钩子：婚后日常回归平静——"确定之后就不慌了"。温叙白变得温柔了，霸总学会了做饭报备。超市里的夫妻牵手、早餐时的"恭喜"。平淡中的幸福，才是最长久的浪漫……】**</div>\n'},
  {title:'第124章 事业新篇，联手再战', vol:4, html:'<p>婚后第二个月，温叙白的事业迎来了新的高峰。</p>\n<p>叙白建筑事务所接到了一个重量级项目——海城文化新地标的国际邀请赛。</p>\n<p>这是海城市政府主导的城市更新计划，要在老城区建设一座综合文化中心，面向全球征集设计方案。</p>\n<p>"这是你一直想做的项目类型。"陆峥寒看到招标信息时说。</p>\n<p>"嗯。公共文化建筑，大规模，高规格。"温叙白说，"而且是在老城区——跟城东图书馆一脉相承。"</p>\n<p>"你有想法了？"</p>\n<p>"有一个初步的方向。"温叙白走到工作台前，拿起笔开始画草图。"我想做一个\'城市客厅\'——不是传统意义上的文化中心，而是一个开放的、属于所有市民的公共空间。"</p>\n<p>"建筑形态采用不规则的几何体——像积木一样堆叠，但每一块都有自己的功能。图书馆、展览馆、社区活动中心、露天剧场——全部融合在一座建筑里。"</p>\n<p>陆峥寒看着他画图的样子，眼神温柔："跟城东图书馆的理念一脉相承。"</p>\n<p>"嗯。但规模更大，野心更大。"温叙白说，"我想证明——公共建筑不一定要严肃、宏大、让人望而生畏。它可以是温暖的、亲切的、像家一样的。"</p>\n<p>"就像你。"陆峥寒说。</p>\n<p>温叙白抬头看他："什么？"</p>\n<p>"你的建筑理念和你这个人一样——表面清冷，内核温暖。"</p>\n<p>温叙白看着他，嘴角弯了弯。</p>\n<p>"你什么时候变成建筑评论家了？"</p>\n<p>"跟你在一起久了。"</p>\n<p>接下来三个月，温叙白全身心投入到了设计方案中。</p>\n<p>陆峥寒在背后提供了全方位的支持——项目调研、数据分析、施工可行性评估、预算测算。虽然陆氏不是直接参与方，但陆峥寒以"配偶支持"的身份，为温叙白提供了专业的商业和工程建议。</p>\n<p>"你不能直接帮我做设计。"温叙白说，"但你帮我避开了很多坑。"</p>\n<p>"那叫什么？"</p>\n<p>"叫——后盾。"</p>\n<p>陆峥寒笑了。</p>\n<p>方案提交那天，温叙白在最后一刻做了一次修改——他在建筑的中庭设计了一个特殊的光影装置，灵感来自城东图书馆的天窗。</p>\n<p>"光线从顶部洒下来，在地面形成一个光圈。"温叙白解释，"那个光圈会随着时间移动——上午在东边，下午在西边。坐在光圈里的人，就像被阳光拥抱一样。"</p>\n<p>"你总是把光用得很好。"陆峥寒说。</p>\n<p>"因为爷爷教我的。"温叙白说，"他说光线是建筑最重要的语言。"</p>\n<p>三个月后，评审结果出来了。</p>\n<p>叙白建筑事务所的方案——"城市客厅"——在来自全球二十七家事务所的方案中脱颖而出，获得评审全票通过。</p>\n<p>消息传出后，建筑界再次沸腾。</p>\n<p>"温叙白又赢了！"</p>\n<p>"\'城市客厅\'的设计理念太棒了——把文化中心变成市民的家。"</p>\n<p>"从城东图书馆到滨水文化中心到温怀瑾社区图书馆，再到现在的\'城市客厅\'——温叙白的公共建筑哲学越来越成熟了。"</p>\n<p>温叙白看到消息后，没有庆祝。他给陆峥寒发了一条消息：</p>\n<p>【方案通过了。今晚回家做饭。】</p>\n<p>陆峥寒回：【你做？】</p>\n<p>【嗯。庆祝。】</p>\n<p>【那你做什么？】</p>\n<p>【红烧排骨。】</p>\n<p>【你上次做的红烧排骨，糖放多了。】</p>\n<p>【这次不会了。】</p>\n<p>【好。我等着。】</p>\n<p>那天晚上，温叙白做的红烧排骨——糖依然放多了。</p>\n<p>但陆峥寒吃了三块。</p>\n<p>"好吃。"他说。</p>\n<p>"你说谎。"</p>\n<p>"不骗你。"陆峥寒认真地说，"你做的饭，永远好吃。"</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>事业新篇，生活如常。</p>\n<p>这就够了。</p>\n<div class="hook">**【本章钩子：事业新篇！"城市客厅"方案全票通过，温叙白的公共建筑哲学更上一层楼。陆峥寒在幕后做后盾，温叙白在前方建梦想。糖放多的红烧排骨，是庆祝最好的味道……】**</div>\n'},
  {title:'第125章 温叙白获奖，事业巅峰', vol:4, html:'<p>"城市客厅"项目的成功，让温叙白的事业达到了前所未有的高度。</p>\n<p>项目启动后的第二年，温叙白收到了一个让他彻夜未眠的消息——他被提名为普利兹克建筑奖候选人。</p>\n<p>普利兹克奖——建筑界的诺贝尔奖。</p>\n<p>"你被提名了？"陆峥寒看到消息时，正在吃早餐，差点被噎住。</p>\n<p>"嗯。"温叙白说，表情平静，但手指微微发抖。</p>\n<p>"叙白——你知道这意味着什么吗？"</p>\n<p>"知道。"</p>\n<p>"普利兹克奖！你有可能是中国最年轻的获奖者！"</p>\n<p>"还没获奖。只是提名。"</p>\n<p>"提名已经是——"陆峥寒站起来，走到他面前，一把抱住了他，"叙白，我为你骄傲。"</p>\n<p>温叙白被抱得有些喘不过气，但没有推开。</p>\n<p>"谢谢你。"他说。</p>\n<p>"谢什么？"</p>\n<p>"谢谢你一直站在我身后。"</p>\n<p>"我永远站在你身后。"</p>\n<p>消息传开后，建筑界和公众都沸腾了。</p>\n<p>温叙白的工作室电话被打爆，媒体的采访邀约堆积如山。但温叙白依然全部拒绝了——他不想被外界打扰，只想专心做项目。</p>\n<p>六个月后，普利兹克奖评审委员会正式宣布——</p>\n<p>本年度普利兹克建筑奖获得者：温叙白。</p>\n<p>消息传到海城时，温叙白正在工作室画图。</p>\n<p>助理冲进来："温老师！您获奖了！普利兹克奖！"</p>\n<p>温叙白手里的笔顿了一下。</p>\n<p>他放下笔，看着窗外的阳光，沉默了很久。</p>\n<p>然后他拿起手机，给陆峥寒发了一条消息：</p>\n<p>【我获奖了。】</p>\n<p>三秒后，陆峥寒回了一连串感叹号：【！！！！！！！！！】</p>\n<p>然后：【我现在就过来。】</p>\n<p>十五分钟后，陆峥寒冲进工作室，一把抱住温叙白，在所有人面前。</p>\n<p>"叙白——"他声音发抖，"你做到了。"</p>\n<p>温叙白被他抱得有些闷，但这次没有说"放开"。</p>\n<p>"嗯。"他说，"做到了。"</p>\n<p>颁奖典礼在巴黎举行——和两年前UIA颁奖典礼是同一个城市。</p>\n<p>这一次，陆峥寒依然坐在台下第一排。</p>\n<p>温叙白站在台上，面对全球建筑界的目光。</p>\n<p>"谢谢。"他说，"这个奖不只是给我一个人的。"</p>\n<p>"它属于我的爷爷温怀瑾先生——他教会我用光线和空间表达温度。"</p>\n<p>"它属于我的丈夫陆峥寒——他让我知道什么是安全感，让我敢于设计让人安心的空间。"</p>\n<p>"它属于所有相信建筑可以温暖人心的人。"</p>\n<p>"谢谢。"</p>\n<p>台下的陆峥寒，这次没有忍住——他流了一滴眼泪。</p>\n<p>颁奖结束后，两人在巴黎的塞纳河畔散步。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"两年前我们在这里看埃菲尔铁塔的灯。"</p>\n<p>"嗯。"</p>\n<p>"那时候你还没拿普利兹克奖。"</p>\n<p>"嗯。"</p>\n<p>"现在你拿了。"陆峥寒握着他的手，"但对我来说——你还是你。"</p>\n<p>"拿奖之前和拿奖之后？"</p>\n<p>"都一样。"陆峥寒看着他，"都是我最爱的人。"</p>\n<p>温叙白看着他，在巴黎的夜色中，笑了。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你说过——你第一次走进城东图书馆的时候，在最低谷。"</p>\n<p>"嗯。"</p>\n<p>"那座图书馆是我设计的。"温叙白说，"但它能给你安宁——不是因为我，是因为它本身就是一个温暖的容器。"</p>\n<p>"现在——"他看着陆峥寒，"你是我生命的温暖容器。"</p>\n<p>"我装不下你的才华。"陆峥寒笑了。</p>\n<p>"你装得下。"温叙白说，"你装下了我所有的脆弱、不安和迟钝。还有——我的爱。"</p>\n<p>陆峥寒看着他，在塞纳河畔的灯光下，又红了眼眶。</p>\n<p>"叙白——"</p>\n<p>"别哭了。"</p>\n<p>"我没哭。"</p>\n<p>"你眼睛红了。"</p>\n<p>"风吹的。"</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>然后他伸出手，轻轻擦去了陆峥寒眼角的泪。</p>\n<p>"余生还长。"温叙白说，"别急着哭。"</p>\n<div class="hook">**【本章钩子：普利兹克奖！温叙白站在了世界建筑界的巅峰。台上感谢爷爷和丈夫，台下霸总流了一滴泪。塞纳河畔的一句"你是我生命的温暖容器"，让整个巴黎的夜色都温柔了……】**</div>\n'},
  {title:'第126章 陆峥寒支持，霸总护航', vol:4, html:'<p>普利兹克奖之后，温叙白的生活发生了巨大变化。</p>\n<p>全球各地的邀约如雪片般飞来——讲座、展览、评审、设计委托。他的名字从"中国新锐建筑师"变成了"国际建筑大师"。</p>\n<p>但温叙白本人并没有变。</p>\n<p>他依然每天八点到工作室，画图、开会、改方案。依然穿白衬衫，依然清冷寡言。依然每天回家吃陆峥寒做的饭。</p>\n<p>变化的是陆峥寒。</p>\n<p>普利兹克奖之后，陆峥寒在温叙白事业上的参与度更高了——不是干涉，而是护航。</p>\n<p>"叙白，你下个月有三个国际讲座、两个评审、一个展览开幕式。"陆峥寒看着温叙白的行程表，"太密了。"</p>\n<p>"我可以——"</p>\n<p>"推掉两个。"陆峥寒说，"你的身体不能这么透支。"</p>\n<p>"峥寒——"</p>\n<p>"叙白，你的价值不在于出席多少活动。"陆峥寒认真地看着他，"你的价值在于你的设计。如果你因为行程太密而影响了创作，那就是本末倒置。"</p>\n<p>温叙白看着他，沉默了两秒。</p>\n<p>"你说得对。"他说，"推掉哪个？"</p>\n<p>"你选。我帮你沟通。"</p>\n<p>从那以后，陆峥寒主动承担了温叙白的行程管理和对外沟通工作。他成立了一个专门的团队——温叙白工作室的运营支持组，负责行程安排、媒体对接、合同审核和后勤保障。</p>\n<p>"你不用这么麻烦。"温叙白说。</p>\n<p>"不麻烦。"陆峥寒说，"你是普利兹克奖得主，你需要一个专业的团队来保护你的时间和精力。"</p>\n<p>"你把保护我当成事业了。"</p>\n<p>"你就是我最大的事业。"</p>\n<p>温叙白看着他，嘴角弯了弯。</p>\n<p>有一天，温叙白收到一个来自中东的超级项目邀约——设计一座国家级博物馆，预算没有上限。</p>\n<p>"这个项目——"温叙白看着邀约函，"规模太大了。我现在的团队可能接不了。"</p>\n<p>"那就扩团队。"陆峥寒说。</p>\n<p>"扩团队需要时间和资金——"</p>\n<p>"资金我来解决。时间——你说了算。"</p>\n<p>"峥寒，你不能一直给我——"</p>\n<p>"叙白。"陆峥寒打断他，"我不是在给你钱。我是在投资。投资你的才华、你的事业、你的梦想。这种投资的回报率，比任何商业项目都高。"</p>\n<p>温叙白看着他，说不出话。</p>\n<p>"而且——"陆峥寒笑了，"你是我老公。老公支持老公的事业，天经地义。"</p>\n<p>"你什么时候学会说这种话了？"</p>\n<p>"结婚那天。"</p>\n<p>温叙白忍不住笑了。</p>\n<p>最终，温叙白接受了中东项目。陆峥寒帮他对接了国际顶级工程团队，组建了一支跨国的设计施工联合体。</p>\n<p>项目启动那天，温叙白在工作室对全体员工说了一句话：</p>\n<p>"这个项目不只是我的。它是我们事务所的里程碑。我们一起做。"</p>\n<p>员工们鼓掌欢呼。</p>\n<p>晚上回家，温叙白对陆峥寒说："谢谢你一直在我身后。"</p>\n<p>"不是身后。"陆峥寒纠正，"是身边。"</p>\n<p>"好。"温叙白靠在他肩上，"身边。"</p>\n<div class="hook">**【本章钩子：普利兹克奖后的护航——陆峥寒成立专门团队保护温叙白的时间精力。"你就是我最大的事业"让温叙白说不出话。从后盾到身边人，两人的搭档关系达到了最完美的状态……】**</div>\n'},
  {title:'第127章 家庭日常，烟火幸福', vol:4, html:'<p>婚后半年。</p>\n<p>两人的生活已经完全进入了"老夫老妻"模式。</p>\n<p>早上七点半，陆峥寒起床做早餐。温叙白八点起来，两人一起吃饭。</p>\n<p>"今天的粥太稠了。"温叙白说。</p>\n<p>"昨晚水放少了。"</p>\n<p>"你做了半年粥了，还掌握不好水量？"</p>\n<p>"你做了半年红烧排骨了，糖还是放多。"</p>\n<p>"……互相不要嫌弃。"</p>\n<p>"好。"</p>\n<p>中午，陆峥寒必定打电话："吃了什么？"</p>\n<p>"食堂。"</p>\n<p>"食堂不好吃。我让林舟给你送——"</p>\n<p>"不用。食堂挺好的。"</p>\n<p>"叙白——"</p>\n<p>"我自己能照顾自己。你管好你的公司。"</p>\n<p>"好。但如果你想——"</p>\n<p>"我会说。"</p>\n<p>下午，温叙白会在工作间隙给陆峥白发一张照片——可能是设计图的细节、可能是工作室窗外的风景、也可能是随手画的一幅小画。</p>\n<p>陆峥寒每次都秒回，配一个表情包或一句话。</p>\n<p>晚上，两人一起回家做饭。</p>\n<p>周末，两人会一起去看电影、逛美术馆、或者就在家里窝着。</p>\n<p>有一次，两人在超市买菜。</p>\n<p>"峥寒，那个西红柿不好。"</p>\n<p>"为什么？"</p>\n<p>"颜色不均匀。要选均匀红的。"</p>\n<p>"你怎么知道？"</p>\n<p>"爷爷教的。"</p>\n<p>陆峥寒看着他认真挑西红柿的样子，忽然觉得——这个人从普利兹克奖得主变成了超市挑菜达人，反差大到可爱。</p>\n<p>"你在笑什么？"温叙白转头看他。</p>\n<p>"没什么。"</p>\n<p>"你笑了。"</p>\n<p>"我在想——你挑西红柿的样子比画普利兹克奖方案还认真。"</p>\n<p>"西红柿很重要。"</p>\n<p>"好好好，西红柿很重要。"</p>\n<p>两人买了菜回家，一起做饭。</p>\n<p>陆峥寒掌勺，温叙白打下手——洗菜、切菜、递调料。</p>\n<p>配合默契，不需要多余的语言。</p>\n<p>"盐。"</p>\n<p>递过去。</p>\n<p>"酱油。"</p>\n<p>递过去。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"今天的水放对了吗？"</p>\n<p>"……闭嘴做饭。"</p>\n<p>陆峥寒笑了。</p>\n<p>吃完饭，两人一起洗碗。温叙白洗，陆峥寒擦。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"你觉得幸福是什么？"</p>\n<p>温叙白想了想："幸福就是——你做饭，我洗碗。"</p>\n<p>"就这么简单？"</p>\n<p>"嗯。就这么简单。"</p>\n<p>陆峥寒看着他，在厨房的灯光下笑了。</p>\n<p>这就是他们最好的模样——不需要镁光灯和奖杯，不需要热搜和掌声。</p>\n<p>只需要一个厨房、一顿饭、一个人。</p>\n<p>烟火幸福，不过如此。</p>\n<div class="hook">**【本章钩子：婚后日常的烟火气——挑西红柿比画方案还认真，"幸福就是你做饭我洗碗"。普利兹克奖得主在超市挑菜，霸总在厨房掌勺。最平凡的日子，就是最珍贵的幸福……】**</div>\n'},
  {title:'第128章 陆老夫人传家宝', vol:4, html:'<p>婚后第八个月。</p>\n<p>陆老夫人八十岁大寿。</p>\n<p>寿宴在陆家老宅举办，规模不大，只有至亲好友。</p>\n<p>温叙白和陆峥寒一起回老宅祝寿。温叙白亲手设计了一份特殊的生日礼物——一幅手绘的老宅全景图，从庭院到花厅到书房，每一个角落都精细描绘。</p>\n<p>"叙白，这——"陆老夫人接过画，手微微发抖。</p>\n<p>"老夫人，这是老宅的样子。"温叙白说，"我画了一个月。"</p>\n<p>陆老夫人看着画上的老宅——那些她生活了几十年的角落，被温叙白的笔触一一还原。</p>\n<p>"好。"她说，"好。"</p>\n<p>寿宴上，气氛温馨热闹。陆瑶和林舟已经公开了恋情，两人坐在一桌，手牵着手。陆峥寒看到后，只是点了点头——他已经接受了这个事实。</p>\n<p>寿宴结束后，陆老夫人把温叙白单独叫到了花厅。</p>\n<p>"叙白。"</p>\n<p>"老夫人。"</p>\n<p>陆老夫人坐在红木椅上，看着温叙白，目光温和。</p>\n<p>"你和峥寒结婚半年了。"</p>\n<p>"嗯。"</p>\n<p>"他对你好吗？"</p>\n<p>"很好。"</p>\n<p>陆老夫人点了点头，然后从身边取出一个红木盒子。</p>\n<p>"这个给你。"</p>\n<p>温叙白打开盒子——里面是一块翡翠印章，通体碧绿，上面刻着"陆温"两个字。</p>\n<p>"这是——"</p>\n<p>"陆家的传家宝。"陆老夫人说，"从太爷爷那辈传下来的。以前是传给媳妇的——现在传给你。"</p>\n<p>"老夫人——"</p>\n<p>"叙白，你嫁进陆家半年，我看着你和峥寒的日子。"陆老夫人说，"你让他变了——变得柔软了，变得有温度了。这是我们陆家几代人都没有过的变化。"</p>\n<p>"这块印章不只是传家宝。"她看着温叙白，"它代表着——你是陆家的人。真正的陆家人。"</p>\n<p>温叙白看着手中的翡翠印章，碧绿的色泽温润如水。</p>\n<p>"谢谢老夫人。"他说，"我会好好保管。"</p>\n<p>"不是保管。"陆老夫人笑了，"是用。以后你的设计图上，都可以盖这个章。"</p>\n<p>温叙白微怔——这是一个建筑师的最高荣誉。用家族的印章盖在作品上，意味着家族对作品的认可和背书。</p>\n<p>"老夫人——"</p>\n<p>"好了，别婆婆妈妈的。"陆老夫人摆了摆手，"去吧，峥寒在外面等你。"</p>\n<p>温叙白走出花厅时，陆峥寒正在院子里等他。</p>\n<p>"祖母跟你说了什么？"</p>\n<p>温叙白把翡翠印章给他看。</p>\n<p>陆峥寒看着上面的"陆温"二字，沉默了。</p>\n<p>"这是太爷爷传下来的。"他说，"祖母一直没给任何人。"</p>\n<p>"她说——我是真正的陆家人。"</p>\n<p>陆峥寒看着他，眼眶微红。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你本来就是。"</p>\n<p>两人站在老宅的院子里，桂花树的叶子在风中沙沙作响。</p>\n<p>温叙白把印章收好，握住陆峥寒的手。</p>\n<p>"走吧。"他说，"回家。"</p>\n<p>"好。"</p>\n<p>回家的路上，温叙白看着车窗外掠过的灯光，忽然说：</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"我以前觉得——我只有一个人。"</p>\n<p>"现在呢？"</p>\n<p>温叙白低头看了看手上的戒指，又摸了摸口袋里的印章。</p>\n<p>"现在——我有爷爷，有你，有老夫人，有爸妈，有陆瑶，有林舟。"</p>\n<p>"我有一个家了。"</p>\n<p>陆峥寒握紧了他的手。</p>\n<p>"你一直都有。"</p>\n<p>"嗯。"温叙白靠在他肩上，闭上了眼，"现在我知道了。"</p>\n<div class="hook">**【本章钩子：陆老夫人传家宝——刻着"陆温"的翡翠印章，代表着家族最深的认可。"你是真正的陆家人"这句话，比任何奖杯都重。温叙白说"我有一个家了"——这是全书最温暖的时刻之一……】**</div>\n'},
  {title:'第129章 周年纪念，故地重游', vol:4, html:'<p>结婚一周年纪念日。</p>\n<p>陆峥寒的计划是——回到所有对他们有意义的地方。</p>\n<p>第一站：城东图书馆。</p>\n<p>这是他们故事的起点。七年前陆峥寒走进这里，找到了安宁。也是在这里，温叙白用爷爷的理念设计了第一座建筑。</p>\n<p>两人走进图书馆，坐在中庭的长椅上。</p>\n<p>"一年前，我们在这里办的婚礼。"陆峥寒说。</p>\n<p>"嗯。"</p>\n<p>"你还记得誓词吗？"</p>\n<p>"记得。"</p>\n<p>"哪句印象最深？"</p>\n<p>温叙白想了想："你负责设计，我负责守护。"</p>\n<p>"你呢？你的誓词里——"</p>\n<p>"你是第一个让我想画\'家\'的人。"温叙白说，"这句话我现在还记得。"</p>\n<p>"还是这个感觉吗？"</p>\n<p>"更深了。"</p>\n<p>第二站：滨水文化中心。</p>\n<p>这是温叙白获得UIA金奖的作品，也是两人并肩作战的见证。</p>\n<p>两人站在水景幕墙前——玻璃上刻着"WXB"三个字母，在阳光下闪着光。</p>\n<p>"这三个字母——"陆峥寒伸手摸了摸玻璃。</p>\n<p>"你刻的。"温叙白说。</p>\n<p>"当时你不知道。"</p>\n<p>"后来知道了。"</p>\n<p>"生气了吗？"</p>\n<p>"没有。"温叙白说，"觉得你很傻。"</p>\n<p>"傻吗？"</p>\n<p>"嗯。但傻得好。"</p>\n<p>陆峥寒笑了。</p>\n<p>第三站：温怀瑾社区图书馆。</p>\n<p>这是爷爷的梦想，也是陆峥寒送给温叙白最珍贵的礼物。</p>\n<p>两人走进图书馆，阳光从天窗洒下来，在地面上画出那个光圈——和婚礼那天一模一样。</p>\n<p>温叙白站在光圈里，仰头看着天窗。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你在这里向我求婚的。"</p>\n<p>"嗯。"</p>\n<p>"你说\'你愿意嫁给我吗\'。"</p>\n<p>"嗯。"</p>\n<p>"我说了\'我愿意\'。"</p>\n<p>"嗯。"</p>\n<p>"一年了。"温叙白转头看他，眼底有微光在闪烁，"一年了，我没有后悔过。"</p>\n<p>陆峥寒看着他，走上前，站在光圈里，和他面对面。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"我也没有。"</p>\n<p>"没有什么？"</p>\n<p>"没有后悔过。一秒都没有。"</p>\n<p>阳光洒在两人身上，温暖而明亮。</p>\n<p>图书馆里很安静，只有偶尔翻书的声音和远处孩子玩耍的笑声。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"谢谢你带我去过那么多地方。米兰、巴黎、东京、马尔代夫。"</p>\n<p>"但今天回到这里——"</p>\n<p>"这里才是最重要的地方。"温叙白说，"因为这些图书馆——是我们的故事。"</p>\n<p>陆峥寒握住他的手。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"下一年——"</p>\n<p>"下一年再去新的地方。"温叙白说，"但每年纪念日，都回来这里。"</p>\n<p>"好。"</p>\n<p>"每年。"</p>\n<p>"每年。"</p>\n<p>两人站在光圈里，手指交缠。</p>\n<p>窗外的阳光温暖，图书馆安静如初。</p>\n<p>一周年，只是开始。</p>\n<div class="hook">**【本章钩子：一周年纪念，故地重游——城东图书馆、滨水文化中心、温怀瑾社区图书馆。三个地方，三段记忆。"一年了，我没有后悔过"——这是最好的周年礼物。每年纪念日都回来这里，这是他们的约定……】**</div>\n'},
  {title:'第130章 朋友圈秀恩爱，日常暴击', vol:4, html:'<p>婚后第二年，温叙白开了一个朋友圈账号。</p>\n<p>在此之前，他几乎没有社交媒体——除了那个发过"嗯"字的微博。</p>\n<p>但结婚后，不知道被谁（陆峥寒）影响，他开始偶尔发朋友圈。</p>\n<p>内容很"温叙白"——</p>\n<p>第一条：一张设计图的局部照片，配文："改了第七版。"</p>\n<p>第二条：一张工作室窗外的夕阳照，配文："好看。"</p>\n<p>第三条：一杯茶的特写，配文："周伯寄来的新茶。"</p>\n<p>陆峥寒每条都秒赞，且评论：</p>\n<p>第一条："第七版也很好看。"</p>\n<p>第二条："你更好看。"</p>\n<p>第三条："我也想喝。"</p>\n<p>温叙白从不回复他的评论。</p>\n<p>但有一天，温叙白发了一条不同寻常的朋友圈。</p>\n<p>配图是一张照片——陆峥寒在厨房做饭的背影，穿着围裙，手忙脚乱。旁边的灶台上冒着热气。</p>\n<p>配文只有两个字："他做。"</p>\n<p>这条朋友圈发出后，温叙白的朋友们集体炸了。</p>\n<p>陆瑶评论："叙白哥你发朋友圈了！！还发了哥的照片！！"</p>\n<p>林舟评论："陆总做饭的背影好可爱。"</p>\n<p>事务所同事评论："温老师终于发非工作内容了！"</p>\n<p>温崇远评论："峥寒做的饭好吃吗？"</p>\n<p>苏敏华评论："叙白你要学做饭。"</p>\n<p>温叙白没有回复任何评论。</p>\n<p>但第二天，他又发了一条——</p>\n<p>配图是一碗面条，卖相一般。</p>\n<p>配文："我做的。"</p>\n<p>评论区再次炸了：</p>\n<p>陆瑶："叙白哥你做饭了！！好吃吗？"</p>\n<p>林舟："温老师做的面，一定很有设计感。"</p>\n<p>陆峥寒评论："好吃。"</p>\n<p>温叙白回复了陆峥寒的评论："你说了谎。"</p>\n<p>陆峥寒回复："没有。真的好吃。"</p>\n<p>温叙白没有再回复。</p>\n<p>但那天晚上，陆峥寒发现温叙白把那条朋友圈设成了仅自己可见。</p>\n<p>"你怎么设仅自己可见了？"陆峥寒问。</p>\n<p>"面太难看了。"温叙白说。</p>\n<p>"但好吃。"</p>\n<p>"你说谎。"</p>\n<p>"我没有。"</p>\n<p>"你每次都这样说。"</p>\n<p>"因为每次都是真的。"</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>"你越来越不像霸总了。"</p>\n<p>"在你面前，我从来不是。"</p>\n<p>从那以后，温叙白发朋友圈的频率变成了一周两三条。内容依然很"温叙白"——设计图、风景、偶尔发陆峥寒做饭的背影。</p>\n<p>每一条都是日常暴击——让看到的人又甜又酸。</p>\n<p>陆瑶有一次在群里说："叙白哥发朋友圈比发论文还积极，我哥功不可没。"</p>\n<p>林舟回复："陆总今天看到温老师发了他做饭的照片，笑了一整天。"</p>\n<p>陆峥寒在群里回复："我没有笑一整天。只笑了一上午。"</p>\n<p>温叙白回复了一个句号。</p>\n<div class="hook">**【本章钩子：温叙白开朋友圈了！"他做"和"我做的"两条朋友圈让全网炸锅。霸总评论"好吃"，温叙白回复"你说了谎"——这种日常暴击比任何秀恩爱都甜。婚后日常的甜蜜，从朋友圈开始……】**</div>\n'},
  {title:'第131章 未来规划，携手同行', vol:4, html:'<p>婚后第二年年底。</p>\n<p>一个冬天的晚上，两人在私宅的阳台上喝茶。海城的第一场雪刚刚下过，城市被白雪覆盖，安静而美丽。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你有没有想过——以后做什么？"</p>\n<p>"以后？"</p>\n<p>"不是明年、后年。是十年、二十年后。"</p>\n<p>陆峥寒想了想："十年后——陆氏应该已经完成转型，我打算逐步退居幕后。"</p>\n<p>"然后呢？"</p>\n<p>"然后——陪你。"陆峥寒看着他，"你去哪我去哪。你设计建筑，我给你泡茶。"</p>\n<p>"你不觉得无聊？"</p>\n<p>"跟你在一起，不会无聊。"</p>\n<p>温叙白看着他，嘴角弯了弯。</p>\n<p>"我的规划是——"他开口，"十年内，建十座社区图书馆。"</p>\n<p>"十座？"</p>\n<p>"嗯。以温怀瑾基金会的名义，在全国各地建十座社区图书馆。每一座都有不同的设计，但核心理念一样——温暖的、开放的、属于社区的。"</p>\n<p>"像城东图书馆一样？"</p>\n<p>"像城东图书馆一样。"温叙白说，"爷爷一辈子都想建社区图书馆。他只画了一张图，但我想建十座。"</p>\n<p>陆峥寒看着他，目光温暖："我支持你。资金、资源、土地——全部我来解决。"</p>\n<p>"你不用——"</p>\n<p>"我说过了。"陆峥寒握住他的手，"你负责设计，我负责守护。"</p>\n<p>温叙白看着他，没有再推辞。</p>\n<p>"还有一件事。"温叙白说。</p>\n<p>"什么？"</p>\n<p>"我想办一所建筑学校。"</p>\n<p>"建筑学校？"</p>\n<p>"嗯。不是传统的大学——是一个社区建筑学院。面向所有人开放，不收学费。教普通人如何用建筑改善自己的生活环境。"</p>\n<p>"爷爷以前说——建筑不应该只属于精英。每个人都应该有权利理解空间、改善空间。"</p>\n<p>陆峥寒看着他，忽然觉得——温叙白不只是一个建筑师。他是一个有使命的人。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你知道吗？你是我见过最有温度的人。"</p>\n<p>"你说过很多次了。"</p>\n<p>"因为每次听你谈未来，我都更加确认这一点。"</p>\n<p>温叙白看着他，清冷的眼底在雪光中格外柔和。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"这十年——你陪我建图书馆，我陪你做转型。"</p>\n<p>"好。"</p>\n<p>"二十年后——你退居幕后了，我带你去看全世界的建筑。"</p>\n<p>"好。"</p>\n<p>"三十年后——"</p>\n<p>"三十年后我们还活着？"陆峥寒笑了。</p>\n<p>"当然活着。"温叙白认真地说，"三十年后我们六十岁。还要看孙子辈的设计图。"</p>\n<p>"我们没有孙子。"</p>\n<p>"可以有。"</p>\n<p>陆峥寒看着他，愣了一秒，然后笑出了声。</p>\n<p>"叙白——你是在暗示什么？"</p>\n<p>"我在规划未来。"温叙白面无表情，"未来规划里包含下一代。"</p>\n<p>"你什么时候变得这么——"</p>\n<p>"这么什么？"</p>\n<p>"这么有烟火气了。"</p>\n<p>温叙白看着他，沉默了两秒。</p>\n<p>"被你传染的。"</p>\n<p>两人相视而笑。</p>\n<p>窗外大雪初停，城市银装素裹。</p>\n<p>他们有很长很长的未来，足够一起完成所有的梦想。</p>\n<div class="hook">**【本章钩子：未来规划——十座社区图书馆、一所社区建筑学院、全球建筑之旅、甚至下一代。温叙白不再只是一个建筑师，他是一个有使命的人。"被你传染的"——这是两人互相改变的最好证明。全书的终章即将到来……】**</div>\n'},
  {title:'第132章 最终番外：七年前的那座图书馆', vol:4, html:'<p>番外篇。</p>\n<p>七年前。</p>\n<p>陆峥寒二十一岁，刚从国外回来接手陆氏。</p>\n<p>那时候的他，年轻气盛但经验不足。董事会的老狐狸们处处掣肘，他提出的每一个方案都被否决，每一个决定都被质疑。</p>\n<p>他白天在会议室里据理力争，晚上一个人在办公室看到凌晨。</p>\n<p>"峥寒，你不要太拼了。"陆瑶那时候还在读高中，每次看到哥哥黑眼圈重了就心疼。</p>\n<p>"没事。"他总是这样说。</p>\n<p>但他知道自己快撑不住了。</p>\n<p>直到那天晚上。</p>\n<p>他开车经过城东，无意间看到了一座集装箱建筑——在老旧的社区中间，色彩明快的集装箱堆叠成不规则的形体，缝隙间透出暖色的灯光。</p>\n<p>他不知道为什么停了车。也许是因为那些灯光太温暖了，在黑暗的街道上像一个发光的港湾。</p>\n<p>他走进去。</p>\n<p>图书馆不大，但设计得很精巧。光线从集装箱的缝隙间洒进来，在地板上画出温暖的光带。木质书架沿着墙壁排列，角落里有几张旧沙发，一个小女孩在沙发上看绘本。</p>\n<p>他在角落坐下来，靠在墙上，闭上了眼。</p>\n<p>那种感觉——像是被空间本身抱住了。</p>\n<p>不是夸张。是真的感觉到了一种包裹感。光线的温度、空间的尺度、材质的触感——所有元素都恰到好处，让他的焦虑和疲惫一寸一寸地消退。</p>\n<p>他在那里坐了一整夜。</p>\n<p>天亮的时候，他站起来，走到门口的设计师介绍栏前。</p>\n<p>"设计师：温叙白。"</p>\n<p>他看着那个名字，念了一遍。</p>\n<p>温叙白。</p>\n<p>然后他掏出手机，搜索了这个名字。</p>\n<p>搜索结果不多——几篇建筑杂志的专访、一个个人作品集网站。但每一篇都让他越看越入迷。</p>\n<p>这个人的设计理念——"建筑是温柔的容器"。</p>\n<p>这个人说："公共空间不应该让人望而生畏，它应该像家的延伸。"</p>\n<p>这个人设计的图书馆——让一个在深夜崩溃的年轻人找到了安宁。</p>\n<p>陆峥寒站在图书馆门口，晨光照在他脸上。</p>\n<p>他做了一个决定。</p>\n<p>"我要认识这个人。"</p>\n<p>这个决定，改变了他的一生。</p>\n<p>——七年后，他在同一座图书馆里，向这个人求婚。</p>\n<p>那个人说："我愿意。"</p>\n<div class="hook">**【本章钩子（番外）：七年前的那座图书馆——一切的起点。一个在深夜崩溃的年轻人走进一座温暖的建筑，找到了安宁和方向。"我要认识这个人"——这个决定改变了一生。七年后，他在同一座图书馆里求婚。这就是命运……】**</div>\n'},
  {title:'第133章 最终番外：薄荷糖的秘密', vol:4, html:'<p>番外篇。</p>\n<p>温叙白有一个习惯——口袋里永远放着一盒薄荷糖。</p>\n<p>这个习惯从十二岁开始。</p>\n<p>爷爷去世后，温叙白的焦虑和强迫症开始严重。心理医生建议他用一些小物件来缓解焦虑——"当你觉得不安的时候，做一个小动作来让自己回到当下。"</p>\n<p>温叙白选择了薄荷糖。</p>\n<p>每次焦虑的时候，他就含一颗薄荷糖。薄荷的清凉感让他从纷乱的思绪中抽离出来，回到当下。</p>\n<p>这个习惯他保持了十五年。</p>\n<p>后来他遇到了陆峥寒。</p>\n<p>第一次见面时，温叙白正在晚宴上感到不适——人太多、声音太杂、空气太闷。他悄悄从口袋里摸出一颗薄荷糖含进嘴里。</p>\n<p>陆峥寒看到了。</p>\n<p>"你喜欢吃薄荷糖？"他问。</p>\n<p>"嗯。"温叙白面无表情。</p>\n<p>"什么牌子？"</p>\n<p>"随便。"</p>\n<p>但陆峥寒记住了。后来他每次见温叙白，口袋里都会放一盒薄荷糖——跟温叙白同一个牌子。</p>\n<p>"你怎么也有薄荷糖？"温叙白第一次注意到时问。</p>\n<p>"我也喜欢吃。"</p>\n<p>"你不是喜欢喝咖啡吗？"</p>\n<p>"咖啡和薄荷糖不冲突。"</p>\n<p>温叙白没有追问。</p>\n<p>但他注意到了——每次他摸口袋的时候，陆峥寒都会不动声色地递过来一颗薄荷糖。</p>\n<p>他以为陆峥寒只是细心。</p>\n<p>直到有一天，陆峥寒的西装外套忘在了他的工作室。温叙白拿起来时，从口袋里掉出了一盒薄荷糖——和温叙白一模一样的牌子，一模一样的口味。</p>\n<p>但盒子上的保质期已经过了三个月。</p>\n<p>"他根本不吃薄荷糖。"温叙白看着那盒过期的薄荷糖，忽然明白了。</p>\n<p>陆峥寒口袋里的薄荷糖，不是给自己准备的——是给温叙白准备的。</p>\n<p>每一盒、每一颗，都是为了他。</p>\n<p>那天晚上，温叙白把那盒过期的薄荷糖放进了自己的抽屉里。</p>\n<p>后来两人在一起了。温叙白有一次提起这件事：</p>\n<p>"你知道我什么时候开始心动的吗？"</p>\n<p>"什么时候？"</p>\n<p>"发现你口袋里的薄荷糖过期的时候。"</p>\n<p>"过期？"</p>\n<p>"你根本不吃薄荷糖。你口袋里的每一颗都是给我准备的。"温叙白看着他，"从什么时候开始的？"</p>\n<p>陆峥寒沉默了两秒："从第一次见你。"</p>\n<p>"所以——你口袋里放了十五年的薄荷糖？"</p>\n<p>"不是十五年。"陆峥寒纠正，"是七年。追你的七年。在一起之后就不用偷偷放了。"</p>\n<p>温叙白看着他，说不出话。</p>\n<p>"但你还是每天都放。"温叙白说。</p>\n<p>"习惯了。"陆峥寒笑了笑，"而且你有时候还是会焦虑。"</p>\n<p>"所以——"</p>\n<p>"所以我会一直放。"</p>\n<p>后来，温叙白工作室的抽屉里，有一整排过期的薄荷糖盒子——都是他从陆峥寒口袋里收来的。</p>\n<p>每一个盒子，都是一份无声的爱。</p>\n<div class="hook">**【本章钩子（番外）：薄荷糖的秘密——十五年的习惯，七年的蓄谋。陆峥寒口袋里永远有一盒给温叙白的薄荷糖。"发现你口袋里的薄荷糖过期的时候"——这就是心动的瞬间。最无声的爱，才是最深的偏爱……】**</div>\n'},
  {title:'第134章 最终番外：陆峥寒日记', vol:4, html:'<p>番外篇。</p>\n<p>陆峥寒有一个日记本。</p>\n<p>不是每天写，只在重要的日子写。</p>\n<p>第一篇——七年前。</p>\n<p>"今天走进了一座图书馆。集装箱搭的，在海城老城区。我坐了一整夜，第一次觉得世界没那么糟。设计师叫温叙白。我要认识他。"</p>\n<p>第二篇——五年前。</p>\n<p>"今天又去看了温叙白的新作品——一个乡村小学。设计很好，光线和空间的处理让人佩服。我托人打听了很多次，但还是没能正式认识他。他不参加社交活动，不出现在任何商业场合。像一个隐士。也许正因为如此，我更加想认识他。"</p>\n<p>第三篇——三年前。</p>\n<p>"机会来了。下个月有一场商业晚宴，温叙白被邀请了。我让人把我也安排在同一场。我准备了很多话题——关于建筑、关于设计、关于城东图书馆。但我知道，见到他的时候，我可能什么都说不出来。"</p>\n<p>第四篇——两年前。</p>\n<p>"今天终于认识了他。温叙白。他比照片上更好看，也更冷。全程没有笑过一次。但他的声音很好听——清冷而干净。我递给他一杯水，他说了\'谢谢\'。两个字。我开心了一整天。"</p>\n<p>第五篇——一年半前。</p>\n<p>"他开始对我破例了。第一次坐我的车，第一次吃我做的饭，第一次在我面前露出笑容。每一次破例，我都觉得——离他又近了一步。"</p>\n<p>第六篇——一年前。</p>\n<p>"今天在峰会上，沈知予当众摊牌了。他说我蓄谋了七年。是事实。但叙白没有因此疏远我——他选择了偏袒我。那一刻我知道，他对我的感觉，不只是心软。"</p>\n<p>第七篇——十个月前。</p>\n<p>"他告白了。在星空下，他说\'我喜欢你\'。我等了七年。七年。当他说出这三个字的时候，我觉得全世界都亮了。"</p>\n<p>第八篇——半年前。</p>\n<p>"我们结婚了。在城东图书馆。我念了誓词，没有念稿。他说\'你是第一个让我想画家的人\'。我哭了。在所有人面前。但我不在乎。"</p>\n<p>第九篇——今天。</p>\n<p>"叙白今天拿了普利兹克奖。我坐在台下，比他自己还紧张。当他的名字被念出来的时候，我流了一滴眼泪。</p>\n<p>他上台说\'感谢我的丈夫陆峥寒\'。</p>\n<p>丈夫。</p>\n<p>他叫我丈夫。</p>\n<p>七年前的那个晚上，我走进他设计的图书馆，以为只是找到了一个安宁的角落。我不知道那个角落会变成我的一生。</p>\n<p>叙白——谢谢你设计了那座图书馆。</p>\n<p>谢谢你让我走进去。</p>\n<p>谢谢你成为我的丈夫。</p>\n<p>余生很长。</p>\n<p>但只要有你在，每一天都不够长。"</p>\n<p>陆峥寒合上日记本，把它放在书架最里面的角落。</p>\n<p>这本日记，他从来没有给温叙白看过。</p>\n<p>也许有一天会给他看。也许不会。</p>\n<p>但不管怎样——这些文字，是他们故事最好的注脚。</p>\n<div class="hook">**【本章钩子（番外）：陆峥寒日记——从七年前到今天，九篇日记记录了整个故事。从"我要认识他"到"他叫我丈夫"，每一篇都是爱的里程碑。"谢谢你设计了那座图书馆，谢谢你让我走进去"——七年蓄谋，终于圆满……】**</div>\n'},
  {title:'第135章 最终番外：温叙白视角', vol:4, html:'<p>番外篇。</p>\n<p>温叙白视角。</p>\n<p>我第一次见到陆峥寒是在两年前的那场商业晚宴上。</p>\n<p>他递给我一杯水，笑着说："温先生，你好。"</p>\n<p>我当时觉得——这个人笑得太多了。我不喜欢话多的人。</p>\n<p>但我接过水的时候，手指碰到了他的手指。他的手很暖。</p>\n<p>那是我第一次注意到一个人的温度。</p>\n<p>后来他开始出现在我的生活里。</p>\n<p>每天接我下班。每天做早餐。每天打电话问我吃了什么。</p>\n<p>我一开始觉得烦。后来觉得习惯了。再后来——如果有一天他没来，我会觉得少了什么。</p>\n<p>我不确定那是什么感觉。我从来没有对任何人有过那种感觉。</p>\n<p>我以为是习惯。以为是因为他对我好。以为只是心软。</p>\n<p>后来沈知予在峰会上摊牌，说陆峥寒蓄谋了七年。我当时的第一反应不是愤怒，不是震惊——是心慌。</p>\n<p>我怕他是假的。怕他的温柔是算计。怕我对他的信任是错的。</p>\n<p>但他在所有人面前，从容地说出了真相。他说"我不后悔"。</p>\n<p>那一刻，我知道——他是真的。</p>\n<p>再后来，他带我去看爷爷的图纸。他说"我看得懂你"。</p>\n<p>我在那一刻彻底明白了——我对他的感觉，不是习惯，不是心软。</p>\n<p>是心动。</p>\n<p>只是我太迟钝了，迟钝了太久太久。</p>\n<p>告白那天晚上，在星空下，我说了"我喜欢你"。</p>\n<p>那是我这辈子说过的最难说出口的三个字。但说出来之后，我觉得整个人都轻了。</p>\n<p>他握住我的手，说"我也喜欢你"。声音在发抖。</p>\n<p>一个在商界叱咤风云的霸总，握着我的手在发抖。</p>\n<p>那一刻我知道——他对我的喜欢，比我以为的还要深。</p>\n<p>后来的事情——在一起、异地、重逢、公开、结婚——每一件事都像在验证一个事实：</p>\n<p>我选对了人。</p>\n<p>有人问我：你怎么知道他是对的人？</p>\n<p>我说不出答案。如果一定要回答——</p>\n<p>大概是：跟他在一起的时候，我不需要假装。不需要假装不焦虑、不需要假装合群、不需要假装温暖。</p>\n<p>他接受我的全部——清冷、迟钝、洁癖、强迫症、不爱说话。</p>\n<p>他说："每一种样子都想看一辈子。"</p>\n<p>所以——</p>\n<p>我也想让他看一辈子。</p>\n<p>这就是我的答案。</p>\n<div class="hook">**【本章钩子（番外）：温叙白视角——从"这个人笑得太多了"到"我选对了人"。一个清冷迟钝的人，用最朴素的语言讲述了自己的心动历程。"跟他在一起，我不需要假装"——这就是爱情最好的样子……】**</div>\n'},
  {title:'第136章 最终番外：林舟和陆瑶', vol:4, html:'<p>番外篇。</p>\n<p>林舟喜欢陆瑶很久了。</p>\n<p>久到他自己都记不清是从什么时候开始的。</p>\n<p>也许是从陆瑶第一次来陆氏总部找陆峥寒，风风火火地冲进办公室，喊了一声"哥"——林舟当时正在汇报工作，被她吓了一跳。</p>\n<p>"这是谁？"他问陆峥寒。</p>\n<p>"我妹妹。"陆峥寒头也不抬。</p>\n<p>林舟看着那个扎着马尾辫、笑得眼睛弯弯的女孩，心跳漏了一拍。</p>\n<p>从那以后，他开始注意陆瑶。</p>\n<p>注意她喜欢喝什么奶茶、注意她笑起来的样子、注意她每次来公司时穿的衣服。</p>\n<p>但他不敢说。</p>\n<p>一方面，她是陆峥寒的妹妹——他的老板的妹妹。另一方面，他只是个特助，配不上陆家的千金。</p>\n<p>所以他一直默默守着。帮陆瑶修电脑、帮她买限量版零食、帮她在公司里找丢了的东西。</p>\n<p>陆瑶每次都笑嘻嘻地说："谢谢你林舟哥！"</p>\n<p>林舟每次都说："不客气。"然后转过头，耳朵红得发烫。</p>\n<p>跨年夜那天，在花园里，他鼓起勇气握住了陆瑶的手。</p>\n<p>陆瑶没有挣开。</p>\n<p>他当时差点哭出来。</p>\n<p>后来两人在一起了。陆峥寒知道后，只是看了他一眼，说了一句："你知道后果。"</p>\n<p>林舟点头如捣蒜："知道知道。"</p>\n<p>陆瑶在旁边翻白眼："哥你别吓他。"</p>\n<p>"我没吓他。"陆峥寒说，"我在陈述事实。"</p>\n<p>林舟觉得——陆总陈述的事实，比吓人更可怕。</p>\n<p>但陆瑶拉着他的手说："别怕他。"</p>\n<p>林舟看着她，觉得——为了这双手，被陆峥寒吓一辈子也值了。</p>\n<p>后来陆瑶和林舟也结婚了——在陆峥寒和温叙白结婚一年后。</p>\n<p>婚礼很简单，在陆家老宅办的。</p>\n<p>陆峥寒在婚礼上致辞："林舟，你跟了我八年。今天开始，你不再是我的特助——你是我的妹夫。但如果你对我妹妹不好——"</p>\n<p>"不会的不会的！"林舟连忙说。</p>\n<p>全场笑了。</p>\n<p>温叙白坐在台下，难得地笑了。</p>\n<p>陆瑶穿着白色婚纱，笑着哭了。</p>\n<p>"林舟哥——"她说。</p>\n<p>"嗯？"</p>\n<p>"谢谢你等了我这么久。"</p>\n<p>林舟红着眼眶："值得。"</p>\n<div class="hook">**【本章钩子（番外）：林舟和陆瑶的故事——从暗恋到表白到结婚。"为了这双手，被陆峥寒吓一辈子也值了"。两对couple，两段幸福。陆峥寒的"你知道后果"成了全场最佳笑点……】**</div>\n'},
  {title:'第137章 最终番外：爷爷的信', vol:4, html:'<p>番外篇。</p>\n<p>温怀瑾社区图书馆落成一周年。</p>\n<p>温叙白在整理图书馆的档案时，在爷爷的旧物中发现了一封信。</p>\n<p>信封已经发黄了，上面写着："叙白亲启"。</p>\n<p>爷爷的笔迹。</p>\n<p>温叙白的手微微发抖，打开了信。</p>\n<p>"叙白：</p>\n<p>如果你看到这封信，说明我已经不在了。</p>\n<p>我知道你会难过。但你不是一个会被打倒的孩子——你比你以为的要坚强。</p>\n<p>我写这封信，不是为了告别。而是想告诉你一些我活着的时候没有说过的话。</p>\n<p>叙白，你是我见过最有天赋的建筑师。你的天赋不在于画图——而在于你对空间的感受力。你能感受到光线的温度、空间的呼吸、材质的情绪。这种感受力是教不出来的，是天生的。</p>\n<p>但你的弱点也是天生的——你不善于表达。你心里有很多温暖的东西，但你不知道怎么说出来。没关系。用建筑说。建筑就是你的语言。</p>\n<p>我没能完成那座图书馆。但我知道你会完成它——用你自己的方式。</p>\n<p>不要试图模仿我的线条。你有你自己的线条。</p>\n<p>叙白，人生很长。你会遇到很多人，但只有一个人能让你愿意为他打开门。等那个人出现的时候，不要犹豫。</p>\n<p>你值得被爱。</p>\n<p>爷爷"</p>\n<p>温叙白看着信，泪水无声地流了下来。</p>\n<p>他坐在图书馆中庭的长椅上，阳光从天窗洒下来，照在信纸上。</p>\n<p>"爷爷——"他轻声说，"你说的那个人，我遇到了。"</p>\n<p>"他叫陆峥寒。"</p>\n<p>"他帮我完成了你的图书馆。他以你的名字建了这座建筑。他在这里向我求婚。"</p>\n<p>"你说\'不要犹豫\'——我没有犹豫。"</p>\n<p>"你说的对。我值得被爱。"</p>\n<p>他把信折好，放回信封里。</p>\n<p>然后他拿出手机，给陆峥寒发了一条消息：</p>\n<p>【峥寒，今晚来图书馆接我。】</p>\n<p>【好。怎么了？】</p>\n<p>【爷爷给我留了一封信。】</p>\n<p>【……你还好吗？】</p>\n<p>【很好。比任何时候都好。】</p>\n<p>【那我等你。】</p>\n<p>温叙白收好手机，仰头看着天窗的阳光。</p>\n<p>"爷爷，谢谢你。"他说，"谢谢你教会我用建筑说爱。"</p>\n<p>"谢谢你告诉我——我值得被爱。"</p>\n<p>图书馆里很安静，阳光温暖如初。</p>\n<p>一封跨越了十五年的信，终于有了回音。</p>\n<div class="hook">**【本章钩子（番外）：爷爷的信——跨越十五年的爱。"你值得被爱"——这是一个老人对孙子最深的祝福。温叙白在图书馆的阳光中读完信，泪流满面。"爷爷，我遇到了。他没有犹豫。"这是全书最催泪的篇章……】**</div>\n'},
  {title:'第138章 最终番外：城东图书馆的十年', vol:4, html:'<p>番外篇。</p>\n<p>十年后。</p>\n<p>城东图书馆十周年。</p>\n<p>温叙白站在图书馆门口，看着这座他二十岁时设计的建筑。</p>\n<p>十年了。集装箱的颜色依然鲜艳，缝隙间透出的灯光依然温暖。</p>\n<p>社区为图书馆举办了一个小型纪念活动。来了很多人——有在这里看了十年书的老居民、有从小在这里长大的年轻人、还有温叙白事务所的年轻建筑师们。</p>\n<p>陆峥寒站在温叙白身边，头发已经有了一些银丝。三十八岁的他，依然英俊，但多了几分沉稳和温厚。</p>\n<p>"十年了。"他说。</p>\n<p>"嗯。"</p>\n<p>"你变了很多。"</p>\n<p>"变了什么？"</p>\n<p>"你会笑了。"</p>\n<p>温叙白看了他一眼，嘴角弯了弯。</p>\n<p>"是你让我学会的。"</p>\n<p>纪念活动上，社区的张大爷——现在已经八十多岁了——颤巍巍地站起来发言。</p>\n<p>"这座图书馆是叙白设计的。十年前它建起来的时候，我们社区的人都觉得——终于有一个好地方看书了。"</p>\n<p>"但后来我们发现——这里不只是看书的地方。孩子们放学后来这里写作业，老人们来下棋聊天，年轻人在这里办读书会。这里成了我们社区的客厅。"</p>\n<p>"叙白——"张大爷看着温叙白，"谢谢你。你爷爷如果看到今天，一定会很高兴。"</p>\n<p>温叙白站起来，微微鞠躬："谢谢张大爷。这座图书馆是爷爷的梦想，我只是用我的方式完成了它。"</p>\n<p>活动结束后，图书馆安静下来。</p>\n<p>温叙白和陆峥寒坐在中庭的长椅上——和十年前一样的位置。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你还记得十年前——你第一次来这里吗？"</p>\n<p>"记得。那天晚上，我坐在这把长椅上。"</p>\n<p>"长椅换过了。"</p>\n<p>"但位置一样。"陆峥寒看着头顶的天窗，"光线也一样。"</p>\n<p>"嗯。"</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"十年前我走进这里的时候，是一个在深夜崩溃的年轻人。"</p>\n<p>"现在呢？"</p>\n<p>"现在——"陆峥寒转头看他，"我是一个被你爱着的幸福的人。"</p>\n<p>温叙白看着他，清冷的眼底在十年间沉淀出了更深沉的温柔。</p>\n<p>"我也被你爱着。"他说。</p>\n<p>"嗯。"</p>\n<p>"十年了。"</p>\n<p>"还有下一个十年。"</p>\n<p>"还有下下一个。"</p>\n<p>"一直一直。"</p>\n<p>阳光从天窗洒下来，照在两人身上。</p>\n<p>十年前的那个夜晚，一个年轻人走进了一座图书馆，找到了安宁。</p>\n<p>十年后的今天，他坐在同一个地方，身边有了一个可以相伴一生的人。</p>\n<p>城东图书馆——一切的起点，永远的家。</p>\n<div class="hook">**【本章钩子（番外）：十年后的城东图书馆——一切如初，但一切都不一样了。温叙白会笑了，陆峥寒不再崩溃了。十年前的那个夜晚改变了两个人的一生。"还有下一个十年"——只要在一起，时间就是最好的礼物……】**</div>\n'},
  {title:'第139章 最终番外：偏爱', vol:4, html:'<p>番外篇。</p>\n<p>"偏爱"是什么？</p>\n<p>陆峥寒的答案是——</p>\n<p>偏爱是七年只追一个人。</p>\n<p>偏爱是口袋里永远有一盒薄荷糖。</p>\n<p>偏爱是在所有人面前冷酷，只在你面前撒娇。</p>\n<p>偏爱是走进你设计的建筑，就放下了所有的防备。</p>\n<p>偏爱是以你爷爷的名字建一座图书馆。</p>\n<p>偏爱是在图书馆的阳光中单膝跪地。</p>\n<p>偏爱是"你负责设计，我负责守护"。</p>\n<p>温叙白的答案是——</p>\n<p>偏爱是为一个人打破所有底线。</p>\n<p>偏爱是洁癖患者让他坐进自己的车里。</p>\n<p>偏爱是不爱说话的人，在他面前说了一辈子的"嗯"。</p>\n<p>偏爱是画了一座又一座图书馆，每一座都有他的影子。</p>\n<p>偏爱是"不管什么时候、怎么求，答案不会变"。</p>\n<p>偏爱是"你是第一个让我想画家的人"。</p>\n<p>偏爱是"跟你在一起，我不需要假装"。</p>\n<p>他们的故事告诉我们——</p>\n<p>偏爱不是轰轰烈烈的表白。</p>\n<p>偏爱是日复一日的陪伴。</p>\n<p>偏爱是十年如一日的薄荷糖。</p>\n<p>偏爱是沉默中说出的"我愿意"。</p>\n<p>偏爱是——</p>\n<p>在所有人中，只选你。</p>\n<p>在所有时刻，都在你身边。</p>\n<p>在所有未来里，都有你。</p>\n<p>这就是陆峥寒和温叙白的偏爱。</p>\n<p>也是我们每个人的偏爱。</p>\n<hr>\n<p>"陆峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你说的偏爱——持续了多久？"</p>\n<p>"七年。"</p>\n<p>"只有七年？"</p>\n<p>"不。七年只是开始。"</p>\n<p>"那到现在？"</p>\n<p>"到现在——一辈子。"</p>\n<p>"还有呢？"</p>\n<p>"还有下辈子。"</p>\n<p>"你不信下辈子。"</p>\n<p>"为了你，信了。"</p>\n<div class="hook">**【本章钩子（番外）：什么是偏爱？七年是开始，一辈子是过程，下辈子是承诺。薄荷糖、图书馆、"我愿意"——每一个细节都是偏爱的注脚。"在所有人中，只选你"——这就是全书的核心……】**</div>\n'},
  {title:'第140章 全书终章：偏爱无终，余生是你', vol:4, html:'<p>很多年后。</p>\n<p>温叙白和陆峥寒坐在城东图书馆的长椅上。</p>\n<p>两个人都老了。头发花白，皱纹爬上了眼角。但手还握在一起，十指相扣，和几十年前一样。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你还记得第一次来这里的样子吗？"</p>\n<p>"记得。那天下雨，我走进来，坐在角落里。"</p>\n<p>"那天下雨？"</p>\n<p>"嗯。下着小雨。你设计的屋顶不漏，但能听到雨声。"</p>\n<p>"我记得那个设计——屋顶的倾角让雨声变成了节奏。"</p>\n<p>"是的。那个晚上，我听着雨声睡了一觉。"</p>\n<p>"所以你是因为雨声才留下来的？"</p>\n<p>"不。"陆峥寒转头看他，"是因为光线。你设计的光线，让一个在黑暗中的人看到了亮。"</p>\n<p>温叙白看着他，笑了。</p>\n<p>即使老了，他的笑容依然清冷而温暖。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"如果时间可以重来——你还愿意走进这座图书馆吗？"</p>\n<p>"愿意。"</p>\n<p>"如果时间可以重来——你还愿意等七年吗？"</p>\n<p>"愿意。"</p>\n<p>"如果时间可以重来——你还愿意选我吗？"</p>\n<p>"愿意。"陆峥寒握紧他的手，"每一次都愿意。"</p>\n<p>图书馆里很安静，阳光从天窗洒下来，在地面上画出一个光圈。</p>\n<p>那个光圈——和几十年前婚礼那天一模一样。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"你画了一辈子的建筑。"</p>\n<p>"嗯。"</p>\n<p>"哪一座是你最满意的？"</p>\n<p>温叙白想了想："城东图书馆。"</p>\n<p>"为什么？"</p>\n<p>"因为这座建筑让你走进来了。"他说，"所有的建筑都是为了被人使用而设计的。但这座建筑——让你走进来，然后走进了我的生活。"</p>\n<p>"所以它不只是一座建筑。"</p>\n<p>"它是我们的开始。"</p>\n<p>陆峥寒看着他，眼眶微热。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"谢谢你。"</p>\n<p>"谢什么？"</p>\n<p>"谢谢你设计了这座图书馆。"</p>\n<p>"谢谢你让我走进来。"</p>\n<p>"谢谢你选择了我。"</p>\n<p>"谢谢你陪我走了一辈子。"</p>\n<p>温叙白看着他，清冷的眼底在午后的阳光中格外温柔。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"我也谢谢你。"</p>\n<p>"谢什么？"</p>\n<p>"谢谢你走进来了。"</p>\n<p>两人靠在一起，看着天窗洒下来的阳光。</p>\n<p>图书馆里传来翻书的声音、孩子的笑声、老人聊天的声音。</p>\n<p>这些声音，和几十年前一模一样。</p>\n<p>世界在变，城市在变，人在变。</p>\n<p>但这座图书馆没有变。</p>\n<p>他们的爱，也没有变。</p>\n<hr>\n<p>从蓄谋七年的初遇，到星空下的告白。</p>\n<p>从图书馆里的求婚，到婚礼上的誓言。</p>\n<p>从婚后的烟火日常，到白首的相守陪伴。</p>\n<p>陆峥寒和温叙白的故事——</p>\n<p>不是惊天动地的传奇，是细水长流的偏爱。</p>\n<p>不是轰轰烈烈的浪漫，是日复一日的陪伴。</p>\n<p>不是完美的童话，是两个不完美的人选择了彼此。</p>\n<p>然后一起变老。</p>\n<hr>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"下辈子——"</p>\n<p>"嗯？"</p>\n<p>"你还做霸总，我还做建筑师。"</p>\n<p>"好。"</p>\n<p>"然后你再走进我的图书馆。"</p>\n<p>"好。"</p>\n<p>"然后我们再在一起。"</p>\n<p>"好。"</p>\n<p>"每一次都在一起。"</p>\n<p>"每一次。"</p>\n<p>阳光温暖，岁月静好。</p>\n<p>偏爱无终，余生是你。</p>\n<p>—— 全书完 ——</p>\n<div class="hook">**【本章钩子（全书终章）：白首相伴，回到故事开始的地方。"谢谢你设计了这座图书馆，谢谢你让我走进来，谢谢你选择了我。"从蓄谋七年到白首相守，从第一颗薄荷糖到最后一次手指交缠。偏爱无终，余生是你。——全书完——】**</div>\n'},
];
let currentCh = 0;
function renderTOC() {
  const toc = document.getElementById('toc');
  let html = '';
  let lastVol = 0;
  chapters.forEach((ch, i) => {
    if (ch.vol !== lastVol) {
      lastVol = ch.vol;
      const volNames = {'1':'第一卷 初识拉扯','2':'第二卷 暧昧升温','3':'第三卷 告白确定','4':'第四卷 圆满收官'};
      html += `<div class="vol-header">${volNames[ch.vol]}</div>`;
    }
    html += `<a class="ch-link" data-idx="${i}" onclick="goToChapter(${i})">${ch.title}</a>`;
  });
  toc.innerHTML = html;
}
function goToChapter(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  currentCh = idx;
  const main = document.getElementById('main');
  main.innerHTML = `<div class="ch-content"><h2 class="ch-title">${chapters[idx].title}</h2>${chapters[idx].html}</div>`;
  window.scrollTo(0, 0);
  document.querySelectorAll('.ch-link').forEach(l => l.classList.remove('active'));
  const link = document.querySelector(`.ch-link[data-idx="${idx}"]`);
  if (link) link.classList.add('active');
}
function nextChapter() { if (currentCh < chapters.length - 1) goToChapter(currentCh + 1); }
function prevChapter() { if (currentCh > 0) goToChapter(currentCh - 1); }
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const btn = document.getElementById('toggle-sidebar');
  sb.classList.toggle('collapsed');
  main.classList.toggle('expanded');
  btn.classList.toggle('collapsed');
  btn.textContent = sb.classList.contains('collapsed') ? '▶' : '◀';
}
function filterChapters() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.ch-link').forEach(l => {
    l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevChapter();
  if (e.key === 'ArrowRight') nextChapter();
});
renderTOC();
goToChapter(0);
</script>
</body>
</html>
