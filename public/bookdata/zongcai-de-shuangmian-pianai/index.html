  {title:'第32章 情敌退场，各自安好', vol:1, html:'<p>深秋的海城，银杏金黄，落叶铺满街道。</p>\n<p>温叙白的工作室门前，沈知予独自站着，米白色风衣被秋风吹起一角，温润的眉眼间是沉淀过后的平和与释然。</p>\n<p>他手里提着一个纸袋，里面装着温叙白年轻时最爱吃的那家桂花糕——二十多年了，他每次来都会带，从不曾忘记。</p>\n<p>门开了，温叙白站在门口，目光落在他身上，微微一愣。</p>\n<p>"知予。"</p>\n<p>"叙白。"沈知予微微一笑，温润如玉，将纸袋递上前，"路过那家老店，顺手买的。"</p>\n<p>温叙白接过纸袋，沉默了两秒，侧身让开门："进来坐坐。"</p>\n<p>两人坐在工作室的会客区，温叙白泡了两杯清茶，气氛安静而平和，没有了从前暗流涌动的对峙感。</p>\n<p>沈知予环顾四周，目光落在墙上的建筑作品照片和奖杯上，温润的眼底掠过一丝感慨："你的事业越来越好了。城东文化中心的项目，我看了报道，设计很惊艳。"</p>\n<p>"谢谢。"温叙白淡淡应声。</p>\n<p>沉默片刻，沈知予深吸一口气，语气坦然而认真："叙白，我今天来，是想跟你说几句心里话。"</p>\n<p>温叙白放下茶杯，清冷的目光看向他，安静等待。</p>\n<p>"追了你二十多年，我一直觉得自己是最了解你、最适合站在你身边的人。"沈知予语气平和，带着释然后的通透，"但后来我发现，了解一个人和适合一个人，是两回事。"</p>\n<p>"陆峥寒的方式我做不到，他的破例我也给不了。"沈知予微微苦笑，"你为他打破的所有底线，是我二十多年来从未得到过的。不是我不够好，而是你对他，和对我不一样。"</p>\n<p>温叙白喉间微动，没有出声。</p>\n<p>"我退出了。"沈知予站起身，语气坦然，眉眼间没有了不甘和执念，只有释怀后的轻松，"叙白，你过得好，我就放心了。"</p>\n<p>他微微顿了顿，温润的目光带着真诚："如果他敢对你不好，告诉我，我第一个不放过他。"</p>\n<p>温叙白站起身，面容上罕见地露出一丝动容，他伸出手，语气认真："知予，谢谢你。"</p>\n<p>沈知予看着他伸出的手，微微一愣，随即笑着握住，力道恰到好处："不用谢，你幸福就好。"</p>\n<p>两人松手，沈知予转身走向门口，走到门边时忽然回头，温润的眉眼弯起一个释然的笑："叙白，以后……还是朋友？"</p>\n<p>"一直是。"温叙白淡淡点头，语气清冷却真诚。</p>\n<p>沈知予笑着点头，推门离去，背影挺拔从容，秋风吹起他的风衣衣角，渐行渐远。</p>\n<p>温叙白站在窗前，看着他消失在街角，眼底掠过一丝复杂的情绪，最终化为一声轻轻的叹息。</p>\n<p>二十多年的青梅竹马，到此画上句号。</p>\n<p>不遗憾，不怨恨，各自安好。</p>\n<p>手机震动，陆峥寒发来消息：【晚上想吃什么？我买菜过去。】</p>\n<p>温叙白看着屏幕，嘴角不自觉弯了弯，指尖回复：【你做什么我吃什么。】</p>\n<p>发完消息，他看了看手中的桂花糕纸袋，将它放在茶几上，转身回到制图台前。</p>\n<p>窗外秋阳正好，新的篇章已经翻开。</p>\n<div class="hook">**【本章钩子：沈知予释然退场，二十多年青梅竹马画上句号，各自安好。温叙白与陆峥寒的感情再无外部情敌阻碍。但第一卷的终章仍在酝酿——陆老夫人的最终态度，温叙白心底悄然萌芽的心动，一切即将迎来收束！】**</div>\n'},
  {title:'第33章 祖母认可，偏爱无碍', vol:1, html:'<p>初冬的海城，寒意渐浓。</p>\n<p>陆家老宅的院中，百年银杏落尽了金黄，枝桠光秃，在灰蒙蒙的天空下显得格外清冷。</p>\n<p>老夫人坐在暖阁里，手边搁着一杯热茶，面前摆着周伯刚送来的最新调查报告。</p>\n<p>报告很厚，详细记录了温叙白近几个月的一切——城东文化中心项目中标、竞标会上不卑不亢碾压刁难、联手陆峥寒破解周氏商业暗算、以及坦白旧事后对陆家的态度。</p>\n<p>每一条，都是实打实的能力和人品。</p>\n<p>老夫人翻到最后一页，是温叙白在美术馆与她交谈时的一段话记录——"值得珍惜的人，不会让你在事业和他之间做选择。"</p>\n<p>老夫人合上报告，摘下老花镜，沉默良久。</p>\n<p>"周伯。"</p>\n<p>"老夫人。"</p>\n<p>"你觉得，温叙白这个人，怎么样？"</p>\n<p>周伯微微一愣，随即认真回答："回老夫人，以老奴的观察，温先生为人清冷通透，不攀附不逢迎，能力出众，品性端正。最难得的是，他对少爷的心意是真的，不掺杂利益算计。"</p>\n<p>老夫人微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，端起茶盏浅抿一口。</p>\n<p>"给他下帖子。"老夫人忽然开口，语气平静却透着郑重，"请他来老宅喝杯茶。"</p>\n<p>周伯微微一怔，随即领会，躬身应道："是，老夫人。"</p>\n<p>三天后，温叙白独自来到陆家老宅。</p>\n<p>他穿着一身得体的浅灰色西装，清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，气质从容。踏入古朴庄严的正厅时，目光平静，没有丝毫紧张或拘谨。</p>\n<p>老夫人端坐在太师椅上，上下打量着他，目光审视而锐利。</p>\n<p>温叙白微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气清冷而礼貌："老夫人。"</p>\n<p>"坐。"老夫人声线平稳。</p>\n<p>温叙白依言落座，脊背挺直，姿态从容。</p>\n<p>老夫人没有绕弯子，开门见山："温叙白，我今天请你来，是想当面问你一句话。"</p>\n<p>"您请说。"</p>\n<p>"峥寒对你蓄谋了七年，他的心意我看到了。但我想知道——你对峥寒，是什么心思？是心软迁就，还是真心实意？"</p>\n<p>温叙白眼底掠过一丝认真，沉默两秒，缓缓开口，声线清冷而笃定："老夫人，我不是一个感情用事的人。"</p>\n<p>"峥寒对我好，我一开始只当是大佬偶尔脆弱，后来知道他是刻意的、蓄谋的。坦白说，我不喜欢被套路。"</p>\n<p>老夫人微微挑眉，没有出声。</p>\n<p>"但后来我发现，他的每一分温柔都是真的，每一分偏爱都是真的。"温叙白语气平稳，目光直视老夫人的眼睛，坦荡而真诚，"他对我的好，让我变成了一个更好的人。这就够了。"</p>\n<p>"至于您问的——是心软还是真心。"他微微停顿，嘴角弯起一个极淡的弧度，"我和他之间，已经不是心软可以解释的了。"</p>\n<p>老夫人静静看着他，目光深邃。</p>\n<p>良久，她微微弯唇，露出一个淡淡的笑容，语气里带着罕见的温和："好。"</p>\n<p>"温叙白，你过关了。"</p>\n<p>温叙白微微一怔，随即了然，面容上没有过多的惊喜或激动，只是微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气平静而真诚："谢谢老夫人。"</p>\n<p>老夫人摆了摆手，语气里多了几分长辈的随和："以后常来老宅坐坐，峥寒一个人撑着陆氏，身边有个知冷知热的人，我也放心。"</p>\n<p>温叙白耳尖微红，轻轻应了一声："好。"</p>\n<p>走出老宅大门时，冬日的暖阳恰好穿过云层，落在他的肩头，带着浅浅的暖意。</p>\n<p>他深吸一口气，清冷的眉眼间难得露出一丝轻松的笑意。</p>\n<p>陆峥寒的短信恰好发来：【见完祖母了？她为难你没有？】</p>\n<p>温叙白看着屏幕，指尖快速回复：【没有，你祖母人很好。让我以后常去。】</p>\n<p>对面秒回了三个感叹号：【！！！她这么说的？！】</p>\n<p>温叙白轻笑出声，收起手机，迈步走进冬日的暖阳里。</p>\n<p>身后，老宅正厅的窗口，老夫人望着他离去的背影，微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，对身旁的周伯淡淡道："这个孩子，配得上峥寒。"</p>\n<div class="hook">**【本章钩子：陆老夫人正式认可温叙白，家族阻力彻底化解！"配得上峥寒"——这五个字，比任何承诺都重。至此，第一卷所有障碍尽数扫清：情敌退场、旧事释然、家族认可。唯一剩下的，是温叙白心底那颗悄然萌芽的、尚未被自己察觉的种子——心动！】**</div>\n'},
  {title:'第34章 晨光微曦，心动萌芽', vol:1, html:'<p>这场冬雨来得突然。</p>\n<p>陆峥寒病了，是真的病了。</p>\n<p>连续一周高强度处理城东项目后续收尾工作，加上气温骤降，他终于在周三凌晨发起了高烧。</p>\n<p>林舟凌晨四点接到电话，匆忙赶到陆峥寒的住所时，发现他已经烧得神志不清，却依然固执地只肯让林舟通知一个人。</p>\n<p>"别告诉叙白……他明天有项目评审……别耽误他……"</p>\n<p>话没说完人就昏了过去。</p>\n<p>林舟没听他的，直接拨通了温叙白的电话。</p>\n<p>凌晨五点，温叙白接到电话，二话没说，披上外套就出了门。</p>\n<p>他赶到陆峥寒住所时，林舟刚给他喂完退烧药。偌大的主卧里灯光昏暗，陆峥寒躺在床上，面色潮红，眉头紧蹙，呼吸粗重而滚烫，整个人烧得迷迷糊糊。</p>\n<p>温叙白站在床边，目光落在他烧红的脸上，心底涌起从未有过的焦急和心疼。</p>\n<p>"医生怎么说？"他问林舟，声线清冷却带着微微的颤抖。</p>\n<p>"高烧三十九度五，劳累加受凉导致免疫力下降，需要静养休息。退烧药已经吃了，物理降温在做，应该明天能退烧。"</p>\n<p>温叙白微微点头，挥手示意林舟去休息："你去忙你的，我来看着他。"</p>\n<p>林舟微微一愣，随即微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，退了出去。</p>\n<p>温叙白在床边坐下，抬手将拧好的湿毛巾轻轻覆上陆峥寒滚烫的额头，动作轻柔而仔细。</p>\n<p>陆峥寒在昏沉中感受到额头上沁凉的触感，下意识微微侧头，呢喃了一声："叙白……"</p>\n<p>温叙白指尖微顿，心底被狠狠揪了一下。</p>\n<p>"嗯，我在。"他低声应答，声线比平时柔和了许多。</p>\n<p>陆峥寒似乎听到了，紧蹙的眉头微微松开，滚烫的手指下意识摸索着，抓住了温叙白搭在床边的指尖。</p>\n<p>握得很紧，像是在确认他在。</p>\n<p>温叙白看着他紧握自己的手，看着他烧红的面容和微微翕动的嘴唇，心底深处某个一直被刻意忽视的东西，忽然被猛烈地击中了。</p>\n<p>那种感觉说不清道不明，像是冰封已久的湖面忽然裂开一道缝隙，暖意从缝隙中涌出，势不可挡。</p>\n<p>他看着陆峥寒——这个在外杀伐狠绝、人人敬畏的商界阎王，此刻却像个脆弱的孩子，烧得迷迷糊糊，嘴里念着他的名字，手指死死攥着他的指尖不肯放。</p>\n<p>温叙白喉间发涩，眼眶微微发热。</p>\n<p>他从来不是一个感性的人，清冷自持，感情迟钝，习惯将所有情绪压在冰面之下。但此刻，看着这个为他蓄谋了七年、为他放下所有铠甲的男人，他心底的冰面，终于裂开了。</p>\n<p>原来这就是心动。</p>\n<p>不是轰轰烈烈的电光石火，而是在某个不经意的瞬间，看到他脆弱的模样，心疼得无法呼吸。</p>\n<p>温叙白没有抽回手，只是用另一只手轻轻替他掖了掖被角，低声说："好好休息，我在这儿。"</p>\n<p>陆峥寒在昏沉中似乎听到了这句话，嘴角微微弯起一个极浅的弧度，握着他手指的力道微微松了些，却始终没有放开。</p>\n<p>温叙白就这样在床边坐了一整夜，手指被他攥了一整夜。</p>\n<p>窗外，冬雨淅淅沥沥，天色从漆黑渐渐泛白。</p>\n<p>清晨六点，陆峥寒的烧终于退了。</p>\n<p>他缓缓睁开眼，目光涣散了几秒后聚焦，首先看到的，是温叙白靠在床头睡着了，面容带着倦意，手指还被自己紧紧攥在掌心。</p>\n<p>陆峥寒怔怔地看着他，喉咙发紧，眼眶忽然发热。</p>\n<p>他轻轻动了动手指，温叙白瞬间惊醒，清冷的目光立刻落在他脸上，带着掩饰不住的关切："烧退了？难受吗？"</p>\n<p>"叙白……你来了。"陆峥寒声音沙哑，语气里满是不敢置信的惊喜和心疼，"对不起，让你——"</p>\n<p>"别说话。"温叙白打断他，将手背贴上他的额头试了试温度，确认烧退后才微微松了口气，语气清冷却带着从未有过的温柔，"你烧了一整夜，先喝水。"</p>\n<p>他起身倒了一杯温水，扶着陆峥寒半坐起来，一勺一勺喂他喝。</p>\n<p>陆峥寒乖乖配合，但目光始终黏在温叙白脸上，眼底温柔得几乎要溢出来，带着劫后余生般的珍惜和感动。</p>\n<p>温叙白被他看得耳尖发红，语气故作冷淡："看什么，喝水。"</p>\n<p>"看你。"陆峥寒沙哑着声线，嘴角弯起一个虚弱却满足的笑容，"叙白，你心疼我了。"</p>\n<p>温叙白动作一僵，耳尖瞬间染红，没有承认也没有否认，只是将水杯塞到他手里，起身走向厨房："我去煮粥。"</p>\n<p>陆峥寒看着他的背影，看着他不自然的泛红的耳尖，虚弱地笑出了声。</p>\n<p>他感觉到了。</p>\n<p>温叙白对他的态度，在昨夜之后，发生了某种本质的变化。</p>\n<p>那层一直挡在他之间的、名为"迟钝"的冰，终于开始融化了。</p>\n<div class="hook">**【本章钩子：霸总真病了，迟钝美人守了一整夜，心动终于萌芽！冰面裂开的瞬间，比任何告白都动人。温叙白的感情从"安稳"变成"心疼"，这一步跨越，标志着他从被动接纳走向主动在意——第一卷即将终章！】**</div>\n'},
  {title:'第35章 第一卷终章：偏爱成局，风暴暂歇', vol:1, html:'<p>陆峥寒病愈后的第一个周末，海城难得放晴。</p>\n<p>冬日的暖阳穿透薄云，金色的光洒满整座城市，带着几分难得的温柔暖意。</p>\n<p>温叙白的私宅，客厅落地窗大敞，阳光铺了满地。</p>\n<p>陆峥寒系着围裙在厨房忙碌，温叙白坐在客厅沙发上翻看图纸，偶尔抬头看一眼厨房里忙碌的身影，嘴角不自觉弯起浅淡的弧度。</p>\n<p>这已经成为两人之间最寻常的周末日常。</p>\n<p>不知从什么时候开始，陆峥寒的衣物出现在温叙白的衣柜里，他的洗漱用品摆在温叙白的浴室中，他的拖鞋放在温叙白的鞋柜旁。两个人还没有正式确立关系，却已经活成了老夫老妻的模样。</p>\n<p>温叙白不觉得有什么不对，甚至觉得理所应当——这份不自知的亲近，比任何刻意的亲密都要动人。</p>\n<p>"叙白，好了。"陆峥寒端着两碗热气腾腾的阳春面走出来，放在餐桌上，语气软糯满足，"今天加了你爱吃的菌菇。"</p>\n<p>温叙白放下图纸走到餐桌前坐下，看着碗里干净清淡的面条，菌菇切得规整好看，汤色清亮，香气诱人。</p>\n<p>他拿起筷子，低头吃了一口，微微点头："好吃。"</p>\n<p>陆峥寒弯唇笑得温柔，在他对面坐下，安安静静吃面，目光却始终黏在他身上，像怎么看都看不够。</p>\n<p>饭后，两人并肩坐在沙发上晒太阳，各自忙碌——温叙白看图纸，陆峥寒处理邮件。</p>\n<p>安静的午后，阳光一寸寸移过地板，时间被这份默契拉得温柔而漫长。</p>\n<p>"峥寒。"温叙白忽然开口，清冷的声线里带着少有的慵懒。</p>\n<p>"嗯？"</p>\n<p>"我想在城东文化中心的入口处，加一个水景设计。"温叙白偏头看向他，眼底带着属于创作者的光芒，"光影、水流、建筑三位一体，你觉得怎么样？"</p>\n<p>"听起来很美。"陆峥寒认真想了想，"但会增加施工难度和预算。"</p>\n<p>"我知道，但这是我的设计理念，不想妥协。"温叙白语气笃定，"预算的事我来想办法。"</p>\n<p>"不用你想办法。"陆峥寒微微偏头看他，语气自然得不像话，"陆氏可以追加赞助，城东文化中心是海城的文化地标，多投一些值得。"</p>\n<p>温叙白微微一愣，随即摇头："不行，公私分明。这是我的项目，不能用你的钱。"</p>\n<p>"那就当作陆氏对海城文化建设的公益捐赠。"陆峥寒眨了眨眼，语气软糯认真，"和你公私分明，和陆氏的预算可没有私情。"</p>\n<p>温叙白看着他一本正经找借口的样子，忍不住弯了弯嘴角："你越来越会找理由了。"</p>\n<p>"被你传染的。"陆峥寒理直气壮，眼底笑意温柔。</p>\n<p>温叙白轻轻哼了一声，没有反驳，低头继续看图纸，耳尖却微微泛红。</p>\n<p>阳光从落地窗外斜斜照进来，将两人并肩而坐的身影拉得修长，光影交织，温暖而宁静。</p>\n<p>这一刻，没有商界的尔虞我诈，没有家族的暗流涌动，没有外界的喧嚣纷扰，只有两个人、一碗面、一图纸、一片暖阳。</p>\n<p>简单，却比什么都珍贵。</p>\n<p>温叙白看着图纸上的水景设计草图，指尖不自觉在上面勾勒着线条，心底忽然浮现出一个念头——</p>\n<p>他想在城东文化中心入口的水景旁，刻一行小字。</p>\n<p>不用太长，不用太醒目，只在角落里，安安静静。</p>\n<p>但他还没有想好该刻什么。</p>\n<p>或许等到那一天，他会知道答案。</p>\n<p>窗外，冬日的暖阳缓缓西移，将整座城市染成温暖的金色。</p>\n<p>---</p>\n<p>第一卷的故事，到这里暂告一段落。</p>\n<p>从商业晚宴的初遇，到步步靠近的温柔套路；从洁癖底线的反复破例，到峰会之上的真相摊牌；从温家旧事的沉重考验，到陆老夫人的最终认可；从情敌退场的释然放手，到深夜守候的心动萌芽。</p>\n<p>陆峥寒用了七年的蓄谋和数月的步步攻心，终于让那位清冷迟钝的美人，为他打破了一道又一道底线，走过了信任的危机，跨越了旧事的鸿沟，在不知不觉中，将心底最柔软的角落，悄悄留给了他。</p>\n<p>而温叙白也终于开始意识到，那份他一直以为是"心软迁就"的偏爱，早已在无数个细节里，生根发芽，长成了他再也无法忽视的模样。</p>\n<p>偏爱已成局，心动正萌芽。</p>\n<p>但他们的故事，才刚刚开始。</p>\n<p>第二卷的序幕即将拉开——暧昧升温、心动确认、更多甜蜜与挑战交织的篇章，正在前方等候。</p>\n<div class="hook">**【本章钩子（第一卷终章）：偏爱成局，心动萌芽，第一卷圆满收束！从初遇到心动，从破例到偏爱，陆峥寒与温叙白的故事才刚刚拉开序幕。第二卷即将开启：暧昧持续升温，心动逐渐清晰，更多甜爽交织的挑战即将到来——霸总的套路升级，美人的心动加速，双向奔赴的甜蜜盛宴即将上演！】**</div>\n'},
  {title:'第36章 初雪共白头', vol:2, html:'<p>海城的第一场雪，落在十二月末的清晨。</p>\n<p>温叙白拉开窗帘，看见整座城市被覆盖在一片纯白之中，雪花纷纷扬扬，安静而美丽。他的洁癖让他对泥泞脏乱格外抗拒，但雪不同——雪是干净的、纯粹的，是他少数不排斥的天气。</p>\n<p>手机响了，陆峥寒的消息：【下雪了，出来看雪。】</p>\n<p>温叙白看了眼窗外，嘴角不自觉弯了弯，回复：【我在看。】</p>\n<p>陆峥寒秒回：【一起看。我在你楼下。】</p>\n<p>温叙白微微一愣，走到窗边往下看，果然看到一辆黑色轿车停在楼下，陆峥寒站在车旁，仰头望着他的窗口，雪花落满他的肩头和发梢。</p>\n<p>他穿着黑色大衣，在漫天飞雪中显得格外挺拔，看到温叙白出现在窗口，立刻弯起唇角，眼底笑意温柔得几乎要融化整座城市的冰雪。</p>\n<p>温叙白心底微微发软，披上外套下了楼。</p>\n<p>"什么时候来的？"他问，清冷的声线在雪天里带着一丝微微的白雾。</p>\n<p>"雪一开始下就来了。"陆峥寒拍了拍肩上的雪，语气自然得不像在寒风中等了半个多小时，"想和你一起看第一场雪。"</p>\n<p>温叙白看着他冻得微微泛红的鼻尖和耳廓，心底泛起心疼的酸涩，没说什么，只是从口袋里掏出一条干净的围巾，踮脚围在他脖子上。</p>\n<p>陆峥寒微微一怔，随即眼底笑意炸开，暖意从围巾裹住脖颈的瞬间蔓延至全身。</p>\n<p>"走吧，去公园。"温叙白转身走在前面，语气清冷却柔和，"雪天的公园，应该没什么人。"</p>\n<p>两人并肩走在铺满白雪的小径上，雪花纷纷扬扬落在肩头。公园里果然人迹罕至，只有他们两行脚印，一左一右，并排延伸。</p>\n<p>走到湖边时，温叙白停下脚步，目光落在被雪覆盖的湖面上，安静而专注。</p>\n<p>陆峥寒站在他身侧，目光却始终落在他身上。</p>\n<p>雪花落在温叙白的黑色发丝上、纤长的睫毛上、纯白的围巾上，将他衬得像一幅画。陆峥寒看得有些失神，心底的贪恋和深情翻涌得几乎要溢出来。</p>\n<p>"叙白。"他轻声开口，语气带着从未有过的认真和温柔。</p>\n<p>"嗯？"</p>\n<p>"古人说，\'他朝若是同淋雪，此生也算共白头\'。"</p>\n<p>温叙白微微偏头看他，清冷的眼底映着漫天飞雪和他温柔的目光，心跳莫名漏了一拍。</p>\n<p>陆峥寒微微弯唇，眼底笑意温柔至极："和你淋了这场雪，就算共白头了。"</p>\n<p>温叙白喉间微动，耳尖和鼻尖瞬间染上绯色，心跳如擂鼓。他别开视线，语气故作冷淡："别矫情，回去吧，冻死了。"</p>\n<p>转身时，陆峥寒清晰看到他耳尖的红和嘴角压不住的弧度。</p>\n<p>他弯唇笑了，乖乖跟上，伸出手，自然而然地牵住了温叙白的手指。</p>\n<p>温叙白脚步微顿，低头看着两人交握的手——陆峥寒的手掌宽大温暖，指节分明，将他微凉的手指完全包裹在掌心。</p>\n<p>他没有抽回。</p>\n<p>雪花继续纷纷扬扬地落下，落在两人交握的手上、并肩的肩头上，安静而温柔。</p>\n<p>如果这就是共白头，那他愿意淋一辈子的雪。</p>\n<div class="hook">**【本章钩子：初雪共白头，温叙白首次不抗拒牵手，心动加速！暧昧升温的信号越来越强烈，迟钝美人的感情正在以前所未有的速度苏醒。第二卷的甜蜜盛宴正式开启！】**</div>\n'},
  {title:'第37章 装病被识破', vol:2, html:'<p>入冬以来，陆峥寒的"装病求关注"套路愈发频繁。</p>\n<p>这天下午，温叙白正在工作室处理图纸，收到陆峥寒的消息：【叙白，我好像又发烧了，头好晕。】</p>\n<p>附带一个可怜巴巴的表情。</p>\n<p>温叙白看着消息，清冷的眉峰微微蹙起。以前他会立刻心软赶过去，但自从那次陆峥寒真发烧、他守了一整夜之后，他对"陆峥寒生病"这件事的判断力，忽然变得敏锐了许多。</p>\n<p>他拨通了林舟的电话。</p>\n<p>"林舟，陆总今天什么情况？"</p>\n<p>林舟愣了一下，压低声音："陆总？陆总正在开跨国视频会议，精神得很，刚还训了三个部门经理……"</p>\n<p>他顿了顿，又补了一句："温先生，我能不能提个建议——您下次收到陆总说\'发烧了\'的消息，先别急着赶过去。上周三他说胃疼，我买了药冲过去，结果他在办公室吃炸鸡。上上周他说腰扭了，我带着骨科大夫上门，他在健身房跑步机上跑了五公里。"</p>\n<p>温叙白沉默了两秒。</p>\n<p>"……知道了。谢谢。"</p>\n<p>"不客气。"林舟挂了电话，在心底默默给自己的岗位描述加了一条——"总裁谎言鉴别师"。</p>\n<p>温叙白微微眯眼，眼底掠过一丝了然。</p>\n<p>他没有拆穿，只是淡定回复：【是吗？那你好好休息，别乱动。我刚好今天忙，晚点再去看你。】</p>\n<p>对面秒回：【！！！不用忙，我已经好多了，出来吃饭？】</p>\n<p>温叙白看着三个感叹号，轻笑出声。果然。</p>\n<p>半小时后，陆峥寒精神抖擞地出现在工作室门口，手里提着两份午餐，面色红润，目光炯炯，哪里有半分"发烧头晕"的样子。</p>\n<p>温叙白靠在门框上，双臂环胸，清冷的目光上下打量他，嘴角带着一丝似笑非笑的弧度："不是说发烧吗？"</p>\n<p>陆峥寒脚步一滞，耳尖一下子红了起来，心虚地别开视线："那个……退烧了，来得快去得也快。"</p>\n<p>"哦？"温叙白微微挑眉，"林舟说你正在开跨国视频会议，精神得很，还训了三个部门经理。"</p>\n<p>陆峥寒："……"</p>\n<p>温叙白看着他心虚的模样，终于忍不住弯了弯嘴角，语气清冷却带着浅浅的无奈和纵容："以后别装了。想见我就直说，不用找借口。"</p>\n<p>这句话轻飘飘落下，却像一颗石子投入陆峥寒心底的湖面，涟漪层层荡开。</p>\n<p>他微微抬眸，对上温叙白清冷却坦诚的目光，心跳猛地加速。</p>\n<p>温叙白转身往里走，语气故作平淡："进来吃饭，别在门口吹风。"</p>\n<p>陆峥寒看着他泛红的耳尖，心底欢喜几乎要溢出来，乖乖跟上。</p>\n<p>被识破了，但他一点也不觉得尴尬。因为温叙白说的那句话——"想见我就直说"——比任何套路都让他心动。</p>\n<p>从今天起，他不用再费心装病了。因为温叙白，已经默许了他的随时出现。</p>\n<div class="hook">**【本章钩子：装病套路首次被识破，温叙白一句"想见我就直说"让霸总彻底沦陷！从此告别装病套路，进入直球甜宠模式，暧昧升级势不可挡！】**</div>\n'},
  {title:'第38章 海外邀约，醋意暗涌', vol:2, html:'<p>新年伊始，一封来自海外的邮件打破了温叙白工作室的宁静。</p>\n<p>瑞士洛桑国际建筑双年展——全球建筑界最具影响力的盛会之一。邮件正文用英法双语写得很正式：温叙白被评为本届"年度青年建筑师"，邀请他前往洛桑出席颁奖典礼，并做主题演讲。</p>\n<p>温叙白看完邮件，手指在触控板上停了两秒。</p>\n<p>年度青年建筑师。这个奖他等了三年。上一届评委会以"年龄尚轻，待更多作品沉淀"为由将奖项旁落，他当时面上不动声色，心里确实有一丝不甘。三年过去，城东图书馆、滨水新区项目接连落成，这一次，没有人能再说"待沉淀"了。</p>\n<p>他拨出电话："林舟，帮我查一下一月下旬去洛桑的航班。"</p>\n<p>电话那头沉默了一秒："温总，这种事您是不是应该先告诉陆总？"</p>\n<p>"为什么？"</p>\n<p>"因为您要是不先告诉他，他知道了会闹。"</p>\n<p>温叙白挂了电话，想了想，给陆峥寒发了条消息：【收到瑞士一个奖，一月底去领。】</p>\n<p>三秒后回复炸回来：【什么奖？！】</p>\n<p>【年度青年建筑师，双年展的。】</p>\n<p>【叙白你太厉害了！！！这个奖含金量极高，你实至名归！什么时候的典礼？我陪你去！】</p>\n<p>温叙白看着连续三个感叹号，嘴角不自觉地弯了一下。陆峥寒在外面是出了名的惜字如金——跟商业对手谈判时，一个"嗯"字都吝啬。但和他发消息时，感叹号永远不够用。</p>\n<p>【颁奖典礼一月二十八日。你公司不忙？】</p>\n<p>【不忙。什么都不忙。什么都没有你重要。】</p>\n<p>温叙白没再回，放下手机继续看方案图。但屏幕暗下去之前，他发现自己嘴角那个弧度一直没收回来。</p>\n<hr>\n<p>一月中旬，开始筹备行程时，一通海外电话打了进来。</p>\n<p>来电显示：Luc Moreau。</p>\n<p>温叙白接起来，对面传来一口带法国口音的英语，语调热情洋溢："Bonjour, Monsieur Wen！我是Luc Moreau，双年展组委会理事，也是今年评委会成员。打电话是想跟您介绍典礼当天的流程安排——另外，我个人非常期待您的主题演讲。"</p>\n<p>温叙白切换到英语频道，声线清冷而得体："谢谢，Moreau先生。请讲。"</p>\n<p>两人用英语聊了十分钟，从典礼流程聊到演讲主题，又聊到温叙白在城东图书馆项目中运用的自然光线设计。Moreau对建筑的理解相当专业，温叙白难得在一个社交电话里没有感到不耐烦。</p>\n<p>挂电话时，Moreau用了一句话收尾："Wen，我很欣赏你的设计理念。期待在洛桑见到你——也许我们可以抽时间喝一杯？我认识几位欧洲建筑事务所的合伙人，他们对你的作品很感兴趣。"</p>\n<p>"好的，谢谢。"温叙白挂了电话，没太在意。</p>\n<p>但坐在沙发上、全程旁听这通电话的陆峥寒，在意了。</p>\n<p>他注意到温叙白提到"Luc"时，语气比平时柔和了几分——其实只是从"清冷"变成了"清冷但不排斥"，但在陆峥寒的雷达里，这已经足以亮红灯。</p>\n<p>"那位Luc Moreau，是什么人？"陆峥寒问，语气随意得过了头。</p>\n<p>"双年展理事，也是评委。"温叙白低头整理行程资料，"学术功底很扎实，在结构工程和空间叙事方向都有论文发表。"</p>\n<p>"听起来你对他评价很高。"</p>\n<p>温叙白抬头看了他一眼。那双眼底掠过一丝了然的笑意——极淡，但陆峥寒没错过。</p>\n<p>"你吃醋了？"</p>\n<p>"没有。"陆峥寒条件反射否认，耳尖开始泛红。</p>\n<p>温叙白没有戳穿。他放下手里的资料，看着陆峥寒微微绷紧的下颌线，觉得有些好笑——堂堂陆氏掌权人，在外让无数对手闻风丧胆，此刻却因为一通工作电话，醋意浓到快溢出来。</p>\n<p>"这次去瑞士，你全程陪我。"温叙白说，语气平淡得像在交代工作。</p>\n<p>陆峥寒一愣。</p>\n<p>"不管别人是谁，"温叙白垂下眼，继续整理资料，耳尖比陆峥寒还红，但声线稳得像念设计参数，"我身边的位置，只留给你。"</p>\n<p>陆峥寒的醋意在这一刻烟消云散。他乖巧地点头："好，全程陪着你。"</p>\n<hr>\n<p>当天晚上十点，林舟收到了一条微信。</p>\n<p>来自陆峥寒：【查一下Luc Moreau。详细背景。包括婚姻状况、性取向、所有社交关系。】</p>\n<p>林舟看着这条消息，默默叹了口气。</p>\n<p>老板的醋坛子，又翻了。</p>\n<p>他想了想，还是多嘴问了一句：【陆总，温总知道吗？】</p>\n<p>【不需要他知道。】</p>\n<p>林舟收起手机，认命地打开电脑。他已经很擅长查这类资料了——这半年里，从沈知予到陆廷远，再到现在的Luc Moreau，他的业务范围正在从"总裁特助"向"私家侦探"稳步转型。</p>\n<p>凌晨一点，报告发到陆峥寒邮箱：Luc Moreau，四十二岁，法国人，已婚，有两个孩子，性取向正常，无任何值得关注的社会关系。与温叙白纯粹是专业层面的交集。</p>\n<p>陆峥寒看完报告，终于安心地睡了。</p>\n<p>第二天早上，温叙白看到他精神不错，随口问了一句："睡得好？"</p>\n<p>"嗯。"陆峥寒笑得乖巧，"做了个好梦。"</p>\n<p>温叙白"嗯"了一声，没多问。</p>\n<p>他不知道陆峥寒的"好梦"，是因为确认了情敌不存在。</p>\n<div class="hook">**【本章钩子：海外邀约引发醋意，霸总暗戳戳查情敌背景！温叙白一句"身边的位置只留给你"化解醋意。瑞士之行即将启程，异国浪漫之旅即将展开！】**</div>\n'},
  {title:'第39章 雪国之旅，异国暧昧', vol:2, html:'<p>一月二十六日，苏黎世转机，两人抵达洛桑。</p>\n<p>阿尔卑斯山被皑皑白雪覆盖，空气清冽得像被过滤了三遍。温叙白下飞机时深深吸了一口气——他的洁癖让他对空气质量极其敏感，海城的冬天有雾霾，而这里的空气干净到让他的鼻腔都放松下来。</p>\n<p>"冷吗？"陆峥寒从行李架上取下两人的行李。</p>\n<p>"还好。"温叙白顿了顿，"空气很好。"</p>\n<p>陆峥寒笑了。温叙白说"空气很好"的意思是——他不讨厌这个地方。以温叙白对陌生环境的排斥程度，这已经是很高的评价了。</p>\n<p>酒店定在日内瓦湖畔，推开窗就能看见湖面和远处的雪山。温叙白站在窗前看了很久，目光落在湖面上几只游弋的天鹅身上，表情比平时柔和了几分。</p>\n<p>颁奖典礼定在二十八号晚上，之前有两天自由活动时间。陆峥寒查过攻略，没有安排太满的行程——温叙白不喜欢赶场，他更喜欢在一个地方慢慢待着。</p>\n<hr>\n<p>第一天，两人沿着湖畔散步。</p>\n<p>一月的洛桑气温在零度上下，湖面上笼着一层薄雾。街道两旁的百年建筑外墙爬满了枯藤，石板路被积雪和融水打湿，反射着灰白色的天光。</p>\n<p>温叙白走得慢，目光不时扫过路边的建筑。这是他的职业本能——到了任何一座城市，第一反应永远是看建筑。</p>\n<p>"这栋是十九世纪的新古典主义。"他停在一栋湖畔老宅前，目光落在立面比例上，"窗墙比偏保守，但底层拱廊的尺度很好，人的视线会自然被引向湖面。"</p>\n<p>陆峥寒站在他身后，听他讲建筑。</p>\n<p>他听不太懂"窗墙比"和"拱廊尺度"，但他喜欢听温叙白说话——在专业领域里，温叙白会变得专注而松弛，语气里有一种不易察觉的热情，像冰层下面流动的暖水。</p>\n<p>"好看吗？"陆峥寒问。</p>\n<p>温叙白以为他问建筑："比例还行。"</p>\n<p>"我问的不是建筑。"</p>\n<p>温叙白回头看他，陆峥寒正望着他，目光里带着笑意。</p>\n<p>温叙白对上那道视线，耳朵动了一下，转回头继续走："走了。"</p>\n<p>陆峥寒跟上，悄悄弯了嘴角。</p>\n<hr>\n<p>中午，两人在湖畔一家百年咖啡馆坐下。木制横梁、铜制吊灯、深色皮椅，空气里弥漫着咖啡豆和黄油的香气。</p>\n<p>温叙白点了一杯热巧克力和一块巧克力蛋糕。陆峥寒点了咖啡和三明治。</p>\n<p>蛋糕端上来时，温叙白看了一眼——巧克力淋面光滑无瑕，装饰简洁，摆盘符合他的强迫症审美。他切了一小块放进嘴里，微微点头。</p>\n<p>陆峥寒看着他的表情，自己也笑了。他不太吃甜食，但温叙白满足的样子比任何甜食都甜。</p>\n<p>吃到一半，陆峥寒发现窗外飞来几只天鹅，停在湖边的栏杆旁。他拿出手机拍了一张，角度选了好久——不是拍天鹅，是拍温叙白吃蛋糕时窗户上映出的侧影。</p>\n<p>快门声被温叙白听到了。</p>\n<p>"你在拍什么？"</p>\n<p>"天鹅。"</p>\n<p>温叙白瞥了一眼他的手机屏幕——上面分明是他的侧影，天鹅只占了画面边角。</p>\n<p>他没揭穿，低头继续吃蛋糕，但拿叉子的手指比刚才紧了一点。</p>\n<hr>\n<p>第二天傍晚，两人乘缆车登上山顶观景台。</p>\n<p>海拔两千米的山顶，气温骤降到零下十五度。温叙白把围巾往上拉了拉，遮住下半张脸。陆峥寒从包里掏出提前准备的暖手宝，塞进他手里。</p>\n<p>"你什么时候准备的？"</p>\n<p>"出发前就塞包里了。"陆峥寒语气理所当然，"你怕冷又不肯多穿。"</p>\n<p>温叙白握着暖手宝，没说话。</p>\n<p>夕阳正在西沉。</p>\n<p>阿尔卑斯山的雪峰被染成金红色，云海在脚下翻涌，壮丽得让人屏息。天空从西边的橘金渐变到头顶的深蓝，几颗早起的星星已经迫不及待地冒了头。</p>\n<p>山顶很冷，风很大，但两人谁都没提下山。</p>\n<p>"叙白。"陆峥寒轻声开口，语气带着从未有过的郑重，"谢谢你让我陪你来越洋领奖。"</p>\n<p>温叙白看着远处的日落，没有转头。</p>\n<p>"你能见证对我来说比什么都重要。"陆峥寒继续说，声音被风削得有些模糊，"我见过你在海城的样子——在工作室画图、在工地检查、在会议室跟甲方据理力争。但这是你第一次站上国际舞台，你让我来，这意味着……"</p>\n<p>他停了一下，好像在斟酌措辞。</p>\n<p>"意味着你愿意让我看到你最骄傲的样子。"</p>\n<p>温叙白喉间微涩。</p>\n<p>他看着金红色的天际线，心底有什么东西在松动。不是那种惊天动地的心动——温叙白不相信一见钟情式的悸动。而是一种缓慢的、持续的、像温水煮青蛙一样的知觉：这个人懂他。</p>\n<p>不是泛泛地懂，是精准地懂。懂他在意什么，懂他骄傲什么，懂他需要什么。</p>\n<p>他转头看向陆峥寒。</p>\n<p>夕阳把陆峥寒的侧脸镀上一层金光，他的睫毛在余晖中投下细密的阴影，神情认真而温柔——和在商场上那个<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>的陆总判若两人。</p>\n<p>温叙白忽然有一种冲动。</p>\n<p>他想伸出手，牵住身边这个人的手。</p>\n<p>这个念头冒出来的时候，他自己都吓了一跳。他的洁癖让他排斥皮肤接触，但此刻这个冲动清晰到无法忽视。</p>\n<p>他犹豫了一秒。</p>\n<p>然后，他伸出了手。</p>\n<p>修长白皙的指尖，轻轻碰了碰陆峥寒搭在石栏上的手背。触感冰冷——陆峥寒的手比他更凉，因为他把暖手宝给了温叙白。</p>\n<p>陆峥寒猛地转头，眼底满是不可置信的惊喜。瞳孔微微放大，嘴唇张开又合上，像是有一千句话想说，却全部堵在喉咙里。</p>\n<p>温叙白没有看他，耳尖红得几乎要滴血。他语气故作平淡："山上冷，手别放在石栏上。"</p>\n<p>理由拙劣到可笑。</p>\n<p>陆峥寒低头看了看自己的手，又看了看温叙白的手指——两人在石栏上几乎贴在一起。他翻转手掌，轻轻握住了那只微凉的手指。</p>\n<p>温叙白没有抽回。</p>\n<p>他的手指在陆峥寒掌心里僵了一瞬，然后缓缓放松下来。</p>\n<p>夕阳继续下沉，金红色的光将两人交握的手影拉得很长，投在山顶积雪上，像一幅安静的剪影画。</p>\n<p>异国雪山之巅，落日余晖中，他们完成了一次<span class="annot" data-tip="彼此心里明白，不用明说">心照不宣</span>的双向奔赴。</p>\n<p>没有告白，没有拥吻，只有两只手在风中默默相握。</p>\n<p>但这一刻的分量，比任何誓言都重。</p>\n<div class="hook">**【本章钩子：异国雪山之巅，温叙白首次主动触碰陆峥寒，双向奔赴信号前所未有地强烈！颁奖典礼即将到来，让陆峥寒暗暗吃醋的Luc Moreau即将正式登场！】**</div>\n'},
  {title:'第40章 颁奖之夜，暗潮涌动', vol:2, html:'<p>一月二十八日，洛桑大剧院。</p>\n<p>颁奖典礼定在晚上七点，但温叙白从下午三点就开始准备了。</p>\n<p>不是因为他在意穿着——他对服装的态度一向是"干净、合身、不碍事"即可。而是因为这次的主题演讲需要反复确认细节。他坐在酒店书桌前，把演讲稿从头到尾默念了三遍，又把PPT里的每张图片检查了两遍。</p>\n<p>陆峥寒坐在旁边看他，手里拿着一杯咖啡，没催也没打扰。</p>\n<p>他认得这个状态的温叙白——专注、紧绷、追求完美。城东图书馆开幕前他也是这样，反复确认每一个参数，像一个即将上战场的将军在检查弹药。</p>\n<p>"第三部分的那张图，"陆峥寒忽然开口，"右下角的数据标注颜色偏淡了。"</p>\n<p>温叙白低头一看，果然——投影仪光线打上去后，浅灰色标注会看不清。他改成了深灰。</p>\n<p>"谢了。"</p>\n<p>"不客气。"陆峥寒笑了一下，"你负责惊艳全场，我负责帮你挑刺。"</p>\n<hr>\n<p>六点半，两人抵达洛桑大剧院。</p>\n<p>剧院是一座十九世纪的巴洛克风格建筑，穹顶壁画繁复华丽，水晶吊灯将大厅映得流光溢彩。来宾阵容堪称全球建筑界全明星——普利兹克奖得主、双年展历届主席、各国的顶级事务所合伙人，温叙白走进去时，至少有二十个人主动向他点头致意。</p>\n<p>温叙白穿了一身白色西装，简洁干净——这是他唯一在意的着装标准。陆峥寒照例是黑色高定，两人并肩走进大厅时，一个白一个黑，像一组对比色。</p>\n<p>陆峥寒注意到温叙白的后背绷得很直——这是他紧张的表现。外人看不出来，因为温叙白面上永远是那副清冷疏离的表情，但陆峥寒认得他每一根绷紧的神经。</p>\n<p>他不着痕迹地碰了碰温叙白的手肘。</p>\n<p>温叙白微微侧目。</p>\n<p>陆峥寒没说话，只是给了他一个眼神——很轻、很淡，意思是"我在"。</p>\n<p>温叙白的后背松了一分。</p>\n<hr>\n<p>七点整，典礼正式开始。</p>\n<p>双年展主席致辞后，开始逐项颁奖。年度青年建筑师是当晚最重磅的奖项之一，排在第七个。</p>\n<p>前六个奖项颁发时，温叙白坐在台下，表情平静。陆峥寒坐在他旁边，心里比他还紧张——他的腿在微微抖，但手放在膝盖上，没人看得出来。</p>\n<p>"下面颁发——年度青年建筑师奖。"</p>\n<p>全场安静了一拍。</p>\n<p>主持人拆开信封，念出名字："温叙白，中国。"</p>\n<p>全场掌声雷动。</p>\n<p>温叙白起身，整了整西装领口，步伐沉稳地走上领奖台。聚光灯打在他身上，他接过奖杯，面向全场微微鞠躬。</p>\n<p>然后，他开始了主题演讲。</p>\n<p>他的英语流利而优雅，发音带着一点不易察觉的清冷质感，像冬日早晨的第一杯黑咖啡。</p>\n<p>"建筑不是冰冷的钢筋水泥。"他说，目光扫过全场，"它是人与空间之间最温柔的对话。是光线教我们如何感受时间，是墙壁教我们如何定义安全，是屋顶教我们如何与自然共处。"</p>\n<p>"我设计的城东图书馆，用了十二个退役海运集装箱改造。很多人问我为什么选这个材料——因为集装箱是被遗弃的工业废品。它们的波纹钢壁导热系数高，夏天烫手冬天结霜，作为建筑材料来说几乎是最差的选择。"</p>\n<p>他停了一拍。</p>\n<p>"但我用了双层中空聚碳酸酯板做内衬，中间留了八厘米的空气层——隔热、隔音、透光。白天阳光穿过聚碳酸酯板进入室内，波纹钢壁的凹凸纹理在光线上留下重复的阴影图案，像海浪——集装箱的上一段人生是海运，下一段人生是图书馆，海浪是它们之间的交接仪式。"</p>\n<p>全场安静了一拍。</p>\n<p>"建筑的意义不在于昂贵，而在于让每一个走进来的人，都觉得这个空间是为他而存在的。"</p>\n<p>全场寂静了两秒，然后掌声从后排向前排涌来，最终变成全场起立鼓掌。</p>\n<p>台下的陆峥寒看着温叙白站在聚光灯下的样子——清冷、笃定、发着光——眼眶微微发热。</p>\n<p>这个人等这个奖等了三年。他配得上。</p>\n<hr>\n<p>酒会环节在大剧院的附属宴会厅举行。</p>\n<p>温叙白被各路建筑界大佬围住，从普利兹克奖评委到欧洲顶级事务所合伙人，纷纷来敬酒祝贺。他用清冷但得体的姿态一一应对，不卑不亢，恰到好处。</p>\n<p>陆峥寒端着酒杯站在不远处，没有凑过去。这种专业场合，他一个商人不适合插话。但他一直在看温叙白——看他应付社交的样子，看他偶尔流露的专业热情，看他在人群中被灯光镀上金边的侧脸。</p>\n<p>Luc Moreau是酒会上第一个走到温叙白面前的人。</p>\n<p>四十二岁，法国人，高鼻深目，举止优雅，笑起来有一种拉丁裔特有的热情。他握住温叙白的手，握的时间比社交礼仪多了一秒，目光中的欣赏溢于言表。</p>\n<p>"Wen，你的演讲太精彩了。"Moreau用英语说，语调热忱，"尤其是关于\'建筑是温柔对话\'的理念——这正是我一直在研究中追求的东西。我们必须找个时间好好聊聊，我想请你看看我的事务所最新项目。"</p>\n<p>温叙白点头："很高兴能交流。"</p>\n<p>Moreau继续说着，身体微微前倾——这个距离在法国社交中算正常，但在陆峥寒看来已经越过了安全线。</p>\n<p>他的眸色沉了下来。</p>\n<p>但温叙白比他更快一步。</p>\n<p>"Moreau先生，"温叙白微微侧身，自然地将目光引向陆峥寒的方向，"介绍一下，这位是陆峥寒，陆氏集团总裁，也是我……"</p>\n<p>他停了半秒。</p>\n<p>"很重要的人。"</p>\n<p>这五个字在异国酒会上带着不言而喻的分量。</p>\n<p>Moreau微微一怔，目光在两人之间来回扫了一秒，随即了然，微笑点头："陆先生，你好。温叙白是难得的天才，你很有眼光。"</p>\n<p>陆峥寒走过来，自然地站在温叙白身旁，搭在他腰侧的手悄悄收紧——宣示主权，也是无声的感激。</p>\n<p>温叙白没有推开。</p>\n<p>他甚至微微靠了半分。</p>\n<hr>\n<p>回酒店的路上，日内瓦湖畔夜风清冽。</p>\n<p>湖面在月光下泛着银光，远处阿尔卑斯山的轮廓在夜色中若隐若现。街上行人稀少，两人并肩走着，脚步声踩在薄雪上发出细碎的声响。</p>\n<p>"叙白，你刚才说的\'很重要的人\'——"陆峥寒试探着开口。</p>\n<p>"别得意。"温叙白打断他，耳尖在夜色中泛红，"只是介绍而已。"</p>\n<p>"只是介绍？"</p>\n<p>"嗯。"</p>\n<p>"那你为什么不介绍我是\'商业合作伙伴\'或者\'朋友\'？"</p>\n<p>温叙白沉默了两秒。</p>\n<p>"因为不准确。"</p>\n<p>陆峥寒的心跳停了一拍，然后狂跳起来。</p>\n<p>"不准确是什么意思？"</p>\n<p>"字面意思。"温叙白加快脚步走在前面，"走了，冷。"</p>\n<p>陆峥寒笑着跟上去，在异国的夜晚，第一次被温叙白主动向外界介绍了身份。</p>\n<p>这比任何奖杯都让他心动。</p>\n<div class="hook">**【本章钩子：颁奖之夜温叙白主动介绍陆峥寒为"很重要的人"，半官宣式宣示让霸总彻底沦陷！异国之旅甜度拉满，回国后新的挑战即将接踵而至！】**</div>\n'},
  {title:'第41章 归国日常，报备成瘾', vol:2, html:'<p>从瑞士回国后，两人的关系进入了一个微妙的新阶段。</p>\n<p>变化是从消息开始的。</p>\n<p>以前是陆峥寒单方面报备——"我到公司了""中午吃了食堂""下午三点有个会""晚上八点下班"——温叙白回复简短，多为"嗯""知道了""好"。</p>\n<p>但回国后第三天，陆峥寒早上八点收到一条消息。</p>\n<p>温叙白：【起来了吗？记得吃早餐。】</p>\n<p>陆峥寒盯着这条消息看了五秒钟，然后从床上弹起来，洗漱、换衣服、坐到餐桌前，拍了张吃三明治的照片发过去。</p>\n<p>温叙白回复：【嗯。】</p>\n<p>一个"嗯"字，但陆峥寒开心了一整个上午。</p>\n<p>从那天起，温叙白的消息开始变得规律——</p>\n<p>早晨七点四十五，雷打不动：【起来了吗？记得吃早餐。】</p>\n<p>工作间隙偶尔出现：【中午吃什么？别叫外卖。】</p>\n<p>睡前永远是：【早点休息，晚安。】</p>\n<p>陆峥寒每次收到这些消息，都像中了彩票。他把每一条都截了图，存在一个叫"叙白关心实录"的相册里——这件事他没让温叙白知道。</p>\n<p>而他自己也从"单向报备"进化成了"双向报备"模式。温叙白开始主动告诉他自己的安排——【今天下午去工地，大概五点回。】【周五有个甲方会议，可能要晚一点。】【周末不加班，在家画图。】</p>\n<p>这种默契的互相报备，是两人<span class="annot" data-tip="彼此心里明白，不用明说">心照不宣</span>的亲密约定。不需要说"我在想你"——"我中午吃了什么"本身就是一种"我在想你"。</p>\n<hr>\n<p>周四下午两点半，陆峥寒的微信响了。</p>\n<p>温叙白：【今天去城东工地检查施工进度，灰尘可能有点大。】</p>\n<p>陆峥寒秒回：【我去接你。几点结束？】</p>\n<p>温叙白：【不用，我自己打车回去。】</p>\n<p>陆峥寒：【我已经在路上了。】</p>\n<p>温叙白：【……你什么时候出发的？】</p>\n<p>陆峥寒：【你发消息之前。】</p>\n<p>温叙白看着屏幕，沉默了三秒，打字：【你是不是在我手机里装了定位？】</p>\n<p>陆峥寒：【没有。我只是知道你每周四下午都会去城东工地。】</p>\n<p>温叙白收起手机，工地负责人在旁边等他签验收单，看到他嘴角弯了一下，以为是满意的意思，松了口气。</p>\n<p>其实温叙白是在想：这个人什么时候把他的行程表背下来的。</p>\n<hr>\n<p>下午三点，陆峥寒准时出现在城东工地门口。</p>\n<p>黑色的SUV停在路边，他从后备箱拿出一杯温热的咖啡和一个独立包装的湿巾包——工地灰尘大，他太了解温叙白的洁癖了。</p>\n<p>十分钟后，温叙白从工地里走出来。</p>\n<p>他戴着安全帽，白色衬衫的袖口沾了灰，裤脚踩了泥点，眉心微蹙——这是洁癖发作的前兆。他快步走向工地出口，手指已经开始不自觉地互相摩擦，想找地方洗手。</p>\n<p>陆峥寒二话不说，打开车门，递上湿巾和免洗洗手液。</p>\n<p>温叙白接过来，仔仔细细地擦了三遍手指，又用洗手液搓了一遍。整个过程陆峥寒在旁边安静等着，没有催，也没有多说一个字。</p>\n<p>等温叙白擦完手，陆峥寒把温热的咖啡递过去。</p>\n<p>"工地情况怎么样？"</p>\n<p>"进度正常。"温叙白喝了一口咖啡，眉头慢慢松开，"就是施工方的现场管理太粗糙，材料堆放不合规范，我说了两遍。"</p>\n<p>"要不要我跟施工方打个招呼？"</p>\n<p>"不用。"温叙白语气平淡，"我自己能解决。"</p>\n<p>陆峥寒点头，没再多问。他知道温叙白在专业领域从不需要别人代劳——他要的不是帮忙，而是在走出工地时，有人递上一杯热咖啡和一张干净的湿巾。</p>\n<p>"走吧，吃饭去。"陆峥寒发动车子。</p>\n<p>"去哪？"</p>\n<p>"你家附近那家日料。你上周说想吃刺身。"</p>\n<p>温叙白愣了一下："我随口说的。"</p>\n<p>"我记得。"陆峥寒语气平常，像在说今天天气不错。</p>\n<p>温叙白看着他的侧脸，没再说话。</p>\n<hr>\n<p>晚上回到家，温叙白先洗了澡，换上干净的家居服，坐在书桌前改方案。</p>\n<p>九点半，手机亮了。</p>\n<p>陆峥寒：【晚安，明天见。】</p>\n<p>温叙白看着这条消息，想了想，打了两个字回去：【晚安。】</p>\n<p>黑暗中，他把手机放在枕头旁边，闭上眼。</p>\n<p>嘴角那抹浅淡的笑意，久久不曾消散。</p>\n<p>他不擅长说"想你了"或者"喜欢你"——这些话对他来说太重也太轻了。重到他说不出口，轻到不足以表达他真正想说的事情。</p>\n<p>但他可以说"记得吃早餐"，可以说"别叫外卖"，可以说"早点休息"。</p>\n<p>这些话的潜台词，他不说，但陆峥寒听懂了。</p>\n<p>每天早上七点四十五的那条消息，意思是——我在一天的开始就想到你。</p>\n<p>每天晚上睡前的那个"晚安"，意思是——我愿意把一天的结束留给你。</p>\n<p>这就是温叙白式的心动。不惊天动地，不轰轰烈烈，只是心甘情愿地，把每一天的早安和晚安，都留给同一个人。</p>\n<div class="hook">**【本章钩子：双向报备日常甜度拉满，温叙白从被动接纳变成主动在意！暧昧进入甜蜜阶段，但平静之下，一个来自陆峥寒过去的意外访客即将打破宁静！】**</div>\n'},
  {title:'第42章 跨年夜，烟火与心跳', vol:2, html:'<p>十二月三十一日，跨年夜。</p>\n<p>海城的夜晚被霓虹和节日气氛装点得格外璀璨。商圈广场上挤满了人，音乐、笑声、气球和荧光棒汇成一片嘈杂的海洋。</p>\n<p>温叙白原本不喜喧闹——跨年夜在他过去二十七年的人生里，通常是在工作室画图度过的。安静、高效、不需要和任何人寒暄。</p>\n<p>但陆峥寒在三天前说了一句话："叙白，今年跨年，我想和你一起。"</p>\n<p>温叙白当时正在改图纸，头也没抬："你想来就来。"</p>\n<p>"你不问我去哪？"</p>\n<p>"我家。你定时间。"</p>\n<p>陆峥寒当时愣了好几秒——他准备了一整套说服方案，从"难得的节日"到"两个人比一个人好"到"我会带好吃的"，一个都没用上。</p>\n<p>温叙白拒绝人的时候很直接，答应人的时候更直接。</p>\n<hr>\n<p>十二月三十一日晚上七点，陆峥寒准时出现在温叙白家门口。</p>\n<p>他提了两个袋子——一个装着温叙白爱吃的刺身拼盘和寿司，另一个装着草莓蛋糕、热可可粉和一小瓶温热的清酒。</p>\n<p>温叙白开门时穿着灰色家居服，头发刚洗过，还有点湿，戴着黑框眼镜——他在家画图时的标配。</p>\n<p>陆峥寒看着他的样子，在门口多站了两秒。</p>\n<p>"干什么？"温叙白让他进来。</p>\n<p>"你戴眼镜好看。"陆峥寒换好拖鞋，把手里的袋子放到餐桌上。</p>\n<p>"……闭嘴。"</p>\n<hr>\n<p>两人在落地窗前铺了软垫，摆了食物和饮品。</p>\n<p>温叙白的公寓在二十三楼，落地窗朝东，能看到海城大半个城区的天际线。此刻万家灯火亮成一片，远处几座地标建筑的楼顶亮着节日灯光，红绿交错。</p>\n<p>温叙白坐在软垫上，把刺身拼盘的盖子打开，按种类重新排列了一遍——三文鱼放左边，金枪鱼放中间，北极贝放右边，酱油碟放在自己顺手的位置。</p>\n<p>陆峥寒在旁边看他排列，没说话，只是嘴角弯着。</p>\n<p>"你笑什么？"</p>\n<p>"没笑。"</p>\n<p>"你在笑。"</p>\n<p>"我在笑你连刺身都要排整齐。"</p>\n<p>温叙白顿了一下，没理他，拿起一片三文鱼放进嘴里。</p>\n<hr>\n<p>吃到一半，陆峥寒从袋子里拿出草莓蛋糕。</p>\n<p>"零点切。"他说，"现在先放着。"</p>\n<p>温叙白看了一眼蛋糕——圆形的，白色奶油，上面用巧克力写了"2025"四个数字。简洁、干净、没有多余装饰。</p>\n<p>"你订的？"</p>\n<p>"嗯。跟蛋糕店说了不要放色素、不要放太多奶油、不要写肉麻的话。"</p>\n<p>温叙白看着那个蛋糕，忽然觉得它很像自己——表面清冷，内里甜的。</p>\n<p>"谢了。"</p>\n<p>"不客气。"陆峥寒在他旁边坐下，肩头相贴，姿态慵懒亲昵。</p>\n<hr>\n<p>十一点半，两人靠在落地窗前，有一搭没一搭地聊天。</p>\n<p>温叙白端着热可可，目光落在窗外远处。城市的灯光在玻璃上投出他模糊的倒影——戴眼镜、穿家居服、手里捧着一杯热气腾腾的可可。他看着那个倒影，觉得自己看起来不像自己。</p>\n<p>以前的跨年夜，他坐在同一张桌子前画图，旁边只有台灯和咖啡。安静、高效、孤独。他习惯了孤独，甚至享受孤独——孤独意味着没有干扰、没有噪音、没有人碰他的东西。</p>\n<p>但此刻，身旁多了一个人。这个人带了蛋糕和清酒，坐在他旁边，肩头靠着他的肩头，呼吸声清晰可闻。</p>\n<p>温叙白发现，他不讨厌这种"不孤独"。</p>\n<p>"新年有什么愿望？"陆峥寒问。</p>\n<p>"没有特别的愿望。"温叙白声线平淡，"该做的都做了，顺其自然就好。"</p>\n<p>"我有。"陆峥寒语气认真，目光黏在他侧脸上。</p>\n<p>温叙白没有转头："说。"</p>\n<p>"我的愿望是——明年、后年、以后每一年，都和你一起跨年。"</p>\n<p>温叙白握着杯子的指尖微微收紧。</p>\n<p>他没有回答。</p>\n<p>窗外远处开始有人放烟花了——还不是零点的正式烟火，是按捺不住的市民提前放的。零星的烟花在夜空中炸开，红的、绿的、金的，映在温叙白的镜片上。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你的愿望太贪心了。"</p>\n<p>"贪心有什么不好？"陆峥寒轻声说，"遇到你之前我什么都不贪心。遇到你之后，什么都想贪。"</p>\n<p>温叙白没接话，但拿杯子的手换了一只——腾出来的那只手，不着痕迹地往陆峥寒那边挪了半寸，小指碰到了他的小指。</p>\n<p>陆峥寒感觉到了，呼吸停了一拍。</p>\n<p>他没动，怕一动温叙白就缩回去。</p>\n<hr>\n<p>十一点五十九分。</p>\n<p>窗外远处的人群开始齐声高喊倒计时——</p>\n<p>"十！"</p>\n<p>"九！"</p>\n<p>"八！"</p>\n<p>温叙白放下杯子，转头看向窗外。</p>\n<p>"七！六！五——"</p>\n<p>陆峥寒没有看窗外。他在看温叙白。</p>\n<p>看灯火映在他镜片上的碎光，看他被暖气蒸得微微泛红的耳尖，看他因为喝了半杯清酒而比平时柔和的眉眼。</p>\n<p>"四！三！二！一——"</p>\n<p>新年的钟声敲响。</p>\n<p>烟花在夜空中绽放——不是零星的，是整座城市同时炸开的。万发烟火从各个方向升空，在黑暗中炸成一片璀璨的光幕，将整座海城映照得如梦如幻。</p>\n<p>温叙白看着窗外绚烂的烟火，余光里却全是身旁那双始终望着他的眼睛。</p>\n<p>他微微转头，四目相对。</p>\n<p>烟花的光映在陆峥寒深邃的眼瞳里，像是盛了一整个星空。那目光温柔、炽热、深情——带着一种不容置疑的笃定和偏爱。</p>\n<p>温叙白心跳加速，喉咙发干。</p>\n<p>有一种前所未有的冲动涌上心头——他想靠过去。</p>\n<p>身体比理智先动了。他微微前倾——</p>\n<p>然后在最后一刻停住了。</p>\n<p>理智拉住了他。不是不想，是还不到时候。他还没理清心里那团模糊的东西，还不知道该用什么词来定义它。在这种时候靠过去，对他来说太草率了。</p>\n<p>他抬起手，轻轻拍了拍陆峥寒的头发，语气清冷却带着不易察觉的颤抖："新年快乐。"</p>\n<p>陆峥寒微微一怔——他看到了温叙白刚才前倾的动作，也看到了他停住的样子。他知道那是什么意思。</p>\n<p>差一点。但"差一点"已经够了。</p>\n<p>他眼底笑意炸开，温柔得几乎要融化整片夜空："新年快乐，叙白。"</p>\n<p>他顺势将头轻轻靠在温叙白肩上，闭了闭眼。</p>\n<p>温叙白没有推开。他偏头看了一眼窗外——烟花还在放，一朵接一朵，照亮了两个人的侧脸。</p>\n<p>他低声说了一句，声音轻到几乎被烟花盖过去："明年见。"</p>\n<p>陆峥寒在他肩上笑了。</p>\n<p>"明年见。"</p>\n<hr>\n<p>差一点的吻。</p>\n<p>但那"差一点"里藏着的悸动和心跳，比任何烟花都要璀璨。</p>\n<div class="hook">**【本章钩子：跨年夜差一点的吻，心动到了临界点却未捅破！温叙白的克制和陆峥寒的满足，让暧昧拉到了最甜蜜的张力。新的一年，感情将何去何从？】**</div>\n'},
  {title:'第43章 新年风波，旧人登场', vol:2, html:'<p>新年假期第三天，陆氏集团年会在海城国际会议中心举办。</p>\n<p>这是海城商圈每年年初最引人注目的社交场合——陆氏是海城龙头，年会到场嘉宾涵盖政商两界半数头面人物。能拿到一张入场券，本身就是身份的象征。</p>\n<p>陆峥寒照例以掌权人身份出席，黑色高定西装、冷峭眉眼、不怒自威的气场，所到之处人群自动分开。温叙白作为特邀嘉宾出席，白色西装清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，站在陆峥寒身旁时，一个冷一个寒，像两座冰山并肩——但仔细看，陆峥寒的眉眼在温叙白方向微微偏了两度，那是他独有的、只在温叙白面前才会出现的放松。</p>\n<p>两人并肩入场，瞬间成为全场焦点。至少有三十台手机在暗中拍照。</p>\n<p>"陆总今天带的人是——"</p>\n<p>"温叙白，建筑设计师，城东图书馆就是他设计的。"</p>\n<p>"哦——就是那位？"</p>\n<p>低声议论在人群中蔓延。陆峥寒充耳不闻，温叙白更不关心——他对社交场合的注意力永远在建筑本身上，会议中心的穹顶结构刚让他多看了两眼。</p>\n<hr>\n<p>年会顺利进行了大半。领导致辞、年度总结、战略合作签约，一切流程精准如钟表。</p>\n<p>直到晚宴环节，一个意想不到的人出现了。</p>\n<p>"哥！"</p>\n<p>一道清脆的女声从入口方向传来。众人循声望去，只见一个身穿酒红色丝绒礼服的年轻女人快步走来，栗色卷发随步伐轻晃，妆容精致，气场不输在场任何一位名媛。</p>\n<p>陆瑶。陆峥寒的表妹，陆家二房的独女，二十六岁。她长期在海外管理陆家的欧洲产业，每年只有新年才回国，在海城商圈露面的次数屈指可少。</p>\n<p>她快步走到陆峥寒面前，亲昵地挽住他的手臂，语气娇嗔："你可算从工作里抬起头了！我回来好几天你都没空见我，要不是今天年会，我是不是得约半个月才能见到你？"</p>\n<p>"这段时间确实忙。"陆峥寒语气比平时柔和了几分——在陆瑶面前，他的冷面阎王面具会松开一些。这是他为数不多的、真正有亲情联结的家人。</p>\n<p>温叙白站在一旁，看着这一幕。</p>\n<p>他注意到陆瑶挽着陆峥寒手臂的姿态很自然，没有任何越界的亲密，只是纯粹的家人之间的亲昵。但温叙白还是多看了两秒——不是因为介意，而是因为他在观察陆峥寒的社交模式。</p>\n<p>陆峥寒在外面的人设是冷面寡言，但在陆瑶面前，他会多说几句话，眉眼会松一些，甚至偶尔会被陆瑶的话逗得微微弯嘴角。这种反差让温叙白觉得有意思——原来陆峥寒不是天生冷漠，他只是选择性地展示温度。</p>\n<p>陆瑶注意到温叙白，好奇打量了他两秒，目光从白色西装扫到清冷面容，再到温叙白不自觉挺直的站姿，了然之色一闪而过。</p>\n<p>"这位是？"她明知故问。</p>\n<p>"温叙白，我的——"陆峥寒微微一顿，目光自然地看向温叙白。</p>\n<p>"温叙白，建筑设计师。"温叙白主动开口，语气清冷礼貌，不卑不亢。他不想让陆峥寒为难——在正式场合定义关系，对他们目前的状态来说确实有些微妙。</p>\n<p>陆瑶挑了挑眉，笑得促狭："就是那位让哥天天煲汤做饭的大设计师吧？我可是久仰大名了。"</p>\n<p>温叙白耳尖微红，看了陆峥寒一眼——看来他的事，陆家上下都知道了。而且看陆瑶的语气，知道的细节还不少。</p>\n<p>"他夸张了。"温叙白说。</p>\n<p>"一点都不夸张。"陆瑶压低声音，凑近温叙白耳边，"我哥跟我视频的时候三句不离你——\'叙白今天加班了\'\'叙白上次设计的方案获奖了\'\'叙白不喜欢吃辣我得记住\'。我在欧洲都听腻了。"</p>\n<p>温叙白："……"</p>\n<p>陆峥寒在旁边脸色微变："陆瑶。"</p>\n<p>"怎么了？我说的是事实。"陆瑶毫无惧色，笑嘻嘻地拉着温叙白走到一旁，"温设计师，来来来，我跟你说说我哥小时候的事——他特别有意思，上幼儿园的时候暗恋隔壁班的小女孩，不敢说话，就每天早上在人家课桌上放一颗糖——"</p>\n<p>"陆瑶！"陆峥寒快步走过来，试图阻止。</p>\n<p>温叙白侧耳听着，嘴角不自觉地弯了一下。他想象了一下五岁的陆峥寒，板着小脸偷偷往别人课桌上放糖的样子——和现在这个"装可怜博关心"的霸总形成了奇妙的连续性。</p>\n<p>"你表妹说，你从小就会装可怜。"回去的路上，温叙白靠在副驾座上，语气清冷而意味深长。</p>\n<p>陆峥寒握着方向盘的手紧了紧："她胡说的。"</p>\n<p>"哦。"温叙白看着窗外，"那她说的暗恋隔壁班小女孩也是胡说的？"</p>\n<p>"……那个是真的。但那是幼儿园！"</p>\n<p>"嗯。"温叙平淡淡地"嗯"了一声，没再追问。</p>\n<p>但陆峥寒从后视镜里看到，温叙白嘴角那个弧度，一直没收回去。</p>\n<div class="hook">**【本章钩子：陆家表妹登场，性格直爽拉近关系，却也抖出了霸总的童年底细！新角色带来新变数，而陆瑶的出现，也让温叙白对陆峥寒的了解更加立体——暧昧继续升温！】**</div>\n'},
  {title:'第44章 春节团圆，偏爱无声', vol:2, html:'<p>大年三十，海城张灯结彩。</p>\n<p>温叙白站在自己公寓的落地窗前，看着远处城区此起彼伏的烟花，手里拿着手机——屏幕上是陆峥寒三天前发来的消息：【今年过年，来老宅吧。祖母说想见你。】</p>\n<p>他犹豫了三天。</p>\n<p>不是因为不想去。而是他不习惯——不习惯在别人家过年，不习惯年夜饭桌上有多于两个人的碗筷，不习惯热闹。</p>\n<p>自从父亲温崇远因那场商业纠纷远走海外后，温叙白的每个春节都只有他和母亲苏敏华两个人。母亲会包一顿简单的饺子，看半小时春晚，然后各自回房。安静、简洁、不需要社交——符合温叙白对节日的全部期待。</p>\n<p>母亲前几年也去国外和父亲团聚了，温叙白的春节就只剩一个人。他通常在工作室画一整天图，叫一份外卖，十点睡觉。他把春节当成一个普通的休息日来过，不觉得孤独，因为从来没有对比。</p>\n<p>但今年不同。</p>\n<p>今年有人问他："来老宅过年吗？"</p>\n<p>最终让他答应的，不是陆峥寒的邀请，而是老夫人那句话——"祖母说想见你"。</p>\n<p>老夫人是陆家真正的话事人，也是第一个接纳他的人。温叙白做不到让一个真心待他好的老人在除夕夜等一个不来的电话。</p>\n<hr>\n<p>大年三十下午四点，温叙白提着精心挑选的茶叶礼盒，来到陆家老宅。</p>\n<p>老宅在海城西郊，是一座三进的四合院，青砖灰瓦，古朴庄重。门口挂着两盏大红灯笼，院子里摆了几盆年桔，年味不浓但恰到好处——老夫人的审美一向不喜欢铺张。</p>\n<p>管家周伯在门口等他："温先生，老夫人在正厅等您。"</p>\n<p>温叙白走进正厅时，老夫人正坐在太师椅上喝茶。她今年七十八岁，头发花白，面容清癯，但眼神依旧锐利——这是经历过商海风雨的女人，岁月磨去了她的锋芒，但底子还在。</p>\n<p>"来了，坐。"老夫人看到他，面容上的严肃化开几分，语气难得温和。</p>\n<p>温叙白把茶叶递过去："给您带了凤凰单丛，听说您喜欢半发酵的。"</p>\n<p>"你有心。"老夫人接过茶叶，示意周伯泡上，"坐吧，峥寒去厨房了。"</p>\n<p>"厨房？"</p>\n<p>"他说今年的鱼要自己烧，不让佣人动手。"</p>\n<p>温叙白沉默了一秒。陆峥寒的厨艺他是领教过的——会做，但不算好。但他知道陆峥寒为什么坚持自己烧鱼：因为温叙白说过一句"我不喜欢吃外面餐厅的鱼，太油"。说过一次，他就记住了。</p>\n<hr>\n<p>年夜饭在正厅摆开。</p>\n<p>一桌六个人：老夫人坐主位，陆峥寒和温叙白分坐两侧，陆瑶坐在温叙白旁边，周伯和跟了老宅二十年的张妈也上了桌——这是老夫人的规矩，过年不分主仆，同桌吃饭。</p>\n<p>桌上菜品不算多，但每道都讲究——清蒸鲈鱼是陆峥寒做的，红烧肉是张妈的拿手菜，素炒时蔬是老夫人亲自吩咐的清淡口味，饺子是下午陆瑶和周伯一起包的。</p>\n<p>温叙白看着碗里的饺子——形状不太统一，有的胖有的瘦，皮子厚薄不均。他拿起来咬了一口，是韭菜鸡蛋馅的。</p>\n<p>"我包的。"陆瑶指了指那个胖得快要撑破皮的饺子，"怎么样？"</p>\n<p>"很好。"温叙白说。这个"很好"不是客套——他确实觉得好。因为这只饺子的不完美里，有一种他从未在年夜饭桌上感受过的东西。</p>\n<p>温度。</p>\n<hr>\n<p>席间气氛出乎意料地融洽。</p>\n<p>陆瑶是天然的气氛调节器，话多但不出格，一会儿逗老夫人笑，一会儿缠着陆峥寒说小时候的糗事，一会儿又拉着温叙白聊海外建筑见闻。老夫人偶尔问几句温叙白的工作，语气里带着长辈的关切，不试探、不施压。</p>\n<p>陆峥寒全程安静地给温叙白夹菜——清蒸鱼的鱼腹肉、红烧肉最瘦的那块、时蔬里最新嫩的菜心。动作自然得像是刻在骨子里的本能，完全不顾陆瑶在旁边挤眉弄眼。</p>\n<p>温叙白看着碗里堆成小山的菜肴，微微蹙眉："够了，吃不完。"</p>\n<p>"再吃点，你太瘦了。"陆峥寒语气软糯，筷子又伸过来。</p>\n<p>"你夹的够三个人吃了。"温叙白按住他的筷子。</p>\n<p>陆峥寒缩回手，但看了一眼老夫人——老夫人正在喝茶，佯装没看见，但眼底掠过一丝满意的笑意。</p>\n<hr>\n<p>饭后，两人站在院子里看烟花。</p>\n<p>老宅的院子宽敞开阔，种了两棵百年银杏，此刻光秃秃的枝干上挂了一串小灯泡，暖黄光在冬夜里格外温柔。远处城区的烟花此起彼伏地升空，照亮了古朴的青砖灰瓦。</p>\n<p>空气很冷，呼出的白气在灯光下清晰可见。温叙白把围巾往上拉了拉，陆峥寒不知什么时候站到了他上风处，替他挡住了从院墙外灌进来的北风。</p>\n<p>"叙白。"陆峥寒站在他身旁，目光落在远处的烟花上，语气认真而轻柔，"这是你第一次在别人家过年吧？"</p>\n<p>温叙白微微一怔。</p>\n<p>他没有否认。自从父亲远走海外后，他和母亲的每个春节都过得简单安静。母亲出国后，他更是一个人——工作室、外卖、十点睡觉。他习惯了，甚至觉得这才是春节该有的样子。</p>\n<p>但此刻，站在陆家老宅的院子里，身后是年夜饭的余温和笑语的余音，身旁是一个替他挡风的人——他忽然意识到，原来"热闹"也可以是不讨厌的。</p>\n<p>关键不在于有多少人、多少菜、多少烟花。关键在于——有没有人在意你来不来。</p>\n<p>"以后每年都在这里过。"陆峥寒偏头看他，目光温柔笃定，"这里也是你的家。"</p>\n<p>温叙白喉间发紧。</p>\n<p>他没有说话，只是微微靠近了陆峥寒半步，肩头轻轻相抵。隔着两层衣料，他能感觉到陆峥寒的体温——比他高，像一只行走的暖炉。</p>\n<p>烟花在头顶绽放，璀璨而温暖。</p>\n<p>这是他二十七年来，最热闹的一个除夕夜。</p>\n<div class="hook">**【本章钩子：春节团圆，温叙白首次在陆家过年，"这里也是你的家"让孤独了半生的美人终于有了归属感！偏爱无声却深入骨髓，两人的关系正以不可逆转的速度走向更深处！】**</div>\n'},
  {title:'第45章 开春新局，联手再战', vol:2, html:'<p>春节过后，万物复苏。</p>\n<p>温叙白的城东文化中心项目进入主体施工阶段，进展顺利。与此同时，一个新的机遇悄然而至——海城滨水新区整体规划项目面向全球招标。</p>\n<p>这是海城有史以来规模最大的城市规划设计项目。滨水新区位于海城东部沿海地带，总规划面积十二平方公里，包含住宅、商业、文化、生态四个功能板块，预计建设周期五年，总投资超过两百亿。</p>\n<p>招标公告发出的当天，温叙白在工作室看到了消息。</p>\n<p>他放下手里的咖啡杯，点开公告全文，逐行阅读。读到"生态优先、人城共生"的设计要求时，他的手指在桌面上轻轻敲了两下——这是他兴奋时的微小习惯。</p>\n<p>这个项目几乎是为他量身定做的。城东图书馆让他证明了自己对"空间叙事"的掌控力，洛桑双年展让国际建筑界认可了他的"自然光线"理念。而滨水新区——这是一个让他可以把所有理念倾注进一座城区的机会。</p>\n<p>但项目的规模远超个人工作室的承接能力。他需要一个强大的商业合作伙伴。</p>\n<hr>\n<p>当晚，两人在温叙白家吃晚饭时，陆峥寒提到了这个项目。</p>\n<p>"陆氏有意向参与滨水新区的基础设施建设。"他一边盛汤一边说，语气像在聊日常，"如果你有兴趣投标规划设计部分，我们可以联手。"</p>\n<p>温叙白正在摆碗筷，手停了一下："你什么时候看到的招标公告？"</p>\n<p>"今天下午。"</p>\n<p>"我也是今天下午看到的。"</p>\n<p>"所以我想，你应该也动了心。"陆峥寒把汤碗推到他面前，"你看到\'生态优先\'那几个字时，一定敲了桌面。"</p>\n<p>温叙白看着他，沉默了两秒。</p>\n<p>"你怎么知道我敲了桌面？"</p>\n<p>"因为你每次兴奋的时候都会敲。城东图书馆招标时你敲了三下，洛桑演讲前一晚你敲了两下。"</p>\n<p>温叙白不确定自己是该感动还是该警惕——这个人对他的观察精度，已经到了令人不安的程度。</p>\n<p>"联手。"温叙白点头，语气干脆，"你负责商业运营和基础设施，我负责规划设计。利润分成按合同走，亲兄弟明算账。"</p>\n<p>"好。"陆峥寒笑了一下，"不过我有一个条件。"</p>\n<p>"说。"</p>\n<p>"熬夜赶方案的时候，不许超过凌晨两点。上次城东项目你连续三天熬到四点，瘦了一圈。"</p>\n<p>温叙白看了他一眼："这是商业谈判还是养生讲座？"</p>\n<p>"都是。"陆峥寒理直气壮，"商业伙伴的健康也是商业资产。"</p>\n<hr>\n<p>接下来的一个月，温叙白的工作室和陆氏集团的项目团队紧密配合，日夜赶工，准备招标方案。</p>\n<p>温叙白负责整体规划设计——他用了一个星期做实地勘察，从滨水新区的海岸线走向、潮汐规律、主导风向到土壤承载力，全部亲自测量记录。陆氏提供商业运营数据和基础设施技术支持，林舟充当两方团队的联络人。</p>\n<p>深夜的工作室里，两人并肩伏案。</p>\n<p>温叙白画图时专注到忘记吃饭。他的工作模式一旦启动就像进入了另一个维度——外界声音自动屏蔽，生物钟暂停运作，只有图纸和比例尺是真实的。</p>\n<p>陆峥寒学会了一套不打扰的照顾方式：把温好的牛奶和切好的三明治放在他右手边三十厘米处——这个距离够近能被余光捕捉到，够远不会碰到他的绘图工具。不出声提醒，只在合适的时间用手指轻轻点一下桌面。</p>\n<p>温叙白会从图纸里抬头，看到食物，愣一秒，然后拿起来吃。</p>\n<p>有时候他吃着吃着又低头看图，三明治咬了一半就放下，十分钟后才想起来继续吃。陆峥寒在旁边看着，不催。</p>\n<p>凌晨一点半，温叙白终于放下笔，揉了揉发酸的颈椎。</p>\n<p>"休息一下。"陆峥寒递过牛奶。</p>\n<p>温叙白接过来喝了一口，余光看到陆峥寒同样熬夜到眼底泛青，微微蹙眉："你也休息，别硬撑。"</p>\n<p>"你不休息我也不休息。"陆峥寒理直气壮。</p>\n<p>温叙白无奈叹气，放下杯子："好，一起休息。"</p>\n<p>两人靠在沙发上，肩头相抵，闭目养神。安静的工作室里，只有彼此交织的呼吸和窗外偶尔传来的夜风声。桌上摊着方案图纸和数据报表，台灯还亮着，但谁都没去关。</p>\n<hr>\n<p>招标方案在截止日前一天完成。</p>\n<p>温叙白的设计方案以"生态骨架、文化血脉"为核心概念——将滨水新区的海岸线作为生态主轴，保留原有湿地系统，建筑群沿生态轴线分布，所有建筑限高以保证海景视线通廊。文化板块以小型社区图书馆群为节点，串联整个片区的公共空间。</p>\n<p>陆氏的商业运营方案则提供了务实的配套——智能基础设施、绿色能源系统、社区商业模型。</p>\n<p>两个方案互补性极强，评审会在初评时就给出了"设计前瞻性与商业可行性兼备"的评价。</p>\n<p>结果公布那天，温叙白在工作室看到邮件——"中标"两个字嵌在正式公函里，旁边是联合体名称：温叙白工作室 × 陆氏集团。</p>\n<p>他盯着屏幕看了五秒钟，然后拿起手机。</p>\n<p>陆峥寒比他快三秒，电话先打了过来："看到了？"</p>\n<p>"看到了。"</p>\n<p>"恭喜你，叙白。"</p>\n<p>"是我们。"温叙白偏头靠在椅背上，语气清冷却认真，"是我们一起赢的。"</p>\n<p>电话那头沉默了两秒。然后陆峥寒笑了，声音里有如释重负的轻松和掩不住的欢喜。</p>\n<p>并肩无双，不过如此。</p>\n<div class="hook">**【本章钩子：双强联手再战商海，滨水新区项目成功中标！并肩作战的默契让感情再度升温，"是我们一起赢的"——温叙白已将陆峥寒视为不可分割的伙伴。暧昧持续发酵，心动愈发清晰！】**</div>\n'},
  {title:'第46章 樱花季，心动加速', vol:2, html:'<p>三月，海城大学的老樱花林进入了盛花期。</p>\n<p>这片樱花林栽于上世纪五十年代，两百多棵染井吉野沿山坡排列，盛花期时整片山坡变成粉白色的海洋。温叙白当年在海城大学读本科时，每年三月都会来这里画速写——樱花的花期只有十天，他舍不得浪费。</p>\n<p>毕业之后，他再没来过。不是不想，是一个人来没意思，不如在工作室画图。</p>\n<p>但今天不是一个人。</p>\n<p>"你怎么知道这里的？"温叙白走在樱花林的小径上，侧头问陆峥寒。</p>\n<p>"我查过你的大学经历。"陆峥寒走在他右侧，步伐刻意放慢配合他的节奏，"你大一到大三每年三月都来这片樱花林画速写，大四那年没来——因为你在准备毕业设计，通宵画图没时间。"</p>\n<p>温叙白停下脚步。</p>\n<p>"你连这个都查？"</p>\n<p>"不是查的。"陆峥寒耳尖微红，"是你自己说的。去年冬天你发烧的时候，迷迷糊糊说了一堆话，里面有一句\'好久没去看樱花了\'。我记下来了。"</p>\n<p>温叙白看着他，说不出话。</p>\n<p>他完全不记得自己发烧时说过什么。但陆峥寒记住了——在他说过的所有意识模糊的胡话里，精准地捕捉到了关于樱花的那一句，然后记在心里，等到三月，带他来了。</p>\n<p>"走吧。"温叙白转身继续走，语气比平时轻了一点，"花期不等人。"</p>\n<hr>\n<p>樱花林里粉白的花瓣纷飞如雪。</p>\n<p>三月中旬的阳光柔和得恰到好处，穿过层层叠叠的花枝洒下来，在地面上画出斑驳的光影。风一吹，花瓣纷纷扬扬落下来，落在肩膀上、头发上、衣领上。</p>\n<p>温叙白走在树下，清冷的面容被花瓣和阳光映得柔和。他穿了一件浅灰色的薄外套，和白粉色的樱花形成冷调对比，像一幅水墨画里唯一的灰描人物。</p>\n<p>陆峥寒走在他身旁，目光始终黏在他身上。</p>\n<p>他确实没怎么看花。樱花很美，但他的注意力被另一样东西完全占据了——温叙白在樱花树下的样子。光线穿过花枝在他脸上画出明暗交替的光斑，他微微仰头看花的侧脸专注而安静，花瓣落在他的肩头像一层薄雪。</p>\n<p>"你一直在看我，没有在看花。"温叙白忽然开口，语气清冷而平静。</p>\n<p>他没转头，但陆峥寒知道他在说自己。</p>\n<p>"花在哪都能看。"陆峥寒坦然承认，耳尖微微泛红，"你不是。"</p>\n<p>温叙白的脚步顿了一拍，然后继续走，没有接话。但他脚下的步伐不自觉地放慢了些，和陆峥寒靠得更近——近到衣袖偶尔相蹭。</p>\n<hr>\n<p>走到一棵最大的樱花树下时，温叙白停了下来。</p>\n<p>这棵树是整片樱花林里最老的一棵，树冠遮出一大片阴影，花瓣从高处飘落时密度最大，像一场缓慢的粉色雪。</p>\n<p>温叙白仰头看着满树繁花，目光专注。陆峥寒站在他身旁，也跟着抬头看——但他看的不是花，是温叙白仰头的侧颈。</p>\n<p>一阵风吹过。</p>\n<p>花瓣纷纷扬扬落在两人肩头、发间。温叙白抬手拂去肩上的花瓣，指尖却碰到了另一只手——陆峥寒正伸手帮他拂去头发上的花瓣。</p>\n<p>两人的指尖在花瓣中轻轻相触。</p>\n<p>温叙白的手指顿了一下。</p>\n<p>他没有缩回手。</p>\n<p>陆峥寒也没有。</p>\n<p>他们就这样指尖相触，站在漫天飞舞的樱花中，安静了几秒。风吹动花瓣从他们指缝间穿过，像是柔软的电流。</p>\n<p>"叙白。"陆峥寒轻声开口，声线带着微微的颤抖和前所未有的认真。</p>\n<p>"嗯？"</p>\n<p>"你知不知道……我有多喜欢你？"</p>\n<p>温叙白喉间微动，心跳漏了一拍。</p>\n<p>他偏头看向陆峥寒。在樱花的光影里，陆峥寒的眼底没有伪装、没有戏精模式、没有装可怜的软糯——只有赤裸裸的深情和认真。像是蓄积了七年的情感，终于在这个瞬间决堤。</p>\n<p>温叙白看着那双眼睛，心里那团理不清的东西忽然又动了。</p>\n<p>它不是第一次动——在瑞士的雪山上它动过，在跨年夜的烟火下它动过，在暴雨夜的工作室里它动过。但这一次，它动得更清晰了。清晰到他几乎能给它一个名字。</p>\n<p>他没有说那个名字。</p>\n<p>但他也没有回避。</p>\n<p>"我知道。"他说。</p>\n<p>两个字，轻飘飘的，却让陆峥寒浑身一震，眼眶微热。</p>\n<p>他知道。</p>\n<p>他一直都知道。</p>\n<p>"那……"陆峥寒喉间发紧，想要追问，却被温叙白轻轻打断。</p>\n<p>"别急。"温叙白收回目光，重新看向飘落的樱花。嘴角弯起一个极淡的弧度——不是对外人的清冷，是只对陆峥寒才会出现的、带着一点点纵容的温柔。</p>\n<p>"我需要时间。"</p>\n<p>陆峥寒心底翻涌的情感渐渐平复，化作一股绵长的暖意。他点头，声音有点哑："好，我等你。不管多久。"</p>\n<p>樱花继续纷飞，落在两人肩头，像是无声的祝福。</p>\n<p>他没有急着要答案，他只是在等——等温叙白准备好，等那份心动从萌芽长成参天大树。</p>\n<p>而他有的是耐心。七年的蓄谋都等了，这点时间算什么。</p>\n<div class="hook">**【本章钩子：樱花树下的半告白，"你知不知道我有多喜欢你"与"我知道"——最动人的一次对话！温叙白没有拒绝也没有答应，只说"我需要时间"。这份克制里的温柔，比任何回应都更让人心动！】**</div>\n'},
  {title:'第47章 温叙白生日，独家礼物', vol:2, html:'<p>三月二十七日，温叙白的生日。</p>\n<p>他自己几乎忘了。</p>\n<p>生日对温叙白来说从来不是什么特殊日子。小时候父亲还在身边时，母亲苏敏华会做一个红丝绒蛋糕，父亲温崇远会送他一支新的画图铅笔。后来父亲远走海外，生日就变成母亲煮一碗长寿面，他吃完回房间画图。再后来母亲也去了国外，生日就变成——工作室、外卖、十点睡觉。和任何一个普通的周三没有区别。</p>\n<p>但陆峥寒不会忘。</p>\n<p>蓄谋了七年的人的生日，他比当事人记得清楚一万倍。</p>\n<hr>\n<p>生日前一周，陆峥寒就开始准备。</p>\n<p>白玫瑰是提前三天订的——他跑遍了海城六家花店，最后选了一家日本花艺师开的工作室。不是最大最贵的，但风格最干净——纯白玫瑰，零点缀，牛皮纸包装，极简到近乎冷淡。完美契合温叙白的审美。</p>\n<p>蛋糕是他亲手做的。这不是他第一次做蛋糕，但第一次做的时候差点把厨房炸了。后来他偷偷报了一个烘焙班，每周三晚上去学，学了两个月。他学的唯一一款就是戚风蛋糕——因为温叙白不喜欢太甜的，戚风蛋糕糖少、口感轻、装饰简洁。</p>\n<p>卡片是他手写的。措辞改了七遍，最后定了八个字："叙白，生日快乐。"后面加了一句——"谢谢你来到这个世界，让我有可以偏爱的人。"</p>\n<p>他犹豫了很久要不要加后面那句。太直白了。但最终他还是写了——他答应过自己，对温叙白不藏心思。</p>\n<hr>\n<p>生日当天，温叙白照常去工作室。</p>\n<p>他推开办公室门时，脚步顿住了。</p>\n<p>桌上摆着那束白玫瑰——在晨光中安安静静地立着，花瓣微微张开，散发极淡的香气。旁边搁着一张手写卡片。</p>\n<p>温叙白走过去，拿起卡片。</p>\n<p>【叙白，生日快乐。谢谢你来到这个世界，让我有可以偏爱的人。——陆峥寒】</p>\n<p>他的拇指在字迹上轻轻蹭了一下。陆峥寒的字很好看——不是那种刻意练出来的书法体，是自然的、有力的、横平竖直的。和他人一样，表面冷硬，内里认真。</p>\n<p>温叙白把卡片放下，拿起手机准备打电话。</p>\n<p>办公室门被推开了。</p>\n<p>陆峥寒站在门口，手里端着一个蛋糕——极简的白色奶油蛋糕，没有任何花哨装饰，只在正中插了一根蜡烛。蛋糕表面平整干净，奶油抹得不算完美但很用心，能看出是手工做的。</p>\n<p>"生日快乐。"陆峥寒弯唇，眼底笑意温柔得快要溢出来。</p>\n<p>温叙白看着他——看着他亲手做的蛋糕、手写的卡片、提前订的白玫瑰——心底被层层暖意包裹，眼眶微微发热。</p>\n<p>"你什么时候准备的？"</p>\n<p>"很久以前。"陆峥寒把蛋糕放在桌上，语气认真，"每年的今天，我都在心里给你过生日。今年是第一次，能当着你的面过。"</p>\n<p>温叙白喉间发紧。</p>\n<p>他看着陆峥寒的眼睛——那双在外面<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>、让人不敢直视的眼睛，此刻只有温柔和一点不确定。像是一个准备了很久的人，不确定自己的礼物够不够好。</p>\n<p>"蛋糕是你做的？"温叙白问。</p>\n<p>"嗯。"</p>\n<p>"什么时候学的？"</p>\n<p>"两个月前。每周三晚上去烘焙班。"</p>\n<p>温叙白沉默了。</p>\n<p>每周三晚上——那段时间陆峥寒总说有应酬，八点到十点不接电话。温叙白以为他在谈商务合作，没多问。原来是去学做蛋糕了。</p>\n<p>为了他生日的一块戚风蛋糕，偷偷学了两个月。</p>\n<p>"许愿吧。"温叙白压下喉间的涩意，语气清冷但比平时柔和了太多。</p>\n<p>"你先许。"陆峥寒笑。</p>\n<p>温叙白闭上眼睛，沉默了几秒。</p>\n<p>他没有许愿。不是因为没有想要的——而是因为他想不出还有什么可许的。事业在巅峰，身边有偏爱他的人，生活安稳踏实。如果一定要许一个愿——</p>\n<p>他睁开眼，没有说出口。</p>\n<p>他只是看着陆峥寒微微弯了弯唇角，眼底盛着从未有过的光。</p>\n<p>"吹蜡烛吧。"他说。</p>\n<p>陆峥寒凑近，和他一起吹灭了那根蜡烛。两人的脸在烛光熄灭前凑得很近，呼吸几乎交织在一起。温叙白在那一瞬间往后退了半寸——不是因为排斥，是因为太近了，近到他能看清陆峥寒睫毛的弧度。</p>\n<p>"你许了什么愿？"温叙白问，试图转移注意力。</p>\n<p>"不能说，说了不灵。"陆峥寒笑得狡黠，但眼底深情藏都藏不住。</p>\n<p>温叙白看着他，嘴角弯了弯，没有追问。</p>\n<p>但他知道，陆峥寒的愿望里，一定有他。</p>\n<p>就像他的愿望里——那个没有说出口的愿望——从不知什么时候起，也有了陆峥寒。</p>\n<p>"蛋糕切了吗？"温叙白问。</p>\n<p>"你先切。"</p>\n<p>温叙白拿起刀，切了一块，咬了一口。</p>\n<p>戚风蛋糕。糖少，口感轻，不腻。奶油薄薄一层，不多不少。</p>\n<p>"怎么样？"陆峥寒紧张地问。</p>\n<p>"不错。"温叙白说。</p>\n<p>这个"不错"从温叙白嘴里说出来，等于别人的"太好吃了"。陆峥寒知道，所以他笑了——笑得像个考了一百分跑回家求表扬的孩子。</p>\n<div class="hook">**【本章钩子：生日甜宠名场面，七年暗恋的深情在生日这一天倾泻而出！温叙白未说出口的愿望里，第一次有了另一个人。心动的种子已经长成幼苗，破土而出只是时间问题！】**</div>\n'},
  {title:'第48章 误会产生，醋意风波', vol:2, html:'<p>滨水新区项目启动后，温叙白频繁与合作方开会对接。</p>\n<p>其中一位对接人是滨水新区管委会的副主任方晏清。三十二岁，海归博士，年轻有为，举止温文尔雅，说话慢条斯理，戴一副银框眼镜，是那种学术圈里常见的中产阶级精英形象。</p>\n<p>方晏清对温叙白的设计方案推崇备至。不是那种泛泛的"很好很厉害"式的客套，而是真的读透了方案、理解了理念之后的欣赏。他在会议上能精准指出温叙白设计中最巧妙的三个细节——连陆峥寒都没注意到的那三个。</p>\n<p>这让温叙白在专业层面上对他产生了有限的尊重。</p>\n<p>两人的工作对接越来越频繁。会后偶尔会多聊几句专业话题——从滨水新区的土壤承载力聊到日本代谢派建筑，从采光设计聊到路易斯·康的砖石哲学。方晏清学识渊博，温叙白虽然依旧清冷疏离，但在这种高质量的专业交流中偶尔会露出认真投入的神情——他平时只在画图时才有这种表情。</p>\n<p>这些全部被陆峥寒知道了。</p>\n<p>不是他刻意监视——是林舟在项目对接会上亲眼看到的，回来汇报工作时顺嘴提了一句："温总今天和管委会方主任聊了很久，聊到康的萨尔克生物研究所，温总难得说了那么多话。"</p>\n<p>陆峥寒当时正在批文件，笔尖顿了一下。</p>\n<p>"多久？"</p>\n<p>"大概二十分钟。"</p>\n<p>"二十分钟。"陆峥寒重复了一遍，语气听不出情绪。</p>\n<p>林舟意识到自己说了不该说的话，迅速闭嘴退出了办公室。</p>\n<hr>\n<p>当天晚餐，两人在温叙白家吃饭。</p>\n<p>陆峥寒亲手煮了排骨粥——温叙白最近加班多，胃不太好，需要清淡的。排骨粥炖了两个小时，米粒完全化开，汤色浓白，表面浮着几粒枸杞。</p>\n<p>温叙白坐下来喝了一口，微微点头——这是他对食物的高评价了。</p>\n<p>"你最近经常和方晏清开会？"陆峥寒看似随意地问，端起碗喝粥。</p>\n<p>"项目对接，正常工作。"温叙白夹了一筷子青菜。</p>\n<p>"他好像很欣赏你。"</p>\n<p>"他是管委会副主任，欣赏设计方案是他的工作。"</p>\n<p>陆峥寒放下碗，语气酸溜溜的："他跟你聊了二十分钟路易斯·康。"</p>\n<p>温叙白的筷子停了一下。</p>\n<p>"林舟告诉你的？"</p>\n<p>"我问他今天对接会情况的。"</p>\n<p>"你让林舟盯着我的工作对接？"</p>\n<p>"没有盯着。"陆峥寒心虚地移开目光，"就是正常了解项目进展。"</p>\n<p>温叙白微微抬头看他一眼。那双眼底掠过一丝无奈："你又吃醋了。"</p>\n<p>"没有。"</p>\n<p>"你嘴上说没有，筷子快被你折断了。"</p>\n<p>陆峥寒低头一看——果然，自己手里的一次性筷子被无意识攥得微微弯曲，木纤维发出细微的嘎吱声。他松开手，耳尖一下子红了起来。</p>\n<p>温叙白看着他心虚的模样，心底泛起一丝好笑。这个人在外面让无数对手闻风丧胆，回到家里却因为一个工作对接的二十分钟聊天，醋意浓到筷子都攥弯了。</p>\n<p>"方晏清是管委会副主任，工作能力不错。"温叙平语气平淡，重新拿起筷子，"仅此而已。"</p>\n<p>"你说这话跟说Luc Moreau时一模一样。"陆峥寒闷闷地说，"\'学术功底很扎实\'——上回你也是这么夸的。"</p>\n<p>温叙白挑眉："你连这都记得？"</p>\n<p>"关于你的事，我什么都记得。"陆峥寒语气认真，眼底醋意和深情交织在一起，让他看起来像一只被抢了骨头的大型犬——明明很委屈，但不敢叫。</p>\n<p>温叙白看着他，忽然放下筷子。</p>\n<p>"陆峥寒，你听好。"</p>\n<p>陆峥寒微微一愣，下意识坐直。</p>\n<p>温叙白直视他的眼睛。那双清冷的眼瞳里没有闪躲、没有犹豫，只有一种清醒而笃定的认真——一字一句清晰无误：</p>\n<p>"我的身边只有你。"</p>\n<p>陆峥寒的呼吸停了。</p>\n<p>"不管是Luc Moreau，还是方晏清，还是任何人。"温叙白的声音很稳，像在陈述一个不容置疑的事实，"我的身边，只有你。"</p>\n<p>这句话像一颗深水炸弹，在陆峥寒心底轰然炸开。所有的醋意和不安瞬间被炸得粉碎，取而代之的是满溢的欢喜和感动——他张了张嘴，喉间发紧，一时竟说不出话来。</p>\n<p>"所以，"温叙白重新拿起筷子，语气故作平淡，耳尖却红透了——他端起碗遮住半张脸，"别再吃些莫名其妙的醋了。矫情。"</p>\n<p>陆峥寒愣了两秒，随即眼底笑意炸开，弯唇笑得温柔而满足。</p>\n<p>"好，不吃了。"</p>\n<p>但他心里知道，这份醋意其实是甜蜜的负担——因为温叙白每次化解醋意的方式，都比上一次更直白、更让人心动。从瑞士的"我身边的位置只留给你"，到现在的"我的身边只有你"——每一次都更进一步。</p>\n<p>他在等的那句话，已经越来越近了。</p>\n<div class="hook">**【本章钩子：醋意风波再起，温叙白一句"我的身边只有你"正面击碎所有不安！这份直白的偏爱宣言，比任何告白都更让人心动。误会的醋意反而成了感情升温的催化剂！】**</div>\n'},
  {title:'第49章 深夜暴雨，暖心守护', vol:2, html:'<p>四月的海城，暴雨说来就来。</p>\n<p>下午还是晴天，傍晚六点天色骤变，乌云从东面压过来，像一块巨大的黑布罩住了整座城市。八点钟雷暴开始，闪电一道接一道劈开夜空，雷声轰鸣到窗户都在震。</p>\n<p>深夜十一点，温叙白独自在工作室加班，赶滨水新区的方案修改。</p>\n<p>工作室只开了他头顶那盏台灯，其余区域漆黑一片。图纸摊满整张桌面，比例尺、铅笔、橡皮擦按照他的强迫症标准排成整齐的一排。窗外雷声轰鸣，暴雨如注，但他完全听不到——他进入了那种"画图时全世界消失"的状态。</p>\n<p>手机响了。</p>\n<p>是陆峥寒的视频电话。屏幕上显示他在陆氏办公室里，桌上摊着文件，领带松了，袖子卷到手肘——也在加班。但他的目光全在屏幕上，看着温叙白被台灯照亮的侧脸。</p>\n<p>"还在加班？"</p>\n<p>"嗯，方案要改三版。"</p>\n<p>"几点能改完？"</p>\n<p>"不确定。"</p>\n<p>"外面雷暴很大，你一个人在工作室没事吧？"</p>\n<p>温叙白抬头看了一眼窗外——闪电正好劈下来，将窗玻璃照得惨白。他低头继续画图。</p>\n<p>"没事，这楼有避雷针。"</p>\n<p>"我过来陪你。"</p>\n<p>"不用，雨太大了——"</p>\n<p>"已经出门了。"陆峥寒挂了电话。</p>\n<p>温叙白看着黑掉的手机屏幕，无奈叹气。嘴角弯了弯，又压下去了。</p>\n<p>他拿起手机想发一条"路上小心"，打了三个字又删了——太像在担心了。最终发了一条："工作室门没锁。"</p>\n<p>三秒后回复："到了。"</p>\n<hr>\n<p>二十分钟后，陆峥寒推门而入。</p>\n<p>他穿了一件深灰色外套，肩头被雨水打湿了一大片，发梢滴着水珠，裤脚也溅了泥点。但他进门第一个动作不是擦自己，而是把手里一直护着的保温袋递到温叙白桌上——里面是温叙白爱吃的清粥和小菜，从城东那家温叙白常去的夜宵店买的，还冒着热气。</p>\n<p>"先吃点东西再忙。"陆峥寒把保温袋放好，然后才走到洗手间用毛巾擦雨水。动作利落，显然已经习惯了这种"暴雨夜送饭"的流程。</p>\n<p>温叙白打开保温袋——白粥、腌黄瓜、凉拌木耳。全是清淡的。他看了一眼陆峥寒湿漉漉的后背，又看了一眼保温袋里冒着热气的粥。</p>\n<p>"你从城东买的？"</p>\n<p>"嗯。你上次说那家夜宵店的粥好喝。"</p>\n<p>"城东到这儿开车二十分钟，暴雨天至少四十分钟。"</p>\n<p>"没那么久，我开得快。"</p>\n<p>"暴雨天开快车？"温叙白的声音冷了半度——不是对陆峥寒冷，是对"暴雨天开快车"这件事冷。</p>\n<p>陆峥寒从洗手间出来，看到温叙白的表情，心虚地笑了："放心，安全到了。"</p>\n<p>温叙白没说话，起身去倒了一杯热水递给他。</p>\n<p>"先把自己弄干。"语气带着责备，但手很稳。</p>\n<p>陆峥寒接过水杯，看着温叙白认真却不说出口的心疼，心底暖意翻涌。他乖乖喝了一口水，然后在温叙白旁边的椅子上坐下。</p>\n<p>"你忙你的，我陪你。"</p>\n<hr>\n<p>两人并肩坐在工作室里。</p>\n<p>温叙白继续改图，陆峥寒处理文件。偶尔交换几句话——"这个参数对不对""三明治要不要加热"——氛围安静温暖，像共处了很多年的默契。</p>\n<p>凌晨十二点半，温叙白吃完了粥和小菜。陆峥寒默默收走空碗，用湿巾把桌面擦干净——动作熟练到像是做过一百次。</p>\n<p>凌晨一点，温叙白终于完成了修改，合上电脑，转头发现陆峥寒不知什么时候已经靠在沙发上睡着了。</p>\n<p>他侧躺在沙发上，一条手臂垫在头下当枕头，另一只手还握着手机——屏幕上停留在温叙白的聊天界面，最后一条消息是他发的"到了"。</p>\n<p>台灯的光落在他的侧脸上。睫毛在眼下投出一小片阴影，嘴唇微微张开，呼吸均匀。白天的<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>、晚上的黏人戏精，此刻全部收了起来，只剩下一张疲惫而安静的脸。</p>\n<p>温叙白看着他，心底的暖意几乎要溢出来。</p>\n<p>这个人。暴雨天开了四十分钟的车来给他送一碗粥，然后在旁边陪了他两个小时，自己却在沙发上睡着了。</p>\n<p>他轻轻起身，从柜子里拿出一条备用毯子，盖在陆峥寒身上。</p>\n<p>毯子落下的瞬间，陆峥寒动了一下，嘟囔了一句含糊不清的话。温叙白凑近听了两秒——</p>\n<p>"叙白……别熬夜……"</p>\n<p>说的是梦话。</p>\n<p>温叙白愣了一秒，然后轻轻弯了嘴角。</p>\n<p>他在陆峥寒身旁坐下来，靠在沙发背上，闭上了眼睛。</p>\n<p>窗外雨声渐小，夜色温柔。工作室里台灯还亮着，两个人靠在沙发上，肩头相抵，安然入睡。</p>\n<p>这个暴雨的深夜，因为彼此的陪伴，变得前所未有的温暖和安心。</p>\n<div class="hook">**【本章钩子：暴雨夜暖心守护，霸总冒雨送夜宵、陪加班到凌晨，两人相抵而眠！这份不言不语的陪伴，是比任何甜言蜜语都更深沉的爱。心动已到了临界点，只差一个契机就会破壳而出！】**</div>\n'},
  {title:'第50章 第二卷半程：暧昧深处，心动将明', vol:2, html:'<p>时间来到五月，滨水新区项目进入深化设计阶段。</p>\n<p>温叙白和陆峥寒的相处模式已经完全超越了"朋友"的范畴，却又没有正式确立关系。两人的生活深度交织——陆峥寒的衣物在温叙白的衣柜里占了三分之一，他的杯具在温叙白的厨房里有了固定位置，他的车停在温叙白的车库里，他的拖鞋摆在温叙白家门口。</p>\n<p>他们共享早餐、共度夜晚、并肩作战、互相报备。温叙白知道陆峥寒的咖啡偏好（黑咖啡，不加糖不加奶）、睡眠规律（入睡困难，经常凌晨两点才睡着）、压力反应（后颈肌肉绷紧，不自觉攥拳）。陆峥寒知道温叙白的洁癖边界（可以接受他的触碰，但不能接受其他人）、工作节奏（每画图两小时需要喝一次水）、情绪信号（沉默超过五分钟说明在生气，蹙眉超过三秒说明在设计上遇到问题）。</p>\n<p>他们对彼此的了解，比大多数情侣都深。</p>\n<p>只差那一句确定关系的告白。</p>\n<p>陆峥寒不急。他答应过温叙白"不管多久都等"。但这份克制里藏着的深情和渴望，随着时间推移越来越浓烈，像即将溢出的水，差一滴就会决堤。</p>\n<hr>\n<p>温叙白也感觉到了。</p>\n<p>他发现自己越来越习惯陆峥寒的存在——习惯早晨看到他的消息，习惯晚上和他说晚安，习惯他出现在自己生活的每一个角落。</p>\n<p>更让他心惊的是，他开始在意陆叙寒的一切——他有没有按时吃饭（经常没有）、有没有熬夜（几乎每天）、有没有被人欺负（偶尔有，但他自己处理了）、有没有不开心（不开心的时候会特别乖巧，反差极大）。</p>\n<p>这种在意已经远远超出了"朋友"的范畴，超出了"心软迁就"的底线。温叙白很清楚——这是一种刻意的、清醒的、无法忽视的心动。</p>\n<p>他不是被感动了才心动。他是在心动之后，花了很多时间才确认这份心动是真的。</p>\n<p>他感情迟钝，但不是木头。他只是需要比别人更长的时间，把感觉变成认知，把认知变成决定，把决定变成行动。</p>\n<p>而现在，他到了"决定"的门口。</p>\n<hr>\n<p>五月的一个傍晚，两人在温叙白家的阳台上吃晚饭。</p>\n<p>夕阳将整座城市染成暖金色。阳台朝西，光线正好打在桌面上，把两人的影子拉得很长。温叙白做了简单的两菜一汤——清炒西兰花、番茄炒蛋、紫菜蛋花汤。他不常做饭，但陆峥寒说他做的饭比外面好吃，他就偶尔做了。</p>\n<p>吃到一半，陆峥寒的手机响了，是林舟汇报工作。他三言两语处理完，放下手机，继续吃饭。</p>\n<p>温叙白看着他的侧脸——夕阳打在他的轮廓上，鼻梁的阴影投在脸颊上，下颌线在光里显得格外分明。他处理完工作后转头，对上温叙白的视线，笑了一下。</p>\n<p>"看我干什么？"</p>\n<p>"没干什么。"温叙白低头夹菜。</p>\n<p>但他心里那根弦动了。</p>\n<p>他放下筷子。</p>\n<p>"峥寒。"</p>\n<p>陆峥寒微微一愣，放下筷子："怎么了？"</p>\n<p>温叙白直视他。夕阳从背后照过来，在他的清冷面容上镀了一层暖金色的光边。</p>\n<p>"你之前问我，需要多少时间。"</p>\n<p>陆峥寒的呼吸停了。心跳骤然加速，指尖微微发颤，目光紧紧锁在他脸上。</p>\n<p>"我想……"温叙白停了一下，像是在确认接下来的每一个字。然后他说完了——</p>\n<p>"我快准备好了。"</p>\n<p>这句话轻飘飘落下，却像一道惊雷，在陆峥寒心底轰然炸响。</p>\n<p>他喉间猛地发紧，眼眶微微发热。一时间百感交集——七年、三个月、无数次被打断的告白、无数次克制和等待——全部在这六个字里找到了出口。他说不出半个字。</p>\n<p>温叙白看着他微微泛红的眼眶，心底泛起从未有过的柔软。他嘴角弯起一个温暖的弧度——不是对外人的清冷，是只给陆峥寒的、带着纵容的笑。</p>\n<p>"别哭。"</p>\n<p>"谁哭了。"陆峥闷声应，但声音里的颤抖出卖了他。他别过头，用手背擦了一下眼角，动作很快，像是不想让温叙白看到。</p>\n<p>但温叙白看到了。</p>\n<p>两人对视，夕阳的余晖将彼此的身影交融在一起。</p>\n<p>这一刻，他们都清楚地知道——那层最后的窗户纸，即将被捅破。</p>\n<p>而这一次，不需要蓄谋，不需要套路，不需要任何花招。</p>\n<p>只需要一个合适的时机，一句水到渠成的话。</p>\n<div class="hook">**【本章钩子：温叙白亲口说出"我快准备好了"，心动的临界点正式到来！七年的蓄谋、数月的陪伴、无数次破例与偏爱，终于要在这个初夏结出果实。告白即将到来——第三卷的序幕即将拉开！】**</div>\n'},
  {title:'第51章 独家特权，睡前故事', vol:2, html:'<p>自从温叙白说出"快准备好了"之后，两人的相处模式又微妙地变了。</p>\n<p>温叙白开始不自觉地给陆峥寒更多"特权"——</p>\n<p>第一个特权是留宿。以前陆峥寒在温叙白家待到十点就会被客气地赶走，现在温叙白不再提"你该回去了"。陆峥寒的牙刷在温叙白的洗手台上有了固定位置，他的拖鞋摆在门口，睡衣叠放在客房的枕头上。温叙白默认了他留宿在客房——只是客房，不是主卧。</p>\n<p>第二个特权是消息。以前温叙白回复消息的频率是"看到了就回"，现在变成了"看到立刻回"。早上醒来第一件事是看手机，不是看时间，是看陆峥寒有没有发消息。如果没有，他会等——等到七点四十五，陆峥寒的早安消息准时到达，然后他回复一个"嗯"，开始新的一天。</p>\n<p>第三个特权是主动。温叙白偶尔会在忙碌间隙主动发一条"在忙吗"——不是为了说事，只是想知道他在不在。这种消息以前绝不会从温叙白手里发出来。</p>\n<p>这些细微的改变，陆峥寒全部珍藏在心底。每一次新的特权都像收到礼物一样让他欢喜——他不敢表现得太明显，怕温叙白意识到自己在"给特权"然后收回去。</p>\n<hr>\n<p>这天晚上，温叙白加班到很晚。</p>\n<p>他在书房处理滨水新区二期方案的修改意见，从下午三点一直坐到晚上十一点。陆峥寒照例陪在书房里——他坐在书房角落的单人沙发上，腿上搁着一本书，台灯在身边投下暖黄色的光圈。</p>\n<p>两人各自忙碌，偶尔交换一个眼神或一句话，但大部分时间安静。这种安静不是尴尬的沉默，而是一种默契的共处——两个人在同一空间里做各自的事，不需要填满每一秒。</p>\n<p>十一点半，温叙白处理完最后一封邮件，揉了揉发酸的眼睛。他转头，看到陆峥寒正安静地靠在沙发上看书。</p>\n<p>灯光落在他侧脸上，轮廓柔和。他翻页的动作很轻，指尖捏住书页一角，缓缓翻过去，没有发出声音。他的表情专注而平静——不是在外面的冷硬，也不是在温叙白面前的软糯，而是一种介于两者之间的、最真实的状态。</p>\n<p>"峥寒。"温叙白轻声开口。</p>\n<p>"嗯？"陆峥寒抬头，目光从书页移到他脸上。</p>\n<p>温叙白看着他那双在灯光下显得格外深邃的眼睛，忽然觉得累了。不是身体的累，是一种长时间高强度工作后的精神疲惫——他需要一个声音把他从图纸和数据的维度拉回来。</p>\n<p>"给我念一段。"他指了指陆峥寒手里的书，语气清冷却带着罕见的慵懒和依赖，"我累了，不想看字。"</p>\n<p>陆峥寒微微一愣。</p>\n<p>温叙白从不提这种要求。他是那种"我可以自己解决一切"的人——累了自己扛，困了自己撑，不会主动向任何人索取陪伴。但今天他说了——"给我念一段"。</p>\n<p>陆峥寒压下心底翻涌的欢喜和心疼，乖巧地点头。他翻开书，找到了上次读到的位置，声线低沉柔和，开始缓缓念出书中的文字。</p>\n<p>是一本关于建筑空间的书——温叙白自己买的，被陆峥寒拿来翻了。文字描述的是安藤忠雄的光之教堂，那种用混凝土切割光线的建筑哲学。</p>\n<p>陆峥寒的声线在安静的书房里展开，像一条低沉的河流。他念得不快，偶尔会在关键句子处停顿，给文字留出呼吸的空间。</p>\n<p>温叙白靠在椅背上，闭着眼睛听。</p>\n<p>他听到了"光线""混凝土""十字架""沉默"这些词。如果是他自己看，他会分析安藤忠雄的材料选择和空间比例。但陆峥寒念出来的声音让这些文字变了质感——从专业术语变成了某种温暖的、包裹性的白噪音。</p>\n<p>他的呼吸渐渐平缓绵长。</p>\n<p>不知过了多久，温叙白的呼吸变得均匀，沉沉睡去。</p>\n<p>陆峥寒轻声停下，合上书，看着他安静的睡颜。台灯的光落在温叙白的脸上，睫毛在眼下投出一小片阴影，嘴唇微微放松——他醒着时总有一种不自觉的紧绷，只有睡着时才会完全松开。</p>\n<p>陆峥寒起身拿过毯子，轻轻盖在他身上。然后在他身旁的椅子上坐下，继续安静地看书，守着他入睡。</p>\n<p>这是他们之间最新的"独家特权"——睡前故事，只属于两个人的温柔仪式。</p>\n<div class="hook">**【本章钩子：睡前故事新特权解锁，温叙白展现前所未有的依赖！每一个新特权都是心动的注脚，告白越来越近了！】**</div>\n'},
  {title:'第52章 陆瑶来访，八卦助攻', vol:2, html:'<p>陆瑶回国后，和温叙白的关系出乎意料地亲近。</p>\n<p>她时不时不请自来地出现在温叙白的工作室，带着零食和八卦。嘴上说是来"监督哥哥有没有欺负你"，实际上就是来串门。温叙白一开始对她频繁的造访有些不适——他的洁癖让他不喜欢非工作相关的人出现在工作室——但陆瑶有一种天然的、不带攻击性的热情，几次之后就让他放下了戒备。</p>\n<p>她每次来都坐在工作室角落的沙发上，吃零食、翻杂志、偶尔看温叙白画图。她不乱碰东西，坐姿规矩，零食渣会自己收拾干净——这一点让温叙白对她多了几分容忍。</p>\n<p>"温设计师，我跟你说，我哥从小就闷骚。"陆瑶盘腿坐在沙发上，吃着薯片，神神秘秘地压低声音，像在讲什么机密情报。</p>\n<p>温叙白正在画图，笔没停，但耳朵动了一下。</p>\n<p>"他十岁的时候暗恋隔壁班一个小女孩，不敢说话，就每天故意从人家教室门口走过。走了一年，人家根本不认识他。"</p>\n<p>温叙白的笔微微一顿。嘴角动了一下，但压住了。</p>\n<p>"后来呢？"他问，语气清冷却带着不易察觉的好奇。</p>\n<p>"后来人家转学了，我哥回家哭了整整一个晚上——关在房间里不出来，谁敲门都不应。第二天跟没事人一样去上学，但从那以后他就再也没暗恋过谁。"</p>\n<p>陆瑶摇头叹气，把薯片袋口折好——她注意到温叙白不喜欢薯片碎屑掉出来。</p>\n<p>"我一直以为他这辈子要孤独终老了。他在国外读书那几年，多少女生追他，他一个都不理。回国接手陆氏之后更夸张，身边除了林舟和工作，连个说话的人都没有。老夫人急得不行，安排了好几次相亲，他面都不露。"</p>\n<p>她看了看温叙白，笑得促狭："没想到他对你倒是主动得很。装可怜、装胃痛、装孤单——什么招都用了。我从小看到大的招数，全用在你身上了。"</p>\n<p>温叙白放下笔，转过身面对陆瑶。</p>\n<p>"你是说，从十岁那次之后，他没有再暗恋过任何人？"</p>\n<p>"没有。"陆瑶肯定地摇头，"直到遇见你。"</p>\n<p>温叙白沉默了几秒。</p>\n<p>他想起陆峥寒说过的话——"七年前看到那座集装箱图书馆的那一刻"。七年前，陆峥寒二十一岁，他二十岁。从那以后，陆峥寒用七年时间准备自己，走到他身边。</p>\n<p>七年。没有暗恋过任何人。所有的等待和准备，都是为了一个人。</p>\n<p>"谢谢你告诉我这些。"温叙白语气认真。</p>\n<p>陆瑶摆摆手："别谢我，我只是看不下去他那个闷骚样了。你们赶紧在一起吧，我哥等了七年，再等下去要变成海城最老的单相思了。"</p>\n<p>温叙白耳尖微红，没有回答。他转回去继续画图，但陆瑶注意到——他拿起笔的姿势比刚才稳了，像是某种犹豫被消除了。</p>\n<p>"对了，"陆瑶突然想起什么，"你知道我哥手机壁纸是什么吗？"</p>\n<p>温叙白没回头："不知道。"</p>\n<p>"是你设计的城东图书馆的照片。"陆瑶说，"他用了三年了，从来没换过。我有一次看到还以为他多喜欢那座建筑，后来才知道——他喜欢的是设计那座建筑的人。"</p>\n<p>温叙白的笔尖在图纸上停了两秒，留下一个多余的墨点。</p>\n<p>他没有转身，但耳朵红到了脖子根。</p>\n<div class="hook">**【本章钩子：陆瑶八卦助攻，揭露陆峥寒童年初恋往事——七年暗恋的分量再次加码！温叙白对这份心动的认知越来越清晰，告白只差临门一脚！】**</div>\n'},
  {title:'第53章 滨水工地，意外险情', vol:2, html:'<p>滨水新区项目进入实地勘察阶段。</p>\n<p>温叙白带队到滨水工地进行地质勘探复核。这片地靠近河岸，地下水位高，地质条件复杂——温叙白对每一个数据都不放心，坚持亲自下工地查看。</p>\n<p>陆峥寒原本要一起来，但临时有一个和管委会的对接会议推不掉。他让林舟全程陪同保护，临走前反复叮嘱："工地危险，让他别去河岸边上。"</p>\n<p>"放心，陆总。"林舟保证。</p>\n<p>但他低估了温叙白的执着——发现河岸附近土层颜色异常后，温叙白直接走过去取样。他蹲在地上用小铲挖了二十厘米深，正要把土样装进密封袋时，脚下的地面突然发出一声闷响。</p>\n<p>地面塌陷了。</p>\n<p>不是大面积塌方，只是局部的一小块——约一平方米的地面突然下陷了三十厘米。但在温叙白站着的位置，这一平方米就是全部。</p>\n<p>"小心！"林舟眼疾手快，一把拉住温叙白的手臂，将他拽回安全区域。温叙白被拉得踉跄两步，右脚踩空，脚踝猛地扭了一下，半跪在地上。</p>\n<p>"温先生！你没事吧？"林舟吓出一身冷汗，蹲下来检查他的脚。</p>\n<p>温叙白皱了皱眉，脚踝传来钝痛。他活动了两下，确认骨头没事，只是轻微扭伤。他摇头示意没事，让团队继续工作，自己坐在一旁的临时工棚里休息。</p>\n<p>林舟第一时间给陆峥寒发了消息：【温先生在工地扭伤了脚，已做简单处理，无大碍。】</p>\n<hr>\n<p>消息传到陆峥寒那里时，他正在会议室和管委会谈判。</p>\n<p>手机亮了。他低头看了一眼。</p>\n<p>脸色瞬间铁青。</p>\n<p>对面的管委会主任正在说话，但陆峥寒已经完全听不到了。他的注意力全部锁在手机屏幕上那行字——"温先生在工地扭伤了脚"。</p>\n<p>周身<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>翻涌，坐在他旁边的工作人员感觉到温度骤降，下意识往旁边挪了挪。</p>\n<p>"会议暂停，改期。"陆峥寒站起身，声线冰冷，没有半分解释。</p>\n<p>管委会主任愣住了："陆总，这个对接会约了三周——"</p>\n<p>"改期。"他重复了一遍，已经大步走出了会议室。</p>\n<p>林舟在门口等着，刚开口说"陆总，温先生他——"</p>\n<p>"车呢？"</p>\n<p>"已经备好了。"</p>\n<p>陆峥寒快步走向电梯，手机打字发给温叙寒：【你在哪？】</p>\n<p>温叙白回复：【工棚里，没事，别过来。】</p>\n<p>陆峥寒没回消息，直接上了车。</p>\n<hr>\n<p>二十分钟后，陆峥寒的车停在工地入口。</p>\n<p>他几乎是小跑着穿过工地——西装裤腿溅了泥、皮鞋踩了碎石、安全帽都没戴，被工地负责人在后面追着喊"陆总注意安全"。</p>\n<p>他推开工棚的门，看到温叙白坐在一把塑料椅子上，右脚踝上缠着冰袋，面容带着几分倦意。旁边的桌上放着一杯已经凉了的白开水。</p>\n<p>"让我看看。"陆峥寒蹲下身，小心翼翼地拿开冰袋，检查他的脚踝。指尖轻柔得生怕弄疼他——脚踝外侧微微肿胀，皮肤泛红，但没有淤血。</p>\n<p>"没事，只是轻微扭伤。"温叙白看着他焦急的模样，心底泛起暖意，语气不自觉放柔了，"别紧张。"</p>\n<p>"怎么能不紧张？"陆峥寒声音微微发颤，眼眶泛红，"你受伤了，我怎么能不紧张？"</p>\n<p>他抬起头看温叙白。那双在外面让所有人不敢直视的眼睛，此刻满是焦急和心疼，眼眶一圈泛红，嘴唇抿得很紧。</p>\n<p>温叙白看着他泛红的眼眶，喉间发涩，心底被巨大的暖意包裹。这个人——二十分钟飙车穿过半个海城，中断了约了三周的对接会，连安全帽都没戴就冲进了工地——全是因为他扭了一下脚。</p>\n<p>他伸出手，轻轻拍了拍陆峥寒的头发。语气清冷却温柔："我没事，别哭。"</p>\n<p>"谁哭了。"陆峥闷闷应声，但声音的颤抖出卖了他。</p>\n<p>他深吸一口气，站起来，然后弯腰，一手托住温叙白的膝弯，一手环住他的背，将他打横抱了起来。</p>\n<p>温叙白身体微僵，下意识想挣扎——他的洁癖让他不习惯被抱，更何况是这种公主抱。</p>\n<p>"别动。"陆峥寒收紧手臂，声音哑而坚定，"让我抱一会儿。"</p>\n<p>温叙白不再挣扎。</p>\n<p>他靠在陆峥寒宽阔温暖的怀里，能闻到他身上淡淡的古龙水味道，混杂着车里空调的冷气和一丝赶路时的薄汗。心跳贴着陆峥寒的胸膛，能感受到他心跳的频率——太快了，快到不正常。</p>\n<p>他在为我紧张。</p>\n<p>温叙白的耳尖染上绯色，心跳也跟着加速了。</p>\n<p>这是陆峥寒第一次公主抱他。</p>\n<p>而他没有拒绝。</p>\n<div class="hook">**【本章钩子：工地意外引发霸总暴走，中断会议飞奔到场，公主抱名场面诞生！温叙白首次被抱却没有拒绝——身体语言的坦率，比任何言语都更真实地暴露了心动！】**</div>\n'},
  {title:'第54章 养伤日常，宠溺升级', vol:2, html:'<p>温叙白脚踝扭伤，被迫在家休养一周。</p>\n<p>陆峥寒理所当然地搬进了温叙白的私宅，全程照顾。"理所当然"是他的原话——温叙白说"你不用天天来"，他回了三个字"理所当然"，然后拎着行李箱出现在门口。</p>\n<p>行李箱里装着：三套换洗衣服、一套睡衣、洗漱用品、一台笔记本电脑、一摞文件、以及一本《建筑空间论》——温叙白上次说想看的那本。</p>\n<p>温叙白看着他像搬家一样把东西搬进来，嘴角抽了一下："你这是来照顾我还是来定居？"</p>\n<p>"看情况。"陆峥寒把行李箱推到客房，"如果一周不够，就定居。"</p>\n<hr>\n<p>每天早晨，陆峥寒比温叙白早起半小时。</p>\n<p>他做好干净清淡的早餐——白粥配煎蛋，或者燕麦牛奶配全麦吐司，偶尔是小米南瓜粥。温叙白不爱吃油腻的，他就学了十几种清淡早餐的做法。</p>\n<p>早餐端到床头。温叙白醒来看见的第一眼，永远是陆峥寒温柔带笑的脸——和一碗冒着热气的粥。</p>\n<p>"脚还疼吗？"这是他每天的第一句话。</p>\n<p>"不疼了。"温叙白的回答每天一样。</p>\n<p>但陆峥寒还是会蹲下来，仔细检查他的脚踝，用指腹轻轻按压肿胀处，观察温叙白的表情——如果温叙白皱眉了，说明还疼；如果不皱眉，才是真的不疼了。</p>\n<p>第三天开始，温叙白不再皱眉。陆峥寒终于放下了心。</p>\n<hr>\n<p>白天，陆峥寒在客厅办公，温叙白在沙发上处理图纸。</p>\n<p>陆峥寒每隔一小时就会放下工作，端来温水或切好的水果，放在温叙白手边。</p>\n<p>"你的项目方案可以远程处理，不用急着去工地。"陆峥寒语气不容商量。</p>\n<p>"我知道。"温叙白抬头看他，眼底带着一丝无奈和纵容，"你别像个老妈子一样。"</p>\n<p>"你受伤了，我当然要照顾你。"陆峥寒理直气壮，"而且你平时照顾我更多——每天提醒我吃饭、帮我备湿巾、记得我所有的工作安排。现在换我照顾你，公平。"</p>\n<p>温叙白看着他认真的模样，心底暖意翻涌，没有再说什么，乖乖接受了这份无微不至的照顾。</p>\n<p>他注意到一个细节——陆峥寒切水果时，会把苹果切成大小完全一致的块，按温叙白的强迫症标准排列在盘子里。以前他不会这么做，是这段时间观察温叙白的行为模式后学来的。</p>\n<p>这个人在用他自己的方式，一点一点地适应温叙白的世界。</p>\n<hr>\n<p>晚上，陆峥寒会帮他热敷脚踝。</p>\n<p>他把温热的毛巾敷在温叙白的脚踝上，手指隔着毛巾轻轻按揉肿胀消退后的部位。手法专业温柔——他查了资料，学了正确的扭伤后恢复按摩手法，力度精确到不会疼但能促进血液循环。</p>\n<p>温叙白靠在沙发上，看着他认真专注的侧脸。台灯的光从侧面打过来，陆峥寒低着头，睫毛在脸颊上投下细密的阴影，嘴唇微微抿着——他专注时的习惯。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"他没抬头，手上动作不停。</p>\n<p>"你为什么对我这么好？"</p>\n<p>陆峥寒的手停了一下。他抬起头，看着温叙白。</p>\n<p>"因为你值得。"</p>\n<p>"值得"两个字，轻飘飘的，却重逾千钧。</p>\n<p>温叙白喉间发紧，心里被暖意彻底填满。他垂下眼帘，轻轻"嗯"了一声，不再说话。</p>\n<p>但他悄悄伸出手，轻轻覆上了陆峥寒帮他热敷的手背。</p>\n<p>指尖相触的瞬间，陆峥寒浑身一震。他抬头对上温叙白的目光——那双清冷的眼底此刻柔软得不像话，像冰面下涌动的暖流。</p>\n<p>两人就这样安静地待着，手指相覆，暖意流转，无需言语。</p>\n<p>窗外的城市灯火明灭，室内只有两人交织的呼吸。</p>\n<p>这一周的养伤时光，成了两人之间最亲密、最温柔的日常。</p>\n<div class="hook">**【本章钩子：养伤日常宠溺升级，温叙白主动覆手名场面！从被动接纳到主动靠近，身体的语言比心更诚实。告白只差一个契机，一个恰到好处的瞬间！】**</div>\n'},
  {title:'第55章 城东落成，高光时刻', vol:2, html:'<p>五月末，城东文化中心正式落成。</p>\n<p>这是温叙白职业生涯的里程碑作品——从设计到施工，历时一年半，终于以完美的姿态呈现在海城面前。</p>\n<p>建筑坐落在城东老工业区的核心地带，由三座旧厂房改造而成。温叙白保留了原有工业建筑的钢架结构和砖墙肌理，在内部嵌入了现代的玻璃幕墙和木质空间。外立面用锈红色耐候钢板包裹，与周围的绿植形成材质对比——这是他最擅长的"新旧对话"手法。</p>\n<p>落成典礼盛大隆重。海城市领导、建筑界同仁、媒体记者齐聚一堂，两百多人在入口广场上等着温叙白致辞。</p>\n<p>温叙白站在文化中心入口处的水景旁，面对镜头和话筒，清冷从容地介绍设计理念。</p>\n<p>"城东文化中心的设计核心是\'记忆与新生\'。三座旧厂房是城东工业时代的记忆，我们没有拆除它们，而是在内部植入新的空间——让旧的结构承载新的功能，让历史和当代在同一个建筑里共存。"</p>\n<p>他指了指入口的水景："这个水景是整个建筑序列的起点。水流从锈钢墙面流出，经过三级跌水台，汇入镜面水池。水面倒映出建筑的轮廓和天空，让人在进入建筑之前，先感受到空间与自然的对话。"</p>\n<p>掌声响起。温叙白微微鞠躬，退到一旁。</p>\n<p>那座水景——光影、水流、建筑三位一体的设计，是他最满意的细节。但很少有人注意到，在水景的角落，池壁下缘靠近地面的位置，刻着一行极小的字，不仔细看根本发现不了：</p>\n<p>"致峥寒——安定与归属。"</p>\n<p>这行字是他落成前一周悄悄加上的。他告诉施工队这是设计师的签名惯例，施工队没多问。谁也没告诉——包括陆峥寒。</p>\n<hr>\n<p>陆峥寒是典礼上最骄傲的人。</p>\n<p>他站在嘉宾席第一排，看着温叙白在聚光灯下清冷绝尘的模样，眼底满是深情和骄傲。温叙白说"记忆与新生"时，他在人群里微微点头；温叙白指水景时，他顺着方向看过去——但他看到的不是水景，是温叙白逆光而立的侧影。</p>\n<p>典礼结束后，人群散去。两人走在文化中心的长廊里，阳光透过镂空穹顶洒下斑驳光影。长廊的地面是温叙白特意保留的旧厂房水泥地面，裂缝里嵌着铜条——日本金缮工艺的灵感，让裂痕变成装饰。</p>\n<p>"设计得真好。"陆峥寒由衷赞叹，"这是我见过最美的建筑。"</p>\n<p>"你还没看全。"温叙白微微弯唇，"跟我来。"</p>\n<p>他带着陆峥寒走回入口处的水景旁。夕阳西斜，金色的光打在水面上，波纹把光碎成无数细小的金点。</p>\n<p>温叙白指着水景角落、池壁下缘靠近地面的位置。</p>\n<p>"你蹲下来看。"</p>\n<p>陆峥寒半蹲下身，凑近了看。锈钢池壁上，刻着一行极小的字——小到要贴近才能辨认：</p>\n<p>"致峥寒——安定与归属。"</p>\n<p>他的瞳孔骤缩。</p>\n<p>空气像是被抽走了。整个世界在那一刻缩小到这行字的大小——七个字，刻在钢板上，不会褪色，不会消失，像一份永久存档的告白。</p>\n<p>他猛地抬头看向温叙白。</p>\n<p>温叙白站在他面前，逆光而立。夕阳从他背后照过来，在水面上铺了一层金，也在他的清冷面容上镀了一层暖光。他的嘴角弯着，带着罕见的、不加掩饰的温柔笑意。</p>\n<p>"谢谢你，峥寒。"他轻声说，"谢谢你让我知道，什么是安定与归属。"</p>\n<p>陆峥寒缓缓站起身。他的眼眶红了，喉间发紧，声音微微发颤："叙白……"</p>\n<p>"别急。"温叙白微微弯唇，语气清冷却温柔至极，"我说过，我快准备好了。"</p>\n<p>他微微前倾，在陆峥寒额头上落下极轻极轻的一吻——轻到几乎只是蜻蜓点水，嘴唇碰了一下就退开。但就是这一下，让陆峥寒浑身一震，像是被电击穿了所有防线。</p>\n<p>"这是预付定金。"温叙白退后半步，耳尖红透，语气故作平淡，"剩下的，等我准备好了再给。"</p>\n<p>陆峥寒摸着额头，站在夕阳和水景之间，眼眶发红，笑得像个得到全世界最珍贵礼物的孩子。</p>\n<div class="hook">**【本章钩子：城东落成高光时刻，水景角落的刻字告白——"安定与归属"！额头的轻吻是预付定金，正式告白进入倒计时！七年蓄谋终于看到终点，最甜蜜的时刻即将到来！】**</div>\n'},
  {title:'第56章 暧昧临界，只差一步', vol:2, html:'<p>额头一吻之后，两人之间的氛围微妙到了极点。</p>\n<p>温叙白依然清冷自持，但看向陆峥寒的目光里，多了一层不加掩饰的温柔和依赖。以前他看陆峥寒时是"清冷的平静"，现在是"清冷但底部有光"——区别很微妙，但陆峥寒看得出来。</p>\n<p>陆峥寒则比平时更加小心翼翼。额头那一吻让他整个人都处于一种"怕惊扰了美梦"的紧张状态——他不敢太黏、不敢太急、不敢提那天的事，生怕温叙白意识到自己越界了然后缩回去。</p>\n<p>他们的日常越来越像情侣——一起吃饭、一起加班、一起散步、互道早安晚安。陆峥寒偶尔会在温叙白专注画图时，偷偷牵他的手。温叙白不再抽回，甚至偶尔会回握——力度很轻，只持续两三秒，然后松开。但那两三秒够了。</p>\n<p>但谁都没有说出那句话。</p>\n<hr>\n<p>温叙白在心里反复琢磨——他到底在等什么？</p>\n<p>他不是不确定自己的心意。城东落成典礼上的那一刻，他在水景旁看着陆峥寒蹲下身辨认刻字时的表情——从不置信到颤抖到眼眶泛红——他就已经确定了。</p>\n<p>他不是不喜欢陆峥寒。相反，他太喜欢了。喜欢到"喜欢"这个字眼都不够用——它太轻了，装不下这几个月里积累的所有重量。</p>\n<p>他在等的是一个"对的时刻"。</p>\n<p>不是随便一个傍晚、随便一张餐桌前的时刻。而是一个值得把这句话郑重交付出去的时刻——就像建筑落成需要一个典礼，告白也需要一个仪式感。</p>\n<p>他不知道那个时刻什么时候来。但他知道它近了。</p>\n<hr>\n<p>这天傍晚，两人在阳台上吃晚饭。</p>\n<p>夕阳如火，将整个西边的天空烧成橘红色和紫色的渐变。温叙白做了一碗简单的阳春面——他最近在学做面，陆峥寒说他做的面比外面馆子好吃（虽然实际上只是不放太多油盐，符合他的清淡口味而已）。</p>\n<p>两人吃面，有一搭没一搭地聊天。</p>\n<p>"峥寒。"温叙白忽然放下筷子，目光直视他。</p>\n<p>陆峥寒正在吃面，听到自己的名字，筷子停了："怎么了？"</p>\n<p>"你觉得……我们现在算什么关系？"</p>\n<p>这个问题来得猝不及防。陆峥寒的心跳骤然加速，指尖微微发颤，面条差点从筷子上滑落。</p>\n<p>他想说"情侣"，但又怕说错——如果温叙白觉得还没到那一步怎么办？想说"朋友"，但显然不只是——他们牵过手、亲过额头、互相报备、同住一个屋檐下，这不是朋友。</p>\n<p>"你希望我们是什么关系？"他小心翼翼地反问。</p>\n<p>温叙白沉默了两秒。</p>\n<p>夕阳在他脸上投下暖金色的光，那双眼底泛起细碎的光芒，嘴角弯起一个极淡的弧度。</p>\n<p>"我在问你。"</p>\n<p>陆峥寒喉间发紧。他放下筷子，深吸一口气，语气前所未有的认真和郑重——</p>\n<p>"叙白，我希望我们是——"</p>\n<p>话还没说完，温叙白的手机忽然响了。</p>\n<p>铃声在安静的阳台上格外刺耳。温叙白低头看来电显示——工作室座机。城东文化中心的景观照明系统在今晚调试，如果出了故障必须他亲自处理。</p>\n<p>他看了一眼陆峥寒，微微蹙眉。对他说了句"等一下"，接起了电话。</p>\n<p>"嗯……照明控制系统死机了？……重启过了？……不行的话先手动切换备用线路，我十分钟后远程接入……"</p>\n<p>三分钟后，电话挂了。温叙白拿起笔记本电脑开始远程处理。</p>\n<p>陆峥寒坐在对面，看着他专注处理工作问题的侧脸。那句话已经到了嘴边——"我希望我们是恋人"——但被电话打断后，再开口的时机已经过去了。</p>\n<p>强说出来就不够好了。</p>\n<p>他默默拿起筷子，继续吃面。</p>\n<p>面已经有点凉了。他慢慢吃着，目光落在温叙白低头敲键盘的侧脸上，思绪不知不觉飘远了。</p>\n<p>——七年前。</p>\n<p>那年他二十一岁，刚从祖父手里接过陆氏的烂摊子，整个人被压得喘不过气。父亲母亲走了三年，留下一堆烂账和一个摇摇欲坠的集团。他白天开会、谈判、处理危机，晚上失眠、焦虑、对着天花板发呆。</p>\n<p>林舟那时候还只是行政部的一个小职员，有一次看他加班到凌晨三点，小心翼翼地建议："陆总，城东新开了一座图书馆，说是用旧集装箱改造的，设计很特别。您要不下班去走走？"</p>\n<p>他本来没打算去。但那个周末实在睡不着，凌晨四点开车到了城东。</p>\n<p>图书馆建在老城区的一片空地上，由十二个退役的海运集装箱堆叠拼接而成。外立面保留了集装箱原本的铁锈蓝和工业标记，但内部被改造成了温暖的阅读空间——原木书架、暖黄灯光、布艺座椅，工业粗粝和人文温润之间的张力恰到好处。</p>\n<p>凌晨五点，图书馆还没开门。他在外面站了一会儿，绕着建筑走了一圈，发现东侧有一面集装箱壁被切成了斜角，形成一道窄窄的缝隙。晨光从缝隙间挤进来，在地面上投下一束锐利的光线——他后来才知道，这个角度经过精密计算，每天日出后的第一个小时，光线会从缝隙间穿过，在地面上形成一个移动的光圈。</p>\n<p>他蹲下来，把手伸进光圈里，看光落在掌心。</p>\n<p>那一刻他忽然觉得——这个世界好像没那么糟。</p>\n<p>后来他绕到入口，看到了一块小小的铭牌。铭牌上刻着设计师的名字：</p>\n<p>"温叙白。"</p>\n<p>三个字。钢制铭牌上的字，晨光里微微发亮。</p>\n<p>他念了一遍。"温叙白。"——声调像是从高处落下的水，清而干净。</p>\n<p>他不知道这个人是谁，多大年纪，长什么样子。但他记住了这个名字——就像记住一个坐标，一个方向，一束光。</p>\n<p>后来他查了。温叙白，二十岁，建筑系大三学生。那座集装箱图书馆是他的课程设计作业，被导师推荐给了城东社区改造项目，居然真的落地建成了。</p>\n<p>二十一岁的陆峥寒坐在车里，翻着手机上查到的信息，忽然觉得心跳不太对劲——不是焦虑的那种快，是另一种快。他说不上来。</p>\n<p>那天之后，他开始关注建筑界动态，定期搜索"温叙白"这个名字。温叙白毕业、获奖、成立工作室、拿下第一个商业项目——每一步他都看在眼里。</p>\n<p>他以为这只是对一个有才华的设计师的欣赏。直到三年后，他在一个建筑论坛上远远看到温叙白本人——清瘦、干净、站在人群之外，手里端着一杯没怎么喝的咖啡，目光冷淡地扫过喧闹的会场，像一座孤岛。</p>\n<p>他的心跳又不对了。</p>\n<p>这一次他知道了那种快叫什么。</p>\n<hr>\n<p>"峥寒？"</p>\n<p>温叙白的声音把他拉回来。</p>\n<p>陆峥寒眨了眨眼，发现面碗已经空了，筷子还握在手里，而温叙白已经合上电脑，正看着他。</p>\n<p>"想什么呢？"温叙白问。</p>\n<p>"想你。"陆峥寒说。</p>\n<p>温叙白看了他一眼，没接话，但耳尖微微红了。</p>\n<hr>\n<p>等温叙白处理完紧急事务，已经过去了四十分钟。夕阳沉了下去，天色暗了，路灯亮了。</p>\n<p>他合上电脑，转头看向陆峥寒。</p>\n<p>陆峥寒正在收拾碗筷，把两人的面碗叠在一起，拿进厨房。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"他在厨房里应声，水龙头开着。</p>\n<p>"刚才的话——"</p>\n<p>"不急。"陆峥寒的声音从流水声中穿过来，温和而笃定，"等准备好了再说。"</p>\n<p>温叙白沉默了几秒，轻轻"嗯"了一声。</p>\n<p>两人都知道，那一句话已经到了嘴边。</p>\n<p>只差一个不被打断的契机。</p>\n<div class="hook">**【本章钩子：告白对话被意外打断，那一句话到了嘴边却没能说出口！暧昧已经到了临界点，只差一个完美时机。第二次告白尝试即将到来——这一次，不会再被打断！】**</div>\n'},
  {title:'第57章 夏夜星空，告白将临', vol:2, html:'<p>六月初，海城入夏。</p>\n<p>滨水新区项目进入中期阶段，温叙白连续加班两周后，难得有了一个完整的周末。</p>\n<p>周六下午，陆峥寒发来消息：今晚去一个地方？</p>\n<p>温叙白回复：去哪。</p>\n<p>陆峥寒：城东六十公里，有个山顶观星台。天气好的话能看到银河。</p>\n<p>温叙白盯着屏幕看了三秒。他不爱去陌生的地方，不爱坐长时间的车，不爱露天环境——虫子、灰尘、不可控的气温变化，每一项都在踩他的洁癖雷区。</p>\n<p>但他打字回复：好。</p>\n<p>发完那个字之后，他自己愣了一下。</p>\n<p>什么时候开始，他对陆峥寒的邀约，连犹豫都不犹豫了？</p>\n<hr>\n<p>傍晚六点，陆峥寒的车停在温叙白工作室楼下。</p>\n<p>温叙白下楼时，看到副驾座上放着一个保温袋和一条薄毯。</p>\n<p>"毯子是给你准备的，山上风大。"陆峥寒解释，"保温袋里是热可可和三明治，你晚上八点一定会饿。"</p>\n<p>温叙白没说话，但嘴角动了一下。</p>\n<p>他确实每晚八点准时饿。这个习惯连他自己都没太留意，但陆峥寒记住了。</p>\n<p>车子驶出市区，沿着盘山公路一路向上。暮色从天边漫开来，远处的海城变成了一片亮闪闪的灯海，越来越小，越来越远。</p>\n<p>温叙白靠在座椅上，侧头看着窗外。山道两旁的树影飞速后退，风从半开的车窗灌进来，带着松脂和泥土的气息。</p>\n<p>"冷吗？"陆峥寒问。</p>\n<p>"不冷。"</p>\n<p>陆峥寒伸手把车窗关上一点，只留一条缝。</p>\n<p>温叙白看见了，没吭声。</p>\n<hr>\n<p>观星台建在海拔一千二百米的山顶，是一块向外延伸的半圆形平台，三面悬空，视野极开阔。</p>\n<p>两人停好车，走上平台时，天已经完全黑了。</p>\n<p>温叙白站在平台边缘，仰头望去，呼吸停了一拍。</p>\n<p>他见过世界上最精致的建筑，见过最讲究的光影设计，但头顶这片星空，是任何人工设计都无法复制的——银河从东北方横贯天顶，光带浓淡分明，繁星密布到仿佛被人一把撒在黑绒布上。没有城市光污染的干扰，每一颗星都亮得清清楚楚。</p>\n<p>风从三面灌上来，带着山顶独有的凉意。六月的海城城区闷热潮湿，但这里至少低了十度。</p>\n<p>温叙白下意识抱了一下手臂。</p>\n<p>下一秒，一条薄毯落在他肩上，被一双温暖的手仔细掖好边角。</p>\n<p>"说了让你多穿一件。"陆峥寒的声音从身后传来，语气带着一丝不易察觉的嗔怪。</p>\n<p>"不冷。"温叙白条件反射否认。</p>\n<p>陆峥寒没拆穿他，在他身旁坐下来。</p>\n<p>平台边缘有一排石阶，两人并肩坐着，脚悬在悬崖上方，面前是整个夜空。</p>\n<p>温叙白把毯子裹紧了一点，没把陆峥寒的那份还回去。</p>\n<hr>\n<p>两人就这样安静地坐了很久。</p>\n<p>风声、虫鸣、远处山脚偶尔传来一两声犬吠，构成一种奇异的安静。</p>\n<p>温叙白不是不怕冷场的人。他的社交直觉极差，和大多数人独处时，沉默会让他焦虑，他会用低头看手机或找话题来填补空白。</p>\n<p>但和陆峥寒坐在这里，沉默不让他焦虑。</p>\n<p>相反，他觉得舒服。</p>\n<p>这种"不说话也不尴尬"的状态，在温叙白二十七年的人生里，从来没有出现过。</p>\n<p>他侧头看了陆峥寒一眼。男人正仰头望着星空，侧脸的轮廓在星光下冷峻而柔和，下颌线不再绷着——在温叙白面前，他从来不绷着。</p>\n<p>睫毛在眼下投出一小片阴影。</p>\n<p>温叙白忽然想起很多事。</p>\n<p>想起第一次见面，陆峥寒对所有人冷如寒冰，唯独对他委屈巴巴地说"没人给我煮粥"。想起那次发烧，陆峥寒红着眼眶守了他一夜，第二天处理完跨国危机又装作若无其事。想起坦白那晚，陆峥寒说"我怕你知道真相之后，再也不理我了"时声音里的颤抖。</p>\n<p>想起每一次被打断的告白——在天台被电话打断，在车里被雨声打断，在工作室被敲门声打断。</p>\n<p>三次。</p>\n<p>陆峥寒想告白三次，三次都被打断。但温叙白每一次都看见了——看见他鼓起勇气时喉间的滚动，看见他被打断时眼底一闪而过的失落，看见他笑着说"下次再说"时攥紧又松开的拳头。</p>\n<p>温叙白感情迟钝，但不是瞎。</p>\n<p>他只是需要比别人更长的时间，才能把心里那些模糊的、说不清楚的东西，理成一个可以出口的句子。</p>\n<p>而现在，他理清楚了。</p>\n<hr>\n<p>"峥寒。"温叙白开口，声线在夜风中格外清透。</p>\n<p>陆峥寒转头看他。</p>\n<p>"嗯？"</p>\n<p>"上次被打断的话——你还想说完吗？"</p>\n<p>陆峥寒的身体几乎不可察觉地僵了一瞬。温叙白感觉到身旁的空气变了密度——男人的呼吸停了一拍，然后加速。</p>\n<p>"叙白，我想说完。"他声线发哑，每一个字都像是从喉咙里艰难挤出来的，"但我更想……听你先说。"</p>\n<p>温叙白微怔。</p>\n<p>他看着陆峥寒的眼睛——那双在外面<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>、冷到让人不敢直视的眼睛，此刻满是星光，也满是不安。像是一个等了太久的人，害怕答案来的同时，更害怕答案不来。</p>\n<p>温叙白忽然觉得心口某个位置软了一下。</p>\n<p>他这个人不会说漂亮话。二十七年的人生里，他对人说过最多的话是"不必了""谢谢""知道了"。他不会铺垫，不会渲染，不会用修辞让一句话变得更动听。</p>\n<p>但有些话，不需要修饰。</p>\n<p>"峥寒。"他开口了，声线比平时低了一点，也比平时慢了一点，"我这辈子最不擅长的事情，就是表达感情。"</p>\n<p>"你大概也知道，我以前不是一个会主动走近谁的人。洁癖、强迫症、对人的疏离——我自己都觉得麻烦。但你不一样。"</p>\n<p>他顿了一下，像是在确认接下来的每个字。</p>\n<p>"从你出现在我的生活里，到现在，你改变了我太多。我的洁癖、我的强迫症、我对孤独的习以为常……你一点一点地，把它们全部打破了。不是强行打破的——是你用煮粥、用毯子、用每一次恰到好处的退让和靠近，让我自己愿意打开的。"</p>\n<p>风从山崖下涌上来，吹动他额前的碎发。</p>\n<p>"你说你蓄谋了七年。我不知道七年是什么概念——我只知道，从认识你到现在这几个月，发生的事比我过去二十七年加起来都多。"</p>\n<p>"我开始期待一个人的消息。开始在意一个人有没有按时吃饭。开始觉得，有一个人在身边，好像也不错。"</p>\n<p>他微微偏头，目光直直地望进陆峥寒的眼睛。那双眼睛里有星光，有热意，有一层极薄的水光。</p>\n<p>温叙白一字一顿，清晰而笃定——</p>\n<p>"陆峥寒，我喜欢你。"</p>\n<p>"不是心软，不是迁就，不是习惯。是喜欢。"</p>\n<hr>\n<p>星空下，夏夜的风温柔地拂过两人的脸颊。</p>\n<p>陆峥寒喉间猛地发紧。</p>\n<p>他张了张嘴，什么都没说出来。眼眶开始发热，视线模糊了一瞬。七年的蓄谋、数月的等待、三次被打断的告白、无数个在温叙白看不见的角落独自咽下的委屈和思念——全部在这一刻炸开了。</p>\n<p>他以为自己会哭。</p>\n<p>但眼眶热了半天，最终没有掉下来。</p>\n<p>他只是用力吸了一口气，声音带着明显的颤抖："叙白……你知道我等这句话等了多久吗？"</p>\n<p>"知道。"温叙白的嘴角弯了一个极浅的弧度——不是笑，是一种确认，"七年。"</p>\n<p>陆峥寒愣住了。</p>\n<p>"你怎么知道？"</p>\n<p>"你说过，七年前走进城东图书馆，第一次知道我的名字。那时候你二十一岁，我二十岁。"温叙白语气平淡，像是在陈述一个设计参数，"你的\'蓄谋\'不是秘密，峥寒。你每次提到那座图书馆时，眼神都不一样——你不知道，但我知道。"</p>\n<p>陆峥寒看着他，说不出话。</p>\n<p>他以为自己藏得很好。</p>\n<p>"你——什么时候知道的？"</p>\n<p>"很早。"温叙白说，"但知道和确认是两回事。我需要时间。"</p>\n<p>他停顿了一拍，补了一句："现在确认了。"</p>\n<p>陆峥寒伸出手。</p>\n<p>不是猛地抓过去——是缓缓地，像一个在黑暗中走了很久的人终于看到了光，小心翼翼地伸出手去触碰。</p>\n<p>他握住了温叙白的手指。</p>\n<p>温叙白的手指微凉，骨节分明，指腹有常年握笔留下的薄茧。陆峥寒的掌心滚烫，微微出汗，指尖还在抖。</p>\n<p>手指紧紧交握。</p>\n<p>温叙白没有缩手。</p>\n<p>他的洁癖让他不喜欢皮肤接触，但陆峥寒的手——干燥、温暖、力度恰好——刚好在他的可接受范围之内。</p>\n<p>或者说，刚好在他愿意破例的范围之内。</p>\n<p>"我也喜欢你。"陆峥寒的声音沙哑而虔诚，像在念一段刻进骨头里的誓词，"从七年前看到那座集装箱图书馆的那一刻，到现在，到以后。"</p>\n<p>"叙白，你设计的那座图书馆——屋顶的倾角让雨声变成了节奏，缝隙间的光线在下午三点会形成一个光圈。我在那个光圈里坐了一整夜，第一次觉得世界没那么糟。"</p>\n<p>"后来我查到了设计师的名字——温叙白。三个字，我记了七年。"</p>\n<p>温叙白的手指在他掌心里微微收紧了一下。</p>\n<p>"你从没跟我说过这些。"</p>\n<p>"不敢说。"陆峥寒低声笑了一下，笑声里有如释重负的哽咽，"怕你觉得我变态。"</p>\n<p>温叙白沉默了两秒。</p>\n<p>"确实有点变态。"他说。</p>\n<p>陆峥寒："……"</p>\n<p>"但我不介意。"</p>\n<hr>\n<p>两人就这样坐在山顶，手握着手，面朝整片银河。</p>\n<p>风渐渐小了。山顶的夜安静到能听见彼此的呼吸声。</p>\n<p>温叙白的拇指在陆峥寒的手背上轻轻蹭了一下——是无意识的动作，但他自己没察觉。</p>\n<p>陆峥寒察觉了。</p>\n<p>他的心跳漏了一拍，然后狂跳起来。但他什么都没说，只是把温叙白的手握得更紧了一点。</p>\n<p>过了很久，温叙白开口："峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你三次被打断的告白——"</p>\n<p>"嗯。"</p>\n<p>"不用再说了。"</p>\n<p>陆峥寒一愣。</p>\n<p>温叙白偏头看他，眼底映着满天星光，嘴角的弧度比平时深了一点——是温叙白极罕见的、不带任何防备的笑容。</p>\n<p>"我已经回答了。"</p>\n<p>星空璀璨，夏夜温柔。</p>\n<p>两个人的手紧紧相握，手指紧紧交握。从山顶望下去，海城的万家灯火在脚下铺成一条光河，而头顶的银河在天空铺成另一条。</p>\n<p>一条在脚下，一条在头顶。</p>\n<p>他们坐在两条光河之间。</p>\n<hr>\n<p>回程的路上，温叙白靠着座椅睡着了。</p>\n<p>陆峥寒把车速放到最慢，绕了最远的那条路。</p>\n<p>不是因为路远。</p>\n<p>是因为他不想这段路结束。</p>\n<p>后视镜里，温叙白歪着头，呼吸均匀，毯子还裹在身上，嘴角残留着一丝极淡的笑意。</p>\n<p>陆峥寒腾出一只手，轻轻握了握温叙白搁在中央扶手上的手指。</p>\n<p>温叙白在睡梦中，无意识地回握了一下。</p>\n<p>七年的蓄谋，终于在这一夜，等到了回应。</p>\n<div class="hook">**【本章钩子：星空下的告白终于完成！"我喜欢你"三个字，等了七年。从蓄谋到双向奔赴，从破例到确认——温叙白说"不用再说了，我已经回答了"。这一刻是全书最重要的转折点。第三卷的甜蜜恋爱篇章，正式拉开序幕！】**</div>\n'},
  {title:'第58章 心动破壳，偏爱初尝', vol:2, html:'<p>告白后的第一个早晨，阳光格外灿烂。</p>\n<p>六月的海城入夏不久，阳光从窗帘缝隙间漏进来，在天花板上画出细长的光纹。温叙白睁开眼，第一反应是伸手摸手机——这是他这段时间养成的习惯，醒来先看陆峥寒有没有发消息。</p>\n<p>手机上有一条凌晨三点发的消息。</p>\n<p>陆峥寒：【睡不着，太开心了，翻来覆去想了一晚上。叙白，我们真的在一起了吗？】</p>\n<p>发送时间：凌晨三点零七分。</p>\n<p>温叙白看着这条消息，嘴角不自觉地弯起来。他想象了一下陆峥寒凌晨三点在床上辗转反侧、忍不住发消息确认的样子——堂堂陆氏掌权人，在商界让对手闻风丧胆的冷面阎王，此刻像个刚交到朋友的幼儿园小孩，半夜睡不着觉。</p>\n<p>他打字回复：【嗯，在一起了。别凌晨三点不睡觉。】</p>\n<p>对面秒回——显然也没睡。</p>\n<p>【！！现在也睡不着！太幸福了！叙白你醒了吗？你吃早餐了吗？今天见面吗？我马上过来！】</p>\n<p>连续四条消息，间隔不超过两秒。</p>\n<p>温叙白轻笑出声，摇了摇头，回复：【先去上班。晚上一起吃饭。】</p>\n<p>【好！！！晚上我来做饭！你想吃什么？】</p>\n<p>【随便。】</p>\n<p>【不行不能随便，你随便我就做一桌子你吃不完。】</p>\n<p>温叙白不再回复，放下手机，起身洗漱。</p>\n<p>镜子里的自己——和平常没什么区别。清冷眉眼，冷白皮肤，黑发微乱。但他盯着镜子看了两秒，觉得嘴角那个弧度怎么也压不下去。</p>\n<p>从今天起，他和陆峥寒正式在一起了。</p>\n<p>这个事实让他觉得——怎么说呢——不是心跳加速的那种激动，而是一种很安静的踏实感。像是拼了很久的拼图，最后一块终于落在了正确的位置。</p>\n<hr>\n<p>从这一天起，他们的关系正式从"暧昧"升级为"恋人"。但生活并没有因此发生翻天覆地的变化——温叙白依旧早上七点起床，洗漱后先喝一杯温水，然后坐到制图台前工作。陆峥寒依旧每天发消息、送饭、出现在他的生活里。一切照旧，只是有些东西不一样了——温叙白不再在消息末尾加句号，陆峥寒不再假装"顺路"。</p>\n<p>只是，多了一些恋人之间才有的小细节。</p>\n<p>比如，陆峥寒不再偷偷牵手。以前他牵温叙白的手像做贼一样，趁人不注意快速碰一下。现在他光明正大地伸出手，十指相扣，坦坦荡荡。温叙白不再抽回，甚至偶尔会主动把手放进他的掌心——虽然每次做完这个动作耳尖都会红。</p>\n<p>比如，温叙白不再刻意掩饰耳尖的红。以前他发现自己耳尖泛红时会别过头去或者拉高衣领遮住，现在他——还是会别过头，但不遮了。这是他的进步。</p>\n<p>比如，每晚的晚安消息后面，多了一个爱心表情。是陆峥寒先发的——【晚安❤️】。温叙白看了很久那个爱心，想了三秒钟要不要回一个。最终他回了一个句号。</p>\n<p>陆峥寒：【句号是什么意思？】</p>\n<p>温叙白：【就是句号。】</p>\n<p>陆峥寒：【你不回爱心吗？】</p>\n<p>温叙白沉默了十秒，回复了一个【❤】。</p>\n<p>陆峥寒截图保存了。</p>\n<p>比如，陆峥寒在商界依旧<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>。上午处理跨国并购案，下午碾压竞争对手，气场冷到会议室温度降五度。但回到温叙白身边，撒娇频率直接翻倍。</p>\n<p>"叙白，我想你了。"这是他现在每天至少说三次的话。</p>\n<p>"我们早上才分开。"温叙白语气无奈，但嘴角是弯的。</p>\n<p>"那也是想你了。八个小时不见等于八年。"</p>\n<p>"你上次说这个的时候是六个小时。"</p>\n<p>"所以这次更久了。"</p>\n<p>温叙白不再反驳，低头笑。清冷的眉眼温柔得一塌糊涂——这种表情只有陆峥寒见过，全世界独一份。</p>\n<hr>\n<p>从商业晚宴的初遇，到洁癖底线的反复破例；从峰会之上的真相摊牌，到温家旧事的沉重考验；从初雪共白头的心动萌芽，到星空下的告白确认。</p>\n<p>陆峥寒用了七年的蓄谋和无数个日夜的温柔浸润，终于让那位清冷迟钝的美人，心甘情愿地走进了他的世界。</p>\n<p>而温叙白也终于明白——那些他以为是"心软迁就"的偏爱，从来都是心动。</p>\n<p>从第一颗薄荷糖到十指相扣，从专属副驾到水景刻字，每一次破例，都是心跳的注脚。</p>\n<p>第二卷的故事，到此圆满。</p>\n<p>但他们的甜蜜，才刚刚开始。</p>\n<p>第三卷即将开启——告白确定后的甜蜜日常、公开半官宣、联手解决危机、对抗最后的阻力、双向坦诚过往……更多甜爽交织的篇章，正在前方等候。</p>\n<p>偏爱已成真，余生皆是你。</p>\n<div class="hook">**【本章钩子（第二卷终章）：告白完成，双向奔赴正式确认！从暧昧到恋人，七年的等待终于开花结果。第三卷即将开启：甜蜜恋爱日常、半官宣名场面、联手解决商业危机、对抗最后的家族阻力——最甜最爽的高潮篇章即将到来！】**</div>\n'},
  {title:'第59章 恋爱第一天，霸总变黏人精', vol:2, html:'<p>正式在一起的第一天，陆峥寒彻底放飞了自我。</p>\n<p>以前还要装一装、收一收——毕竟两人还没正式确定关系，他怕太过分会把温叙白吓跑。如今名正言顺了，黏人属性直接拉满，毫无保留。</p>\n<p>早上七点，温叙白刚睁开眼，手机就炸了。</p>\n<p>十七条消息。从六点十五分开始发，到七点零三分，时间间隔越来越短。</p>\n<p>六点十五分：【早安。】</p>\n<p>六点二十三分：【你醒了吗？】</p>\n<p>六点三十一分：【我做了个梦，梦见你了。】</p>\n<p>六点四十分：【怎么还不回我？】</p>\n<p>六点四十八分：【是不是睡太晚了？昨晚不该和你聊到一点。】</p>\n<p>六点五十五分：【我开始担心了。】</p>\n<p>七点整：【是不是不爱我了？】</p>\n<p>温叙白盯着最后一条消息，额角的青筋跳了一下。</p>\n<p>他回复：【才过去八个小时。而且昨晚是你说"再聊五分钟"说了六次。】</p>\n<p>对面秒回：【八个小时见不到你，等于八年。你怎么能怪我？我可是你的男朋友。你知道"男朋友"这三个字有多重吗？重到我凌晨三点就没睡着过。】</p>\n<p>"男朋友"三个字让温叙白的耳尖动了一下。他确实还不习惯这个称呼——二十七年来第一次有一个人用这个词定义自己，感觉像穿了一件新衣服，款式喜欢，但肩线还需要磨合。</p>\n<p>他回复：【去上班。别迟到了。】</p>\n<p>【你先说你早安。】</p>\n<p>【早安。】</p>\n<p>【！！收到早安！今天又是被叙白偏爱的一天！】</p>\n<p>温叙白放下手机，用枕头盖住脸。不是烦——是嘴角压不下去，怕被天花板看到。</p>\n<hr>\n<p>上午九点半，温叙白到工作室。</p>\n<p>助理小陈迎上来汇报今天的工作安排，说到一半，工作室的玻璃门被推开了。陆峥寒穿着黑色休闲西装走进来，手里拎着两杯咖啡和一个纸袋。</p>\n<p>"顺路。"他把一杯咖啡和纸袋放在温叙白桌上，"牛角面包，你爱吃的那家。"</p>\n<p>温叙白看了一眼——那家面包店在城西，工作室在城东，陆氏总部在城北。"顺路"的路程是横穿整个海城。</p>\n<p>"你不去公司？"</p>\n<p>"上午没什么重要的会。"陆峥寒在会客区的沙发上坐下，打开笔记本电脑，"我在这里处理文件，不吵你。"</p>\n<p>温叙白看了他一眼，没说话，低头开始工作。</p>\n<hr>\n<p>接下来的四个小时，陆峥寒确实很安静。他坐在沙发上处理文件、接电话、偶尔翻几页报告。但温叙白的助理小陈注意到了一个细节——陆峥寒每隔十五分钟左右就会抬头看温叙白一眼，看完后嘴角弯一下，然后低头继续工作。</p>\n<p>第十次抬头的时候，温叙白正好也抬头了。两人对视了一秒。</p>\n<p>陆峥寒笑了，无声地说了两个字。温叙白读唇读出来了——"好看"。</p>\n<p>温叙白别过头去，继续画图。但拿笔的手指微微收紧了。</p>\n<p>中午十二点，陆峥寒准时起身："吃饭。"</p>\n<p>"我还不饿。"</p>\n<p>"十二点了，该吃饭了。"语气不容商量。</p>\n<p>"这份图纸——"</p>\n<p>"图纸不会跑，胃会饿。"陆峥寒走过来，合上他的图纸本，"我已经订好了你常去的那家日料，十五分钟后送到。"</p>\n<p>温叙白无奈叹气，放下笔跟他去吃饭。</p>\n<hr>\n<p>下午五点，温叙白准备收拾东西下班。转头一看——陆峥寒还在沙发上，笔记本电脑开着，但人已经歪在靠垫上打瞌睡了。嘴唇微微张着，呼吸均匀，像一只大型犬在阳光下打盹。</p>\n<p>温叙白看了他十秒钟。</p>\n<p>然后走过去，把自己的外套搭在他身上。</p>\n<p>动作很轻，但陆峥寒还是动了。他半睁开眼，看到温叙白站在面前，迷糊地笑了一下："下班了？"</p>\n<p>"嗯。"</p>\n<p>"一起回去？"</p>\n<p>"嗯。"</p>\n<p>陆峥寒合上电脑，站起来，自然而然地伸出手。</p>\n<p>温叙白看了一眼那只手，犹豫了半秒，然后握住了。</p>\n<hr>\n<p>后来助理小陈私下跟同事说："温总今天笑了七次，创历史新高。原因未知，但跟沙发上那位陆总有直接关系。"</p>\n<p>同事问："是不是在谈恋爱？"</p>\n<p>小陈摇头："不知道。但温总今天画图画到一半突然停下来笑了一下，我工作三年第一次见。"</p>\n<div class="hook">**【本章钩子：恋爱第一天霸总黏人属性彻底爆发，十七条早安消息刷新纪录！甜度爆表的恋爱日常正式开启！】**</div>\n'},
  {title:'第60章 专属称呼，甜蜜密码', vol:2, html:'<p>在一起之后，陆峥寒开始变本加厉地使用各种甜蜜称呼。</p>\n<p>最初的几天还克制着，只是把"叙白"叫得更黏了一点，尾音微微上扬，像在撒娇。但很快就不满足了——他开始试探各种叫法。</p>\n<p>"叙白"太正式。</p>\n<p>"白"太生硬。</p>\n<p>"宝宝"——他试了一次。</p>\n<p>那天晚上，两人在沙发上看电影。温叙白靠在沙发一头，腿上搁着一本图纸——他看电影的同时候也会画图， multitasking 是他的基本操作。陆峥寒靠在另一头，脚搭在温叙白腿边。</p>\n<p>"宝宝，把遥控器递给我。"</p>\n<p>温叙白的手停了。</p>\n<p>他缓缓抬头，看向陆峥寒。那双清冷的眼底没有任何情绪波动——但这种"没有情绪"本身就是最危险的情绪。</p>\n<p>"叫什么？"温叙白问。语气平静得像暴风雨前的海面。</p>\n<p>陆峥寒的耳尖瞬间红了。他意识到自己闯了红线。</p>\n<p>"……叙白。"</p>\n<p>"叫叙白就好。"温叙白语气不容商量，把遥控器丢给他。</p>\n<p>"好吧。"陆峥寒接过遥控器，委屈地瘪了瘪嘴。</p>\n<p>过了两分钟，他忍不住又试探："那叙白能不能叫我\'峥寒\'以外的称呼？"</p>\n<p>温叙白从图纸里抬头看了他一眼。</p>\n<p>"你想要什么称呼？"</p>\n<p>"随便什么都行。"陆峥寒眼睛亮了，"你叫我什么都好听。"</p>\n<p>温叙白想了想，清冷地说："陆总。"</p>\n<p>"那是外人叫的！"</p>\n<p>"陆先生。"</p>\n<p>"更生疏了！"</p>\n<p>"阿陆。"</p>\n<p>"……像在叫狗。"</p>\n<p>温叙白嘴角动了一下——是快笑了但忍住了的那种动。</p>\n<p>他低下头，假装继续看图纸。过了五秒钟，用只有两人能听到的音量说了一个词：</p>\n<p>"阿峥。"</p>\n<p>陆峥寒瞬间安静了。</p>\n<p>整个客厅鸦雀无声。电影还在放，但他完全听不到了。他的耳尖红得像要滴血，眼底笑意温柔得快要化开——像一杯热可可被人搅了一下，暖意从底部翻涌上来，溢了满杯。</p>\n<p>"再叫一次。"他声音发哑。</p>\n<p>"不叫了，矫情。"温叙白起身走向厨房，步伐比平时快了两拍。耳尖同样红透了——他不用照镜子也知道。</p>\n<p>陆峥寒看着他的背影，靠在沙发上傻笑了整整三分钟。</p>\n<hr>\n<p>从此以后，"阿峥"成了温叙白在私下里偶尔使用的专属称呼。</p>\n<p>真的是"偶尔"——温叙白不是会频繁叫人昵称的性格。他大部分时候还是叫"峥寒"，只有在特定时刻才会叫"阿峥"——</p>\n<p>比如陆峥寒加班到很晚回来时："阿峥，吃夜宵了。"</p>\n<p>比如陆峥寒做了噩梦惊醒时："阿峥，没事，我在。"</p>\n<p>比如两人安静地靠在一起时，温叙白会轻声叫他："阿峥。"然后什么也不说，只是叫一下。</p>\n<p>每一次"阿峥"都让陆峥寒开心得像中了头彩。</p>\n<p>他曾经跟林舟说过一句话："林舟，你知道\'阿峥\'这两个字有多好听吗？"</p>\n<p>林舟面无表情地回答："陆总，您已经跟我说了三遍了。"</p>\n<p>陆峥寒不理他，继续笑着看手机里温叙白发来的消息——那条消息只有两个字：【阿峥。】</p>\n<p>他截了图，存进了那个叫"叙白偏爱实录"的相册。</p>\n<p>这个相册现在已经有三百多张截图了。</p>\n<div class="hook">**【本章钩子：专属称呼"阿峥"诞生，霸总被叫一次就沦陷！甜蜜密码只有两人知道，恋爱日常持续升温！】**</div>\n'},
  {title:'第61章 半官宣，圈层震动', vol:2, html:'<p>两人的关系很快在商圈传开了。</p>\n<p>起因是一次商业酒会——海城商会举办的年中联谊，到场的全是海城商圈有头有脸的人物。陆峥寒照例作为陆氏掌权人出席，温叙白作为滨水新区的首席设计师也在受邀之列。</p>\n<p>酒会前，温叙白在更衣室换衣服。他带了两套西装——白色和深蓝色。白色是正式场合的标配，深蓝色稍休闲一些。他犹豫了两秒，选了白色。</p>\n<p>陆峥寒看到他时，挑了一下眉："你也穿白色？"</p>\n<p>"怎么了？"</p>\n<p>"没什么。"陆峥寒低头看了一眼自己的白色衬衫——外套是深黑色的，但衬衫是白的。两人站在一起，一黑一白，像一组对照色。</p>\n<p>"像情侣装。"陆峥寒说。</p>\n<p>"不是。"温叙白走向门口，"只是碰巧。"</p>\n<p>"那我们以后多碰巧几次。"</p>\n<p>温叙白没理他。</p>\n<hr>\n<p>酒会进行到一半，温叙白的领带松了。</p>\n<p>他不太习惯打领带——平时在工作室都是穿衬衫不系领带的，今天是因为正式场合才系了。两条手指宽的深灰色领带在脖子上勒了两个小时，他下意识伸手想调整。</p>\n<p>陆峥寒比他更快。</p>\n<p>他走到温叙白面前，自然而然地伸手帮他整理领带——先把领带结松开半寸，再重新收紧到恰到好处的位置，最后把领带末端抚平。动作流畅熟练，像做过一千次。</p>\n<p>全程在五十位商圈嘉宾面前完成，没有任何遮掩。</p>\n<p>周围至少有十个人看到了这一幕。有人的咖啡杯停在嘴边，有人的笑容僵在脸上——陆峥寒帮人整理领带？那个连给人递水都嫌浪费时间的冷面阎王？</p>\n<p>更让人震惊的是接下来。</p>\n<p>整理完领带后，陆峥寒没有收回手。他的手指自然地滑下来，握住了温叙白的手。</p>\n<p>然后牵着温叙白走向卡座。</p>\n<p>全程没有任何遮掩，坦荡得像是已经做了一辈子的事。</p>\n<p>温叙白被他牵着走了三步，才反应过来——在大庭广众之下牵手。他的第一反应是抽手，但感觉到了陆峥寒掌心的温度和微微收紧的力度。</p>\n<p>他犹豫了半秒。</p>\n<p>没有抽。</p>\n<hr>\n<p>第二天，"陆氏总裁与顶尖建筑师温叙白疑似恋情曝光"的消息刷爆了海城商圈。</p>\n<p>不是微博热搜那种级别的爆炸——海城商圈是个小圈子，消息传播方式是微信群和饭局闲聊。但在这个圈子里，这条消息的杀伤力不亚于一枚深水炸弹。</p>\n<p>"陆峥寒和温叙白？真的假的？"</p>\n<p>"千真万确，昨晚酒会上当众牵手。"</p>\n<p>"陆峥寒帮温叙白整理领带！你见过陆峥寒帮谁整理过东西吗？"</p>\n<p>"怪不得滨水新区项目给了温叙白，原来是——"</p>\n<p>"别瞎说，温叙白的实力还用质疑？洛桑双年展年度青年建筑师是靠关系拿的？"</p>\n<p>温叙白看到这些议论时，正在工作室喝咖啡。手机屏幕上是林舟转发的几个商圈群截图，评论区已经炸成了一锅粥。</p>\n<p>他淡淡挑了挑眉，给陆峥寒发了一条消息：【你故意的？】</p>\n<p>陆峥寒秒回：【不是故意，是顺其自然。我不想再藏着了。叙白，我不想在别人面前假装和你只是普通朋友。你是我的人，我想让所有人知道。】</p>\n<p>温叙白看着这段话，沉默了十秒。</p>\n<p>他不是在犹豫要不要公开——他是在消化一种从未有过的感觉。有人想向全世界宣布"你是我的"。这种感觉对他来说太陌生了，陌生到他需要时间确认自己不讨厌它。</p>\n<p>确认完毕。不讨厌。甚至有一点——暖。</p>\n<p>他回复了一个字：【嗯。】</p>\n<p>一个"嗯"字，是默许，是认可，是无声的"我同意公开"。</p>\n<p>陆峥寒看着这个"嗯"字笑了整整五分钟，把正在汇报工作的林舟吓了一跳——他以为陆峥寒终于被工作压垮了精神状态。</p>\n<p>"陆总？您没事吧？"</p>\n<p>"没事。"陆峥寒收起手机，"继续说，滨水二期的进度报告。"</p>\n<p>但他的嘴角那个弧度，整个上午都没消下去。</p>\n<div class="hook">**【本章钩子：半官宣名场面诞生！霸总当众整理领带牵手，圈层震动！温叙白一个"嗯"字默许公开，坦荡偏爱不再隐藏！】**</div>\n'},
  {title:'第62章 陆瑶助攻，全家知情', vol:2, html:'<p>陆瑶是第一个公开表示支持的家属。</p>\n<p>她在朋友圈发了一条动态——配图是上次春节在老宅拍的合照：陆峥寒、温叙白和她三人站在银杏树下，陆峥寒面无表情（但耳尖微红），温叙白清冷疏离但嘴角带笑，陆瑶在中间比了个耶。</p>\n<p>配文：【终于不用看我哥单相思了！欢迎温设计师加入陆家！🎉】</p>\n<p>这条朋友圈发出去后三十秒，陆瑶的手机就炸了。</p>\n<p>陆家二房的亲戚们率先留言：</p>\n<p>【瑶瑶这是官宣？你哥真的和温叙白在一起了？】</p>\n<p>【我就说嘛，春节看他们俩那个氛围就不对劲！】</p>\n<p>【温设计师长得真好看，跟咱家峥寒很配！】</p>\n<p>陆家三房的姑妈也来凑热闹：【峥寒终于开窍了？我还以为他这辈子要跟工作结婚了。】</p>\n<p>陆瑶回复得飞快：【放心吧各位，我哥这次是认真的。等了七年呢！】</p>\n<p>"七年"这个数字让评论区再次沸腾。</p>\n<hr>\n<p>陆峥寒看到这条朋友圈时，正在公司开周会。</p>\n<p>林舟的微信先到了：【陆总，您表妹发朋友圈了。】</p>\n<p>陆峥寒点开一看——血压直接飙升了十个点。</p>\n<p>他立刻给陆瑶发消息：【你能不能别这么高调？】</p>\n<p>陆瑶秒回：【哥，你当众帮人整理领带的时候怎么不说高调？双标狗。】</p>\n<p>陆峥寒被噎得说不出话。他盯着"双标狗"三个字看了五秒钟，发现自己竟然无法反驳——因为他确实在酒会上当众整理了温叙白的领带。那比朋友圈高调一万倍。</p>\n<p>【至少让我先跟祖母说一声。】他打字回复。</p>\n<p>【老夫人早就知道了。】陆瑶回，【她上个月就问我是不是你跟温设计师在一起了，我说不知道，她说\'你看他的眼神就知道\'。哥，老夫人的眼光比你还毒。】</p>\n<p>陆峥寒沉默了。他没想到祖母早就看出来了。更没想到祖母没有任何反对的意思——老夫人是这个家里唯一能一句话决定一切的人。她不反对，就等于全家不反对。</p>\n<p>他心底涌上一股暖意。被家人接纳的感觉，和被温叙白接纳的感觉不一样——前者像冬天进门时暖气扑面，后者像深夜独自看到星空。两种暖，缺一不可。</p>\n<hr>\n<p>温叙白知道这件事后，是在当天下午。</p>\n<p>陆瑶把朋友圈截图发给了他，附言：【温设计师，我哥被我怼得没话说哈哈哈哈。】</p>\n<p>温叙白看着那条朋友圈——"终于不用看我哥单相思了"——沉默了几秒，然后难得笑出了声。</p>\n<p>不是那种礼貌的弯唇，是真的"笑出了声"——声音不大，但在安静的工作室里清晰可闻。助理小陈从门外探头看了一眼，确认温总的表情不是痛苦而是开心后，缩回了头。</p>\n<p>温叙白给陆峥寒发消息：【你表妹说得对。】</p>\n<p>陆峥寒回复：【你也帮着她欺负我。】</p>\n<p>温叙白看着那行字，想象了一下陆峥寒委屈巴巴打字的样子。他回复了一句自己都没想过会说的话：</p>\n<p>【乖。】</p>\n<p>发出去之后他自己愣了一下——他什么时候学会这种语气的？</p>\n<p>陆峥寒那边安静了整整三十秒——这在秒回时代等同于失语。然后回了一条：</p>\n<p>【……你刚才是不是说了"乖"？】</p>\n<p>温叙白不再回复，放下手机继续画图。但耳尖红到了脖子根。</p>\n<p>"乖"这个字从此成了温叙白偶尔使用的安抚武器。每次陆峥寒撒娇过度或者委屈巴巴的时候，温叙白拍拍他的头说一声"乖"，陆峥寒就瞬间安静，耳尖红透，乖巧得不像话。</p>\n<p>比任何指令都有效。</p>\n<p>比任何撒娇都致命。</p>\n<div class="hook">**【本章钩子：陆瑶朋友圈助攻，全家知情且支持！老夫人默许不反对，家族阻力彻底扫清。恋爱日常甜度持续爆表！】**</div>\n'},
  {title:'第63章 同居提议，心跳加速', vol:2, html:'<p>在一起一个月后，陆峥寒提出了同居。</p>\n<p>契机是一件小事——某个周日早上，温叙白打开衣柜找衣服，发现左边三分之一的区域被陆峥寒的物品占据了：三件换洗衬衫、一套睡衣、一条围巾、两双袜子。洗手台上多了一套洗漱用品。鞋柜里多了一双拖鞋。厨房里多了两包陆峥寒爱喝的挂耳咖啡。</p>\n<p>这些东西是陆峥寒这两个月陆续"遗忘"在温叙白家的——每次留宿后都会"不小心"多留一件。温叙白不是没发现，但他觉得不值得为了一件衬衫大动干戈，就默认了。</p>\n<p>直到今天打开衣柜，发现陆峥寒的衣物已经整齐地挂在他的衣物旁边——按照颜色从浅到深排列，符合他自己的强迫症标准。</p>\n<p>他盯着那个衣柜看了五秒钟。</p>\n<p>陆峥寒什么时候学会他的排列标准了？</p>\n<p>"你的东西已经在我家占了一半空间了。"温叙白关上衣柜门，语气清冷而无奈地走向客厅。陆峥寒正在厨房煎蛋——他已经熟练掌握了温叙白厨房里每样工具的位置。</p>\n<p>"那不如全部搬过来？"陆峥寒头也不回地说，语气像是随口一提。但温叙白注意到他煎蛋的手停了半秒——他在等回应。</p>\n<p>"全部？"温叙白在餐桌旁坐下。</p>\n<p>"嗯。"陆峥寒关了火，端着煎蛋走过来，放在温叙白面前，然后在他对面坐下。他的表情看似随意，但眼底有明显的期待和忐忑——像一个等待答案的人，试图用"不在意"来掩饰紧张。</p>\n<p>"我住的地方离你这儿开车十五分钟，每天来回跑浪费时间。而且——"他停了一下，"我每天想见你，但你不喜欢每天被打扰。如果住在一起，就不用打扰了。"</p>\n<p>温叙白沉默了几秒。</p>\n<p>他看着客厅——沙发上陆峥寒昨晚看过的书还摊开着，茶几上放着他用的杯子，门口摆着他的拖鞋。这间房子早就不是他一个人的了。陆峥寒用两个月时间，一点一点地、润物细无声地把自己的痕迹嵌入了这个空间的每一个角落。</p>\n<p>而温叙白没有拒绝过任何一件。</p>\n<p>"好。"温叙白轻轻点头，语气平淡但耳尖微红，"但你要遵守我的规矩。"</p>\n<p>"什么规矩？"</p>\n<p>"东西用完归位，不许乱放。碗筷洗完擦干放回原处。衣服按颜色和季节排列。进门先换鞋，外套挂玄关不进客厅。冰箱里的东西按保质期排列，过期的当天扔掉。"</p>\n<p>陆峥寒认真听着，像在记一份工作brief："还有呢？"</p>\n<p>"想到再说。"</p>\n<p>"遵命。"陆峥寒笑了，笑得像个孩子——眼底满是幸福的光芒，像等了很久的圣诞礼物终于拆开了。</p>\n<hr>\n<p>搬家那天，陆峥寒的行李其实不多。几套换洗衣服、几本书、一套洗漱用品、一台笔记本电脑、一摞文件。他的私人物品少得可怜——以前住的地方更像酒店，只有功能没有生活。</p>\n<p>但温叙白为他腾出了整整一半的衣柜空间——按照他自己的强迫症标准排列好空位。一个专属的床头柜，上面放着一盏新买的台灯。鞋柜里最顺手的位置。</p>\n<p>他甚至把浴室里的置物架重新调整了，给陆峥寒的洗漱用品留出了固定的位置。</p>\n<p>"这些你什么时候准备的？"陆峥寒看着空出来的衣柜和摆好的床头柜，声音有点哑。</p>\n<p>"昨天晚上。"温叙白站在门口，双手抱臂，语气平淡得像在说天气，"你总不能搬过来连放东西的地方都没有。"</p>\n<p>陆峥寒看着那盏新台灯——暖黄色的光，和他书房那盏一模一样。温叙白专门去买了一盏同款。</p>\n<p>"欢迎回家。"温叙白站在门口，清冷地说出这三个字。</p>\n<p>陆峥寒喉间发紧，眼眶微热。他弯腰换好拖鞋——放在最顺手位置的那双——然后走进了这个属于他们两个人的家。</p>\n<p>从今天起，他们不再是各自孤独的个体，而是彼此归处。</p>\n<div class="hook">**【本章钩子：同居正式达成！温叙白一句"欢迎回家"让霸总热泪盈眶！从两个人到一个家，偏爱终于有了物理意义上的归属！】**</div>\n'},
  {title:'第64章 同居日常，烟火甜蜜', vol:2, html:'<p>同居生活比想象中更加自然和谐——但"自然和谐"这四个字，是磨合了一周之后才成立的。</p>\n<p>搬进来的第三天，温叙白差点把陆峥寒赶出去。</p>\n<p>起因很小。陆峥寒晚上十点接到一个跨国电话，在客厅用英语谈了四十分钟生意。温叙白在卧室里改图纸，本来关着门没事，但陆峥寒讲完电话后走到厨房倒水，路过书房时顺手推开门探头看了一眼——</p>\n<p>"叙白，还不睡？"</p>\n<p>就这一眼，温叙白炸了。</p>\n<p>不是因为那一眼本身，而是因为陆峥寒推门时带进来的气流吹歪了他刚画到一半的辅助线。0.3毫米的铅笔线，偏了两毫米。</p>\n<p>"出去。"温叙白头也不抬，声音冷得能结冰。</p>\n<p>陆峥寒愣了一下，意识到发生了什么，立刻退出去关上了门。</p>\n<p>但事情没有结束。</p>\n<p>第二天早上，温叙白发现客厅茶几上陆峥寒的文件摊了一桌——三份合同、两份报告、一支没有盖盖子的签字笔。签字笔的墨水在白色茶几面上留了一个针尖大的蓝点。</p>\n<p>温叙白站在茶几前看了那个蓝点十秒钟。</p>\n<p>"陆峥寒。"</p>\n<p>"嗯？"陆峥寒从厨房端着煎蛋出来，脸上还带着笑。</p>\n<p>温叙白指了指茶几。</p>\n<p>陆峥寒顺着他的手指看过去，看到了那个蓝点。他放下煎蛋，伸手去擦——</p>\n<p>"别碰。"温叙白的声音更冷了，"你越擦越大。"</p>\n<p>"那我——"</p>\n<p>"你先把茶几上的东西全部收好。签字笔盖盖子。文件按项目分类，不要混放。然后去找专用的石材清洁剂，不是湿巾，不是洗洁精，是石材清洁剂。橱柜第二层右边第三个。"</p>\n<p>陆峥寒站在厨房门口，手里还端着煎蛋锅，看着温叙白面无表情地列出一串清洁指令。</p>\n<p>他忽然意识到——温叙白不是在无理取闹。这是他的生活方式，刻在骨头里的秩序感。在他的世界里，茶几上的蓝点和图纸上的两毫米偏差一样，都是"失控"。而温叙白恐惧失控，比恐惧任何东西都深。</p>\n<p>陆峥寒放下锅，认认真真地把茶几收拾干净，找到石材清洁剂，蹲在地上把那个蓝点擦了三遍，直到完全消失。</p>\n<p>然后他把签字笔盖好盖子，放回书房笔筒里——按照颜色排列，插在黑色和红色之间。</p>\n<p>温叙白站在旁边看着这一切，脸色慢慢缓和了。</p>\n<p>"以后用完就盖。"他说。</p>\n<p>"好。"</p>\n<p>"文件不要放茶几上。"</p>\n<p>"好。"</p>\n<p>"打电话去阳台打，不要在客厅。"</p>\n<p>"好。"</p>\n<p>陆峥寒应了三个"好"字，每个都干脆利落，没有辩解，没有抱怨。然后他端起那盘煎蛋重新放回温叙白面前："吃饭吧，凉了就不好吃了。"</p>\n<p>温叙白看着那盘煎蛋——单面，蛋黄完整，边缘微焦，和他平时喜欢的火候一模一样。</p>\n<p>他拿起筷子，吃了一口。</p>\n<p>"好吃吗？"陆峥寒问。</p>\n<p>"一般。"</p>\n<p>"那你还吃。"</p>\n<p>"饿了。"</p>\n<p>陆峥寒笑了。温叙白没笑，但筷子没停。</p>\n<p>那天晚上，陆峥寒在书房发现了一张便利贴，贴在他的文件区域——温叙白的字迹，清冷工整：</p>\n<p>【电话去阳台。文件收抽屉。笔用完盖盖。茶几不是办公桌。——温叙白】</p>\n<p>下面还有一行小字：</p>\n<p>【煎蛋进步了。】</p>\n<p>陆峥寒看着那张便利贴，笑得眼睛都弯了。他把便利贴小心翼翼地撕下来，贴在自己笔记本的扉页上。</p>\n<p>从那以后，磨合期正式结束。</p>\n<p>不是因为陆峥寒学会了所有规则——而是因为他学会了在犯错之后，不辩解，不逃避，蹲下来擦三遍茶几。</p>\n<hr>\n<p>磨合期过后，同居生活比想象中更加自然和谐。</p>\n<p>陆峥寒负责早餐和晚餐。他厨艺一般但肯学——这两个月偷偷学了八道家常菜，按温叙白的口味调整了油盐比例。早餐轮流做：陆峥寒做西式（三明治、牛奶、煎蛋），温叙白做中式（白粥、小菜、水煮蛋）。谁先醒谁做，另一个负责洗碗。</p>\n<p>温叙白负责午餐打包和家务监督。他的"监督"不是嘴上说，而是身教——他会把用完的调料瓶按高矮顺序排好，把洗碗布叠成标准的长方形搭在水龙头上，把玄关的鞋按"出门频率"从左到右排列。</p>\n<p>陆峥寒用了两周时间，学会了这套强迫症标准的全部规则。</p>\n<hr>\n<p>早晨，两人并肩站在洗手台前刷牙。</p>\n<p>镜子里的倒影亲密而自然——两个男人，一个穿白色家居服一个穿灰色家居服，低头刷牙，肩膀偶尔相蹭。陆峥寒会在刷牙间隙偷偷看温叙白的侧脸，被镜子里的温叙白逮到后，嘴角带着泡沫傻笑。</p>\n<p>"看路。"温叙白清冷提醒——意思是"看镜子里的自己，别看我"。</p>\n<p>但他的嘴角也是弯的。</p>\n<p>陆峥寒吐掉泡沫，凑过去在温叙白脸颊上亲了一口——嘴上还沾着牙膏沫。</p>\n<p>"脏。"温叙白嫌弃地擦脸，但没有推开他。</p>\n<p>"牙膏是干净的。"</p>\n<p>"你口水不干净。"</p>\n<p>"那你每天跟我接吻岂不是——"</p>\n<p>"闭嘴。"</p>\n<hr>\n<p>晚上，两人各自窝在沙发一角，一个看图纸一个处理文件。偶尔抬头对视——陆峥寒看温叙白时带着笑，温叙白看陆峥寒时装作不经意。无需言语，默契自在。</p>\n<p>有时候温叙白画图画到入神，会无意识地把笔放在沙发扶手上。陆峥寒会默默把笔拿起来放回他的笔袋——因为温叙白的强迫症要求所有工具归位，但他入神时自己会忘。陆峥寒替他记着。</p>\n<p>有时候陆峥寒处理文件处理到烦躁，会无意识地攥拳头。温叙白会放下图纸，起身去倒一杯温水放在他手边。不说话——他不说"别急"或"休息一下"这种废话，只用水杯的存在表达关心。</p>\n<hr>\n<p>周末，陆峥寒会拉着温叙白逛超市买食材。</p>\n<p>温叙白推着购物车，清冷的目光跟着陆峥寒在货架间穿梭。陆峥寒选菜的样子很认真——拿起来看产地、看日期、看新鲜程度，比看商业报告还仔细。</p>\n<p>"你为什么一直看我？"陆峥寒回头问，手里举着两根西蓝花比较。</p>\n<p>"因为你选菜的样子很认真。"温叙白语气平淡，"比开会还认真。"</p>\n<p>"那当然。给你做饭是头等大事。"陆峥寒把西蓝花放进购物车，"开会是赚钱，给你做饭是——"</p>\n<p>"是什么？"</p>\n<p>"是幸福。"</p>\n<p>温叙白耳尖微红，低头推车，不再说话。但嘴角的弧度压都压不住。</p>\n<p>路过零食区时，陆峥寒拿了三包薯片。温叙白看了一眼，把其中两包放回货架——"油脂含量太高。"</p>\n<p>"那这包呢？"陆峥寒举着剩下那包。</p>\n<p>"可以。但周五才能吃。"</p>\n<p>"为什么周五？"</p>\n<p>"因为周五你不用加班，可以消耗掉热量。"</p>\n<p>陆峥寒看着温叙白一本正经地安排他的薯片摄入计划，忍不住笑了出来——这个人管他的饮食像管一个工程项目，精确到星期几能吃零食。</p>\n<p>"好，周五吃。"他把薯片放进购物车，然后趁温叙白不注意，偷偷又拿了一包巧克力塞进车底。</p>\n<p>温叙白当然看到了。</p>\n<p>但他没说什么。只是推车的时候，嘴角弯得更深了一点。</p>\n<p>这就是同居的日常——没有轰轰烈烈的浪漫，只有柴米油盐的烟火甜蜜，平淡却让人心安。</p>\n<div class="hook">**【本章钩子：同居日常烟火气拉满！从刷牙对视到超市买菜，每一个细节都是甜蜜的注脚。平淡却心安的日常，是比任何浪漫都更深的幸福！】**</div>\n'},
  {title:'第65章 商业暗算，联手出击', vol:2, html:'<p>滨水新区项目推进到关键节点时，新的商业暗算出现了。</p>\n<p>温叙白最先察觉到异常。他在和供应商对接时发现，三家原本签了意向书的建材供应商突然同时要求重新议价，报价幅度比之前低了百分之十五——低到不合理的程度。</p>\n<p>"百分之十五的降幅不是正常的市场竞争。"温叙白在电话里对陆峥寒说，"有人在背后压价。"</p>\n<p>"我知道了。"陆峥寒声音沉稳，"林舟已经在查。你那边还有什么异常？"</p>\n<p>"有。"温叙白语气更冷了，"今天上午行业内部群里有人传我的滨水方案\'地基承载力设计不足\'。消息来源不明，但传播速度很快。"</p>\n<p>"谣言。"</p>\n<p>"当然是谣言。地基参数我反复验算过三遍，安全系数比规范要求高出百分之二十。"温叙白声音里带着一丝冷意，"但谣言不需要是真的，只需要传得够快。"</p>\n<p>"你负责技术层面的回应，商业层面交给我。"陆峥寒语气不容商量，"分工明确，各自出击。"</p>\n<p>"好。"</p>\n<hr>\n<p>两人分工明确，配合默契。</p>\n<p>温叙白用了两天时间准备了一份完整的技术报告——包含地基承载力计算书、第三方检测机构的数据对比、以及国际同类项目的参数对照表。报告共七十三页，每一个数据都有出处，每一个结论都有验证。</p>\n<p>他用这份报告，在同周的滨水新区项目推进会上，当着管委会和所有供应商的面，做了三十分钟的技术陈述。</p>\n<p>"关于地基承载力的设计质疑，我准备了完整的回应报告。"温叙白站在投影幕前，声线清冷而笃定，翻页的速度精准均匀，"第一部分，原始地勘数据；第二部分，设计计算过程；第三部分，第三方验证报告。"</p>\n<p>"如果有任何技术层面的疑问，可以现场提出，我逐一解答。"</p>\n<p>全场鸦雀无声。没有人提得出疑问——因为温叙白的数据链完整到无懈可击。</p>\n<p>管委会副主任方晏清在会后私下跟同事说："温叙白的技术功底，不是质疑得了的。散布这种谣言的人，要么不懂建筑，要么太懂人性。"</p>\n<p>与此同时，陆峥寒以雷霆手段查清了幕后黑手。</p>\n<p>林舟的效率极高——三天之内查清了三家供应商被恶意压价的证据链，以及谣言的传播路径。幕后主使是一家叫"鼎盛建筑"的公司，老板吴铭，海城建筑圈的老油条，之前投标滨水新区失败，一直怀恨在心。</p>\n<p>陆峥寒没有急于反击。他先用合法商业操作精准狙击了吴铭的资金链——通过行业盟友切断了他的两个主要融资渠道，同时把恶意压价的供应商从滨水项目供应商名单中永久排除。</p>\n<p>一周之内，暗算被彻底瓦解，项目恢复正常推进。</p>\n<hr>\n<p>事后，温叙白坐在工作室里，看着陆峥寒发来的消息：【搞定。】</p>\n<p>他回复了两个字：【默契。】</p>\n<p>陆峥寒秒回：【那当然，我们可是最强搭档。】</p>\n<p>温叙白看着"最强搭档"四个字，眼底掠过一丝温暖的光。</p>\n<p>是搭档。是恋人。是并肩无双的战友。</p>\n<p>这份双强联合的默契，比任何甜蜜都更让人心动。</p>\n<p>他拿起手机，又打了一行字，犹豫了两秒，发出去了：【阿峥，今晚我做饭。】</p>\n<p>三秒后回复：【！！！你做饭？！你想吃什么？不，你做什么我都吃！】</p>\n<p>温叙白看着连续三个感叹号，嘴角弯了弯。</p>\n<p>这就是他们的默契——战场上背靠背碾压一切，回到家里一起吃一顿安静的晚餐。</p>\n<div class="hook">**【本章钩子：双强联手再次碾压商界暗算！技术+商业的完美配合，是最强搭档的实力证明。危机过后感情更深，并肩作战的默契让恋爱甜度再升级！】**</div>\n'},
  {title:'第66章 温叙白护短，反杀名场面', vol:2, html:'<p>商业暗算被瓦解后，幕后黑手吴铭不甘心。</p>\n<p>他原以为散布谣言的事做得天衣无缝——用的是匿名账号，消息经过三层转发，查不到源头。没想到陆峥寒的人三天就查清了，资金链也被精准切断了。</p>\n<p>吴铭不恨自己手段不够高，只恨陆峥寒"不守规矩"。在他看来，商场上的暗箭是常态，被人查到就该认栽——但切断资金链这一招太狠了，等于断了他的活路。</p>\n<p>他决定从温叙白这边下手。理由很简单——温叙白是设计师不是商人，在商场上缺乏经验，好欺负。</p>\n<p>机会来得很快。海城建筑行业协会举办了一场行业论坛，温叙白作为滨水新区的首席设计师受邀做主题演讲。吴铭也报名参加了——他花了三天准备了一连串质疑，打算在提问环节当众发难，让温叙白下不来台。</p>\n<hr>\n<p>温叙白的演讲很成功。他介绍了滨水新区"生态骨架"的设计理念，用数据和案例说明了海岸线生态修复的技术方案。全场掌声热烈。</p>\n<p>到了提问环节，吴铭第一个举手。</p>\n<p>"温设计师，我有一个问题。"他站起身，接过工作人员递来的话筒，语气阴阳怪气，"滨水新区项目规模这么大，您年纪轻轻就担任首席设计师，说实话，我很怀疑您的资历能不能驾驭这么复杂的规划设计。"</p>\n<p>全场窃窃私语。这个问题的措辞看似客气，实际上是在质疑温叙白的能力和资历——在海城建筑圈，"年纪轻轻"和"资历不够"是最常见的否定方式。</p>\n<p>所有人都看向温叙白，等着看他的反应。</p>\n<p>温叙白坐在台上，表情没有变化。他正要开口——</p>\n<p>但出乎所有人意料的是，第一个站出来的不是温叙白，而是坐在前排的陆峥寒。</p>\n<p>他从容起身，走到话筒前。全场目光瞬间集中在他身上——陆氏总裁在这个场合站出来，本身就是一个信号。</p>\n<p>他声线冰冷刺骨，杀伐气场全开："吴铭，你的鼎盛建筑去年因为工程质量问题被三个甲方起诉，赔偿总额超过八百万。你的施工资质在去年年审中被降了一级。你有什么资格质疑温叙白的专业能力？"</p>\n<p>全场哗然。</p>\n<p>吴铭脸色惨白："你、你怎么知道——"</p>\n<p>"你的黑历史，我三天前就让林舟整理好了。"陆峥寒冷冷睨着他，语气没有一丝温度，"你散布谣言的事，证据链完整——匿名账号的注册IP、三层转发路径、以及你本人和传播者的通话记录。律师函明天就到。如果你想上法庭，我奉陪到底。"</p>\n<p>吴铭的嘴唇哆嗦了两下，瘫在椅子上，再也说不出半个字。</p>\n<p>全场鸦雀无声。所有人都被陆峥寒的雷霆手段震慑——不是因为他说的内容有多吓人，而是因为他说话时的语气。像在念一份死刑判决书，冷静、精准、不留余地。</p>\n<hr>\n<p>而温叙白坐在台上，看着陆峥寒为他挡在身前的挺拔背影。</p>\n<p>他穿着黑色西装，肩线冷硬利落，站姿如松。从这个角度看过去，他的后背宽阔而挺拔，像一堵墙。</p>\n<p>温叙白忽然想起第一次见他时——在那场商业晚宴上，所有人不敢靠近的冷面阎王。那时候他觉得这个人离自己很远。</p>\n<p>现在这个人为他挡在全行业面前，替他回应了每一个质疑。</p>\n<p>心里泛起暖意，嘴角弯了弯。</p>\n<p>这个男人，人前是杀伐狠绝的商界阎王，在他面前是撒娇黏人的小可怜。但不管哪一面，都会在第一时间挡在他身前，护他周全。</p>\n<p>散场后，两人在停车场走向车子。温叙白拉住陆峥寒的手，手指交缠。</p>\n<p>"谢了，阿峥。"他清冷地说，语气里带着不易察觉的柔软。</p>\n<p>陆峥寒耳尖微红，握紧他的手："不用谢。护短是天经地义的。"</p>\n<p>"下次让我自己来。"温叙白说，"我不是不会吵架。"</p>\n<p>"我知道你会。"陆峥寒偏头看他，"但我不想让你脏了嘴。这种人不配让你回应。"</p>\n<p>温叙白看着他，沉默了两秒，然后反手扣住他的手指，十指相缠。</p>\n<p>他没有再说什么。但握着的手，收紧了一分。</p>\n<div class="hook">**【本章钩子：霸总当众反杀护短名场面！雷霆手段震慑全场，温叙白一句"阿峥"甜到骨子里。护短是偏爱最直接的表达方式！】**</div>\n'},
  {title:'第67章 深夜坦白，过往揭幕', vol:2, html:'<p>同居后的一个深夜，两人窝在沙发上看电影。</p>\n<p>是周六晚上十一点，窗外下着小雨。温叙白选了一部纪录片——关于安藤忠雄的《建筑与光影》。陆峥寒对此毫无兴趣，但他乐意陪温叙白看任何东西，哪怕是一百分钟的混凝土特写。</p>\n<p>看到一半，温叙白忽然开口。</p>\n<p>"阿峥，你跟我讲讲你的过去吧。"</p>\n<p>陆峥寒微微一愣，放下遥控器，转头认真地看着他。</p>\n<p>"想听什么？"</p>\n<p>"都行。从你记事起开始。"</p>\n<p>陆峥寒沉默了几秒。他不常讲自己的过去——不是因为痛苦到不愿回忆，而是因为没有人在意。在外面，他是陆氏总裁，人们只需要他的决策和资源，不需要他的故事。</p>\n<p>但温叙白想听。那就讲。</p>\n<p>"我父母在我十岁时车祸去世。"他语气平静，像在讲别人的故事，"那天下雨，高速路上大货车侧翻，他们的车被压在下面。我接到电话的时候在学校上课，班主任把我叫到办公室，说\'你家里出了点事\'。"</p>\n<p>温叙白的目光从电视屏幕移到他脸上。陆峥寒的侧脸在电视的光影里忽明忽暗，表情很平静，但手指不自觉地攥了一下沙发垫的边角。</p>\n<p>"祖母把我养大。她是我祖父的遗孀，商场上翻滚了一辈子的女人。她教我的第一件事不是读书，是\'不要让任何人看到你的弱点\'。所以我从小就不哭、不闹、不示弱。在学校里是第一名，在家里是乖孙子，在公司里是冷面阎王。"</p>\n<p>"身边的人要么怕我，要么想利用我。"他偏头看向温叙白，眼底温柔至极，"没有人在意我累不累。直到七年前看到你的作品。"</p>\n<p>"城东图书馆。"温叙白说。</p>\n<p>"对。那段时间是我接手陆氏后最难的一段——大伯在争权，合作方在施压，我一个人扛着整个公司，每天只睡三个小时。有天晚上开车兜风，无意间开到城东，看到了那座用集装箱改造的图书馆。"</p>\n<p>他停了一下，像是在回忆那个夜晚。</p>\n<p>"那天晚上下着小雨。我走进去，坐在角落里，听着雨打在集装箱屋顶上的声音。屋顶的倾角让雨声变成了节奏——不是噪音，是音乐。缝隙间的光线在地面上画了一个光圈，我坐在光圈里，第一次觉得——这个世界没那么糟。"</p>\n<p>"后来我查到了设计师的名字——温叙白。三个字，我记了七年。"</p>\n<p>温叙白静静听着，喉间微涩。</p>\n<p>"从那以后，我开始准备。"陆峥寒继续说，"学管理、攒人脉、理清公司内部的关系、等待一个合适的时机出现在你面前。七年。不是暗恋七年——暗恋是从十岁那次开始的。这七年是蓄谋。蓄谋走到你身边，让你看到我。"</p>\n<p>温叙白沉默了很久。</p>\n<p>然后他也开口了。</p>\n<p>"我父亲在我十二岁时因为一场商业纠纷远走海外。"温叙白语气清冷却难得坦诚，"他走后，母亲一个人带我长大。她教我画画、教我建筑、教我做一个干净纯粹的人。她很辛苦，但从不抱怨。"</p>\n<p>"她出国跟父亲团聚前，跟我说了一句话——\'叙白，不要怕孤独，但也不要拒绝温暖\'。"</p>\n<p>"我一直记着这句话。但我只做到了前半句——不怕孤独。后半句，我一直在拒绝。"</p>\n<p>他偏头看向他，眼底带着从未有过的柔软："直到你出现。你是我二十七年来，唯一没有拒绝的温暖。"</p>\n<p>陆峥寒喉间猛地发紧，眼眶泛红。他伸手将温叙白拉入怀中，紧紧拥抱。</p>\n<p>温叙白靠在他肩膀上，能感受到他胸腔里心跳的频率——快、重、带着颤抖。</p>\n<p>两人在深夜的沙发上相拥，窗外雨声淅沥，电视还在放纪录片，但谁都没在看了。彼此的过往在耳边低语中慢慢交融——两个孤独了半生的人，终于找到了彼此。</p>\n<p>孤独了半生的人，终于不再孤独。</p>\n<div class="hook">**【本章钩子：深夜互相坦白过往，两个孤独灵魂终于交融！"你是我唯一没有拒绝的温暖"——这句话击穿了所有防线。从过去到未来，他们不再是一个人！】**</div>\n'},
