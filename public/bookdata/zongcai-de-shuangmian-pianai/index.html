  {title:'第68章 滨水封顶，双强巅峰', vol:2, html:'<p>九月，滨水新区主体工程封顶。</p>\n<p>这是海城有史以来规模最大的城市规划项目——从设计到施工历时近两年，温叙白和陆峥寒联手打造的海城新地标终于初具规模。</p>\n<p>封顶仪式在滨水新区的核心广场举行。广场地面铺的是温叙白设计的透水混凝土——雨水可以渗透进地下的蓄水层，用于整个新区的绿化灌溉。广场周围是已经封顶的建筑群：住宅区、商业区、文化中心、生态公园，按照"生态骨架"的规划理念沿海岸线分布。</p>\n<p>仪式上，海城市领导致辞，称赞滨水新区是"海城城市规划的里程碑"。温叙白作为首席设计师被请上台，接受了封顶纪念牌。陆峥寒作为投资方代表也在台上——两人并肩站着，一白一黑，像两座互补的建筑。</p>\n<p>仪式结束后，温叙白和陆峥寒并肩站在施工现场的高处——一栋已经封顶的商业综合体的天台。秋风吹过，阳光洒在他们身上，将两人的身影拉得修长。</p>\n<p>从这里俯瞰，整个滨水新区的建筑群尽收眼底。海岸线在阳光下泛着银光，生态公园的湿地已经初步成形，几只白鹭在水面上低飞。住宅区的屋顶花园已经种上了绿植，从高处看像一块块绿色的补丁缝在灰色的建筑肌理上。</p>\n<p>"好看吗？"温叙白问，目光落在远处的建筑群上。</p>\n<p>"好看。"陆峥寒回答，但目光一直落在温叙白脸上。</p>\n<p>温叙白侧头看他，无奈弯唇："我问的是建筑。"</p>\n<p>"建筑也好看，但没你好看。"</p>\n<p>温叙白耳尖微红，不再理他，但嘴角弯着。他转回头继续看建筑群，目光里带着一种不易察觉的满足——那是一个建筑师看到自己的设计从图纸变成现实时的满足。</p>\n<p>"这个项目从招标到现在，快两年了。"温叙白说，"中标那天你给我打了个电话，说\'恭喜你\'。我说\'是我们\'。"</p>\n<p>"我记得。"</p>\n<p>"现在它封顶了。"温叙白看着远处的海岸线，"还是\'我们\'。"</p>\n<p>陆峥寒看着他，喉间微热。他伸出手，轻轻握住温叙白的手指。</p>\n<p>温叙白没有缩回，反而回握了一下。</p>\n<hr>\n<p>"来来来，封顶纪念照！"陆瑶不知道什么时候跑上来了，举着手机，"站好站好！"</p>\n<p>照片里，温叙白和陆峥寒并肩而立，陆瑶在旁边比耶。背景是初具规模的滨水新区和远处碧蓝的海岸线。温叙白嘴角带笑，陆峥寒目光温柔——这张照片后来被陆瑶发到朋友圈，配文：【最强搭档，海城巅峰。】</p>\n<p>而温叙白看到这张照片时，第一次觉得，两个人的"并肩"比一个人的"巅峰"更有意义。</p>\n<p>他以前习惯了一个人——一个人画图、一个人做方案、一个人领奖。他以为"巅峰"就是孤独的，因为只有站得最高的人才是孤独的。</p>\n<p>但现在他知道了——真正的巅峰不是一个人站在顶上，而是有一个人愿意跟你一起爬上来，在顶上并肩而立。</p>\n<p>他把这张照片设成了手机壁纸。</p>\n<p>陆峥寒知道后开心了三天。</p>\n<div class="hook">**【本章钩子：滨水封顶，双强登顶海城巅峰！从初遇到并肩，从偏见到默契，他们用实力证明了一切。事业与爱情双丰收，最甜蜜的时光正在继续！】**</div>\n'},
  {title:'第69章 圈内打脸，流言终结', vol:2, html:'<p>在一起大半年后，海城商圈里依然有一些不和谐的声音。</p>\n<p>有人说温叙白是"靠陆峥寒上位"——一个建筑设计师能拿到滨水新区这么大的项目，不是因为实力，是因为和陆氏总裁的关系。</p>\n<p>有人说他们的关系"撑不过一年"——商场上的恋情大多利益驱动，等新鲜感过了就散了。</p>\n<p>还有人酸溜溜地说"不过是新鲜感"——陆峥寒从来没谈过恋爱，第一次就找个男人，不过是猎奇心理，长久不了。</p>\n<p>这些流言蜚语传到两人耳中时，温叙白只是淡淡挑眉，毫不在意。</p>\n<p>陆峥寒倒是想出手碾压——他的第一反应是让林舟查清楚谁在传谣，然后一个一个收拾。但温叙白拦住了他。</p>\n<p>"不用理他们。"温叙白语气清冷而笃定，"实力会替我们说话。"</p>\n<p>"可他们——"</p>\n<p>"峥寒。"温叙白看着他，那双清冷的眼底没有任何波澜——不是压抑，是真的不在意，"你知道自己的实力，我也知道我的。别人怎么说，改变不了一栋建筑的承重墙。"</p>\n<p>陆峥寒看着他，沉默了两秒，然后点头："好，不听你的。"</p>\n<p>"是不用理。"</p>\n<p>"对，不用理。"</p>\n<hr>\n<p>事实证明，温叙白是对的。</p>\n<p>接下来的半年里，温叙白接连拿下三个国际级建筑设计大奖——亚洲建筑师协会金奖、世界建筑节最佳城市设计奖、以及AIA（美国建筑师协会）国际设计大奖。他的作品被收入全球建筑年鉴，城东文化中心和滨水新区同时入选"年度全球十大公共建筑"。</p>\n<p>国际建筑界的权威期刊用整版篇幅介绍了温叙白的设计理念，标题是《温叙白：用光线切割空间的诗人》。</p>\n<p>他成为亚洲最具影响力的青年建筑师之一。</p>\n<p>而陆氏集团在温叙白的商业规划加持下——滨水新区的成功案例让陆氏在城市综合开发领域建立了行业壁垒——连续拿下三个省级重点项目，年营收翻倍，跻身全国地产开发企业前十。</p>\n<p>两人的名字频繁并列出现在行业头条和商业版面上——"温叙白×陆峥寒：海城最强搭档"、"建筑天才与商业奇才的黄金组合"、"滨水新区背后的双强力量"。</p>\n<p>"最强搭档"的称号从圈内传到圈外，那些流言蜚语不攻自破。</p>\n<p>曾经说"靠上位"的人闭了嘴——温叙白三个国际大奖不是靠关系拿的。说"撑不过一年"的人低了头——两人的关系不仅没散，反而越来越稳定。说"新鲜感"的人成了笑话——陆峥寒等了七年，这叫"新鲜感"的话，全世界的新鲜感都该重新定义。</p>\n<hr>\n<p>一天晚上，温叙白在书房里看着满墙的奖杯和 framed 的媒体报道，陆峥寒端着两杯热茶走进来。</p>\n<p>"我的叙白，本来就是最厉害的。"陆峥寒把茶递给他，语气骄傲得像自己拿了奖。</p>\n<p>温叙白接过茶，淡淡瞥了他一眼："你也不差。"</p>\n<p>陆峥寒愣住了。</p>\n<p>他看着温叙白，眨了两下眼——确认自己没有听错。温叙白刚才说了"你也不差"。这是温叙白第一次主动夸他。以前都是陆峥寒单方面说"叙白你好厉害"、"叙白你太棒了"、"叙白你全世界最好"，温叙白最多回一个"嗯"。</p>\n<p>而今天他说了"你也不差"。</p>\n<p>从温叙白嘴里，"不差"等于别人的"非常好"。</p>\n<p>陆峥寒愣了两秒，随即笑得像个傻子——嘴角咧到耳朵根，眼角全是褶子，茶差点洒出来。</p>\n<p>"你笑了。"温叙白看着他。</p>\n<p>"因为你夸我了。"</p>\n<p>"我说的是事实。"</p>\n<p>"事实也好听。"</p>\n<p>温叙白看着他傻笑的样子，嘴角也弯了一下，然后低头继续看文件。</p>\n<p>但陆峥寒注意到——他拿文件的手，比刚才轻快了一点。</p>\n<div class="hook">**【本章钩子：实力打脸流言，双强并肩碾压所有质疑！温叙白首次主动夸赞陆峥寒，"你也不差"三个字让霸总笑成傻子。第三卷即将开启，更多甜蜜高潮即将到来！】**</div>\n'},
  {title:'第70章 第二卷终章：偏爱成真，余生可期', vol:2, html:'<p>转眼又是一年冬初。</p>\n<p>海城的第一场雪再次降临，和去年一样纷纷扬扬，安静而美丽。</p>\n<p>温叙白站在私宅的落地窗前，看着窗外飘飞的雪花。玻璃上映出他模糊的倒影——灰色家居服、黑框眼镜、手里端着一杯热茶。蒸气从杯口升起来，在玻璃上凝成一小片雾。</p>\n<p>去年的第一场雪，他一个人站在这扇窗前，看雪。那时候他和陆峥寒还没有在一起——陆峥寒发消息说"下雪了，注意保暖"，他回了一个"嗯"。</p>\n<p>今年的第一场雪，他不再是一个人看了。</p>\n<p>身后传来脚步声。陆峥寒从厨房走来，手里端着刚热好的牛奶——他现在每天晚上会给温叙白热一杯牛奶，因为温叙白胃不太好，牛奶可以暖胃。</p>\n<p>他走到温叙白身后，自然地环住他的腰，下巴搁在他肩头。两人一起看着窗外的雪。</p>\n<p>牛奶搁在窗台上，热气在两人之间升腾。</p>\n<p>"又下雪了。"陆峥寒轻声说。</p>\n<p>"嗯。"</p>\n<p>"去年淋雪共白头，今年——"他收紧了手臂，语气温柔而满足，"今年是真的在一起了。"</p>\n<p>温叙白微微侧头，目光落在他脸上。陆峥寒的侧脸贴在他肩窝里，睫毛上沾了一点从厨房带出来的水汽，嘴唇微微弯着。</p>\n<p>"嗯，在一起了。"温叙白说。</p>\n<p>这四个字从他嘴里说出来，轻飘飘的，但重量只有他自己知道。在一起——意味着他选择让另一个人进入他的世界，打破他所有的边界和规则。对温叙白来说，这不是一个容易的决定。但他做了，而且不后悔。</p>\n<p>窗外雪花纷飞，室内暖意融融。两人相拥而立，安静地看雪。</p>\n<hr>\n<p>从初遇的那场商业晚宴，到现在，时间走过了将近两年。</p>\n<p>陆峥寒用了七年的蓄谋和两年的步步靠近，终于让那位清冷迟钝、洁癖严重的美人，心甘情愿地走进了他的世界，成了他生活中不可或缺的存在。</p>\n<p>而温叙白也终于明白——那些他以为是"心软迁就"的偏爱，从来都是心动。</p>\n<p>从第一颗薄荷糖到手指交缠。从专属副驾到同床共枕。从"清冷的礼貌距离"到"阿峥"。每一次破例，都是心跳的注脚。</p>\n<p>如今，他不再迟钝，不再犹豫，不再需要时间。</p>\n<p>因为他已经清清楚楚地知道——这个人是他想要共度余生的人。</p>\n<p>"阿峥。"温叙白轻声开口。</p>\n<p>"嗯？"</p>\n<p>"明年雪天，我们去城东文化中心看雪吧。"温叙白偏头看他，眼底盛满温柔——不是那种刻意展示的温柔，而是自然而然的、从心底溢出来的温柔，"在水景旁边。"</p>\n<p>"好。"陆峥寒弯唇，在他发顶落下一吻，"每年的雪天，都一起去。"</p>\n<p>温叙白靠在他怀里，看着窗外的雪。</p>\n<p>雪落无声，但天地皆白。</p>\n<p>第二卷的故事，到此圆满。</p>\n<p>偏爱成真，余生可期。</p>\n<p>第三卷即将开启——公开官宣、全网轰动、碾压最后的阻碍、事业巅峰并肩、求婚名场面……最甜最爽的高潮篇章，正在前方等候。</p>\n<div class="hook">**【本章钩子（第二卷终章）：偏爱成真，余生可期！从暧昧到确认，从同居到并肩，两年的时光见证了最甜蜜的蜕变。第三卷即将开启：全网官宣、碾压反派、事业巅峰、求婚名场面——全书最甜最爽的高潮即将到来！】**</div>\n'},
  {title:'第71章 全网官宣，热搜炸了', vol:3, html:'<p>官宣的决定来得比所有人预想的都快。</p>\n<p>那天晚上，陆峥寒和温叙白窝在私宅沙发上看电影。屏幕上放着某部爱情片，男女主纠结了整整两小时才在一起。</p>\n<p>温叙白看得面无表情："太磨叽了。"</p>\n<p>陆峥寒闻言挑眉，侧头看他："那如果我们公开，你觉得会磨叽吗？"</p>\n<p>温叙白一愣，手里的遥控器顿住。</p>\n<p>"我是说——"陆峥寒语气随意，但手指不自觉收紧了环在他腰间的手臂，"我们在一起三个月了，半官宣也做了，圈子里基本都知道。但还没有正式公开过。"</p>\n<p>"你想公开？"</p>\n<p>"我想让所有人知道。"陆峥寒纠正道，"不是\'想\'，是\'会\'。只是想征询你的意见。"</p>\n<p>温叙白沉默了几秒。以前他或许会犹豫，会顾虑公众目光、职业形象。但现在——</p>\n<p>"好。"</p>\n<p>"不犹豫？"</p>\n<p>"不犹豫。"温叙白偏头看他，眼底带着淡淡的笑意，"你都不怕，我有什么好怕的。"</p>\n<p>陆峥寒眼底笑意瞬间炸开，像个得到糖果的孩子。</p>\n<p>第二天上午十点整，陆峥寒的个人微博——一个粉丝量高达八百万、从未发过任何私人内容的账号——发布了一条动态。</p>\n<p>配图是两张照片。</p>\n<p>第一张：一只骨节分明的手与一只修长白皙的手十指相扣，背景是初雪纷飞的街道。</p>\n<p>第二张：滨水文化中心的水景幕墙特写，玻璃上刻着"WXB"三个字母。</p>\n<p>配文只有三个字：【@温叙白。】</p>\n<p>没有多余的解释，没有煽情的告白，简单直接，霸气到极致。</p>\n<p>三分钟后，温叙白的个人微博转发并配文：【嗯。】</p>\n<p>一个字，清冷至极，却让全网炸了锅。</p>\n<p>热搜瞬间爆了。</p>\n<p>#陆峥寒温叙白官宣# 一分钟冲上热搜第一，阅读量十分钟后破亿。</p>\n<p>#一个字的力量# 紧随其后。</p>\n<p>#滨水幕墙上的WXB# 第三。</p>\n<p>评论区彻底沦陷。</p>\n<p>"我靠！！！陆峥寒发私人微博了？？？还官宣了？？？"</p>\n<p>"温叙白回复的那个\'嗯\'字绝了，太他妈清冷了。"</p>\n<p>"啊啊啊啊磕到了磕到了！霸总×清冷美人这是什么神仙CP！"</p>\n<p>"等等，滨水文化中心那个WXB是温叙白名字缩写？陆峥寒你蓄谋多久了？"</p>\n<p>"七年。"某知情人士回复。</p>\n<p>"？？？七年什么鬼？"</p>\n<p>林舟在办公室刷到热搜的时候，差点把咖啡喷到键盘上。</p>\n<p>他立刻拨通陆峥寒的电话："陆总，您……您直接发了？"</p>\n<p>"有问题？"</p>\n<p>"没有！就是……公关部说他们准备好了三套预案，您一个都没用上。"</p>\n<p>"不需要。"陆峥寒的声音带着笑意，"叙白说的，不犹豫。"</p>\n<p>林舟沉默了两秒，认命地挂了电话，转头对公关部说："预案全部作废，启动实时舆情监控就行了。"</p>\n<p>当天，全网都在讨论这对"商界最颜值CP"。有人扒出两人此前在各种场合的同框照——峰会上的对视、晚宴上的低语、工地上的并肩——每一张都甜度爆表。</p>\n<p>而陆峥寒和温叙白本人，此刻正坐在私宅的阳台上，一个看文件，一个画设计图，各自安静，偶尔交换一个眼神。</p>\n<p>手机震动不断，两人默契地全部静音。</p>\n<p>"火了。"温叙白头也不抬地说。</p>\n<p>"嗯。"陆峥寒翻了一页文件，"习惯了。"</p>\n<p>温叙白轻哼一声，嘴角微弯。</p>\n<p>官宣这件事，对他们来说不过是走个流程。该在的，早就在了。</p>\n<div class="hook">**【本章钩子：全网官宣炸裂热搜！一个"嗯"字封神，七年蓄谋终见天日。但热搜背后，暗流涌动——商业对手、圈层旧人、家族残余阻力，都将在公开之后迎来最后的交锋。第三卷的高潮，正式拉开序幕！】**</div>\n'},
  {title:'第72章 圈内震动，各方反应', vol:3, html:'<p>官宣的余波持续了整整一周。</p>\n<p>海城商界圈子不大，陆峥寒和温叙白公开关系的消息，像一颗石子投入平静的湖面，涟漪迅速扩散到每一个角落。</p>\n<p>最先表态的是陆瑶。</p>\n<p>她在官宣微博下评论："我哥终于不用装不认识了，累死我了。"配了一个翻白眼的表情包，获赞第一。</p>\n<p>紧接着，建筑界的大佬们纷纷发声。温叙白在业内的口碑极好，几位院士级前辈公开送上祝福，其中一位还在朋友圈写道："叙白是我见过最有天赋的年轻设计师，祝他事业爱情双丰收。"</p>\n<p>但也有不和谐的声音。</p>\n<p>某位地产圈老总在私人饭局上半开玩笑地说："陆峥寒和温叙白在一起，以后滨水的项目是不是都内定了？"</p>\n<p>这话传到了陆峥寒耳朵里。</p>\n<p>他没有回应，只是让林舟把陆氏下个季度的招标流程全部公开化、透明化，每一个环节都邀请第三方审计。</p>\n<p>"让事实说话。"陆峥寒对林舟说，"叙白的能力不需要我来证明，但陆氏的规矩不能让人说闲话。"</p>\n<p>林舟点头，心里暗叹：陆总护短的方式永远是先把对方的路堵死，让你连质疑的资格都没有。</p>\n<p>与此同时，温叙白这边也收到了不少反应。</p>\n<p>工作室的电话被打爆了，有记者想采访的，有品牌想合作的，也有同行想套近乎的。温叙白全部交给助理处理，自己关了手机，在工作室画了一整天图。</p>\n<p>傍晚，陆峥寒来接他下班。</p>\n<p>车停在楼下，温叙白拉开后座车门时，发现副驾上放着一束白色的满天星，花束里夹着一张卡片。</p>\n<p>卡片上是陆峥寒的字迹：【给全网最清冷的"嗯"先生。——你的，陆峥寒。】</p>\n<p>温叙白看了两秒，把卡片收进口袋，面无表情地坐进后座。</p>\n<p>"不谢谢我？"陆峥寒从后视镜看他。</p>\n<p>"谢什么。"</p>\n<p>"花。"</p>\n<p>"看到了。"</p>\n<p>"不评价？"</p>\n<p>温叙白沉默了一瞬，然后说："花不错。"</p>\n<p>陆峥寒笑出了声，那个"不错"在温叙白的词典里，大概等于"很喜欢"。</p>\n<p>车驶入夜色，两人各自安静。</p>\n<p>"峥寒。"温叙白忽然开口。</p>\n<p>"嗯？"</p>\n<p>"今天有人质疑滨水项目内定。"</p>\n<p>"我知道。"</p>\n<p>"你不觉得……公开关系会影响你的商业信誉吗？"</p>\n<p>陆峥寒沉默了几秒，然后说："叙白，你觉得我是什么人？"</p>\n<p>"什么？"</p>\n<p>"我是那种需要靠私人关系拿项目的人吗？"</p>\n<p>温叙白一愣，随即摇头。</p>\n<p>"那就对了。"陆峥寒语气平淡但笃定，"我的信誉是靠实力打出来的，不是靠藏着掖着保住的。公开你，是我做过最不后悔的决定。"</p>\n<p>温叙白没再说话，但后视镜里，他的嘴角弯了弯。</p>\n<p>回到私宅，两人一起做饭——准确地说，是陆峥寒做饭，温叙白在旁边递调料。</p>\n<p>"盐。"</p>\n<p>温叙白递过去。</p>\n<p>"酱油。"</p>\n<p>递过去。</p>\n<p>"糖。"</p>\n<p>温叙白手顿了一下："菜里放糖？"</p>\n<p>"红烧排骨放一点提鲜。"陆峥寒头也不回，"你连这个都不知道？"</p>\n<p>"我不做饭。"</p>\n<p>"以后我做。"陆峥寒接过糖罐，语气自然得像是在说今天天气不错。</p>\n<p>温叙白站在他身后，看着他在灶台前忙碌的背影，忽然觉得——这个在商界<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>的霸总，系着围裙给他做饭的样子，比任何高光时刻都好看。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"……没什么。"</p>\n<p>陆峥寒回头看他一眼，笑了，什么都没问。</p>\n<p>窗外的城市灯火璀璨，室内的烟火气温暖而安宁。</p>\n<p>官宣风波终将过去，但他们的日常，才是真正的好戏。</p>\n<div class="hook">**【本章钩子：圈内反应不一，有人祝福有人质疑，但陆峥寒用行动证明——实力不需要藏着掖着。而灶台前系着围裙的霸总，才是温叙白心里最好看的风景。接下来，家族层面的最后考验即将到来……】**</div>\n'},
  {title:'第73章 陆老夫人表态，家族认可', vol:3, html:'<p>官宣后的第二个周末，陆峥寒带温叙白回了陆家老宅。</p>\n<p>上次来这里还是几个月前，彼时两人的关系尚未确认，陆老夫人虽然默许，但态度始终带着审视。如今不同了——全网皆知，木已成舟。</p>\n<p>车驶入老宅大门时，管家周伯已经等在门口。</p>\n<p>"陆总，温先生，老夫人在花厅等你们。"周伯笑容满面，显然已经看过热搜了。</p>\n<p>温叙白下意识整了整衣领，被陆峥寒看在眼里。</p>\n<p>"紧张？"</p>\n<p>"不紧张。"温叙白面无表情。</p>\n<p>陆峥寒伸手握了握他的手指，温度偏凉："手都凉了，还说不会紧张。"</p>\n<p>温叙白没反驳，但也没有抽回手。</p>\n<p>两人走进花厅，陆老夫人正坐在红木椅上喝茶。满头银丝，精神矍铄，一双眼睛依然锐利。</p>\n<p>"祖母。"陆峥寒上前问安。</p>\n<p>"老夫人。"温叙白微微欠身。</p>\n<p>陆老夫人放下茶盏，目光在温叙白身上停留了足足五秒。温叙白没有躲避，坦然回视。</p>\n<p>"坐吧。"陆老夫人终于开口。</p>\n<p>两人落座，周伯奉上茶点。</p>\n<p>沉默了片刻，陆老夫人开口了："网上那个事儿，我看了。"</p>\n<p>温叙白脊背微不可察地绷紧了一分。</p>\n<p>"一个\'嗯\'字，倒是跟你这个人一样——惜字如金。"陆老夫人语气听不出喜怒。</p>\n<p>温叙白正要开口，陆老夫人摆了摆手："我不反对。"</p>\n<p>温叙白一愣。</p>\n<p>"从我第一次见你，就知道你不是那种会轻易被打动的人。"陆老夫人目光温和了几分，"峥寒这孩子，从小到大要什么有什么，唯独在感情上，他从来没这么上心过。你能让他上心到这个程度，说明你是真的值得。"</p>\n<p>她顿了顿，看向陆峥寒："但我也得说清楚——我认你这个人，不代表陆家所有人都会认。你大伯那边的态度，你自己心里有数。"</p>\n<p>陆峥寒点头："我知道。"</p>\n<p>"知道就好。"陆老夫人转向温叙白，"温叙白，我问你一句话，你如实回答。"</p>\n<p>"老夫人请说。"</p>\n<p>"你跟峥寒在一起，是因为他对你好，还是因为你真的喜欢他？"</p>\n<p>这个问题直截了当，没有半分弯弯绕绕。</p>\n<p>温叙白沉默了两秒，然后抬眼直视陆老夫人的目光，清冷的声线格外清晰："我从前不清楚自己的感情，迟钝了很久。但我想明白之后，就再没犹豫过。"</p>\n<p>"我喜欢他。不是因为他对好，而是因为他是陆峥寒。"</p>\n<p>花厅安静了一瞬。</p>\n<p>陆老夫人端起茶盏，抿了一口，嘴角微微弯起："好。"</p>\n<p>只一个字，却像是盖了章。</p>\n<p>陆峥寒悄悄松了口气，在桌下握了握温叙白的手。</p>\n<p>临走前，陆老夫人叫住了温叙白。</p>\n<p>"叙白。"</p>\n<p>温叙白回头。</p>\n<p>陆老夫人从手腕上取下一只翠玉镯子，通体碧绿，水头极足，一看就是传了好几代的老物件。</p>\n<p>"这是陆家传给媳妇的。"陆老夫人把镯子放在温叙白手心，"虽然你们现在还不能领证，但在我这里，你已经算陆家的人了。"</p>\n<p>温叙白手心的玉镯温润沉重，他愣了好几秒，低声说："谢谢老夫人。"</p>\n<p>陆峥寒在旁边看着这一幕，眼眶微微发热。</p>\n<p>回程的车上，温叙白低头看着手腕上的翠玉镯，拇指无意识地摩挲着玉面。</p>\n<p>"祖母很喜欢你。"陆峥寒说。</p>\n<p>"嗯。"</p>\n<p>"那镯子是祖母的祖母传下来的，她一直戴着，谁都不给。"</p>\n<p>温叙白动作一顿，抬眼看他。</p>\n<p>陆峥寒笑了，腾出一只手覆上他的手背，握住那只戴着玉镯的手："她说她等了很久，等一个值得给的人。"</p>\n<p>温叙白没说话，但手指微微收紧，回握住了他。</p>\n<p>窗外的路灯一盏盏掠过，车内安静而温暖。</p>\n<div class="hook">**【本章钩子：陆老夫人正式认可，传家玉镯交付——家族最后一道关隘，被温叙白一句"因为他是陆峥寒"彻底打动。但大伯一方的阻力仍在暗处。真正的家族考验，才刚刚开始……】**</div>\n'},
  {title:'第74章 温家回应，父母初见', vol:3, html:'<p>陆家这边有了定论，温家那边却迟迟没有表态。</p>\n<p>温叙白的父母常年在国外，父亲温崇远是海外知名结构工程教授，母亲苏敏华是大学教授，两人一辈子做学术，性格沉稳内敛。</p>\n<p>官宣热搜爆了之后，温叙白给母亲打了一个电话。</p>\n<p>电话那头沉默了很久，苏敏华才开口："叙白，你不觉得应该先跟我们说一声吗？"</p>\n<p>"妈，对不起。"</p>\n<p>"我不是生气你公开，我是生气你什么都不跟我说。"苏敏华的语气带着心疼，"你从小就这样，什么都不说，什么都自己扛。"</p>\n<p>温叙白沉默了。</p>\n<p>"那个人……对你好吗？"</p>\n<p>"好。"</p>\n<p>"你说一个\'好\'字我就放心了？"</p>\n<p>温叙白想了想，说："他做饭很好吃，每天接我下班，记得我所有的习惯。我不爱跟人接触，他就一点点打破我的底线，从来不会让我不舒服。"</p>\n<p>电话那头安静了几秒，然后苏敏华说："你从小到大，没跟我说过这么多关于一个人的话。"</p>\n<p>"那……我带他来见你们？"</p>\n<p>"来吧。你爸嘴上不说，其实一直在看网上那些消息。"苏敏华叹了口气，"他把陆峥寒的商业访谈看了个遍。"</p>\n<p>温叙白嘴角微弯："好。"</p>\n<p>两周后，温叙白带陆峥寒飞去了国外。</p>\n<p>飞机上，陆峥寒罕见地紧张。他翻了三遍领带，又检查了两遍礼物——给温父带的是一套珍藏版工程力学文献，给温母带的是一盒海城老字号的桂花糕。</p>\n<p>"你比开董事会还紧张。"温叙白靠在座椅上看他。</p>\n<p>"董事会不会拒绝我。"</p>\n<p>"我爸妈也不会。"温叙白顿了顿，"大概。"</p>\n<p>"……\'大概\'是什么意思？"</p>\n<p>温叙白没回答，闭上了眼。</p>\n<p>到达后，温家是一栋带花园的独栋小楼。门口种着苏敏华侍弄的花草，修剪得整整齐齐。</p>\n<p>门开了，苏敏华站在门口。她穿着素色毛衣，气质温婉，和温叙白有七分像。</p>\n<p>"妈。"温叙白上前拥抱了一下。</p>\n<p>"这就是峥寒吧？"苏敏华看向陆峥寒，目光打量。</p>\n<p>"阿姨好。"陆峥寒微微鞠躬，把桂花糕递过去，"听说叙白喜欢您做的桂花糕，我带的是海城老字号的，不知道合不合您口味。"</p>\n<p>苏敏华接过，笑了笑："叙白跟你说起过我做的桂花糕？"</p>\n<p>"说过。说您做的最好吃。"</p>\n<p>苏敏华看了温叙白一眼，眼底的笑意柔和了几分。她侧身让路："进来吧，你爸在书房。"</p>\n<p>书房里，温崇远正坐在书桌后看文献。六十多岁的人了，头发花白但精神很好。</p>\n<p>"爸。"温叙白敲了敲门。</p>\n<p>温崇远抬起头，目光先落在儿子身上，然后移向陆峥寒。他上下打量了陆峥寒几秒，没有起身。</p>\n<p>"坐。"</p>\n<p>陆峥寒坐下，脊背挺直。</p>\n<p>温崇远盯着他看了半天，忽然问："你在峰会上处理沈知予那件事的时候，为什么不直接用资本压他？"</p>\n<p>陆峥寒一愣，随即认真地回答："因为叙白在场上，我不想让他觉得我是在用权势解决问题。而且沈知予的事，本质上是情感纠纷，用商业手段碾压反而会适得其反。"</p>\n<p>温崇远点了点头，又问："叙白的洁癖和强迫症，你知道吗？"</p>\n<p>"知道。我花了很长时间让他习惯我的存在。"</p>\n<p>"他不爱表达感情，你知道吗？"</p>\n<p>"知道。所以他说的每一句话，我都当宝贝。"</p>\n<p>温崇远沉默了。</p>\n<p>良久，他站起来，走到书架前取下一本旧相册，翻开其中一页，递给陆峥寒。</p>\n<p>照片上是五六岁的温叙白，独自坐在角落里搭积木，周围的孩子们在嬉闹，他像一个透明人。</p>\n<p>"他从小就不太合群。"温崇远声音低沉，"我和他妈妈忙着做研究，陪伴太少。他习惯了一个人，也习惯了不说。"</p>\n<p>陆峥寒看着照片里那个安静的孩子，心口发紧。</p>\n<p>"所以——"温崇远转向他，目光严厉却隐含期待，"如果你只是新鲜，趁早走。如果你是认真的，就把他照顾好。他这辈子不会轻易对一个人好，但一旦认定了，就是全部。"</p>\n<p>"叔叔。"陆峥寒站起来，语气郑重，"我蓄谋了七年才走到他身边。不是为了新鲜，是为了余生。"</p>\n<p>温崇远看着他，目光深邃。</p>\n<p>半晌，他轻轻拍了拍陆峥寒的肩膀："那就好。"</p>\n<p>晚饭桌上，苏敏华做了一桌子菜。陆峥寒吃得极为认真，每道菜都赞不绝口——而且不是敷衍的夸，而是精准地说出调味的巧思。</p>\n<p>"你这孩子倒是懂吃。"苏敏华笑了。</p>\n<p>"我经常给叙白做饭。"陆峥寒说，"但怎么都做不出叙白说的那个味道。"</p>\n<p>苏敏华看了一眼温叙白，温叙白低头扒饭，耳尖微红。</p>\n<p>晚饭后，苏敏华拉着陆峥寒在花园里散步，聊了很多温叙白小时候的事。陆峥寒一一记在心里。</p>\n<p>临走那天，苏敏华在门口拥抱了陆峥寒。</p>\n<p>"谢谢你。"她说，"叙白从来不肯跟我们多说心里话，但他跟我说过——你是他生命里最特别的人。"</p>\n<p>陆峥寒喉咙发紧，轻声说："我会一直对他好。"</p>\n<p>回程的飞机上，温叙白靠在座椅上闭目养神。</p>\n<p>陆峥寒偏头看他，忽然说："叙白。"</p>\n<p>"嗯？"</p>\n<p>"你小时候的照片，很好看。"</p>\n<p>温叙白睁开眼，看他。</p>\n<p>"你爸给我看了你五岁搭积木的照片。"</p>\n<p>温叙白表情微变："他给你看那个干什么。"</p>\n<p>"因为他想让我知道，你以前是独自一个人。"陆峥寒握住他的手，声音低而温柔，"叙白，以后不会了。"</p>\n<p>温叙白看着他，眼底有什么东西在微微颤动。</p>\n<p>然后他偏过头，闭上眼，手指却悄悄收紧了。</p>\n<div class="hook">**【本章钩子：温家父母初见，从严苛审视到默默认可——"你是他生命里最特别的人"。两个家庭的祝福已经到齐，但暗处的商业对手正在磨刀。暴风雨前的宁静，不会持续太久……】**</div>\n'},
  {title:'第75章 商业暗流，对手窥伺', vol:3, html:'<p>就在陆峥寒和温叙白沉浸在新婚般甜蜜的日子里，海城的商业暗流正在涌动。</p>\n<p>恒盛集团。</p>\n<p>董事长办公室里，赵恒靠在椅背上，指尖敲着桌面，面前平板上赫然是陆峥寒官宣热搜的截图。</p>\n<p>赵恒今年四十二岁，比陆峥寒大十四岁。他的父亲赵德厚当年是海城地产界的开山人物之一，和陆峥寒的父亲陆怀瑾在同一代人里各有山头——赵德厚做商业地产，陆怀瑾做住宅开发，本来井水不犯河水。</p>\n<p>但九十年代末，海城旧城改造那块大蛋糕摆上桌时，两个人撞上了。赵德厚联合了三家地产商组成竞标联盟，势在必得；结果陆怀瑾单独竞标，以更优的方案和更低的报价拿下了项目。赵德厚气得大病一场，此后恒盛从一线开发商滑落到二线，再也没能翻过身。</p>\n<p>赵德厚退休后，逢人便说"陆家靠关系抢了我的项目"。赵恒从小听到大，对陆家的芥蒂早已刻进骨头里——尽管他心里清楚，当年父亲输的是方案和报价，不是关系。</p>\n<p>但恨一个人不需要理由，只需要一个出口。</p>\n<p>"陆峥寒和温叙白公开了。"他对面坐着的人说，"赵总，这是个机会。"</p>\n<p>说话的人叫钱明远，恒盛集团的战略顾问，四十五岁，戴一副银框眼镜，说话永远慢条斯理，像在给每句话称重。</p>\n<p>钱明远八年前不在恒盛，而在陆氏——彼时他是陆氏投资部的一个副总监，能力不错，但手脚不干净。陆峥寒接手陆氏后第三个月就查到了他利用职务之便收受回扣的事，连开会都没开，直接让法务把证据拍在他桌上，限他二十四小时内办完离职手续。</p>\n<p>钱明远在行业里混了两年才被赵恒捡了回来。他从不掩饰对陆峥寒的恨意——不是因为被辞退本身，而是陆峥寒当时看他的那个眼神：不是愤怒，不是失望，是漠然。像看一只蚂蚁爬过桌面，顺手掸掉。</p>\n<p>那种漠然比任何羞辱都让人记恨。</p>\n<p>"陆氏这两年重心在滨水新区项目上，投入巨大。现在陆峥寒和温叙白公开关系，势必分散精力——一个热恋中的人，判断力总会打折扣。"钱明远推了推眼镜，"而且，滨水项目的核心设计是温叙白做的，如果温叙白分心，项目进度就会受影响。"</p>\n<p>赵恒沉吟片刻。他盯着屏幕上那张热搜截图看了几秒——照片里陆峥寒和温叙白并肩站在颁奖典礼上，表情都不算热络，但肩膀挨着肩膀，那种默契是藏不住的。</p>\n<p>"你的意思是？"</p>\n<p>"我查过了，滨水二期工程的招标下个月启动。陆氏虽然是最大热门，但如果我们能在招标前制造一些麻烦——"</p>\n<p>"什么麻烦？"</p>\n<p>钱明远压低声音："滨水一期前段时间出过一次施工安全事故，虽然压下去了，但如果有媒体重新翻出来，配上\'设计缺陷\'的标题……"</p>\n<p>赵恒眼底闪过一丝寒光："你的意思是把安全事故往温叙白的设计上引？"</p>\n<p>"只是制造舆论压力。"钱明远笑了笑，那种笑容在镜片后面显得格外冷静，"温叙白是设计师，不是施工方，安全事故跟他关系不大。但公众分不清这些，只要有标题就够了。"</p>\n<p>赵恒沉默了一会儿。他把平板翻过来，又看了一眼那张照片，然后缓缓点头。</p>\n<p>"做。但要干净。"</p>\n<p>"放心。"钱明远站起来，走到门口时停了一下，"赵总，有句话我多嘴一句——这次的事和当年赵老先生那笔旧账没关系。我们做的是生意，不是报仇。"</p>\n<p>赵恒抬眼看他，嘴角扯了一下："你说这话的时候自己信吗？"</p>\n<p>钱明远没接，推门出去了。</p>\n<p>与此同时，陆氏总部。</p>\n<p>林舟走进陆峥寒办公室，脸色不太好看。</p>\n<p>"陆总，恒盛最近有动作。"</p>\n<p>陆峥寒抬头，目光微冷："说。"</p>\n<p>"钱明远最近在接触几个财经记者，请他们吃饭。而且——"林舟顿了顿，"有人在查滨水一期那次施工事故的资料。"</p>\n<p>陆峥寒手指微微收紧。</p>\n<p>滨水一期半年前确实出过一次小型施工事故——脚手架倒塌，两个工人轻伤。事故原因是施工方操作违规，和设计毫无关系。当时已经处理完毕，施工方被罚款整改，事情压了下去。</p>\n<p>但如果有人故意搅浑水……</p>\n<p>"查清楚钱明远接触了哪些记者。"陆峥寒语气冷了下来，"还有，把滨水一期事故的完整调查报告准备一份，包括施工方违规的详细记录和整改文件。"</p>\n<p>"明白。"</p>\n<p>"另外——"陆峥寒顿了顿，"这件事先不要告诉叙白。"</p>\n<p>林舟一愣："陆总？"</p>\n<p>"他最近在准备国际建筑双年展的参展方案，不想让他分心。"陆峥寒语气平淡，但眼底有不易察觉的担忧，"恒盛的手段我来应对，不需要他操心。"</p>\n<p>林舟点头，转身出去。</p>\n<p>下午，陆峥寒去工作室接温叙白下班。</p>\n<p>温叙白正在改图，听到脚步声头也不抬："等我五分钟。"</p>\n<p>"不急。"陆峥寒在沙发上坐下，随手拿起桌上的设计杂志翻看。</p>\n<p>工作室很安静，只有笔尖划过纸面的沙沙声。</p>\n<p>陆峥寒翻了两页杂志，目光落在温叙白身上。他低头画图的侧脸专注而清冷，睫毛在图纸上投下一小片阴影。</p>\n<p>手机震了一下，是林舟发来的消息：【确认了，钱明远约了三个财经记者，明天中午在云山会所。】</p>\n<p>陆峥寒单手打字回复：【安排人跟拍，保留证据。另外查一下恒盛近半年和滨水项目相关的所有商业动作。】</p>\n<p>发完消息，他收起手机，目光重新落在温叙白身上。</p>\n<p>温叙白恰好抬起头，对上他的视线，微微皱眉："你在看什么？"</p>\n<p>"看你。"</p>\n<p>"……看了十分钟了。"</p>\n<p>"不够。"陆峥寒弯唇，"看一辈子都不够。"</p>\n<p>温叙白嘴角不自觉地弯了一下，随即压下去，继续低头画图。</p>\n<p>陆峥寒靠在沙发上，笑意温和。</p>\n<p>恒盛的暗箭还没射出来，但他已经张好了盾。这一次，他不需要温叙白冲锋陷阵——他会在前面挡住一切，让叙白安心画他的图。</p>\n<p>但是——</p>\n<p>温叙白真的一点都没察觉吗？</p>\n<p>他放下笔的时候，目光不着痕迹地扫过陆峥寒收手机时微微收紧的下颌线。</p>\n<p>峥寒在瞒他什么。</p>\n<p>温叙白垂下眼，没有追问。</p>\n<p>他会等。</p>\n<div class="hook">**【本章钩子：恒盛集团暗中布局，试图用施工事故做文章。陆峥寒选择独自应对、隐瞒温叙白——但温叙白真的毫不知情吗？暴风雨即将到来，这一次的考验比以往都更凶险……】**</div>\n'},
  {title:'第76章 联手迎战，默契升级', vol:3, html:'<p>三天后，温叙白主动开口了。</p>\n<p>那天晚上，两人在私宅吃完晚饭，温叙白放下筷子，忽然说："恒盛在搞事。"</p>\n<p>陆峥寒夹菜的动作一顿。</p>\n<p>"你什么时候知道的？"他问，语气平静。</p>\n<p>"第一天。"温叙白看他，"你以为林舟每次来你办公室汇报都关紧门，我就什么都听不到？"</p>\n<p>陆峥寒沉默了两秒："我不想让你分心。"</p>\n<p>"我不分心，不代表我不参与。"温叙白语气清冷但笃定，"峥寒，你说过——我们是并肩的。"</p>\n<p>陆峥寒看着他，半晌，轻轻叹了口气："好。"</p>\n<p>他把恒盛的布局原原本本说了一遍：钱明远接触记者、试图翻出施工事故、往设计缺陷上引。</p>\n<p>温叙白听完，表情没有任何变化。</p>\n<p>"施工事故是施工方违规操作，跟设计无关。"他说。</p>\n<p>"我知道，但公众不会细分这些。"</p>\n<p>"那就让他们分清。"温叙白站起来，走到书房，打开电脑，调出了滨水一期的全套设计图纸。</p>\n<p>"峥寒，把完整的调查报告也给我。"</p>\n<p>"你要做什么？"</p>\n<p>"既然他们要谈设计，那就谈设计。"温叙白的眼神锐利而冷静，"我温叙白的设计，经得起任何审查。"</p>\n<p>第二天，陆峥寒和温叙白分头行动。</p>\n<p>陆峥寒这边：让林舟整理恒盛近半年所有不正当竞争的证据——恶意压价、挖角、舆论操控，形成完整的证据链。同时，通过法律团队准备反诉材料。</p>\n<p>温叙白这边：他花了一整天时间，写了一份长达四十页的《滨水一期设计与安全分析报告》，用数据、图纸和第三方检测报告，详细论证了设计方案的合规性和安全性，并明确指出事故原因在于施工方未按图纸施工。</p>\n<p>报告的第三部分是关键——温叙白用红蓝两色标注了设计原图和实际施工的偏差。设计图上，脚手架的连墙件间距是三米六一道；而现场照片显示，实际间距被放大到了五米二。三米六到五米二，差了一点六米，差的那一点六米就是脚手架失稳的临界值。</p>\n<p>"他们省了三分之一的连墙件。"温叙白在报告里写道，"按市场价，每道连墙件节约的材料成本约为一百二十元。整栋楼省下来的钱，不够买一辆二手车。"</p>\n<p>这句话被多家媒体引用。</p>\n<p>报告写完后，温叙白发给了陆峥寒。</p>\n<p>陆峥寒看完，只说了一句："叙白，你这份报告比律师函还狠。"</p>\n<p>"事实而已。"</p>\n<p>一周后，恒盛的舆论攻势发动了。</p>\n<p>某财经自媒体发布了一篇标题为《滨水新区安全事故背后：天才设计师的隐藏隐患？》的文章，影射温叙白的设计存在缺陷。</p>\n<p>文章发出两小时后，陆氏法务部直接向该自媒体发送了律师函。</p>\n<p>同时，陆峥寒安排人在官方渠道发布了温叙白那份完整报告的公开版，附上了第三方检测机构的认证文件和施工方违规的详细记录。</p>\n<p>报告公开后，舆论并没有像陆峥寒预期的那样瞬间逆转——而是分裂了。</p>\n<p>专业建筑论坛上，多数人认可报告的专业性："温叙白这报告写得比论文还严谨，每一项都有数据支撑。""原来事故是施工方不按图纸来，连墙件间距差了一点六米，这跟设计师有什么关系？"</p>\n<p>但在大众舆论场上，恒盛请的那几个财经记者并不打算轻易收手。他们换了个角度——不质疑报告本身，而是质疑"为什么这份报告现在才出"："如果设计真的没问题，为什么陆氏要在事发半年后才公布完整分析？""是不是心虚才补的？"</p>\n<p>更棘手的是，有两个不知名的小媒体发了"深度调查"——标题是《滨水新区安全事故：谁在替设计师洗白？》，通篇没有实质证据，但语气暧昧，暗示陆氏动用资本力量压制真相。</p>\n<p>这些文章在社交平台上被大量转发，评论区吵成一锅粥。</p>\n<p>"信温叙白的报告，数据骗不了人。"</p>\n<p>"数据可以挑选着放，你信一个和陆氏总裁官宣的人说的话？"</p>\n<p>"建筑圈的事我不懂，但四十页报告摆在那儿，比嘴炮强。"</p>\n<p>温叙白看完这些评论，表情没什么变化，但陆峥寒注意到他关掉手机时手指比平时多用了一点力。</p>\n<p>"叙白——"</p>\n<p>"我知道。"温叙白语气平静，"大众舆论不是靠一份报告就能赢的。真相跑得比谣言慢，这是常识。"</p>\n<p>"那你的计划是？"</p>\n<p>"等。"温叙白说，"报告已经发出去了，专业圈的判断不会因为几篇水文改变。大众舆论会吵一阵子，但只要不出新的事故，热度自然会降。真正该做的，是让他们吵的时候，我们不在意。"</p>\n<p>陆峥寒看着他："你不在意？"</p>\n<p>"我的设计经得起审查，这是事实。"温叙白目光清冷，"至于别人信不信——那是他们的事，不是我的。"</p>\n<p>但他不是完全不在意。</p>\n<p>第二天，温叙白接到一个电话——之前在谈的一个商业综合体设计项目，甲方打来的，语气客气但意思明确："温先生，最近网上的那些报道……我们董事会需要再评估一下合作风险。"</p>\n<p>温叙白挂了电话，没有告诉陆峥寒。</p>\n<p>但陆峥寒还是知道了——不是温叙白说的，是林舟在例行监控行业动态时发现的。</p>\n<p>"陆总，城西那个商业综合体项目，甲方暂停了和温先生的接洽。"林舟把消息递过来，"原因不明，但时间点太巧了。"</p>\n<p>陆峥寒手指收紧了一下。他没有立刻告诉温叙白——因为温叙白说过"不在意"，而他不想让叙白觉得自己在替他操心。</p>\n<p>但他做了另一件事：让陆氏旗下的商业地产板块，主动接洽了那个甲方的另一个项目，条件开得比市场价低一成。不是为了拉拢，只是为了让对方知道——和温叙白合作，意味着同时获得陆氏的商誉背书；不和温叙白合作，也不会得罪陆氏——但路会窄一些。</p>\n<p>这些事，他也没告诉温叙白。</p>\n<p>——但真正的致命一击，来自陆峥寒对恒盛的反向操作。</p>\n<p>他让林舟把恒盛恶意操控舆论的证据——钱明远请记者吃饭的录音、恒盛公关部的内部邮件截图、那几个"小媒体"和恒盛之间的资金往来——交给了三家主流财经媒体。</p>\n<p>但不是同时给的。</p>\n<p>第一家是《海城财经周刊》，行业权威，给了完整证据链。第二家是《东方商报》，主流大报，只给了钱明远接触记者的部分。第三家是一家自媒体大V，只给了"小媒体收钱发黑稿"的线索。</p>\n<p>三家媒体在同一周的不同日期分别发了报道——角度各不相同，但拼在一起，形成了一个完整的恒盛操控舆论的图景。</p>\n<p>这不是一次性爆料，而是一个持续发酵的过程。恒盛没法用一篇声明回应三篇不同角度的报道，因为每篇的侧重点不同——这就像打地鼠，按下一个冒出两个。</p>\n<p>恒盛股价一周内跌了7.2%，但不是崩盘式的跌——是每天跌一点，像温水煮青蛙。更让赵恒不安的是，银行那边开始打电话来"了解情况"了。</p>\n<p>赵恒在办公室看到第三篇报道的时候，没有拍桌子。</p>\n<p>他反而出奇地平静——因为他知道，拍桌子没有用。问题不在陆峥寒反击得太狠，而在自己这边太急了。钱明远找的那些记者不够硬，写出来的东西经不起追溯；那几个小媒体更是蠢——收了钱连IP都洗不干净。</p>\n<p>"钱明远。"他叫来人，语气反而比平时更轻。</p>\n<p>钱明远站在对面，脸色不好看："赵总，陆峥寒这三篇报道的时间差打得太精了——"</p>\n<p>"我知道。"赵恒抬手打断他，"问题不在他精，在我们自己露了太多破绽。你找的那些人，质量不够。"</p>\n<p>"那——"</p>\n<p>"先停。"赵恒说，"不是认输，是换思路。正面舆论战打不过他——他有温叙白那份报告镇着，还有主流媒体给他背书。我们不能再在这个层面上耗了。"</p>\n<p>"那下一步怎么办？"</p>\n<p>赵恒沉默了一会儿："先稳住股价和银行那边。然后——换个打法。"</p>\n<p>他没有说新打法是什么。钱明远也没问。</p>\n<p>当晚，陆峥寒和温叙白坐在私宅阳台上。</p>\n<p>"结束了吗？"温叙白问。</p>\n<p>"阶段性结束。"陆峥寒喝了口茶，"赵恒收手了，但不是认输。他是个聪明人——吃了亏会复盘，然后换一种更难对付的方式。"</p>\n<p>"嗯。"</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"城西那个项目——"</p>\n<p>"你知道了？"温叙白偏头看他，目光微凉。</p>\n<p>"林舟在行业监控里发现的。"陆峥寒顿了顿，"我做了一件事——"</p>\n<p>他把城西项目的处理方式说了。</p>\n<p>温叙白听完，沉默了几秒："峥寒，你不需要替我铺路。"</p>\n<p>"我知道你不需要。"陆峥寒看着他，"但那不是替你铺路，是替陆氏筛选合作伙伴。和温叙白合作就等于获得陆氏商誉——这个信号需要发出去。"</p>\n<p>温叙白看了他一会儿，没有反驳。</p>\n<p>"谢谢你。"他说。</p>\n<p>"不客气。"陆峥寒弯唇，"你那份报告才是关键——四十页，每个数据都有出处。你比我想的还要厉害。"</p>\n<p>温叙白偏头看他，眼底带着淡淡的光："我说了，我们是并肩的。"</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"以后有事不要瞒我。"</p>\n<p>"……好。"</p>\n<p>"说真的。"</p>\n<p>"真的。"陆峥寒伸手揽过他的肩膀，把人拉进怀里，"不瞒了。"</p>\n<p>温叙白没有挣开，靠在他肩上，看着远处的城市灯火。</p>\n<p>夜风温柔，但远处的天际线边缘有一层薄薄的阴云——暴风雨还远，但已经在聚集了。</p>\n<p>并肩作战的默契，比任何甜言蜜语都让人安心。但这一局赢得并不轻松——舆论的裂痕还在，城西项目暂停的余波还在，赵恒的"新打法"还在酝酿。</p>\n<div class="hook">**【本章钩子：恒盛的舆论攻势被联手挡住，但赢得并不干净——大众舆论依然分裂，温叙白的一个项目被暂停，赵恒并未真正认输而是准备"换打法"。温叙白那句"以后有事不要瞒我"在夜风中格外有分量。更隐蔽的危险正在酝酿……】**</div>\n'},
  {title:'第77章 海外项目，异地考验', vol:3, html:'<p>恒盛风波平息后不到一个月，温叙白收到了一个意料之外的邀约。</p>\n<p>国际建筑双年展策委会正式邀请他参加明年在米兰举办的年度双年展，并建议他提前三个月赴意进行作品筹备和学术交流。</p>\n<p>这是全球建筑界最高规格的展览之一，对任何建筑师来说都是梦寐以求的机会。</p>\n<p>温叙白拿着邀请函坐在工作室里，沉默了很久。</p>\n<p>晚上回家，他把这件事告诉了陆峥寒。</p>\n<p>陆峥寒正在切菜，听到这话，手里的刀顿了一下。</p>\n<p>"三个月？"他问。</p>\n<p>"嗯。下个月出发，年底回来。"</p>\n<p>陆峥寒没有说话，继续切菜。刀落在案板上的声音在安静的厨房里格外清晰。</p>\n<p>温叙白靠在门框上看着他，等了两分钟。</p>\n<p>"你不说话，是不高兴了？"</p>\n<p>"没有。"陆峥寒头也不回，"我在想三个月怎么熬。"</p>\n<p>温叙白嘴角微弯："你是霸总，不是分离焦虑症幼童。"</p>\n<p>"霸总也有分离焦虑症。"陆峥寒放下刀，转身看他，表情认真，"叙白，这是你的事业，你应该去。双年展是你一直想去的机会。"</p>\n<p>"但三个月——"</p>\n<p>"三个月而已。"陆峥寒走过来，用围裙擦了擦手，握住他的手，"我去米兰看你，你也可以飞回来。现在交通这么方便。"</p>\n<p>温叙白看着他："你真的不介意？"</p>\n<p>"我介意。"陆峥寒诚实地说，"但我更介意因为我的存在，让你错过这样的机会。"</p>\n<p>温叙白沉默了几秒，然后说："那我下周一走。"</p>\n<p>"好。"</p>\n<p>接下来一周，陆峥寒把能做的准备全做了——给温叙白订了头等舱往返机票、在米兰订了短租公寓、联系了当地的华人助理、甚至提前研究了米兰中餐厅的位置分布。</p>\n<p>"你是不是把我米兰三个月的饭都安排好了？"温叙白看着陆峥寒整理的文档，表情微妙。</p>\n<p>"你不是吃不惯西餐吗。"</p>\n<p>"……我在意大利可以学吃意餐。"</p>\n<p>"意餐可以偶尔吃，但天天吃你会疯。"陆峥寒理直气壮，"我查过了，你公寓附近有三家中餐厅，我让助理加了中国超市的微信群。"</p>\n<p>温叙白看着他认真整理的"米兰生活指南"，心里有什么东西柔软得一塌糊涂。</p>\n<p>出发那天，陆峥寒亲自送温叙白到机场。</p>\n<p>安检口前，温叙白转身看他。</p>\n<p>"到了给你打电话。"</p>\n<p>"嗯。"陆峥寒点点头，然后忽然伸手，在众目睽睽之下抱住了他。</p>\n<p>温叙白僵了一秒，然后慢慢抬手回抱。</p>\n<p>"三个月很快。"陆峥寒声音闷闷的，埋在他肩窝里。</p>\n<p>"嗯。"</p>\n<p>"不许跟意大利帅哥走太近。"</p>\n<p>"……你是霸总，不是醋坛子。"</p>\n<p>"霸总也可以是醋坛子。"</p>\n<p>温叙白轻笑出声，拍了拍他的背："我走了。"</p>\n<p>陆峥寒松开手，退后一步，看着他走进安检通道。</p>\n<p>温叙白的背影清瘦挺拔，拖着行李箱，没有回头。</p>\n<p>——直到过了转弯处，温叙白才停了一下，回头看了一眼。</p>\n<p>陆峥寒还站在原地，看着他。</p>\n<p>隔着人群和距离，温叙白微微弯了弯嘴角，然后转身走了。</p>\n<p>米兰的时间比海城慢六个小时。</p>\n<p>温叙白到达米兰是当地凌晨。他拖着行李进了公寓，收拾完已经凌晨三点。算了一下海城时间正好是早上九点，他拿出手机。</p>\n<p>陆峥寒的消息已经发过来了——</p>\n<p>【到了吗？】</p>\n<p>【公寓怎么样？】</p>\n<p>【有没有吃东西？】</p>\n<p>【意大利的wifi连上了吗？】</p>\n<p>温叙白看着屏幕，嘴角弯起来，一条条回复。</p>\n<p>【到了。公寓很好。吃了。连上了。】</p>\n<p>对面秒回：【照片呢？】</p>\n<p>温叙白拍了张公寓客厅的照片发过去。</p>\n<p>【太白了。我给你寄点东西过去装饰一下。】</p>\n<p>【不用。】</p>\n<p>【已经下单了。问个地址。】</p>\n<p>温叙白无奈地发了地址，然后洗漱睡觉。</p>\n<p>第二天醒来，手机上有陆峥寒发来的十几条消息——从凌晨到早上，像是在刻意控制频率，每隔一两小时发一条。</p>\n<p>【海城下雨了，你那边天气怎么样？】</p>\n<p>【今天开了三个会，好累。想你了。】</p>\n<p>【林舟问你要不要参加下个月的线上建筑论坛，我说等你定。】</p>\n<p>【你吃早饭了吗？】</p>\n<p>【给你寄的包裹已经发货了，预计三天到。】</p>\n<p>温叙白一条条看完，心里某个角落被填得满满当当。</p>\n<p>他回了一条：【吃了。你早点睡。想你。】</p>\n<p>对面隔了一分钟才回：【……你说想我了？？？】</p>\n<p>【嗯。】</p>\n<p>【截图保存了。】</p>\n<p>【随便。】</p>\n<p>【永远不删。】</p>\n<p>温叙白看着屏幕，笑出了声。</p>\n<p>异地恋第一天，还算……不太难熬。</p>\n<div class="hook">**【本章钩子：三个月异地考验正式开始。陆峥寒的"米兰生活指南"和密集消息，把霸总的分离焦虑暴露无遗。但异国的距离，会让感情升温还是产生裂痕？温叙白说出的那句"想你"，又藏着多少不曾表露的深情？】**</div>\n'},
  {title:'第78章 跨国连线，思念成疾', vol:3, html:'<p>异地第二周，温叙白开始觉得有些不对劲。</p>\n<p>不是工作的问题——双年展的筹备进展顺利，策委会对他提交的参展方案评价很高。也不是生活的问题——公寓里陆续收到了陆峥寒寄来的各种包裹：中国茶的茶具、一盏暖光台灯、一条和家里同款的薄毯、甚至还有一袋他爱吃的薄荷糖。</p>\n<p>是那个人的声音。</p>\n<p>陆峥寒每天雷打不动地跟他视频通话。海城晚上九点，米兰下午三点，陆峥寒会准时打过来。</p>\n<p>起初是正常的——聊工作、聊日常、偶尔拌几句嘴。</p>\n<p>但从第二周开始，温叙白注意到陆峥寒通话时经常走神，眼圈发青，说话的声音也带着疲惫。</p>\n<p>"你最近睡不好？"温叙白问。</p>\n<p>"没有。"陆峥寒笑着摇头，"就是时差——你那边下午三点，我这边晚上九点，有时候等你消息等到半夜。"</p>\n<p>"你不用等我消息。"</p>\n<p>"等不到你消息我睡不着。"</p>\n<p>温叙白皱眉："陆峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你在国内有公司要管，不能因为等我消息搞坏身体。"</p>\n<p>"我没有——"</p>\n<p>"你黑眼圈比我画的设计图阴影还重。"</p>\n<p>陆峥寒沉默了一下，然后笑了："叙白，你什么时候学会说这种话了。"</p>\n<p>"被你传染的。"</p>\n<p>视频通话结束后，温叙白坐在工作台前，看着屏幕上未完成的设计图，忽然没什么心思画了。</p>\n<p>他打开手机相册，翻到最近的照片——出发前在机场的那张合照，是陆峥寒硬拉着自拍的。照片里陆峥寒笑得灿烂，温叙白面无表情，但两人靠得很近。</p>\n<p>温叙白盯着那张照片看了很久。</p>\n<p>他不习惯说想念。二十七年来，他从来没有特别想念过谁——父母常年在国外，他早就习惯了独处。但这一次不一样。</p>\n<p>这种感觉很微妙。不是心里空了一块，而是所有事情都想要第一个人知道。看到好的建筑会想拍照发给他，吃到好吃的会想下次带他来，画完一张图会想第一时间听他的评价。</p>\n<p>他手指在屏幕上犹豫了一下，给陆峥寒发了一条消息：</p>\n<p>【今天去了布雷拉美术馆，有一幅肖像画的光影处理跟你有点像。】</p>\n<p>附了一张照片。</p>\n<p>五秒后，陆峥寒回：【哪幅？我看看。】</p>\n<p>温叙白把照片放大，拍了一张细节图发过去。</p>\n<p>【嗯，确实有点像。】陆峥寒回，然后过了几秒又发了一条，【你今天去美术馆了？开心吗？】</p>\n<p>【还行。一个人逛有点无聊。】</p>\n<p>【……你想我了？】</p>\n<p>温叙白盯着屏幕，打了一行字又删掉，最后只回了一个字。</p>\n<p>【嗯。】</p>\n<p>对面沉默了整整两分钟。</p>\n<p>然后：【叙白，我下周去看你。】</p>\n<p>【你不是说月底吗？】</p>\n<p>【等不了了。】</p>\n<p>温叙白看着这四个字，嘴角不受控制地弯了起来。</p>\n<p>但他没有再回复，只是把手机放在一旁，继续画图。</p>\n<p>嘴角却怎么也压不下去。</p>\n<p>与此同时，海城。</p>\n<p>陆峥寒放下手机，对站在门口的林舟说："改一下下周的行程，把能推的会议都推了。"</p>\n<p>林舟面露难色："陆总，下周三有和市领导的会面——"</p>\n<p>"那个推不了，其他全部挪后。我周三开完会直接飞米兰。"</p>\n<p>"……陆总，您是要周三下午开完会，晚上飞十几个小时到米兰？"</p>\n<p>"嗯。"</p>\n<p>"那您到了就是米兰周四早上——"</p>\n<p>"刚好给叙白一个惊喜。"陆峥寒说着，已经在手机上订机票了。</p>\n<p>林舟看着他雷厉风行的样子，默默叹了口气。</p>\n<p>恋爱中的霸总，大概是没有时差这个概念的。</p>\n<div class="hook">**【本章钩子：异地两周，霸总的分离焦虑症全面爆发——黑眼圈、熬夜等消息、疯狂寄包裹。而一向清冷的温叙白，也开始不自觉地表达想念。下周，陆峥寒将飞越万里，带来一场跨国惊喜。但重逢的甜蜜背后，双年展的压力也在悄然增大……】**</div>\n'},
  {title:'第79章 惊喜飞抵，异国重逢', vol:3, html:'<p>温叙白不知道陆峥寒提前了行程。</p>\n<p>他只知道那天是周四，米兰的早晨阳光很好。他按照惯例八点出门，步行去双年展策委会的工作室。</p>\n<p>走到公寓楼下时，他停住了。</p>\n<p>一辆黑色的奔驰停在路边，车身沾着露水，像是刚到不久。温叙白没在意，绕过车继续走。</p>\n<p>"叙白。"</p>\n<p>身后传来一个熟悉到骨子里的声音。</p>\n<p>温叙白脚步猛地顿住。</p>\n<p>他缓缓转身。</p>\n<p>陆峥寒站在车旁，穿着深灰色大衣，围着围巾，手里提着一个保温袋。他看起来风尘仆仆，眼下有淡淡的青色，但嘴角是温叙白最熟悉的笑。</p>\n<p>"惊喜吗？"陆峥寒说。</p>\n<p>温叙白站在原地，看着他，一动不动。</p>\n<p>初秋的米兰晨光里，街头的行人来来往往，有人骑着自行车经过，教堂的钟声在远处响起。</p>\n<p>温叙白走过去，走到陆峥寒面前，抬头看他。</p>\n<p>"你飞了十几个小时？"</p>\n<p>"十三个小时。"陆峥寒纠正，"在迪拜转了一次机。"</p>\n<p>"周三开完会直接飞的？"</p>\n<p>"嗯。"</p>\n<p>"你疯了吗？"</p>\n<p>"可能是。"陆峥寒笑着，把保温袋举了举，"给你带了小笼包。周伯做的，我保温了一路。"</p>\n<p>温叙白看着那个保温袋，又看了看陆峥寒疲惫但发光的眼睛。</p>\n<p>他忽然上前一步，抱住了陆峥寒。</p>\n<p>在大街上，在米兰的晨光里，在来来往往的行人中。</p>\n<p>陆峥寒愣了一瞬，随即收紧手臂，用力回抱。</p>\n<p>"想你了。"陆峥寒的声音闷在他肩窝里，带着十几个小时飞行的疲惫和终于见到人的满足。</p>\n<p>温叙白没说话，只是收紧了手臂。</p>\n<p>他们抱了很久，久到路过的意大利老太太投来善意的微笑。</p>\n<p>最后是温叙白先松开的。</p>\n<p>"走吧，上去吃小笼包。"他说，声音比平时哑了一点。</p>\n<p>"你不先去工作室？"</p>\n<p>"今天请假。"</p>\n<p>陆峥寒眼睛亮了。</p>\n<p>两人回到公寓，陆峥寒把小笼包加热，温叙白泡了两杯茶。</p>\n<p>小笼包还是温热的，皮薄馅大，一咬就是满口汤汁。</p>\n<p>"周伯的手艺。"温叙白吃了两个，给出评价。</p>\n<p>"我让他多做了一百个，冷冻寄过来了。"陆峥寒自己也吃了几个，"在冷冻层，你想吃的时候蒸一下就行。"</p>\n<p>温叙白看了他一眼："你什么时候准备的？"</p>\n<p>"上周。"陆峥寒理直气壮，"我订机票的时候就让他开始做了。"</p>\n<p>温叙白忍不住笑了一下。</p>\n<p>吃完早饭，陆峥寒在沙发上瘫了下来，时差和长途飞行的疲惫终于涌上来。</p>\n<p>"你先睡。"温叙白给他盖上那条他寄来的薄毯。</p>\n<p>"不困。"陆峥寒嘴上说着，眼皮已经开始打架，"你今天陪我对不对？"</p>\n<p>"嗯。"</p>\n<p>"那我睡一会儿……就一会儿……"</p>\n<p>话没说完，人就睡着了。</p>\n<p>温叙白坐在旁边，看着他蜷在沙发上的样子——这个在商界叱咤风云的霸总，为了见他一面，飞了十三个小时，带着一袋小笼包，在异国的沙发上像个孩子一样睡着了。</p>\n<p>温叙白伸手，轻轻拨开他额前的碎发。</p>\n<p>"陆峥寒。"他低声说，声音轻得像叹息，"我也想你。"</p>\n<p>睡着的陆峥寒当然听不到。</p>\n<p>但他的嘴角似乎弯了一下。</p>\n<p>温叙白坐在旁边，拿出速写本，开始画陆峥寒的睡颜。</p>\n<p>线条流畅，笔触温柔。</p>\n<p>他画了很多建筑，画过无数图纸，但这是第一次画一个人。</p>\n<p>画完之后，他撕下那页纸，折好，放进了陆峥寒寄来的那盏暖光台灯下面。</p>\n<p>陆峥寒这一觉睡了四个小时。</p>\n<p>醒来时，窗外已经是下午。金色的阳光透过纱帘洒进来，温叙白坐在工作台前画图，手边放着一杯茶。</p>\n<p>"叙白。"</p>\n<p>"醒了？"温叙白头也不抬。</p>\n<p>"嗯。"陆峥寒坐起来，揉了揉眼睛，"你一直在这？"</p>\n<p>"我说了今天陪你。"</p>\n<p>陆峥寒看着他，笑意从眼底漫开。</p>\n<p>"那——"他站起来，走到温叙白身边，"带我逛逛米兰？"</p>\n<p>温叙白放下笔，看了他一眼。</p>\n<p>"好。"</p>\n<div class="hook">**【本章钩子：跨国重逢，一袋小笼包暖了整个秋天。温叙白第一次画了一个人的画像，说了那句睡着时听不到的"我也想你"。接下来的米兰时光，将给两人留下最浪漫的异国记忆……】**</div>\n'},
  {title:'第80章 异国浪漫，巴黎铁塔', vol:3, html:'<p>陆峥寒在米兰待了五天。</p>\n<p>这五天里，他像一个普通游客一样跟着温叙白走遍了米兰的大街小巷——布雷拉美术馆、米兰大教堂、斯卡拉歌剧院、纳维利运河区。</p>\n<p>温叙白带他看建筑，他就认真地听。虽然他不太懂建筑学，但他能听懂温叙白语气里那种罕见的热情。</p>\n<p>"你讲建筑的时候，眼睛是亮的。"陆峥寒在布雷拉美术馆的长廊上说。</p>\n<p>"有吗？"温叙白摸了摸自己的脸。</p>\n<p>"有。"陆峥寒认真地点头，"特别好看。"</p>\n<p>温叙白别开脸，耳尖微红。</p>\n<p>第五天，陆峥寒提议去一趟巴黎。</p>\n<p>"巴黎？"温叙白挑眉。</p>\n<p>"从米兰坐火车到巴黎只要七个小时。"陆峥寒拿出手机展示火车票，"我已经订好了。"</p>\n<p>"你什么时候订的？"</p>\n<p>"来之前。"</p>\n<p>温叙白无奈地看着他："你是不是把整个行程都安排好了，包括我会答应？"</p>\n<p>"你不会拒绝我。"陆峥寒笑了笑，语气笃定。</p>\n<p>温叙白看了他两秒，确实说不出"不"字。</p>\n<p>第二天一早，两人坐上了前往巴黎的火车。</p>\n<p>窗外的风景从意大利的阳光小镇变成法国的田园牧场，温叙白靠在窗边看风景，陆峥寒靠在他肩上看他。</p>\n<p>"你看风景，我看你。"</p>\n<p>"恶心。"</p>\n<p>"谢谢夸奖。"</p>\n<p>到达巴黎是下午三点。三月的巴黎还带着凉意，但阳光温暖，街头的梧桐树刚刚冒出新芽。</p>\n<p>两人先去了塞纳河畔。河面波光粼粼，两岸是古老的建筑和书摊。</p>\n<p>温叙白站在桥上看河，陆峥寒站在他身后看桥上的他。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"你知道埃菲尔铁塔晚上会亮灯吗？"</p>\n<p>"知道。"</p>\n<p>"今晚去看？"</p>\n<p>"好。"</p>\n<p>傍晚，两人来到埃菲尔铁塔下。</p>\n<p>暮色四合，铁塔在深蓝的天空下勾勒出钢铁的轮廓。每到整点，铁塔上的灯会闪烁五分钟，像一场钻石雨。</p>\n<p>两人站在战神广场的草坪上，仰头看着铁塔。</p>\n<p>八点整，灯亮了。</p>\n<p>万千灯光同时闪烁，整座铁塔像一颗巨大的圣诞树，在巴黎的夜空中璀璨夺目。</p>\n<p>周围的人群发出惊叹声，有情侣在拥抱，有人在拍照。</p>\n<p>温叙白仰头看着灯光，清冷的面容被灯光映得柔和。</p>\n<p>"好看。"他说。</p>\n<p>"嗯。"陆峥寒应了一声，但目光不在铁塔上。</p>\n<p>温叙白偏头，正好对上陆峥寒的视线——他没有在看铁塔，一直在看他。</p>\n<p>"你在看我？"</p>\n<p>"铁塔哪有你好看。"</p>\n<p>温叙白嘴角弯了弯，没有反驳。</p>\n<p>灯光闪烁的间隙，陆峥寒忽然伸手，轻轻握住了温叙白的手，手指交缠。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"以后每一年，我都想带你去一个地方。"陆峥寒的声音在灯光中格外温柔，"今年巴黎，明年想去哪？"</p>\n<p>温叙白想了想："我想去京都看安藤忠雄的作品。"</p>\n<p>"好。后年京都。"陆峥寒笑着，"大后年呢？"</p>\n<p>"巴塞罗那。高迪的建筑。"</p>\n<p>"好。大后年巴塞罗那。"</p>\n<p>温叙白转头看他，灯光在他的瞳孔里碎成星星点点的光："你真的愿意每年陪我去看建筑？"</p>\n<p>"我愿意陪你做任何事。"陆峥寒认真地说，"看建筑、逛美术馆、吃难吃的西餐——只要跟你在一起。"</p>\n<p>温叙白看着他，灯光在他身后闪烁如星雨。</p>\n<p>他微微侧身，靠在了陆峥寒肩上。</p>\n<p>这是他在公共场合第一次主动靠近。</p>\n<p>陆峥寒呼吸微顿，然后轻轻把下巴搁在他头顶，两人一起仰头看灯。</p>\n<p>铁塔的灯光还在闪烁，巴黎的夜风带着花香。</p>\n<p>"峥寒。"</p>\n<p>"嗯。"</p>\n<p>"谢谢你飞来看我。"</p>\n<p>"不用谢。"陆峥寒收紧了握着他的手，"你应该知道——只要你需要，我在所不辞。"</p>\n<p>温叙白没有说话，但手指微微收紧了。</p>\n<p>巴黎铁塔的灯光灭了，夜色重新沉静下来。</p>\n<p>但两人的手始终没有松开。</p>\n<p>从米兰到巴黎，从铁塔到塞纳河——这段异国的记忆，将成为他们之间最浪漫的篇章之一。</p>\n<div class="hook">**【本章钩子：巴黎铁塔下的十指相扣，温叙白第一次在公共场合主动靠近。每年一个地方的建筑之旅，成了两人之间的约定。但异国之旅终将结束，回国的日常甜蜜背后，温叙白深藏的童年往事即将浮出水面……】**</div>\n'},
  {title:'第81章 归国日常，甜蜜依旧', vol:3, html:'<p>三个月的异地终于结束了。</p>\n<p>温叙白从米兰回来那天，陆峥寒亲自去机场接机。航班落地是下午两点，陆峥寒十二点就到了到达大厅。</p>\n<p>温叙白推着行李车出来时，一眼就看到了站在人群里的陆峥寒——深色大衣，围巾，手里举着一束白色的郁金香。</p>\n<p>"你怎么举花？好丢人。"温叙白走过来，面无表情地说。</p>\n<p>"接你回家，当然要举花。"陆峥寒把花塞进他怀里，顺手接过行李箱，"走吧，回家。"</p>\n<p>"回家"两个字说得自然而然。</p>\n<p>温叙白抱着郁金香坐进车里，嘴角微弯。</p>\n<p>回到私宅，发现家里被打理得干干净净——冰箱里塞满了食材，客厅的花瓶换了新的鲜花，卧室的床单也换了新的。</p>\n<p>"你把家重新收拾了一遍？"</p>\n<p>"嗯。"陆峥寒脱了大衣，走进厨房，"三个月没住人，总要整理一下。你先休息，我做饭。"</p>\n<p>温叙白在沙发上坐下，环顾四周。</p>\n<p>一切都和离开时一样，但又更温暖了。</p>\n<p>三个月异地，让这种"回家"的感觉变得格外珍贵。</p>\n<p>晚饭是陆峥寒做的红烧排骨、清炒时蔬和番茄蛋汤。温叙白吃了两碗饭——在米兰吃了三个月意面和披萨，他无比想念陆峥寒做的中餐。</p>\n<p>"慢点吃。"陆峥寒看着他狼吞虎咽的样子，又好笑又心疼，"又没人跟你抢。"</p>\n<p>"三个月没吃你做的饭了。"</p>\n<p>"以后不让你走这么久了。"</p>\n<p>"那不行。"温叙白放下筷子，认真地看他，"双年展是重要的机会，如果以后还有类似的项目——"</p>\n<p>"我知道。"陆峥寒笑了笑，"我说的是不让你走这么久，不是不让你去。下次我陪你一起去。"</p>\n<p>温叙白看着他，没有说话，但眼底有温暖的光。</p>\n<p>回归日常后，两人的生活重新步入正轨。</p>\n<p>早上七点半，陆峥寒起床做早餐。温叙白八点起来，两人一起吃早饭。然后陆峥寒去陆氏，温叙白去工作室。</p>\n<p>中午，陆峥寒必定打电话问温叙白吃了什么。</p>\n<p>下午，温叙白会在工作间隙给陆峥寒发一张设计图的照片，附一句"这面墙你觉得用什么材质好"。</p>\n<p>晚上，陆峥寒来接温叙白下班，一起回家做饭。</p>\n<p>日子平淡而温暖。</p>\n<p>但变化也不是没有。</p>\n<p>异地三个月回来后，温叙白变得更愿意表达了。</p>\n<p>以前他不会主动说"想你了"，现在偶尔会在电话里说一句。以前他不会在公共场合靠近，现在偶尔会自然地挽住陆峥寒的手臂。</p>\n<p>这些变化微小但显著，陆峥寒每一次都看在眼里，心里甜得冒泡。</p>\n<p>"叙白，你是不是在米兰被意大利人传染了？"有天晚上看电视时，温叙白主动靠过来，陆峥寒调侃道。</p>\n<p>"什么？"</p>\n<p>"你以前不会主动靠过来。"</p>\n<p>温叙白顿了一下，然后面无表情地说："冷。"</p>\n<p>"家里暖气开着，二十六度。"</p>\n<p>"我体寒。"</p>\n<p>陆峥寒笑出了声，伸手揽过他的肩膀，把人拉进怀里。</p>\n<p>"体寒是吧？那我给你暖暖。"</p>\n<p>温叙白靠在他怀里，没有挣扎，嘴角弯了弯。</p>\n<p>电视里放着什么两人都没在意。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"米兰那三个月，其实我很想你。"</p>\n<p>陆峥寒低头看他，温叙白没有回视，目光落在电视上，但耳尖是红的。</p>\n<p>"我知道。"陆峥寒在他发顶落下一吻，"所以我来了。"</p>\n<p>温叙白没有再说话，但身体放松地靠在他怀里。</p>\n<p>窗外是海城的万家灯火，室内是两个人安静而温暖的日常。</p>\n<p>这就是他们最好的模样——不需要轰轰烈烈，只需要你在身边。</p>\n<div class="hook">**【本章钩子：异地归来，日常甜蜜升级。温叙白的变化显而易见——更愿意表达，更愿意靠近。但平静的日子不会太久，温叙白深藏多年的童年往事，即将在一个不经意的瞬间被揭开……】**</div>\n'},
  {title:'第82章 童年阴影，旧事浮沉', vol:3, html:'<p>事情的起因是一个电话。</p>\n<p>那天下午，温叙白正在工作室改图，手机忽然响了。来电显示是一个他不常联系的号码——温家老宅的座机。</p>\n<p>"喂？"</p>\n<p>"叙白啊，是周阿姨。"电话那头是温家老宅管家的声音，带着犹豫，"你爸让我问你，下个月你爷爷的忌日，你要不要回来一趟？"</p>\n<p>温叙白握着手机的手微微收紧。</p>\n<p>"……我知道了。"</p>\n<p>挂了电话，他在工作台前坐了很久，手里的笔没有动。</p>\n<p>晚上回家，陆峥寒察觉到了他的异常。</p>\n<p>"怎么了？"陆峥寒端着两杯茶走过来，递给他一杯。</p>\n<p>"没事。"</p>\n<p>"你今天的\'没事\'比平时多了三秒停顿。"陆峥寒在他对面坐下，"叙白，你说过的——以后有事不瞒我。"</p>\n<p>温叙白沉默了。</p>\n<p>良久，他开口："下个月是我爷爷的忌日。"</p>\n<p>陆峥寒没有说话，等他继续。</p>\n<p>"我爷爷……"温叙白放下茶杯，目光落在某个虚空的地方，"是建筑师。"</p>\n<p>陆峥寒微微一愣。温叙白从未提过爷爷的事。</p>\n<p>"他叫温怀瑾，是上世纪八十年代海城最有名的建筑师之一。海城老城区的很多公共建筑都是他设计的。"温叙白的声音很平，像在讲别人的故事，"我从小跟他最亲。爸妈在国外做研究，一年回来一两次，我基本是跟着爷爷长大的。"</p>\n<p>"我的建筑天赋来自他。他教我画图、教我看建筑、教我用光影和线条表达空间。我五岁开始跟他学画，七岁就能画出完整的建筑剖面图。"</p>\n<p>"他是我生命里最重要的人。"</p>\n<p>陆峥寒静静地听着，没有打断。</p>\n<p>"但他和我爸关系很差。"温叙白的声音低了一些，"我爸觉得建筑设计不是\'正经学问\'，他希望我走学术路线。爷爷和我爸因为这个吵了一辈子。"</p>\n<p>"后来——"温叙白的手指微微收紧，"我十二岁那年，爷爷被查出肺癌晚期。"</p>\n<p>客厅里安静得只听到钟表的走针声。</p>\n<p>"他最后的日子里，一直在画一张图。是一座图书馆的设计稿——他说那是他一辈子的梦想，想设计一座完美的社区图书馆。但他没能画完。"</p>\n<p>"去世那天晚上，他把未完成的设计稿交给我，说——\'叙白，帮爷爷画完它。\'"</p>\n<p>温叙白闭了闭眼。</p>\n<p>"我没画完。"</p>\n<p>"为什么？"陆峥寒轻声问。</p>\n<p>"因为那之后我——"温叙白停顿了一下，"我崩溃了。十二岁的孩子，失去了最重要的人。我开始失眠、焦虑、不愿意跟任何人说话。我妈从国外赶回来带我看了心理医生，医生说我有轻度的社交障碍和强迫倾向。"</p>\n<p>"洁癖也是那时候开始的。"</p>\n<p>陆峥寒心口发紧。</p>\n<p>"后来爸妈决定带我去国外生活，换个环境。我在国外待了五年，读了书，考了大学。但我一直不敢碰那张设计稿。"</p>\n<p>"直到回国后，我独立做了第一个项目——就是城东社区的集装箱图书馆。"温叙白看向陆峥寒，"那个项目的灵感来自爷爷未完成的图纸。我用现代手法重新诠释了他当年的设计理念。"</p>\n<p>陆峥寒忽然明白了——为什么滨水文化中心的水景幕墙上有"WXB"三个字母，为什么温叙白对公共建筑有着近乎执着的热情。</p>\n<p>"叙白——"</p>\n<p>"城东图书馆落成那天，我一个人在里面坐了一整夜。"温叙白声音很轻，"我跟爷爷说，我画完了。但其实，他的那张原图稿，我至今没有补完。"</p>\n<p>"我不知道该从哪里接笔。他的线条太好了，我总是觉得自己的不够好。"</p>\n<p>陆峥寒站起来，走到他身边，蹲下来，抬头看他。</p>\n<p>"叙白，你爷爷的设计稿在哪？"</p>\n<p>"工作室的保险柜里。"</p>\n<p>"明天给我看看好吗？"</p>\n<p>温叙白看着他，犹豫了几秒："你看不懂建筑图纸。"</p>\n<p>"我看不懂图纸，但我看得懂你。"陆峥寒握住他的手，"你背着这件事太久了。也许你需要一个人陪你一起面对。"</p>\n<p>温叙白看着他，眼底有什么东西在微微颤动。</p>\n<p>很久之后，他说："好。"</p>\n<p>那天夜里，温叙白失眠了。</p>\n<p>陆峥寒也没有睡着。他侧过身，在黑暗中伸手环住温叙白的腰。</p>\n<p>"睡不着？"</p>\n<p>"嗯。"</p>\n<p>"那我给你讲个故事。"</p>\n<p>"你不会讲故事。"</p>\n<p>"我讲一个你听听。"陆峥寒清了清嗓子，"从前有一个霸总，他蓄谋了七年追一个清冷美人。美人什么都好，就是不爱说话。霸总用了很长时间才让美人开口。后来霸总发现，美人心里藏着一个很重的故事——"</p>\n<p>"停。"温叙白打断他，"你讲得很难听。"</p>\n<p>"但你笑了。"</p>\n<p>温叙白在黑暗中确实弯了弯嘴角。</p>\n<p>"睡吧。"陆峥寒收紧手臂，"明天一起看图纸。"</p>\n<p>温叙白靠向他，闭上了眼。</p>\n<p>也许——是时候面对了。</p>\n<div class="hook">**【本章钩子：温叙白深藏的童年往事终于揭开——爷爷的遗愿、未完成的设计稿、一切执念的源头。陆峥寒说"我看得懂你"，但面对这份跨越生死的遗憾，他真的能帮温叙白释怀吗？明天的图纸前，一场最深的治愈即将开始……】**</div>\n'},
  {title:'第83章 陆峥寒心疼，暗夜守护', vol:3, html:'<p>第二天是周末。</p>\n<p>温叙白带着陆峥寒去了工作室。</p>\n<p>保险柜打开，里面是一个牛皮纸信封。信封已经发黄了，边角有些磨损，显然被保存了很多年。</p>\n<p>温叙白小心翼翼地取出里面的图纸，展开在工作台上。</p>\n<p>那是一张A2大小的手绘建筑图纸。铅笔线条细腻而有力，墨线标注清晰。图纸上画的是一座社区图书馆的平面和立面——布局巧妙，动线流畅，光线设计尤其出彩。</p>\n<p>但图纸只完成了三分之二。右下角的部分还是铅笔草稿，没有上墨线。</p>\n<p>图纸的右下角有一行小字，是老人的笔迹："叙白，帮爷爷画完它。"</p>\n<p>陆峥寒站在图纸前，虽然不懂建筑制图，但他能感受到这张图纸的重量——那是一个老人最后的梦想和对孙子的信任。</p>\n<p>"他画得真好。"陆峥寒说。</p>\n<p>"嗯。"温叙白的声音很轻，"他的线条是最好的。我到现在都觉得追不上。"</p>\n<p>"叙白，你不需要追上他。"陆峥寒转头看他，"你是温叙白，不是温怀瑾。你有你自己的线条。"</p>\n<p>温叙白看着他，没有说话。</p>\n<p>陆峥寒拿出手机，拍了几张图纸的照片："我能拍吗？"</p>\n<p>"拍它做什么？"</p>\n<p>"我想了解它。"陆峥寒认真地说，"你说过，城东图书馆是你根据爷爷的理念重新设计的。那你有没有想过——不是补完他的图，而是用你的方式完成他的梦想？"</p>\n<p>温叙白一愣。</p>\n<p>"这张图纸是爷爷的梦想。"陆峥寒指着未完成的右下角，"但梦想不是图纸本身，而是那座图书馆。城东图书馆已经建成了——你其实已经完成了他的梦想，只是用你自己的方式。"</p>\n<p>温叙白怔怔地看着图纸，忽然觉得陆峥寒说得对。</p>\n<p>他一直执念于"补完这张图"，但爷爷说的"画完它"，也许不是让他接着画——而是让他把那座图书馆真正建造出来。</p>\n<p>"峥寒……"</p>\n<p>"嗯？"</p>\n<p>"谢谢你。"</p>\n<p>陆峥寒微微一笑，伸手揽过他的肩膀。</p>\n<p>那天下午，温叙白做了一个决定。</p>\n<p>他拿出一张新的图纸纸，铺在爷爷的原图旁边，开始画。</p>\n<p>不是补完原图，而是一份全新的设计——以爷爷的设计理念为基底，融入他自己的风格和现代建筑语言。</p>\n<p>他画了整整一个下午。</p>\n<p>陆峥寒就坐在旁边，安静地看着。他看不懂建筑图纸，但他看得懂温叙白专注时的侧脸——那种沉浸其中、心无旁骛的样子，比任何时候都好看。</p>\n<p>傍晚时分，温叙白放下笔。</p>\n<p>新图纸完成了。线条比爷爷的原图更现代、更简洁，但核心的设计理念一脉相承。两份图纸并排放在一起，像是跨越了时间的对话。</p>\n<p>"我画完了。"温叙白看着图纸，声音很轻。</p>\n<p>陆峥寒站起来，走到他身边，低头看那份新图纸。</p>\n<p>他不懂建筑，但他能感受到——这份图纸里有温度。</p>\n<p>"叙白，你爷爷一定会很骄傲。"他说。</p>\n<p>温叙白眼眶微热，但他没有让眼泪落下来。他只是轻轻"嗯"了一声，然后侧过头，靠在了陆峥寒肩上。</p>\n<p>陆峥寒伸手环住他，没有说话。</p>\n<p>工作室里很安静，窗外是渐暗的天色和亮起的城市灯火。</p>\n<p>两张图纸并排放在工作台上——一张发黄，一张崭新。</p>\n<p>跨越了十五年的时光，一座梦想中的图书馆终于有了完整的模样。</p>\n<p>那天晚上回家后，陆峥寒趁温叙白洗澡时打了一个电话。</p>\n<p>"林舟，帮我查一下海城老城区有没有待建的社区文化中心项目。"</p>\n<p>"陆总？"</p>\n<p>"找一个合适的选址。我想以温怀瑾先生的名义建一座社区图书馆。"</p>\n<p>电话那头沉默了一秒："陆总，您是说……"</p>\n<p>"叙白爷爷的遗愿是一座完美的社区图书馆。他没画完的图，叙白用新设计完成了。我想把那份设计变成真正的建筑。"</p>\n<p>"……明白了。我马上去查。"</p>\n<p>"这件事先保密。等合适的时机再告诉叙白。"</p>\n<p>"好。"</p>\n<p>挂了电话，陆峥寒站在阳台上，看着远处的城市灯火。</p>\n<p>温叙白从浴室出来时，看到陆峥寒站在阳台上，背影被夜色勾勒出轮廓。</p>\n<p>"你在想什么？"他走过去。</p>\n<p>"在想——"陆峥寒转身，把他拉进怀里，"在想怎么对你好一辈子。"</p>\n<p>"……你每天都在想这个？"</p>\n<p>"嗯。每天。"</p>\n<p>温叙白靠在他怀里，嘴角弯了弯。</p>\n<p>他不知道陆峥寒在策划什么，但他知道——这个人永远不会让他失望。</p>\n<div class="hook">**【本章钩子：温叙白终于用全新的设计完成了爷爷的遗愿，两张图纸跨越十五年的对话温暖而动人。而陆峥寒在暗处启动了一个更大的计划——以温怀瑾之名建一座真正的图书馆。这份深情，温叙白何时才会知晓？】**</div>\n'},
  {title:'第84章 坦白过往，双向治愈', vol:3, html:'<p>爷爷忌日那天，温叙白回了温家老宅。</p>\n<p>陆峥寒陪他一起去的。</p>\n<p>温家老宅在海城老城区的一条安静巷子里，是一栋带院子的二层小楼。院子里的桂花树是温叙白小时候和爷爷一起种的，如今已经长得枝繁叶茂。</p>\n<p>温叙白在爷爷的书房里坐了很久。书房还保持着老人去世时的样子——书架上满是建筑类书籍，书桌上放着老花镜和半干的钢笔。</p>\n<p>陆峥寒站在门口，没有打扰他。</p>\n<p>温叙白从包里取出那份新画的图纸，展开在爷爷的书桌上，和那张未完成的原图并排放在一起。</p>\n<p>"爷爷，我画完了。"他说，声音很轻。</p>\n<p>书房里安静极了，阳光透过窗户洒在两张图纸上。</p>\n<p>温叙白站了很久，然后说："这个人是陆峥寒。他帮我想明白了一件事——您说的\'画完它\'，不是让我接着您的线条画，而是让我用自己的方式建那座图书馆。"</p>\n<p>他停了停："他对我很好。您放心。"</p>\n<p>说完，他把图纸收起来，转身走出书房。</p>\n<p>门口，陆峥寒靠在墙上等他。</p>\n<p>温叙白看着他，忽然说："峥寒，你有没有什么没告诉我的事？"</p>\n<p>陆峥寒一愣："什么？"</p>\n<p>"你总在帮我面对我的过去。"温叙白走近一步，"但你的过去呢？"</p>\n<p>陆峥寒沉默了。</p>\n<p>两人回到院子里，在桂花树下的石凳上坐下。</p>\n<p>"你想知道什么？"陆峥寒问。</p>\n<p>"你为什么蓄谋了七年？"温叙白看着他，"你说七年前看到一座集装箱图书馆，那是城东图书馆。但你一个商界的人，怎么会去看社区图书馆？"</p>\n<p>陆峥寒靠在石凳上，抬头看着桂花树的枝叶，沉默了一会儿。</p>\n<p>"七年前，我二十一岁，刚从国外回来接手陆氏。"他开口了，声音比平时低，"那时候我什么都不懂，被董事会的老狐狸们处处掣肘，压力大到每天失眠。"</p>\n<p>"有一天晚上，我开车经过城东，看到了那座集装箱图书馆。灯光很亮，从那些集装箱的缝隙里透出来。我鬼使神差地停了车，走了进去。"</p>\n<p>"里面很安静，有几个人在看书。灯光设计得特别好——后来我才知道那是你的手笔——那种暖色调的光让人一下子就平静下来了。"</p>\n<p>"我在里面坐了一整夜，什么都没做，就是坐着。那是我回国后第一次睡了个好觉。"</p>\n<p>温叙白静静地听着。</p>\n<p>"后来我查到了设计师的名字——温叙白。"陆峥寒转头看他，"我看了你的资料，看了你的所有作品。然后我就想——我一定要认识这个人。"</p>\n<p>"但你那时候还没有名气，很难接触到。我托了很多人，找了很多关系，但一直没能正式认识你。直到两年前那场商业晚宴——"</p>\n<p>"那场晚宴不是巧合。"陆峥寒看着他，"我让人安排的。"</p>\n<p>温叙白微微睁大了眼。</p>\n<p>"我知道你被邀请了，所以让主办方把我也安排在同一场。"陆峥寒苦笑了一下，"我知道这听起来有点变态——蓄谋了七年才走到你身边。"</p>\n<p>"但叙白——"他握住温叙白的手，"你不知道那座图书馆对我意味着什么。那个晚上，我在最低谷的时候，你的设计给了我一种……安宁。我从来没有在任何人或任何地方得到过那种感觉。"</p>\n<p>"所以我追你，不是因为你好看，不是因为你有名。是因为你设计的空间让我觉得——世界没那么糟。"</p>\n<p>温叙白看着他，眼底有什么东西在缓慢地融化。</p>\n<p>"你之前一直没告诉我这些。"他说。</p>\n<p>"怕你觉得我变态。"</p>\n<p>"……确实有点变态。"</p>\n<p>陆峥寒笑了一下，有些不好意思。</p>\n<p>温叙白看着他，沉默了很久。</p>\n<p>然后他说："但我理解。"</p>\n<p>陆峥寒抬头。</p>\n<p>"城东图书馆——那是我根据爷爷的设计理念做的第一个作品。"温叙白说，"你在最低谷的时候从那座建筑里得到了安宁，而那座建筑的灵魂来自我爷爷。"</p>\n<p>"所以——"他看向陆峥寒，"也许你七年前走进那座图书馆的那一刻，就已经和爷爷的梦想产生了联系。"</p>\n<p>陆峥寒怔住了。</p>\n<p>"你蓄谋了七年，不是变态。"温叙白握紧了他的手，"是命运。"</p>\n<p>院子里，桂花树的叶子在风中沙沙作响。</p>\n<p>两人坐在石凳上，手握着手，各自沉默了很久。</p>\n<p>阳光透过树叶洒下斑驳的光影。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"谢谢你理解我。"</p>\n<p>"嗯。"</p>\n<p>"也谢谢你——让我找到了你。"</p>\n<p>温叙白靠在他肩上，闭上眼。</p>\n<p>两个各自带着伤口的人，在这一刻，终于完全坦诚地面对了彼此。</p>\n<p>双向治愈，不过如此。</p>\n<div class="hook">**【本章钩子：七年蓄谋的真相揭开——不是纠缠，是命运。温叙白的爷爷给了陆峥寒安宁，温叙白的设计给了陆峥寒归宿。两个人、两代人的故事在这一刻交汇。但暗处的商业风云，从未真正停歇……】**</div>\n'},
  {title:'第85章 温父登门，正面交锋', vol:3, html:'<p>爷爷忌日后不久，温叙白的父亲温崇远回国了。</p>\n<p>温崇远回国不是为了忌日——他在国外没能赶回来。他回国是因为听说了另一件事：陆峥寒在海城商界的"手段"。</p>\n<p>温叙白并不知道父亲回国的真正原因。</p>\n<p>那天下午，他正在工作室画图，助理敲门："温老师，有位先生找您。"</p>\n<p>温叙白抬头，看到门口站着的温崇远，手里的笔顿住了。</p>\n<p>"爸？你怎么回来了？"</p>\n<p>温崇远走进来，环顾了一下工作室。他穿着灰色的夹克，头发比上次见面时白了一些，表情严肃。</p>\n<p>"叙白，我们谈谈。"</p>\n<p>温叙白带父亲去了附近的一家茶馆。</p>\n<p>两人落座后，温崇远开门见山："陆峥寒最近和恒盛集团的事，你知道吗？"</p>\n<p>温叙白微微皱眉："知道。已经解决了。"</p>\n<p>"解决了？"温崇远放下茶杯，"叙白，你知不知道陆峥寒怎么\'解决\'的？他把恒盛操纵舆论的证据直接交给了媒体，导致恒盛股价暴跌。这种手段——"</p>\n<p>"爸。"温叙白打断他，"恒盛先动的手。他们试图用施工事故往我头上泼脏水。"</p>\n<p>"我知道。但陆峥寒的反击方式太狠了。他完全可以通过法律途径解决，但他选择用舆论反杀。这种人——"</p>\n<p>"这种人在商界叫\'有手腕\'。"温叙白语气平静但坚定，"爸，你和陆峥寒见过面。你应该知道他是什么人。"</p>\n<p>"正因为见过，我才担心。"温崇远看着儿子，"叙白，你在国外待了那么多年，对国内商界的复杂性了解不够。陆峥寒的手段——"</p>\n<p>"爸。"温叙白第二次打断他，声音更重了一些，"我不是十七岁的孩子了。"</p>\n<p>温崇远看着他，沉默了。</p>\n<p>"你和妈从小就把我送到国外。"温叙白的声音平静，但每个字都有分量，"我一个人在国外待了五年，一个人适应、一个人成长。我十二岁失去爷爷的时候，你们不在。我第一次恐慌发作的时候，你们也不在。"</p>\n<p>"我都知道——"温崇远的声音低了。</p>\n<p>"你知道，但你不在。"温叙白看着他，"我不是在怪你们。你们有你们的追求，我理解。但请不要在缺席了这么多年之后，突然回来质疑我的判断。"</p>\n<p>温崇远张了张嘴，没有说出话。</p>\n<p>"峥寒是什么人，我很清楚。"温叙白说，"他有手腕，但不是坏人。他的手腕是为了保护身边的人——包括我。恒盛的事，他本来想自己扛，是我主动参与的。"</p>\n<p>"他对你好吗？"</p>\n<p>"好。"</p>\n<p>"你确定不是被他的手段迷惑了？"</p>\n<p>温叙白看着父亲，眼底带着一丝无奈："爸，我是建筑师。我看人跟看建筑一样——看结构、看根基、看承重。陆峥寒的根基是稳的。"</p>\n<p>温崇远盯着他看了很久，终于叹了口气。</p>\n<p>"你这孩子……从小就犟。"</p>\n<p>"随你。"</p>\n<p>温崇远苦笑了一下，端起茶杯喝了一口。</p>\n<p>"叙白，我不是反对你和他在一起。"他放下杯子，"我只是担心。你从小就不太会保护自己——"</p>\n<p>"所以现在我有人保护了。"温叙白说，"他比我更会保护我。"</p>\n<p>温崇远看着他，目光复杂。</p>\n<p>"你真的……很喜欢他。"</p>\n<p>温叙白没有回答。但他的沉默本身就是答案。</p>\n<p>温崇远长长地叹了口气："好吧。我回去再跟你妈商量。但叙白——如果有一天他对你不好，你要告诉我。"</p>\n<p>"不会有一天。"</p>\n<p>"万一呢？"</p>\n<p>温叙白看着父亲，忽然笑了——那种清冷面容上难得的、温暖的笑。</p>\n<p>"那就再说万一的事吧。"</p>\n<p>温崇远看着儿子的笑容，心里五味杂陈。他的儿子长大了，有了自己要守护的人，不再是那个在角落里独自搭积木的孩子了。</p>\n<p>走出茶馆时，温叙白看到陆峥寒的车停在路边。</p>\n<p>陆峥寒靠在车门上，看到他出来，迎了上去。</p>\n<p>"叙白——"他看了一眼温崇远。</p>\n<p>温崇远也看着他。</p>\n<p>两人对视了几秒。</p>\n<p>"温叔叔。"陆峥寒微微点头。</p>\n<p>温崇远看着他，沉默了一会儿，然后说了一句让两人都意外的话："陆峥寒，叙白刚才替你说了很多话。但我还是想自己跟你说——"</p>\n<p>他把陆峥寒拉到一边，温叙白没有跟过去，只是站在原地看着。</p>\n<p>"我不知道你们之间具体发生了什么。"温崇远低声说，"但叙白是我儿子。他这辈子从来没有为任何人说过这么多话——包括我这个父亲。"</p>\n<p>陆峥寒没有说话。</p>\n<p>"所以不管你用了什么手段——如果你辜负他，我不会放过你。"</p>\n<p>"叔叔。"陆峥寒看着他，语气郑重，"我这辈子做过最对的事，就是走进那座图书馆。我不会辜负他。"</p>\n<p>温崇远看着他，半晌，点了点头。</p>\n<p>转身离开前，他回头说了一句："下周来家里吃饭。你妈想见你。"</p>\n<div class="hook">**【本章钩子：温父回国质问，父子之间关于信任与缺席的交锋。温叙白罕见地为陆峥寒正名——"我看人跟看建筑一样，看根基"。而温父从质疑到默许，下周的家宴将是最后的家庭考验……】**</div>\n'},
  {title:'第86章 陆峥寒表态，霸气护人', vol:3, html:'<p>温崇远回国后不到三天，又有人上门了。</p>\n<p>不是来找温叙白的——是来找陆峥寒的。</p>\n<p>来人是陆峥寒的大伯，陆承业。</p>\n<p>陆承业是陆峥寒父亲的大哥，在陆氏集团持有少量股份，但一直对集团的实际控制权有觊觎之心。陆老夫人健在时，他不敢明着来；但自从陆峥寒公开了和温叙白的关系后，他觉得找到了突破口。</p>\n<p>那天上午，陆承业没有预约，直接来了陆氏总部。</p>\n<p>林舟拦不住——毕竟是陆家人。</p>\n<p>"大伯。"陆峥寒坐在办公桌后，看到陆承业进来，面色不变。</p>\n<p>"峥寒啊。"陆承业坐到对面，脸上带着笑，"你公开恋爱的事，大伯都看到了。年轻人嘛，谈恋爱正常。"</p>\n<p>"大伯有什么事？"</p>\n<p>"也没什么大事。"陆承业喝了口茶，"就是有些担心。你是陆氏的掌舵人，公开和男人在一起——怎么说呢，董事会的老人们有些想法。"</p>\n<p>"什么想法？"</p>\n<p>"觉得你不够稳重。而且——"陆承业放下茶杯，"温叙白虽然是建筑设计师，但他的家庭背景——"</p>\n<p>"大伯。"陆峥寒打断他，声音不高，但带着不容置疑的冷意，"你想说什么，直接说。"</p>\n<p>陆承业脸上的笑收了收："峥寒，大伯是为你好。陆氏这么大一个摊子，你作为掌舵人，个人形象很重要。你和温叙白的关系——说难听点，影响不好。"</p>\n<p>"影响什么了？"陆峥寒靠在椅背上，目光锐利，"股价跌了吗？业绩降了吗？合作伙伴跑了吗？"</p>\n<p>陆承业被问得噎了一下。</p>\n<p>"都没有。"陆峥寒说，"自从公开以来，陆氏股价涨了3.2%，滨水项目的社会评价提升了一个档次，合作方对我们的透明度更加信任。大伯，你说的\'影响不好\'，具体是指什么？"</p>\n<p>陆承业脸色变了变："峥寒，你别跟我绕。我是说——你和一个男人在一起，传出去——"</p>\n<p>"传出去怎么了？"陆峥寒站起来，走到落地窗前，背对着陆承业，"大伯，你是来替董事会传话，还是自己来的？"</p>\n<p>陆承业沉默了。</p>\n<p>"你自己来的。"陆峥寒转过身，"因为董事会没有人对此有意见。业绩摆在那里，没有人会拿我的私生活说事。"</p>\n<p>"大伯，你真正担心的不是我的形象——你担心的是我公开关系后，人气和声望更高了，你更没有机会插手集团事务。"</p>\n<p>陆承业脸色铁青："你——"</p>\n<p>"我给你一个忠告。"陆峥寒走回办公桌前，双手撑在桌面上，居高临下地看着他，"不要打叙白的主意，不要拿他的家庭说事。如果你想在董事会提这件事，我奉陪。但我可以告诉你结果——你手里的那点股份，不够你折腾。"</p>\n<p>陆承业站起来，脸色很难看："陆峥寒，你别太嚣张。"</p>\n<p>"嚣张？"陆峥寒笑了，那种笑容冷得让人后背发凉，"大伯，我对你已经很客气了。你要是敢碰叙白一根手指——"</p>\n<p>他没有说完，但办公室里的温度骤降了几度。</p>\n<p>陆承业盯着他看了几秒，转身走了。</p>\n<p>门关上后，林舟从侧门走进来："陆总——"</p>\n<p>"盯着大伯。"陆峥寒坐回椅子上，揉了揉眉心，"他来找我，背后一定有人撺掇。查清楚。"</p>\n<p>"是。"</p>\n<p>"还有——"陆峥寒顿了顿，"叙白那边不要让他知道。"</p>\n<p>"陆总，温先生上次说过——"</p>\n<p>"我知道。"陆峥寒苦笑了一下，"但这件事不一样。大伯冲着叙白来的，如果让他知道，他一定会自责——觉得是因为他才导致我和家族的人闹翻。"</p>\n<p>"可您上次答应过温先生不瞒他……"</p>\n<p>陆峥寒沉默了一会儿。</p>\n<p>"你说得对。"他拿起手机，"我给他发消息。"</p>\n<p>他打了一行字：【叙白，大伯来找我麻烦了。不是大事，我已经处理了。跟你说一声，免得你从别人那里听到。】</p>\n<p>发完，他把手机放下。</p>\n<p>三分钟后，温叙白回复了：【什么麻烦？】</p>\n<p>【就是拿我们的关系说事，被我怼回去了。】</p>\n<p>【他具体说了什么？】</p>\n<p>陆峥寒犹豫了一下，还是如实说了：【他说你的家庭背景不够好。】</p>\n<p>对面沉默了五分钟。</p>\n<p>然后温叙白发了一条：【晚上回家谈。】</p>\n<p>陆峥寒看着这四个字，心里微微一紧。</p>\n<p>晚上回到家，温叙白已经在厨房了——难得，他几乎不做饭。</p>\n<p>"叙白？"</p>\n<p>"你在客厅等着。"温叙白头也不回。</p>\n<p>陆峥寒站在厨房门口，看着他笨拙地切菜、烧水、下面条。</p>\n<p>十分钟后，两碗清汤面端上了桌。</p>\n<p>卖相一般，面条有点软，葱花切得大小不一。但陆峥寒吃了第一口，眼眶微微热了。</p>\n<p>"好吃。"他说。</p>\n<p>"难吃你就直说。"温叙白自己吃了一口，皱眉。</p>\n<p>"真的好吃。"陆峥寒看着他，"叙白，你是不是因为大伯的事——"</p>\n<p>"我听林舟说了。"温叙白打断他，"你让他查你大伯背后的推手，他不小心发错消息到我手机上了。"</p>\n<p>陆峥寒："……"</p>\n<p>"你是不是又想说\'不想让我知道\'？"温叙白放下筷子，看着他。</p>\n<p>"……是。"</p>\n<p>"陆峥寒。"温叙白语气清冷但认真，"你大伯拿我的家庭说事，针对的是我。我有权利知道，也有权利参与解决。"</p>\n<p>"但他实际上是冲我来的——"</p>\n<p>"冲你来的，原因是我。"温叙白看着他，"所以这也是我的事。"</p>\n<p>陆峥寒看着他，半晌，叹了口气："好。以后真的不瞒了。"</p>\n<p>"嗯。"温叙白拿起筷子继续吃面，"这面确实不太好吃。"</p>\n<p>"我喜欢。"</p>\n<p>"……你的味觉有问题。"</p>\n<p>陆峥寒笑了，低头吃面。</p>\n<p>窗外夜色温柔，室内灯光温暖。</p>\n<p>一碗不太好吃的面，胜过千言万语。</p>\n<div class="hook">**【本章钩子：大伯陆承业上门挑衅，被陆峥寒霸气怼回。但温叙白坚持不愿被保护在温室里——"这也是我的事"。一碗不太好吃的面，是温叙白无声的表态。家族内部的暗斗，即将迎来最终清算……】**</div>\n'},
  {title:'第87章 温母心软，家庭破冰', vol:3, html:'<p>温崇远回国后和妻子苏敏华商量了很多。</p>\n<p>苏敏华在国外时就对陆峥寒印象不错——那次见面时，陆峥寒对温叙白小时候照片的反应、他说的"不是为了新鲜，是为了余生"，都让她动容。</p>\n<p>但温崇远的担忧也有道理——他是学者，一辈子在象牙塔里，对商界的尔虞我诈天然排斥。他不希望儿子陷入那种环境。</p>\n<p>"你爸还是很担心。"苏敏华在视频电话里对温叙白说。</p>\n<p>"我知道。"</p>\n<p>"他不是反对你，叙白。他是怕你受伤。"</p>\n<p>温叙白沉默了一会儿："妈，我理解爸的担心。但有些事，只有自己经历了才知道值不值得。"</p>\n<p>苏敏华看着他，叹了口气："你下周带峥寒来家里吃饭吧。你爸想再跟他聊聊。"</p>\n<p>"好。"</p>\n<p>一周后，陆峥寒第二次来到温家老宅。</p>\n<p>这次气氛没有上次那么紧张——温崇远虽然还是板着脸，但至少没有把人晾在书房里。</p>\n<p>苏敏华做了一桌子菜，特意做了温叙白爱吃的红烧鱼和桂花糕。</p>\n<p>饭桌上，温崇远一直在观察陆峥寒。</p>\n<p>他注意到几个细节：陆峥寒会自然地给温叙白夹菜，记住他不吃香菜；温叙白杯子里水没了，陆峥寒会不动声色地给他添上；两人之间不需要多余的语言，一个眼神就知道对方要什么。</p>\n<p>这些细节，是装不出来的。</p>\n<p>饭后，温崇远把陆峥寒叫到了院子里。</p>\n<p>温叙白想跟过去，被苏敏华拉住了："让他们聊。"</p>\n<p>院子里，温崇远站在桂花树下，背对着陆峥寒。</p>\n<p>"上次你走后，我查了很多关于你的资料。"温崇远开口，"你的商业手段、你和恒盛的交锋、你在陆氏的改革——"</p>\n<p>"叔叔想了解我，随时可以问我。"陆峥寒说。</p>\n<p>"我问你一个问题。"温崇远转过身，"你用舆论反杀恒盛的时候，有没有想过——如果将来有一天，你和叙白闹翻了，你会不会用同样的手段对他？"</p>\n<p>陆峥寒的表情没有任何变化。</p>\n<p>"不会。"</p>\n<p>"为什么？"</p>\n<p>"因为恒盛是对手，叙白是家人。"陆峥寒看着他，"我对对手的手段和对家人的温柔，是两套完全不同的系统。叔叔，您是学者，您应该理解——一个人可以同时是严谨的学者和温和的父亲。"</p>\n<p>温崇远微微一愣。</p>\n<p>"我在商界是陆总，在家里是峥寒。"陆峥寒继续说，"商界的手段是为了保护陆氏、保护身边的人。但我永远不会把那种手段用在叙白身上——因为他不是对手，他是我的归处。"</p>\n<p>温崇远看着他，目光审视了很久。</p>\n<p>"你说他是你的归处。"温崇远重复了一遍，"一个二十八岁的年轻人，说\'归处\'——你确定你懂这个词的分量？"</p>\n<p>"我懂。"陆峥寒认真地说，"七年前我在最低谷的时候，走进了他设计的图书馆，从那一刻起，我就知道——这个人会是我的归处。"</p>\n<p>"所以我蓄谋了七年。不是为了得到他，是为了成为配得上他的人。"</p>\n<p>院子里安静了。</p>\n<p>桂花树的叶子在风中沙沙作响。</p>\n<p>温崇远看着眼前这个年轻人——他的眼神真诚、语气笃定，没有半分浮夸。</p>\n<p>"叔叔，我知道您担心叙白。"陆峥寒说，"他从小缺少陪伴，十二岁失去了最重要的人。这些我都了解，也都在乎。我不敢说我能弥补那些缺失，但我会用余生让他知道——他不是一个人。"</p>\n<p>温崇远沉默了很久。</p>\n<p>然后他做了一件出乎意料的事——他拍了拍陆峥寒的肩膀，力道不轻不重。</p>\n<p>"你这孩子。"他说，语气里的尖锐消退了大半，"比我想的要靠谱。"</p>\n<p>陆峥寒微微一愣。</p>\n<p>"但我的警告不变。"温崇远补了一句，"辜负他，我不会放过你。"</p>\n<p>"不会有机会的。"</p>\n<p>两人走回屋里时，苏敏华正在和温叙白说话。</p>\n<p>看到两人从院子里出来，气氛明显比之前缓和了，苏敏华心里松了口气。</p>\n<p>"峥寒啊，"她笑着说，"以后周末有空就来家里吃饭。你叔叔话多，但心不坏。"</p>\n<p>"妈！"温崇远皱眉。</p>\n<p>陆峥寒笑了笑："好，谢谢阿姨。"</p>\n<p>温叙白站在一旁，看着父亲和陆峥寒之间微妙的变化，嘴角弯了弯。</p>\n<p>临走时，苏敏华塞给陆峥寒一盒桂花糕："你自己做的？"</p>\n<p>"周伯教我的。"陆峥寒说，"叙白喜欢吃，我学了好几次。"</p>\n<p>苏敏华笑了："你自己做的比外面买的好吃？"</p>\n<p>"叙白说差不多。"</p>\n<p>"那就不差了。"苏敏华笑着看他，"叙白说你做的饭好吃。我这辈子没听他夸过谁做饭好吃。"</p>\n<p>陆峥寒笑了，转头看了一眼温叙白——温叙白站在车旁，假装看手机，耳尖微红。</p>\n<p>回程的车上，温叙白忽然说："我妈给你桂花糕了？"</p>\n<p>"嗯。"</p>\n<p>"她很少给别人。"</p>\n<p>"那我很荣幸。"</p>\n<p>温叙白没有说话，但手指在膝盖上轻轻敲了两下——这是他心情好的表现。</p>\n<p>陆峥寒看在眼里，没有说话，只是笑了。</p>\n<p>家庭的坚冰，正在一点一点融化。</p>\n<div class="hook">**【本章钩子：温父的最终考验——"你会不会用同样的手段对叙白？"陆峥寒的回答掷地有声。从质疑到默许，从审视到接纳，两个家庭的祝福终于齐全。但商业暗线从未停歇，恒盛的"换一种方式"即将浮出水面……】**</div>\n'},
  {title:'第88章 圈层宴会，公开秀恩爱', vol:3, html:'<p>官宣后第一个大型社交场合——海城商会年度晚宴。</p>\n<p>这是海城商界每年最隆重的聚会，所有有头有脸的企业家都会出席。陆峥寒每年必到，温叙白以前从不参加这类活动——但今年不同了。</p>\n<p>"你确定要一起去？"出发前，陆峥寒确认了一遍。</p>\n<p>"确定。"温叙白在镜子前整理领口。</p>\n<p>"会有很多人看我们。"</p>\n<p>"看就看。"</p>\n<p>"可能会有不友好的声音。"</p>\n<p>"峥寒。"温叙白转过身，看着他，"你公开的时候说过——\'不需要藏着掖着\'。这句话对你适用，对我同样适用。"</p>\n<p>陆峥寒笑了，走上前帮他理了理领口："走吧。"</p>\n<p>到达晚宴酒店时，门口停满了豪车。陆峥寒的车停下，他先下车，然后绕到另一侧打开车门，伸手。</p>\n<p>温叙白搭着他的手下车，两人并肩走进酒店大门。</p>\n<p>他们的出现像一颗石子投入水面，大厅里的视线瞬间汇聚过来。</p>\n<p>陆峥寒穿着黑色定制西装，气场冷冽而强势。温叙白穿着白色衬衫配深灰色西装裤，清冷如霜。</p>\n<p>两人并肩走进来，步伐一致，气场交融。</p>\n<p>"陆总好。""温先生好。"——打招呼的声音此起彼伏。</p>\n<p>陆峥寒微微点头回应，温叙白面无表情，但姿态从容。</p>\n<p>晚宴开始后，两人被安排在主桌。同桌的有商会会长、几位知名企业家及其伴侣。</p>\n<p>"陆总，温先生，你们的官宣我看到了。"商会会长笑着说，"恭喜。"</p>\n<p>"谢谢。"陆峥寒应道。</p>\n<p>"温先生，滨水文化中心的项目我也关注了，非常出色。"会长转向温叙白。</p>\n<p>"谢谢。"温叙白说。</p>\n<p>席间，有人试图试探："陆总，公开关系后，对陆氏的股价有没有影响？"</p>\n<p>"涨了3.2%。"陆峥寒淡淡地说。</p>\n<p>那人讪讪地笑了，不再追问。</p>\n<p>也有人直接问温叙白："温先生，您和陆总在一起，会不会影响您的设计工作？比如有人会说您接项目靠关系？"</p>\n<p>温叙白放下筷子，看向那人，清冷的目光不带半分情绪："我的每一个项目都有公开的评审流程和第三方评估。如果你有兴趣，我可以把滨水项目的全部评审资料发给你看。"</p>\n<p>那人被噎了一下，连忙摆手："不用不用，随便问问。"</p>\n<p>陆峥寒在旁边看了温叙白一眼，嘴角微弯——他最喜欢温叙白这种不卑不亢的样子。</p>\n<p>晚宴过半，有乐队开始演奏。陆峥寒站起来，向温叙白伸出手。</p>\n<p>"跳一支舞？"</p>\n<p>温叙白看着他伸出的手，微皱眉："我不太会跳舞。"</p>\n<p>"我带你。"</p>\n<p>温叙白犹豫了一秒，把手放了上去。</p>\n<p>两人走到舞池中央。</p>\n<p>灯光暗了下来，音乐是一首舒缓的华尔兹。</p>\n<p>陆峥寒一手揽住温叙白的腰，一手握着他的手，带着他慢慢移动。</p>\n<p>温叙白确实不太会跳舞，脚步有些生硬，但陆峥寒的引导很稳，让他的紧张慢慢消散了。</p>\n<p>"放松。"陆峥寒低声说，"只有我们。"</p>\n<p>温叙白抬头看他。灯光下，陆峥寒的眼睛很亮，带着只有在看他时才会出现的温柔。</p>\n<p>周围的人群、窃窃私语、打量的目光——在这一刻都退远了。</p>\n<p>温叙白深吸一口气，放松了身体，跟着陆峥寒的节奏移动。</p>\n<p>两人慢慢旋转着，配合越来越默契。</p>\n<p>有人拿出手机拍照，有人窃窃私语，但舞池中央的两人浑然不觉。</p>\n<p>一曲终了，陆峥寒没有松手，低头在温叙白耳边说："跳得很好。"</p>\n<p>"你带得好。"</p>\n<p>"那以后多跳跳？"</p>\n<p>"……再说。"</p>\n<p>陆峥寒笑了，松开手，但手指自然地滑下来，手指交缠。</p>\n<p>两人牵着手走回座位，在所有人的注视下，坦然自若。</p>\n<p>晚宴结束后，两人在酒店门口等车。</p>\n<p>"今天表现不错。"陆峥寒说。</p>\n<p>"什么表现？"</p>\n<p>"全场最耀眼。"陆峥寒看着他，"当然，你每天都是。"</p>\n<p>温叙白偏过头，耳尖在夜色中微微发红。</p>\n<p>"回家了。"他说。</p>\n<p>"好。"</p>\n<p>车来了，两人上车，驶入夜色。</p>\n<p>后视镜里，酒店的灯火渐渐远去。</p>\n<p>这个夜晚，属于他们。</p>\n<div class="hook">**【本章钩子：商会晚宴上的公开亮相——一支舞、十指相扣、从容应对一切质疑。温叙白在公众面前展现出的不卑不亢，和舞池里微微紧张的反差，让全网再度沸腾。但旧人的回归，即将打破这份平静……】**</div>\n'},
  {title:'第89章 旧人再现，沈知予回归', vol:3, html:'<p>沈知予回来了。</p>\n<p>这个消息是陆瑶告诉温叙白的。</p>\n<p>那天下午，温叙白在工作室接到了陆瑶的电话。</p>\n<p>"叙白哥，我跟你说个事——沈知予回海城了。"</p>\n<p>温叙白手里的笔顿了一下。</p>\n<p>"他怎么回来的？"</p>\n<p>"听说他在国外的事业不太顺利，建筑设计公司经营不善，关门了。他上个月回的海城，好像在重新找工作。"陆瑶语气里带着一丝复杂，"我哥还不知道。"</p>\n<p>"峥寒不知道？"</p>\n<p>"嗯。我怕他知道了多想，所以先跟你说。"</p>\n<p>温叙白沉默了一会儿："谢谢你告诉我。"</p>\n<p>"叙白哥，你不担心吗？"</p>\n<p>"担心什么？"</p>\n<p>"沈知予以前——"</p>\n<p>"以前的事已经过去了。"温叙白语气平静，"他回来是他的事，跟我们没关系。"</p>\n<p>挂了电话，温叙白继续画图。</p>\n<p>但如果真的"没关系"，他不会在接到电话后停了整整五秒。</p>\n<p>三天后，温叙白在一个行业交流会上遇到了沈知予。</p>\n<p>沈知予比两年前消瘦了不少，下颌线更锐利了，穿着不再像以前那么讲究——但那双眼睛里的东西，温叙白很熟悉。是那种看到他就控制不住的炽热。</p>\n<p>"叙白。"沈知予走过来，语气比以前平和了很多，"好久不见。"</p>\n<p>"好久不见。"温叙白点头。</p>\n<p>"你……和陆峥寒在一起了。"沈知予说，"我看到了。"</p>\n<p>"嗯。"</p>\n<p>沈知予看着他，苦笑了一下："我一直觉得，如果你选的人不是我，那一定是比我好很多的人。陆峥寒——确实比我好。"</p>\n<p>温叙白看着他，没有接话。</p>\n<p>"叙白，我今天来不是纠缠你的。"沈知予认真地说，"我在国外这两年，想了很多。以前我做的那些事——在峰会上当众摊牌、试图用证据逼你表态——那是错的。我不该用那种方式对你。"</p>\n<p>"你知道就好。"</p>\n<p>"我想当面跟你道歉。"沈知予微微低头，"对不起。"</p>\n<p>温叙白看着他，沉默了几秒。</p>\n<p>"沈知予，我不需要你的道歉。"他说，"但我接受。"</p>\n<p>沈知予抬头，眼里有微微的光。</p>\n<p>"你过得好就行。"温叙白说，"以后——各自安好。"</p>\n<p>沈知予点了点头，笑了一下。那个笑容里有释然，也有遗憾。</p>\n<p>"叙白，你知道吗？"他说，"我第一次见到你的时候，你在大三的设计课上画了一张图书馆的图纸。教授说那张图是他教过最好的学生作业。我当时就想——这个人，我一定要认识。"</p>\n<p>温叙白微怔——他不知道沈知予还记得那么久以前的事。</p>\n<p>"但我走错了路。"沈知予说，"我以为用占有和证明就能得到你。但感情不是建筑——不能靠图纸和计算来建造。"</p>\n<p>"叙白，你值得现在的幸福。"他说完，转身走了。</p>\n<p>温叙白站在原地，看着他的背影消失在人群中。</p>\n<p>晚上回家，温叙白把遇到沈知予的事告诉了陆峥寒。</p>\n<p>陆峥寒听完，表情没什么变化，但握筷子的手微微紧了紧。</p>\n<p>"他跟你道歉了？"</p>\n<p>"嗯。"</p>\n<p>"你接受了吗？"</p>\n<p>"接受了。"</p>\n<p>陆峥寒沉默了几秒，然后说："叙白，你跟我说这些，是怕我吃醋？"</p>\n<p>"不是怕你吃醋。是不想瞒你。"</p>\n<p>陆峥寒看着他，忽然笑了："你学乖了。"</p>\n<p>"我一直很乖。"</p>\n<p>"你以前从来不会主动说这些。"</p>\n<p>温叙白看了他一眼，没有反驳。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"沈知予说了一句话——\'感情不是建筑，不能靠图纸和计算来建造\'。"温叙白看着他，"他说得对。感情不是计算出来的。"</p>\n<p>"所以呢？"</p>\n<p>"所以——"温叙白低下眼，声音比平时轻了很多，"我们之间的感情不是你蓄谋了七年就能算出来的。是因为你走进了我的生活，一点一点地，让我愿意为你打开门。"</p>\n<p>陆峥寒看着他，眼眶微微发热。</p>\n<p>"叙白——"</p>\n<p>"所以我不会因为沈知予的道歉就动摇。"温叙白抬头看他，清冷的眼底笃定而温柔，"因为开门这件事，只有你能做到。"</p>\n<p>陆峥寒放下筷子，站起来，走到他面前，弯腰抱住了他。</p>\n<p>"谢谢你告诉我这些。"他说，声音有些哑。</p>\n<p>"嗯。"</p>\n<p>"也谢谢你——选择了我。"</p>\n<p>温叙白靠在他怀里，闭上眼。</p>\n<p>旧人的回归没有带来波澜，反而成了他们之间信任的又一次确认。</p>\n<p>有些门一旦打开，就再也不会关上。</p>\n<div class="hook">**【本章钩子：沈知予回归，带来迟到的道歉和释然。温叙白用一句"开门这件事，只有你能做到"让陆峥寒彻底安心。旧情敌退场，但新的暗线正在酝酿——恒盛"换一种方式"的威胁，即将以最意想不到的形式出现……】**</div>\n'},
  {title:'第90章 沈知予释然，真心祝福', vol:3, html:'<p>沈知予回海城后的第二周，做了一件出乎所有人意料的事。</p>\n<p>他在个人微博上发了一条长文。</p>\n<p>标题是：《关于叙白，关于陆峥寒，关于我自己》。</p>\n<p>全文不长，但字字真诚。</p>\n<p>"很多人认识我，是因为两年前那场建筑峰会上的闹剧。那是我做过最蠢的事——在公开场合用所谓的\'证据\'试图拆散两个人。今天我想说：那是我错了。</p>\n<p>叙白是我喜欢了很多年的人。我一度以为，只要证明陆峥寒\'<span class="annot" data-tip="指事情谋划了很久，多含贬义，但此处指陆峥寒对温叙白的长久心意">蓄谋已久</span>\'，叙白就会远离他。但我错了。叙白不是一个会被证据左右的人——他有他自己的判断。</p>\n<p>后来在国外两年，我想了很多。我终于明白了一件事：喜欢一个人，不是占有，不是证明，更不是用手段拆散。喜欢一个人，是希望他过得好。</p>\n<p>叙白和陆峥寒在一起，是我见过他最松弛、最温暖的样子。那个从前在课堂上独来独往的清冷少年，现在会笑了，会主动靠近人了，会在公开场合跳舞了。这些都是陆峥寒给他的。</p>\n<p>我给不了。</p>\n<p>所以——叙白，陆峥寒，祝你们幸福。真心地。</p>\n<p>这是我欠你们的道歉，也是我给自己的释然。</p>\n<p>——沈知予"</p>\n<p>这条微博发出后，很快上了热搜。</p>\n<p>#沈知予道歉# #沈知予释然# #温叙白沈知予# ——几个话题同时冲上热搜榜。</p>\n<p>评论区里，舆论出人意料地温和。</p>\n<p>"能说出这些话，说明他真的放下了。"</p>\n<p>"其实沈知予也不坏，只是用错了方式。"</p>\n<p>"看到\'我给不了\'那句，有点心酸。"</p>\n<p>"祝大家都好吧。叙白和陆峥寒是真的配。"</p>\n<p>温叙白是在工作室刷到这条微博的。</p>\n<p>他看了一遍，没有评论，没有转发，只是退出微博，继续画图。</p>\n<p>但他把那条微博截了图，存在了手机里。</p>\n<p>晚上回家，陆峥寒也看到了。</p>\n<p>"你看了？"温叙白问。</p>\n<p>"看了。"陆峥寒靠在沙发上，手机放在一边，"他写得不错。"</p>\n<p>"你不吃醋？"</p>\n<p>"叙白，你今天主动问我吃不吃醋的次数已经超过你以前一年的总量了。"</p>\n<p>温叙白看了他一眼。</p>\n<p>"不吃醋。"陆峥寒认真地说，"因为他说的话，让我更加确定一件事——你跟我在一起之后，变得更好了。这不是我的功劳，是因为你愿意为我改变。"</p>\n<p>温叙白看着他，沉默了几秒。</p>\n<p>"你也有功劳。"他说。</p>\n<p>"嗯？"</p>\n<p>"如果不是你，我不会想改变。"</p>\n<p>陆峥寒笑了，那种笑容带着从心底溢出来的满足。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"我想做一件事。"</p>\n<p>"什么？"</p>\n<p>陆峥寒拿出手机，打开微博，发了一条动态。</p>\n<p>配图是他在家做饭的照片——灶台上冒着热气，锅里是红烧排骨，旁边放着温叙白常用的那只白瓷杯。</p>\n<p>配文：【@沈知予 谢谢你的祝福。叙白我会照顾好，你也要好好的。】</p>\n<p>发完，他放下手机，对温叙白说："做饭了，来帮忙。"</p>\n<p>温叙白看着那条微博，愣了两秒。</p>\n<p>"你回复他了？"</p>\n<p>"嗯。大度一点。"</p>\n<p>温叙白看着他的微博，嘴角弯了弯——这个在商界<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>的霸总，在家里系着围裙做饭，还公开回复前任情敌的道歉。</p>\n<p>这种反差，大概只有陆峥寒能做到。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你今天表现不错。"</p>\n<p>"什么表现？"</p>\n<p>"大度。"</p>\n<p>陆峥寒笑出了声，拉着他进了厨房。</p>\n<p>两人一起做饭——陆峥寒掌勺，温叙白递调料。</p>\n<p>盐、酱油、糖。</p>\n<p>一切如常。</p>\n<p>窗外的城市灯火和室内的烟火气交织在一起，编织成他们平凡而温暖的日常。</p>\n<p>沈知予的故事到此结束。不是败退，是释然。</p>\n<p>而温叙白和陆峥寒的故事，还在继续。</p>\n<div class="hook">**【本章钩子：沈知予公开发文道歉释然，陆峥寒霸气回复"叙白我会照顾好"。旧情敌的退场体面而温暖，但故事远未结束——恒盛的暗线、大伯的阴谋、以及陆峥寒暗中筹备的惊喜，都将在接下来的篇章中集中爆发……】**</div>\n'},
  {title:'第91章 暗中使绊，商业间谍', vol:3, html:'<p>恒盛集团果然"换了一种方式"。</p>\n<p>这一次，赵恒没有用舆论。他用了更隐蔽的手段——商业间谍。</p>\n<p>但这个决定并不是他轻易做出的。</p>\n<p>舆论那招失败后，赵恒在家里独自坐了一整晚。桌上摊着恒盛最近三年的财报——营收下滑，几个核心项目被陆氏截胡，银行授信额度缩了两成。恒盛的状况比外界看到的要差得多。</p>\n<p>他知道钱明远说的"机会"并不只是针对陆氏，更是恒盛自己的续命药——如果能拿到温叙白的设计方案，恒盛在滨水二期招标中就有真正的竞争筹码。</p>\n<p>但商业间谍这个字眼太重了。</p>\n<p>"你确定？"那天下午赵恒把钱明远叫到私人会所，关上门问。</p>\n<p>"赵总，上次舆论那招失败，说明正面进攻行不通。"钱明远语气一如既往地平稳，"我们需要的是信息——知道温叙白的设计方向、结构方案、材料选型，才能在招标时有的放矢。"</p>\n<p>"你说的那些东西，正常渠道也能拿到一部分。"</p>\n<p>"一部分不够。"钱明远摘下眼镜擦了擦，"赵总，恒盛等不起\'正常渠道\'了。"</p>\n<p>这句话戳中了赵恒的软肋。</p>\n<p>他沉默了很久，最终说了一个字："做。"</p>\n<p>钱明远没有立刻走，犹豫了一下说："赵总，还有一件事——这次万一出了问题，我建议您把所有指令都通过口头传达，不留任何文字记录。"</p>\n<p>赵恒看着他，忽然笑了一声："钱明远，你倒是比我想得周到。"</p>\n<p>"我在陆氏待过五年，知道陆峥寒做事的方式。"钱明远重新戴上眼镜，"他不会放过任何痕迹。"</p>\n<p>赵恒脸上的笑意淡了下去。他想起了父亲赵德厚晚年常说的话——"陆家人狠，不是狠在手段上，是狠在耐心上。他们能等，等你犯错，然后一击致命。"</p>\n<p>老爹说得没错。上一次舆论攻势，陆峥寒连面都没露，只让林舟出面就摆平了。这次如果再失败……</p>\n<p>赵恒甩了甩头，把那个念头压下去。</p>\n<p>不会失败的。钱明远找的人很专业，温叙白工作室的安保也谈不上严密。拿一份设计文件而已，天衣无缝。</p>\n<p>——他不知道的是，温叙白虽然安保不严密，但有一个比任何安防系统都麻烦的习惯：强迫症。</p>\n<p>温叙白每周五下午雷打不动要核对一次工作电脑的文件目录树。不是为了查毒，不是为了防黑——纯粹是因为他受不了文件夹结构有任何他不记得的东西。这个习惯从大学时代就有了，他的同学曾经开玩笑说温叙白的电脑比手术室还干净。</p>\n<p>那天是周五。</p>\n<p>温叙白打开资源管理器，从C盘一路点到D盘的设计文件目录。一切正常——文件夹结构、文件命名规则、修改日期，都在他脑子里有对应的记忆。</p>\n<p>直到他点开系统临时文件夹。</p>\n<p>通常这个文件夹里只有一些缓存碎片，他扫一眼就关掉。但今天他的目光停在了一个名为"syscache.tmp"的文件上。</p>\n<p>他不记得这个文件。</p>\n<p>温叙白不是IT专家，但他的强迫症有一个好处：他对"不该出现的东西"有近乎病态的敏感。他不会打开这个文件——因为他不知道它是什么，而他从不碰他不确定的东西。</p>\n<p>他叫来了工作室的IT技术人员。</p>\n<p>"这个文件是什么？"他指着屏幕。</p>\n<p>IT技术人员看了一眼，表情轻松："温老师，这是系统缓存文件，正常的，每个电脑都有。"</p>\n<p>温叙白没动。</p>\n<p>IT技术人员愣了一下，重新看了看文件属性："……等一下。"</p>\n<p>他调出了文件信息，脸色慢慢变了。</p>\n<p>"温老师，这个文件……不太对。正常系统缓存文件的大小不会超过2MB，这个有47MB。而且它的创建时间是凌晨三点——那时候没人用您的电脑。"</p>\n<p>"能确定是什么吗？"</p>\n<p>"我需要进一步检查，但如果我没猜错的话——"IT技术人员咽了口唾沫，"这可能是某种数据复制程序。它会伪装成系统文件，在后台自动复制电脑里的文件并发送到外部服务器。"</p>\n<p>温叙白目光微沉。</p>\n<p>他没有声张，而是做了两件事：第一，让IT技术人员把这台电脑断网但不要关机，保留所有运行状态；第二，打电话给陆峥寒。</p>\n<p>"峥寒，我工作室电脑里可能被人植入了数据窃取程序。"</p>\n<p>电话那头沉默了两秒："你人没事？"</p>\n<p>"没事。是远程窃取，不是现场破坏。但我不确定它已经运行了多久——我上次检查文件目录是上周五，但这个程序的创建时间是两周前。"</p>\n<p>"也就是说，它可能已经运行了两个星期。"</p>\n<p>"对。"温叙白语气依然平静，但陆峥寒听出了他话里压着的情绪——不是恐惧，是愤怒。温叙白很少愤怒，但有人在他的电脑里、他的工具里、他最信任的东西里偷偷植入窃贼——这触碰了他最底线的洁癖。</p>\n<p>"我马上过来。"</p>\n<p>四十分钟后，陆峥寒到了工作室，身后跟着林舟和陆氏的网络安全团队。</p>\n<p>安全团队对温叙白的电脑进行了全面检查，结论令人震惊：这个窃取程序不仅针对设计文件，还能自动扫描邮件和通讯记录。程序的技术水平相当高——用的是定制化框架，市面上找不到现成的查杀工具，一般的杀毒软件根本检测不到。</p>\n<p>"这是一个专业级别的商业间谍工具。"安全团队负责人说，"植入这个程序的人不是普通黑客，是有组织的团队。他们可能在植入之前就对你的电脑系统做过调研，知道你用什么杀毒软件、什么防火墙。"</p>\n<p>"能查到数据发到了哪里吗？"陆峥寒问。</p>\n<p>"发送目标是一个海外加密服务器，IP地址经过多层代理跳转。"负责人摇头，"要追到最终接收方，需要网监部门的技术支持。"</p>\n<p>"已经运行两周了。"温叙白说，"我的核心设计文件有加密备份——但加密文件是离线存储的，不在这台电脑上。这台电脑上有的是……"他停了一下，"中期方案草案、部分结构计算书、和甲方的往来邮件。"</p>\n<p>"这些够恒盛用吗？"陆峥寒问。</p>\n<p>温叙白想了想："中期方案草案不够——没有核心设计图纸，草案只是方向性文件。但结构计算书有问题。它不是最终版，但里面的参数和逻辑链条，足够让有经验的工程师反推出设计方案的大致框架。"</p>\n<p>"也就是说，他们可能已经拿到了一些有价值的东西。"</p>\n<p>"是。"</p>\n<p>陆峥寒看向林舟："查最近两周进出这栋楼的所有访客记录。"</p>\n<p>"已经查了。"林舟打开平板，"最近两周有三次访客登记——一次是快递，一次是甲方对接人，一次是行业交流会当天的登记。前两次都没有异常时间。但交流会那天——有一个访客登记信息异常，用的是假名字，登记的公司也不存在。"</p>\n<p>"监控画面呢？"</p>\n<p>"我调了。"林舟把平板递过来，"陆总，您看——"</p>\n<p>画面虽然不太清晰，但能看到一个戴鸭舌帽的男人在温叙白办公室附近逗留了约二十分钟，期间有几次进出办公室的动作。</p>\n<p>"这个人——"陆峥寒盯着画面看了几秒，"去年底出现在恒盛的年会上。我让人查过他的背景。"</p>\n<p>"能确定是恒盛的人？"</p>\n<p>"间接确定。他不是恒盛的正式员工，是一家\'安全咨询公司\'的——这种公司专门替客户做脏活。赵恒找这种人来，说明他不想留自己的痕迹。"</p>\n<p>温叙白站在旁边，一直安静地听着。此刻开口："这个程序的技术水平和\'安全咨询公司\'的定位不太匹配。能写出这种定制化框架的人，不是跑腿的。"</p>\n<p>"你的意思是？"</p>\n<p>"钱明远。"温叙白说，"他在陆氏投资部待过五年，接触过陆氏的IT系统架构。虽然陆氏的系统已经升级过了，但他了解的未必是技术细节——而是习惯。比如，他知道我这种独立设计师大概率不会请全职IT，用的杀毒软件大概率是市面主流的那几款。"</p>\n<p>陆峥寒目光微变："他在用对你工作习惯的了解来降低植入难度。"</p>\n<p>"对。"温叙白语气冰冷，"他比那个戴帽子的人危险得多。"</p>\n<p>陆峥寒拿出手机，拨了一个号码："周律师，准备材料。商业间谍、窃取商业机密、非法入侵——全部证据整理好，明天提交给经侦。但先别急着提交——我要你们先把数据流向追到底，确认窃取的文件被发到了谁手里。"</p>\n<p>挂了电话，他看向温叙白："叙白，这次我不再给他留退路了。"</p>\n<p>温叙白看着他，点了点头："好。但峥寒——这件事别只盯着恒盛。"</p>\n<p>"什么意思？"</p>\n<p>"钱明远是个聪明人，但他不在建筑行业——他拿到结构计算书也没用。除非有人替他翻译这些东西。"温叙白看着监控画面，"恒盛是地产公司，有自己的设计合作方，不需要偷别人的方案。他们冒这个险，只有一个可能——受人委托。"</p>\n<p>陆峥寒沉默了两秒："你怀疑——"</p>\n<p>"我不确定。但结构计算书对一个纯商业对手来说，价值不如直接拿设计图纸。他们偷了这个，说明他们要么想反推我的设计方向，要么——有人在幕后想通过恒盛拿到我的东西，自己用。"</p>\n<p>"大伯？"</p>\n<p>"查了再说。"</p>\n<p>那天晚上，两人留在工作室，一起整理证据。</p>\n<p>温叙白负责技术层面的证据——窃取程序的技术分析、数据流向追踪、被窃取文件的清单。</p>\n<p>陆峥寒负责商业层面的证据——恒盛的人员背景调查、时间线比对、利益关联分析。</p>\n<p>两个人坐在工作台前，各自的电脑屏幕亮着，偶尔交换信息，配合默契到不需要多余的语言。</p>\n<p>凌晨两点，证据初步整理完毕，但数据流向追踪还在进行——周律师的团队需要时间穿透多层代理。</p>\n<p>"先回去休息。"陆峥寒合上电脑，转头看温叙白。</p>\n<p>温叙白还在看屏幕，眉头微蹙。</p>\n<p>"叙白？"</p>\n<p>"我在想一个问题。"温叙白抬头，"那个程序植入两周了。如果我是钱明远，拿到数据后第一件事不是用——而是验证。验证文件的真实性，验证设计方案的可推演性。"</p>\n<p>"你的意思是——"</p>\n<p>"如果他已经验证完了，那现在文件可能已经转手了。"温叙白看着他，"我们报警、追查、打官司——都需要时间。而对手只需要在我们追查的过程中把东西消化掉。"</p>\n<p>陆峥寒目光一沉："你想比他快。"</p>\n<p>"我有数字水印。"温叙白说。</p>\n<p>陆峥寒微微一愣。</p>\n<p>"每个项目的核心图纸上都嵌入了看不见的数字水印——包含设计师信息、时间戳和版权标识。"温叙白说，"这是国际建筑师协会推荐的版权保护措施，我三年前就开始用了。但中期方案草案上没有水印——水印只嵌在最终版核心图纸上。"</p>\n<p>"所以——"</p>\n<p>"所以他们偷到的草案没有水印。但如果他们要从草案反推设计，最终产出的东西在逻辑链条上会和我已注册的最终版高度重合。"温叙白微微弯唇，没有笑意，"那时候，水印就是我钉死他们的最后一颗钉子。"</p>\n<p>"但前提是，他们真的去\'反推\'了。"</p>\n<p>"他们会的。"温叙白语气笃定，"费这么大劲偷来的东西，不用就是废纸。而用——就是落网。"</p>\n<p>陆峥寒看着他，眼底闪过一丝复杂的光——有惊叹，有心疼，还有一种说不清的情绪。</p>\n<p>"叙白，你三年前就开始用水印系统了。那时候我们还不认识。"</p>\n<p>"洁癖和强迫症不全是坏事。"温叙白说，"我喜欢所有东西都在掌控之内。包括我的设计。"</p>\n<p>陆峥寒忍不住笑了："你比我想的还要厉害。"</p>\n<p>"现在不是夸我的时候。"温叙白正色道，"我建议两步走——法律途径照常推进，同时我联系国际建筑师协会，报备可能存在的版权风险。如果恒盛或背后的人真的用我的设计去参加任何招标——我立刻发起国际仲裁。"</p>\n<p>"好。"陆峥寒点头，"另外——大伯的事，我来处理。等数据流向追到底，该动的都动。"</p>\n<p>"这会引发家族内部的风波。"温叙白提醒。</p>\n<p>"我知道。"陆峥寒看着他，"但如果不处理，他会一直纠缠。为了你，也为了陆氏——我必须彻底解决。"</p>\n<p>温叙白看着他，没有再劝。</p>\n<p>"好。"他说，"复杂才需要两个人一起面对。"</p>\n<div class="hook">**【本章钩子：商业间谍入侵工作室！温叙白靠强迫症习惯发现异常，但窃取程序已运行两周——部分结构计算书可能已被外传。数字水印是最后的底牌，但需要等对手先动手才能钉死。更复杂的是，恒盛背后可能还有幕后黑手……一场比上次更凶险的较量，才刚刚开始。】**</div>\n'},
  {title:'第92章 温叙白识破，反杀名场面', vol:3, html:'<p>证据提交给经侦后，事情并没有像陆峥寒预期的那样快速推进。</p>\n<p>经侦立案用了四天——比预想的慢。原因在于窃取程序的发送目标在海外，跨境数据调取需要走国际司法协助流程。周律师说："最快也要两到三周才能拿到海外服务器的日志。"</p>\n<p>在这两到三周里，陆峥寒只能等。</p>\n<p>但温叙白不等。</p>\n<p>他联系了国际建筑师协会，报备了可能存在的版权风险，并提交了数字水印系统的技术文档作为预防性证据。协会的回复很快：已立案跟踪，一旦发现侵权行为将启动国际仲裁。</p>\n<p>同时，温叙白做了另一件事——他开始在自己的社交媒体和行业论坛上，以"分享设计流程"的名义，公开发布了一系列中期方案草案的局部截图。</p>\n<p>不是完整方案，只是片段——一个结构节点的处理思路、一种材料连接方式的技术细节、一段关于空间动线的思考笔记。每一篇都标了日期和版本号。</p>\n<p>"你这是在做什么？"陆峥寒看到后问他。</p>\n<p>"布陷阱。"温叙白说，"如果恒盛或背后的人用偷来的结构计算书反推我的设计，他们产出的东西一定会和这些已公开的片段产生冲突——因为我公开的是\'过程\'，他们偷到的是\'中间态\'，两套东西在逻辑链条上会出现时间线矛盾。到时候，谁先谁后，一看就知道。"</p>\n<p>"你在用公开发表来锁定时间线。"</p>\n<p>"对。学术圈常用的方法——抢先发表。"</p>\n<p>陆峥寒看着他，半晌说了一句："叙白，你要是去做商业间谍，估计能把整个行业搅翻。"</p>\n<p>"所以我选了正道。"温叙白语气平淡。</p>\n<p>三周后，经侦传来了突破性进展。</p>\n<p>通过国际司法协助，警方拿到了海外服务器的日志。日志显示：窃取的文件确实被转发到了一个二级账户，而那个二级账户的注册信息——经过技术穿透——指向了一个海外的匿名邮箱。</p>\n<p>但这个匿名邮箱的登录IP，有一次没有走代理——那一次的IP地址来自海城的一个居民小区。</p>\n<p>那个小区，是陆承业名下的一套房产所在地。</p>\n<p>"果然。"陆峥寒看着调查报告，语气冰冷。</p>\n<p>但"果然"不等于"够了"。匿名邮箱到陆承业之间，还隔着一层——登录那个邮箱的人不一定是陆承业本人，可能是他的代理人。警方需要进一步确认操作者身份。</p>\n<p>"这条证据链还差最后一环。"周律师说，"如果能证明陆承业本人或其直接下属操作了这个邮箱，就可以追诉到他。目前只能证明文件最终流向了和他相关的地址。"</p>\n<p>"那就查那个小区的监控。"陆峥寒说。</p>\n<p>"已经查了。"林舟接过话，"但那个小区的公共监控覆盖不全——陆承业的房产在小区最里面的独栋，公共摄像头只拍到出入口。而且——"他犹豫了一下，"经侦说，仅凭IP地址和小区监控，在司法实践中可能不够形成完整的证据闭环。陆承业如果有好律师，可以辩称\'有人蹭了他的Wi-Fi\'。"</p>\n<p>"那要怎么才能钉死他？"</p>\n<p>"等他动。"温叙白说。</p>\n<p>陆峥寒转头看他。</p>\n<p>"结构计算书已经被拿走快一个月了。"温叙白说，"如果他们要反推设计，现在差不多该出成果了。而一旦他们拿反推的设计去参加任何招标或展示——我的水印和公开发表的时间线就会同时起作用。那时候不需要追IP，侵权行为本身就是铁证。"</p>\n<p>"也就是说，我们还得等。"</p>\n<p>"等他犯错。"温叙白说，"他会的。费了这么大力气偷来的东西，不用就是废纸。而用——就是落网。"</p>\n<p>又过了两周。</p>\n<p>这两周里，陆峥寒查到了另一条线索——恒盛把窃取到的部分设计文件转手卖给了一家海外建筑公司。而这家海外公司的注册信息里，有一个股东的关联公司和陆承业有商业往来。</p>\n<p>不是直接证据，但拼图越来越完整。</p>\n<p>然后，温叙白布的陷阱触发了。</p>\n<p>那家海外建筑公司在东南亚一个国际建筑展上，展出了一个"原创设计方案"——一个社区图书馆的集装箱改造设计。方案的总体框架和温叙白的滨水一期设计高度相似，结构节点的处理方式甚至和温叙白公开发表的"过程笔记"中的草图几乎一模一样。</p>\n<p>温叙白看到展览信息时，正在工作室画图。他放下笔，给陆峥寒发了一条消息：</p>\n<p>【鱼咬钩了。】</p>\n<p>陆峥寒回复：【怎么说？】</p>\n<p>温叙白发了一个链接——海外公司的展览页面，然后附上自己三周前公开发表的设计过程笔记的截图。</p>\n<p>两个方案放在一起，相似度高到不需要专业人士就能看出来。</p>\n<p>陆峥寒看着屏幕，嘴角慢慢勾起。</p>\n<p>第二天，温叙白正式向国际建筑师协会提交了版权侵权投诉，同时通过周律师向那家海外公司发出了律师函。</p>\n<p>海外公司收到律师函后慌了——他们不知道买来的设计有版权问题。他们立刻反咬恒盛，要求恒盛赔偿。</p>\n<p>但恒盛这边也不是毫无防备。钱明远在交易时用了层层中间人，合同上写的是"设计参考方案"而非"原创设计"——这意味着法律上恒盛可以辩称"不知道这是偷来的"。</p>\n<p>"钱明远确实狡猾。"周律师看完合同后说，"他给自己留了退路。\'设计参考方案\'这四个字，把侵权责任往海外公司那边推了一半——你们买去了，怎么用是你们的事。"</p>\n<p>"但\'设计参考方案\'不可能和原方案这么相似。"温叙白说，"参考和抄袭的界限在行业里有明确标准——核心结构节点的处理方式如果一致，就不是参考，是复制。"</p>\n<p>"这需要专业鉴定。"</p>\n<p>"我来做鉴定人。"温叙白说，"我的水印系统技术文档已经提交给协会了。鉴定结论会证明：海外公司展出的方案中，至少三个核心结构节点的参数和逻辑链条与我已注册的最终版设计完全一致——这种一致性不可能通过\'参考\'达到。"</p>\n<p>法律战开始了——但不会速战速决。国际仲裁的流程至少需要三到六个月。</p>\n<p>不过，对陆峥寒来说，他不需要等国际仲裁的结果。</p>\n<p>恒盛面临刑事追诉加民事索赔，海外公司反咬一口——赵恒已经焦头烂额。而陆承业的那条线，虽然证据链还差最后一环，但陆峥寒手里的东西已经足够在董事会上做文章了。</p>\n<p>"不需要把他送进监狱。"陆峥寒对周律师说，"我只需要让董事会相信，他的行为已经严重损害了陆氏的利益和声誉。"</p>\n<p>一周后，陆峥寒召开了一次临时董事会。</p>\n<p>会议上，陆峥寒当着所有董事的面，展示了陆承业通过恒盛窃取商业机密、转卖设计文件的证据链——资金流向、人员往来、海外公司展览方案与温叙白原设计的比对报告。</p>\n<p>会议室里一阵沉默后，开始有了低声议论。</p>\n<p>陆承业的脸色从红到白，从白到青。</p>\n<p>"陆峥寒！你——"他站起来，手指颤抖，"这些证据都是间接的！IP地址不能证明是我——"</p>\n<p>"大伯。"陆峥寒坐在主位上，语气平静但不容置疑，"我没有说一定是您。但根据公司章程第十八条，股东行为涉嫌损害公司利益的，董事会有权提议采取预防性措施——包括暂停股东权利和冻结股份。注意，是\'涉嫌\'，不是\'确认\'。确认的事，留给司法机关。"</p>\n<p>"你这是——"</p>\n<p>"我提议：暂停陆承业的股东权利，冻结其持有的全部陆氏股份，待司法机关最终结论后另行处理。同时保留追究法律责任的权利。"</p>\n<p>表决并不顺利。</p>\n<p>九人董事会，陆峥寒拿到七票赞成——但有两票反对。</p>\n<p>投反对票的两个董事，一个是和陆承业有多年私交的老陈，另一个是代表小股东利益的独立董事张敏。</p>\n<p>老陈的理由很直接："峥寒，证据链确实不完整。IP不能证明本人，这是常识。如果今天我们凭\'涉嫌\'就冻结股东股份，明天是不是也可以凭\'涉嫌\'冻结我的？先例不能乱开。"</p>\n<p>张敏更务实："我不是在替承业说话。但从公司治理的角度看，暂停股东权利的程序依据不够充分——如果陆承业申请复议或起诉董事会决议，公司会陷入长期内耗。我建议给一个过渡方案：暂停他的表决权，但不冻结分红权。这样既表明态度，又留了余地。"</p>\n<p>陆峥寒看着这两个人，没有发火。</p>\n<p>他知道他们说的有道理——这就是现实。即使所有人都心知肚明陆承业干了什么，法律上的"证据充分"和董事会层面的"程序正当"是两回事。</p>\n<p>"张董的建议合理。"陆峥寒说，"修正提案：暂停陆承业的表决权和提案权，保留分红权，期限六个月。六个月后视司法机关结论决定是否进一步处理。"</p>\n<p>重新表决。这次是八票赞成，一票反对——老陈一个人投了反对，但已经是少数。</p>\n<p>陆承业没有瘫坐在椅子上。他站起来，看了陆峥寒一眼，然后看了看其他董事，一句话没说，转身走了。</p>\n<p>走出会议室时，陆峥寒在走廊里遇到了闻讯赶来的陆老夫人。</p>\n<p>"祖母。"</p>\n<p>陆老夫人看着他，目光复杂。她没有立刻说"你做得对"——而是沉默了好一会儿。</p>\n<p>"证据确凿吗？"她问。</p>\n<p>"证据链指向他，但最后一环还没闭合。"</p>\n<p>"也就是说，还有可能是别人？"</p>\n<p>"可能性很小。但大伯说得对——法律上，目前是\'涉嫌\'。"</p>\n<p>陆老夫人闭了闭眼。</p>\n<p>"峥寒，你做得……不算错。"她说，语气里有疲惫，也有一种说不清的沉重，"承业走错了路，该受惩罚。但你们毕竟是一家人。你在董事会上留了余地——这很好。如果你赶尽杀绝，我会更不安。"</p>\n<p>"祖母不怪我？"</p>\n<p>"我怪自己。"陆老夫人摇头，"是我一直太纵容他了。他小时候争不过你父亲，我就多疼他一些。结果这种疼变成了他以为理所应当的——到头来害了他。"</p>\n<p>她顿了顿："你做得对。陆氏是你的。该守的规矩不能破。但——别断了和他的亲情。该惩罚的惩罚，该给的退路也给。"</p>\n<p>陆峥寒微微欠身："谢谢祖母。"</p>\n<p>当晚，陆峥寒回到家，温叙白在客厅等他。</p>\n<p>"结束了？"</p>\n<p>"阶段性结束。"陆峥寒在他身边坐下，"大伯的表决权被暂停了，但不是全票——有两个董事反对。"</p>\n<p>"反对的理由呢？"</p>\n<p>"证据链不完整，程序依据不够充分。"陆峥寒苦笑，"他们说的有道理。现实就是这样——你心里知道是他干的，但\'知道\'和\'证明\'之间隔着一整个司法程序。"</p>\n<p>温叙白看着他，没有说"你应该更强硬"之类的话。</p>\n<p>"国际仲裁那边呢？"陆峥寒问。</p>\n<p>"协会已经受理了。海外公司的展览方案被临时下架——但他们请了律师，主张\'独立创作\'。"温叙白语气平静，"接下来的鉴定流程至少要三个月。"</p>\n<p>"三个月。"陆峥寒叹了口气，"也就是说，这件事还要拖三个月。"</p>\n<p>"有些事急不来。"温叙白起身去厨房，端了一碗汤出来。</p>\n<p>"喝汤。"</p>\n<p>陆峥寒接过，喝了一口——是排骨莲藕汤，温叙白做的。</p>\n<p>"你做的？"</p>\n<p>"嗯。"</p>\n<p>"什么时候学的？"</p>\n<p>"你不在的时候。"温叙白坐回他身边，"不太好喝。"</p>\n<p>陆峥寒把汤一饮而尽："很好喝。"</p>\n<p>温叙白看着他，嘴角弯了弯。</p>\n<p>这场反击不是一击致命的碾压——而是一场漫长的、分步骤的、有来有回的拉锯。董事会的表决有反对票，法律程序还在走，国际仲裁要三个月。</p>\n<p>但方向是对的。每一步都让对方更被动，让自己更主动。</p>\n<p>而且——他们在一起。</p>\n<div class="hook">**【本章钩子：温叙白用数字水印和"抢先发表"策略布下陷阱，海外公司展览触发版权侵权——但恒盛在合同中留了退路，法律战不会速决。董事会暂停了陆承业的表决权，但两票反对提醒着现实的复杂。这场反击是一场拉锯，不是碾压。国际仲裁三月见分晓，但更大的风暴还在酝酿……】**</div>\n'},
  {title:'第93章 陆氏危机，股价动荡', vol:3, html:'<p>大伯表决权被暂停的消息不胫而走。</p>\n<p>本来这是陆氏内部的治理调整，但陆承业不甘心，在离开董事会后向几家媒体泄露了"陆氏家族内斗"的消息——而且他把自己的角色包装得更惨：不是"涉嫌违法行为被暂停表决权"，而是"因家族权力斗争被总裁排挤出局"。</p>\n<p>第二天，《陆氏集团家族内讧：大股东遭清洗，总裁铁腕收权》的标题出现在了几家财经媒体上。</p>\n<p>消息一出，陆氏股价开盘即跌。</p>\n<p>早盘暴跌6.3%，盘中一度触及跌停。</p>\n<p>但真正的考验不在第一天——在第二天。</p>\n<p>第二天，股价没有反弹。小幅低开后一路震荡，收盘再跌2.1%。两天累计跌幅超过8%。</p>\n<p>第三天，两家机构投资者发布了减持公告——不是清仓，是"基于治理风险的不确定性"减持了持仓的三到四成。</p>\n<p>陆氏总部一片紧张。投资者关系部的电话被打爆，几个重要的供应商也打来电话，语气客气但意思明确："不是不信任陆总，但风控部门要求我们重新评估合作风险。"</p>\n<p>林舟连续三天没怎么睡。</p>\n<p>"陆总，情况不太好。"他站在陆峥寒面前，眼下青黑一片，"机构在减持，供应商在观望。最麻烦的是——中泰证券发了一篇深度报告，标题叫《陆氏集团：家族治理风险与估值折价》，直接把目标价下调了15%。"</p>\n<p>"中泰证券？"陆峥寒皱眉。</p>\n<p>"陆承业给几家券商研究所发了材料，声称他\'被非法驱逐\'，暗示陆氏的治理结构存在严重问题。中泰的分析师信了——至少是半信半疑。还有两家跟着调了评级，从\'买入\'降到\'增持\'。"</p>\n<p>陆峥寒坐在办公桌后，表情冷静得不像话。</p>\n<p>"预期之内。"他说，"大伯不会甘心出局，他一定会制造混乱。而且他选的时机很好——国际仲裁还在走，恒盛的案子在司法程序里，证据链最后一环还没闭合。市场有疑虑是正常的。"</p>\n<p>"那我们怎么应对？"</p>\n<p>"三步走。"陆峥寒站起来，走到白板前，"第一，后天召开投资者电话会议，公开说明董事会决议的合法性、程序依据和原因。不是辩解，是信息披露。"</p>\n<p>"第二，把经侦对恒盛商业间谍案的立案通知书摘要公开。让市场知道，这不是\'家族权力斗争\'，而是涉嫌违法行为被依法采取的预防性措施。注意措辞：\'涉嫌\'，不是\'确认\'。我们的诚信不能有问题。"</p>\n<p>"第三——"他放下白板笔，"发布陆氏下季度的业绩预告。提前释放利好。但不要过度包装——市场不傻，数据好就好好说，有风险就如实说。现在最怕的不是利空，是信息不透明。"</p>\n<p>林舟点头："业绩预告？我们的数据够好吗？"</p>\n<p>"滨水二期的预签约已经超预期了。让财务部今天就把数据整理出来。"</p>\n<p>"明白。"</p>\n<p>"还有一件事。"陆峥寒拿起手机，"叙白那边——"</p>\n<p>"我已经通知了工作室的安保团队。"温叙白的声音从门口传来。</p>\n<p>两人同时转头。</p>\n<p>温叙白站在办公室门口，穿着白色衬衫，面容清冷。</p>\n<p>"叙白？你怎么来了？"</p>\n<p>"看到新闻了。"温叙白走进来，"你的\'不瞒我\'原则还记得吧？"</p>\n<p>陆峥寒苦笑："这次没有瞒你，只是还没来得及说。"</p>\n<p>温叙白走到他面前，看了眼白板上的应对方案，点了点头。</p>\n<p>"方案不错。但我补充一点。"</p>\n<p>"什么？"</p>\n<p>"投资者会议，我也参加。"</p>\n<p>陆峥寒一愣："你？"</p>\n<p>"滨水项目是陆氏目前最大的增长点，而我是项目设计方。"温叙白说，"如果投资者担心公司治理——我作为合作方出席，本身就是最好的信心背书。"</p>\n<p>"而且——"他看着陆峥寒，"你的个人形象和公司形象绑定了。如果投资者觉得你的私生活影响了公司，那我出面，就是证明——你的选择不但没有影响公司，反而带来了更好的合作。"</p>\n<p>陆峥寒看着他，目光里满是惊叹。</p>\n<p>"叙白，你什么时候变得这么懂商业了？"</p>\n<p>"跟你在一起久了。"</p>\n<p>陆峥寒忍不住笑了。</p>\n<p>当天下午的投资者电话会议，陆峥寒和温叙白一起出席。</p>\n<p>陆峥寒用十五分钟清晰地说明了董事会决议的法律依据和程序正当性，然后公布了经侦立案通知书的摘要——措辞极其严谨，每一条都经过法务部字斟句酌，确保"涉嫌"和"确认"的边界分毫不差。</p>\n<p>他打开第二页PPT，是一张股权结构图。陆氏集团总股本42亿股，陆承业原持7.2%——3150万股。表决权已暂停，但分红权保留，期限六个月，待司法机关结论后另行处理。</p>\n<p>"这不是\'家族内斗\'，是公司治理的自我纠偏。"陆峥寒的语气像在念天气预报，"陆氏的治理结构没有问题——有问题的是个别人的行为，而我们已经依法处理了。"</p>\n<p>台下有机构分析师开始低头算数。</p>\n<p>温叙白随后发言，用专业的数据和项目进展，展示了滨水项目的商业价值和未来前景。</p>\n<p>"滨水项目的合作不会受到任何影响。作为设计方，我对陆氏的执行力有充分的信心。"温叙白说。</p>\n<p>他的发言简洁有力，没有多余的修饰，每一个字都精准地击中了投资者的关注点。</p>\n<p>会议结束后的效果——不是立竿见影，而是缓慢发酵。</p>\n<p>第二天，股价止跌了——但没有大涨，只是企稳，收盘微涨0.3%。中泰证券没有改口，但另一家叫光大证券的研究所发了一篇"反向报告"，标题叫《陆氏治理事件解读：利空出尽，估值修复在即》，认为市场对"家族内斗"的解读过度悲观。</p>\n<p>第三天，两家之前减持的机构中有一家重新小幅加仓——不是因为他们完全放心了，而是因为业绩预告的数据确实好看。另一家没有动，还在观望。</p>\n<p>整整一周后，股价才收复了前两天的跌幅。不是一根大阳线式的反弹，而是每天涨一点，像是在消化不确定性。中泰证券在第二周把评级从"减持"调回了"中性"——没有调回"买入"，但不再看空了。</p>\n<p>收盘后，林舟一个人在办公室坐了很久。</p>\n<p>他面前的电脑屏幕上还挂着K线图——第一天那根刺眼的绿色长阴线，和后面连续五天的小阳线，像是一记耳光和五颗小糖。</p>\n<p>这场危机没有"力挽狂澜"的爽感。有的只是日复一日的信息披露、机构沟通、供应商安抚——枯燥、繁复、没有尽头。</p>\n<p>但温叙白在投资者会议上说的那句"我对陆氏的执行力有充分的信心"，被几家媒体做成了标题。那句话不是在救市——是在告诉所有人：这个项目还在正常推进，设计方没有退缩。这句话的分量，比任何回购公告都重。</p>\n<p>林舟跟了陆峥寒八年。从行政部小职员到总裁特助，这八年里他学会了很多东西：怎么在陆总发火时保持面无表情、怎么在三分钟内订到满座的餐厅、怎么把"你的意思是让我去死吗"翻译成"陆总需要进一步考虑"。</p>\n<p>但这一周他学到的是另一件事。</p>\n<p>股价暴跌那两天，他第一反应是慌。不是为自己慌——他的期权不大，跌停也亏不了多少——而是为陆峥寒慌。陆峥寒表面上冷静得像座冰山，但林舟知道他不是不慌，只是不允许自己慌。</p>\n<p>然后温叙白来了。</p>\n<p>温叙白穿着白衬衫走进办公室的那一刻，林舟看到陆峥寒肩膀上的那条线松了一点点——很细微，不到一毫米，但他看到了。</p>\n<p>那一刻林舟忽然明白了一件事：他跟了陆峥寒八年，能做到的是替他挡事、替他跑腿、替他在前面冲锋。但有些东西他给不了——那种能让陆峥寒在暴风雨里松一毫米肩膀的东西，只有温叙白能给。</p>\n<p>这不是失落。是一种释然。</p>\n<p>他不需要成为那个"最重要的人"——他只需要做好那个"最靠谱的人"。</p>\n<p>林舟关掉K线图，打开工作清单，开始整理明天的工作安排。</p>\n<p>手机亮了一下，是陆瑶发来的消息：【林舟哥，我哥今天没事吧？我看到新闻了。】</p>\n<p>他打字回复：【没事，已经解决了。你哥厉害着呢。】</p>\n<p>发完他又加了一条：【不过你哥最厉害的地方不是解决危机，是找了一个能在危机里站出来的人。】</p>\n<p>陆瑶秒回：【你是不是在夸叙白哥？】</p>\n<p>【嗯。】</p>\n<p>【那你也挺厉害的，一直在旁边帮忙。】</p>\n<p>林舟看着这条消息，嘴角弯了弯，把手机放下，继续工作。</p>\n<p>"你的投资者会议发言被全文转载了。"陆峥寒晚上对温叙白说，"\'我对陆氏的执行力有充分的信心\'——这句话被做成了标题。"</p>\n<p>"事实而已。"</p>\n<p>"你什么时候这么谦虚了？"</p>\n<p>"我一直很谦虚。"</p>\n<p>陆峥寒笑了，伸手揽过他的肩膀。</p>\n<p>"叙白，谢谢你。"</p>\n<p>"谢什么？"</p>\n<p>"谢谢你站在我身边。"</p>\n<p>温叙白靠在他肩上，没有说话。</p>\n<p>但他握住了陆峥寒的手。</p>\n<div class="hook">**【本章钩子：陆氏股价连跌三天，机构减持、券商看空、供应商观望。陆峥寒没有力挽狂澜的魔法——只有日复一日的信息披露和温叙白那句被做成标题的"我对陆氏有充分信心"。一周后股价才企稳回升，但中泰证券仍未恢复"买入"评级。危机在退潮，但留下的痕迹不会消失……】**</div>\n'},
  {title:'第94章 并肩作战，力挽狂澜', vol:3, html:'<p>股价危机解除后的第二周，滨水二期招标正式启动。</p>\n<p>这是陆氏今年最重要的项目之一，也是温叙白作为首席设计师的又一力作。招标消息一出，业内高度关注。</p>\n<p>但问题也随之而来——恒盛虽然元气大伤，但赵恒在落败前埋了一颗暗雷。</p>\n<p>招标公告发布当天，一家名为"鼎盛建设"的公司突然出现，提交了一份竞标方案。方案的设计风格和温叙白的滨水一期高度相似——不是借鉴，而是近乎照搬。</p>\n<p>"这不是巧合。"温叙白看着鼎盛的竞标方案，目光冰冷，"这是之前被窃取的设计文件。"</p>\n<p>陆峥寒立刻让人调查鼎盛建设——果然，这家公司是三个月前刚注册的空壳公司，背后的实际控制人和恒盛有千丝万缕的联系。</p>\n<p>"赵恒用你窃取的设计来竞标滨水二期？"陆峥寒看着调查报告，"这人是疯了吗？"</p>\n<p>"他不疯了，他是在赌。"温叙白说，"如果鼎盛的方案中标，他就证明了\'温叙白的设计不是不可替代的\'，同时在法律上造成既成事实——反正设计是他的公司提交的，追责需要时间。"</p>\n<p>"但他忘了一件事。"温叙白微微弯唇。</p>\n<p>"数字水印。"两人异口同声。</p>\n<p>第二天，温叙白向招标委员会提交了一份技术鉴定报告——鼎盛建设竞标方案中的核心设计元素，与温叙白受版权保护的设计高度雷同，且文件中检测出了温叙白的数字水印。</p>\n<p>招标委员会当场取消了鼎盛建设的竞标资格，并将相关证据移交司法机关。</p>\n<p>赵恒的最后一颗暗雷，就这样被温叙白用专业和技术精准拆除。</p>\n<p>消息传到恒盛时，赵恒正在办公室里等消息。</p>\n<p>接到电话后，他沉默了很久，然后苦笑了一声。</p>\n<p>"输了。"他对钱明远说，"彻底输了。"</p>\n<p>钱明远脸色苍白："赵总，要不要——"</p>\n<p>"不要了。"赵恒摇头，"一个温叙白，一个陆峥寒——我们输得不冤。"</p>\n<p>他站起来，走到窗前，看着楼下的车水马龙："从今以后，恒盛不再碰和陆氏相关的任何项目。"</p>\n<p>赵恒的认输，标志着恒盛与陆氏之间持续了大半年的暗战正式终结。</p>\n<p>滨水二期招标顺利推进，陆氏毫无悬念地中标。</p>\n<p>签约仪式上，陆峥寒和温叙白并肩站在台上。</p>\n<p>台下闪光灯不断，媒体和嘉宾的目光都集中在两人身上。</p>\n<p>"感谢各位。"陆峥寒接过话筒，"滨水二期是陆氏和温叙白工作室的深度合作项目。我们相信，这个项目将成为海城的新地标。"</p>\n<p>温叙白站在他身旁，没有发言，只是微微点头。</p>\n<p>但他的存在本身就是最好的背书——这位国际建筑双年展的参展设计师、滨水一期的设计者、陆峥寒的伴侣——他的出席，就是对项目品质的保证。</p>\n<p>签约仪式结束后，两人在后台。</p>\n<p>"终于结束了。"陆峥寒松了松领带。</p>\n<p>"嗯。"温叙白靠在墙上，难得露出了一丝疲色。</p>\n<p>"累了？"</p>\n<p>"有点。"温叙白闭了闭眼，"这段时间事情太多了。"</p>\n<p>陆峥寒走过去，伸手揽住他的腰："回去休息。"</p>\n<p>"你下午还有会。"</p>\n<p>"推了。"</p>\n<p>"陆总——"</p>\n<p>"叙白。"陆峥寒低头看他，"你是我的优先级。永远排在第一位。"</p>\n<p>温叙白睁开眼，看着他。</p>\n<p>"走吧。"他说，"回家。"</p>\n<p>两人从后台通道离开，避开媒体。</p>\n<p>车驶入午后的阳光里，温叙白靠在后座上闭目养神。陆峥寒坐在他旁边，一只手握着他的手。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"这段时间……谢谢你。"</p>\n<p>"谢什么？"</p>\n<p>"谢谢你一直在我身边。"温叙白闭着眼说，"从恒盛的舆论攻击到商业间谍，从大伯的阴谋到鼎盛的抄袭——每一件事你都在前面挡着。"</p>\n<p>"你也在我身边。"陆峥寒说，"投资者会议、数字水印反杀——没有你，我也撑不过来。"</p>\n<p>温叙白没有说话，但手指微微收紧了。</p>\n<p>这就是并肩的意义——不是一个人保护另一个人，而是两个人互相支撑。</p>\n<p>风雨同舟，不过如此。</p>\n<div class="hook">**【本章钩子：恒盛最后一颗暗雷被精准拆除，赵恒彻底认输。滨水二期顺利签约，并肩作战的默契达到巅峰。但暴风雨过后，最值得期待的好消息即将到来——滨水一期入围国际建筑大奖！】**</div>\n'},
  {title:'第95章 危机解除，感情升华', vol:3, html:'<p>恒盛事件彻底了结后的那个周末，陆峥寒做了一个决定。</p>\n<p>"叙白，我们出去走走。"</p>\n<p>"去哪？"</p>\n<p>"城东图书馆。"</p>\n<p>温叙白微微一愣。</p>\n<p>城东图书馆——就是七年前陆峥寒走进的那座集装箱图书馆，也是温叙白根据爷爷的理念设计的第一个作品。</p>\n<p>两人驱车来到城东。</p>\n<p>图书馆还是老样子——色彩明快的集装箱堆叠成不规则的建筑体，缝隙间透出暖色灯光。门口的社区公告栏上贴着各种活动通知，有几个老人坐在门口的长椅上晒太阳。</p>\n<p>"多久没来了？"陆峥寒问。</p>\n<p>"两年。"温叙白说，"建成后我就没怎么回来过。"</p>\n<p>"我比你多一年。"陆峥寒笑着，"三年前我来过一次。"</p>\n<p>他推开门，走进图书馆。</p>\n<p>内部空间和温叙白设计的图纸一模一样——错落的集装箱形成了不同高度的空间，自然光从缝隙中洒入，在地板上画出一道道光带。</p>\n<p>馆内很安静，有几个社区居民在看书。一个年轻的母亲带着孩子在儿童区翻绘本，老人区有两位老大爷在下棋。</p>\n<p>"这个空间设计得真好。"陆峥寒站在中庭，仰头看着光线，"白天不需要开灯，全靠自然光。"</p>\n<p>"这是爷爷的理念。"温叙白说，"他总觉得图书馆应该是温暖的、开放的、属于社区的。不是那种高高在上的文化殿堂，而是像家的延伸。"</p>\n<p>"所以你用了集装箱。"陆峥寒说，"让建筑有一种亲切感。"</p>\n<p>"嗯。集装箱是工业材料，但组合在一起就有了生活气息。"温叙白看着那些看书的人，"建筑不是用来展示的，是用来生活的。"</p>\n<p>两人沿着书架慢慢走。</p>\n<p>走到角落时，温叙白忽然停下脚步。</p>\n<p>书架旁边的墙上，贴着一张旧照片——是图书馆建成时的开幕式照片。照片里有年轻很多的温叙白，穿着白衬衫，面无表情地站在建筑前。</p>\n<p>"你那时候看起来好冷。"陆峥寒凑近看照片。</p>\n<p>"我本来就冷。"</p>\n<p>"现在不冷了。"陆峥寒转头看他，"现在你会笑。"</p>\n<p>温叙白看着照片里那个年轻的、面无表情的自己，忽然觉得那个人已经很远了。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你七年前走进这里的时候，是什么感觉？"</p>\n<p>陆峥寒想了想："像走进了一个安全的港湾。外面的一切都跟我无关了——董事会的压力、家族的期待、商界的纷争——在这里，我只觉得安静。"</p>\n<p>"然后我看到了墙上的设计师介绍——温叙白。"</p>\n<p>他转头看着温叙白："我心想，能设计出这样的空间的人，一定是一个很温柔的人。"</p>\n<p>"你后来认识我的时候，发现我一点都不温柔。"</p>\n<p>"不。"陆峥寒认真地说，"你是我见过最温柔的人。只不过你的温柔不是挂在脸上的，是藏在设计里的。"</p>\n<p>温叙白看着他，眼底有什么东西在微微颤动。</p>\n<p>"你每次设计的时候都会考虑使用者的感受——光线的角度、空间的尺度、材质的温度。"陆峥寒说，"这些不是技术，是关怀。叙白，你一直在用自己的方式温柔地对待这个世界，只是你自己不知道。"</p>\n<p>温叙白沉默了很久。</p>\n<p>然后他低下头，轻轻靠在了陆峥寒肩上。</p>\n<p>"谢谢你。"他说，声音很轻。</p>\n<p>"谢什么？"</p>\n<p>"谢谢你看懂了我。"</p>\n<p>陆峥寒没有说话，只是伸手环住了他的肩。</p>\n<p>图书馆里很安静，阳光从集装箱的缝隙间洒下来，在两人身上画出温暖的光影。</p>\n<p>这一刻，没有商界的纷争，没有家族的暗斗，没有舆论的喧嚣。</p>\n<p>只有两个人，在一座承载着梦想和记忆的建筑里，安静地靠在一起。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"我想告诉你一件事。"</p>\n<p>"什么？"</p>\n<p>"我让林舟在海城老城区找了一个合适的选址。"陆峥寒的声音带着一丝紧张，"我想以你爷爷的名义，建一座新的社区图书馆。"</p>\n<p>温叙白猛地抬头。</p>\n<p>"用你画的那份新设计稿。"陆峥寒看着他，"温怀瑾社区图书馆——你爷爷的梦想，由你来完成。"</p>\n<p>温叙白怔怔地看着他，眼眶发热。</p>\n<p>"你……什么时候——"</p>\n<p>"从你给我看爷爷的图纸那天起。"陆峥寒说，"我就一直在筹备。选址已经确定，资金我来出。这个项目不以陆氏的名义，以温怀瑾基金会的名义。"</p>\n<p>温叙白看着他，嘴唇微微颤抖。</p>\n<p>"陆峥寒。"他说，声音带着微微的鼻音，"你——"</p>\n<p>"叙白，你说过——开门这件事只有我能做到。"陆峥寒握住他的手，"但有些门，是你要亲手打开的。爷爷的那座图书馆，就是你的门。"</p>\n<p>温叙白看着他，终于没忍住，眼眶红了。</p>\n<p>他很少在外人面前表露情绪。但此刻，在这座承载着他和爷爷记忆的图书馆里，在陆峥寒说出了最深的心意之后，他终于让那层清冷的壳裂开了一条缝。</p>\n<p>"谢谢你。"温叙白的声音有些哑，"真的谢谢你。"</p>\n<p>陆峥寒抱住了他，轻轻拍着他的背。</p>\n<p>"不用谢。"他说，"你开心就好。"</p>\n<p>图书馆的阳光洒在两人身上，温暖而柔和。</p>\n<div class="hook">**【本章钩子：危机解除，感情升华。陆峥寒以温怀瑾之名筹建社区图书馆——爷爷的梦想将由温叙白亲手完成。这是全书最动人的一幕之一。而更大的好消息即将到来——滨水项目入围国际建筑大奖！】**</div>\n'},
  {title:'第96章 滨水获奖，国际声誉', vol:3, html:'<p>好消息来得比预想的更快。</p>\n<p>那天早晨，温叙白在工作室收到了一封来自国际建筑师协会（UIA）的邮件。</p>\n<p>邮件内容很短：滨水文化中心项目入围本年度UIA国际建筑奖——公共建筑类候选名单。</p>\n<p>温叙白看着屏幕上的邮件，手指微微发颤。</p>\n<p>UIA国际建筑奖是全球建筑界最高荣誉之一，每年只有极少数项目能入围候选名单。中国建筑师入围的次数屈指可数。</p>\n<p>他拿起手机，给陆峥寒发了一条消息：</p>\n<p>【滨水入围UIA了。】</p>\n<p>三秒后，陆峥寒回了一个字：【！！！】</p>\n<p>然后紧接着：【你现在在哪？】</p>\n<p>【工作室。】</p>\n<p>【等我。】</p>\n<p>二十分钟后，陆峥寒出现在工作室门口。</p>\n<p>他快步走进来，走到温叙白面前，一把抱住了他。</p>\n<p>"恭喜你。"他说，声音闷在温叙白肩窝里。</p>\n<p>温叙白被他抱得有些喘不过气，但没有推开。</p>\n<p>"只是入围，还没获奖。"他说。</p>\n<p>"入围已经是赢了。"陆峥寒松开他，看着他，"叙白，你知道这意味着什么吗？这是国际建筑界对你作品的认可。"</p>\n<p>温叙白看着他，嘴角弯了弯——难得的、毫无保留的笑。</p>\n<p>消息很快传开了。</p>\n<p>工作室的员工们欢呼雀跃，建筑界的朋友纷纷发来祝贺，媒体也开始联系采访。</p>\n<p>最让温叙白意外的是，他收到了一封来自海城老城区社区中心的信——社区的老居民们听说了滨水获奖的消息，集体写了一封祝贺信。</p>\n<p>"温设计师，城东图书馆是我们社区最珍贵的礼物。听说滨水又获奖了，我们都替你高兴。你爷爷要是知道了，一定很骄傲。"</p>\n<p>信的末尾是几十个老人的签名。</p>\n<p>温叙白看着那些歪歪扭扭的签名，鼻子微酸。</p>\n<p>"怎么了？"陆峥寒凑过来看。</p>\n<p>温叙白把信递给他。</p>\n<p>陆峥寒看完，沉默了一会儿，然后说："爷爷一定知道。"</p>\n<p>"嗯。"</p>\n<p>UIA颁奖典礼定在两个月后，在东京举行。</p>\n<p>温叙白需要提前准备参展材料和演讲内容。陆峥寒二话不说，把下个月的工作全部调整，确保自己能陪温叙白一起去东京。</p>\n<p>"你不用——"</p>\n<p>"我要去。"陆峥寒语气不容商量，"你领奖的时候，我要在台下。"</p>\n<p>温叙白看着他，没有再推辞。</p>\n<p>接下来的两个月，温叙白一边准备颁奖典礼的材料，一边推进温怀瑾社区图书馆的设计深化。</p>\n<p>陆峥寒说到做到——他已经注册了温怀瑾基金会，选址也确定了。社区图书馆的图纸用温叙白的新设计，施工预计明年春天启动。</p>\n<p>"爷爷的图书馆，终于要建了。"温叙白看着深化后的设计图，轻声说。</p>\n<p>"不止建。"陆峥寒站在他身后，"还要建得最好。叙白，这个项目我会全程支持，你要什么资源我都给你找。"</p>\n<p>温叙白转头看他："你对我的事业这么上心，不怕别人说你公私不分？"</p>\n<p>"我的公和私从来都是一体的。"陆峥寒弯唇，"你是我的人，你的事业就是我的事业。"</p>\n<p>温叙白看着他，清冷的眼底温柔得不像话。</p>\n<p>"陆峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你知不知道你说话特别像言情剧男主？"</p>\n<p>"那你是言情剧男主的恋人。"</p>\n<p>"……我不想当。"</p>\n<p>"晚了。"陆峥寒笑了，"已经演了一百多集了。"</p>\n<p>温叙白忍不住笑了一下，然后被自己的笑吓了一跳。</p>\n<p>"好了，去准备东京的事吧。"温叙白转身回到工作台前，"别在这里碍事。"</p>\n<p>"好。"陆峥寒在他发顶落下一吻，"我去做饭。"</p>\n<p>窗外的阳光正好，工作室里满是设计图纸和模型的影子。</p>\n<p>一切都在向好的方向发展。</p>\n<div class="hook">**【本章钩子：滨水项目入围UIA国际建筑奖！温叙白的才华得到国际认可，社区老人的祝福信令人泪目。温怀瑾社区图书馆即将启动，东京颁奖典礼近在咫尺——全书最高光的时刻即将到来……】**</div>\n'},
  {title:'第97章 颁奖典礼，高光时刻', vol:3, html:'<p>东京。</p>\n<p>UIA年度颁奖典礼在东京国际会议中心举行。</p>\n<p>场馆本身是一座极具设计感的建筑——形如胶囊的玻璃体量嵌在钢铁框架中，是日本著名建筑师的作品。温叙白走进来时，下意识地打量了一下空间结构。</p>\n<p>"又在看建筑。"陆峥寒走在他旁边，低声说。</p>\n<p>"职业病。"</p>\n<p>"可爱的职业病。"</p>\n<p>颁奖典礼在主厅举行，能容纳两千人。到场的都是全球建筑界的顶尖人物——普利兹克奖得主、各国的建筑协会主席、顶级事务所的合伙人。</p>\n<p>温叙白穿着黑色西装，清冷挺拔。陆峥寒坐在嘉宾席第一排，目光始终追随着他。</p>\n<p>典礼开始了。</p>\n<p>一个个奖项依次揭晓。最佳住宅设计、最佳商业建筑、最佳城市规划……</p>\n<p>当主持人念到"公共建筑类"时，全场安静了下来。</p>\n<p>"本年度UIA国际建筑奖——公共建筑类金奖获得者——"</p>\n<p>主持人打开信封，停顿了一秒。</p>\n<p>"温叙白。中国海城。滨水文化中心。"</p>\n<p>全场掌声雷动。</p>\n<p>温叙白站起来的那一刻，陆峥寒的掌声比任何人都用力。</p>\n<p>温叙白走上台，聚光灯打在他身上。</p>\n<p>他接过奖杯，站在话筒前，面对两千多位全球建筑界的精英。</p>\n<p>"谢谢。"他的声音清冷而平静，没有激动得颤抖，也没有刻意克制——就是他本来的样子。</p>\n<p>"滨水文化中心是我设计生涯中最重要的项目之一。它的灵感来自我的爷爷——温怀瑾先生，他是一位建筑师，也是我生命中最重要的人。"</p>\n<p>"他生前设计了一座社区图书馆，但没能完成。他去世前把未完成的图纸交给我，说——\'叙白，帮爷爷画完它。\'"</p>\n<p>"我没有补完他的图，但我用他的理念设计了滨水文化中心。光线、空间、材质——每一个细节都来自他教给我的东西。"</p>\n<p>"所以这个奖不只是给我一个人的。它也属于我的爷爷，属于所有相信建筑可以温暖人心的人。"</p>\n<p>他微微低头："谢谢。"</p>\n<p>掌声再次雷动，比刚才更热烈。</p>\n<p>台下的陆峥寒看着台上那个清冷而从容的身影，眼眶发热。</p>\n<p>他的叙白，从来不是只会画图的建筑师。他是一个把温柔藏在建筑里的人，一个用空间表达爱的人。</p>\n<p>典礼结束后，温叙白捧着奖杯走下台。</p>\n<p>陆峥寒迎上去，在他面前站定。</p>\n<p>"叙白——"</p>\n<p>"嗯？"</p>\n<p>"你刚才的发言——"</p>\n<p>"说完了就下来了，没什么特别的。"</p>\n<p>"你说你爷爷的时候，我在台下差点哭了。"</p>\n<p>"你什么时候变得这么容易哭了？"</p>\n<p>"自从遇到你。"陆峥寒认真地说。</p>\n<p>温叙白看着他，忍不住笑了。</p>\n<p>"走吧。"他说，"回去庆祝。"</p>\n<p>"怎么庆祝？"</p>\n<p>"你选。"</p>\n<p>陆峥寒想了想："吃寿司？"</p>\n<p>"你飞到东京来就为了吃寿司？"</p>\n<p>"飞到东京来陪你领奖，顺便吃寿司。"</p>\n<p>温叙白摇头，但嘴角是弯的。</p>\n<p>那天晚上，两人在东京塔附近的一家小巷寿司店吃了一顿。</p>\n<p>店面很小，只有八个座位。老板是个六十多岁的老头，手艺极好。</p>\n<p>温叙白吃了十二贯，陆峥寒吃了二十贯。</p>\n<p>"你吃得比我还多。"温叙白看着他。</p>\n<p>"我今天消耗大——鼓掌鼓了两个小时。"</p>\n<p>温叙白忍不住笑出了声。</p>\n<p>吃完饭，两人沿着东京的街道慢慢走回去。</p>\n<p>夜风微凉，街道安静。路灯在两人身后投下长长的影子。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"你今天特别好看。"</p>\n<p>"我今天跟平时一样。"</p>\n<p>"不。"陆峥寒停下脚步，转头看他，"你拿着奖杯站在台上的时候，整个人都在发光。"</p>\n<p>温叙白看着他，东京的夜色在他清冷的眼底铺成一片温柔的底色。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"以后我设计的每一座建筑，都有你的功劳。"</p>\n<p>"我没有功劳——"</p>\n<p>"你让我有了安全感。"温叙白看着他，"一个有安全感的设计师，才能设计出让人安心的空间。"</p>\n<p>陆峥寒看着他，说不出话。</p>\n<p>然后他上前一步，在东京的夜色里，在安静的街道上，轻轻吻了吻温叙白的额头。</p>\n<p>"走吧。"他牵起温叙白的手，"回酒店。"</p>\n<p>"嗯。"</p>\n<p>两人十指相扣，走在东京的夜色里。</p>\n<p>身后是东京塔的灯光，前方是回程的路。</p>\n<p>而他们的路，还很长很长。</p>\n<div class="hook">**【本章钩子：UIA金奖！温叙白站在世界建筑界的最高领奖台上，把荣誉献给了爷爷。陆峥寒在台下的掌声比任何人都用力。东京塔下的夜色，两个人的影子叠在一起。第四卷的故事即将展开——求婚、婚礼、余生……最甜蜜的篇章正在等候！】**</div>\n'},
  {title:'第98章 媒体专访，爱情故事', vol:3, html:'<p>从东京回来后，温叙白的知名度暴涨。</p>\n<p>UIA金奖的加持让他在国际建筑界声名鹊起，国内的媒体也蜂拥而至。各种专访邀约堆满了助理的桌面。</p>\n<p>温叙白对大部分邀约都拒绝了——他不喜欢曝光。但有一个邀约他接受了：国内最权威的建筑专业杂志《建筑学报》的人物专访。</p>\n<p>"为什么接这个？"陆峥寒问。</p>\n<p>"因为是专业杂志，不是八卦周刊。"温叙白说，"他们想采访我的建筑理念，顺便聊一聊个人经历。"</p>\n<p>"聊个人经历？"</p>\n<p>"你不用担心。"温叙白看他，"我不会说你不好的。"</p>\n<p>"我没有担心这个——"</p>\n<p>"你紧张了。"</p>\n<p>"我没有。"</p>\n<p>"你耳朵红了。"</p>\n<p>陆峥寒摸了摸耳朵，发现确实有些发烫。</p>\n<p>专访安排在温叙白的工作室。</p>\n<p>采访记者是一位资深的建筑评论家，姓周，五十多岁，温和而专业。</p>\n<p>采访从建筑理念开始。周老师问了温叙白的设计哲学、对公共建筑的理解、以及滨水项目的创作过程。温叙白一一作答，专业而从容。</p>\n<p>然后话题转向了个人经历。</p>\n<p>"温先生，您的个人经历在业内一直备受关注。"周老师说，"特别是您和陆峥寒先生的关系。能聊聊你们是怎么认识的吗？"</p>\n<p>温叙白沉默了一瞬。</p>\n<p>"说起来——"他开口了，声音比平时柔和了一些，"是他先认识我的。"</p>\n<p>他讲了很多。讲城东图书馆的设计理念，讲爷爷的影响，讲洁癖和强迫症如何影响了他的生活和创作。但他没有讲陆峥寒蓄谋七年的事——那是属于他们两个人的秘密。</p>\n<p>"陆先生对您的设计工作有什么影响？"周老师问。</p>\n<p>"他让我有了安全感。"温叙白说，"设计师需要安全感才能创作。如果没有安全感，你会下意识地保守——不敢尝试新的东西，不敢突破自己的边界。"</p>\n<p>"和他在一起之后，我敢了。"</p>\n<p>"怎么理解？"</p>\n<p>"比如滨水文化中心的水景幕墙——那个设计在技术上很大胆，评审的时候有很多争议。如果是在以前，我可能会为了安全而妥协。但那段时间，他对我说了一句话——\'你的设计，你说了算。\'"</p>\n<p>温叙白微微弯唇："所以我没妥协。"</p>\n<p>"那句话是他说的？"</p>\n<p>"嗯。他不是一个懂建筑的人，但他懂我。"</p>\n<p>周老师笑了："你们的关系很让人羡慕。有没有什么想对陆先生说的话？"</p>\n<p>温叙白想了想，说："谢谢你没有放弃我。"</p>\n<p>采访结束后，这篇报道发表在《建筑学报》的封面人物专栏。</p>\n<p>文章的标题是：《温叙白：建筑是温柔的容器，而他是我的安全港》</p>\n<p>报道发出后，在业内和公众中都引起了很大反响。很多建筑系的学生把这篇采访打印出来贴在书桌前，那句"谢谢你没有放弃我"成了很多人的签名。</p>\n<p>陆峥寒看到这篇报道的时候，是在办公室里。</p>\n<p>他把那句话看了三遍——"谢谢你没有放弃我。"</p>\n<p>然后他拿起手机，给温叙白发了一条消息：</p>\n<p>【叙白，我看到采访了。】</p>\n<p>【嗯。】</p>\n<p>【"谢谢你没有放弃我"——你什么时候变得这么会说话了？】</p>\n<p>【一直都会。只是以前不说。】</p>\n<p>【以后多说。】</p>\n<p>【看心情。】</p>\n<p>陆峥寒笑了，把手机放下。</p>\n<p>但他把那篇报道的那一页拍了下来，设成了手机壁纸。</p>\n<p>晚上回家，温叙白在厨房做饭——是的，温叙白做饭的次数越来越多了，虽然手艺依然一般。</p>\n<p>"今天你做饭？"陆峥寒走进厨房。</p>\n<p>"嗯。"</p>\n<p>"什么菜？"</p>\n<p>"番茄炒蛋和清炒西兰花。"温叙白头也不回，"别期望太高。"</p>\n<p>陆峥寒靠在门框上看着他忙碌的背影，忽然觉得——</p>\n<p>这就是他想要的生活。</p>\n<p>不需要轰轰烈烈，不需要镁光灯和奖杯。只要这个人站在厨房里，系着围裙，手忙脚乱地炒菜，偶尔回头看他一眼。</p>\n<p>"叙白。"</p>\n<p>"嗯？"</p>\n<p>"我爱你。"</p>\n<p>温叙白手一抖，铲子差点掉了。</p>\n<p>"……你突然说这个干什么？"</p>\n<p>"看了你的采访，想说。"</p>\n<p>温叙白背对着他，耳尖红得发烫。</p>\n<p>"做饭呢。"他说，"别打扰。"</p>\n<p>"好。"陆峥寒笑了，"那我等着吃。"</p>\n<p>厨房里油烟弥漫，菜烧得一般，但两个人都笑了。</p>\n<div class="hook">**【本章钩子：专访曝光，温叙白首次公开谈论陆峥寒对自己的影响——"他让我有了安全感"。一句"谢谢你没有放弃我"让全网泪目。而厨房里那句突如其来的"我爱你"，让霸总也红了耳尖。甜蜜日常的巅峰，即将到来……】**</div>\n'},
  {title:'第99章 陆瑶催婚，全家出动', vol:3, html:'<p>UIA金奖之后，温叙白和陆峥寒的"国民CP"热度持续走高。</p>\n<p>而最先坐不住的，是陆瑶。</p>\n<p>那天周末，陆瑶杀到了私宅。</p>\n<p>"哥！叙白哥！"她风风火火地冲进来，"你们什么时候结婚？"</p>\n<p>温叙白正在客厅画图，手里的笔顿了一下。陆峥寒从厨房探出头。</p>\n<p>"瑶瑶，你吃了没？"陆峥寒问。</p>\n<p>"别转移话题！"陆瑶一屁股坐到沙发上，"你们都在一起快一年了，全网都等着你们结婚呢！"</p>\n<p>"谁等着？"温叙白淡淡地问。</p>\n<p>"我！奶奶！叙白哥你爸妈！全网粉丝！"陆瑶掰着手指头数，"奶奶上次打电话让我问你哥，你哥说\'看叙白\'。我问你，你也说\'看峥寒\'。你们到底谁看谁？"</p>\n<p>陆峥寒从厨房出来，端着三杯茶。</p>\n<p>"瑶瑶，喝茶。"</p>\n<p>"不喝！你不回答我我不喝！"</p>\n<p>"好好好。"陆峥寒坐下来，"我跟你说实话——我想求婚，但还没想好怎么求。"</p>\n<p>温叙白转头看他——这是他第一次听陆峥寒说"求婚"。</p>\n<p>"你——"</p>\n<p>"叙白，你别急。"陆峥寒对他笑了笑，"我在想了。"</p>\n<p>"我不急。"温叙白面无表情。</p>\n<p>"你耳朵红了。"</p>\n<p>"厨房热。"</p>\n<p>陆瑶在旁边看着两人，翻了个白眼："你们俩能不能别在我面前秀恩爱？我单身！"</p>\n<p>温叙白和陆峥寒同时看了她一眼。</p>\n<p>"什么？"陆瑶警惕地问。</p>\n<p>"有没有考虑过林舟？"陆峥寒忽然说。</p>\n<p>"什么？！"陆瑶脸红了，"哥你说什么呢！"</p>\n<p>"林舟对你有意思，你知道的。"</p>\n<p>"我——他——我不知道！"陆瑶站起来，"我来催你们结婚的，怎么扯到我身上了！"</p>\n<p>温叙白难得嘴角弯了弯。</p>\n<p>陆瑶走后，客厅安静下来。</p>\n<p>温叙白继续画图，陆峥寒坐在他旁边看文件。</p>\n<p>过了很久，温叙白忽然开口："你刚才说的——想求婚？"</p>\n<p>陆峥寒放下文件，认真地看着他："叙白，你觉得呢？"</p>\n<p>"我觉得什么？"</p>\n<p>"你觉得——时候到了吗？"</p>\n<p>温叙白放下笔，转过身看着他。</p>\n<p>两个人对视了几秒。</p>\n<p>"峥寒，我没有想过结婚。"温叙白说，"不是不想，是——"</p>\n<p>"是什么？"</p>\n<p>"是我从来没想过有人会跟我求婚。"他低下眼，"你知道我的性格。我从前觉得，我这辈子可能就是一个人。"</p>\n<p>陆峥寒看着他，心口发紧。</p>\n<p>"但现在不一样了。"温叙白抬头，眼底有微光，"现在我知道——有你在。"</p>\n<p>"所以——"</p>\n<p>"所以你说的求婚，我——"温叙白顿了一下，"我不反对。"</p>\n<p>陆峥寒看着他，忽然笑了。</p>\n<p>"温叙白。"</p>\n<p>"嗯？"</p>\n<p>"你\'不反对\'就是我听过的最动人的回答。"</p>\n<p>温叙白别开脸，耳尖红得不行。</p>\n<p>"别说了。"</p>\n<p>"好。"陆峥寒笑着说，"你画图吧。"</p>\n<p>温叙白重新拿起笔，但手微微抖了一下。</p>\n<p>那天晚上，陆峥寒一个人坐在阳台上，对着手机备忘录打字。</p>\n<p>他在列求婚计划。</p>\n<p>地点：城东图书馆？滨水文化中心？私宅？</p>\n<p>时间：初雪？纪念日？生日？</p>\n<p>方式：……</p>\n<p>他打了一行字又删掉，反复了好几次。</p>\n<p>最后，他放下手机，看着夜空。</p>\n<p>"叙白。"他轻声说，虽然温叙白在客厅里听不到。</p>\n<p>"我会给你最好的。"</p>\n<div class="hook">**【本章钩子：陆瑶催婚，全家出动。温叙白一句"不反对"让陆峥寒心花怒放——求婚计划正式启动！霸总翻遍攻略，只为给清冷美人一场最完美的求婚。第四卷的甜蜜高潮即将到来……】**</div>\n'},
  {title:'第100章 温叙白心动，未来可期', vol:3, html:'<p>温叙白发现自己最近总是在想"求婚"这件事。</p>\n<p>虽然陆峥寒之后再也没提过，但温叙白敏锐地察觉到——陆峥寒在做准备。</p>\n<p>首先是行程上的变化。陆峥寒开始频繁地和林舟密谋，每次他走进书房，林舟就立刻切换话题。其次是情绪上的变化。陆峥寒最近总是欲言又止，看他的眼神带着一种奇怪的光——期待又紧张。</p>\n<p>温叙白没有戳破。</p>\n<p>他甚至在想——如果陆峥寒真的求婚，他该怎么回答。</p>\n<p>"嗯"？太冷淡了。</p>\n<p>"好"？太随便了。</p>\n<p>"我愿意"？太像电视剧了。</p>\n<p>他想了很久，想不出答案。</p>\n<p>那天下午，温叙白去了一趟城东图书馆——他最近经常去。因为温怀瑾社区图书馆的施工已经启动了，他需要定期去工地查看进度。</p>\n<p>工地就在城东图书馆旁边——陆峥寒选的地址，紧邻原来的集装箱图书馆。新的社区图书馆将由两座建筑共同构成一个社区文化中心。</p>\n<p>温叙白站在工地上，看着已经打好地基的建筑轮廓。</p>\n<p>施工队的负责人跑过来："温老师，基础工程已经完成了，下周开始主体结构施工。按照您的图纸，预计明年三月可以落成。"</p>\n<p>"三月。"温叙白重复了一下——三月是他爷爷的生日月。</p>\n<p>"是的。我们按照您的要求，把落成时间定在三月。"</p>\n<p>温叙白点了点头，心里涌起一股暖意。</p>\n<p>陆峥寒连这个细节都考虑到了。</p>\n<p>晚上回家，陆峥寒已经做好了饭。</p>\n<p>"今天去工地了？"他问。</p>\n<p>"嗯。基础工程完成了。"</p>\n<p>"那就快了。"陆峥寒把菜端上桌，"明年三月——刚好是爷爷的生日月。"</p>\n<p>温叙白看着他："是你让施工队赶在这个时间点的？"</p>\n<p>"我只是建议了一下。"陆峥寒笑了笑，"落成那天，我们带爷爷的图纸去新图书馆看看。"</p>\n<p>"好。"</p>\n<p>吃饭的时候，温叙白忽然说："峥寒。"</p>\n<p>"嗯？"</p>\n<p>"你最近是不是在筹备什么？"</p>\n<p>陆峥寒夹菜的手顿了一下："什么？"</p>\n<p>"你每次和林舟说完话就立刻切换话题，你在手机备忘录上打字又删掉，而且——"温叙白看着他，"你最近看我的眼神很奇怪。"</p>\n<p>"哪里奇怪？"</p>\n<p>"期待又紧张。像是在等什么。"</p>\n<p>陆峥寒沉默了两秒，然后笑了："叙白，你什么时候变得这么敏锐了？"</p>\n<p>"我一直很敏锐。"</p>\n<p>"好。"陆峥寒放下筷子，认真地看着他，"我确实在筹备一件事。但现在还不能告诉你。"</p>\n<p>"是求婚吗？"</p>\n<p>陆峥寒愣住了。</p>\n<p>温叙白看着他，表情清冷，但眼底有不易察觉的温柔。</p>\n<p>"你不用否认。"他说，"你想做什么就做什么，我不需要提前知道。"</p>\n<p>"叙白——"</p>\n<p>"但我跟你说一件事。"温叙白打断他，"我一直在想，如果你求婚，我该怎么回答。"</p>\n<p>陆峥寒呼吸微顿。</p>\n<p>"我想了很多答案，都觉得不对。"温叙白说，"\'嗯\'太冷淡，\'好\'太随便，\'我愿意\'太像电视剧。"</p>\n<p>"后来我想明白了——"他看着陆峥寒，眼底有微光在闪烁，"我不需要准备答案。因为到那一刻，我心里想什么，就说什么。"</p>\n<p>陆峥寒看着他，心口像是被什么东西击中了。</p>\n<p>"叙白——"</p>\n<p>"所以你慢慢准备。"温叙白拿起筷子，继续吃饭，"不用着急。"</p>\n<p>陆峥寒看着他，忽然笑了——笑着笑着，眼眶就红了。</p>\n<p>"好。"他说，"我会准备到最好。"</p>\n<p>晚饭后，两人在阳台上看月亮。</p>\n<p>"峥寒。"</p>\n<p>"嗯？"</p>\n<p>"不管你什么时候求，不管你怎么求——"温叙白靠在他肩上，声音轻得像夜风，"我的答案不会变。"</p>\n<p>陆峥寒收紧了环在他腰间的手臂。</p>\n<p>月光如水，夜风温柔。</p>\n<p>这一刻，未来的轮廓已经清晰可见。</p>\n<div class="hook">**【本章钩子：温叙白看穿了陆峥寒的求婚计划——但他没有催促，只说"我的答案不会变"。最动人的承诺不是"我愿意"，而是"不管什么时候、怎么求，答案不会变"。求婚进入倒计时……】**</div>\n'},
