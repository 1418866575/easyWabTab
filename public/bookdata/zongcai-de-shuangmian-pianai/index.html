const chapters = [
  {title:'第1章 陆总，好像有点不对劲', vol:1, html:'<p>夜色鎏金，霓虹铺满整座海城的金融中心。</p>\n<p>顶奢酒店顶层的商业晚宴，汇聚了全城半数顶尖权贵，<span class="annot" data-tip="形容服饰华丽，多指女性的妆饰，也借指繁华热闹的场合">衣香鬓影</span>，<span class="annot" data-tip="互相举杯敬酒，形容宴会上交杯换盏的热闹场面">觥筹交错</span>，空气中弥漫着高级香槟与昂贵香水的混合气息。</p>\n<p>全场最核心、最不敢让人随意靠近的位置，坐着陆峥寒。</p>\n<p>男人一身剪裁极致的黑色高定西装，肩线冷硬利落，身姿挺拔如松。墨色短发一丝不苟，眉眼深邃凌厉，薄唇紧抿，下颌线冷峭分明，周身萦绕着生人勿近的凛冽气场。</p>\n<p>他只是安静坐在那里，便压得全场氛围都低了几分。</p>\n<p>海城无人不知陆峥寒的名字——不是因为好事。三年前他接手陆氏时，集团正值多事之秋，董事会里五个老狐狸轮番试探这个二十出头的年轻人。一个月内，两个被踢出董事局，一个主动请辞，剩下两个从此在陆峥寒面前连呼吸都放轻了。</p>\n<p>从那以后，"阎王"这个外号就在海城商界传开了。没人敢当面叫，但背后提到陆氏总裁时，用的都是这个字。</p>\n<p>此刻，几位身价数十亿的老板围在一旁，小心翼翼说着合作事宜，语气极尽谦卑，连呼吸都刻意放轻，生怕惹得这位冷面大佬不悦。</p>\n<p>“陆总，这次城东科创园的项目，我们公司诚意十足，还希望您能多给一次机会……”</p>\n<p>话音未落，陆峥寒眼皮都未抬一下，修长的指尖轻轻摩挲着高脚杯壁，骨节分明的手透着冷白的质感。</p>\n<p>他声音低沉冰冷，没有一丝温度，字字透着不容置喙的强势：“资质不够，不必多谈。”</p>\n<p>短短六个字，直接否决了对方所有的侥幸。</p>\n<p>那老板脸色瞬间惨白，尴尬地僵在原地，不敢再多说半个字。周围众人见状，更是无人敢上前搭话，愈发敬畏这位气场骇人的陆总。</p>\n<p>全场敬畏、胆怯、仰望的目光尽数落在陆峥寒身上，没人敢想象，这位在外杀伐狠绝的霸总，私下里会是另一副截然相反的模样。</p>\n<p>就在这时，宴会厅入口处传来一阵细微的骚动。</p>\n<p>一道清挺修长的身影缓步走入会场，瞬间攫取了全场半数目光。</p>\n<p>温叙白身着一袭纯白色手工西装，面料干净无瑕，贴合身形勾勒出清瘦挺拔的线条。他眉眼清浅疏离，皮肤冷白通透，五官精致绝尘，气质清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，像是不染尘埃的月光，自带疏离清冷的滤镜。</p>\n<p>入场时，几个认出他的商界大佬起身打招呼，他微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>回应，脚步没有停顿。一个伸出手的想和他握手，他目光淡淡扫过那只手，没有接——但也没有让对方难堪，侧身拿起旁边的香槟杯作为替代，举杯示意。</p>\n<p>动作自然得像呼吸，但那只伸出去又缩回的手，足以说明一切。</p>\n<p>而原本淡漠端坐、对外界一切漠不关心的陆峥寒，在看到那道白色身影的瞬间，周身凛冽的寒气骤然褪去。</p>\n<p>速度快得让人猝不及防。</p>\n<p>方才还冷得像万年寒冰的眉眼，瞬间柔和下来，眼底翻涌着外人看不懂的细碎温柔与<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，连紧绷的下颌线都悄然松弛。</p>\n<p>周围一众商界大佬亲眼目睹这极致反差，全都愣住了，心里纷纷泛起疑惑：陆总这是……怎么了？</p>\n<p>不等众人反应，陆峥寒已经起身，径直越过众人，步伐沉稳且带着一丝不易察觉的急切，朝着温叙白的方向走去。</p>\n<p>原本围在他身边的众人，下意识纷纷退让，眼神里满是震惊与错愕。</p>\n<p>这位连千亿项目都面不改色的冷面总裁，竟然会主动起身走向别人？这简直是破天荒的第一次。</p>\n<p>温叙白刚站稳身形，察觉到身前笼罩下来一片阴影，清冷的目光抬眸望去，正好对上陆峥寒深邃的眼眸。</p>\n<p>四目相对的瞬间，温叙白眼底没有丝毫波澜，语气平淡疏离，带着恰到好处的礼貌距离：“陆总。”</p>\n<p>简单两个字，清冷克制，疏离得体，完全是对待普通合作对象的官方态度。</p>\n<p>陆峥寒看着他干净清冷的眉眼，感受着他刻意拉开的距离，心里瞬间泛起委屈。</p>\n<p>在外人面前，他是高高在上、无人敢惹的陆总，可在温叙白面前，他只想放下所有锋芒，求一点专属温柔。</p>\n<p>男人眼底瞬间染上一层浅浅的落寞，完美开启装可怜模式，声音压得低沉软糯，褪去了所有强势冰冷，带着一丝不易察觉的沙哑与委屈：“叙白，你终于来了。”</p>\n<p>旁边近距离听到这句话的几位老总，大脑瞬间一片空白，彻底懵在原地。</p>\n<p>这……这真的是那个冷血无情、惜字如金的陆峥寒？</p>\n<p>温叙白对此早已习惯，只是淡淡扫了他一眼，内心毫无波澜。</p>\n<p>他天生感情迟钝，完全没听出这语气里的依赖与委屈，只当是大佬客套的寒暄。再加上陆峥寒此刻站姿规整、衣着得体，看起来和平时并无不同，他只当对方是正常打招呼。</p>\n<p>温叙白微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气依旧清冷：“路上堵车，来晚了。”</p>\n<p>陆峥寒见状，顺势微微俯身，悄悄拉近两人的距离，刻意放软了眉眼，一副温顺无辜的模样，低声道：“我等你很久了，一直没人过来陪我。”</p>\n<p>这话落在旁人耳中，足以惊掉一地眼球。</p>\n<p>谁能想到，堂堂陆氏掌权人，竟然会主动说自己没人陪，姿态放得如此之低？</p>\n<p>可温叙白依旧毫无察觉，他视线落在陆峥寒干净整洁的西装袖口，确认对方身上没有杂乱污渍、没有异味，勉强符合自己的洁癖底线，才淡淡开口：“陆总事务繁忙，不必特意等我。”</p>\n<p>迟钝的他没有听出那语气里的依赖——他甚至回头确认了一下身后有没有别人，因为在他的认知里，没有人会用这种语气跟他说话。</p>\n<p>陆峥寒眼底的委屈更浓，顺势得寸进尺，轻轻蹙起眉头，装作略显疲惫的样子，声音软软的：“可是我很忙，经常没时间吃饭。没人管我，没人给我煮粥。”</p>\n<p>站在不远处、全程目睹全程的特助林舟，默默在心里叹气。</p>\n<p>又来了。</p>\n<p>他家老板专属的、只针对温先生的戏精模式，正式开启。</p>\n<p>明明半小时前处理跨国紧急文件，<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>、气场全开，连眉头都没皱一下，此刻却能面不改色地说自己累、说无聊，演技堪称炉火纯青。</p>\n<p>温叙白沉默两秒，看着男人略显低落的模样，清冷的心底难得泛起一丝松动。</p>\n<p>他性子护短，见不得自己熟悉的人低落委屈，哪怕只是对方随口的抱怨。</p>\n<p>思索片刻，温叙白抬手，从随身干净无菌的口袋里，拿出一颗独立包装的薄荷糖，递了过去。</p>\n<p>指尖干净白皙，触感微凉，带着淡淡的清冽气息。</p>\n<p>“吃颗糖，缓一缓。”</p>\n<p>清冷的嗓音，难得带上一丝浅浅的安抚意味。</p>\n<p>陆峥寒的目光瞬间牢牢锁在他白皙纤细的指尖上，瞳孔微缩，心底瞬间被填满暖意。</p>\n<p>他要的从来不是糖，而是温叙白独一份的温柔与迁就。</p>\n<p>男人眼底飞快掠过一抹得逞的笑意，转瞬又伪装出乖巧可怜的模样，小心翼翼接过糖果，指尖刻意轻轻蹭过温叙白的指尖。</p>\n<p>触感微凉柔软，让他心头一颤。</p>\n<p>温叙白轻微顿了一下，下意识想收回手，洁癖让他不喜欢陌生人的触碰。</p>\n<p>可余光瞥见陆峥寒乖巧温顺的模样，他又硬生生忍住了擦拭的冲动。</p>\n<p>算了，陆峥寒干净整洁，不算脏。</p>\n<p>这是温叙白独一份的、连他自己都未曾察觉的破例。</p>\n<p>陆峥寒将那颗薄荷糖小心翼翼攥在掌心，像是攥住了世间最珍贵的宝贝，抬眸望着温叙白，眼神温顺又无辜：“只有糖吗？”</p>\n<p>温叙白挑眉，清冷眉眼带着一丝疑惑：“不然？”</p>\n<p>陆峥寒微微低头，语气软糯委屈，带着恰到好处的示弱：“能不能……稍微陪我一会儿？”</p>\n<p>全场众人屏息凝神，不敢出声，心里只剩同一个念头：</p>\n<p>这真的是那位让人闻风丧胆的陆阎王？</p>\n<div class="hook">**【本章钩子：温叙白尚且迟钝无感，可全场所有人都看在眼里，陆峥寒的温柔与示弱，从来只给了他一人，这场双向反差的偏爱，才刚刚拉开序幕。】**</div>\n'},
  {title:'第2章 陆总私下，太会装了', vol:1, html:'<p>宴会厅的喧嚣仿佛被无形的屏障隔绝在外。</p>\n<p>周围的商界大佬们纷纷假装交谈、举杯寒暄，余光却全都不受控制地落在中心的两人身上，心底的震惊久久无法平息。</p>\n<p>谁也不敢相信，一向冷漠寡言、不近人情的陆峥寒，竟然会在人前放下所有身段，对着一位设计师示弱求陪伴。</p>\n<p>温叙白看着眼前男人温顺无辜的模样，心底没有丝毫暧昧悸动，只单纯觉得，高高在上的陆总，私下里竟然也会有这般疲惫脆弱的时刻。</p>\n<p>他性格本就护短心软，只是平日里清冷的外表太过唬人，从不轻易对外展露情绪。面对陆峥寒直白的示弱，他无法视而不见。</p>\n<p>“可以。”温叙白淡淡应声，语气清冷平静，“我陪你坐一会儿。”</p>\n<p>得到想要的答复，陆峥寒眼底瞬间亮起细碎的光亮，落寞委屈的神色一扫而空，嘴角险些控制不住上扬。</p>\n<p>但他深谙循序渐进的道理，刻意依旧维持着温顺委屈的模样，不敢太过张扬，生怕眼前人看出破绽，收回这份难得的迁就。</p>\n<p>“好。”男人乖乖应声，姿态温顺得不像话，主动侧身让出身后安静的靠窗卡座，“这里干净，没人打扰你。”</p>\n<p>他细致入微，精准拿捏温叙白重度洁癖、不喜喧闹的喜好，所有体贴都藏在细节里。</p>\n<p>温叙白微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，没有推辞，径直走到卡座内侧坐下。</p>\n<p>落座后，他习惯性抬手整理袖口，坐姿端正挺拔，脊背笔直，分毫不乱，完美契合他极致强迫症的性格，周身干净清冷的气质让人不敢<span class="annot" data-tip="轻慢，不恭敬，冒犯">亵渎</span>。</p>\n<p>陆峥寒紧随其后坐下，刻意和他挨得极近，两人手肘几乎相贴，隔着薄薄的西装面料，能清晰感受到彼此的体温。</p>\n<p>温热的触感传来，陆峥寒心底一阵满足，浑身的疲惫与烦躁瞬间消散殆尽。</p>\n<p>不远处，特助林舟默默扶额，内心早已无力吐槽。</p>\n<p>谁能想到，早上开会时因为一份报表排版不规整，冷脸训斥整个部门、气场压迫全场的陆总，此刻会乖乖挨着温先生坐着，乖巧得像个求夸奖的小朋友。</p>\n<p>反差之大，堪称判若两人。</p>\n<p>卡座相对安静，隔绝了大部分喧闹。温叙白闲来无事，目光淡淡扫过窗外的城市夜景，霓虹闪烁，车水马龙，眼底一片平和清冷。</p>\n<p>陆峥寒的视线却从未离开过他分毫，目光黏在他清绝的侧脸上，贪恋又温柔，眼底的偏爱藏都藏不住。</p>\n<p>看了片刻，他故意轻轻蹙起眉峰，抬手虚按了一下胃部，姿态轻微自然，完美复刻出疲惫不适的模样。</p>\n<p>细微的动作没能逃过温叙白的眼睛。</p>\n<p>温叙白余光瞥见，清冷的眉峰微不可察地动了动，转头看向他：“胃不舒服？”</p>\n<p>陆峥寒心中一喜，上钩了。</p>\n<p>他立刻顺势加重了几分委屈的神色，轻轻点头，声音压低，带着一丝隐忍的沙哑，看起来格外惹人怜惜：“嗯，老毛病了，今天太忙，没来得及吃饭。”</p>\n<p>这话半真半假。</p>\n<p>他今天行程爆满，的确没空好好吃饭，但以他的身体素质和常年调理的肠胃，根本不至于不舒服。所谓的胃痛，完完全全是装出来的。</p>\n<p>唯一的目的，就是求温叙白的关心和安慰。</p>\n<p>温叙白对此全然不知，看着他略显苍白隐忍的模样，心底的迁就更甚。</p>\n<p>他有严重的强迫症，作息规律、三餐定时，最不能理解的就是肆意糟蹋身体的行为。可面对陆峥寒，他只剩下心软。</p>\n<p>“空腹喝酒、熬夜劳累，胃病只会越来越重。”温叙白语气带着一丝浅浅的责备，清冷的嗓音软软的，毫无威慑力，“不疼？”</p>\n<p>陆峥寒立刻顺着台阶往下走，眼底氤氲出一层浅浅的水汽，眼神无辜又委屈：“疼，有点难受。”</p>\n<p>他微微俯身，刻意压低身形，拉近两人的距离，语气软糯撒娇：“叙白，能不能帮我看看？”</p>\n<p>一旁偷听的林舟彻底无语。</p>\n<p>老板，您上次急性肠胃炎疼到冒冷汗都硬扛着开完跨国会议，现在装胃痛求安抚，演技未免太熟练了！</p>\n<p>温叙白感情迟钝，完全看不出破绽，只当他是真的难受。</p>\n<p>他看着男人隐忍委屈的模样，心软得一塌糊涂，也顾不上洁癖带来的抵触，微微倾身，抬手想去查看他的状态。</p>\n<p>干净白皙的指尖刚要靠近，陆峥寒忽然微微侧身，精准躲开了所有人的视线，同时顺势将大半重量悄悄靠了过来。</p>\n<p>温热的身躯贴了过来，带着清冽的雪松香气，彻底笼罩住温叙白。</p>\n<p>温叙白身体微僵，下意识想要后退。</p>\n<p>他重度洁癖，极其排斥他人近距离触碰，平日里连陌生人的擦肩接触都会让他不适许久，必须立刻消毒擦拭。</p>\n<p>可此刻，靠着他的是陆峥寒。</p>\n<p>身形挺拔干净，衣着整洁无异味，气息清冽好闻，是唯一能让他勉强接受的近距离触碰。</p>\n<p>更重要的是，对方此刻正虚弱不适，他做不出推开的举动。</p>\n<p>短短两秒的迟疑，温叙白硬生生压住了心底的洁癖本能，没有推开，甚至下意识微微稳住了身形，方便对方倚靠。</p>\n<p>陆峥寒感受着怀中人的温顺迁就，心底暖意翻涌，舒服得几乎叹气。</p>\n<p>他微微垂眸，长长的睫毛遮住眼底得逞的笑意，语气愈发委屈软糯：“靠一会儿就好，别推开我，好不好？”</p>\n<p>近乎撒娇的语气，彻底打破了两人之间所有的疏离边界。</p>\n<p>温叙白喉间微顿，清冷的心跳莫名乱了半拍，却依旧没能读懂这份极致的偏爱与套路。</p>\n<p>他只当是强者偶尔的脆弱，沉默两秒，淡淡应声：“嗯。”</p>\n<p>一个单音节，温柔又纵容。</p>\n<p>远处几位一直关注这边的企业老总，彻底看傻了眼，互相交换着震惊的眼神，心底满是难以置信。</p>\n<p>谁能想到，海城第一冷面霸总，竟然会在公众场合，靠着一位设计师撒娇求安慰？</p>\n<p>这若是传出去，整个海城商圈都要彻底震动！</p>\n<p>就在这时，一道不合时宜的脚步声缓缓靠近。</p>\n<p>项目合作方的张总端着酒杯，满脸堆笑，不识趣地走上前，想要攀附寒暄：“陆总，温老师，二位真是郎才女貌，难得同框，我敬二位一杯……”</p>\n<p>话音未落，原本温顺乖巧、靠着温叙白示弱的陆峥寒，周身气场瞬间骤变。</p>\n<p>方才眼底的温柔委屈尽数褪去，瞬间覆上刺骨的冰冷<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，眉眼凌厉，气场骇人，周身压迫感扑面而来。</p>\n<p>他甚至没有抬头，仅仅是冷眸斜睨一眼，那股杀伐狠绝的霸总气场，便死死压得张总脚步骤停。</p>\n<p>“滚。”</p>\n<p>一字落地，冰冷刺骨，毫无温度。</p>\n<p>张总脸上的笑容瞬间僵死，脸色煞白，手里的酒杯都微微晃动，险些脱手。</p>\n<p>全场瞬间死寂，无人敢出声。</p>\n<p>可下一秒，陆峥寒像是察觉到怀里人的细微僵硬，怕自己冰冷的语气吓到温叙白，转头看向他时，眼底的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>瞬间消融殆尽，又变回那个无辜委屈的模样。</p>\n<p>反差快得让人眼花缭乱。</p>\n<p>他轻轻蹭了蹭温叙白的肩头，语气软糯无害，带着一丝小心翼翼的讨好：“叙白，吵到你了。”</p>\n<p>全程目睹极致变脸的温叙白：“……”</p>\n<p>他终于隐约察觉到，陆峥寒私下的样子，好像真的和外界传闻的，完全不一样。</p>\n<div class="hook">**【本章钩子：人前阎王冷面无情，人后戏精撒娇黏人，陆峥寒的双重面孔只为温叙白一人切换，迟钝美人的心动试探，正式开启！】**</div>\n'},
  {title:'第3章 洁癖美人的独家破例', vol:1, html:'<p>死寂的氛围持续了足足三秒。</p>\n<p>被当众冷斥的张总满脸窘迫，进退两难，站在原地手足无措，额头渗出细密的冷汗。</p>\n<p>他怎么也想不到，自己只是上前敬酒攀谈，竟然会惹得陆峥寒如此不悦。此刻他终于彻底明白，这位冷面总裁的温柔与耐心，从来都只给身边那位清冷的温设计师。</p>\n<p>旁人半点沾染不得。</p>\n<p>温叙白看着眼前极致反差的男人，心底掠过一丝微妙的异样情绪。</p>\n<p>他终于真切感受到，陆峥寒对别人的冷漠狠厉，和对自己的温顺迁就，是截然不同的两种模样。</p>\n<p>可这份独一无二的特殊对待，落在感情迟钝的他心里，只被简单归为：两人私交较好，所以陆峥寒对自己格外包容温和。</p>\n<p>他完全没有往暧昧、偏爱、心动的方向多想半分。</p>\n<p>清冷的眉眼掠过一丝浅浅的无奈，温叙白抬眸看向僵在原地的张总，语气平淡温和，恰到好处地解围：“张总不必在意，陆总身体不适，心情欠佳。”</p>\n<p>一句话，体面化解了对方的窘迫，也给足了所有人台阶。</p>\n<p>张总如蒙大赦，连忙点头应声，不敢再多停留半分，躬身致歉后快步退离，再也不敢上前打扰。</p>\n<p>喧闹再次归于平静。</p>\n<p>卡座里，氛围再度变得柔和私密。</p>\n<p>陆峥寒闻言，眼底掠过一丝浅浅的笑意，心头暖意涌动。</p>\n<p>他就知道，他的叙白永远温柔通透，永远会下意识护着他，哪怕他刚刚当众冷脸斥人，显得格外不近人情。</p>\n<p>男人微微抬眸，目光黏在温叙白清绝的眉眼上，眼底满是温顺依赖，语气带着一丝小小的委屈：“刚刚吓到你了？”</p>\n<p>温叙白轻轻摇头，清冷声线平稳无波：“没有。无关人而已，不必放在心上。”</p>\n<p>他的护短向来直白又极致，自己可以觉得陆峥寒矫情麻烦，却容不得旁人半点冒犯与打扰。</p>\n<p>陆峥寒闻言，心底愈发满足，顺势更加肆无忌惮地贴近他，半边身子都轻轻靠在温叙白肩头，姿态慵懒又依赖。</p>\n<p>温热的呼吸轻轻扫过耳畔，带着清冽的雪松香气，温柔又<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。</p>\n<p>“还是叙白最好。”男人低声呢喃，语气软糯<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，满是依赖。</p>\n<p>温叙白身形微僵，耳廓微微泛起一层浅淡的薄红，快得让人难以察觉。</p>\n<p>他素来清冷自持，极少有人能靠他这么近，更没人敢这般贴着他耳畔低声说话。</p>\n<p>洁癖与强迫症的本能让他想要侧身避开，想要擦拭被触碰的肌肤，维持极致的干净规整。</p>\n<p>可看着身边男人温顺依赖的模样，他所有的本能抵触，全都硬生生压了下去。</p>\n<p>不仅没有推开，甚至下意识微微偏头，迁就了他的倚靠姿势。</p>\n<p>这是独属于陆峥寒的、无人知晓的独家破例。</p>\n<p>温叙白垂眸看着自己干净白皙的指尖，心底默默思索：或许是陆峥寒平日里太过紧绷强势，难得展露脆弱，所以自己才会格外包容。</p>\n<p>他依旧迟钝，依旧看不懂这份刻意的亲近与示弱背后，藏着<span class="annot" data-tip="指事情谋划了很久，多含贬义，但此处指陆峥寒对温叙白的长久心意">蓄谋已久</span>的深爱与偏爱。</p>\n<p>陆峥寒将他细微的情绪变化尽收眼底，眼底笑意愈发浓郁，心里清楚，自己的步步靠近，早已让温叙白一次次打破底线。</p>\n<p>温水煮青蛙，慢慢来，他总有一天，能让这位清冷迟钝的美人，彻底满心满眼都是自己。</p>\n<p>“胃还疼？”温叙白收回思绪，回归正题，目光落在他胃部的位置，带着认真的关切。</p>\n<p>陆峥寒立刻收敛思绪，重新切换回委屈可怜模式，轻轻点头，眉头微蹙，看起来格外虚弱：“嗯，还有点疼。”</p>\n<p>为了让演技更加逼真，他甚至刻意放缓了呼吸，眼底染上一层浅浅的疲惫与隐忍。</p>\n<p>“晚宴的餐食重油重盐，不干净，你不能吃。”温叙白扫了一眼桌上精致的餐点，洁癖发作，下意识皱眉，“我车里有温热的养胃粥，是我自己早上煮的，干净卫生。”</p>\n<p>他有严重强迫症，饮食向来极简干净，三餐定时，自带食材，从不吃外面重油重盐、卫生无保障的食物。</p>\n<p>陆峥寒闻言，眼底瞬间亮了起来。</p>\n<p>自己煮的粥？</p>\n<p>是独一份的干净温柔，是旁人永远得不到的专属待遇。</p>\n<p>男人心底狂喜，面上却依旧装作虚弱委屈的模样，轻轻<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气软糯：“好，都听你的。”</p>\n<p>乖巧温顺，全然没有半点霸总姿态。</p>\n<p>温叙白看他虚弱的样子，心底软得一塌糊涂，当即起身：“我去给你拿，你在这里等着，别乱走动，也别随便吃东西。”</p>\n<p>细致的叮嘱，满是温柔的迁就。</p>\n<p>“嗯。”陆峥寒乖乖应声，眼神黏在他身上，寸步不离，“我等你回来。”</p>\n<p>温叙白不再多言，转身迈步离开，身姿清挺绝尘，白色西装在璀璨灯光下干净得不染一丝尘埃。</p>\n<p>直到那道身影彻底走出宴会厅，陆峥寒脸上所有的委屈虚弱、温顺无辜瞬间尽数褪去。</p>\n<p>一秒切换回冷面霸总模式。</p>\n<p>他慵懒靠在卡座上，眉眼冷冽凌厉，周身气场瞬间恢复杀伐强势，薄唇微抿，眼底带着淡淡的冷意与掌控感。</p>\n<p>全程围观的特助林舟默默上前，压低声音汇报工作：“陆总，城西地块的竞标材料已经全部核对完毕，对手底价已经摸清，今晚可以最终敲定方案。另外，您今晚原本有一场跨国视频会议，需要推迟吗？”</p>\n<p>刚刚还虚弱胃痛、连饭都吃不下的陆总，此刻声线冷沉平稳，条理清晰，气场全开：“会议推迟明天上午，地块竞标方案微调，压底报价，明天直接拿下。”</p>\n<p>语速干脆利落，决策果断狠绝，丝毫没有半点不适虚弱的样子。</p>\n<p>林舟早已见怪不怪，默默应声：“好的陆总。”</p>\n<p>心里却默默吐槽：老板这演技，不去拿影帝真是可惜了，骗遍全场不说，连温先生都被他拿捏得死死的。</p>\n<p>陆峥寒指尖轻轻摩挲着方才温叙白递来的那颗薄荷糖，眼底覆上一层温柔的<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，语气淡淡带着笃定：“粥是他亲手煮的，干净养胃，比什么山珍海味都好。”</p>\n<p>他等这一份专属温柔，等了太久。</p>\n<p>可就在这时，林舟神色微变，再次低声开口：“陆总，刚刚有人拍到您和温先生近距离相处的画面，已经悄悄传到商圈私群里了，不少人在议论二位的关系。另外……沈先生也看到了消息，正在往这边赶来。”</p>\n<p>沈知予，温叙白的青梅竹马，多年追求者，一直对温叙白势在必得。</p>\n<p>陆峥寒眼底的温柔瞬间褪去，<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>骤升，眸色冷得刺骨。</p>\n<p>情敌登场，风波骤起。</p>\n<div class="hook">**【本章钩子：情敌空降围观修罗场！霸总装病套路刚得甜头，对手立刻上门抢人，双向拉扯的甜爽冲突正式升级！】**</div>\n'},
  {title:'第4章 修罗场对线，醋意爆棚', vol:1, html:'<p>酒店宴会厅的恒温冷气，仿佛在这一刻骤然降至冰点。</p>\n<p>陆峥寒指尖摩挲薄荷糖的动作缓缓停滞，指节微微收紧，那颗小小的糖果被攥得温热，却压不住他眼底翻涌的冷戾醋意。</p>\n<p>方才面对温叙白的温顺软糯、无辜委屈，尽数消散，取而代之的是商界阎王独有的偏执与占有欲。</p>\n<p>沈知予。</p>\n<p>这个名字，是陆峥寒藏在心底多年的刺。</p>\n<p>两人从小一同长大，沈知予是唯一能光明正大陪在温叙白身边、被温家人默认、被外界绑定亲近关系的人。哪怕温叙白从未动心，可这份独一无二的亲近资格，依旧让陆峥寒耿耿于怀多年。</p>\n<p>“速度倒是挺快。”</p>\n<p>陆峥寒薄唇轻启，声线冷得没有一丝温度，眉眼间覆上层层寒霜，周身气场压迫得旁边的林舟大气不敢出。</p>\n<p>“商圈群里的照片，全部压下去，查到源头，处理干净。”</p>\n<p>“另外，拦住他。”</p>\n<p>短短两句话，指令清晰狠绝，没有半分多余情绪，全然是<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>的陆氏掌权人姿态。</p>\n<p>林舟连忙应声：“是，我立刻安排。”</p>\n<p>他脚步刚动，宴会厅入口处便传来一阵温和雅致的脚步声。</p>\n<p>沈知予身着米白色定制西装，气质温润儒雅，眉眼带着恰到好处的温柔笑意，举手投足皆是翩翩贵公子的风范。作为沈家少爷，又是温叙白的青梅竹马，他在海城圈层向来口碑极好，待人谦和，从无半分骄矜傲气。</p>\n<p>此刻，他眼底的温和笑意却未达眼底，目光径直穿透喧闹人群，精准锁定靠窗卡座的陆峥寒，带着毫不掩饰的审视与敌意。</p>\n<p>他快步穿过人群，无视周遭众人探究的目光，径直走到卡座旁停下。</p>\n<p>“陆总。”</p>\n<p>沈知予率先开口，语气平淡疏离，带着明显的对峙意味，“刚刚群里的照片，我没看错的话，你刚刚一直在缠着叙白？”</p>\n<p>没有寒暄，没有客套，开门见山，句句针对。</p>\n<p>周围原本压低声音交谈的宾客瞬间安静下来，所有人都敏锐地察觉到，两大顶级大佬之间的火药味瞬间拉满。</p>\n<p>一边是杀伐狠绝、占有欲极强的陆氏总裁，一边是温润温柔、守护多年的青梅竹马，这场无形的对峙，远比商业博弈更让人屏息。</p>\n<p>陆峥寒抬眸，深邃的眼眸冷冽如冰，淡淡睨着眼前的人，姿态慵懒却极具压迫感。</p>\n<p>“缠着他？”</p>\n<p>他低声重复一遍，语气带着淡淡的嘲讽，“我和叙白私交甚好，轮得到沈少爷置喙？”</p>\n<p>“私交？”沈知予轻笑一声，眼底满是不认同，“陆总，别人不清楚，我还不清楚你吗？你对叙白的心思，根本不止私交。”</p>\n<p>“你在外人面前冷漠霸道，唯独对叙白百般迁就，甚至不惜放下身段撒娇示弱，你以为没人看得出来？”</p>\n<p>这话直白戳破了陆峥寒隐藏多年的小心思。</p>\n<p>陆峥寒眼底寒光骤闪，周身气压再次降低，危险气息弥漫开来。</p>\n<p>他隐藏多年的双面模样，小心翼翼在温叙白面前维系的温柔伪装，竟然被沈知予一眼看穿。</p>\n<p>“就算如此，又如何？”</p>\n<p>陆峥寒丝毫没有退让，气场全开，强势对峙，“我对他好，心甘情愿，光明正大。总比某些人，借着青梅竹马的名义，常年捆绑他、骚扰他来得体面。”</p>\n<p>字字铿锵，句句带刺，直接戳破沈知予多年的小心机。</p>\n<p>沈知予脸色微沉，温润的面具裂开一丝缝隙：“我和叙白二十多年的交情，不是陆总半路截胡就能比拟的。叙白性子迟钝、洁癖严重，最讨厌旁人刻意靠近纠缠，你这般步步紧逼，只会让他反感。”</p>\n<p>他太了解温叙白了。</p>\n<p>清冷、洁癖、强迫症、感情迟钝，最反感别人刻意套路、强行靠近。</p>\n<p>沈知予笃定，陆峥寒这般刻意装可怜、步步套路的行径，一旦被温叙白知晓，必然会被彻底排斥。</p>\n<p>可他不知道，陆峥寒的高明之处，就在于拿捏住了温叙白所有的软肋与破例。</p>\n<p>别人的靠近是冒犯，他的示弱，却是独一份的特例。</p>\n<p>陆峥寒非但不慌，反而眼底掠过一抹笃定的笑意，语气冷懒又嚣张：“反感？他刚刚肯为我破例，肯亲自去给我拿养胃粥，沈少爷觉得，这叫反感？”</p>\n<p>一句话，精准戳中沈知予的痛处。</p>\n<p>沈知予脸色瞬间彻底沉了下来，眼底满是难以置信与挫败。</p>\n<p>他追了温叙白二十多年，小心翼翼、步步谨慎，连靠近都怕惹对方不适，从未得到过这般特殊待遇。</p>\n<p>温叙白有严重洁癖，从不给任何人亲手准备食物，更不会容忍旁人肆意亲近依赖。</p>\n<p>可如今，却为陆峥寒打破了所有底线。</p>\n<p>“不可能。”沈知予低声否认，语气带着一丝慌乱，“叙白洁癖极致，怎么会……”</p>\n<p>话音未落，宴会厅门口传来一道清冷干净的脚步声。</p>\n<p>温叙白提着一个极简的白色保温桶，缓步走了进来。</p>\n<p>白色西装一尘不染，身姿清挺绝尘，眉眼清冷平和，指尖稳稳提着保温桶，姿态规整，完美契合他的强迫症习惯。</p>\n<p>他刚走到视线范围内，就清晰看到卡座前剑拔弩张的两人。</p>\n<p>一个气场冷戾、醋意翻涌，一个面色沉郁、满心不甘。</p>\n<p>浓烈的修罗场气息扑面而来。</p>\n<p>温叙白脚步微顿，清冷的眉峰轻轻蹙起，眼底掠过一丝淡淡的疑惑。</p>\n<p>沈知予看到他归来，瞬间收敛眼底的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，迅速切换回温润温柔的模样，率先迈步上前，语气温和：“叙白。”</p>\n<p>态度温柔体贴，和刚刚对峙陆峥寒的强势模样判若两人。</p>\n<p>反观陆峥寒。</p>\n<p>在看到温叙白的瞬间，他眼底所有的冷戾、醋意、偏执尽数褪去，速度快得惊人。</p>\n<p>一秒切换委屈无辜模式。</p>\n<p>他微微垂眸，眉眼耷拉，薄唇轻抿，一副被人欺负、满心委屈却不敢言说的温顺模样，连周身的气场都瞬间柔和下来。</p>\n<p>全程围观的林舟：……老板的变脸速度，依旧是业界天花板。</p>\n<p>温叙白目光在两人之间淡淡扫过，清冷出声：“你们在吵什么？”</p>\n<div class="hook">**【本章钩子：两大情敌正面极致对线，修罗场拉满！迟钝美人当场撞破对峙现场，陆总装可怜套路能否蒙混过关？】**</div>\n'},
  {title:'第5章 他只信陆峥寒的委屈', vol:1, html:'<p>空气瞬间凝滞。</p>\n<p>沈知予温柔的笑容僵在脸上，心底满是憋屈与不甘。</p>\n<p>他刚刚明明和陆峥寒针锋相对、互不相让，可转瞬之间，对方就能伪装出一副无辜委屈的模样，将所有锋芒尽数收敛，让人抓不到半点破绽。</p>\n<p>温叙白的目光澄澈清冷，不带任何偏袒，只是静静看着两人，等待答复。</p>\n<p>沈知予率先调整好情绪，压下心底的郁结，语气温和得体，试图占据有理的一方：“叙白，我刚刚进来，看到陆总气场太强，担心他吓到周围的人，就随口劝了两句，没什么大事。”</p>\n<p>他刻意弱化对峙，将自己塑造成温和劝解的一方，同时暗戳暗示陆峥寒强势霸道、脾气极差。</p>\n<p>说完，他转头看向陆峥寒，眼神带着隐晦的警告，示意对方适可而止。</p>\n<p>可陆峥寒根本不吃这一套。</p>\n<p>在温叙白面前，他从来不讲场面体面，只讲示弱卖惨。</p>\n<p>不等温叙白开口询问，陆峥寒已经微微起身，身形微僵，眉眼耷拉着，一副隐忍委屈的模样。</p>\n<p>他刻意放软声线，语气带着淡淡的无辜与低落，精准踩中温叙白心软护短的软肋：“叙白，我没有闹事。”</p>\n<p>“我只是在这里安静等你回来，沈少爷突然过来，说我纠缠你、打扰你，还说了很多不好听的话。”</p>\n<p>半真半假，委屈感拉满。</p>\n<p>他刻意弱化自己刚刚的强势对峙，只凸显自己无辜等待、无端被指责的委屈，完美塑造出老实受欺负的形象。</p>\n<p>温叙白闻言，清冷的目光瞬间落在沈知予身上，眼底掠过一丝浅浅的不悦。</p>\n<p>他最讨厌无端争执，更反感别人不分青红皂白指责自己身边的人。</p>\n<p>在他眼里，陆峥寒刚刚身体不适、胃部隐痛，乖乖静坐等待，温顺又安分，根本不可能主动挑事。</p>\n<p>反观沈知予，无端闯入、主动争执，属实多此一举。</p>\n<p>“知予。”温叙白开口，语气清冷平淡，却带着明显的偏袒，“陆总身体不舒服，一直在休息，你没必要过来争执。”</p>\n<p>简简单单一句话，直接定性了整场争执。</p>\n<p>是沈知予无理取闹，是沈知予主动挑事。</p>\n<p>沈知予浑身一僵，难以置信地看着温叙白，眼底满是错愕与失落。</p>\n<p>二十多年的青梅竹马，抵不过陆峥寒短短几次的示弱卖惨？</p>\n<p>沈知予心口像是被密密麻麻的酸涩堵得发闷，连呼吸都带着细微的滞涩。他定定望着温叙白清冷却格外坚决的眉眼，那里面清晰明了的偏袒，像一把轻柔却锋利的刀，一点点割碎了他多年以来的笃定。</p>\n<p>从小到大，温叙白待谁都疏离平等，哪怕对他这个朝夕相伴二十余年的竹马，也始终是礼貌温和、分寸得当，从未有过这般毫无缘由、不问对错的护短。</p>\n<p>可如今，这份独一份的特例，完完整整给了半路闯入他们世界的陆峥寒。</p>\n<p>沈知予喉间微微发紧，指尖不自觉攥紧，骨节泛出淡淡的青白。他看着卡座上身形虚弱的男人，看着陆峥寒垂着眼、隐忍不语的模样，心底的不甘与焦灼层层翻涌。</p>\n<p>他太清楚了，陆峥寒这副柔弱委屈的样子全是伪装。</p>\n<p>方才对峙时，那人眼底的冷戾、周身迫人的气场，分毫未减，哪里有半分身体不适、受人欺压的孱弱？</p>\n<p>偏偏温叙白看不穿，或者说，是根本不愿去怀疑。</p>\n<p>在温叙白心里，此刻弱势的陆峥寒，就是需要被包容、被守护的一方，而步步紧逼的自己，成了无理取闹的恶人。</p>\n<p>巨大的落差感席卷而来，让沈知予心底的酸涩愈发浓烈。他压下胸口的郁结，勉强维持着温润的仪态，语气带着一丝无奈的辩解，像是在自嘲，又像是在不甘心的控诉：“叙白，我不是故意争执，我只是……看不惯有人刻意装弱骗你迁就。”</p>\n<p>这句话说得隐晦，没有直白拆穿陆峥寒的戏精伪装，却字字直指核心。</p>\n<p>温叙白眉峰蹙得更紧了些。</p>\n<p>他太了解沈知予的性子，温润克制，极少与人交恶，更不会无端针对别人。可今天的沈知予，步步紧逼，执意揪着陆峥寒不放，属实反常。</p>\n<p>但相较于疑惑，他心底的护短本能依旧占据上风。</p>\n<p>陆峥寒此刻静静坐着，垂着眼眸，长睫掩去眼底所有情绪，肩背微微绷着，一副默默受委屈、无从辩驳的模样，看着格外惹人怜惜。</p>\n<p>在温叙白眼里，一个身体不适、安分等待的人，怎么都算不上过错方。</p>\n<p>“就算看不惯，也没必要当众争执。”温叙白语气淡了几分，带着浅浅的疏离，“公共场合，体面最重要。”</p>\n<p>温和的劝慰，实则是实打实的偏袒。</p>\n<p>沈知予心口一涩，彻底说不出话来。</p>\n<p>他终于清晰地意识到，温叙白的护短一旦开启，便毫无道理可言。哪怕所有人都能看出端倪，只要陆峥寒摆出委屈示弱的姿态，温叙白就会无条件站在他那边。</p>\n<p>一旁的陆峥寒将全程尽收眼底，低垂的眼眸深处，飞快掠过一抹得逞的暗笑。</p>\n<p>他要的从来不是口头的输赢，而是温叙白毫无保留的偏袒与例外。</p>\n<p>拿捏住这份软肋，他就永远不会输。</p>\n<p>陆峥寒适时抬眸，眼底带着恰到好处的茫然与温顺，轻轻拉了拉温叙白的西装袖口，动作轻柔克制，小心翼翼的模样像个害怕被嫌弃的孩子。</p>\n<p>“叙白，别因为我吵架。”他声线软糯，带着一丝浅浅的沙哑，“我没事的，不用为难沈少爷。”</p>\n<p>看似大度退让，实则句句拱火，把无辜善良的人设焊得死死的。</p>\n<p>沈知予看着他这副虚伪模样，气得指尖发麻，却偏偏无从辩驳。</p>\n<p>温叙白果然瞬间心软，所有的疑虑尽数消散，彻底被他温顺的表象安抚。他抬手，自然地将手中的保温桶递到陆峥寒面前，语气瞬间柔和下来，褪去了方才的清冷疏离。</p>\n<p>“先喝粥。”</p>\n<p>“温度刚好，养胃。”</p>\n<p>简简单单六个字，温柔细致，是旁人穷尽多年都得不到的专属待遇。</p>\n<p>陆峥寒眼底瞬间漾开细碎的柔光，乖乖接过保温桶，指尖刻意蹭过温叙白温热的掌心，贪恋着转瞬即逝的触感。</p>\n<p>他抬眸望着温叙白，眼神干净又温顺：“谢谢你，叙白。”</p>\n<p>一旁的沈知予看着两人之间自成一体的温柔氛围，看着自己彻底插不进去的间隙，心底最后一丝侥幸，彻底碎裂。</p>\n<div class="hook">**【本章钩子：全场修罗场尘埃落定，陆峥寒完胜独占温柔！沈知予彻底认清落败局势，暗自蓄力反扑，新一轮的暗中较量即将开启！】**</div>\n'},
  {title:'第6章 独占偏爱，暗中碾压', vol:1, html:'<p>温热的保温桶握在掌心，暖意顺着指尖蔓延至四肢百骸，彻底熨平了陆峥寒方才对峙时翻涌的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>。</p>\n<p>他指尖轻轻摩挲着纯白干净的桶身，眼底是藏不住的贪恋，面上却依旧维持着温顺乖巧的模样，安安静静坐在原位，没有半点得胜的张扬。</p>\n<p>越是这般克制无害，落在温叙白眼里，就越是惹人怜惜。</p>\n<p>沈知予立在一旁，像个格格不入的外人，眼睁睁看着属于自己二十多年的特权，被陆峥寒一点点尽数抢占。</p>\n<p>他喉间发涩，勉强扯出一抹僵硬的笑意，试图挽回几分局面，也想再试探一次温叙白的底线：“叙白，我车里也备了养胃的甜品，是你以前爱吃的口味，要不要……”</p>\n<p>话没说完，便被温叙白淡淡打断。</p>\n<p>“不用了。”</p>\n<p>语气平和，却带着不容置喙的疏离。</p>\n<p>温叙白目光落在陆峥寒略显苍白的侧脸上，满心都是对方身体不适的事，压根无暇顾及身旁人的酸涩试探：“他胃不舒服，先喝粥就好，甜食太腻，反而伤身。”</p>\n<p>细致入微的叮嘱，句句都在为陆峥寒考量。</p>\n<p>沈知予彻底失语。</p>\n<p>他终于彻底明白，不是温叙白不懂人情世故，也不是他不够温柔，只是他所有的细心、包容与破例，从今往后，全都给了另一个人。</p>\n<p>从前那个对谁都清冷平等、分寸恪守的温叙白，唯独对陆峥寒，乱了所有规矩。</p>\n<p>陆峥寒耳尖微热，心底的满足感快要溢出来，面上却愈发温顺，抬眸看向温叙白，语气软软的，带着一丝小心翼翼的依赖：“我可以现在喝吗？”</p>\n<p>“嗯。”温叙白微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，顺势抬手，极为自然地帮他掀开保温桶的盖子。</p>\n<p>淡淡的米香混着温润的谷物气息扑面而来，干净清淡，没有半点重油重盐的繁杂味道，恰好戳中温叙白的洁癖喜好，也最适合养胃。</p>\n<p>保温桶内层是可拆卸的无菌陶瓷内胆，摆放规整干净，是温叙白专属的严谨风格。</p>\n<p>陆峥寒垂眸看着里面软糯温热的白粥，眼底漾开细碎的柔光。</p>\n<p>这不是普通的粥，是温叙白亲手熬煮、精心留存，还特意亲自送来的温柔。</p>\n<p>是旁人穷尽一生，都得不到的特例。</p>\n<p>他拿起配套的干净小勺，动作缓慢优雅，小口小口喝着粥，全程安静又乖巧，一副虚弱静养的模样。</p>\n<p>可只有他自己清楚，舌尖的暖意早已浸透心底，所有的醋意与不安，都被这一碗粥彻底抚平。</p>\n<p>温叙白静静坐在一旁陪着他，脊背依旧挺拔端正，坐姿规整，没有多余动作，清冷的眉眼柔和了不少，全程安静陪护，氛围感温柔又静谧。</p>\n<p>周遭围观的宾客早已不敢出声，全都默默低头假装寒暄，余光却频频瞟向卡座的方向。</p>\n<p>所有人都心知肚明，今晚的海城晚宴，最大的看点从来不是商业合作、权贵攀附，而是这位冷面霸总独独给温设计师的极致偏爱。</p>\n<p>沈知予站在原地，僵持片刻，终究是抵不过心底的酸涩与难堪。</p>\n<p>他深深看了一眼专注陪伴陆峥寒的温叙白，那双温润的眼底，彻底褪去所有温柔，余下满满的凝重与不甘。</p>\n<p>“你们慢慢聊。”</p>\n<p>留下一句客套至极的话，沈知予转身离去，步伐沉稳，却带着难以掩饰的落寞。</p>\n<p>他没有立刻离开酒店，而是走到走廊僻静的角落，拿出手机，指尖快速滑动，点开了方才商圈私群里流传的照片。</p>\n<p>照片里，陆峥寒微微倚靠在温叙白肩头，姿态依赖亲昵，而素来洁癖高冷的温叙白，没有半点抵触，甚至微微侧身迁就，温柔得不像话。</p>\n<p>刺眼至极。</p>\n<p>沈知予指尖攥紧手机，指节泛白，眼底覆上一层沉沉的暗色。</p>\n<p>他追了温叙白二十余年，守了他二十余年，从不强迫、从不纠缠，小心翼翼呵护着所有分寸，生怕惹他半分不适。</p>\n<p>可最后，却输给了陆峥寒刻意的示弱、精心的套路。</p>\n<p>凭什么？</p>\n<p>凭陆峥寒只会装可怜博同情，凭他<span class="annot" data-tip="军队每前进一步就设下一道营垒，比喻行动谨慎，防备严密">步步为营</span>、刻意套路，就能轻易拿下温叙白的破例与偏爱？</p>\n<p>沈知予眸色渐冷，低声呢喃：“陆峥寒，你别想这么轻易得偿所愿。”</p>\n<p>他太了解温叙白的性子，清冷迟钝，不懂情爱，如今的偏袒只是一时心软，只要戳破陆峥寒的伪装，让温叙白看清他双面戏精、刻意套路的真面目，所有的偏爱与破例，都会瞬间消散。</p>\n<p>卡座内，沈知予离开的瞬间，原本安静喝粥的陆峥寒，眼底温顺的柔光瞬间褪去。</p>\n<p>他没有抬头，依旧维持着小口喝粥的虚弱姿态，声音压得极低，只有身侧的温叙白听不真切，唯独远处待命的林舟清晰入耳。</p>\n<p>“处理沈知予手里的所有照片，清空私群流传记录。”</p>\n<p>“另外，暂停沈家近期所有和陆氏的合作对接，风控部门全面排查沈家产业漏洞。”</p>\n<p>语气平静无波，没有半分<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，却字字<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>，是商界阎王独有的雷霆手段。</p>\n<p>敢觊觎他的人，敢觊觎他的偏爱，就该付出代价。</p>\n<p>林舟立刻低头应声：“是，陆总，十分钟内处理完毕。”</p>\n<p>全程安静陪伴的温叙白，对此毫无察觉。</p>\n<p>他依旧沉浸在“陆峥寒身体不适需要静养”的认知里，看着男人乖乖喝粥的模样，心底的柔软愈发浓重。</p>\n<p>他随口叮嘱：“慢点喝，别着急，不够我车里还有。”</p>\n<p>陆峥寒瞬间收尽所有冷戾，抬眸望他，眼底重新盛满温顺软糯的笑意，乖巧点头：“好，都听你的。”</p>\n<p>他喝完最后一口粥，将保温桶轻轻放在桌上，动作轻柔规整，刻意贴合温叙白的强迫症喜好。</p>\n<p>随后，他微微侧身，再次轻轻靠向温叙白的肩头，气息清冽温热，语气带着浅浅的慵懒与满足：“有你陪着，胃一点都不疼了。”</p>\n<p>直白又纯粹的依赖，撞得温叙白心底微颤。</p>\n<p>清冷的耳廓再次泛起浅淡绯色，心跳莫名乱了节拍。</p>\n<p>他依旧迟钝，看不懂这满心满眼的蓄谋偏爱，只当是强者脆弱时，对唯一陪伴者的依赖。</p>\n<p>可心底深处，却有什么东西，正在悄悄松动、悄然发芽。</p>\n<p>陆峥寒感受着肩头温热的触感，贪恋着这一刻独有的静谧与温柔，眼底却藏着笃定的算计。</p>\n<p>温水煮茶，步步浸润。</p>\n<p>他不急，他有的是时间，一点点撬开这位清冷美人的心防，让他的所有破例、所有温柔，从此以后，只属于自己一人。</p>\n<p>而暗处的风波，才刚刚开始酝酿。</p>\n<div class="hook">**【本章钩子：陆峥寒人前温柔示弱，人后雷霆碾压情敌，双面反差拉满！沈知予暗自蓄力反击，决心拆穿陆总伪装，一场更大的明暗较量即将爆发！】**</div>\n'},
  {title:'第7章 悄悄沦陷的洁癖底线', vol:1, html:'<p>宴会厅的喧嚣依旧萦绕在耳畔，可靠窗卡座的方寸之地，却静谧得只剩下彼此温热的呼吸。</p>\n<p>陆峥寒懒懒靠着温叙白的肩头，没有过分黏腻的动作，只是安分贴着，姿态温顺又松弛。清冽的雪松气息层层裹住温叙白，干净、清冷，是他唯一能全盘接纳的外人气息。</p>\n<p>温叙白坐姿依旧端正规整，脊背挺直，可周身紧绷的线条却悄然柔和了大半。若是换做旁人这般近距离贴合，他早已生理性不适，下意识后退、抬手消毒，可面对陆峥寒，所有的洁癖原则都成了虚设。</p>\n<p>他甚至微微调整了坐姿，悄悄放软了肩头，给身侧的人更安稳的倚靠支点。</p>\n<p>细微的小动作，无人察觉，唯独落在陆峥寒眼底。</p>\n<p>陆峥寒长睫轻颤，心底的贪恋肆意蔓延，却不敢太过张扬，生怕惊扰了这份难得的温柔迁就。他恰到好处地收敛姿态，只浅浅靠着，低声轻喃：“今晚多亏有你。”</p>\n<p>“不然我一个人，要硬生生熬完整场晚宴。”</p>\n<p>语气软糯慵懒，带着浅浅的依赖，没有刻意撒娇的刻意，却字字戳中温叙白心软的软肋。</p>\n<p>温叙白垂眸看着桌面干干净净的保温桶，指尖轻轻摩挲着桶壁光滑的质感，清冷声线温和清淡：“你身体不适，没必要硬撑场面。”</p>\n<p>以陆峥寒如今的地位，完全可以随意离场，不必勉强自己周旋在权贵宴席之中。</p>\n<p>陆峥寒抬眸，深邃的眼眸牢牢锁着他清绝的侧脸，眼底温柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>几乎要溢出来，语气带着几分坦诚的执拗：“我本来不想来。”</p>\n<p>“但我知道你会来，所以我来了。”</p>\n<p>直白又纯粹的奔赴，没有华丽的辞藻，却撞得温叙白心头轻轻一颤。</p>\n<p>他耳廓的绯色再度加深，清冷的心跳乱了节奏，心底泛起从未有过的微妙酸涩与暖意。感情迟钝的他依旧看不懂这份明目张胆的偏爱，只当是两人私交甚笃，陆峥寒习惯性依赖自己。</p>\n<p>可这份独一无二的特殊，还是让他清冷孤寂的心底，悄悄漾开一圈温柔的涟漪。</p>\n<p>温叙白沉默两秒，习惯性嘴硬，语气依旧清冷平淡：“只是一场普通晚宴，没必要特意迁就。”</p>\n<p>嘴上说着不必，动作却格外诚实。他抬手，自然地拿起保温桶，指尖细致地将盖子扣好，对齐边缘纹路，严丝合缝，完美契合他的强迫症习惯。</p>\n<p>全程细致温柔，无声妥帖。</p>\n<p>陆峥寒看着他规整认真的小动作，眼底笑意愈发浓郁，心底柔软得一塌糊涂。</p>\n<p>他的叙白，永远这般口是心非，温柔藏在细节里，别扭又心软，干净又纯粹。</p>\n<p>“对我来说，不一样。”陆峥寒微微偏头，温热的呼吸扫过温叙白的耳畔，语气低沉<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，带着独有的认真，“能见到你，就值得。”</p>\n<p>温热的气息擦过耳廓，细密的触感清晰分明，温叙白身体微僵，浑身的神经都轻轻绷紧。</p>\n<p>极致的洁癖让他对任何人的近身触碰、气息沾染都极度排斥，可陆峥寒的每一次靠近、每一次亲昵，都让他无从抗拒，甚至甘之如饴。</p>\n<p>他清晰地察觉到，自己坚守二十多年的洁癖底线，正在被陆峥寒一点点、彻底瓦解。</p>\n<p>从前分毫不让的触碰，如今坦然接纳；从前避之不及的亲近，如今满心迁就。</p>\n<p>这份悄无声息的破例，连他自己都后知后觉，无从察觉其中的心动端倪。</p>\n<p>温叙白别开视线，刻意避开他太过灼热深情的目光，以此掩饰心底的慌乱，语气故作平静：“粥喝完了，休息一会儿就回去吧，这里太吵。”</p>\n<p>嘈杂的人群、混杂的气息，让他的洁癖和强迫症隐隐发作，周身已经泛起淡淡的不耐。</p>\n<p>陆峥寒立刻乖乖应声，毫无半点反驳：“好，听你的。”</p>\n<p>他顺势直起身，不再刻意倚靠，乖巧坐直身姿，利落规整，完美贴合温叙白的审美喜好，半分不惹他厌烦。</p>\n<p>可眼底的占有欲，却丝毫未减，依旧牢牢黏在温叙白身上。</p>\n<p>不远处，林舟悄然站在走廊阴影里，低声向陆峥寒实时汇报处理进度。</p>\n<p>“陆总，私群照片已全部清空，发布源头账号永久封禁，全网相关流传记录彻底删除。沈家合作项目已全面暂停，风控团队正在加急排查漏洞，最晚明日一早出结果。”</p>\n<p>效率干脆利落，雷霆手段丝毫未减。</p>\n<p>陆峥寒余光微瞥，淡淡<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，唇齿间溢出冷沉的一声：“盯紧。”</p>\n<p>“是。”林舟迅速应声，不敢多言半分，默默退至暗处。</p>\n<p>全程身侧的温叙白对此一无所觉。</p>\n<p>他看着眼前温顺乖巧、全然无害的陆峥寒，心底只剩柔软与迁就，根本无从想象，这个靠着自己撒娇示弱的男人，方才转头就对情敌下了狠手，<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>，步步不容姑息。</p>\n<p>双面反差，极致割裂。</p>\n<p>陆峥寒收起所有冷戾，转头望向温叙白时，眼底瞬间盛满温顺软糯的笑意，语气带着浅浅的试探：“叙白，我有点累，能不能坐你的车一起回去？”</p>\n<p>“我车子司机待命，不用你开车劳累。”温叙白下意识应声，清冷温柔，习惯性迁就他的所有诉求。</p>\n<p>陆峥寒眼底瞬间亮了起来，笑意愈发真切：“好。”</p>\n<p>两人并肩起身，一黑一白两道清挺身影，身姿挺拔，气质卓绝，并肩走出卡座的瞬间，瞬间攫取全场所有目光。</p>\n<p>众人看着两人近乎亲昵的距离，看着素来有洁癖、不喜旁人靠近的温设计师，全程默许陆峥寒近身同行，心底的震撼久久无法平息。</p>\n<p>所有人都心知肚明，这早已不是简单的私交甚好。</p>\n<p>海城最冷的两个顶级大佬，唯独对彼此，卸下所有铠甲，打破所有底线。</p>\n<p>走廊尽头，拐角阴影处。</p>\n<p>沈知予静静伫立在暗处，将两人并肩离去、温柔默契的画面尽收眼底。</p>\n<p>他指尖死死攥着手机，指节泛白，眼底的温润彻底褪去，只剩沉沉的幽暗与不甘。</p>\n<p>短短片刻，他已经查清了所有端倪。</p>\n<p>商圈私群清零、沈家合作紧急暂停、产业风控突然严查……所有突如其来的变故，全是陆峥寒的手笔。</p>\n<p>人前装可怜博同情，人后阴狠碾压、不择手段。</p>\n<p>果然是伪装至极的双面小人！</p>\n<p>沈知予深呼吸一口气，压下心底翻涌的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，眼底掠过一丝笃定的冷光。</p>\n<p>陆峥寒，你越是藏得深，我就越要亲手撕开你的伪装。</p>\n<p>我倒要看看，等叙白看清你阴狠算计、步步套路的真面目，还会不会对你这般破例偏爱！</p>\n<div class="hook">**【本章钩子：沈知予决意撕破陆峥寒双面伪装，暗中布局反击！迟钝美人彻底沦陷不自知，霸总温柔套路步步紧逼，明暗双线较量全面升级！】**</div>\n'},
  {title:'第8章 独家副驾的特殊权限', vol:1, html:'<p>酒店鎏金璀璨的灯光落在两人肩头，一黑一白两道身影并肩穿行在长廊，步调闲适又默契，自动隔绝了身后宴会厅所有的喧嚣纷扰。</p>\n<p>温叙白步履规整，每一步都从容有度，是刻在骨子里的<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>克制。他余光下意识扫过身侧的陆峥寒，见男人微微垂着肩，步伐轻缓，一副倦态难掩的模样，心底的迁就又浓了几分。</p>\n<p>“要是撑不住，慢点走，不用硬跟。”他清冷的声线放得很柔，带着不自觉的关照。</p>\n<p>陆峥寒闻言，心头一暖，立刻顺势放软姿态，脚步微微放缓，身子若有似无地偏向温叙白一侧，低声软糯应道：“有你在，就撑得住。”</p>\n<p>情话直白又纯粹，毫无油腻感，偏偏精准戳中人心。</p>\n<p>温叙白耳廓微热，习惯性忽略话语里的暧昧深意，只当是对方依赖成性，无奈又纵容地默许了他的近身。</p>\n<p>两人一路无话，氛围静谧温柔，很快抵达酒店地下车库。</p>\n<p>冷白的灯光铺洒在空旷的车库里，映得车身一尘不染。温叙白的私家车是极简的纯白色款式，车内打理得极致干净规整，完全贴合他重度洁癖与强迫症的习性，连座椅缝隙都无半点杂物。</p>\n<p>他抬手解锁车辆，动作优雅利落，正准备绕去驾驶座，身侧的陆峥寒却率先停住脚步，眼神带着浅浅的试探与乖巧：“我坐副驾，可以吗？”</p>\n<p>看似随口的询问，实则暗藏心思。</p>\n<p>熟悉温叙白的人都清楚，他的爱车副驾，是海城公认的顶级禁区。</p>\n<p>多年来，无论是什么身份的人，商业伙伴、圈内好友，哪怕是青梅竹马的沈知予，从未有人能坐上他的副驾。洁癖加上极强的领地意识，让他极度排斥旁人侵占自己的私人空间，副驾始终空置，干净得一尘不染。</p>\n<p>沈知予多年小心翼翼，从不敢轻易提及坐副驾的请求，只能默默坐在后排，守住分寸。</p>\n<p>可陆峥寒，偏偏敢一次次打破温叙白所有的规矩。</p>\n<p>温叙白闻言，动作微顿，下意识看向干净空旷的副驾，心底的洁癖本能微微作祟。</p>\n<p>可转头对上陆峥寒那双温顺无辜、盛满期待的眼眸，看着他眼底浅浅的倦意，所有的排斥与底线，瞬间尽数软化。</p>\n<p>不过是一个座位而已。</p>\n<p>他在心里淡淡宽慰自己，只因为陆峥寒干净整洁、分寸得当，又恰逢身体不适，破例一次无关紧要。</p>\n<p>全然没察觉，自己的破例早已变成专属偏爱，次次都只为眼前这人开启。</p>\n<p>“嗯。”温叙白淡淡<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气纵容，“坐吧。”</p>\n<p>简单两个字，敲定了旁人穷尽多年都得不到的顶级特权。</p>\n<p>陆峥寒眼底瞬间漾开明亮的笑意，眸光熠熠，温柔得不像话。他没有半分逾矩的张扬，依旧乖巧温顺，小心翼翼拉开车门，动作轻缓至极，生怕不小心弄脏车内、惹温叙白不适。</p>\n<p>他端正坐好，腰背挺直，双手规规矩矩放在膝头，连呼吸都刻意放轻，贴合着温叙白所有的规整喜好。</p>\n<p>温叙白看着他乖巧安分的模样，心底的不适感彻底消散，转身走进驾驶座。</p>\n<p>车门关上，隔绝了外界所有声响，狭小密闭的车厢里，瞬间填满了独属于两人的静谧氛围。</p>\n<p>清冽干净的车载香薰气息，混着陆峥寒身上淡淡的雪松冷香，交织成极致好闻的味道，妥帖又安心。</p>\n<p>温叙白发动车子，车身平稳驶出车位。</p>\n<p>夜色透过车窗洒落，霓虹光影流转，掠过他清冷精致的侧脸，衬得眉眼愈发温柔朦胧。</p>\n<p>陆峥寒侧着身子，目光肆无忌惮地黏在他身上，眼神贪恋又炙热，带着藏不住的深情与占有欲。</p>\n<p>全程安静凝望，不愿错过他分毫模样。</p>\n<p>“很累？”温叙白余光瞥见他始终沉默，以为他是胃病未愈、身心疲惫，出声温和询问。</p>\n<p>陆峥寒轻轻摇头，声线软糯低沉，带着浅浅的满足：“不累，看着你就很舒服。”</p>\n<p>直白的偏爱，猝不及防撞入耳膜。</p>\n<p>温叙白心跳微乱，指尖握着方向盘的力道悄然收紧，清冷的脸颊泛起一丝不易察觉的薄红。他刻意目视前方，避开对方灼热的视线，佯装镇定：“好好休息，别说话。”</p>\n<p>“好。”陆峥寒乖乖听话，轻声应下。</p>\n<p>可眼底的温柔，却愈发汹涌。</p>\n<p>他微微偏头，靠着座椅，目光始终锁在温叙白身上，一寸寸描摹着他的眉眼轮廓，心底的执念与欢喜肆意蔓延。</p>\n<p>他等了这么多年，终于能光明正大地坐在他的专属副驾，独享他的温柔迁就，独享旁人触碰不到的特例。</p>\n<p>与此同时，车库僻静的拐角阴影处。</p>\n<p>沈知予的黑色轿车静静停在暗处，车窗半降，他将方才的一幕尽收眼底。</p>\n<p>清清楚楚看着陆峥寒坦然坐进那片从未有人踏足的副驾，看着温叙白毫无抵触、全然纵容的模样。</p>\n<p>心底积攒的酸涩与不甘，彻底轰然崩塌。</p>\n<p>他坐在车内，指尖死死攥紧方向盘，指节泛白，温润的眼底覆满暗沉与落寞，还有一丝极致的不甘。</p>\n<p>副驾。</p>\n<p>那是他觊觎二十余年、小心翼翼从未敢触碰的禁区，是温叙白最重的私人底线。</p>\n<p>他无数次陪同温叙白出行，永远自觉坐在后排，从不敢逾越半分，只求能默默陪在对方身边。</p>\n<p>可陆峥寒刚来多久？</p>\n<p>不过短短几次相遇、几番示弱，就轻轻松松打破了温叙白坚守二十多年的所有原则，独占了这份独一无二的偏爱。</p>\n<p>夜风透过车窗吹进来，带着微凉的寒意，吹得沈知予心口阵阵发疼。</p>\n<p>他看着前方白色轿车平稳驶离车库，尾灯渐远，彻底消失在夜色里，眼底的温润彻底褪去，只剩沉沉的冷冽与决绝。</p>\n<p>示弱、装乖、博同情、破底线……</p>\n<p>陆峥寒<span class="annot" data-tip="军队每前进一步就设下一道营垒，比喻行动谨慎，防备严密">步步为营</span>，算计得滴水不漏。</p>\n<p>可温叙白偏偏被他温顺的表象蒙蔽，半点看不清这人背后的阴狠城府。</p>\n<p>沈知予深吸一口气，压下心底翻涌的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，眸色冷沉笃定。</p>\n<p>既然温柔守护换不来偏爱，那他便不再隐忍。</p>\n<p>陆峥寒，你敢套路他、骗他、独占他的温柔，我就亲手撕开你所有伪装，让你苦心经营的一切，尽数崩塌。</p>\n<div class="hook">**【本章钩子：专属副驾特权彻底解锁，偏爱实锤！沈知予正式开启反击布局，双向拉扯博弈升级，霸总的双面伪装即将迎来首次危机！】**</div>\n'},
  {title:'第9章 夜色暧昧，步步攻心', vol:1, html:'<p>夜色浸染整座海城，城市主干道霓虹流转，流光透过车窗缝隙碎落进来，落在车厢地板，铺出一层细碎温柔的光斑。</p>\n<p>密闭的小小空间里，气息安静又<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。车载冷香混合着陆峥寒身上干净的雪松味，层层缠绕，温柔地包裹住周身每一寸角落。</p>\n<p>温叙白专注目视前方，指尖稳稳把控着方向盘，车速平稳舒缓，丝毫没有颠簸起伏。他坐姿依旧规整挺拔，肩背线条冷冽流畅，只是周身紧绷的气场，早已在不知不觉中彻底松弛下来。</p>\n<p>若是换做任何一个旁人坐在副驾，侵占他最看重的私人领地，他早已浑身不适、心绪烦躁，恨不得立刻停车让人离开，事后还要反复消毒擦拭车内。</p>\n<p>可身侧坐着陆峥寒，他心底只剩安稳与妥帖，连半点洁癖带来的抵触都无从滋生。</p>\n<p>甚至隐隐觉得，这般近距离相伴，安静又踏实，莫名让人心生安稳。</p>\n<p>陆峥寒半靠在座椅上，没有刻意黏贴纠缠，姿态慵懒又安分，唯独一双深邃的眼眸，寸寸黏在温叙白的侧脸上，贪恋描摹着他清冷精致的眉眼、挺直的鼻梁，以及薄色微凉的唇线。</p>\n<p>眼底的深情与占有欲交织涌动，浓烈得几乎快要溢出来，却被他极好地掩饰温顺，只余下一片柔软温柔。</p>\n<p>他等了太多年，才等到这样独处的机会。</p>\n<p>无人打扰，无旁人窥视，只有他和温叙白，共赴同一片温柔夜色。</p>\n<p>“叙白。”良久，陆峥寒轻声开口，声线低沉软糯，带着夜色浸染后的沙哑温柔，打破了车厢内的静谧。</p>\n<p>“嗯？”温叙白淡淡应声，目光依旧落在前方路况，声线清冷平和。</p>\n<p>“你车里的味道，很好闻。”陆峥寒轻轻嗅了嗅，语气真诚又<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，“干净、很安心，和你一样。”</p>\n<p>直白又细腻的夸赞，没有半分油腻刻意，却精准戳中温叙白的心底柔软。</p>\n<p>温叙白耳廓微热，心底泛起一丝不易察觉的悸动，淡淡的、轻飘飘的，陌生又微妙。他感情迟钝，听不懂太过隐晦的深情告白，却偏偏能接住陆峥寒每一句温柔里的真心。</p>\n<p>“车载香薰，极简款。”他克制住心底的微动，语气依旧清冷平淡，维持着表面的镇定。</p>\n<p>陆峥寒微微偏头，目光直直望着他，眼底盛满细碎柔光，认真追问：“是按照你的喜好选的，对不对？”</p>\n<p>“嗯。”温叙白<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>应声。</p>\n<p>“难怪。”陆峥寒轻轻弯起唇角，笑意温柔纯粹，“从头到尾，都是我喜欢的样子。”</p>\n<p>一语双关，暗指车是他喜欢的，香薰是他喜欢的，人更是他执念多年、满心偏爱的模样。</p>\n<p>温叙白没能深究其中深意，只当是对方随口感慨，心底的悸动却迟迟未曾消散，指尖握着方向盘的力道不自觉轻了几分。</p>\n<p>车厢氛围愈发暧昧柔和。</p>\n<p>陆峥寒看着他清冷泛红的耳尖，眼底笑意更深，心底的算计温柔又笃定。他太懂温叙白的软肋，克制、温柔、心软、洁癖执拗，最吃细节里的偏爱与体贴。</p>\n<p>所以他从不激进逼迫，只慢慢浸润，步步攻心，让温叙白一点点习惯他的存在，默认他的特例，沦陷于他独有的温柔。</p>\n<p>“胃彻底不疼了？”温叙白主动开口询问，习惯性关心他的身体状况，清冷的语气里满是不自知的迁就。</p>\n<p>陆峥寒立刻收敛笑意，顺势微微蹙了下眉，摆出一丝浅浅的虚弱模样，语气软糯带着一丝慵懒委屈：“粥很管用，好多了。”</p>\n<p>“但还是有点空落落的，不太舒服。”</p>\n<p>半真半假的示弱，熟练得毫无破绽。</p>\n<p>温叙白果然瞬间心软，眉头微蹙，认真叮嘱：“回去之后别熬夜，喝点温水，早点休息，明天三餐准时，别再空腹劳累。”</p>\n<p>细碎琐碎的叮嘱，温柔又细致，是他从不对外人展露的体贴。</p>\n<p>陆峥寒听得心头滚烫，眼底满是贪恋，乖乖点头应声：“好，都听你的。”</p>\n<p>“只要是你说的，我都听。”</p>\n<p>温顺的语气，虔诚又认真，字字落在温叙白心底，漾开层层温柔涟漪。</p>\n<p>温叙白喉间微动，一时无言，只能专注开车，任由心底那点陌生的暖意肆意蔓延。</p>\n<p>与此同时，黑色夜色笼罩的后方车道。</p>\n<p>沈知予的黑色轿车不远不近地跟在后方，刻意保持着隐蔽距离，全程静默尾随。</p>\n<p>他指尖搭在方向盘上，指节依旧泛白，温润的眼底早已覆满沉沉冷意，再无半分温和笑意。</p>\n<p>前车的尾灯鲜红刺眼，两两成对，在夜色里紧贴并行，像是密不可分的羁绊，狠狠扎进他的眼底，刺得他心口阵阵酸涩发疼。</p>\n<p>副驾的位置。</p>\n<p>那是温叙白坚守多年、无人可触碰的底线，如今却被陆峥寒轻轻松松占据，独享专属温柔与特权。</p>\n<p>沈知予眼底掠过极致的冷意与不甘。</p>\n<p>他守了温叙白二十余年，恪守分寸、小心翼翼，从不越界半分，从不强行纠缠，以为温柔守护总能换来一丝偏爱。</p>\n<p>可到头来，却败给了陆峥寒<span class="annot" data-tip="指事情谋划了很久，多含贬义，但此处指陆峥寒对温叙白的长久心意">蓄谋已久</span>的套路与双面伪装。</p>\n<p>方才他收到手下反馈，彻底查清了今晚所有变故。</p>\n<p>商圈照片清零、账号封禁、沈家合作紧急暂停、全产业风控严查……所有突如其来的打压，全是陆峥寒一人手笔。</p>\n<p>人前柔弱委屈、温顺无害，人后杀伐狠绝、不择手段。</p>\n<p>这般极致割裂的双面心性，偏偏被他藏得滴水不漏，哄得迟钝心软的温叙白满心迁就、处处偏袒。</p>\n<p>沈知予深吸一口微凉夜风，压下心底翻涌的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，眸色冷沉决绝。</p>\n<p>他不会坐以待毙。</p>\n<p>既然温柔守护无用，那他便主动破局。</p>\n<p>陆峥寒擅长伪装示弱、暗中碾压，那他就亲手搜集所有证据，当众撕开这人的虚伪面具，让温叙白好好看清，自己满心偏袒温柔相待的人，究竟是何等阴狠算计的模样。</p>\n<p>前路的白色轿车依旧平稳前行，温柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。</p>\n<p>前车之内，暧昧升温，偏爱蔓延；后车之中，暗流涌动，杀机暗藏。</p>\n<p>一场温柔套路与真相揭穿的博弈，已然悄然拉开序幕。</p>\n<div class="hook">**【本章钩子：车内夜色暧昧拉满，霸总温柔攻心步步沦陷！沈知予暗中尾随取证，撕破伪装的反击大戏即将上演！】**</div>\n'},
  {title:'第10章 刻意乖巧的温柔圈套', vol:1, html:'<p>晚风穿过城市楼宇，吹散了白日的燥热，却吹不散车厢里萦绕的<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>暖意。</p>\n<p>温叙白稳稳操控着方向盘，车速平缓匀速，白色轿车流畅穿梭在车流之中，避开拥挤主干道，朝着安静的别墅区方向行驶。他全程目视前路，神色清冷规整，看似专心开车，可耳根始终未曾褪去的浅绯色，彻底暴露了心底的不平静。</p>\n<p>身旁的陆峥寒依旧保持着乖巧的坐姿，没有肆意乱动，没有刻意黏贴，完美拿捏着让温叙白舒适的分寸感。</p>\n<p>可他那双深邃的眼眸，却始终牢牢锁在温叙白的侧颜之上，一寸寸细细描摹，贪恋着这份独属于夜色的私密相伴。</p>\n<p>眼底是无人窥见的深情执念，表面是温顺无害的乖巧安分，双面模样切换得行云流水，毫无半分破绽。</p>\n<p>“快到你家小区了。”温叙白看着前方熟悉的路口，淡淡开口出声，打破了车厢内静谧的暧昧氛围，清冷声线柔和温润，带着习惯性的关照，“待会儿我送你到楼下，早点回去休息。”</p>\n<p>陆峥寒闻言，眸色微动，顺势微微蹙起眉峰，语气裹着浅浅的软糯委屈，恰到好处地示弱：“回去也是一个人。”</p>\n<p>简简单单六个字，落寞又单薄，瞬间戳中温叙白心软的软肋。</p>\n<p>陆峥寒自幼独自执掌偌大集团，常年孤身一人，早已习惯清冷孤寂，可在温叙白面前，他永远愿意卸下所有强势，展露最柔软脆弱的一面。</p>\n<p>他太清楚温叙白的性子，外冷心软，极度护短，最见不得身边人孤单落寞。</p>\n<p>温叙白指尖微顿，余光轻轻扫过身侧男人。</p>\n<p>陆峥寒微微垂着眼，长睫浓密低垂，遮住眼底翻涌的算计与贪恋，侧脸线条柔和温顺，看起来落寞又乖巧，让人不忍苛责，更不忍拒绝。</p>\n<p>夜色滤镜加持，衬得他褪去了所有商界大佬的凌厉锋芒，只剩下纯粹的干净脆弱。</p>\n<p>温叙白心底的柔软再次被牵动，沉默两秒，清冷出声：“没人陪你？”</p>\n<p>“嗯。”陆峥寒轻轻点头，语气愈发委屈软糯，字字真诚，“助理各司其职，深夜不会打扰我，家里空荡荡的，一直都是我一个人。”</p>\n<p>这话半真半假。</p>\n<p>他坐拥顶级豪宅、无数佣人随从，从来不会缺人伺候，可真心相伴之人，从来只有温叙白一个。</p>\n<p>这么多年，孤身打拼，无人偏护，无人温柔以待，唯有眼前这位清冷美人，能让他甘愿收敛锋芒，步步卑微套路，只求一份专属偏爱。</p>\n<p>温叙白闻言，心底泛起一丝淡淡的酸涩。</p>\n<p>他一直以为，陆峥寒这般站在海城顶端、手握万千权势的人，必然众星捧月、从不孤单。却从未想过，这般耀眼的人，私下里竟是常年孤身一人。</p>\n<p>极强的护短本能悄然蔓延，让他下意识想要迁就包容。</p>\n<p>车子缓缓驶入别墅区林荫道，路灯光影斑驳，交替落在两人身上，温柔又静谧。</p>\n<p>温叙白放缓车速，轻声询问：“那要不要……去我那边坐一会儿？”</p>\n<p>退让与破例，又一次毫无底线给了陆峥寒。</p>\n<p>他的私人住所，是比爱车副驾更极致的禁区。重度洁癖与强迫症的他，从不允许外人踏入自己的生活领地，哪怕是沈知予，多年来也只进门寥寥数次，还需提前报备、严格消杀。</p>\n<p>可面对陆峥寒的落寞示弱，他毫不犹豫打破了这条坚守多年的铁律。</p>\n<p>陆峥寒眼底瞬间炸开细碎璀璨的光亮，压抑不住的欢喜汹涌翻涌，心口滚烫发热。</p>\n<p>入户独处，是比副驾特权更进一步的偏爱，是彻底走进对方私人生活的绝佳契机。</p>\n<p>他隐忍多年的执念，正在一点点圆满落地。</p>\n<p>狂喜转瞬即逝，他迅速压下眼底的汹涌情绪，依旧维持着温顺乖巧的模样，小心翼翼抬眸，语气带着克制的试探，生怕惊扰这份难得的温柔：“可以吗？会不会打扰你休息？”</p>\n<p>“不会。”温叙白淡淡应声，语气纵容温柔，“晚点再回去就好，不用着急。”</p>\n<p>“谢谢叙白。”陆峥寒立刻乖乖道谢，眉眼弯弯，笑意干净又治愈，像个得到糖果的孩子，温顺得毫无攻击性。</p>\n<p>可低垂的眼眸深处，却掠过一抹笃定深沉的占有欲。</p>\n<p>一步一步，温水煮蛙，他终将彻底住进温叙白的世界，占据他所有的温柔与偏爱，无人可替代。</p>\n<p>后方不远处，始终静默尾随的黑色轿车内。</p>\n<p>沈知予清晰看着前方白色轿车驶入温叙白的私人别墅区，心脏像是被无形的手狠狠攥紧，窒息般的酸涩与不甘席卷全身。</p>\n<p>副驾特权尚且不够，如今，温叙白竟然连从不对外开放的私人住所，都愿意对陆峥寒敞开大门？</p>\n<p>二十多年的朝夕相伴、小心翼翼，他从未得到过这般毫无保留的破例。</p>\n<p>陆峥寒不过几场示弱、几次装乖，就轻而易举夺走了他守护半生的所有特殊。</p>\n<p>沈知予指尖死死掐住方向盘，指节泛白，骨缝泛着凉意，温润的眼底彻底覆满寒冽<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>。</p>\n<p>他亲眼见证着陆峥寒<span class="annot" data-tip="军队每前进一步就设下一道营垒，比喻行动谨慎，防备严密">步步为营</span>、层层套路，亲眼看着温叙白一次次打破底线、无限偏爱。</p>\n<p>再任由这样下去，不等自己出手，温叙白早已彻底沦陷，再也看不清陆峥寒的虚伪假面。</p>\n<p>不能再等了。</p>\n<p>沈知予眸色冷沉如冰，眼底最后一丝温柔彻底消散，翻涌着决绝的锋芒。</p>\n<p>他拿出手机，指尖飞快敲击屏幕，拨通了一个隐秘号码，声线低沉冷硬，褪去所有温润，只剩果断狠厉：“帮我查一件事，陆峥寒近期所有暗中操作的打压手段、商业黑料，全部整理出来，越快越好。”</p>\n<p>“我要最完整、最真实的证据，撕开他温柔无害的假面具。”</p>\n<p>电话那头低声应下。</p>\n<p>沈知予抬眸，死死盯着别墅区紧闭的大门，眼底<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>翻涌：陆峥寒，你敢蓄意接近、套路叙白，独占他所有温柔破例，我便让你精心维系的一切，彻底崩塌。</p>\n<p>我倒要看看，当叙白看清你阴狠偏执、步步算计的真面目，还会不会对你这般心软偏爱！</p>\n<div class="hook">**【本章钩子：霸总成功解锁入户特权，贴身独处机会到手！沈知予正式搜集黑料取证，撕破伪装的终极反击即将打响，大型修罗场预告来袭！】**</div>\n'},
  {title:'第11章 私宅独处，温柔攻心成瘾', vol:1, html:'<p>别墅区的林荫道静谧清幽，两侧绿植修剪得整齐规整，路灯隔着枝叶筛下斑驳暖光，褪去了市中心的喧嚣浮华，只剩晚风轻拂的温柔静谧。</p>\n<p>温叙白熟稔地将车子停入专属地下车库，车身平稳落定，没有半点颠簸。熄火的瞬间，车厢内彻底安静下来，唯有两人交织的呼吸，轻柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，在密闭的空间里缓缓流淌。</p>\n<p>“下车吧。”温叙白解开安全带，清冷声线柔和温润，带着习惯性的纵容。</p>\n<p>陆峥寒乖乖应声，动作轻缓地推开车门，全程小心翼翼，生怕动作幅度太大，打乱这份独有的私密氛围。他抬眸打量着周遭干净极简的环境，眼底掠过一丝了然的笑意。</p>\n<p>处处规整、一尘不染，每一处细节都极致贴合温叙白重度洁癖、强迫症的严谨习性，是独属于他的干净清冷格调。</p>\n<p>两人并肩走出车库，直达私人入户电梯。</p>\n<p>电梯镜面光洁无垢，金属内壁冷亮干净，清晰映出两道身形挺拔的身影。一白一黑，气质互补，默契得浑然天成。</p>\n<p>温叙白抬手按下楼层按钮，身姿端正站立，脊背挺直，眉眼清冷淡然。余光却不自觉落在身侧的陆峥寒身上，见男人微微垂眸，姿态温顺安分，没有半点越界举动，心底的安稳感愈发浓重。</p>\n<p>他早已习惯旁人的拘谨疏离，却唯独对陆峥寒的安分乖巧，格外心生暖意。</p>\n<p>电梯匀速上升，狭小的空间里，雪松冷香层层萦绕，将温叙白温柔包裹。</p>\n<p>陆峥寒看似目视前方，实则余光寸寸黏在身侧人身上，眼底藏着无人察觉的贪恋与算计。</p>\n<p>入户、独处、无外人打扰。</p>\n<p>这是他筹谋许久的机会，是彻底走进温叙白私人世界、攻破他心防的最佳时机。</p>\n<p>电梯叮咚一声轻响，稳稳抵达顶层。</p>\n<p>温叙白指纹解锁大门，推门而入的瞬间，极简干净的居室映入眼帘。全屋浅色系装修，陈设规整有序，家具摆放分毫不错位，地面光洁反光，连角落都无半点灰尘杂物，将主人极致的洁癖与强迫症展现得淋漓尽致。</p>\n<p>旁人踏入这里，大概率会束手束脚、倍感拘谨，生怕弄脏破坏分毫。</p>\n<p>可陆峥寒只是微微驻足，眼底盛满温柔，没有半分局促不安。他喜欢这里的干净，喜欢这里的清冷，更喜欢这片独属于温叙白的天地，如今终于得以踏足。</p>\n<p>“随便坐。”温叙白换鞋的动作规整利落，随手将玄关灯光调亮几分，语气自然松弛，是全然接纳外人后的放松状态。</p>\n<p>这又是一份无人能及的特例。</p>\n<p>他的私宅从不对人开放，哪怕是至亲好友，来访前也需提前报备、全屋消杀、严格规整，唯独陆峥寒，突如其来登门，他却半点不介意，甚至发自内心觉得适配和谐。</p>\n<p>陆峥寒听话<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，缓步走到客厅沙发旁落座，身姿端正，连坐姿都刻意贴合屋内干净规整的氛围，分寸感拿捏得恰到好处，不让自己有半分惹人厌烦的可能。</p>\n<p>温叙白转身走向开放式吧台，动作熟练地拿出无菌水杯，冲泡了两杯温热的温水。没有饮品、没有甜饮，简单干净的温水，是他最习惯的待客方式，克制又温柔。</p>\n<p>他端着水杯折返回来，将其中一杯递到陆峥寒面前，清冷叮嘱：“多喝温水，养胃，别再空腹熬夜。”</p>\n<p>细碎温柔的关心，脱口而出，自然得像是刻在骨子里的本能。</p>\n<p>陆峥寒抬眸接住水杯，指尖轻轻触碰温叙白微凉的指尖，转瞬便乖巧收回，不敢过分唐突，只牢牢攥住温热的杯壁。</p>\n<p>“好，都听你的。”</p>\n<p>软糯温顺的语调，虔诚又认真，字字落在静谧的客厅里，温柔得让人心头发颤。</p>\n<p>温叙白在他身侧的沙发落座，两人间距适中，不远不近，氛围松弛又<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。他看着陆峥寒乖乖喝水的模样，眉眼柔和了不少，心底那点陌生的悸动，迟迟未曾消散。</p>\n<p>感情迟钝的他，依旧看不懂这份刻意的亲近与温顺，只当是陆峥寒孤身多年、难得有人陪伴，故而格外依赖自己。</p>\n<p>可他不知道，这份看似安分的依赖，全是<span class="annot" data-tip="指事情谋划了很久，多含贬义，但此处指陆峥寒对温叙白的长久心意">蓄谋已久</span>的温柔圈套。</p>\n<p>陆峥寒小口饮着温水，温热的水流熨帖过胃部，也熨平了他心底所有的焦躁与偏执。他侧头看向身侧清冷的人，灯光落在温叙白精致的眉眼上，柔和了他周身疏离的气场，褪去了平日的<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>冷冽，多了几分烟火气的温柔。</p>\n<p>“叙白。”陆峥寒轻声开口，语气慵懒<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，带着夜色浸染后的温柔，“你家里，比我家暖多了。”</p>\n<p>不是装修温度，不是室温冷暖，是人心的温度。</p>\n<p>他的豪宅空旷清冷，佣人满堂，却无半分暖意，常年孤寂寒凉。可这里，因为有温叙白在，处处皆是温柔安稳。</p>\n<p>温叙白闻言，耳廓微热，淡淡应声：“只是普通居家而已。”</p>\n<p>他不善言辞，不会说动听的情话，只能用沉默的陪伴、无声的迁就，回应对方的依赖。</p>\n<p>陆峥寒却不依不饶，目光牢牢锁着他，眼底盛满细碎柔光，认真又执拗：“不一样，有你在，才暖。”</p>\n<p>直白纯粹的偏爱，猝不及防撞入心怀。</p>\n<p>温叙白喉间微动，心跳悄然乱了节拍，清冷的脸颊泛起一层浅淡绯色。他下意识避开对方灼热的视线，目光落在桌面干净的纹路之上，试图掩饰心底的慌乱。</p>\n<p>看着他别扭害羞的模样，陆峥寒眼底的笑意愈发浓郁，心底的贪恋肆意疯长。</p>\n<p>太乖了。</p>\n<p>他的叙白，清冷又心软，克制又温柔，哪怕屡屡被自己套路破例，也依旧纯粹坦荡，让人愈发沉溺，愈发不肯放手。</p>\n<p>他放缓姿态，微微侧身，拉近些许距离，语气带着浅浅的试探与委屈：“今晚可以多陪我一会儿吗？我回去真的太冷清了。”</p>\n<p>没有强硬纠缠，没有刻意黏腻，只是温顺的请求，卑微又无害，精准戳中温叙白所有的心软软肋。</p>\n<p>温叙白几乎没有犹豫，轻轻<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>：“嗯，不急，坐一会儿再走。”</p>\n<p>又是一次毫无底线的迁就。</p>\n<p>与此同时，别墅小区门外。</p>\n<p>夜色浓稠如墨，晚风微凉。沈知予的黑色轿车静静停在路边，车灯熄灭，隐在暗处，像一头蛰伏蓄力的猛兽。</p>\n<p>车内氛围压抑冰冷，彻底没了往日的温润雅致。</p>\n<p>手机屏幕亮起，助理发来一条条详实消息，附带完整截图、录音与工作记录，全是陆峥寒近期暗中出手的实证。</p>\n<p>深夜施压沈家合作方、恶意做空沈家支线股价、风控恶意拦截沈家项目、暗中买通商圈人员散播对自己不利的流言……</p>\n<p>桩桩件件，杀伐狠绝、算计缜密，手段阴狠霸道，毫无半分人前温顺柔弱的模样。</p>\n<p>字字句句，皆是铁证。</p>\n<p>沈知予指尖划过屏幕上的证据，指节泛白，眼底<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>翻涌，冷得刺骨。</p>\n<p>温柔示弱是假，步步算计是真；孤身可怜是演，暗中碾压是实。</p>\n<p>陆峥寒这一场长达数年的伪装，骗了所有人，更是把心思单纯、感情迟钝的温叙白骗得彻底沦陷、频频破例。</p>\n<p>沈知予死死盯着别墅区灯火通明的楼栋，眼底决绝愈发浓烈。</p>\n<p>证据确凿，万事俱备。</p>\n<p>他不会再给陆峥寒任何温水煮蛙、攻心套路的机会。</p>\n<p>下一次相遇，他必将当众撕破陆峥寒的双面假面，让温叙白亲眼看清，自己满心偏袒、温柔迁就的人，究竟藏着怎样阴狠偏执的真心！</p>\n<div class="hook">**【本章钩子：私宅独处甜度飙升，霸总温柔套路层层攻心！沈知予手握实锤证据，终极揭穿大戏蓄势待发，最强修罗场即将引爆！】**</div>\n'},
  {title:'第12章 温柔陷阱，暗流汹涌', vol:1, html:'<p>暖白的落地灯光铺满整间客厅，将空气中浮动的细碎尘埃温柔裹住。屋内静谧无声，唯有窗外偶尔掠过的晚风，轻轻掀动一层薄纱窗帘，带来片刻轻柔响动。</p>\n<p>温叙白随意靠在沙发靠背上，身姿依旧带着恰到好处的规整，没有半分松懈，却也全然没有对外人的疏离冷硬。清冷的眉眼褪去了白日所有的<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>锋芒，柔和得像是被温水浸过，淡淡的倦意覆在眼底，温顺又干净。</p>\n<p>陆峥寒坐在他身侧，刻意保持着不远不近的舒适距离，既不会太过黏腻惹人厌烦，又能稳稳停在他的私人边界里，独享这份独一无二的独处静谧。</p>\n<p>他指尖握着温热的水杯，杯壁的温度早已透过指尖熨烫至心底，可比起水温，身旁人带来的安稳暖意，才最让他沉溺上瘾。</p>\n<p>“你平时一个人在家，都是这么安静待着吗？”陆峥寒轻声开口，声线慵懒<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，打破了室内的静谧。</p>\n<p>他目光细细描摹着温叙白居家松弛的模样，眼底的贪恋藏得深沉，只余下一片温顺柔和，看起来只是随口闲聊，实则字字都在打探、融入对方的生活。</p>\n<p>温叙白微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，视线落在落地窗外沉沉的夜色里，语气清淡平和：“嗯，作息固定，闲时会整理图纸、打理绿植，不喜欢喧闹。”</p>\n<p>极致规整、极度自律的生活，是他多年不变的常态。没有多余的社交，没有无谓的消遣，日复一日的干净规律，是他强迫症与洁癖最极致的体现。</p>\n<p>陆峥寒听得心底微微发酸。</p>\n<p>世人皆羡他清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>、独来独往，活成了不染尘埃的顶级模样，可只有细细了解才懂，这份清冷背后，是常年无人相伴的孤寂。</p>\n<p>也正是这份孤寂，让自己的步步靠近、次次陪伴，有了无可替代的意义。</p>\n<p>“那以后，我可以经常来陪你吗？”陆峥寒抬眸，眼底盛着细碎又真诚的光亮，语气软糯又认真，带着小心翼翼的试探，“我不吵你，你忙你的，我就在旁边安安静静待着，绝不打乱你的节奏。”</p>\n<p>他精准拿捏住温叙白所有的喜好与底线，不闹、不缠、不逾矩，以最温顺无害的姿态，一点点渗透对方的生活，让他慢慢习惯自己的存在，彻底离不开这份陪伴。</p>\n<p>温叙白闻言，心头微痒，陌生的暖意顺着四肢百骸蔓延开来。</p>\n<p>他素来不喜外人闯入自己规整的生活，任何人的贸然打扰，都会让他的强迫症与洁癖双双不适。可面对陆峥寒的请求，他心底没有半分抵触，反而隐隐生出几分期待。</p>\n<p>习惯了长久的安静孤寂，忽然有人满心满眼只想陪着自己，温顺又懂事，这般纯粹的偏爱，很难不让人心软妥协。</p>\n<p>温叙白垂眸掩去眼底的微动，耳廓浅红未褪，语气依旧清冷，却带着十足的纵容：“可以。”</p>\n<p>简单两个字，轻飘飘落下，却敲定了旁人穷尽一生都得不到的特权。</p>\n<p>陆峥寒眼底瞬间炸开璀璨笑意，眉眼弯弯，温柔得一塌糊涂，像个得到专属嘉奖的孩子，满足又乖巧。</p>\n<p>“谢谢你，叙白。”</p>\n<p>他低声呢喃，语气虔诚又真挚，眼底的深情几乎要溢出来。</p>\n<p>温水煮蛙的套路，终究在日复一日的温柔浸润中，慢慢开花结果。</p>\n<p>与此同时，别墅门外的黑色轿车内。</p>\n<p>沈知予指尖反复滑动着手机里的所有证据，每一张截图、每一条记录、每一段录音，都清晰直白地揭露着陆峥寒阴狠算计的真面目。</p>\n<p>做空股价、拦截项目、施压合作方、散播恶意流言……桩桩件件，手段凌厉狠绝，步步紧逼，全然没有半分人前温顺柔弱的模样。</p>\n<p>这般杀伐狠戾、不择手段的商界阎王，却日日在温叙白面前装可怜、卖委屈，靠着完美演技骗取偏爱与破例，步步蚕食温叙白的信任与心软。</p>\n<p>沈知予越看越心冷，眼底的温润彻底消散，只剩下沉沉<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>与决绝。</p>\n<p>他可以接受自己输给别人，可以接受温叙白不喜欢自己，却绝不能容忍温叙白被人精心套路、假意欺骗，被人用虚伪的温柔蒙蔽双眼。</p>\n<p>助理的消息再次弹出，密密麻麻的新证据接踵而至，甚至附带了陆峥寒早前暗中打压小型企业、手段狠绝的过往记录，完美拼凑出他完整的双面人格。</p>\n<p>【沈总，所有证据已全部核实，百分百属实，无伪造、无漏洞，随时可以公开。】</p>\n<p>看着屏幕上的文字，沈知予指尖微微收紧，指节泛白，眸色冷得刺骨。</p>\n<p>时机成熟了。</p>\n<p>他隐忍退让多年，小心翼翼守护在温叙白身边，从不强求、从不越界，可陆峥寒的出现，彻底打破了所有平衡，用最虚伪的温柔，偷走了本该平等相待的偏爱。</p>\n<p>既然温柔守护无用，那他便亲手撕碎这场骗局。</p>\n<p>沈知予快速回复消息，声线冷硬果决，没有半分犹豫：【整理成册，明天上午，在海城建筑行业交流峰会现场，同步公示。】</p>\n<p>那场峰会，温叙白是特邀主讲嘉宾，全场行业大佬、精英人士齐聚，是海城顶级的公开场合。</p>\n<p>他要在所有人的见证下，撕破陆峥寒维系多年的双面伪装，让温叙白在万众瞩目之下，看清自己满心偏袒、温柔迁就的人，究竟是何等城府深沉、精于算计的模样！</p>\n<p>车内的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>与决绝，与别墅内的温柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，形成极致割裂的反差。</p>\n<p>屋内，是霸总精心编织的温柔圈套，甜度满分、暧昧升温；屋外，是情敌<span class="annot" data-tip="指事情谋划了很久，多含贬义，但此处指陆峥寒对温叙白的长久心意">蓄谋已久</span>的终极反击，暗流汹涌、杀机暗藏。</p>\n<p>温柔的假象之下，早已风波暗涌，一场颠覆所有认知的修罗场大戏，已然蓄势待发。</p>\n<div class="hook">**【本章钩子：陆峥寒成功解锁常驻陪伴特权，甜度拉满！沈知予敲定公开揭穿时机，峰会终极对决来袭，双面霸总的伪装即将彻底破碎！】**</div>\n'},
  {title:'第13章 晚风沦陷，危机暗伏', vol:1, html:'<p>暖白灯光温柔铺满客厅，将两人相依的氛围烘得愈发<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。窗外晚风掠过树梢，携着夜色的微凉，轻轻叩击落地窗，消解了深夜的沉寂，却吹不散屋内肆意蔓延的暧昧暖意。</p>\n<p>温叙白靠在沙发上，周身紧绷的神经彻底松弛下来。平日里被洁癖和强迫症牢牢束缚的心神，在陆峥寒安静的陪伴下，难得卸下所有枷锁，生出几分慵懒的倦意。</p>\n<p>他侧眸看向身侧的男人，眼底清冷的疏离尽数褪去，只剩浅浅的柔和。</p>\n<p>陆峥寒坐姿规整乖巧，单手握着温热的水杯，长睫低垂，遮住眼底翻涌的深情与算计，侧脸线条温顺柔和，看起来干净又无害，全然是一副安分依赖的模样。</p>\n<p>“明天上午有海城建筑峰会，我要去做主讲分享。”温叙白轻声开口，随意闲聊般告知自己的行程，语气自然放松，是全然信任后的坦然，“结束后应该有空，不用赶时间。”</p>\n<p>陆峥寒闻言，长睫骤然抬起，深邃的眼眸瞬间亮了几分，精准捕捉到关键信息。</p>\n<p>海城建筑峰会。</p>\n<p>汇聚全城建筑界精英、各大合作企业大佬的顶级场合，也是沈知予深耕多年、人脉扎根极深的圈子。</p>\n<p>他心底瞬间掠过一丝隐晦的警惕，却没有半分外露，反而愈发温顺，语气软糯迁就：“那你明天要辛苦奔波了。”</p>\n<p>“我明天没有硬性行程，可以去现场等你结束吗？”他小心翼翼试探，姿态卑微又乖巧，“不打扰你工作，就在台下安静坐着，结束了可以顺路送你回家。”</p>\n<p>深谙温水煮蛙的他，绝不会放过任何一个陪伴、渗透对方生活的机会，更不会给沈知予单独靠近温叙白的可乘之机。哪怕明知前路暗藏风波，他也要主动入局，牢牢守住自己的偏爱。</p>\n<p>温叙白毫无察觉他眼底深藏的缜密心思，只当是寻常陪伴请求，几乎没有犹豫，轻轻<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>应允：“可以。”</p>\n<p>一句纵容，再次默许了陆峥寒独一无二的陪伴特权。</p>\n<p>陆峥寒唇角瞬间勾起一抹温柔的弧度，眼底盛满得逞的细碎光亮，语气愈发虔诚温顺：“好，我准时到场。”</p>\n<p>他抬眸望向温叙白，目光贪恋又炙热，肆无忌惮描摹着对方柔和的眉眼，低声呢喃：“有你在，每一场等待都值得。”</p>\n<p>直白又纯粹的偏爱，撞得温叙白心底微颤，清冷的耳廓再度染上浅绯色。他下意识移开视线，望向窗外沉沉夜色，试图掩饰心底莫名的悸动，可紊乱的心跳却久久无法平复。</p>\n<p>他依旧迟钝，看不懂这份<span class="annot" data-tip="军队每前进一步就设下一道营垒，比喻行动谨慎，防备严密">步步为营</span>的深情套路，分不清眼前的温顺是伪装还是真心，只知晓和陆峥寒相处时，心底安稳又踏实，是从未有过的松弛与安心。</p>\n<p>两人安静相伴，再无多余言语，静谧的氛围温柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，岁月静好。</p>\n<p>可无人知晓，别墅门外的暗处，一场足以颠覆所有温柔的危机，已然蓄势待发。</p>\n<p>沈知予依旧静坐车内，手机屏幕上密密麻麻的证据文档早已整理完毕，分类清晰、铁证如山，每一条记录都能精准撕碎陆峥寒维系已久的温柔假面。</p>\n<p>他指尖摩挲着屏幕，眼底最后一丝温润彻底湮灭，只剩冰冷决绝。</p>\n<p>海城建筑峰会，万众瞩目，公开透明。</p>\n<p>这是陆峥寒最意想不到的揭穿时机，也是他夺回主动权、打破这场虚伪骗局的最佳舞台。</p>\n<p>他太清楚陆峥寒的底牌，也太清楚温叙白的底线。</p>\n<p>温叙白一生洁癖纯粹、最厌虚伪算计，若是知晓自己百般迁就、无限偏爱的人，一直在用演技套路自己，一直在背后阴狠杀伐、不择手段，所有的温柔破例，都会瞬间化作刺骨的失望。</p>\n<p>夜色渐深，别墅屋内的温柔缠绵，与屋外的暗流汹涌，极致对峙。</p>\n<p>陆峥寒沉溺在专属偏爱里，步步攻心、稳稳拿捏；沈知予蛰伏在黑暗中，蓄势待发、静待翻盘。</p>\n<p>一场关于真假温柔、双面假面的终极博弈，即将在明日的顶级峰会之上，轰然爆发。</p>\n<div class="hook">**【本章钩子：陆峥寒敲定峰会陪伴席位，贴身守护不留给情敌半分机会！沈知予手握铁证静待翻盘，明日公开对决即将撕破所有伪装，甜度与虐点惊险交织！】**</div>\n<p>夜色愈发浓稠，屋内暖光融融，将两人相依相伴的画面晕染得温柔无比。陆峥寒静静坐在身侧，看着温叙白眼底浅浅的倦意，心底柔软得一塌糊涂，悄悄收敛了所有锋芒与算计，只余下满心满眼的迁就与贪恋。他刻意放轻了呼吸，不敢惊扰这份难得的静谧，只想让这独属于他的温柔时光，再漫长一点。</p>\n<p>温叙白彻底卸下了所有防备，连日忙碌加上晚宴应酬的疲惫悄然席卷全身，靠在沙发上的身姿愈发松弛。他微微偏头，余光扫过身旁温顺乖巧的男人，心底安稳踏实，全然没察觉，明日那场万众齐聚的行业峰会，早已被暗流裹挟。</p>\n<p>暗处的棋局早已落子收官，沈知予的反击蓄势待发，铁证在手，只待明日登台，撕碎陆峥寒精心维系的所有温柔假面。</p>\n<p>一边是朝夕浸润、步步入心的温柔偏爱，一边是铁证如山、即将引爆的惊天真相，无人知晓明日峰会之上，这场双向反差的极致偏爱，会迎来怎样惊心动魄的颠覆。</p>\n<div class="hook">**【本章钩子：深夜私宅温柔圆满，甜度抵达顶峰！明日建筑峰会风云将至，真假假面终极对决来袭，温柔骗局即将迎来首次惊天破碎！】**</div>\n<p>不知过了多久，窗外的晚风渐渐凉了几分，掠过落地窗带起细碎的风声，轻轻吹散了客厅凝滞的<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>氛围。温叙白眼底的倦意愈发浓重，长长的睫毛轻轻垂落，覆在清冷的眼眸上，褪去了所有清醒时的规整克制，多了几分慵懒易碎的柔和。他连日忙于项目图纸打磨，又耗费整晚精力应酬周旋，身心早已疲惫，在全然安心的氛围里，不自觉松懈了所有防备，呼吸都变得轻浅绵长。陆峥寒将他细微的疲惫模样尽收眼底，心底的算计尽数褪去，只剩下满心柔软的疼惜。他放轻所有动作，连呼吸都刻意压得极淡，生怕一丝动静惊扰了身侧人难得的松弛。目光细细描摹着温叙白安静的睡颜，眉眼清隽柔和，褪去了平日的疏离<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，干净得让人不忍<span class="annot" data-tip="轻慢，不恭敬，冒犯">亵渎</span>。他知晓今晚的温柔相伴已是极致馈赠，也清楚这份偷来的静谧安稳转瞬即逝，明日的建筑峰会，注定是一场避无可避的风波博弈。沈知予蛰伏整夜的不甘与筹谋，绝不会轻易作罢，那些被他藏在温顺表象下的杀伐手段、步步算计，很快就要被赤裸裸摊在阳光之下。可他毫无惧色，甚至早已做好万全准备。为了留住这份独一无二的偏爱，为了守住温叙白一次次为他打破的底线，他甘愿直面所有揭穿与对峙，哪怕亲手撕开自己的双面假面，也绝不允许任何人破坏他和温叙白来之不易的羁绊。夜色温柔<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>，暗流却从未停歇，极致甜软的独处时光之下，一场席卷三人的风波，已然悄然酝酿成型。</p>\n'},
  {title:'第14章 峰会风暴，假面将碎', vol:1, html:'<p>清晨的海城，天光澄澈如洗，金色阳光铺满整座城市的玻璃幕墙，折射出璀璨耀眼的光芒。</p>\n<p>海城国际会议中心，迎来了全城建筑行业最顶级的年度交流峰会。</p>\n<p>会场内座无虚席，建筑界精英、各大企业掌权人、行业顶尖设计师齐聚一堂，气氛围庄重热烈。媒体记者的长枪短炮架在最后一排，闪光灯此起彼伏，记录着这场行业盛事。</p>\n<p>峰会的重磅环节——特邀主讲嘉宾分享，即将拉开帷幕。</p>\n<p>主持人话音落下，一道清挺修长的身影从容走上演讲台。</p>\n<p>温叙白身着一袭浅灰色手工西装，内搭纯白衬衫，面料干净无瑕，贴合身形勾勒出清瘦挺拔的线条。他眉眼清浅疏离，气质<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>清冷，周身自带一种让人屏息的从容气场，站在台上便将全场的注意力牢牢攫住。</p>\n<p>台下瞬间安静下来，所有目光汇聚在他身上。</p>\n<p>作为业内最年轻便封神的设计师，温叙白的每一个项目都堪称经典，风格独树一帜，审美极致干净，在业内有着无可撼动的地位。</p>\n<p>他抬手翻开放在讲台上的讲稿，指尖修长白皙，动作利落规整，随即抬眸，清冷的目光从容扫过全场，声线干净沉稳，带着恰到好处的专业与疏离："今天分享的主题，是建筑空间与人文情感的诗意共生。"</p>\n<p>演讲正式开始。</p>\n<p>温叙白的讲述条理清晰、逻辑缜密，又不失感性与温度。他将冰冷的建筑数据化为有温度的空间叙事，将设计理念讲得深入浅出，每一个观点都精准独到，每一段论述都令人折服。</p>\n<p>台下的行业大佬们频频点头，眼中的欣赏毫不掩饰。即便是不懂设计的圈外人，也能感受到他讲述中蕴含的纯粹热爱与专业深度。</p>\n<p>前排VIP席位上，陆峥寒安静坐着。</p>\n<p>他今日穿了一身深灰色西装，内搭黑色高领衫，肩线冷硬利落，气场沉稳内敛，周身依旧萦绕着生人勿近的凛冽气息。可那双深邃的眼眸，却始终牢牢锁在台上那道清挺的身影上，目光温柔又专注，与周身冷冽的气场形成极致反差。</p>\n<p>台上的温叙白，自信、从容、耀眼夺目。</p>\n<p>他的叙白，永远这般耀眼。</p>\n<p>不远处，沈知予坐在另一侧的嘉宾席，一身米白色西装，温润儒雅，嘴角挂着恰到好处的得体笑意，看起来与往日并无不同。</p>\n<p>可他的手指，却在膝头的文件夹上轻轻摩挲，指节微微泛白，眼底藏着隐忍许久的决绝与冷意。</p>\n<p>那份文件夹里，装着昨晚连夜整理的全部证据。</p>\n<p>做空股价、拦截项目、施压合作方、散播恶意流言……每一条记录都清晰直白，每一段录音都铁证如山，足以彻底撕碎陆峥寒维系已久的温柔假面。</p>\n<p>他在等。</p>\n<p>等一个最完美的时机。</p>\n<p>温叙白的演讲进入尾声，全场掌声雷动，经久不息。他微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>致意，从容走下演讲台，眉眼清冷平和，周身自带一种完成任务后的松弛感。</p>\n<p>主持人上台，宣布进入互动交流环节，现场气氛再度活跃起来。</p>\n<p>几位行业大佬率先举手提问，温叙白一一从容作答，条理清晰，专业笃定，赢得阵阵掌声。</p>\n<p>沈知予的手缓缓举起。</p>\n<p>主持人认出了沈家少爷，笑着示意他发言。</p>\n<p>沈知予起身，温润的目光却没有看向台上的温叙白，而是径直转向前排VIP席的陆峥寒，唇角笑意不变，眼底却透着冰冷的锋芒。</p>\n<p>"陆总，我有一个问题，想请教您。"</p>\n<p>全场目光瞬间汇聚到陆峥寒身上。</p>\n<p>陆峥寒抬眸，深邃的眼眸淡淡睨着沈知予，气场沉稳如山，看不出半分波澜，薄唇微启，声线冷沉："沈少爷请讲。"</p>\n<p>沈知予不疾不徐，抬手示意助理将早已准备好的资料分发至每位嘉宾手中，语气依旧温润得体，却字字带刺："陆总在商界的手段，一直是圈内传奇。我想请教陆总，打压沈家支线股价、拦截沈家项目审批、施压沈家合作方终止合作，甚至暗中买通商圈人员散播不利于沈家的流言——这些事，是否都是陆总一手策划？"</p>\n<p>全场哗然。</p>\n<p>嘉宾们低头翻看手中详实的截图、录音与工作记录，窃窃议论声瞬间此起彼伏，所有人的目光在陆峥寒与沈知予之间来回游移，满是震惊与探究。</p>\n<p>谁能想到，一向冷漠寡言、从不与人交恶的陆氏掌权人，竟在暗中使出这般狠绝手段？而更让人震惊的是，这些手段的矛头，全部指向沈家——温叙白青梅竹马沈知予的家族。</p>\n<p>台上的温叙白，清冷的眉峰骤然蹙起，目光落在手中那份详实的证据上，指尖微微收紧，指节泛出淡淡的青白。</p>\n<p>他抬眸，看向陆峥寒。</p>\n<div class="hook">**【本章钩子：峰会现场铁证摊牌，陆峥寒双面伪装面临首次公开危机！全场哗然之际，迟钝美人清冷目光直视台下，这场真假温柔的终极博弈，即将迎来最惊心动魄的对决！】**</div>\n'},
  {title:'第15章 真相摊牌，迟钝美人的动摇', vol:1, html:'<p>会场内一片哗然，窃窃私语声如潮水般涌动，所有人的目光尽数汇聚在陆峥寒与温叙白之间，气氛骤然凝滞到冰点。</p>\n<p>沈知予站在原地，温润的面具下藏着压抑已久的快意，目光紧紧锁住陆峥寒，等待他失态、辩解、慌乱，等待他精心维系的温柔假面在万众瞩目之下彻底破碎。</p>\n<p>可陆峥寒，只是安静坐着。</p>\n<p>他没有慌张起身，没有急于辩白，甚至连眉眼间的冷峻都未变分毫，只是淡淡垂眸，扫了一眼手中那份详实的证据，薄唇微微勾起一抹极浅的弧度。</p>\n<p>有冷意，无慌乱。</p>\n<p>他缓缓起身，气场全开，周身压迫感铺天盖地，瞬间将全场的嘈杂压了下去。</p>\n<p>"沈少爷查得倒是清楚。"</p>\n<p>陆峥寒声线低沉冷冽，字字清晰，没有半分回避："陆氏与沈家的商业往来，向来在商言商，一切操作合规合法。沈家支线股价波动，是市场自身行为；项目审批未通过，是资质不达标；合作方终止合作，是商业考量。"</p>\n<p>他抬眸，深邃的眼眸冷冷睨着沈知予，语气不疾不徐，带着商界掌权人独有的从容与压迫："至于所谓流言，沈少爷手里若有陆氏授意的实证，大可以走法律程序，不必在行业峰会上混淆视听。"</p>\n<p>不卑不亢，四两拨千斤，将所有指控化解于无形。</p>\n<p>沈知予眼底闪过一丝意外，没想到陆峥寒竟能这般从容应对，但他准备充分，岂会就此罢休。</p>\n<p>"陆总说合规合法，那这些呢？"沈知予抬手，助理再次分发了第二批资料，声音微微提高，"这是陆氏风控部门内部的工作指令记录，时间线与沈家遭受打压的时间完全吻合。陆总，这些也是市场自身行为？"</p>\n<p>全场气氛再度紧绷，议论声愈发嘈杂。</p>\n<p>陆峥寒垂眸扫了一眼新证据，眼底掠过一丝极淡的冷意，却依旧从容不迫："沈少爷能拿到陆氏内部文件，倒是本事。不过这些工作记录只能证明风控部门正常履职，不能证明是针对沈家的恶意打压。"</p>\n<p>他微微一顿，目光冷沉如渊："倒是沈少爷，不惜动用手段窃取陆氏内部资料，这份用心，比商业竞争更值得玩味。"</p>\n<p>一句话，直接反将一军，将"窃取商业机密"的帽子扣了回去。</p>\n<p>沈知予面色微变，没想到陆峥寒的反击如此凌厉。</p>\n<p>可他知道，自己手中最有力的筹码并非这些商业证据，而是温叙白。</p>\n<p>他深吸一口气，目光转向台上始终沉默的温叙白，语气放缓，带上了几分真挚的心疼与无奈。</p>\n<p>"叙白，我不是想在峰会上闹事，我只是不想看你被人骗了还蒙在鼓里。"</p>\n<p>"陆峥寒在你面前装可怜、装胃痛、装孤单，一步步打破你的底线，骗你的温柔和偏爱。可在你看不到的地方，他阴狠算计、杀伐不择手段，连我沈家都不放过。"</p>\n<p>"他对你的温柔，到底几分是真，几分是演？"</p>\n<p>话音落下，全场死寂。</p>\n<p>所有人的目光落在温叙白身上，等待他的反应。</p>\n<p>温叙白站在台上，清冷的眉眼看不出太多情绪，可微微收紧的指尖，却泄露了他心底的波澜。</p>\n<p>他低头看着手中详实的证据，又抬眸看向台下的陆峥寒。</p>\n<p>那个在他面前温顺乖巧、撒娇示弱的男人，此刻正从容不迫地应对着所有指控，气场冷冽如冰，眉眼间是熟悉的<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>。</p>\n<p>两副面孔，极致割裂，在他眼前交叠。</p>\n<p>温叙白心底泛起从未有过的复杂情绪。有震惊，有动摇，还有一丝说不清的涩意。</p>\n<p>他一向最厌虚伪算计，这是刻在骨子里的原则。可面对陆峥寒，那份让所有人震惊的双面真相，却让他迟迟无法给出干脆的判断。</p>\n<p>因为那些温柔，那些破例，那些陪伴，太过真实。</p>\n<p>真实到他无法简单用"演戏"二字全盘否定。</p>\n<p>温叙白沉默片刻，清冷的声线响起，平静却带着不容置疑的威严："今天的峰会到此暂停，后续安排另行通知。"</p>\n<p>他放下手中的资料，从容走下演讲台，步伐依旧规整，身姿依旧挺拔，可微微攥紧的指尖，却暴露了他心底并不平静。</p>\n<p>全场宾客面面相觑，无人敢出声，气氛凝滞到极致。</p>\n<p>沈知予看着温叙白离去的背影，心底微微一沉。他看得出来，温叙白动摇了，却没有彻底倒向自己。</p>\n<p>陆峥寒的目光紧紧追着那道清挺的身影，眼底所有的从容与冷冽尽数褪去，只剩深沉的疼惜与笃定。</p>\n<p>他不会让温叙白一个人消化这些。</p>\n<p>永远不会。</p>\n<div class="hook">**【本章钩子：真相当众摊牌，迟钝美人清冷心防首次动摇！陆峥寒从容应对指控，却深知真正的战场不在峰会会场，而在温叙白心底。一场关乎信任与真心的坦诚对话，即将到来！】**</div>\n'},
  {title:'第16章 坦诚相见，偏爱不假', vol:1, html:'<p>峰会休息室，门窗紧闭，隔绝了外面所有的喧嚣议论。</p>\n<p>温叙白独自站在落地窗前，脊背挺直如松，双手插在西装裤袋里，目光落在窗外繁华的城市天际线上，眸色清冷沉静，看不出丝毫波澜。</p>\n<p>可微微收紧的指节，和迟迟未曾平复的心跳，却无声诉说着他心底的动荡。</p>\n<p>那份证据还摊在茶几上，白纸黑字，条条详实，铁证如山。</p>\n<p>做空、打压、拦截、施压……</p>\n<p>每一条记录都精准直白，将陆峥寒在暗中杀伐狠绝的一面，赤裸裸摊开在他面前。</p>\n<p>那个在他面前温顺乖巧、撒娇示弱、装胃痛求安慰的男人，背过身去，竟是这般凌厉狠绝的商界阎王。</p>\n<p>温叙白心底泛起一丝浅浅的涩意，说不清是失望还是别的什么。</p>\n<p>他一向最厌虚伪算计，这是刻在骨子里的底线。可面对陆峥寒，他却迟迟无法干脆利落地定性。</p>\n<p>因为那些温柔，太过真实。</p>\n<p>装胃痛时微微蹙起的眉、靠在他肩头时小心翼翼的依赖、接过他亲手煮的粥时眼底溢出的满足、坐在副驾安静凝望他时目光里藏不住的深情……</p>\n<p>那些，不像演出来的。</p>\n<p>温叙白闭了闭眼，心底烦闷地叹了口气。</p>\n<p>门被轻轻推开。</p>\n<p>陆峥寒走了进来，反手关上门，隔绝了外界所有的窥探。</p>\n<p>他没有像往常那样放软姿态、装可怜示弱，而是安静站在门口，身姿挺拔，眉眼间是少见的认真与坦诚，周身气场沉稳而克制。</p>\n<p>两人隔着几步距离，安静对视。</p>\n<p>沉默在空气中蔓延，谁都没有先开口。</p>\n<p>良久，温叙白率先打破寂静，清冷的声线平稳无波，却带着少见的认真："那些证据，是真的？"</p>\n<p>不是质问，不是指责，只是平静的确认。</p>\n<p>陆峥寒没有半分犹豫，直接<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>："是真的。"</p>\n<p>没有辩解，没有回避，坦荡得让人意外。</p>\n<p>温叙白眉峰微蹙，心底的涩意更浓了几分："你在我面前装胃痛、装孤单、装可怜，也是真的？"</p>\n<p>陆峥寒沉默了两秒，声线低沉："胃痛，半真半假。当天没吃饭是真的，但不至于疼到那个地步。"</p>\n<p>他微微顿了顿，抬眸直视温叙白的眼睛，目光前所未有地认真："但孤单，是真的。"</p>\n<p>"一个人撑着陆氏，一个人做所有的决策，一个人扛所有的压力，没有人真正在意我累不累、疼不疼。这些年来，唯一让我觉得被在意、被偏爱的，只有你。"</p>\n<p>温叙白喉间发紧，心里那杆天平微微晃动，却依旧没有完全倾斜。</p>\n<p>"你对我温顺示弱、步步靠近，是因为真心，还是因为算计？"</p>\n<p>这个问题，才是他心底真正的芥蒂。</p>\n<p>陆峥寒闻言，罕见地露出一丝苦涩的笑意，声线低哑："如果我说，一开始接近你，确实有刻意的成分。"</p>\n<p>温叙白指尖骤然收紧，心底一沉。</p>\n<p>"但每一次和你相处，每一次的温柔和示弱，都是真的。"陆峥寒抬眸，眼底是从未对任何人展露过的脆弱与坦诚，"我对所有人的冷漠是真的，对你的心软是真的，装胃痛求你关心是真的，想靠近你、想独占你的偏爱，也是真的。"</p>\n<p>"我在外<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>，是因为商场如战场，不狠就站不住。可在你面前，我不想做陆氏总裁，不想做商界阎王，我只想做一个……能被你偏爱、被你温柔以待的人。"</p>\n<p>"这两面，都是我。"</p>\n<p>他一字一句，说得缓慢而认真，没有华丽的辞藻，没有刻意的煽情，只有剥开所有伪装后的赤诚真心。</p>\n<p>温叙白静静听着，眼底泛起细密的波澜。</p>\n<p>他看懂了。</p>\n<p>陆峥寒的双面，不是虚伪，不是骗局，而是一个常年孤身扛下所有的人，在唯一信任的人面前，卸下铠甲的本能。</p>\n<p>杀伐狠绝是他的铠甲，温顺示弱是他的真心。</p>\n<p>两者并不矛盾。</p>\n<p>温叙白沉默良久，心底的天平终于缓缓倾斜，落定在一个笃定的方向。</p>\n<p>他抬眸看向陆峥寒，清冷的声线依旧平稳，却带着只有陆峥寒才能听出的纵容："以后不许用这种手段。"</p>\n<p>简简单单一句话，是责备，是原谅，更是偏爱。</p>\n<p>陆峥寒浑身一震，眼底瞬间涌上滚烫的热意，嗓音微微发涩："好，都听你的。"</p>\n<p>温叙白别开视线，耳廓泛起浅淡的绯色，语气故作清淡："沈家的事，到此为止，以后商业上的事，堂堂正正地来。"</p>\n<p>"好。"陆峥寒乖乖应声，嘴角的笑意怎么也压不下去，像个得到赦免的孩子，欢喜得无以复加。</p>\n<p>他试探着往前走了一步，小心翼翼地观察温叙白的神色，见他没有后退，又往前走了一步，低声软糯："叙白，我还能去你那里坐坐吗？"</p>\n<p>温叙白淡淡扫了他一眼，语气清冷却纵容："先把峰会的事处理完。"</p>\n<p>"好。"陆峥寒乖乖点头，眼底满是温顺的笑意。</p>\n<p>门外，沈知予远远看着休息室紧闭的门，等了许久，只等到陆峥寒推门而出时，嘴角那抹温柔满足的笑意。</p>\n<p>他心口一沉，终于彻底明白——</p>\n<p>温叙白选择了陆峥寒。</p>\n<p>不是因为他不够好，不是因为陆峥寒不够真，而是那份独一无二的偏爱，从始至终，都只给了一个人。</p>\n<p>沈知予闭了闭眼，指尖攥紧手中的证据文件夹，无力感席卷全身。</p>\n<p>他输了，输得彻彻底底。</p>\n<div class="hook">**【本章钩子：坦诚相见化解信任危机，迟钝美人首次主动选择偏袒！沈知予彻底认清败局，却未必甘心收手。双面霸总成功守住偏爱，可更大的家族阻力与圈层风波，才刚刚开始酝酿！】**</div>\n'},
  {title:'第17章 风波初起，陆家暗棋', vol:1, html:'<p>峰会落幕，海城商圈彻底炸开了锅。</p>\n<p>建筑行业峰会上发生的一切，以远超预期的速度在各大圈层私群、社交场合疯狂蔓延。</p>\n<p>陆峥寒当众被揭穿双面伪装、温叙白当众动摇离场、沈知予手握铁证当众摊牌……每一个环节都自带顶级话题，足以让整个海城商圈津津乐道整整一个月。</p>\n<p>然而，比这些更让人议论纷纷的，是峰会结束后流传出的另一条消息——</p>\n<p>温叙白没有和沈知予一起离开。</p>\n<p>而是坐进了陆峥寒的车。</p>\n<p>这条消息如同一颗深水炸弹，在海城各大圈层掀起滔天巨浪。</p>\n<p>所有人都在猜测：那位素来清冷疏离、从不给任何人特殊待遇的温设计师，在亲眼看清陆峥寒双面伪装之后，竟然还是选择了偏袒？</p>\n<p>这究竟是感情蒙蔽了理智，还是陆峥寒的温柔套路，已经深到让人无法自拔？</p>\n<p>议论声铺天盖地，却无人敢当面置喙——一个是商界阎王，一个是业内封神，谁也没有胆量去触这两位顶级大佬的霉头。</p>\n<p>而风暴中心的两人，此刻正安静地坐在温叙白的车里，与外界的喧嚣截然隔绝。</p>\n<p>温叙白专注开着车，车速平稳舒缓，清冷的眉眼恢复了往日的疏离平静，仿佛峰会上那场惊天对峙只是微不足道的小插曲。</p>\n<p>可微微泛红的耳尖，和搭在方向盘上不自觉收紧的指节，却无声泄露了他心底尚未完全平复的涟漪。</p>\n<p>陆峥寒坐在副驾——那个旁人穷尽多年都触碰不到的专属位置，姿态安分乖巧，没有刻意黏贴纠缠，只是安静地侧着头，目光贪恋地描摹着温叙白清冷的侧颜。</p>\n<p>峰会上那场风暴，比他预想得更凶险。</p>\n<p>沈知予准备充分，证据确凿，若非温叙白心软护短，后果不堪设想。</p>\n<p>他险些就失去了这份独一无二的偏爱。</p>\n<p>这个念头让陆峥寒心底微微发紧，连呼吸都带着一丝后怕。他微微偏头，目光愈发柔软，声线压得低沉软糯，带着劫后余生的珍惜："叙白，谢谢你。"</p>\n<p>温叙白没有转头，清冷声线平淡如常："谢什么？"</p>\n<p>"谢谢你选了我。"陆峥寒的语气很轻，轻到几乎被车载香薰的气息吞没，却字字清晰，落在温叙白耳中，"在所有人都觉得你不该原谅我的时候。"</p>\n<p>车厢里安静了两秒。</p>\n<p>温叙白喉间微动，指尖在方向盘上轻轻摩挲了一下，语气依旧清冷，却藏着一丝不易察觉的纵容："别得意，我只是觉得沈知予当众发难的方式更过分。"</p>\n<p>嘴硬，一如既往。</p>\n<p>陆峥寒眼底瞬间漾开温柔的笑意，心口暖得发烫。他没有拆穿温叙白口是心非的小习惯，只是乖乖应声，语气虔诚又温顺："好，是我得意了，以后注意。"</p>\n<p>温叙白耳廓的绯色又深了几分，干脆不再搭话，专注开车。</p>\n<p>车窗外，城市霓虹流转，光影交替落在两人身上，温柔又静谧。</p>\n<p>与车厢内的安宁截然不同的是，此刻，海城西郊陆家老宅，气氛凝重如冰。</p>\n<p>陆家老宅占地极广，青砖灰瓦，古朴庄严，处处透着百年世家的底蕴与威严。此刻，正厅内灯火通明，檀木太师椅上端坐着一位鬓发斑白的老妇人，气质雍容<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，眉眼间自带不怒自威的气场。</p>\n<p>陆老夫人，陆峥寒的祖母，陆家真正的定海神针。</p>\n<p>她手边搁着一部手机，屏幕上是一则商圈私群里流传的消息——有人拍到了峰会结束后，温叙白坐进陆峥寒车里的画面，配文暧昧直白：温设计师在看清陆总双面真面目后，仍选择与之同车离去，二人关系匪浅。</p>\n<p>老夫人看完，面色沉如寒霜。</p>\n<p>旁边站着陆家的管家周伯，微微欠身，低声汇报道："老夫人，今天的建筑峰会上，沈家少爷沈知予当众揭穿了少爷的双面行事，拿出了少爷暗中打压沈家的全部证据。全场哗然，温先生当场动摇离场。但后来……二人在休息室单独谈过之后，温先生还是选择了和少爷一起离开。"</p>\n<p>老夫人缓缓抬眸，眼底掠过一丝冷意："峥寒为了一个设计师，在商场上用那些见不得光的手段打压沈家？"</p>\n<p>"是。"</p>\n<p>"糊涂。"老夫人将手机搁在桌上，声线沉稳威严，带着不容置疑的威压，"峥寒从小行事果决，我从不担心他的手段。但为了一个男人，失了分寸，闹到当众被人揭穿的地步，传出去，陆家的脸面往哪搁？"</p>\n<p>周伯低眉敛目，不敢接话。</p>\n<p>老夫人沉默片刻，指尖缓缓叩击着太师椅扶手，节奏沉稳，却带着无形的压迫感。</p>\n<p>"温叙白，我查过，顶尖建筑设计师，温家底蕴不错，但和陆家不在一个量级。更重要的是——"她微微眯起眼，语气冷沉，"峥寒对他，不只是私交那么简单。"</p>\n<p>周伯微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>："老夫人明鉴。少爷对温先生的偏宠，已经不是秘密，海城商圈都有传闻。"</p>\n<p>"一个沈知予追了二十多年都没追到的人，峥寒几番示弱就让他频频破例，这孩子的手段，倒是一脉相承。"老夫人语气里听不出褒贬，却透着沉沉的审视，"但这份偏爱，已经影响到了他的判断和行事分寸。"</p>\n<p>她抬眸看向周伯，声线威严果决："安排一下，明天我要见峥寒。"</p>\n<p>"另外——"老夫人顿了顿，眼底闪过一丝精明的算计，"去查查温叙白的底细，越详细越好。还有，沈知予那边……也别让他闲着。"</p>\n<p>周伯微微一愣，随即领会，躬身应道："是，老夫人。"</p>\n<p>老夫人收回目光，重新端起茶盏，浅浅抿了一口，眉眼间的威严不曾消散半分。</p>\n<p>她不反对峥寒交朋友，更不在意他私下的偏好。但陆家的继承人，感情可以丰富，头脑不能昏聩。</p>\n<p>如果温叙白能让峥寒变得更好，她不介意给一份体面。</p>\n<p>但如果温叙白让峥寒失了分寸、乱了阵脚，那她就必须出手，替孙子扫清这个障碍。</p>\n<p>与此同时，温叙白的车内。</p>\n<p>白色轿车平稳驶入别墅区地下车库，熄火的瞬间，车厢再度归于安静。</p>\n<p>温叙白解开安全带，余光扫向副驾，见陆峥寒安安静静坐着，没有急着下车的意思，眉眼温顺，却藏着一丝不易察觉的忐忑。</p>\n<p>经历了峰会上那场风暴，两人之间的关系虽然化解了危机，却多了一层微妙的转变。从前是陆峥寒单方面套路靠近、温叙白被动接纳；如今真相摊开，温叙白主动选择了偏袒，这份偏爱便不再是无意间的破例，而是清醒的、刻意的、带着温度的选择。</p>\n<p>这份转变，让陆峥寒既欢喜又忐忑。</p>\n<p>他怕温叙白心底仍有芥蒂，怕这份原谅只是一时心软，怕峰会的余波会让温叙白在舆论压力下退缩。</p>\n<p>"叙白。"他轻声开口，语气带着小心翼翼的试探，"外面那些议论……你不用在意。"</p>\n<p>温叙白闻言，微微偏头看向他，清冷的目光平静澄澈，没有丝毫动摇："我在意的是你对我好不好，不是别人怎么说。"</p>\n<p>简单一句话，直白又通透，瞬间击碎了陆峥寒心底所有的不安。</p>\n<p>他喉间微动，眼底涌上滚烫的热意，一时竟说不出话来。</p>\n<p>温叙白见他这副模样，耳廓微红，率先推开车门下了车，清冷的声音从车外传来，带着习惯性的纵容："下车吧，上去喝杯温水再走。"</p>\n<p>陆峥寒弯起唇角，乖乖推门下车，快步跟上那道清挺的白色身影。</p>\n<p>夜色温柔，两人并肩走进电梯，一黑一白，默契如初。</p>\n<p>他们都不知道，此刻的陆家老宅，一场关于这段偏爱的暗棋，已然悄然落子。</p>\n<div class="hook">**【本章钩子：峰会余波席卷商圈，温叙白清醒选择偏袒，甜度升温！陆老夫人强势入局，暗中调查温叙白底细、有意牵动沈知予，家族阻力的第一枚棋子已经落下，更大的风波正在逼近！】**</div>\n'},
  {title:'第18章 祖母召见，阎王低头', vol:1, html:'<p>翌日清晨，陆家老宅。</p>\n<p>青砖灰瓦的古朴院落在晨光中显得格外庄严，百年银杏枝繁叶茂，遮天蔽日，将正厅笼罩在一片沉静的阴影中。</p>\n<p>陆峥寒一身黑色西装，步履沉稳地穿过回廊，踏入正厅。</p>\n<p>他姿态挺拔，眉眼冷冽，周身自带生人勿近的凛冽气场，是商界阎王独有的杀伐气度。可踏入正厅的瞬间，所有锋芒悄然收敛，语气恭敬克制："祖母。"</p>\n<p>檀木太师椅上，陆老夫人端坐如山，鬓发银白，面容矍铄，一双历经岁月沉淀的眼眸深邃锐利，不动声色间便能将人看透。</p>\n<p>"坐。"老夫人声线平淡，不辨喜怒。</p>\n<p>陆峥寒依言落座，脊背笔直，姿态恭敬，却毫无半分畏缩。</p>\n<p>周伯奉上茶盏后退至一旁，垂手侍立，大气不敢出。</p>\n<p>老夫人没有寒暄，开门见山："昨天建筑峰会上的事，你打算怎么收场？"</p>\n<p>陆峥寒面色不变，声线沉稳："沈知予当众发难，已经处理过了。沈家合作暂停，证据链已经切断，不会有后续影响。"</p>\n<p>"我问的不是沈家。"老夫人抬眸，目光如炬，直直落在陆峥寒眼底，"我问的是温叙白。"</p>\n<p>空气瞬间凝滞。</p>\n<p>陆峥寒微微抿唇，沉默两秒，坦然迎上祖母的目光："祖母想问什么，直说便是。"</p>\n<p>老夫人看着他毫不退缩的姿态，眼底掠过一丝不易察觉的审视。</p>\n<p>"你对那个温设计师，到底是什么心思？"</p>\n<p>陆峥寒没有丝毫犹豫，声线低沉而笃定："我对他好，是真心的。不是一时兴起，也不是逢场作戏。"</p>\n<p>老夫人指尖叩了叩扶手，节奏不紧不慢："真心？为了他，你在商场上用那些见不得光的手段打压沈家，被人当众揭穿，陆家的脸面都跟着丢了，这叫真心？"</p>\n<p>"手段是我选的，后果我承担。"陆峥寒语气平稳，没有辩解，"但那份手段，从来不是为了他而用，是沈知予先动了手，我反击而已。只不过方式不够光明正大，这一点，我已经向叙白坦白过了。"</p>\n<p>"他知道了？"老夫人微微挑眉。</p>\n<p>"知道。"陆峥寒<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，"我没有任何隐瞒。"</p>\n<p>老夫人沉默片刻，目光沉沉地审视着他，似在判断这番话里有几分真心。</p>\n<p>良久，她缓缓开口，声线威严而沉静："峥寒，你是陆家的继承人，你的每一个举动都代表着陆家的颜面。我不干涉你交什么朋友，也不在意你的私人偏好。但如果你因为一个人，失了分寸、乱了章法，让陆家沦为商圈笑柄，那祖母就不能坐视不管。"</p>\n<p>陆峥寒微微收紧了指尖，却没有退让："我不会让陆家蒙羞。峰会的事，是我失策，以后不会再有。但温叙白——"</p>\n<p>他顿了顿，语气愈发笃定，带着不容置疑的坚定："我不会放手。"</p>\n<p>四目相对，祖孙二人之间无声交锋，空气中弥漫着无形的压迫感。</p>\n<p>老夫人最终收回目光，端起茶盏浅抿一口，语气听不出情绪："好，我不逼你。但你记住祖母的话——感情可以是软肋，但不能成为命门。陆家的继承人，可以有偏爱，但不能被偏爱牵着鼻子走。"</p>\n<p>"如果有一天，这份偏爱让你做出了错误的决策，祖母会替你做选择。"</p>\n<p>陆峥寒起身，微微躬身，语气恭敬却坚定："我记住了。"</p>\n<p>走出正厅，晨光落在他的肩头，陆峥寒深吸一口气，冷冽的眉眼间掠过一丝罕见的凝重。</p>\n<p>祖母的话，他听进去了。</p>\n<p>但放手，不可能。</p>\n<p>口袋里的手机震动了一下，他低头看去，是温叙白发来的消息，极简的几个字——</p>\n<p>【今天有空吗？想请你帮忙看看新项目图纸。】</p>\n<p>明明是请他帮忙，语气却带着不自知的依赖和期待。</p>\n<p>陆峥寒眼底瞬间柔和下来，所有的凝重一扫而空，指尖快速回复：【有空，随时。】</p>\n<p>发完消息，他抬眸望向远处，目光沉稳而笃定。</p>\n<p>祖母的考验也好，外界的风波也罢，他都不会退让分毫。</p>\n<p>这份偏爱，他要定了。</p>\n<p>而此刻的正厅内，老夫人放下茶盏，对一旁的周伯淡淡开口："他走了？"</p>\n<p>"是，老夫人。"</p>\n<p>老夫人微微阖眸，声线平静："该查的，继续查。沈知予那边，也别断了线。"</p>\n<p>"是。"</p>\n<p>周伯躬身退下，正厅重归寂静。</p>\n<p>老夫人睁开眼，望向院中那棵百年银杏，目光深邃难测。</p>\n<p>她给了峥寒机会，但最终这个温叙白值不值得，还得看她查出来的结果。</p>\n<div class="hook">**【本章钩子：祖孙正面交锋，陆峥寒立场坚定不肯放手！陆老夫人暗中布局不停，双线调查同步推进——温叙白底细、沈知予动向，家族博弈的棋局已然展开！】**</div>\n'},
  {title:'第19章 暗棋初动，旧人入局', vol:1, html:'<p>陆老夫人的指令如同精密齿轮，迅速无声地转动起来。</p>\n<p>周伯亲自督办，两路人马同时行动：一路深入调查温叙白的家世背景、成长经历、社交圈层，事无巨细；另一路则悄然接触沈知予，以"陆家旁支"的名义，试探合作意向。</p>\n<p>与此同时，海城建筑设计师事务所。</p>\n<p>温叙白的工作室坐落在城中心一栋极简风格的独立建筑内，通体白墙，落地玻璃干净通透，室内陈设规整至极，每一件物品都按照精确的角度和位置摆放，完美契合主人极致的强迫症与洁癖。</p>\n<p>此刻，他正站在巨大的制图台前，修长白皙的指尖握着铅笔，在图纸上勾勒着流畅利落的线条，眉眼专注清冷，周身散发着让人不敢打扰的沉静气场。</p>\n<p>陆峥寒推门而入时，带进来一缕清冽的雪松气息。</p>\n<p>他没有出声打扰，只是安静地走到旁边的沙发落座，姿态乖巧安分，目光黏在温叙白专注的侧脸上，眼底满是温顺的贪恋。</p>\n<p>桌上放着温叙白提到的项目图纸——城东文化中心建筑设计方案，海城市政府重点工程，温叙白作为首席设计师全权主导。</p>\n<p>"等很久了？"温叙白头也没抬，清冷的声线里带着不自觉的柔和。</p>\n<p>"没有。"陆峥寒微微摇头，声线软糯，"看你画图，不无聊。"</p>\n<p>温叙白耳廓微热，没有接话，继续专注手上的线条。</p>\n<p>安静的工作室里，只有铅笔划过纸面的细微沙沙声，和两人交织的轻浅呼吸，温柔又静谧。</p>\n<p>这种无人言语却默契十足的陪伴，已经成了两人之间越来越常见的常态。</p>\n<p>自从峰会坦白之后，温叙白不再被动地接受陆峥寒的靠近，而是开始不自觉地主动留出空间——给他留副驾、给他留茶杯、给他留一段不必言说的陪伴时间。</p>\n<p>这些细微的改变，陆峥寒全部看在眼里，珍藏在心底。</p>\n<p>半小时后，温叙白放下铅笔，微微活动了下僵硬的肩颈，转头看向沙发上安安静静的男人："看完了？"</p>\n<p>"嗯。"陆峥寒起身，走到他身旁，目光落在图纸上，"城东文化中心？这个项目我看过招标信息，竞争很激烈。"</p>\n<p>"嗯，有五六家事务所同时竞标。"温叙白淡淡应声，语气平静自信，"但这个项目，我势在必得。"</p>\n<p>清冷笃定的语气，是顶尖设计师对自身实力的绝对自信。</p>\n<p>陆峥寒看着他清冷侧脸上不自知的锋芒，眼底掠过一丝骄傲和温柔。</p>\n<p>他的叙白，从来不是需要庇护的弱者，而是与他并肩的强者。</p>\n<p>"需要我做什么？"陆峥寒问，语气认真。</p>\n<p>温叙白微微偏头看他，眼底掠过一丝浅浅的笑意："帮我看看整体动线，从商业运营的角度，有没有不合理的布局。"</p>\n<p>"好。"陆峥寒欣然应下。</p>\n<p>两人在图台前并肩而立，一左一右，一个从建筑设计角度，一个从商业运营角度，低声讨论，默契配合。</p>\n<p>距离极近，呼吸交织，清冽的雪松气息与干净的薄荷香缠绕在一起，暧昧又自然。</p>\n<p>温叙白偶尔抬手指出图纸上需要修改的细节，指尖修长白皙，动作利落优雅。陆峥寒的目光常常从图纸上偏移，落在那双好看的手上，眼底温柔得几乎要溢出来。</p>\n<p>"你在看什么？"温叙白察觉到他的走神，清冷挑眉。</p>\n<p>"在看你。"陆峥寒坦然得不像话，语气软糯认真，"你专注的样子，很好看。"</p>\n<p>温叙白耳尖一下子红了起来，别开视线，语气故作冷淡："正经点，看图纸。"</p>\n<p>"我很正经。"陆峥寒微微弯唇，乖巧地重新看向图纸，眼底笑意却怎么也压不下去。</p>\n<p>就在两人独处的温柔氛围中，城市的另一端，暗棋悄然落下。</p>\n<p>海城某高档私人会所，包厢内灯光柔和。</p>\n<p>沈知予独自坐在沙发上，面前搁着一杯未曾动过的咖啡，温润的眉眼间满是复杂的审视。</p>\n<p>对面坐着一位中年男人，自称陆家旁支的管事，态度谦和有礼，措辞却暗藏机锋。</p>\n<p>"沈少爷，老夫人对您的才干和风度十分欣赏。她说，温先生与您二十多年青梅竹马的情谊，绝非旁人可以轻易替代。如今陆峥寒一意孤行，用手段蒙蔽温先生，老夫人心痛之余，也希望有人能帮温先生看清真相。"</p>\n<p>沈知予指尖微微收紧，沉默不语。</p>\n<p>对方继续道："老夫人不是要为难谁，只是不希望温先生被人算计而不自知。沈少爷若愿意，老夫人可以提供一些……陆峥寒不为人知的内幕。"</p>\n<p>沈知予缓缓抬眸，温润的眼底掠过一丝冷意："你们老夫人，是让我去拆陆峥寒的台？"</p>\n<p>管事微笑不语，算是默认。</p>\n<p>沈知予心中冷笑。</p>\n<p>昨天峰会上，他已经当众摊牌过一次，结果呢？温叙白选择了陆峥寒。</p>\n<p>如今陆家老夫人暗中找上他，打着"保护温叙白"的旗号，不过是想利用他当棋子，替陆家清扫"障碍"罢了。</p>\n<p>他沈知予追了温叙白二十多年，靠的是真心守护，不是阴谋算计。</p>\n<p>"替我谢谢老夫人的好意。"沈知予站起身，语气平淡疏离，"叙白的选择，我尊重。他过得好，我就放心了。至于陆峥寒的事，我不想再掺和。"</p>\n<p>说完，他转身离去，步伐沉稳，背影挺拔。</p>\n<p>走出会所，夜风拂面，沈知予深吸一口气，温润的眼底终于彻底归于平静。</p>\n<p>他输了，输得坦荡。</p>\n<p>但绝不会沦为他人的棋子，去做伤害温叙白的事。</p>\n<p>哪怕那个人，是陆峥寒的亲祖母。</p>\n<div class="hook">**【本章钩子：陆老夫人暗棋落空，沈知予断然拒绝合作！霸总温柔陪伴温叙白工作，暧昧甜度持续升级。但老夫人的调查仍在继续，温家往事即将浮出水面——一个连温叙白自己都未曾预料到的秘密！】**</div>\n'},
  {title:'第20章 温家往事，底牌初现', vol:1, html:'<p>陆家老宅，书房。</p>\n<p>周伯将一份厚厚的调查档案恭敬地呈到老夫人面前，语气沉稳："老夫人，温叙白的背景已经全部查清。"</p>\n<p>老夫人戴上老花镜，翻开档案，目光细细扫过每一页。</p>\n<p>温叙白，二十七岁，温家独子。父亲温崇远，原是海城大学结构工程系副教授，母亲苏敏华，同校美术系讲师，出身书香门第，精通书画。温家虽非顶级豪门，但家底殷实，底蕴清白。</p>\n<p>温叙白自幼展露建筑天赋，十六岁获国际青年建筑设计金奖，二十岁毕业于海外顶尖建筑学院，回国后三年内接连拿下数个地标项目，跻身海城顶级设计师之列。</p>\n<p>履历光鲜，履历干净，挑不出半分毛病。</p>\n<p>老夫人翻到下一页，目光忽然微微一顿。</p>\n<p>"这是什么？"</p>\n<p>周伯上前一步，低声解释："老夫人，我们查到，温叙白的父亲温崇远，二十年前曾与陆氏集团有过一次商业往来。当时陆氏还在初创扩张期，城北一个地产项目，温崇远以海城大学副教授的身份担任结构工程顾问。项目中途，陆氏与合作方发生纠纷，当时的掌权人——老太爷——以雷霆手段发起诉讼，连带将顾问方温崇远一同告上法庭。温崇远被判定承担连带责任，学术声誉尽毁，在国内无法立足，被迫携妻远走海外，此后再未回国。"</p>\n<p>老夫人微微眯眼："陆氏的纠纷？是谁主导的？"</p>\n<p>"当时的决策人是……老太爷。"周伯语气谨慎，"也就是老夫人的丈夫。"</p>\n<p>书房内陷入短暂的沉寂。</p>\n<p>老夫人指尖微微一顿，目光落在档案上，眸色复杂难辨。</p>\n<p>二十年前，陆氏初创扩张期，手段强硬是常态。老太爷行事雷厉风行，商业纠纷中从不手软，温崇远不过是被殃及的池鱼，在那个时代再寻常不过。</p>\n<p>可偏偏，那个被殃及的人，是温叙白的父亲。</p>\n<p>"温崇远后来怎样了？"</p>\n<p>"学术声誉尽毁，国内无法立足，被迫携妻远走海外。温叙白当时年仅十二岁，留在国内由祖父母抚养，直到高中才被接到国外团聚。母亲苏敏华在海外靠教画和打零工维持生计，清贫但体面。"周伯顿了顿，"温叙白从小就知道父亲是被商业纠纷拖垮的，但从未公开提及对方是谁。以他的能力，查到陆氏并不难，但他……似乎选择了不追究。"</p>\n<p>老夫人缓缓合上档案，摘下老花镜，指尖叩击着桌面，节奏沉稳却透着隐隐的凝重。</p>\n<p>这层旧怨，如同一把悬在头顶的刀。</p>\n<p>如果温叙白知道了陆家与温家的这段往事，他对陆峥寒的所有偏爱和信任，会不会瞬间崩塌？</p>\n<p>而陆峥寒——他知不知道这段往事？</p>\n<p>"峥寒知道吗？"老夫人问。</p>\n<p>"据调查，温叙白本人都未必清楚纠纷对方是陆氏，陆峥寒应该更不知情。"</p>\n<p>老夫人沉默了。</p>\n<p>这份底牌，是一把双刃剑。</p>\n<p>用得好，可以彻底拆散陆峥寒和温叙白；用不好，反而会激怒陆峥寒，让他与陆家产生不可调和的裂痕。</p>\n<p>"先压下来，不要让任何人知道。"老夫人最终开口，语气沉缓，"包括峥寒。"</p>\n<p>"是。"周伯应声，却又犹豫了一下，"老夫人，如果不利用这件事……"</p>\n<p>"我不用这种手段。"老夫人淡淡打断他，声线平静却透着不容置疑的威严，"如果温叙白值得，这段往事就不该成为阻碍。如果他不值得，那也不需要用二十年前的旧事来赶人。"</p>\n<p>周伯微微躬身，不再多言。</p>\n<p>老夫人望向窗外，百年银杏在风中沙沙作响，她眼底掠过一丝复杂的情绪。</p>\n<p>她开始对温叙白有了一丝另眼相看——一个明知父亲被商业纠纷拖垮，却选择不追究、不怨恨，靠自身实力闯出名堂的人，这份心性和格局，确实不俗。</p>\n<p>但，够不够格站在陆峥寒身边，还得再看看。</p>\n<p>与此同时，陆氏集团总裁办公室。</p>\n<p>陆峥寒坐在宽大的办公桌后，面前摊着几份文件，却心不在焉。</p>\n<p>林舟推门而入，神色微凝，低声汇报："陆总，老夫人派人在调查温先生的背景，我们的人截获了一部分调查动向。另外……调查方向似乎涉及温先生父亲的旧事。"</p>\n<p>陆峥寒指尖骤然收紧，眸色冷沉："我父亲的旧事？"</p>\n<p>"不是令尊，是温先生的父亲。具体内容还在查，但调查深度远超普通背调。"</p>\n<p>陆峥寒沉默了两秒，声线冷得刺骨："祖母查叙白？"</p>\n<p>"是。"</p>\n<p>他缓缓靠回椅背，指尖轻轻叩击桌面，冷冽的眉眼间翻涌着不易察觉的<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>。</p>\n<p>祖母的试探，他能理解。但查到叙白家人头上，触碰了他的底线。</p>\n<p>"加强温叙白身边的信息安保，所有与他相关的私人数据，全部提升加密级别。"陆峥寒冷声吩咐，"另外，查清楚祖母的人挖到了什么，特别是关于叙白父亲的部分。"</p>\n<p>"是。"林舟迅速应声，转身离去。</p>\n<p>陆峥寒独自坐在办公室里，冷冽的目光落在窗外的城市天际线上，心底隐隐泛起不安。</p>\n<p>叙白的父亲……到底和陆家有什么渊源？</p>\n<p>他不知道，但他预感，这份被岁月掩埋的往事，迟早会浮出水面。</p>\n<p>而到那时，他和温叙白之间好不容易建立起来的信任与偏爱，将面临真正的考验。</p>\n<p>手机屏幕亮起，温叙白发来一条消息：【图纸改好了，明天城东文化中心竞标方案终审，有空来看吗？】</p>\n<p>陆峥寒看着屏幕上清冷淡然的文字，心底的不安被一股柔软的暖意渐渐覆盖。</p>\n<p>他回复：【一定到。】</p>\n<p>然后放下手机，目光重新变得沉稳笃定。</p>\n<p>不管旧事如何，不管祖母如何试探，他都不会让任何人、任何往事，动摇这份偏爱分毫。</p>\n<div class="hook">**【本章钩子：温家与陆家二十年前的隐秘渊源浮出水面！陆老夫人手握底牌却选择按下不表，陆峥寒察觉异常暗中布防。这段被岁月掩埋的旧怨，如同一颗定时炸弹，随时可能引爆两人之间的信任危机！】**</div>\n'},
  {title:'第21章 职场发难，暗中护短', vol:1, html:'<p>城东文化中心竞标终审会，海城市政府一号会议室。</p>\n<p>会场内座无虚席，六家顶尖建筑事务所的设计团队依次入座，气氛剑拔弩张。</p>\n<p>温叙白带队出席，一身纯白西装，清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，身姿挺拔如松。他面容平静，眉眼间没有丝毫紧张，反而透着胸有成竹的从容，周身清冷气场自动隔绝了周围的嘈杂与试探。</p>\n<p>他的设计方案经过反复打磨，动线流畅，空间利用极致合理，兼具美学与实用，是他近年来最满意的作品之一。</p>\n<p>竞标流程严谨正规，各家依次展示方案，评审团打分提问。</p>\n<p>前三家事务所的方案中规中矩，没有太大亮点。第四家是海城新锐事务所"筑境设计"，首席设计师陈牧，年轻气盛，野心勃勃，一上台便锋芒毕露，方案虽有一定创意，但明显在刻意对标温叙白的风格。</p>\n<p>轮到温叙白登台时，全场目光齐聚。</p>\n<p>他从容走到演示台前，清冷的声线在会议室内平稳响起，条理清晰地阐述设计理念、空间动线、功能布局，每一处细节都经得起最严苛的推敲。</p>\n<p>评审团频频点头，几位业内专家更是露出赞许的目光。</p>\n<p>然而，就在温叙白展示结束后进入提问环节时，意外发生了。</p>\n<p>坐在评审席末尾的一位评审——海城建筑行业协会副会长赵启明，忽然拿出一份文件，语气不咸不淡地开口："温设计师，你方案中引用的地质勘探数据，和市规划局最新公布的补充数据存在出入。如果数据基础有误，整个方案的结构安全性是否需要重新评估？"</p>\n<p>此言一出，全场哗然。</p>\n<p>结构安全性是建筑设计的生命线，一旦数据存疑，整个方案的公信力将大打折扣。</p>\n<p>各家事务所的代表纷纷交头接耳，目光复杂地看向温叙白。</p>\n<p>温叙白团队成员脸色微变，显然没有预料到这一手。</p>\n<p>但温叙白本人，面色丝毫未变。</p>\n<p>他目光落在赵启明手中的文件上，随即淡淡开口，声线平稳无波："赵会长提到的补充数据，是上周五下午四点规划局内部系统临时更新的，尚未正式公示。请问您是如何在公示前获取这份数据的？"</p>\n<p>赵启明脸色微变，一时语塞。</p>\n<p>温叙白没有给他喘息的机会，继续道："另外，我的方案使用的是规划局正式公示版本的数据，完全符合竞标规程要求。至于补充数据，我在提交方案前已经注意到差异，并做了两套结构演算，这里是对应的演算报告，请评审团过目。"</p>\n<p>他从文件夹中抽出一份详尽的演算报告，条理清晰，数据详实，完美回应了所有质疑。</p>\n<p>赵启明脸色彻底沉了下来，攥着文件的手微微发抖。</p>\n<p>温叙白清冷地扫了他一眼，语气不卑不亢："专业的事，用专业的方式讨论。如果是刻意刁难，温某不奉陪。"</p>\n<p>全场鸦雀无声。</p>\n<p>评审团首席专家接过演算报告，仔细审阅后，微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气肯定："温设计师的演算报告完整严谨，数据无误，方案通过。"</p>\n<p>赵启明面色铁青，却不敢再多言。</p>\n<p>竞标结果毫无悬念——温叙白的方案以最高分中标。</p>\n<p>走出会场，团队成员们难掩兴奋，温叙白却面色平淡，仿佛只是完成了一件再寻常不过的事。</p>\n<p>他心底清楚，赵启明那个刁难绝非偶然。</p>\n<p>一个协会副会长，无缘无故在竞标终审会上拿未公示的数据质疑他，背后一定有人授意。</p>\n<p>但他没有追究，只是淡淡扫了一眼会议室的方向，眼底掠过一丝冷意。</p>\n<p>有些事，不需要他亲自出手。</p>\n<p>果然，当天下午。</p>\n<p>陆氏集团总裁办公室。</p>\n<p>林舟将一份调查报告呈到陆峥寒面前："陆总，查清了。赵启明和陆家旁支的周管事有私交，是老夫人通过周伯间接安排的。目的是在温先生竞标时制造障碍，试探温先生的应对能力。"</p>\n<p>陆峥寒听完，眸色冷沉如冰。</p>\n<p>祖母试探叙白，可以理解。但用这种手段，在公开场合给人难堪，触碰了他的底线。</p>\n<p>"赵启明的事，怎么处理？"林舟小心询问。</p>\n<p>陆峥寒沉默两秒，声线冰冷："不用我出手。叙白已经当众打了他的脸，足够了。但赵启明和协会内部的利益输送，你安排人整理证据，递给相关部门。"</p>\n<p>"另外——"他微微抬眸，目光冷冽，"告诉祖母的人，叙白的事，不许再用这种手段。要试探，冲我来。"</p>\n<p>"是。"林舟应声退下。</p>\n<p>陆峥寒独自坐在办公室里，指尖摩挲着温叙白白天发来的消息——【中标了。】</p>\n<p>简简单单三个字，清冷却掩不住的自豪。</p>\n<p>他弯起唇角，眼底漾开温柔的笑意。</p>\n<p>他的叙白，从来不需要他庇护。</p>\n<p>清冷、强势、不卑不亢，凭实力碾压所有质疑，才是温叙白真正的模样。</p>\n<p>而他能做的，就是在暗处扫清那些不该存在的绊脚石，让温叙白的路，走得更干净、更平坦。</p>\n<p>手机屏幕亮起，温叙白又发来一条：【明天有空吗？庆祝一下。】</p>\n<p>陆峥寒指尖飞快回复：【有空，你想怎么庆祝？】</p>\n<p>温叙白：【你选。】</p>\n<p>陆峥寒弯唇，眼底笑意愈发浓郁，回复：【去你家，我下厨。】</p>\n<p>发送之后，他微微顿了顿，随即笑着摇头。</p>\n<p>堂堂陆氏总裁，主动给人心甘情愿下厨，要是让商界那些人知道，怕是要惊掉一地下巴。</p>\n<p>但他甘之如饴。</p>\n<div class="hook">**【本章钩子：温叙白凭实力碾压职场刁难，不卑不亢尽显强者风骨！陆峥寒暗中扫清障碍，护短手段干脆利落。陆老夫人的试探虽被化解，却对温叙白的评价悄然改观——但真正的考验，远未结束！】**</div>\n'},
  {title:'第22章 庆祝之夜，温柔升级', vol:1, html:'<p>傍晚时分，暮色四合，城市霓虹渐次亮起。</p>\n<p>温叙白的私宅内，厨房灯火通明。</p>\n<p>这在以前是绝不可能出现的画面——温叙白的厨房一尘不染，锅具摆放如同博物馆展品，从未开过火。他饮食极简，三餐要么在工作室解决，要么用干净的食材简单处理，从不做饭，更不允许任何人在他的厨房里大动干戈。</p>\n<p>可此刻，陆峥寒系着一条深灰色围裙，袖口利落挽起，露出线条流畅的小臂，正站在流理台前从容不迫地处理食材。</p>\n<p>动作行云流水，干净利落，完全不像一个商界掌权人。</p>\n<p>温叙白靠在厨房门框上，双手环胸，目光落在陆峥寒身上，眉眼间带着一丝不易察觉的柔和与好奇。</p>\n<p>"你会做饭？"他问，语气里带着淡淡的意外。</p>\n<p>"一个人住了这么多年，总要学几道菜的。"陆峥寒回头看他，眼底温顺，笑意温柔，"不然天天吃外卖，胃早废了。"</p>\n<p>温叙白微微蹙眉，洁癖发作："外卖不干净，油盐重，你以前经常吃？"</p>\n<p>"以前忙起来顾不上，偶尔凑合。"陆峥寒语气随意，藏着不经意的示弱。</p>\n<p>温叙白沉默两秒，语气清冷却带着不自觉的责备："以后不许凑合。"</p>\n<p>简简单单一句话，是叮嘱，是管束，更是独一份的偏爱与在意。</p>\n<p>陆峥寒眼底瞬间漾开璀璨的笑意，心口暖得发烫，乖巧应声："好，都听你的，以后不凑合。"</p>\n<p>他转回身继续做菜，唇角的弧度却怎么也压不下去。</p>\n<p>温叙白看着他宽肩窄腰的背影，看着他系着围裙在厨房里忙碌的模样，心底涌起一种从未有过的微妙暖意。</p>\n<p>这个在外杀伐狠绝、人人敬畏的商界阎王，此刻甘愿在他干净的厨房里，系着围裙，为他做一顿饭。</p>\n<p>这份反差，温柔得让人心颤。</p>\n<p>"你站那儿看着，不累？"陆峥寒头也没回，语气带着笑意，"去客厅坐着等，好了我叫你。"</p>\n<p>"不用。"温叙白淡淡拒绝，却没有离开的意思，"我在这里陪你。"</p>\n<p>陆峥寒手上的动作微微一顿，心底被巨大的暖意包裹，连呼吸都变得轻柔。</p>\n<p>他偏头看了温叙白一眼，目光温柔得几乎要溢出来，轻声道："好。"</p>\n<p>两人一前一后待在干净明亮的厨房里，一个做饭，一个安静陪伴，没有多余的话语，却默契得像共度了无数个日夜。</p>\n<p>灶台上的汤锅咕嘟冒着热气，清冽的香气弥漫在空气中，和雪松气息交织在一起，暖意融融。</p>\n<p>半小时后，四菜一汤端上餐桌。</p>\n<p>清蒸鲈鱼、白灼虾仁、蒜蓉西兰花、凉拌木耳，外加一盅温热的山药排骨汤。</p>\n<p>菜品干净清淡，少油少盐，摆盘规整讲究，完全贴合温叙白的洁癖与饮食喜好。</p>\n<p>温叙白看着满桌清淡养胃的菜肴，眼底掠过一丝浅浅的动容。</p>\n<p>这些菜，全是按照他的口味来的。</p>\n<p>"尝尝。"陆峥寒坐在对面，双手交叠放在桌上，姿态乖巧，眼底带着期待和浅浅的紧张，像等待评判的学生。</p>\n<p>温叙白拿起筷子，夹了一块鱼肉，送入口中。</p>\n<p>鱼肉鲜嫩，调味清淡，火候恰到好处，口感干净清爽。</p>\n<p>他微微挑眉，语气清冷却藏着一丝认可："还不错。"</p>\n<p>陆峥寒眼底瞬间炸开笑意，满足得像个得到糖果的孩子，嘴上却谦虚温顺："你喜欢吃就好，以后想吃什么，随时跟我说。"</p>\n<p>"以后？"温叙白夹菜的动作微微一顿，清冷的目光扫向他。</p>\n<p>陆峥寒微微一愣，随即意识到自己话里的深意，耳尖微微泛红，但没有退缩，反而坦然迎上他的目光，语气认真而笃定："嗯，以后。我想经常给你做饭。"</p>\n<p>温叙白喉间微动，心跳莫名漏了一拍。</p>\n<p>他没有回答，只是垂眸继续吃饭，耳廓却悄悄染上了一层绯色。</p>\n<p>陆峥寒将他所有的细微反应尽收眼底，心底的欢喜几乎要溢出来，却不敢太过张扬，只是低头吃饭，嘴角笑意怎么也藏不住。</p>\n<p>饭后，两人并肩坐在沙发上，各执一杯温水，落地窗外是城市璀璨的夜景。</p>\n<p>"叙白。"陆峥寒轻声开口，语气比平时多了几分认真，"祖母那边的事，你可能听说了一些。"</p>\n<p>温叙白微微偏头看他，清冷的目光平静澄澈："嗯，有所耳闻。你不用替我担心，我不在意。"</p>\n<p>"但她可能会用一些手段——"</p>\n<p>"我说了，不在意。"温叙白打断他，语气清冷却笃定，"你的家人怎么看我，是她们的事。我在意的是你对我好不好，不是别人怎么说。"</p>\n<p>和那天在车里的回答一模一样。</p>\n<p>陆峥寒喉间微动，眼底涌上滚烫的热意，一时竟说不出话来。</p>\n<p>这份偏爱，清醒、笃定、毫无保留，比他所有精心设计的套路都要珍贵万倍。</p>\n<p>他微微侧身，小心翼翼地靠向温叙白的肩头，试探而克制，声音低沉软糯："叙白，谢谢你。"</p>\n<p>温叙白没有推开他，甚至微微调整了坐姿，给他更稳的倚靠，语气故作平淡："别老说谢谢，肉麻。"</p>\n<p>陆峥寒弯唇，将脸轻轻埋在他肩窝，闭了闭眼，心底被暖意彻底填满。</p>\n<p>窗外夜色温柔，室内灯光暖融，两人相依而坐，安静而默契。</p>\n<p>这份独属于他们的偏爱，正在一点一滴地，从破例变成习惯，从习惯变成不可或缺。</p>\n<p>而暗处的风波，仍在悄然酝酿。</p>\n<p>陆老夫人按下不表的温家旧事，如同一颗深埋的种子，只等某个契机，便会破土而出。</p>\n<div class="hook">**【本章钩子：庆贺之夜甜度拉满，霸总下厨、美人陪伴，温柔升级！温叙白再次清醒表态"只在意你对我好不好"，偏爱从破例变成习惯。但温家旧事如定时炸弹，陆老夫人按下不表的秘密，随时可能引爆新的危机！】**</div>\n'},
  {title:'第23章 不期而遇，祖母试探', vol:1, html:'<p>周末，海城美术馆。</p>\n<p>一场名为"光影之间"的国际建筑摄影展正在展出，吸引了大批业内人士和艺术爱好者前来观展。</p>\n<p>温叙白独自前来，一身纯白休闲西装，清冷<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，与喧嚣的人群自动保持着得体的距离。他不喜欢周末外出，但这次摄影展中有几幅他欣赏的建筑大师早期作品，难得提了兴趣。</p>\n<p>展厅内光线柔和，温叙白在一幅黑白摄影前驻足，目光落在画面上——那是日本建筑师安藤忠雄早期作品"光之教堂"的标志性十字光缝，光影切割空间，极致而纯粹。</p>\n<p>他看得入神，连身后有人靠近都未曾察觉。</p>\n<p>"这幅作品拍得很好，光线切割的力度，恰到好处。"</p>\n<p>一道沉稳温润的老年女声在身后响起，不急不缓，带着岁月沉淀的从容。</p>\n<p>温叙白微微侧身，目光礼貌而疏离地扫过来，只见一位鬓发银白的老妇人站在身侧，气质雍容<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，穿着考究，周身散发着不怒自威的气场。</p>\n<p>他不认识这位老妇人，但出于教养，微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>致意："确实，安藤忠雄的光影运用，是建筑与自然对话的极致。"</p>\n<p>老夫人微微一笑，目光不着痕迹地打量着他。</p>\n<p>这就是温叙白。</p>\n<p>比照片上更清冷、更<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，站在那里自带疏离气场，却又不失礼貌得体。目光干净澄澈，没有半分谄媚或算计，纯粹得让人意外。</p>\n<p>"你是学建筑的？"老夫人随口问道，语气自然，像是寻常观展者之间的闲聊。</p>\n<p>"建筑设计师。"温叙白简短应答，目光重新落回照片上。</p>\n<p>"做建筑设计很辛苦吧？这个行业竞争激烈，能脱颖而出的人不多。"</p>\n<p>"热爱就不辛苦。"温叙白语气平淡，没有炫耀，也没有谦虚，只是陈述事实，"做喜欢的事，再累也值得。"</p>\n<p>老夫人眼底掠过一丝不易察觉的赞许。</p>\n<p>这份不卑不亢、不炫耀不抱怨的态度，比她预想的要好。</p>\n<p>两人并肩缓步前行，有一搭没一搭地聊着展览中的作品。老夫人看似随意，实则每一句话都暗藏试探——问他的工作理念、对家庭的看法、对人生的选择。</p>\n<p>温叙白回答得简洁坦荡，没有刻意迎合，也没有刻意回避，清冷平和，自有一番笃定风骨。</p>\n<p>走到一幅城市天际线的摄影作品前，老夫人忽然开口："年轻人，你觉得事业和家庭，哪个更重要？"</p>\n<p>温叙白微微一顿，目光落在照片上密密麻麻的城市楼宇间，沉默两秒，淡淡开口："不冲突。真正重要的人和事，不会因为事业而让步。"</p>\n<p>"但如果两者起了冲突呢？"</p>\n<p>"那说明，其中一方出了问题。"温叙白偏头看向老夫人，清冷的目光平静而坦然，"值得珍惜的人，不会让你在事业和他之间做选择。会逼你做选择的，本身就不够重要。"</p>\n<p>老夫人微微一怔。</p>\n<p>这番话，没有华丽的辞藻，却透着通透与笃定，带着年轻人少有的清醒。</p>\n<p>她心底对温叙白的评价，又悄悄上浮了几分。</p>\n<p>"说得好。"老夫人微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气真诚，"年轻人有这份清醒，很难得。"</p>\n<p>温叙白淡淡一笑，礼貌而疏离，没有多言。</p>\n<p>就在这时，他的手机震动了一下，低头看去——陆峥寒发来一条消息：【你在哪？今天有空吗？】</p>\n<p>温叙白指尖快速回复：【美术馆，看摄影展。】</p>\n<p>陆峥寒秒回：【等我，马上到。】</p>\n<p>温叙白看着屏幕，耳廓微微泛红，清冷的眉眼不自觉柔和了几分。</p>\n<p>老夫人将他细微的神色变化尽收眼底，眼底掠过一丝了然的笑意。</p>\n<p>那份不自觉的柔软，只有在面对真正在意的人时，才会流露。</p>\n<p>"朋友？"老夫人随口问。</p>\n<p>"嗯。"温叙白收起手机，语气清淡，"一个……很重要的人。"</p>\n<p>他顿了顿，似乎对自己这番话也有些意外，耳尖微红，但没有改口。</p>\n<p>老夫人微微一笑，没有再追问，心中却已了然。</p>\n<p>这个孩子，对峥寒的心意，是真的。</p>\n<p>"那我先走了。"老夫人微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，语气温润，"年轻人，很高兴和你聊天。"</p>\n<p>"您慢走。"温叙白礼貌送别，目送老妇人转身离去，背影雍容沉稳，消失在展厅尽头。</p>\n<p>他不知道，这位萍水相逢的老妇人，正是陆峥寒的祖母。</p>\n<p>也不知道，这场看似偶然的相遇，是一场精心安排的试探。</p>\n<p>而试探的结果，远超老夫人的预期。</p>\n<div class="hook">**【本章钩子：陆老夫人亲自下场试探，温叙白不卑不亢尽显通透风骨！老夫人评价悄然改观，却仍未下定论。而温叙白口中"很重要的人"，让老夫人看到了真情——但温家旧事的阴影仍在，最终的考验即将到来！】**</div>\n'},
  {title:'第24章 祖母放手，暗线未断', vol:1, html:'<p>陆峥寒赶到美术馆时，温叙白正站在出口处等他，一身白衣，清冷如画，在人群中格外醒目。</p>\n<p>他快步走上前，目光下意识扫过四周，确认没有异常后，才微微松了口气，语气带着浅浅的急切："等很久了？"</p>\n<p>"刚出来。"温叙白淡淡应声，目光落在他微微泛红的脸颊上，"你跑来的？"</p>\n<p>"嗯，停车场太远，懒得等代驾。"陆峥寒随口解释，眼底温顺，笑意温柔，"怕你等急了。"</p>\n<p>温叙白耳廓微红，没有戳穿他的小心思，转身朝展厅方向走去："走吧，有几幅作品不错。"</p>\n<p>两人并肩走入展厅，一黑一白，默契如初。</p>\n<p>陆峥寒走着走着，忽然觉得展厅门口一个离去的背影有些眼熟——雍容<span class="annot" data-tip="高贵而矜持，形容人的气质高雅不凡">矜贵</span>，步态沉稳，像极了祖母。</p>\n<p>他微微蹙眉，心底掠过一丝警觉，却没有声张。</p>\n<p>如果祖母真的来过，以她的行事风格，一定是来试探温叙白的。</p>\n<p>他不动声色地拿出手机，给林舟发了一条消息：【查一下祖母今天的行程。】</p>\n<p>随后收起手机，目光重新落在温叙白身上，看他清冷的侧脸在柔和灯光下愈发精致，心底的警觉渐渐被柔软覆盖。</p>\n<p>不管祖母做了什么，只要温叙白不受影响，就好。</p>\n<p>展厅内，温叙白在一幅光影建筑摄影前驻足，清冷的目光专注而认真，像是在品读建筑的灵魂。</p>\n<p>陆峥寒站在他身侧，没有看照片，只看他。</p>\n<p>"你在看什么？"温叙白察觉到他的目光，清冷挑眉。</p>\n<p>"看你。"陆峥寒坦然得不像话，"比照片好看。"</p>\n<p>温叙白耳尖瞬间染红，别开视线，语气故作冷淡："正经点。"</p>\n<p>"我很正经。"陆峥寒微微弯唇，眼底笑意温柔。</p>\n<p>温叙白不再理他，继续看展，耳廓的绯色却迟迟未褪。</p>\n<p>与此同时，陆家老宅。</p>\n<p>老夫人回到正厅，周伯迎上前奉茶。</p>\n<p>"老夫人，今天见面感觉如何？"</p>\n<p>老夫人端起茶盏，浅浅抿了一口，沉默片刻才缓缓开口："这个孩子，比我想象的要好。"</p>\n<p>周伯微微一怔，试探道："那老夫人的意思是……"</p>\n<p>"不卑不亢，通透清醒，不攀附、不逢迎、不抱怨，靠自己本事闯出来的。"老夫人语气里带着罕见的认可，"峥寒看人的眼光，倒是不差。"</p>\n<p>"那……温家旧事的事——"</p>\n<p>"我说了，不用那种手段。"老夫人放下茶盏，语气沉稳，"这段旧事，暂时压着。但不是因为我心软，而是——"</p>\n<p>她微微顿了顿，目光深邃："我想再看看。看看这份偏爱，经不经得起时间的考验。"</p>\n<p>周伯微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，不再多言。</p>\n<p>老夫人望向院中的银杏树，秋风吹过，金黄的叶子纷纷扬扬落下。</p>\n<p>她不再主动出手干预，但并不意味着她会完全放手。</p>\n<p>这份偏爱，到底是真情还是一时冲动，时间会给出答案。</p>\n<p>而她，有的是耐心等。</p>\n<div class="hook">**【本章钩子：陆老夫人亲测温叙白品性，给出罕见认可，决定暂不出手干预！但"暂时压着"不等于"彻底放下"，温家旧事仍是悬而未决的暗线。陆峥寒察觉祖母行踪，暗中也开始了自己的调查——两方博弈，仍在无声进行！】**</div>\n'},
  {title:'第25章 雨夜独占，偏爱无声', vol:1, html:'<p>连日晴朗的海城，忽然在周三傍晚变了一张脸。</p>\n<p>乌云翻涌，狂风骤起，豆大的雨点猝不及防地砸落下来，整座城市瞬间笼罩在一片白茫茫的雨幕之中。</p>\n<p>温叙白站在工作室门口，看着面前密不透风的雨帘，清冷的眉峰微微蹙起。</p>\n<p>他看了眼手机，打车软件排队已超两百人，这种天气，短时间内根本不可能叫到车。</p>\n<p>工作室里其他同事早已各自想办法离开，只剩他一人。</p>\n<p>他不喜欢雨天——潮湿、泥泞、地面积水，洁癖让他对这种天气格外抗拒。鞋子沾上泥水、裤脚被打湿、空气里弥漫的潮湿气味，每一样都让他浑身不适。</p>\n<p>正犹豫要不要冒雨走到地铁站，一辆黑色轿车破开雨幕，稳稳停在了工作室门口。</p>\n<p>车窗降下，露出陆峥寒那张深邃温润的面孔。</p>\n<p>"上车。"他语气简洁，声线在雨声中依旧清晰。</p>\n<p>温叙白微微一愣，清冷的目光透过雨幕看向他："你怎么来了？"</p>\n<p>"看到天气预报说今天有暴雨，知道你没带伞，怕你淋雨。"陆峥寒语气自然得像在说今天天气不好一样稀松平常，眼底却藏着小心翼翼的关切。</p>\n<p>温叙白喉间发紧，心里涌起一股暖意。</p>\n<p>他没有再多问，快步冲进雨中，拉开副驾车门坐了进去。</p>\n<p>车门关上的瞬间，雨声被隔绝在外，车厢内温暖干燥，清冽的车载香薰气息混着陆峥寒身上的雪松味，瞬间包裹住他。</p>\n<p>温叙白的西装肩头被雨水打湿了一小片，陆峥寒已经从后座拿出一块干净柔软的毛巾，递到他面前，语气带着浅浅的责备和心疼："先擦擦，别着凉。"</p>\n<p>温叙白接过毛巾，低头擦拭肩头的雨水，余光扫到陆峥寒自己的袖口也溅湿了，却顾不上自己，先从后座拿出一件干净的外套披在他肩上。</p>\n<p>"你不冷？"温叙白微微蹙眉。</p>\n<p>"不冷。"陆峥寒微微摇头，发动车子，车速平稳舒缓，小心翼翼地避开积水路段，"你怕冷，先暖着。"</p>\n<p>温叙白裹着带有陆峥寒体温的外套，清冽的雪松气息层层裹住他，暖意从肩头蔓延至四肢百骸。</p>\n<p>他垂眸看着自己肩上宽大的黑色外套，心底的暖意几乎要溢出来。</p>\n<p>车窗外暴雨如注，雨刷有节奏地摆动，城市霓虹在雨幕中碎成一片流光溢彩。车厢内却安静温暖，仿佛与外界的风雨彻底隔绝。</p>\n<p>"今天怎么这么晚？"陆峥寒轻声问，目光专注前方路况，语气里带着不自知的关切。</p>\n<p>"城东文化中心的深化方案，在调整细节。"温叙白靠在座椅上，语气清冷却柔和，"明天要提交终版，今晚加班赶完了。"</p>\n<p>"又加班到这么晚。"陆峥寒微微蹙眉，语气带着浅浅的责备，"不按时吃饭？"</p>\n<p>"吃了，订的工作餐。"</p>\n<p>"工作餐重油重盐，不干净。"陆峥寒想都没想就脱口而出，随即意识到自己语气太像管束，耳尖微红，放软了声线，"我是说……回去我给你煮碗面，干净热乎。"</p>\n<p>温叙白偏头看向他，目光里掠过一丝不易察觉的温柔。</p>\n<p>这个人，在暴雨天穿越半个城市来接他，只因为怕他淋雨。接到之后第一反应不是抱怨天气，而是心疼他加班、没好好吃饭。</p>\n<p>这份偏爱，无声却汹涌。</p>\n<p>"好。"温叙白轻声应答，一个字，温柔又纵容。</p>\n<p>陆峥寒眼底瞬间亮了起来，唇角微微上扬，乖巧得像个得到嘉奖的孩子，专注开车，连呼吸都轻快了几分。</p>\n<p>车子驶入别墅区，温叙白看着窗外熟悉的景色，忽然开口："峥寒。"</p>\n<p>"嗯？"</p>\n<p>"以后下雨天……你可以来接我吗？"</p>\n<p>陆峥寒握着方向盘的手微微一颤，心底被巨大的暖意猛然击中。</p>\n<p>这是温叙白第一次主动开口，向他提出请求。</p>\n<p>不是被动的接纳，不是无奈的迁就，而是清醒的、刻意的、带着温度的邀请。</p>\n<p>"可以。"陆峥寒声音微哑，语气却笃定得不容置疑，"每一次都可以。"</p>\n<p>温叙白耳尖泛红，别开视线望向窗外，不再说话。</p>\n<p>车厢内安静下来，只有雨点敲打车顶的细密声响，和两人交织的呼吸，温柔而<span class="annot" data-tip="情意缠绵，难舍难分的样子">缱绻</span>。</p>\n<p>这份独属于雨夜的偏爱，无声却滚烫，将两颗心之间的最后一点距离，又悄悄拉近了几分。</p>\n<div class="hook">**【本章钩子：暴雨夜专属接送，温叙白首次主动开口请求陪伴，偏爱从被动变成双向！甜度爆表的雨夜独处，两人关系悄然升温。但陆峥寒暗中调查温家旧事的线索越来越近，一个他不愿面对的真相，即将浮出水面！】**</div>\n'},
  {title:'第26章 旧事浮沉，真相将现', vol:1, html:'<p>陆峥寒的调查结果，比他预想的更加沉重。</p>\n<p>深夜，陆氏集团总裁办公室。</p>\n<p>林舟将一份密封的档案袋放在桌上，神色凝重："陆总，全部查清了。"</p>\n<p>陆峥寒拆开档案袋，目光落在第一页，瞳孔骤缩。</p>\n<p>二十年前，陆氏集团初创扩张期，城北地产项目。温叙白的父亲温崇远以海城大学副教授的身份担任结构工程顾问，项目进行到一半，陆氏与合作方发生合同纠纷，当时的掌权人——陆峥寒的祖父陆老太爷——以雷霆手段发起诉讼，连带将顾问方温崇远一同告上法庭。</p>\n<p>温崇远被判定承担连带责任，学术声誉尽毁，在国内无法立足，被迫携妻远走海外。温叙白年仅十二岁，留在国内由祖父母抚养，直到高中才被接到国外与父母团聚。</p>\n<p>陆峥寒一页页翻看档案，指尖微微收紧，骨节泛白。</p>\n<p>他想起温叙白偶尔提起父亲时，清冷平静的语气下藏着的淡淡怅然；想起他说"热爱就不辛苦"时，眼底那份比同龄人更深沉的笃定；想起他独自撑过那些年，靠自身实力一步步走到今天。</p>\n<p>原来这份沉重的背后，有陆家的影子。</p>\n<p>他合上档案，靠回椅背，闭了闭眼，喉间泛起苦涩。</p>\n<p>告诉他，还是不告诉他？</p>\n<p>告诉他，这份偏爱会不会在瞬间崩塌？不告诉他，这份隐瞒又会不会成为日后更大的裂痕？</p>\n<p>陆峥寒在黑暗中独坐良久，最终拿起了手机。</p>\n<p>不是打给温叙白，而是打给祖母。</p>\n<p>电话接通，老夫人的声音沉稳如常："这么晚了，有事？"</p>\n<p>"祖母，温崇远的事，您知道多久了？"陆峥寒声线低沉，没有寒暄，直切主题。</p>\n<p>电话那头沉默了两秒，老夫人语气平静："从一开始就知道。"</p>\n<p>"为什么不告诉我？"</p>\n<p>"因为你不知道，就不必面对这个选择。"老夫人的语气里听不出情绪，"但现在你知道了。"</p>\n<p>陆峥寒攥紧手机，声音微哑："我打算告诉他。"</p>\n<p>"你确定？"老夫人的语气终于有了一丝波动，"峥寒，这件事一旦说出口，就没有回头路。"</p>\n<p>"我知道。"陆峥寒深吸一口气，语气笃定而沉重，"但我不打算瞒他。瞒着的东西，迟早会成为我们之间的刀。"</p>\n<p>电话那头沉默了很久。</p>\n<p>最终，老夫人轻叹一声："你长大了。去吧，按照你的想法做。"</p>\n<p>挂断电话，陆峥寒在办公室里坐了一整夜。</p>\n<p>天亮时，他做出了决定。</p>\n<div class="hook">**【本章钩子：温家旧事真相大白，陆峥寒面临最艰难的抉择！坦白可能失去偏爱，隐瞒可能埋下裂痕——这位商界阎王，在感情面前第一次真正害怕了。但他做出了选择：不隐瞒，不逃避。下一章，他将如何向温叙白开口？】**</div>\n'},
  {title:'第27章 坦白以对，偏爱不惧', vol:1, html:'<p>周末午后，温叙白的私宅。</p>\n<p>阳光透过落地窗洒进来，在地板上铺出一层暖金色的光。室内安静祥和，温叙白坐在沙发上翻看图纸，陆峥寒安静地坐在他身旁，手里捧着一杯温水，却没有喝。</p>\n<p>沉默比平时更长。</p>\n<p>温叙白察觉到了异样，放下图纸，清冷的目光转向他："怎么了？"</p>\n<p>陆峥寒沉默了几秒，将水杯搁在茶几上，抬起头，直直望向温叙白的眼睛，目光前所未有的认真和沉重。</p>\n<p>"叙白，有一件事，我必须告诉你。"</p>\n<p>温叙白微微坐直身姿，清冷的神色认真起来，没有催促，安静等待。</p>\n<p>陆峥寒深吸一口气，声线低沉而平稳，没有修饰，没有铺垫，只有赤诚的坦白："二十年前，你父亲温崇远被卷入的那场商业纠纷——主导方是陆氏集团，当时的决策人，是我祖父。"</p>\n<p>空气瞬间凝固。</p>\n<p>温叙白瞳孔微缩，面容上终于出现了裂痕——不是愤怒，不是震惊，而是一种复杂的、说不清的情绪翻涌。</p>\n<p>他沉默了很久，久到陆峥寒的心一寸寸下沉，指尖不自觉攥紧，做好了最坏的打算。</p>\n<p>"你什么时候知道的？"温叙白终于开口，声线平静得出奇。</p>\n<p>"昨天。我一直在查这件事，查到后，想了整整一夜，决定告诉你。"</p>\n<p>"你祖母知道？"</p>\n<p>"从一开始就知道。但她没有用这件事来做文章，她选择了压下来。"</p>\n<p>温叙白垂下眼帘，修长白皙的指尖轻轻摩挲着膝盖上的图纸边缘，动作缓慢而克制。</p>\n<p>陆峥寒看着他沉默的侧脸，喉间苦涩得几乎说不出话，却还是一字一句地继续："叙白，我无法改变二十年前发生的事，也无法替祖父还这个债。但我可以向你保证——从今以后，陆家不会再让你受半分委屈。"</p>\n<p>"如果你因此恨我、怨我，甚至不想再见我，我都接受。"</p>\n<p>"但我不会隐瞒你任何事，这是我给你的底线。"</p>\n<p>说完，他微微低下头，等待着温叙白的审判。</p>\n<p>安静持续了很长时间。</p>\n<p>然后，他感到肩头被轻轻碰了一下。</p>\n<p>温叙白抬手，拍了拍他的肩膀，力道不重，却带着不容置疑的笃定。</p>\n<p>"看着我。"温叙白说。</p>\n<p>陆峥寒缓缓抬头，对上那双清冷澄澈的眼眸。</p>\n<p>温叙白的目光平静而通透，没有愤怒，没有怨恨，只有一种历经沉淀后的清醒与坦然。</p>\n<p>"二十年前的事，是上一代人的恩怨，不是你的错。"温叙白声线清冷而平稳，一字一句清晰笃定，"我父亲确实因为那场纠纷学术声誉尽毁，被迫带母亲远走海外，我从小和祖父母长大，一家人分隔两地好多年。但正因如此，我比任何人都清楚，靠自己的实力站稳脚跟，才是最踏实的路。"</p>\n<p>"我恨过吗？小时候恨过。但后来想通了，商业纠纷是那个时代的常态，你祖父的手段虽然狠，但并不违法，我父亲只是被殃及的池鱼。后来他在海外重新站稳了脚跟，当了教授，也算因祸得福。"</p>\n<p>他微微停顿，目光直视陆峥寒的眼底，带着不容动摇的笃定："你是陆峥寒，不是陆老太爷。我对你的偏爱，是基于你是谁，不是基于你姓什么。"</p>\n<p>陆峥寒喉间猛地一紧，眼眶微微发热，所有准备好的愧疚和不安，被这几句话彻底击碎。</p>\n<p>"你不怨？"他声音微哑。</p>\n<p>"不怨。"温叙白淡淡摇头，语气里甚至带着一丝浅浅的笑意，"但如果陆家以后谁敢拿这件事来要挟我、逼我离开你——"</p>\n<p>他微微眯起眼，清冷的气场瞬间凌厉了几分："那我温叙白，也不是好惹的。"</p>\n<p>陆峥寒怔怔地看着他，心底翻涌的感动几乎要决堤。</p>\n<p>他张了张嘴，想说些什么，却发现自己一时竟说不出完整的句子。</p>\n<p>最终，他什么也没说，只是微微侧身，将额头轻轻抵在温叙白的肩头，闭上眼睛，像一只终于找到归处的倦鸟。</p>\n<p>温叙白身体微僵了一下，随后缓缓放松，没有推开他，甚至微微抬手，轻轻拍了拍他的后脑勺，动作生疏却温柔。</p>\n<p>"别矫情。"温叙白语气清冷，耳尖却微微泛红。</p>\n<p>陆峥寒闷声笑了，收紧了靠在他肩上的力度，声线沙哑而满足："嗯，不矫情。"</p>\n<p>阳光透过落地窗，将两人相依的身影镀上一层暖金色的光。</p>\n<p>这场关于旧事的考验，没有击碎他们的偏爱，反而让它变得更加坚不可摧。</p>\n<p>因为真正的偏爱，不是不知道对方的过去，而是知道了一切之后，依然选择站在他身边。</p>\n<div class="hook">**【本章钩子：温家旧事坦白化解，温叙白清醒通透的回应让偏爱更坚不可摧！"你是陆峥寒，不是陆老太爷"——这句话击碎了所有隔阂。危机过后，两人的关系迎来了质的飞跃。第一卷即将收束，最后的甜爽高潮即将到来！】**</div>\n'},
  {title:'第28章 晨间日常，甜蜜升级', vol:1, html:'<p>自那次坦白之后，两人之间的氛围悄然变了。</p>\n<p>从前是陆峥寒单方面套路靠近，温叙白被动接纳破例。如今真相摊开、旧事化解，温叙白对这份偏爱不再设防，反而开始不自觉地、主动地为陆峥寒留出空间。</p>\n<p>变化藏在细节里。</p>\n<p>冰箱里多了两人份的食材——温叙白的冰箱向来只有最干净最简单的食材，如今多了陆峥寒爱吃的牛排和意面。</p>\n<p>浴室里多了一套全新的洗漱用品，品牌是陆峥寒常用的那款——温叙白洁癖极重，从不使用外人物品，却主动为他备了一套全新的。</p>\n<p>鞋柜里多了一双黑色男士拖鞋，摆放位置紧挨着他的白色拖鞋——规整、对称，完美契合强迫症的审美，却无声昭示着另一个人的存在。</p>\n<p>这些细微的改变，陆峥寒全部看在眼里，每一次发现都让心底的暖意翻涌一层。</p>\n<p>他不敢点破，生怕惊扰了温叙白难得的主动，只是更加乖巧安分地出现在他的生活里，一点一点，自然而然地融入。</p>\n<p>周六清晨，阳光透过薄纱窗帘洒进卧室。</p>\n<p>温叙白被一阵食物的香气唤醒，缓缓睁开眼，清冷的眉眼还带着几分未散的倦意。</p>\n<p>他走出卧室，看到陆峥寒系着围裙站在厨房里，正在煎鸡蛋，动作从容利落，阳光落在他宽阔的肩背上，镀了一层暖金色的光。</p>\n<p>"醒了？"陆峥寒回头，眼底笑意温柔，"早餐马上好。"</p>\n<p>温叙白靠在厨房门口，目光落在他身上，嘴角微微弯起一个极淡的弧度——这是陆峥寒从未见过的、独属于晨间的、毫无防备的柔软笑容。</p>\n<p>"嗯。"温叙白轻声应答，语气带着慵懒的沙哑，比平时的清冷多了几分人间的烟火气。</p>\n<p>陆峥寒看得微微愣住，心跳漏了一拍。</p>\n<p>太犯规了。</p>\n<p>清晨刚醒、素面朝天、毫无防备的温叙白，比任何时候都要好看，好看到让他几乎握不住锅铲。</p>\n<p>"看什么？"温叙白察觉他的目光，微微蹙眉。</p>\n<p>"看你。"陆峥寒老实回答，语气认真，"早上的你，最好看。"</p>\n<p>温叙白耳尖瞬间染红，转身走向卫生间，丢下一句："油溅出来了。"</p>\n<p>陆峥寒低头一看，煎蛋果然焦了一角，连忙手忙脚乱地翻面，耳尖也泛起了红。</p>\n<p>两人面对面坐在餐桌前，吃着简单干净的早餐——煎蛋、全麦吐司、牛奶、一小碟水果。</p>\n<p>温叙白吃东西的动作规整优雅，细嚼慢咽，每一口都恰到好处。陆峥寒吃得比平时慢了许多，时不时抬眸看他一眼，眼底温柔得快要溢出来。</p>\n<p>"下午有什么安排？"陆峥寒问。</p>\n<p>"整理城东项目的施工图终版。"温叙白喝了口牛奶，"你呢？"</p>\n<p>"陪你。"陆峥寒想都没想就回答。</p>\n<p>温叙白微微抬眸看他，眼底掠过一丝不易察觉的笑意："不用去公司？"</p>\n<p>"周末，给自己放假。"陆峥寒理直气壮，语气软糯，"陪你比赚钱重要。"</p>\n<p>温叙白耳廓泛红，没有反驳，低头继续吃早餐，嘴角却悄悄弯了弯。</p>\n<p>这种宁静温柔、充满烟火气的日常，是两个人都从未拥有过的。</p>\n<p>一个常年孤身、在商界杀伐狠绝的霸总，一个洁癖清冷、从不让人靠近的美人，此刻却在晨光中共进早餐，默契自然得像已经这样过了很久很久。</p>\n<p>窗外的阳光一寸寸移过地板，时间仿佛被这份温柔拉长，安静、祥和、岁月静好。</p>\n<div class="hook">**【本章钩子：晨间甜宠日常上线，温叙白主动为陆峥寒留出生活空间，偏爱从破例变成融入！烟火气十足的两人世界，甜度持续拉满。但商圈的暗流从未停歇，一场针对两人的联合暗算，正在悄然逼近！】**</div>\n'},
  {title:'第29章 圈层暗讽，霸总碾压', vol:1, html:'<p>海城半年度商界联谊酒会，照例在顶奢酒店举办。</p>\n<p>这场酒会汇聚了海城大半商界精英，是圈层社交的重要场合。陆峥寒作为海城商界龙头，自然出席；温叙白作为城东文化中心中标设计师，也被特邀到场。</p>\n<p>两人几乎同时到场，一黑一白，气质卓绝，并肩走入会场时，瞬间攫取全场目光。</p>\n<p>自建筑峰会事件以来，两人关系的传闻早已在海城商圈传遍，但亲眼看到他们并肩出现，依旧让不少人暗暗心惊。</p>\n<p>大多数人<span class="annot" data-tip="彼此心里明白，不用明说">心照不宣</span>，只远远投来打量的目光。但总有人不知分寸。</p>\n<p>酒会过半，温叙白独自站在落地窗前品酒，陆峥寒被几位商界老总围住谈事，两人暂时分开。</p>\n<p>一个满脸油光、大腹便便的中年男人端着酒杯凑了过来，语气油腔滑调，带着不加掩饰的轻浮："温设计师，久仰大名。听说您和陆总关系匪浅？啧啧，真是没想到，海城最冷清的温大设计师，居然被陆总拿下了。"</p>\n<p>温叙白面色不变，清冷的目光淡淡扫了他一眼，没有搭话。</p>\n<p>那人却不知趣，压低声音，语气更加不堪："温设计师，恕我直言，陆总那种人，在外头<span class="annot" data-tip="做事果断，有魄力，不拖泥带水，多形容决策者的行事风格">杀伐果断</span>、心狠手辣，什么人没见过？他对你的好，能维持多久？依我看，不过是一时新鲜——"</p>\n<p>话音未落，一道冰冷刺骨的声线从身后传来。</p>\n<p>"赵德彪。"</p>\n<p>陆峥寒不知何时已经走到身后，面色冷如寒冰，薄唇紧抿，周身<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>翻涌，压迫感铺天盖地。</p>\n<p>他深邃的眸子冷冷睨着眼前的人，声音低沉冰冷，字字如刀："你刚才说什么？再说一遍。"</p>\n<p>赵德彪脸色瞬间惨白，手里的酒杯晃了晃，险些脱手。</p>\n<p>"陆、陆总，我只是随口闲聊——"</p>\n<p>"闲聊？"陆峥寒薄唇微勾，笑意却不达眼底，冷得刺骨，"在我的酒会上，对我的当面嚼舌根，你叫闲聊？"</p>\n<p>他上前一步，气场全开，杀伐狠绝的压迫感瞬间将赵德彪钉在原地，双腿发软。</p>\n<p>"你的公司去年欠了陆氏供应链三千万尾款，我一直没催。"陆峥寒声线冰冷平静，像在说一件微不足道的小事，"明天之前，连本带利还清。否则，赵氏名下所有产业，三天之内从海城消失。"</p>\n<p>赵德彪浑身一颤，脸色惨白如纸，连连点头："还！一定还！陆总饶命！"</p>\n<p>他再也不敢多留半秒，躬身仓皇逃离，连酒杯都顾不上放。</p>\n<p>全场鸦雀无声，所有人都被陆峥寒的雷霆手段震慑，再没人敢对温叙白有半句不敬。</p>\n<p>陆峥寒收敛<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，转头看向温叙白时，眼底的冰冷瞬间消融，换上温顺软糯的柔和："吓到你了？"</p>\n<p>温叙白淡淡摇头，目光里没有丝毫波澜，反而带着一丝浅浅的无奈："没必要为这种人大动干戈。"</p>\n<p>"有人说你不好，我就不能忍。"陆峥寒语气认真，带着不容置疑的笃定，"不管是谁。"</p>\n<p>温叙白喉间微动，心里泛起暖意，却只是轻轻拍了拍他的手臂，语气清冷却纵容："行了，别把人吓坏了。"</p>\n<p>陆峥寒微微弯唇，眼底笑意温柔，乖乖收敛了所有<span class="annot" data-tip="暴戾之气，凶狠不讲理的气势">戾气</span>，亦步亦趋地跟在他身侧，寸步不离。</p>\n<p>全场众人看着这一幕，心底只剩同一个念头——</p>\n<p>陆总对温设计师的偏爱，已经不是秘密，而是铁律。</p>\n<p>谁碰谁死。</p>\n<div class="hook">**【本章钩子：霸总当众雷霆护短，碾压口出不逊者，杀鸡儆猴震慑全场！偏爱已是铁律，无人敢触霉头。但商界的暗算远比口舌恶毒——一场针对陆氏和温叙白项目的联合狙击，正在暗处悄然成型！】**</div>\n'},
  {title:'第30章 商业暗算，联手破局', vol:1, html:'<p>城东文化中心项目进入施工准备阶段，一切顺利。</p>\n<p>然而，就在项目即将破土动工的前一周，变故骤生。</p>\n<p>项目的主要建材供应商"恒泰建材"突然发来通知，以"产能不足"为由，单方面终止供货合同。与此同时，城东项目的施工许可证审批也被意外卡住，原本一路绿灯的流程忽然停滞。</p>\n<p>温叙白第一时间察觉到异常——这两个问题同时出现，绝非巧合。</p>\n<p>他拨通陆峥寒的电话，语气清冷而凝重："城东项目被人动了手脚。"</p>\n<p>"我知道了。"陆峥寒的声音沉稳冷静，"林舟已经在查。半小时后我去你工作室。"</p>\n<p>半小时后，陆峥寒准时出现在温叙白的工作室。</p>\n<p>两人面对面坐在会议桌前，桌上铺着项目资料和林舟刚传来的调查报告。</p>\n<p>"幕后的人是周氏集团。"陆峥寒目光冷沉，"周氏一直想拿下城东周边的商业开发权，你的文化中心项目挡了他们的路。恒泰建材是周氏控股的子公司，施工许可证审批环节，也有周氏的人打了招呼。"</p>\n<p>温叙白清冷的眉峰微蹙，指尖轻轻叩击桌面："他们的目的是逼项目延期，趁机压低周边地块价格，低价拿地。"</p>\n<p>"没错。"陆峥寒微微<span class="annot" data-tip="点头，表示赞同或允许">颔首</span>，目光与他对视，"你打算怎么办？"</p>\n<p>温叙白沉吟片刻，眼底掠过一丝锐利的光："供应商可以换，我认识两家海外建材商，品质更高，价格合理，只是物流周期稍长。施工许可证的问题，需要从审批流程入手，找到卡住的环节，直接对接相关部门。"</p>\n<p>他微微抬眸看向陆峥寒，语气平静而笃定："但你得帮我一个忙。"</p>\n<p>"说。"</p>\n<p>"周氏在城东的动作，需要从商业层面牵制。我懂建筑，不懂商战。"温叙白直视他的眼睛，清冷而坦然，"这是你的领域。"</p>\n<p>陆峥寒看着他，眼底掠过一丝不易察觉的笑意——不是得逞的得意，而是由衷的欣赏。</p>\n<p>他的叙白，从来不是需要被保护的弱者。遇到问题，第一反应不是慌张求助，而是冷静分析、精准分工、并肩作战。</p>\n<p>"好。"陆峥寒声线沉稳，语气笃定，"周氏的事交给我，三天之内解决。供应商和施工许可证，你来主导，需要我配合的地方随时说。"</p>\n<p>两人对视一眼，无需多余言语，默契已天成。</p>\n<p>接下来的三天，两人各展所长，联手反击。</p>\n<p>温叙白以顶尖设计师的专业素养，迅速对接海外建材商，用更优的品质和合理的价格替代了恒泰建材，同时亲自撰写了一份详尽的项目施工方案补充报告，直送审批部门，以无可辩驳的专业数据推动了施工许可证的审批。</p>\n<p>陆峥寒则以商界阎王的雷霆手段，从商业层面精准狙击周氏——查到周氏集团资金链的薄弱环节，通过合法商业操作施压，同时联合城东其他开发商，以利益共享的方式瓦解了周氏低价拿地的图谋。</p>\n<p>三天后，恒泰建材的替代方案敲定，施工许可证顺利下发，周氏的城东布局彻底流产。</p>\n<p>温叙白站在工作室里，看着电脑屏幕上最终确认的项目推进计划，清冷的眼底终于掠过一丝满意的光。</p>\n<p>陆峥寒推门进来，手里提着两杯温热的咖啡，将其中一杯放在他面前，语气带着浅浅的骄傲："赢了。"</p>\n<p>"嗯。"温叙白接过咖啡，淡淡应声，随即抬眸看向他，目光里带着从未有过的认真和认可，"你很厉害。"</p>\n<p>陆峥寒微微一愣，随即耳尖泛红，心底的欢喜几乎要溢出来，嘴上却谦虚温顺："你才是，三天搞定海外供应商和审批流程，我做不到。"</p>\n<p>"术业有专攻。"温叙白淡淡开口，随即嘴角微微弯起一个极淡的弧度，"我们配合得不错。"</p>\n<p>陆峥寒看着他罕见的笑容，心跳漏了一拍，喉间微动，一时竟说不出话来。</p>\n<p>这份并肩作战的默契，比任何甜言蜜语都要动人。</p>\n<div class="hook">**【本章钩子：双强联手碾压商界暗算，并肩作战默契无双！温叙白首次主动请求陆峥寒配合，两人各展所长、联手破局。危机过后，温叙白对陆峥寒的认可再上一层——第一卷即将收束，最后的温情与蜕变即将到来！】**</div>\n'},
  {title:'第31章 深夜交心，往事释然', vol:1, html:'<p>城东项目的危机解除后，两人难得同时空闲。</p>\n<p>深夜，温叙白的私宅，落地窗外城市灯火如星河璀璨。</p>\n<p>两人并肩坐在沙发上，各执一杯温水，室内安静祥和。连日并肩作战的默契，让这份沉默变得格外舒适，谁都不需要刻意找话。</p>\n<p>良久，温叙白忽然开口，清冷的声线里带着少有的柔和："峥寒，你为什么喜欢我？"</p>\n<p>这个问题来得猝不及防，陆峥寒握着水杯的手微微一顿，耳尖悄悄泛红。</p>\n<p>他没有急于回答，而是沉默了几秒，似乎在认真组织语言。</p>\n<p>"七年前，我刚刚接手陆氏，压力大到几乎喘不过气。有一次去海外出差，偶然看到一场建筑展，其中有一个展品——一座用废弃集装箱改造的社区图书馆，设计者是温叙白。"</p>\n<p>温叙白微微一怔，没有出声。</p>\n<p>"那个设计没有华丽的装饰，没有昂贵的材料，只有对空间最纯粹的尊重和对人最温柔的体察。我当时站在那里看了很久，心想，能设计出这样作品的人，一定是个很温柔、很通透的人。"</p>\n<p>陆峥寒偏头看向温叙白，眼底温柔得几乎要溢出来："后来我查到你的名字，知道你是海城人，从那之后，我就一直想认识你。"</p>\n<p>"七年？"温叙白清冷的眉峰微蹙，语气带着一丝意外。</p>\n<p>"七年。"陆峥寒轻声确认，语气认真而笃定，"不是一时兴起，不是逢场作戏，是蓄谋了七年的偏爱。"</p>\n<p>温叙白喉间发紧，心里被巨大的暖意包裹，清冷的耳廓染上绯色，一时竟不知该说什么。</p>\n<p>他从未想过，这份偏爱的时间跨度，长达七年。</p>\n<p>他以为陆峥寒是近两年才开始接近自己，却不知道，早在七年前，这个男人就已经在心里为他留了位置。</p>\n<p>"你呢？"陆峥寒轻声问，语气带着浅浅的试探和小心的期待，"你对我……是什么感觉？"</p>\n<p>温叙白沉默了很久。</p>\n<p>他不善言辞，不会说动听的话，更不擅长表达感情。但此刻，面对陆峥寒七年的深情和坦白，他觉得沉默是一种辜负。</p>\n<p>"从前觉得你是偶尔脆弱的大佬，后来知道你是双面戏精。"温叙白语气清冷，嘴角却微微弯起，"再后来，知道你为我蓄谋了七年。"</p>\n<p>他微微停顿，目光直视陆峥寒的眼底，认真而坦荡："我说不清那是什么感觉。但和你在一起的时候，心里很安稳。这是我二十七年来，从未有过的感觉。"</p>\n<p>陆峥寒喉间猛地一紧，眼眶微微发热，心底翻涌的感动几乎要决堤。</p>\n<p>"足够了。"他声音微哑，语气满足而虔诚，"对我来说，足够了。"</p>\n<p>温叙白别开视线，耳尖绯红，端起水杯掩饰心底的慌乱，语气故作冷淡："别矫情，喝水。"</p>\n<p>陆峥寒闷声笑了，乖乖喝水，心底的欢喜几乎要溢出来。</p>\n<p>窗外夜色温柔，室内灯光暖融，两人并肩而坐，心意相通。</p>\n<p>这一刻，他们之间的距离，比任何时候都要近。</p>\n<div class="hook">**【本章钩子：七年蓄谋的深情终于揭开，温叙白首次正面回应感情——"和你在一起，心里很安稳"。心意相通的深夜交心，让偏爱从单向奔赴变成双向确认。第一卷即将终章，所有伏笔即将收束！】**</div>\n'},
