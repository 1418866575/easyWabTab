<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人信用报告结构说明（授信机构版）</title>
<style>
:root{
  --primary:#1558b8; --primary-d:#0e4390; --primary-l:#e8f0fc;
  --bg:#f2f4f8; --panel:#ffffff; --border:#e2e8f1; --border-l:#eef2f8;
  --text:#1d2733; --muted:#68758a; --faint:#93a1b5;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --shadow:0 1px 3px rgba(21,40,70,.08),0 4px 14px rgba(21,40,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.65 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.hidden{display:none!important}
mark{background:#ffe9a3;padding:0 1px;border-radius:2px}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:62px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 20px;z-index:100;box-shadow:0 1px 6px rgba(21,40,70,.05)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#3a7bd5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.brand-text h1{margin:0;font-size:16px;font-weight:700;white-space:nowrap}
.brand-text .ver{color:var(--primary);font-size:13px}
.brand-text .sub{margin:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{position:relative;margin-left:auto;width:min(460px,42vw);flex:none}
#searchBox{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;padding:0 34px 0 34px;font-size:13.5px;background:#f8fafd;outline:none;transition:.15s}
#searchBox:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(21,88,184,.12)}
.search-icon{position:absolute;left:10px;top:8px;color:var(--faint);font-size:14px;pointer-events:none}
.search-kbd{position:absolute;right:8px;top:8px;font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:#fff;pointer-events:none}
.search-dropdown{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:440px;overflow-y:auto;z-index:120}
.rs-group{font-size:11.5px;color:var(--muted);padding:8px 12px 4px;background:#f8fafd;border-bottom:1px solid var(--border-l);position:sticky;top:0}
.rs-item{display:flex;align-items:baseline;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--border-l);font-size:13px}
.rs-item:hover,.rs-item.active{background:var(--primary-l)}
.rs-item .rs-name{font-weight:600;flex:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-item .rs-tag{font-family:var(--mono);font-size:11.5px;color:var(--primary);flex:none}
.rs-item .rs-path{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-item .rs-kind{flex:none;font-size:11px;color:#fff;border-radius:4px;padding:0 5px;line-height:18px}
.rs-kind.k-item{background:var(--primary)}
.rs-kind.k-table{background:#0d8a6a}
.rs-kind.k-code{background:#8a5cd6}
.rs-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.rs-more{padding:8px 12px;text-align:center;color:var(--muted);font-size:12px;background:#f8fafd}

/* ---------- 布局 ---------- */
#layout{display:flex;padding-top:62px;min-height:100vh}
#sidebar{width:300px;flex:none;position:fixed;top:62px;bottom:0;left:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:10px 0 30px}
#content{flex:1;margin-left:300px;padding:22px 28px 60px;max-width:1280px;min-width:0}
#menuBtn{display:none}

/* ---------- 侧栏导航 ---------- */
.nav-group{margin-bottom:6px}
.nav-title{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;padding:10px 14px 4px;text-transform:uppercase}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:6px;padding:5px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent}
.trow:hover{background:#f4f7fc}
.trow.active{background:var(--primary-l);border-left-color:var(--primary)}
.trow.active .tlink{color:var(--primary-d);font-weight:700}
.chev{flex:none;width:14px;text-align:center;color:var(--faint);font-size:10px;transition:transform .15s}
.tnode.open>.trow>.chev{transform:rotate(90deg)}
.tlink{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.ttag{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:#f0f3f8;border-radius:4px;padding:0 4px;flex:none}
.tcount{flex:none;font-size:10.5px;color:var(--muted);background:#eef2f8;border-radius:8px;padding:0 6px;line-height:16px}
.trow-block{font-weight:700}
.trow-block .tlink{font-weight:700}
.tchildren{margin-left:14px;border-left:1px dashed var(--border)}
.trow-seg{font-size:12.5px}
.trow-direct{font-size:12px;color:var(--muted)}
.trow-direct .tlink{color:var(--muted);font-style:italic}
.nav-doc-link{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;cursor:pointer;border-left:3px solid transparent}
.nav-doc-link:hover{background:#f4f7fc}
.nav-doc-link.active{background:var(--primary-l);border-left-color:var(--primary)}
.nav-doc-link.active a{color:var(--primary-d);font-weight:700}

/* ---------- 内容区 ---------- */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted)}
.crumb .sep{color:var(--faint)}
.crumb .cur{color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 10px;font-size:15px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px;margin-top:10px}
.meta-item{display:flex;gap:8px;font-size:13px}
.meta-item .k{color:var(--muted);flex:none;width:76px}
.meta-item .v{font-weight:600;min-width:0;word-break:break-all}
.view-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.view-head .grow{flex:1;min-width:200px}
.pill{display:inline-block;font-size:11.5px;background:var(--primary-l);color:var(--primary-d);border-radius:20px;padding:1px 10px;margin-left:8px;vertical-align:2px}
.count-note{font-size:12px;color:var(--muted);margin:10px 2px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- 表格 ---------- */
.tbl-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{position:sticky;top:62px;background:#f0f4fa;color:#33435c;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:5}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border-l);vertical-align:top}
.tbl tbody tr:hover td{background:#f6f9ff}
.tbl tbody tr:last-child td{border-bottom:none}
.c-name{width:21%;min-width:150px}
.c-tag{width:11%;min-width:96px}
.c-occ{width:7%;min-width:64px}
.c-type{width:17%;min-width:130px}
.c-desc{width:auto}
.row-child td:first-child{padding-left:34px;color:#3a4a60}
.row-child .arrow{color:var(--faint);margin-right:2px}
.row-comp td{background:#fbfcfe}
.row-comp:hover td{background:#f4f8ff!important}
tr.flash td{animation:flash 2.4s ease}
@keyframes flash{0%,60%{background:#fff3bf}100%{background:transparent}}
.grp td{padding:6px 10px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--border)}
.grp-unit td{background:#e9eff9;color:#22374f}
.grp-seg td{background:#f3f7fd;color:#33465f;font-weight:500}
.grp-direct td{background:#fafcfe;color:var(--muted);font-weight:400;font-style:italic}
.grp a{color:inherit}
.grp .g-occ{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.grp .g-desc{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}

/* ---------- 徽章/芯片 ---------- */
.badge{display:inline-block;font-size:10.5px;border-radius:4px;padding:0 5px;line-height:17px;vertical-align:1px;margin-left:5px;white-space:nowrap}
.badge-comp{background:#fff1e0;color:#a05a12;border:1px solid #f5ddba}
.badge-enum{background:#e7f4ee;color:#0d7a5a;border:1px solid #c8e8da}
.chip{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;line-height:19px;margin:1px 3px 1px 0;white-space:nowrap}
.chip-occ{background:#eef2f8;color:#4a5a70;font-family:var(--mono);font-size:10.5px}
.chip-code{background:var(--primary-l);color:var(--primary-d);border:1px solid #c9dcf6;cursor:pointer}
.chip-code:hover{background:#d8e6fa;text-decoration:none}
.chip-code sup{color:#c0392b}
.inline-note{font-size:11px;color:var(--muted)}

/* ---------- 代码表视图 ---------- */
.code-refs{margin-top:6px}
.ref-item{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border-l);font-size:13px}
.ref-item:last-child{border-bottom:none}
.ref-item:hover{background:#f6f9ff}
.ref-item .r-name{font-weight:600;flex:none;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-item .r-tag{font-family:var(--mono);font-size:11.5px;color:var(--primary);flex:none}
.ref-item .r-path{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-box{background:#fffbe8;border:1px solid #f3e3a6;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#7a6410;margin-top:10px}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,#123f86,#2a6fd0);color:#fff;border:none}
.hero h2{color:#fff;font-size:21px}
.hero p{color:#d7e5fa;max-width:760px;margin:6px 0 14px}
.hero .btn{background:#fff;color:var(--primary-d)}
.hero .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.btn{display:inline-block;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn:hover{text-decoration:none;opacity:.92}
.btn-ghost{background:#fff;color:var(--primary-d);border-color:var(--border)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.stat-card .num{font-size:24px;font-weight:800;color:var(--primary);line-height:1.2}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.guide-list{margin:0;padding-left:20px}
.guide-list li{margin-bottom:6px}
.block-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.block-quick a{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fbfcfe;font-size:13px}
.block-quick a:hover{background:var(--primary-l);text-decoration:none}
.block-quick .ttag{margin-left:auto}
.foot{margin-top:26px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.8}

/* ---------- 响应式 ---------- */
@media (max-width:960px){
  #sidebar{transform:translateX(-100%);transition:.2s;z-index:90;top:62px}
  #sidebar.open{transform:none;box-shadow:var(--shadow)}
  #content{margin-left:0;padding:16px}
  #menuBtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:16px;color:var(--muted);flex:none}
  .search-wrap{width:auto;flex:1}
  .brand-text .sub{display:none}
  .tbl thead th{position:static}
}
</style>
</head>
<body>

<header id="topbar">
  <button id="menuBtn" title="菜单">☰</button>
  <div class="brand">
    <div class="logo">征</div>
    <div class="brand-text">
      <h1>个人信用报告结构说明 <span class="ver">授信机构版</span></h1>
      <p class="sub">二代征信（个人） · 信立合创 ｜ 数据块 24 · 信息单元 24 · 信息段 50 · 数据项 297 · 代码表 66</p>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="searchBox" type="text" placeholder="搜索数据项 / XML Tag / 说明 / 数据字典…" autocomplete="off">
    <span class="search-kbd">Enter</span>
    <div id="searchDropdown" class="search-dropdown hidden"></div>
  </div>
</header>

<div id="layout">
  <aside id="sidebar"></aside>
  <main id="content"></main>
</div>

<script>

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function hl(s,q){
  const t = esc(s);
  if(!q) return t;
  const qe = esc(q).toLowerCase();
  if(!qe) return t;
  const low = t.toLowerCase();
  let out='', i=0, idx;
  while((idx = low.indexOf(qe,i)) !== -1){
    out += t.slice(i,idx) + '<mark>' + t.slice(idx, idx+qe.length) + '</mark>';
    i = idx + qe.length;
  }
  return out + t.slice(i);
}
function countItems(node){
  let n = 0;
  (node.items||[]).forEach(it => { n += 1 + (it.children||[]).length; });
  return n;
}

/* ================= 索引 ================= */
const BLOCKS = DATA.tree;
const TABLE_BY_KEY = {};
DATA.codeTables.forEach(t => TABLE_BY_KEY[t.key] = t);
const SEG_BY_TAG = {}, UNIT_BY_TAG = {}, BLOCK_BY_TAG = {}, ITEM_BY_TAG = {};
const SEARCH_ITEMS = [];
const REFS_BY_KEY = {};

function registerItem(it, b, u, s, parentName){
  ITEM_BY_TAG[it.tag] = it;
  const parts = [];
  if(b) parts.push(b.name);
  if(u) parts.push(u.name);
  if(s) parts.push(s.name);
  if(parentName) parts.push(parentName);
  const path = parts.join(' › ');
  const anchor = s ? {t:'seg', tag:s.tag} : (u ? {t:'unit', tag:u.tag} : {t:'block', tag:b ? b.tag : ''});
  SEARCH_ITEMS.push({n:it.name, t:it.tag, ty:it.type||'', d:it.desc||'', pt:path, anchor});
  (it.children||[]).forEach(ch => {
    ITEM_BY_TAG[ch.tag] = ch;
    SEARCH_ITEMS.push({n:ch.name, t:ch.tag, ty:ch.type||'', d:ch.desc||'', pt:path + ' › ' + it.name, anchor});
  });
}
BLOCKS.forEach(b => {
  BLOCK_BY_TAG[b.tag] = b;
  b.items.forEach(it => registerItem(it, b, null, null, null));
  b.units.forEach(u => {
    UNIT_BY_TAG[u.tag] = u; u.block = b;
    u.items.forEach(it => registerItem(it, b, u, null, null));
    u.segments.forEach(s => {
      SEG_BY_TAG[s.tag] = s; s.unit = u; s.block = b;
      s.items.forEach(it => registerItem(it, b, u, s, null));
    });
  });
});
Object.keys(DATA.codeRefs||{}).forEach(k => {
  REFS_BY_KEY[k] = DATA.codeRefs[k].map(tag => ITEM_BY_TAG[tag]).filter(Boolean);
});

BLOCKS.forEach(b => {
  n_units += b.units.length;
  b.units.forEach(u => {
    n_segs += u.segments.length;
    [].concat(u.items, ...u.segments.map(s => s.items)).forEach(it => {
      n_items++;
      if((it.type||'').toLowerCase().startsWith('enum')) n_enum++;
      n_children += (it.children||[]).length;
      (it.children||[]).forEach(ch => { if((ch.type||'').toLowerCase().startsWith('enum')) n_enum++; });
    });
  });
});

/* 展开到指定节点并标记激活 */
function syncNav(type, arg){
  document.querySelectorAll('#sidebar .active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('#sidebar .tnode.open').forEach(el => el.classList.remove('open'));
  let activeEl = null;
  if(type === 'version') activeEl = $('#nav-doc-version');
  else if(type === 'home' || !type) activeEl = $('#nav-doc-home');
  else if(type === 'code') activeEl = $('#nav-c-' + arg);
  else if(type === 'block') activeEl = $('#nav-b-' + arg);
  else if(type === 'unit') activeEl = $('#nav-u-' + arg);
  else if(type === 'seg') activeEl = $('#nav-s-' + arg);
  if(activeEl){
    activeEl.classList.add('active');
    let node = activeEl.closest('.tnode');
    while(node){
      node.classList.add('open');
      node = node.parentElement.closest('.tnode');
    }
    activeEl.scrollIntoView({block:'nearest'});
  }
}

function codeRefChips(it){
  return (it.codeRefs||[]).map(k => {
    const t = TABLE_BY_KEY[k];
    if(!t) return '';
    const dup = /b$/.test(k) ? '<sup>*</sup>' : '';
    return `<a class="chip chip-code" href="#code/${esc(k)}" title="查看：${esc(t.no + '、' + t.name)}">${REF_WORD}${esc(t.no)}${dup}</a>`;
  }).join(' ');
}
function typeCell(it){
  const ty = (it.type||'').toLowerCase();
  if(!it.type) return '<span class="muted">—</span>';
  if(ty.startsWith('enum')){
    const chips = codeRefChips(it);
    return `<span class="badge badge-enum">Enum</span>` + (chips ? ' ' + chips : ' <span class="inline-note">（内嵌枚举值）</span>');
  }
  return `<span class="mono">${esc(it.type)}</span>`;
}
function itemRow(it, isChild){
  const badge = it.composite ? '<span class="badge badge-comp">组合</span>' : '';
  const name = (isChild ? '<span class="arrow">↳</span> ' : '') + esc(it.name) + badge;
  const desc = it.desc ? nl2br(it.desc) : '<span class="muted">—</span>';
  return `<tr id="row-${esc(it.tag)}" class="${isChild?'row-child ':''}${it.composite?'row-comp':''}">
    <td>${name}</td>
    <td><span class="mono">${esc(it.tag)}</span></td>
    <td>${it.occ ? `<span class="chip chip-occ">${esc(it.occ)}</span>` : '<span class="muted">—</span>'}</td>
    <td>${typeCell(it)}</td>
    <td class="c-desc">${desc}</td>

}

/* ================= 搜索 ================= */
const box = $('#searchBox'), dd = $('#searchDropdown');
let searchTimer = null, curResults = [], activeIdx = -1;

function doSearch(q){
  const items = [], codes = [];
  const ql = q.toLowerCase();
  for(const it of SEARCH_ITEMS){
    if(items.length >= 40) break;
    if(it.n.toLowerCase().includes(ql) || it.t.toLowerCase().includes(ql) ||
       it.ty.toLowerCase().includes(ql) || it.d.toLowerCase().includes(ql)){
      items.push(it);
    }
  }
  for(const t of DATA.codeTables){
    if(codes.length >= 25) break;
    const nameHit = t.name.toLowerCase().includes(ql) || String(t.no) === q;
    if(nameHit) codes.push({kind:'table', t});
    for(let i = 0; i < t.items.length; i++){
      const c = t.items[i];
      if(c.code.toLowerCase().includes(ql) || c.name.toLowerCase().includes(ql) || (c.desc||'').toLowerCase().includes(ql)){
        codes.push({kind:'code', t, c, i});
        break;
      }
    }
  }
  return {items, codes};
}
function runSearch(){
  const q = box.value.trim();
  if(!q){ closeDropdown(); return; }
  const r = doSearch(q);
  curResults = []; activeIdx = -1;
  if(!r.items.length && !r.codes.length){
    dd.innerHTML = `<div class="rs-empty">未找到与「${esc(q)}」匹配的内容</div>`;
    dd.classList.remove('hidden');
    return;
  }
  let html = '', idx = 0;
  if(r.items.length){
    html += `<div class="rs-group">数据项（${r.items.length}${r.items.length >= 40 ? '+' : ''}）</div>`;
    r.items.forEach(it => {
      const hash = `#${it.anchor.t}/${it.anchor.tag}:${it.t}`;
      curResults.push({hash});
      html += `<div class="rs-item" data-i="${idx}">
        <span class="rs-kind k-item">数据项</span>
        <span class="rs-name">${hl(it.n, q)}</span>
        <span class="rs-tag">${hl(it.t, q)}</span>
        <span class="rs-path">${hl(it.pt, q)}</span></div>`;
      idx++;
    });
  }
  if(r.codes.length){
    html += `<div class="rs-group">${DICT_NAME}（${r.codes.length}${r.codes.length >= 25 ? '+' : ''}）</div>`;
    r.codes.forEach(c => {
      const hash = `#code/${c.t.key}` + (c.kind === 'code' ? ':c' + c.i : '');
      curResults.push({hash});
      const label = c.kind === 'table'
        ? `${esc(c.t.no)}、${hl(c.t.name, q)}`
        : `${esc(c.t.no)}、${esc(c.t.name)} · ${hl(c.c.code, q)} ${hl(c.c.name, q)}`;
      html += `<div class="rs-item" data-i="${idx}">
        <span class="rs-kind ${c.kind === 'table' ? 'k-table' : 'k-code'}">${DICT_NAME}</span>
        <span class="rs-name">${label}</span>
        <span class="rs-path">${c.kind === 'table' ? '共 ' + c.t.items.length + ' 条代码' : '匹配代码：' + esc(c.c.code) + ' ' + esc(c.c.name)}</span></div>`;
      idx++;
    });
  }
  if(r.items.length >= 40 || r.codes.length >= 25){
    html += `<div class="rs-more">结果较多，仅显示前 ${curResults.length} 条，请细化关键词</div>`;
  }
  dd.innerHTML = html;
  dd.classList.remove('hidden');
}
function closeDropdown(){ dd.classList.add('hidden'); dd.innerHTML = ''; curResults = []; activeIdx = -1; }
function moveSel(dir){
  if(!curResults.length) return;
  activeIdx = Math.min(Math.max(activeIdx + dir, 0), curResults.length - 1);
  dd.querySelectorAll('.rs-item').forEach(el => el.classList.toggle('active', +el.dataset.i === activeIdx));
  const el = dd.querySelector('.rs-item.active');
  if(el) el.scrollIntoView({block:'nearest'});
}
function goActive(){
  const i = activeIdx >= 0 ? activeIdx : 0;
  const r = curResults[i];
  if(r){ location.hash = r.hash; closeDropdown(); box.blur(); }
}
box.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
box.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); moveSel(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if(e.key === 'Enter'){ e.preventDefault(); goActive(); }
  else if(e.key === 'Escape'){ closeDropdown(); box.blur(); }
});
dd.addEventListener('click', e => {
  const item = e.target.closest('.rs-item');
  if(item){ activeIdx = +item.dataset.i; goActive(); }
});
document.addEventListener('click', e => {
  if(!e.target.closest('.search-wrap')) closeDropdown();
});
box.addEventListener('focus', () => { if(box.value.trim()) runSearch(); });

/* ================= 路由 ================= */
function route(){
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const colon = raw.indexOf(':');
  const path = colon >= 0 ? raw.slice(0, colon) : raw;
  const hlTag = colon >= 0 ? raw.slice(colon + 1) : '';
  const slash = path.indexOf('/');
  const type = slash >= 0 ? path.slice(0, slash) : path;
  const arg = slash >= 0 ? path.slice(slash + 1) : '';
  closeDropdown();
  let html;
  switch(type){
    case 'version': html = viewVersion(); break;
    case 'block':   html = viewBlock(arg); break;
    case 'unit':    html = viewUnit(arg); break;
    case 'seg':     html = viewSeg(arg); break;
    case 'code':    html = viewCode(arg); break;
    default:        html = viewHome();
  }
  $('#content').innerHTML = html;
  syncNav(type || 'home', arg);
  if(hlTag){
    const el = document.getElementById(hlTag.startsWith('c') && type === 'code' ? hlTag : 'row-' + hlTag);
    if(el){ el.classList.add('flash'); setTimeout(() => el.scrollIntoView({block:'center', behavior:'smooth'}), 60); }
  } else {
    window.scrollTo(0, 0);
  }
  $('#sidebar').classList.remove('open');
}
window.addEventListener('hashchange', route);
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

/* ================= 启动 ================= */
buildSidebar();
route();
</script>
</body>
</html>
