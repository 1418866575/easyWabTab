# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 云同步信封经 /api/webdav-proxy 上传，单文件可达数 MB（1.27MB 已超默认 1m），
    # 不放开会在请求抵达 Node 代理前被 nginx 以 413 拒掉，故全局放到 10m
    client_max_body_size 10m;

    # 全局文本资源压缩（提升站点访问速度；站点静态资源此前未压缩，
    # 入口 index.js 约 2.25MB / index.css 约 863KB 原样传输，gzip 后约 1/4~1/5）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  www.codehelp.com.cn;          # 绑定域名

	# ===== 同源后端代理：直接打到 Node 代理服务（不依赖 16718 块）=====
	# `=` 精确匹配优先级最高，先于 location / 命中 POST /api/fetch-meta
	# 若不放在「实际处理域名的 server 块」里，请求会被当成静态文件 → 405
	location = /api/fetch-meta {
		proxy_pass http://127.0.0.1:16720;      # scripts/fetch-meta-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;                  # 抓元数据较慢，需放宽
	}

	location = /api/webdav-proxy {
		proxy_pass http://127.0.0.1:16719;      # scripts/webdav-proxy-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
	}

	# 全网访问统计（scripts/stats-only.cjs，端口 16723）
	# 与上面两个接口同理：每个 server 块都要写，否则对应协议下 POST 会落到静态 location → 405
	location /api/stats/ {
		proxy_pass http://127.0.0.1:16723;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
	}

	# ===== 自建服务器云同步：同源 WebDAV 直连（无需 Node 代理）=====
	# 仅当 app 中同步地址与本站同源（origin 相同）时走此通道；
	# 跨域第三方云（如坚果云）仍走 /api/webdav-proxy。
	# 依赖：nginx 需编译 http_dav_module（官方包默认包含，`nginx -V 2>&1 | grep dav_module` 确认）。
	# 目录：请求 /dav/<user>/... 经 root /var/ewt-sync 映射到软链农场
	#       /var/ewt-sync/dav/<user> -> /home/<user>，落盘 /home/<user>/easy-web-tab/<信封>.json
	# 认证：系统账号（ewt-sync-passwd.sh 从 /etc/shadow 镜像，$6$ 等 crypt 哈希
	#       nginx auth_basic 原生支持，无需 PAM 模块）。
	location ~ ^/dav/(?<sync_user>[A-Za-z0-9._-]+)/ {
		# 系统账号认证：按 URL 里的用户名加载对应的 per-user 口令文件。
		# 只有拿「该用户自己的系统密码」才能通过 /dav/<user>/ 的认证，
		# 因此天然隔离——alice 没法用自己密码去认证 /dav/bob/（bob 的口令文件里没有 alice）。
		auth_basic           "Easy Web Tab Sync";
		auth_basic_user_file /etc/nginx/.ewt_sync_htpasswd_$sync_user;

		root                 /var/ewt-sync;
		dav_methods         PUT DELETE MKCOL;
		create_full_put_path on;                  # PUT 自动建中间目录（客户端 409 透传依赖此项）
		client_body_temp_path /var/lib/nginx/ewt-tmp;
		autoindex           off;                  # 不暴露目录列表
		# 单文件可达数 MB，body 上限已在 http 块全局设为 10m
	}

	# 未带合法用户名段的 /dav/ 一律拒绝（兜底，避免落到 location / 反代到 Node）
	location /dav/ {
		return 403;
	}

	location / {
        proxy_pass http://localhost:16718;   # 前端静态资源指回 16718 块
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }

    server {
    	listen 16718;
	server_name localhost;
	location / {
		root /usr/share/nginx/html/dist;
		index index.html index.htm;
                try_files $uri $uri/ /index.html;
		add_header 'Access-Control-Allow-Origin' '*';
		add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS';
		add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Request-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
	
	}

	# ===== 同源后端代理：POST 接口反代到 Node 服务 =====
	# 不加这段时，POST /api/* 会落到上面静态 location → Nginx 静态模块拒绝 POST → 405
	# `=` 精确匹配优先级最高，会先于 location / 和静态后缀正则命中
	location = /api/fetch-meta {
		proxy_pass http://127.0.0.1:16720;      # scripts/fetch-meta-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;                  # 抓元数据较慢，需放宽
	}

	location = /api/webdav-proxy {
		proxy_pass http://127.0.0.1:16719;      # scripts/webdav-proxy-only.cjs
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
	}

	# 全网访问统计（scripts/stats-only.cjs，端口 16723）
	# 与上面两个接口同理：每个 server 块都要写，否则对应协议下 POST 会落到静态 location → 405
	location /api/stats/ {
		proxy_pass http://127.0.0.1:16723;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
	}

	# index.html 绝不缓存：否则部署后浏览器仍引用旧 hash 资源，等于一直跑旧代码
	location = /index.html {
		root /usr/share/nginx/html/dist;
		add_header Cache-Control "no-cache, must-revalidate";
		try_files $uri =404;
	}

	# 带 hash 的构建产物：可长期缓存
	location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
		root /usr/share/nginx/html/dist;
	        expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# 其它静态资源（public/icons、backgrounds 等文件名不含 hash，可能原地替换）：协商缓存
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
		root /usr/share/nginx/html/dist;
		add_header Cache-Control "no-cache, must-revalidate";
	}
	 server_tokens off;
    }
    # ===== HTTPS (443) server：镜像 80 块的反代 + 静态，证书用 Let's Encrypt =====
    # 前置：在服务器执行 certbot 获取证书（见对话说明），默认路径如下。
    # 阿里云/腾讯云等需先在「安全组」开放 443 入方向（否则浏览器连不上）。
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  www.codehelp.com.cn;

        ssl_certificate     /etc/letsencrypt/live/www.codehelp.com.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.codehelp.com.cn/privkey.pem;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 同源后端代理（与 80 块一致，必须同步存在，否则 HTTPS 下 POST 会 405）
        location = /api/fetch-meta {
            proxy_pass http://127.0.0.1:16720;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
        location = /api/webdav-proxy {
            proxy_pass http://127.0.0.1:16719;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 全网访问统计（scripts/stats-only.cjs，端口 16723）
        # 与上面两个接口同理：每个 server 块都要写，否则对应协议下 POST 会落到静态 location → 405
        location /api/stats/ {
            proxy_pass http://127.0.0.1:16723;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ===== 自建服务器云同步：同源 WebDAV 直连（与 80 块一致，HTTPS 下也必须存在）=====
        # 说明同 80 块。仅同源直连走此通道；第三方云仍走 /api/webdav-proxy。
        location ~ ^/dav/(?<sync_user>[A-Za-z0-9._-]+)/ {
            # 系统账号认证：按 URL 里的用户名加载对应的 per-user 口令文件（天然隔离，说明同 80 块）。
            auth_basic           "Easy Web Tab Sync";
            auth_basic_user_file /etc/nginx/.ewt_sync_htpasswd_$sync_user;

            root                 /var/ewt-sync;
            dav_methods         PUT DELETE MKCOL;
            create_full_put_path on;              # PUT 自动建中间目录（客户端 409 透传依赖此项）
            client_body_temp_path /var/lib/nginx/ewt-tmp;
            autoindex           off;              # 不暴露目录列表
            # 单文件可达数 MB，body 上限已在 http 块全局设为 10m
        }

        # 未带合法用户名段的 /dav/ 一律拒绝（兜底，避免落到 location / 反代到 Node）
        location /dav/ {
            return 403;
        }

        location / {
            proxy_pass http://localhost:16718;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # （可选）确认 https 访问正常后，把上面 80 块整体替换为以下 301 跳转，强制全站 HTTPS：
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name www.codehelp.com.cn;
    #     return 301 https://$host$request_uri;
    # }

}

